<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>75 Phrasal Verbs Collection | SnapEnglish</title>
<link rel="icon" type="image/png" href="ảnh.png">
<!-- Google Fonts: Be Vietnam Pro -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400;1,600&display=swap" rel="stylesheet">
<!-- Font Awesome Icons -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
:root {
  /* Tông màu thương hiệu SnapEnglish */
  --brand-primary: #e65245;
  --brand-gradient: linear-gradient(135deg, #f05a4b 0%, #e0483a 50%, #c83729 100%);
  --brand-peach: #ff8e72;
  --brand-peach-soft: #fff1ed;
  --bg-canvas: #f9f5f2;
  --card-bg: rgba(255, 255, 255, 0.95);
  --card-border: #f0e2dc;
  --text-title: #2d1f1d;
  --text-body: #5a4b48;
  --text-muted: #8d7b77;
  --shadow-sm: 0 4px 12px rgba(230, 82, 69, 0.05);
  --topbar-height: 48px;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-font-smoothing: antialiased;
}

body {
  font-family: 'Be Vietnam Pro', sans-serif;
  background-color: var(--bg-canvas);
  color: var(--text-body);
  line-height: 1.5;
  min-height: 100vh;
  padding-top: calc(var(--topbar-height) + 12px);
  padding-bottom: 40px;
  position: relative;
  background-image:
    radial-gradient(circle at 10% 20%, rgba(255, 142, 114, 0.08) 0%, transparent 40%),
    radial-gradient(circle at 90% 80%, rgba(230, 82, 69, 0.06) 0%, transparent 45%);
  background-attachment: fixed;
}

/* WATERMARK CHÌM */
.bg-watermark {
  position: fixed;
  bottom: 20px;
  right: 30px;
  font-size: 10vw;
  font-weight: 800;
  color: rgba(230, 82, 69, 0.035);
  z-index: -1;
  pointer-events: none;
  user-select: none;
  letter-spacing: -2px;
}

/* TOP NAVBAR */
.top-navbar {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  height: var(--topbar-height);
  background: rgba(255, 255, 255, 0.92);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border-bottom: 1px solid rgba(230, 82, 69, 0.12);
  z-index: 1000;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 4%;
  box-shadow: 0 2px 12px rgba(0, 0, 0, 0.03);
}

.brand-link {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  text-decoration: none;
  transition: transform 0.2s ease;
}

.brand-link:hover {
  transform: translateY(-1px) scale(1.01);
}

.brand-badge {
  background: var(--brand-gradient);
  color: #ffffff;
  font-size: 14px;
  font-weight: 800;
  padding: 5px 14px;
  border-radius: 10px;
  letter-spacing: -0.3px;
  box-shadow: 0 2px 8px rgba(230, 82, 69, 0.25);
  display: flex;
  align-items: center;
  gap: 5px;
}

.brand-badge::before {
  content: '⚡';
  font-size: 12px;
}

.brand-subtitle {
  font-size: 14px;
  font-weight: 700;
  color: var(--text-title);
  display: flex;
  align-items: center;
  gap: 6px;
}

.brand-subtitle::before {
  content: '/';
  color: var(--brand-peach);
  font-weight: 300;
}

.home-btn-nav {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 6px 16px;
  background: var(--brand-peach-soft);
  border: 1px solid rgba(230, 82, 69, 0.15);
  border-radius: 30px;
  text-decoration: none;
  color: var(--brand-primary);
  font-weight: 700;
  font-size: 13px;
  transition: all 0.2s ease;
}

.home-btn-nav:hover {
  background: var(--brand-primary);
  color: #ffffff;
  border-color: var(--brand-primary);
  transform: translateY(-1px);
  box-shadow: 0 4px 12px rgba(230, 82, 69, 0.2);
}

/* CONTAINER GỌN GÀNG */
.container {
  max-width: 960px;
  margin: 0 auto;
  padding: 8px 16px;
}

/* BANNER BÀI HỌC */
.unit-banner {
  text-align: center;
  margin-bottom: 16px;
  padding: 16px 16px;
  background: linear-gradient(180deg, rgba(255, 255, 255, 0.85) 0%, rgba(255, 241, 237, 0.6) 100%);
  border-radius: 20px;
  border: 1px solid rgba(255, 255, 255, 0.9);
  box-shadow: var(--shadow-sm);
}

.unit-badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 4px 12px;
  background: var(--brand-peach-soft);
  color: var(--brand-primary);
  font-weight: 800;
  font-size: 11.5px;
  border-radius: 20px;
  text-transform: uppercase;
  letter-spacing: 0.6px;
  margin-bottom: 6px;
  border: 1px solid rgba(230, 82, 69, 0.15);
}

.unit-title {
  color: var(--text-title);
  font-size: 24px;
  font-weight: 800;
  margin: 2px 0;
  letter-spacing: -0.5px;
}

.unit-subtitle {
  color: var(--text-muted);
  font-size: 14px;
  margin: 0;
  font-weight: 500;
}

/* THANH TÌM KIẾM GỌN GÀNG */
.search-wrapper {
  margin-bottom: 14px;
  display: flex;
  justify-content: center;
}

.search-box {
  position: relative;
  width: 100%;
  max-width: 420px;
}

.search-box i {
  position: absolute;
  left: 16px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--brand-primary);
  font-size: 14px;
}

.search-box input {
  width: 100%;
  padding: 10px 16px 10px 42px;
  border-radius: 40px;
  border: 1.5px solid var(--card-border);
  font-family: inherit;
  font-size: 14px;
  font-weight: 600;
  background: rgba(255, 255, 255, 0.95);
  color: var(--text-title);
  outline: none;
  transition: all 0.25s ease;
  box-shadow: 0 2px 8px rgba(0, 0, 0, 0.02);
}

.search-box input:focus {
  border-color: var(--brand-primary);
  box-shadow: 0 4px 14px rgba(230, 82, 69, 0.18);
  background: #ffffff;
}

.count-info {
  font-size: 12.5px;
  font-weight: 700;
  color: var(--text-muted);
  text-align: right;
  margin-bottom: 10px;
  padding-right: 4px;
}

/* LƯỚI THẺ TỪ VỰNG */
.grid-buttons {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
  gap: 10px;
  padding-bottom: 16px;
}

.test-item {
  padding: 10px 8px;
  border-radius: 14px;
  cursor: pointer;
  font-weight: 700;
  text-align: center;
  transition: all 0.25s cubic-bezier(0.25, 0.8, 0.25, 1);
  background: var(--card-bg);
  box-shadow: 0 2px 8px rgba(0, 0, 0, 0.03);
  border: 1.5px solid var(--card-border);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  position: relative;
  overflow: hidden;
}

.test-item .number {
  font-size: 11px;
  font-weight: 800;
  margin-bottom: 4px;
  padding: 2px 8px;
  border-radius: 8px;
  line-height: 1;
}

.test-item .word {
  font-size: 15px;
  font-weight: 800;
  color: var(--text-title);
  letter-spacing: -0.2px;
}

.test-item:hover {
  transform: translateY(-3px) scale(1.02);
  box-shadow: 0 8px 18px rgba(0, 0, 0, 0.08);
}

/* FOOTER */
.footer {
  text-align: center;
  margin-top: 16px;
  font-size: 13px;
  font-weight: 600;
  color: var(--text-muted);
}

@media (max-width: 600px) {
  .grid-buttons {
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
  }
  .unit-title { font-size: 20px; }
  .test-item .word { font-size: 13.5px; }
  .brand-subtitle { display: none; }
  .top-navbar { padding: 0 3%; }
}
@media (max-width: 400px) {
  .grid-buttons {
    grid-template-columns: repeat(2, 1fr);
  }
}
</style>
</head>
<body>

<!-- WATERMARK CHÌM -->
<div class="bg-watermark">SnapEnglish</div>

<!-- TOP NAVBAR -->
<nav class="top-navbar">
  <a href="index.html" class="brand-link" title="Trở về Trang Chủ">
    <div class="brand-badge">SnapEnglish</div>
    <div class="brand-subtitle">Phrasal Verbs</div>
  </a>
  <a href="index.html" class="home-btn-nav">
    <i class="fa-solid fa-house"></i>
    <span>Trang Chủ</span>
  </a>
</nav>

<div class="container">
  <!-- BANNER BÀI HỌC -->
  <div class="unit-banner">
    <div class="unit-badge">
      <i class="fa-solid fa-graduation-cap"></i> 75 PHRASAL VERBS COLLECTION
    </div>
    <h1 class="unit-title">75 Phrasal Verbs Collection</h1>
    <p class="unit-subtitle">Bộ cụm động từ thông dụng nhất trong bài thi & giao tiếp Tiếng Anh</p>
  </div>

  <!-- THANH TÌM KIẾM -->
  <div class="search-wrapper">
    <div class="search-box">
      <i class="fa-solid fa-magnifying-glass"></i>
      <input type="text" id="searchInput" placeholder="Tìm kiếm cụm động từ (vd: Run, Go, Take...)" onkeyup="filterVerbs()">
    </div>
  </div>

  <div class="count-info" id="countInfo">Hiển thị 75 / 75 cụm động từ</div>

  <!-- LƯỚI THẺ BÀI HỌC -->
  <div class="grid-buttons" id="verbList"></div>

  <div class="footer">Keep fighting! 💪 • SnapEnglish Collection</div>
</div>

<script>
// Danh sách 75 cụm động từ
const verbs = [
  "ACCOUNT", "ACT", "AGREE", "ASK", "BACK",
  "BANG", "BEAR", "BEAT", "BLOW", "BREAK",
  "BRICK", "BRING", "BUILD", "BUMP", "BURN",
  "CATCH", "CALL", "CARRY", "CLEAR", "CHANGE",
  "CHECK", "CLOSE", "COUNT", "COME", "CRY",
  "CUT", "DIE", "DO", "DRAW", "DRIVE",
  "DROP", "EAT", "FACE", "FALL", "FILL",
  "GET", "GIVE", "GO", "GROW", "HAND",
  "HANG", "HAVE", "HEAD", "HEAR", "HOLD",
  "KEEP", "KNOCK", "LAY", "LEAVE", "LET",
  "LEVEL", "LIE", "LIVE", "LOOK", "MAKE",
  "PASS", "PAY", "PICK", "PLAY", "PULL",
  "PUSH", "PUT", "RUN", "SEE", "SET",
  "SHOW", "STAND", "STAY", "TAKE", "TALK",
  "TELL", "THINK", "THROW", "TURN", "WEAR"
];

// Bảng màu sắc sinh động & phong phú cho các thẻ bài học
const themeColors = [
  { borderTop: '#e65245', numBg: '#fff1ed', numColor: '#e65245', hoverBorder: '#e65245' }, // Red/Peach
  { borderTop: '#059669', numBg: '#ecfdf5', numColor: '#059669', hoverBorder: '#10b981' }, // Emerald Green
  { borderTop: '#2563eb', numBg: '#eff6ff', numColor: '#2563eb', hoverBorder: '#3b82f6' }, // Royal Blue
  { borderTop: '#d97706', numBg: '#fffbe3', numColor: '#d97706', hoverBorder: '#f59e0b' }, // Amber/Gold
  { borderTop: '#7c3aed', numBg: '#f5f3ff', numColor: '#7c3aed', hoverBorder: '#8b5cf6' }, // Purple
  { borderTop: '#db2777', numBg: '#fdf2f8', numColor: '#db2777', hoverBorder: '#ec4899' }, // Pink/Rose
  { borderTop: '#0891b2', numBg: '#f0fdfa', numColor: '#0891b2', hoverBorder: '#14b8a6' }, // Cyan/Teal
  { borderTop: '#ea580c', numBg: '#fff7ed', numColor: '#ea580c', hoverBorder: '#f97316' }  // Orange
];

const listContainer = document.getElementById('verbList');
const countInfo = document.getElementById('countInfo');

// Hàm hiển thị danh sách
function renderList(items) {
  listContainer.innerHTML = "";
  countInfo.innerText = `Hiển thị ${items.length} / ${verbs.length} cụm động từ`;

  items.forEach((verb) => {
    const realIndex = verbs.indexOf(verb) + 1;
    const theme = themeColors[(realIndex - 1) % themeColors.length];
    
    const div = document.createElement('div');
    div.className = 'test-item';
    div.style.borderTop = `3.5px solid ${theme.borderTop}`;
    
    div.innerHTML = `
      <span class="number" style="background: ${theme.numBg}; color: ${theme.numColor};">#${realIndex}</span>
      <span class="word">${verb}</span>
    `;

    // Hiệu ứng Hover đổi màu viền tương ứng
    div.onmouseenter = function() {
      div.style.borderColor = theme.hoverBorder;
    };
    div.onmouseleave = function() {
      div.style.borderColor = "var(--card-border)";
      div.style.borderTopColor = theme.borderTop;
    };

    div.onclick = function() {
      goToTest(realIndex, verb);
    };

    listContainer.appendChild(div);
  });
}

// Render danh sách lần đầu
renderList(verbs);

// Hàm tìm kiếm
function filterVerbs() {
  const input = document.getElementById('searchInput').value.trim().toUpperCase();
  const filtered = verbs.filter(verb => verb.includes(input));
  renderList(filtered);
}

// Chuyển trang bài học
function goToTest(index, verbName) {
  const fileName = `cumdongtu-${index}.${verbName.toLowerCase()}.html`;
  window.location.href = fileName;
}
</script>
</body>
</html>
