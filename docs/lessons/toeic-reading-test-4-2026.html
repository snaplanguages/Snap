  "q": "We would like to attend the retreat, but ______ we are unavailable on that date.",
  "options": [
    "regrettably",
    "scarcely",
    "exceptionally",
    "annually"
  ],
  "a": "regrettably",
  "exp": {
    "correct": "<div style='line-height: 1.6;'><p><strong>a. Phân tích thành phần câu (Hai mệnh đề đối lập):</strong></p><ul><li><strong>Mệnh đề 1 (Ý định):</strong> <code>We (S) + would like (V) + to attend the retreat (O)</code></li><li><strong>Mệnh đề 2 (Thực tế):</strong> <code>but (Liên từ) + regrettably (Sentence Adv) + we (S) + are (V) + unavailable (Adj) + on that date (Trạng ngữ)</code></li></ul><p><strong>b. Xác định loại từ & Ngữ cảnh:</strong> Sau liên từ <i>but</i> là một mệnh đề hoàn chỉnh (<i>we are unavailable...</i>). Chỗ trống cần một <span style='color: #2e7d32; font-weight: bold;'>Trạng từ bổ nghĩa cho cả mệnh đề (Sentence Adverb)</span> để diễn tả thái độ, cảm xúc của người nói đối với toàn bộ thông tin phía sau.</p><p><strong>c. Lý do chọn đáp án:</strong> Trạng từ <span style='color: #2e7d32; font-weight: bold;'>regrettably</span> mang nghĩa là <i>thật đáng tiếc là / rất tiếc là</i>, thể hiện thái độ tiếc nuối khi phải từ chối lời mời, tạo thành câu từ chối vô cùng trang trọng và lịch sự trong giao tiếp thương mại.</p></div>",
    "wrong": "<ul style='line-height: 1.6; list-style-type: none; padding-left: 0;'><li><strong style='color: #c62828;'>❌ (B) scarcely (adv):</strong> Hầu như không, hiếm khi (= hardly). Không dùng đứng đầu mệnh đề để diễn tả cảm xúc tiếc nuối.</li><li><strong style='color: #c62828;'>❌ (C) exceptionally (adv):</strong> Một cách đặc biệt, xuất chúng, ngoại lệ (thường đi với tính từ: <i>exceptionally talented</i>). Sai hoàn toàn ngữ nghĩa.</li><li><strong style='color: #c62828;'>❌ (D) annually (adv):</strong> Hằng năm (thường bổ nghĩa cho động từ: <i>occur annually</i>). Không phù hợp ngữ cảnh từ chối lời mời.</li></ul>",
    "grammar": "<div style='line-height: 1.6;'><p><strong>⭐ Trạng từ bổ nghĩa cho Mệnh đề (Sentence Adverbs) & Văn phong Lịch sự trong TOEIC</strong></p><p>Trạng từ chỉ thái độ (Sentence Adverb) đứng đầu mệnh đề để thể hiện cảm xúc hoặc đánh giá của người nói đối với toàn bộ hành động/sự việc được nhắc đến:</p><blockquote style='background: #f5f5f5; border-left: 4px solid #2e7d32; margin: 10px 0; padding: 10px;'><strong>Clause 1 + but + Sentence Adverb + Clause 2</strong></blockquote><p><strong>💡 Các Trạng từ bổ nghĩa cả mệnh đề hay gặp trong thư từ/email công việc:</strong></p><table border='1' style='width: 100%; border-collapse: collapse; border-color: #e0e0e0; margin-top: 8px; font-size: 14px;'><thead style='background-color: #f5f5f5; text-align: left;'><tr><th style='padding: 8px;'>Trạng từ</th><th style='padding: 8px;'>Ý nghĩa</th><th style='padding: 8px;'>Sắc thái / Ngữ cảnh</th></tr></thead><tbody><tr><td style='padding: 8px;'><strong style='color: #2e7d32;'>regrettably / unfortunately</strong></td><td style='padding: 8px;'>Thật đáng tiếc là...</td><td style='padding: 8px;'>Từ chối lời mời, báo tin hoãn/hủy</td></tr><tr><td style='padding: 8px;'><strong style='color: #0288d1;'>fortunately / thankfully</strong></td><td style='padding: 8px;'>Thật may mắn là...</td><td style='padding: 8px;'>Báo tin tốt, sự cố đã giải quyết</td></tr><tr><td style='padding: 8px;'><strong style='color: #0288d1;'>admittedly / frankly</strong></td><td style='padding: 8px;'>Phải thừa nhận là...</td><td style='padding: 8px;'>Thừa nhận hạn chế, nói thẳng</td></tr></tbody></table><br/><p><strong>⚠️ Phân tích 4 phương án Trạng từ theo Ngữ cảnh:</strong></p><table border='1' style='width: 100%; border-collapse: collapse; border-color: #e0e0e0; margin-top: 8px; font-size: 13px;'><thead style='background-color: #f5f5f5;'><tr><th style='padding: 6px;'>Đáp án</th><th style='padding: 6px;'>Từ loại</th><th style='padding: 6px;'>Khả năng làm Sentence Adverb</th><th style='padding: 6px;'>Đánh giá</th></tr></thead><tbody><tr><td style='padding: 6px;'><strong>A. regrettably</strong></td><td style='padding: 6px;'>Adverb</td><td style='padding: 6px;'>Hoàn toàn phù hợp (Chỉ sự tiếc nuối)</td><td style='padding: 6px; color: #2e7d32; font-weight: bold;'>✅ Đúng</td></tr><tr><td style='padding: 6px;'><strong>B. scarcely</strong></td><td style='padding: 6px;'>Adverb</td><td style='padding: 6px;'>Không phù hợp (Chỉ mức độ/tần suất)</td><td style='padding: 6px; color: #c62828; font-weight: bold;'>❌ Sai nghĩa</td></tr><tr><td style='padding: 6px;'><strong>C. exceptionally</strong></td><td style='padding: 6px;'>Adverb</td><td style='padding: 6px;'>Không phù hợp (Chỉ mức độ vượt trội)</td><td style='padding: 6px; color: #c62828; font-weight: bold;'>❌ Sai nghĩa</td></tr><tr><td style='padding: 6px;'><strong>D. annually</strong></td><td style='padding: 6px;'>Adverb</td><td style='padding: 6px;'>Không phù hợp (Chỉ tần suất hằng năm)</td><td style='padding: 6px; color: #c62828; font-weight: bold;'>❌ Sai nghĩa</td></tr></tbody></table><br/><p><strong>🎯 Bẫy TOEIC & Mẹo làm nhanh:</strong></p><ul><li><strong>Mẹo nhận diện:</strong> Khi thấy hai mệnh đề nối bởi <i>but</i>, trong đó mệnh đề sau đưa ra lý do không thể thực hiện (<i>unavailable, canceled, delayed</i>), hãy ưu tiên các trạng từ mang sắc thái tiếc nuối như <strong>regrettably</strong> hoặc <strong>unfortunately</strong>.</li><li><strong>Cặp từ đồng nghĩa:</strong> Trong email doanh nghiệp, <i>regrettably</i> và <i>unfortunately</i> có thể thay thế cho nhau khi mở đầu một thông báo từ chối lịch sự.</li></ul></div>",
    "vocab": "<ul style='line-height: 1.6;'><li><strong style='color: #0288d1;'>regrettably</strong> (adv): thật đáng tiếc là, rất tiếc là.</li><li><strong style='color: #0288d1;'>company retreat</strong> (n phr): chuyến nghỉ dưỡng / dã ngoại của công ty.</li><li><strong style='color: #0288d1;'>be unavailable on that date</strong> (v phr): bận / không rảnh vào ngày đó.</li><li><strong style='color: #0288d1;'>would like to do sth</strong> (v phr): mong muốn làm điều gì.</li></ul>",
    "trans": "<div style='line-height: 1.6; padding: 8px; background-color: #f9f9f9; border-left: 4px solid #0288d1;'><p style='margin: 0 0 8px 0;'><strong>Dịch nghĩa gốc:</strong> Chúng tôi muốn tham dự chuyến nghỉ dưỡng, nhưng thật đáng tiếc là chúng tôi lại không rảnh vào ngày đó.</p><p style='margin: 0; font-style: italic; color: #555;'><strong>Dịch tự nhiên:</strong> Chúng tôi rất muốn tham dự chuyến dã ngoại của công ty, nhưng rất tiếc là chúng tôi lại bận vào ngày hôm đó.</p></div>"
  }
},
        {
  "id": 125,
  "q": "In celebration of Ms. Tseng’s promotion, tea and cookies will be served ______ the meeting.",
  "options": [
    "later",
    "as soon as",
    "following",
    "in case of"
  ],
  "a": "following",
  "exp": {
    "correct": "<div style='line-height: 1.6;'><p><strong>a. Phân tích thành phần câu (Trạng ngữ & Mệnh đề chính):</strong></p><ul><li><strong>Trạng ngữ chỉ mục đích/lý do:</strong> <code>In celebration of Ms. Tseng’s promotion (Cụm Giới từ)</code></li><li><strong>Mệnh đề chính (Bị động):</strong> <code>tea and cookies (S) + will be served (V - Future Passive) + following the meeting (Trạng ngữ thời gian)</code></li></ul><p><strong>b. Xác định loại từ & Ngữ cảnh:</strong> Chỗ trống đứng trực tiếp trước cụm danh từ (<i>the meeting</i>). Yêu cầu một <span style='color: #2e7d32; font-weight: bold;'>Giới từ (Preposition)</span> chỉ thời gian đứng trước Danh từ/Sự kiện. Về ngữ cảnh, trà và bánh quy được phục vụ diễn ra sau khi cuộc họp kết thúc.</p><p><strong>c. Lý do chọn đáp án:</strong> Giới từ <span style='color: #2e7d32; font-weight: bold;'>following</span> mang nghĩa là <i>sau, tiếp theo</i> (= <i>after</i>), tạo thành kết hợp từ (collocation) phổ biến trong TOEIC: <i>following the meeting</i>.</p></div>",
    "wrong": "<ul style='line-height: 1.6; list-style-type: none; padding-left: 0;'><li><strong style='color: #c62828;'>❌ (A) later (adv):</strong> Sau đó (Là trạng từ, không đứng trực tiếp trước cụm danh từ để làm giới từ).</li><li><strong style='color: #c62828;'>❌ (B) as soon as (conj):</strong> Ngay khi (Là liên từ, bắt buộc đi kèm mệnh đề S + V: <i>as soon as the meeting ends</i>).</li><li><strong style='color: #c62828;'>❌ (D) in case of (prep):</strong> Phòng khi, trong trường hợp (Chỉ điều kiện/dự phòng: <i>in case of emergency</i>). Sai cả ngữ cảnh lẫn cấu trúc.</li></ul>",
    "grammar": "<div style='line-height: 1.6;'><p><strong>⭐ Giới từ thời gian & Phân biệt Giới từ / Liên từ / Trạng từ trong TOEIC</strong></p><p>Vị trí đứng trước danh từ chỉ sự kiện yêu cầu một Giới từ:</p><blockquote style='background: #f5f5f5; border-left: 4px solid #2e7d32; margin: 10px 0; padding: 10px;'><strong>Following + Noun (sự kiện) = After + Noun</strong></blockquote><p><strong>💡 Phân biệt cấu trúc ngữ pháp giữa các phương án:</strong></p><table border='1' style='width: 100%; border-collapse: collapse; border-color: #e0e0e0; margin-top: 8px; font-size: 14px;'><thead style='background-color: #f5f5f5; text-align: left;'><tr><th style='padding: 8px;'>Từ loại</th><th style='padding: 8px;'>Từ tượng trưng</th><th style='padding: 8px;'>Cấu trúc theo sau</th></tr></thead><tbody><tr><td style='padding: 8px;'><strong style='color: #2e7d32;'>Giới từ (Prep)</strong></td><td style='padding: 8px;'><i>following, after</i></td><td style='padding: 8px;'>+ Cụm Danh từ (<i>following the meeting</i>)</td></tr><tr><td style='padding: 8px;'><strong style='color: #0288d1;'>Liên từ (Conj)</strong></td><td style='padding: 8px;'><i>as soon as, after</i></td><td style='padding: 8px;'>+ Mệnh đề S + V (<i>as soon as the meeting ends</i>)</td></tr><tr><td style='padding: 8px;'><strong style='color: #0288d1;'>Trạng từ (Adv)</strong></td><td style='padding: 8px;'><i>later, afterwards</i></td><td style='padding: 8px;'>Đứng độc lập hoặc cuối câu (không + N)</td></tr></tbody></table><br/><p><strong>⚠️ Phân tích 4 phương án theo ngữ cảnh & Ngữ pháp:</strong></p><table border='1' style='width: 100%; border-collapse: collapse; border-color: #e0e0e0; margin-top: 8px; font-size: 13px;'><thead style='background-color: #f5f5f5;'><tr><th style='padding: 6px;'>Đáp án</th><th style='padding: 6px;'>Loại từ</th><th style='padding: 6px;'>Khả năng đi với \"the meeting\"</th><th style='padding: 6px;'>Đánh giá</th></tr></thead><tbody><tr><td style='padding: 6px;'><strong>A. later</strong></td><td style='padding: 6px;'>Trạng từ (adv)</td><td style='padding: 6px;'>Không thể đứng trực tiếp trước N</td><td style='padding: 6px; color: #c62828; font-weight: bold;'>❌ Sai</td></tr><tr><td style='padding: 6px;'><strong>B. as soon as</strong></td><td style='padding: 6px;'>Liên từ (conj)</td><td style='padding: 6px;'>Thiếu động từ (cần S + V)</td><td style='padding: 6px; color: #c62828; font-weight: bold;'>❌ Sai</td></tr><tr><td style='padding: 6px;'><strong>C. following</strong></td><td style='padding: 6px;'>Giới từ (prep)</td><td style='padding: 6px;'>Hoàn toàn phù hợp (= After + N)</td><td style='padding: 6px; color: #2e7d32; font-weight: bold;'>✅ Đúng</td></tr><tr><td style='padding: 6px;'><strong>D. in case of</strong></td><td style='padding: 6px;'>Cụm giới từ (prep)</td><td style='padding: 6px;'>Không phù hợp ngữ cảnh thời gian</td><td style='padding: 6px; color: #c62828; font-weight: bold;'>❌ Sai</td></tr></tbody></table></div>",
    "vocab": "<ul style='line-height: 1.6;'><li><strong style='color: #0288d1;'>following</strong> (prep): sau, tiếp theo (= after).</li><li><strong style='color: #0288d1;'>in celebration of</strong> (prep phr): để ăn mừng, nhân dịp kỷ niệm.</li><li><strong style='color: #0288d1;'>promotion</strong> (n): sự thăng chức.</li><li><strong style='color: #0288d1;'>serve refreshments</strong> (v phr): phục vụ đồ ăn nhẹ/thức uống.</li><li><strong style='color: #0288d1;'>in case of emergency</strong> (prep phr): trong trường hợp khẩn cấp.</li></ul>",
    "trans": "<div style='line-height: 1.6; padding: 8px; background-color: #f9f9f9; border-left: 4px solid #0288d1;'><p style='margin: 0 0 8px 0;'><strong>Dịch nghĩa gốc:</strong> Để ăn mừng việc thăng chức của bà Tseng, trà và bánh quy sẽ được phục vụ sau cuộc họp.</p><p style='margin: 0; font-style: italic; color: #555;'><strong>Dịch tự nhiên:</strong> Nhân dịp chúc mừng bà Tseng được thăng chức, tiệc trà và bánh quy sẽ được phục vụ ngay sau khi cuộc họp kết thúc.</p></div>"
  }
},
        {
  "id": 126,
  "q": "Beginning next month, all employees at Sartson Analytics will have the ______ of working from home two days per week.",
  "options": [
    "place",
    "combination",
    "range",
    "option"
  ],
  "a": "option",
  "exp": {
    "correct": "<div style='line-height: 1.6;'><p><strong>a. Phân tích thành phần câu (S-V-O):</strong></p><ul><li><strong>Trạng ngữ thời gian:</strong> <code>Beginning next month (Cụm phân từ)</code></li><li><strong>Mệnh đề chính:</strong> <code>all employees at Sartson Analytics (S) + will have (V) + the option of working from home two days per week (O)</code></li></ul><p><strong>b. Xác định loại từ & Ngữ cảnh:</strong> Chỗ trống đứng sau mạo từ <i>the</i> và trước giới từ <i>of</i>, cần một <span style='color: #2e7d32; font-weight: bold;'>Danh từ (Noun)</span>. Do cả 4 đáp án đều là danh từ, ta xét ngữ cảnh: câu diễn tả chính sách nhân sự cho phép nhân viên có \"quyền lựa chọn\" làm việc tại nhà.</p><p><strong>c. Lý do chọn đáp án:</strong> Danh từ <span style='color: #2e7d32; font-weight: bold;'>option</span> mang nghĩa là <i>sự lựa chọn, quyền lựa chọn</i>, tạo thành cụm cố định (collocation) cực kỳ phổ biến trong TOEIC: <i>have the option of + V-ing</i>.</p></div>",
    "wrong": "<ul style='line-height: 1.6; list-style-type: none; padding-left: 0;'><li><strong style='color: #c62828;'>❌ (A) place (n):</strong> Nơi chốn, địa điểm. Không ghép thành cụm <i>have the place of V-ing</i> trong ngữ cảnh này.</li><li><strong style='color: #c62828;'>❌ (B) combination (n):</strong> Sự kết hợp (Thường đi với: <i>combination of A and B</i>). Sai nghĩa và cấu trúc.</li><li><strong style='color: #c62828;'>❌ (C) range (n):</strong> Phạm vi, dải, nhiều loại (Thường đi với: <i>a wide range of + N số nhiều</i>). Không đi với <i>have the range of V-ing</i>.</li></ul>",
    "grammar": "<div style='line-height: 1.6;'><p><strong>⭐ Collocation & Cấu trúc Danh từ chỉ Sự lựa chọn trong TOEIC</strong></p><p>Để diễn tả việc ai đó có quyền chọn lựa làm hành động gì, TOEIC rất hay sử dụng cấu trúc:</p><blockquote style='background: #f5f5f5; border-left: 4px solid #2e7d32; margin: 10px 0; padding: 10px;'><strong>Have the option of + V-ing</strong> (Có quyền/sự lựa chọn làm việc gì)</blockquote><p><strong>💡 Phân biệt các Collocation chứa Danh từ + \"of\" trong Part 5:</strong></p><table border='1' style='width: 100%; border-collapse: collapse; border-color: #e0e0e0; margin-top: 8px; font-size: 14px;'><thead style='background-color: #f5f5f5; text-align: left;'><tr><th style='padding: 8px;'>Danh từ</th><th style='padding: 8px;'>Ý nghĩa</th><th style='padding: 8px;'>Cấu trúc / Collocation phổ biến</th></tr></thead><tbody><tr><td style='padding: 8px;'><strong style='color: #2e7d32;'>option</strong></td><td style='padding: 8px;'>Lựa chọn</td><td style='padding: 8px;'><i>have the option of V-ing / option to V</i></td></tr><tr><td style='padding: 8px;'><strong style='color: #0288d1;'>range</strong></td><td style='padding: 8px;'>Phạm vi, đa dạng</td><td style='padding: 8px;'><i>a wide range of + Danh từ số nhiều</i></td></tr><tr><td style='padding: 8px;'><strong style='color: #0288d1;'>combination</strong></td><td style='padding: 8px;'>Sự kết hợp</td><td style='padding: 8px;'><i>a combination of + Danh từ/Tính từ</i></td></tr></tbody></table><br/><p><strong>⚠️ Phân tích 4 phương án Danh từ theo ngữ cảnh & Collocation:</strong></p><table border='1' style='width: 100%; border-collapse: collapse; border-color: #e0e0e0; margin-top: 8px; font-size: 13px;'><thead style='background-color: #f5f5f5;'><tr><th style='padding: 6px;'>Đáp án</th><th style='padding: 6px;'>Ý nghĩa</th><th style='padding: 6px;'>Khả năng ghép với \"have the ... of V-ing\"</th><th style='padding: 6px;'>Đánh giá</th></tr></thead><tbody><tr><td style='padding: 6px;'><strong>A. place</strong></td><td style='padding: 6px;'>Nơi chốn</td><td style='padding: 6px;'>Không tự nhiên (Không đúng cấu trúc)</td><td style='padding: 6px; color: #c62828; font-weight: bold;'>❌ Sai</td></tr><tr><td style='padding: 6px;'><strong>B. combination</strong></td><td style='padding: 6px;'>Sự kết hợp</td><td style='padding: 6px;'>Sai nghĩa (Không chỉ quyền chọn)</td><td style='padding: 6px; color: #c62828; font-weight: bold;'>❌ Sai</td></tr><tr><td style='padding: 6px;'><strong>C. range</strong></td><td style='padding: 6px;'>Phạm vi, chuỗi</td><td style='padding: 6px;'>Sai cấu trúc (Thường là <i>a range of + N</i>)</td><td style='padding: 6px; color: #c62828; font-weight: bold;'>❌ Sai</td></tr><tr><td style='padding: 6px;'><strong>D. option</strong></td><td style='padding: 6px;'>Quyền lựa chọn</td><td style='padding: 6px;'>Hoàn toàn phù hợp (Đúng Collocation)</td><td style='padding: 6px; color: #2e7d32; font-weight: bold;'>✅ Đúng</td></tr></tbody></table></div>",
    "vocab": "<ul style='line-height: 1.6;'><li><strong style='color: #0288d1;'>have the option of + V-ing</strong> (v phr): có quyền/sự lựa chọn làm gì.</li><li><strong style='color: #0288d1;'>beginning + mốc thời gian</strong> (prep phr): bắt đầu từ...</li><li><strong style='color: #0288d1;'>work from home (WFH)</strong> (v phr): làm việc tại nhà.</li><li><strong style='color: #0288d1;'>work remotely</strong> (v phr): làm việc từ xa.</li><li><strong style='color: #0288d1;'>a wide range of</strong> (n phr): đa dạng, nhiều loại...</li></ul>",
    "trans": "<div style='line-height: 1.6; padding: 8px; background-color: #f9f9f9; border-left: 4px solid #0288d1;'><p style='margin: 0 0 8px 0;'><strong>Dịch nghĩa gốc:</strong> Bắt đầu từ tháng tới, tất cả nhân viên tại Sartson Analytics sẽ có quyền lựa chọn làm việc tại nhà hai ngày mỗi tuần.</p><p style='margin: 0; font-style: italic; color: #555;'><strong>Dịch tự nhiên:</strong> Kể từ tháng sau, toàn bộ nhân viên tại Sartson Analytics sẽ được tùy chọn làm việc tại nhà 2 ngày một tuần.</p></div>"
  }
},
        {
  "id": 127,
  "q": "The accounting department’s new policy outlines the ______ process for the procurement of office equipment.",
  "options": [
    "preferring",
    "preferably",
    "preferred",
    "preferability"
  ],
  "a": "preferred",
  "exp": {
    "correct": "<div style='line-height: 1.6;'><p><strong>a. Phân tích thành phần câu (S-V-O):</strong></p><ul><li><strong>Mệnh đề chính:</strong> <code>The accounting department’s new policy (S) + outlines (V) + the preferred process for the procurement of office equipment (O)</code></li><li><strong>Cụm danh từ tân ngữ:</strong> <code>the (Mạo từ) + preferred (Adj/V-ed) + process (N)</code></li></ul><p><strong>b. Xác định loại từ & Ngữ cảnh:</strong> Chỗ trống nằm giữa mạo từ <i>the</i> và danh từ <i>process</i>, yêu cầu một <span style='color: #2e7d32; font-weight: bold;'>Tính từ (Adjective)</span> bổ nghĩa cho danh từ quy trình. Quy trình này mang bản chất bị động (được ưu tiên/khuyến khích sử dụng bởi công ty), nên ta chọn phân từ dạng <i>V-ed</i>.</p><p><strong>c. Lý do chọn đáp án:</strong> Tính từ phân từ <span style='color: #2e7d32; font-weight: bold;'>preferred</span> mang nghĩa là <i>được ưu tiên, được khuyên dùng</i>, tạo thành kết hợp từ (collocation) vô cùng phổ biến trong doanh nghiệp: <i>preferred process</i>.</p></div>",
    "wrong": "<ul style='line-height: 1.6; list-style-type: none; padding-left: 0;'><li><strong style='color: #c62828;'>❌ (A) preferring (v-ing):</strong> Đang ưu tiên, mang nghĩa chủ động. Quy trình không thể tự thực hiện hành động ưu tiên.</li><li><strong style='color: #c62828;'>❌ (B) preferably (adv):</strong> Tốt nhất là (Trạng từ không đứng trực tiếp bổ nghĩa cho Danh từ <i>process</i>).</li><li><strong style='color: #c62828;'>❌ (D) preferability (n):</strong> Tính ưu tiên, mức độ được ưa thích (Hai danh từ đứng cạnh nhau không tạo thành cụm danh từ hợp logic).</li></ul>",
    "grammar": "<div style='line-height: 1.6;'><p><strong>⭐ Quá khứ phân từ (V-ed) làm Tính từ & Collocations trong TOEIC</strong></p><p>Khi muốn diễn tả đặc tính \"được/bị\" tác động của một vật hoặc quy trình, ta dùng quá khứ phân từ làm tính từ đứng trước danh từ:</p><blockquote style='background: #f5f5f5; border-left: 4px solid #2e7d32; margin: 10px 0; padding: 10px;'><strong>Article + V-ed (Tính từ bị động) + Noun</strong></blockquote><p><strong>💡 Các Tính từ dạng V-ed đi với Danh từ cực kỳ hay gặp trong Part 5:</strong></p><table border='1' style='width: 100%; border-collapse: collapse; border-color: #e0e0e0; margin-top: 8px; font-size: 14px;'><thead style='background-color: #f5f5f5; text-align: left;'><tr><th style='padding: 8px;'>Tính từ V-ed</th><th style='padding: 8px;'>Ý nghĩa</th><th style='padding: 8px;'>Cụm danh từ phổ biến (Collocations)</th></tr></thead><tbody><tr><td style='padding: 8px;'><strong style='color: #2e7d32;'>preferred</strong></td><td style='padding: 8px;'>Được ưu tiên</td><td style='padding: 8px;'><i>preferred process / method / vendor</i></td></tr><tr><td style='padding: 8px;'><strong style='color: #0288d1;'>approved</strong></td><td style='padding: 8px;'>Được phê duyệt</td><td style='padding: 8px;'><i>approved budget / plan / vendor</i></td></tr><tr><td style='padding: 8px;'><strong style='color: #0288d1;'>required</strong></td><td style='padding: 8px;'>Được yêu cầu, bắt buộc</td><td style='padding: 8px;'><i>required documents / skills / qualifications</i></td></tr></tbody></table><br/><p><strong>⚠️ Phân tích 4 phương án Từ loại theo vị trí & Cấu trúc:</strong></p><table border='1' style='width: 100%; border-collapse: collapse; border-color: #e0e0e0; margin-top: 8px; font-size: 13px;'><thead style='background-color: #f5f5f5;'><tr><th style='padding: 6px;'>Đáp án</th><th style='padding: 6px;'>Từ loại</th><th style='padding: 6px;'>Khả năng đứng trước \"process\"</th><th style='padding: 6px;'>Đánh giá</th></tr></thead><tbody><tr><td style='padding: 6px;'><strong>A. preferring</strong></td><td style='padding: 6px;'>Phân từ (V-ing)</td><td style='padding: 6px;'>Sai nghĩa (Mang tính chủ động)</td><td style='padding: 6px; color: #c62828; font-weight: bold;'>❌ Sai</td></tr><tr><td style='padding: 6px;'><strong>B. preferably</strong></td><td style='padding: 6px;'>Trạng từ (adv)</td><td style='padding: 6px;'>Sai từ loại (Không bổ nghĩa cho N)</td><td style='padding: 6px; color: #c62828; font-weight: bold;'>❌ Sai</td></tr><tr><td style='padding: 6px;'><strong>C. preferred</strong></td><td style='padding: 6px;'>Tính từ (V-ed)</td><td style='padding: 6px;'>Hoàn toàn phù hợp (Được ưu tiên)</td><td style='padding: 6px; color: #2e7d32; font-weight: bold;'>✅ Đúng</td></tr><tr><td style='padding: 6px;'><strong>D. preferability</strong></td><td style='padding: 6px;'>Danh từ (n)</td><td style='padding: 6px;'>Không hợp nghĩa (Ghép danh từ sai)</td><td style='padding: 6px; color: #c62828; font-weight: bold;'>❌ Sai</td></tr></tbody></table></div>",
    "vocab": "<ul style='line-height: 1.6;'><li><strong style='color: #0288d1;'>preferred process</strong> (n phr): quy trình được ưu tiên.</li><li><strong style='color: #0288d1;'>procurement</strong> (n): sự thu mua, việc mua sắm thiết bị.</li><li><strong style='color: #0288d1;'>outline</strong> (v): nêu rõ, vạch ra, quy định tóm tắt.</li><li><strong style='color: #0288d1;'>preferred vendor / supplier</strong> (n phr): nhà cung cấp được ưu tiên chọn lựa.</li><li><strong style='color: #0288d1;'>office equipment</strong> (n phr): thiết bị văn phòng.</li></ul>",
    "trans": "<div style='line-height: 1.6; padding: 8px; background-color: #f9f9f9; border-left: 4px solid #0288d1;'><p style='margin: 0 0 8px 0;'><strong>Dịch nghĩa gốc:</strong> Chính sách mới của phòng kế toán nêu rõ quy trình được ưu tiên cho việc thu mua thiết bị văn phòng.</p><p style='margin: 0; font-style: italic; color: #555;'><strong>Dịch tự nhiên:</strong> Quy định mới từ bộ phận kế toán đưa ra quy trình chuẩn được ưu tiên áp dụng khi mua sắm các trang thiết bị văn phòng.</p></div>"
  }
},
        {
  "id": 128,
  "q": "All documents ______ to the company merger will become available to the public within one year.",
  "options": [
    "assigning",
    "facilitating",
    "pertaining",
    "embarking"
  ],
  "a": "pertaining",
  "exp": {
    "correct": "<div style='line-height: 1.6;'><p><strong>a. Phân tích thành phần câu (S-V-C):</strong></p><ul><li><strong>Chủ ngữ (S) chứa MĐQH rút gọn:</strong> <code>All documents pertaining to the company merger (Danh từ chính + Cụm V-ing bổ nghĩa)</code></li><li><strong>Động từ chính (V):</strong> <code>will become (Future Simple)</code></li><li><strong>Bổ ngữ (C) & Trạng ngữ:</strong> <code>available to the public (Adj phr) + within one year (Trạng ngữ thời gian)</code></li></ul><p><strong>b. Xác định loại từ & Ngữ cảnh:</strong> Động từ chính của câu là <i>will become</i>, do đó chỗ trống cần một <span style='color: #2e7d32; font-weight: bold;'>Hiện tại phân từ (V-ing)</span> để rút gọn mệnh đề quan hệ dạng chủ động (<i>which pertain to... → pertaining to...</i>). Động từ này đi kèm giới từ <i>to</i> phía sau và bổ nghĩa cho danh từ <i>documents</i>.</p><p><strong>c. Lý do chọn đáp án:</strong> Động từ <span style='color: #2e7d32; font-weight: bold;'>pertaining</span> (đi với giới từ <i>to</i>) mang nghĩa là <i>liên quan đến, thuộc về</i>, tạo thành cấu trúc rút gọn trang trọng rất hay gặp trong văn bản doanh nghiệp: <i>documents pertaining to...</i></p></div>",
    "wrong": "<ul style='line-height: 1.6; list-style-type: none; padding-left: 0;'><li><strong style='color: #c62828;'>❌ (A) assigning (v-ing):</strong> Phân công, giao việc (Không ghép với <i>to</i> để mang nghĩa \"liên quan đến tài liệu\").</li><li><strong style='color: #c62828;'>❌ (B) facilitating (v-ing):</strong> Tạo điều kiện, thúc đẩy (Là ngoại động từ đi trực tiếp với tân ngữ, không đi kèm giới từ <i>to</i>).</li><li><strong style='color: #c62828;'>❌ (D) embarking (v-ing):</strong> Bắt đầu, bắt tay vào (Đi kèm giới từ <i>ON</i>, không dùng <i>embarking to</i>).</li></ul>",
    "grammar": "<div style='line-height: 1.6;'><p><strong>⭐ Rút gọn Mệnh đề quan hệ & Động từ đi kèm Giới từ \"TO\" trong TOEIC</strong></p><p>Khi bổ nghĩa cho danh từ trong các văn bản pháp lý hoặc hợp đồng, TOEIC rất ưa chuộng các cụm V-ing rút gọn mang nghĩa \"liên quan tới\":</p><blockquote style='background: #f5f5f5; border-left: 4px solid #2e7d32; margin: 10px 0; padding: 10px;'><strong>Noun + pertaining to + Noun/Sự kiện</strong> (= Noun + relating to / concerning + Noun)</blockquote><p><strong>💡 Kiểm tra Đi kèm Giới từ của 4 Động từ dạng V-ing trong Part 5:</strong></p><table border='1' style='width: 100%; border-collapse: collapse; border-color: #e0e0e0; margin-top: 8px; font-size: 14px;'><thead style='background-color: #f5f5f5; text-align: left;'><tr><th style='padding: 8px;'>Động từ (V-ing)</th><th style='padding: 8px;'>Giới từ đi kèm</th><th style='padding: 8px;'>Ý nghĩa & Cụm từ phổ biến</th></tr></thead><tbody><tr><td style='padding: 8px;'><strong style='color: #2e7d32;'>pertaining</strong></td><td style='padding: 8px;'><strong style='color: #2e7d32;'>to</strong></td><td style='padding: 8px;'><i>pertaining to the merger / contract / issue</i></td></tr><tr><td style='padding: 8px;'><strong style='color: #0288d1;'>embarking</strong></td><td style='padding: 8px;'><strong style='color: #c62828;'>on / upon</strong></td><td style='padding: 8px;'><i>embarking on a new project / journey</i></td></tr><tr><td style='padding: 8px;'><strong style='color: #0288d1;'>assigning</strong></td><td style='padding: 8px;'>Tân ngữ + to</td><td style='padding: 8px;'><i>assigning tasks to employees</i></td></tr><tr><td style='padding: 8px;'><strong style='color: #0288d1;'>facilitating</strong></td><td style='padding: 8px;'>Không dùng giới từ</td><td style='padding: 8px;'><i>facilitating the process / discussion</i></td></tr></tbody></table><br/><p><strong>⚠️ Phân tích 4 phương án theo Ngữ pháp & Giới từ đi kèm:</strong></p><table border='1' style='width: 100%; border-collapse: collapse; border-color: #e0e0e0; margin-top: 8px; font-size: 13px;'><thead style='background-color: #f5f5f5;'><tr><th style='padding: 6px;'>Đáp án</th><th style='padding: 6px;'>Giới từ tương thích</th><th style='padding: 6px;'>Ngữ cảnh với \"documents... to the merger\"</th><th style='padding: 6px;'>Đánh giá</th></tr></thead><tbody><tr><td style='padding: 6px;'><strong>A. assigning</strong></td><td style='padding: 6px;'>Sai nghĩa khi đi với <i>to</i></td><td style='padding: 6px;'>Sai nghĩa (Tài liệu không tự phân công)</td><td style='padding: 6px; color: #c62828; font-weight: bold;'>❌ Sai</td></tr><tr><td style='padding: 6px;'><strong>B. facilitating</strong></td><td style='padding: 6px;'>Không đi với <i>to</i></td><td style='padding: 6px;'>Sai cấu trúc ngữ pháp</td><td style='padding: 6px; color: #c62828; font-weight: bold;'>❌ Sai</td></tr><tr><td style='padding: 6px;'><strong>C. pertaining</strong></td><td style='padding: 6px;'><strong style='color: #2e7d32;'>pertain to</strong></td><td style='padding: 6px;'>Hoàn toàn phù hợp (Tài liệu liên quan tới)</td><td style='padding: 6px; color: #2e7d32; font-weight: bold;'>✅ Đúng</td></tr><tr><td style='padding: 6px;'><strong>D. embarking</strong></td><td style='padding: 6px;'>Sai giới từ (Cần <i>on</i>)</td><td style='padding: 6px;'>Sai cấu trúc ngữ pháp</td><td style='padding: 6px; color: #c62828; font-weight: bold;'>❌ Sai</td></tr></tbody></table></div>",
    "vocab": "<ul style='line-height: 1.6;'><li><strong style='color: #0288d1;'>pertain to</strong> (v phr): liên quan đến, thuộc về (= relate to).</li><li><strong style='color: #0288d1;'>merger</strong> (n): sự sáp nhập doanh nghiệp.</li><li><strong style='color: #0288d1;'>available to the public</strong> (adj phr): công khai cho công chúng.</li><li><strong style='color: #0288d1;'>embark on</strong> (v phr): bắt tay vào, bắt đầu (dự án, hành trình).</li><li><strong style='color: #0288d1;'>facilitate</strong> (v): tạo điều kiện thuận lợi.</li></ul>",
    "trans": "<div style='line-height: 1.6; padding: 8px; background-color: #f9f9f9; border-left: 4px solid #0288d1;'><p style='margin: 0 0 8px 0;'><strong>Dịch nghĩa gốc:</strong> Tất cả các tài liệu liên quan đến việc sáp nhập công ty sẽ trở nên sẵn có cho công chúng trong vòng một năm.</p><p style='margin: 0; font-style: italic; color: #555;'><strong>Dịch tự nhiên:</strong> Toàn bộ hồ sơ, tài liệu liên quan đến vụ sáp nhập doanh nghiệp sẽ được công khai rộng rãi trong vòng một năm tới.</p></div>"
  }
},

  "q": "Granta Hospital has added several pediatric nurses to its staff as part of its new ______ with the Friel School of Nursing.",
  "options": [
    "affiliation",
    "affiliated",
    "affiliating",
    "affiliates"
  ],
  "a": "affiliation",
  "exp": {
    "correct": "<div style='line-height: 1.6;'><p><strong>a. Phân tích thành phần câu (S-V-O & Trạng ngữ):</strong></p><ul><li><strong>Mệnh đề chính:</strong> <code>Granta Hospital (S) + has added (V) + several pediatric nurses (O) + to its staff (Cụm giới từ)</code></li><li><strong>Cụm trạng ngữ chỉ mục đích:</strong> <code>as part of its new affiliation with the Friel School of Nursing</code></li><li><strong>Cụm danh từ tân ngữ của giới từ:</strong> <code>its (Tính từ sở hữu) + new (Adj) + affiliation (N)</code></li></ul><p><strong>b. Xác định loại từ & Ngữ cảnh:</strong> Chỗ trống nằm sau tính từ sở hữu <i>its</i> và tính từ <i>new</i>, yêu cầu một <span style='color: #2e7d32; font-weight: bold;'>Danh từ (Noun)</span>. Ngữ cảnh mô tả mối quan hệ hợp tác/liên kết giữa bệnh viện và một trường điều dưỡng để tuyển thêm y tá.</p><p><strong>c. Lý do chọn đáp án:</strong> Danh từ không đếm được/trừu tượng <span style='color: #2e7d32; font-weight: bold;'>affiliation</span> mang nghĩa là <i>mối quan hệ hợp tác, sự liên kết</i>, tạo thành kết hợp từ (collocation) phổ biến trong TOEIC: <i>affiliation with + tổ chức</i>.</p></div>",
    "wrong": "<ul style='line-height: 1.6; list-style-type: none; padding-left: 0;'><li><strong style='color: #c62828;'>❌ (B) affiliated (v-ed / adj):</strong> Đã liên kết / Được liên kết (Thường đứng trong cấu trúc <i>be affiliated with</i>, không đứng làm danh từ chính sau <i>its new</i>).</li><li><strong style='color: #c62828;'>❌ (C) affiliating (v-ing):</strong> Đang liên kết (Không hợp từ loại và nghĩa trong cụm danh từ).</li><li><strong style='color: #c62828;'>❌ (D) affiliates (n-s / v-s):</strong> Các công ty/chi nhánh liên kết (Sai nghĩa, không phù hợp khi đi với giới từ <i>with + tổ chức</i> trong ngữ cảnh này).</li></ul>",
    "grammar": "<div style='line-height: 1.6;'><p><strong>⭐ Cấu trúc Cụm danh từ & Collocations chỉ Sự hợp tác trong TOEIC</strong></p><p>Vị trí đứng sau Tính từ sở hữu + Tính từ luôn là một Danh từ chính:</p><blockquote style='background: #f5f5f5; border-left: 4px solid #2e7d32; margin: 10px 0; padding: 10px;'><strong>Possessive Adj + Adjective + Noun + with + Organization</strong></blockquote><p><strong>💡 Phân biệt các từ cùng gốc \"Affiliate\" trong Part 5:</strong></p><table border='1' style='width: 100%; border-collapse: collapse; border-color: #e0e0e0; margin-top: 8px; font-size: 14px;'><thead style='background-color: #f5f5f5; text-align: left;'><tr><th style='padding: 8px;'>Từ loại</th><th style='padding: 8px;'>Từ vựng</th><th style='padding: 8px;'>Ý nghĩa & Cấu trúc đi kèm</th></tr></thead><tbody><tr><td style='padding: 8px;'><strong style='color: #2e7d32;'>Danh từ (Sự việc)</strong></td><td style='padding: 8px;'><i>affiliation</i></td><td style='padding: 8px;'>Sự liên kết, mối hợp tác (<i>affiliation with sb/sth</i>)</td></tr><tr><td style='padding: 8px;'><strong style='color: #0288d1;'>Danh từ (Đối tượng)</strong></td><td style='padding: 8px;'><i>affiliate(s)</i></td><td style='padding: 8px;'>Công ty con, đơn vị liên kết (<i>our local affiliates</i>)</td></tr><tr><td style='padding: 8px;'><strong style='color: #0288d1;'>Tính từ (Bị động)</strong></td><td style='padding: 8px;'><i>affiliated</i></td><td style='padding: 8px;'>Có liên kết (<i>be affiliated with the university</i>)</td></tr></tbody></table><br/><p><strong>⚠️ Phân tích 4 phương án theo Vị trí & Cấu trúc:</strong></p><table border='1' style='width: 100%; border-collapse: collapse; border-color: #e0e0e0; margin-top: 8px; font-size: 13px;'><thead style='background-color: #f5f5f5;'><tr><th style='padding: 6px;'>Đáp án</th><th style='padding: 6px;'>Từ loại</th><th style='padding: 6px;'>Khả năng ghép với \"its new ... with\"</th><th style='padding: 6px;'>Đánh giá</th></tr></thead><tbody><tr><td style='padding: 6px;'><strong>A. affiliation</strong></td><td style='padding: 6px;'>Danh từ (N)</td><td style='padding: 6px;'>Hoàn toàn phù hợp (Chỉ sự hợp tác)</td><td style='padding: 6px; color: #2e7d32; font-weight: bold;'>✅ Đúng</td></tr><tr><td style='padding: 6px;'><strong>B. affiliated</strong></td><td style='padding: 6px;'>Tính từ (Adj)</td><td style='padding: 6px;'>Sai vị trí (Cần Noun đứng sau Adj)</td><td style='padding: 6px; color: #c62828; font-weight: bold;'>❌ Sai</td></tr><tr><td style='padding: 6px;'><strong>C. affiliating</strong></td><td style='padding: 6px;'>Phân từ (V-ing)</td><td style='padding: 6px;'>Sai từ loại và ngữ nghĩa</td><td style='padding: 6px; color: #c62828; font-weight: bold;'>❌ Sai</td></tr><tr><td style='padding: 6px;'><strong>D. affiliates</strong></td><td style='padding: 6px;'>Danh từ số nhiều (N-s)</td><td style='padding: 6px;'>Sai nghĩa (Không hợp với <i>with + Trường học</i>)</td><td style='padding: 6px; color: #c62828; font-weight: bold;'>❌ Sai</td></tr></tbody></table></div>",

    "vocab": "<ul style='line-height: 1.6;'><li><strong style='color: #0288d1;'>as well as</strong> (phrase): cũng như, đồng thời (= and also).</li><li><strong style='color: #0288d1;'>field a question / inquiry</strong> (v phr): xử lý, ứng biến trả lời câu hỏi/thắc mắc.</li><li><strong style='color: #0288d1;'>checkout counter</strong> (n phr): quầy thu ngân, quầy thanh toán.</li><li><strong style='color: #0288d1;'>purchased items</strong> (n phr): các mặt hàng đã mua.</li><li><strong style='color: #0288d1;'>be able to + V</strong> (v phr): có khả năng làm gì.</li></ul>",

// --- SETUP MODAL LOGIC ---
function selectMode(mode) {
    currentMode = mode;
    document.querySelector('.mode-practice').classList.toggle('selected', mode === 'practice');
    document.querySelector('.mode-mock').classList.toggle('selected', mode === 'mock');
    
    document.getElementById('timeInputBox').style.display = (mode === 'practice') ? 'block' : 'none';
    
    // Đổi 'inline-block' thành 'block'
    document.getElementById('startBtn').style.display = '';
}

function askReady() {
    let confirmMsg = currentMode === 'mock' 
        ? "Bạn chọn Thi Thử (75 phút chuẩn TOEIC Reading).\nBạn đã sẵn sàng bước vào bài làm chưa?" 
        : `Bạn chọn Luyện Tập (${document.getElementById('timeInput').value} phút).\nBạn đã sẵn sàng chưa?`;
        
    document.getElementById('startConfirmMsg').innerText = confirmMsg;
    document.getElementById('startConfirmOverlay').style.display = 'flex';
}

function closeStartConfirmModal() {
    document.getElementById('startConfirmOverlay').style.display = 'none';
}

function startTestActual() {
    document.getElementById('startConfirmOverlay').style.display = 'none';
    
    let minutes = (currentMode === 'mock') ? 75 : parseInt(document.getElementById('timeInput').value);
    if(isNaN(minutes) || minutes < 1) minutes = 75;
    testDuration = minutes * 60;
    
    document.getElementById('setupOverlay').style.display = 'none';
    startTimer();
    
}

// --- HÀM TÔ MÀU DẪN CHỨNG HIỆN SẴN ---
function applyEvidenceColors() {
    const pastelColors = [
        { bg: '#ffadad', text: '#5a1c1c' }, // Đỏ pastel
        { bg: '#ffd6a5', text: '#663d14' }, // Cam pastel
        { bg: '#caffbf', text: '#1f4d1f' }, // Xanh lá pastel
        { bg: '#9bf6ff', text: '#16565c' }, // Xanh dương pastel
        { bg: '#a0c4ff', text: '#1c3666' }, // Xanh biển pastel
        { bg: '#bdb2ff', text: '#352666' }, // Tím pastel
        { bg: '#ffc6ff', text: '#661a66' }, // Hồng pastel
        { bg: '#e2f0cb', text: '#3e5222' }  // Xanh rêu pastel
    ];

    let colorIndex = 0;
    let usedColors = {}; 

    let evElements = document.querySelectorAll('.ev-box');

    evElements.forEach(el => {
        let idString = el.id;
        if (!idString) return;
        let match = idString.match(/ev-(\d+)/);
        if (match) {
            let qId = match[1];
            if (!usedColors[qId]) {
                usedColors[qId] = pastelColors[colorIndex % pastelColors.length];
                colorIndex++;
            }
            el.style.backgroundColor = usedColors[qId].bg;
            el.style.color = usedColors[qId].text;
            el.style.padding = "2px 5px";
            el.style.borderRadius = "6px";
            el.style.fontWeight = "600";
            el.style.transition = "all 0.3s ease";
        }
    });
}

function formatAnswer(options, answer) {
    if(!options) return answer;
    if(Array.isArray(options)) {
        // Bỏ qua mảng object của Part 7 vì đáp án đã là A,B,C,D sẵn
        if (typeof options[0] === 'object') return answer; 
        let labels = ["A", "B", "C", "D"];
        let idx = options.indexOf(answer);
        return idx !== -1 ? labels[idx] : answer;
    }
    return answer; 
}

function createTOEICQuestion(qObj) {
    if(!qObj || !qObj.id) return "";
    
    // 1. Lấy nội dung câu hỏi
    let text = qObj.q || qObj.text || qObj.qEng || "";
    
    // XỬ LÝ LẶP SỐ: Nếu nội dung câu hỏi bắt đầu bằng "151. ", "152. "... thì xóa nó đi
    // vì đã có số thứ tự hiển thị trong vòng tròn màu hồng bên trái rồi.
    if (typeof text === 'string') {
        text = text.replace(/^\d+\.\s*/, ""); // Xóa số và dấu chấm ở đầu (vd: "131. " -> "")
        text = text.replace(/(\([^)]+\))/g, '<span class="vi-trans">$1</span>');
    }
    
    let opts = qObj.options;
    let optsHTML = "";
    let inputStyle = `margin-right:12px; transform:scale(1.3); cursor:pointer;`;
    let labelStyle = `display:block; margin:10px 0; padding:12px 18px; border-radius:var(--radius); cursor:pointer; border:2px solid #f1f5f9; background:#f8fafc; transition:all 0.2s ease; font-size:17px;`;

    if (Array.isArray(opts)) {
        let labels = ["A", "B", "C", "D"];
        opts.forEach((opt, i) => {
            // Sửa lỗi undefined cho các Option Part 6, 7 (dùng .text thay vì .en)
            let optText = typeof opt === 'object' ? (opt.text || opt.en || "") : opt;
            
            // XỬ LÝ LẶP NHÃN A. A.: Xóa "A. ", "B. " có sẵn trong dữ liệu
            if (typeof optText === 'string') {
                optText = optText.replace(/^[A-D]\.\s*/, ""); 
                optText = optText.replace(/(\([^)]+\))/g, '<span class="vi-trans">$1</span>');
            }

            let optValue = typeof opt === 'object' ? (opt.key || labels[i]) : labels[i];
            
            optsHTML += `
                <label class="mc-option" style="${labelStyle}" onmouseover="this.style.background='var(--exp-bg)'" onmouseout="this.style.background='transparent'">
                    <input type="radio" name="q${qObj.id}" value="${optValue}" style="${inputStyle}" onclick="checkNav(${qObj.id})"> 
                    <b>${labels[i]}.</b> ${optText}
                </label>`;
        });
    } else {
        // Trường hợp options là Object (thường cho Part 5)
        for (let key in opts) {
            let optText = opts[key];
            if (typeof optText === 'string') {
                optText = optText.replace(/^[A-D]\.\s*/, ""); 
                optText = optText.replace(/(\([^)]+\))/g, '<span class="vi-trans">$1</span>');
            }
            optsHTML += `
                <label class="mc-option" style="${labelStyle}" onmouseover="this.style.background='var(--exp-bg)'" onmouseout="this.style.background='transparent'">
                    <input type="radio" name="q${qObj.id}" value="${key}" style="${inputStyle}" onclick="checkNav(${qObj.id})"> 
                    <b>${key}.</b> ${optText}
                </label>`;
        }
    }

    return `<div class="q-row" id="q-row-${qObj.id}" style="margin-bottom:30px; display:flex; background:white; padding:25px; border-radius:var(--radius); box-shadow:var(--shadow); border:1px solid var(--border);">
<div class="q-num" style="min-width:42px; height:42px; background:linear-gradient(135deg, var(--primary), var(--primary-dark)); color:white; border-radius:10px; display:flex; align-items:center; justify-content:center; font-weight:800; margin-right:20px; flex-shrink:0; box-shadow: 0 4px 10px rgba(30,58,138,0.2);">${qObj.id}</div>
                <div class="q-text" style="flex:1; font-size:18px; line-height:1.8;">
                    <div class="q-content-wrapper">
                        <!-- Biến 'text' ở đây đã được cắt bỏ số thứ tự trùng lặp -->
                        <b>${text}</b><br>${optsHTML}
                        <span id="fb-${qObj.id}" class="feedback" style="font-weight:bold; margin-left:10px;"></span>
                    </div>
                    <div id="exp-${qObj.id}" class="exp-container"></div>
                </div>
            </div>`;
}

function createQuestionsBlock(passageObj) {
    let html = `<div class="questions-block" style="margin-bottom: 40px; background: transparent; padding: 0;" onmouseenter="showPassage('${passageObj.passageId}')">`;
    html += `<div style="color:var(--primary-dark); font-weight:bold; margin-bottom:15px; border-bottom: 2px solid var(--border); padding-bottom:10px; font-size: 18px;">📝 Questions for Passage: ${passageObj.passageId}</div>`;
    
    let validQuestions = passageObj.questions.filter(q => q && q.id);
    
    validQuestions.forEach(q => {
        html += createTOEICQuestion(q);
        allQuestionIds.push(q.id);
        
        // --- BẮT ĐẦU PHẦN SỬA LỖI ---
        let correctAns = q.a || q.correct; 
        
        // Nếu là Part 6/7 (options là mảng các object)
        if (!correctAns && Array.isArray(q.options)) {
            // Tìm vị trí của option có thuộc tính "correct" là true
            const foundIdx = q.options.findIndex(o => typeof o === 'object' && o.correct === true);
            if (foundIdx !== -1) {
                const labels = ["A", "B", "C", "D"];
                correctAns = labels[foundIdx]; // Chuyển index 0,1,2,3 thành A,B,C,D
            }
        }
        
        answerKey[q.id] = correctAns; // Lưu nhãn A,B,C,D vào bộ nhớ chấm điểm
        // --- KẾT THÚC PHẦN SỬA LỖI ---

        explanations[q.id] = { exp: q.explanation || "" };
    });
    html += `</div>`;
    return html;
}

function switchTab(n) {
    const mainContainer = document.getElementById('mainContainer');
    document.querySelectorAll('.tab-btn').forEach((b, i) => { b.classList.toggle('active', i + 1 === n); });
    document.querySelectorAll('.question-group').forEach((q, i) => { q.style.display = (i + 1 === n) ? 'block' : 'none'; });
    
    // Quản lý chế độ Part 5 hoặc 6-7
    if (n === 1) {
        mainContainer.classList.add('part5-mode');
    } else {
        mainContainer.classList.remove('part5-mode');
    }

    // Reset pagination khi đổi Part
    currentStep = 0;
    updatePagination();
    
    document.querySelector('.pane-right').scrollTop = 0;
}
function showPassage(passageId) {
    document.querySelectorAll('.passage-text-content').forEach(p => p.style.display = 'none');
    
    // Hiện bài tiếng Anh
    let pEng = document.getElementById(`passage-${passageId}`);
    if (pEng) pEng.style.display = 'block';

    // Hiện bản dịch tiếng Việt tương ứng (Cột 2)
    let pVie = document.getElementById(`vie-passage-${passageId}`);
    if (pVie) pVie.style.display = 'block';
}
let currentStep = 0;

function updatePagination() {
    const activeGroup = document.querySelector('.question-group[style*="display: block"]');
    if (!activeGroup) return;
    const partSuffix = activeGroup.id.split('-').pop();
    const isPart5 = activeGroup.id === 'q-group-1';

    if (isSubmitted) {
        activeGroup.querySelectorAll('.questions-block, .q-row').forEach(el => el.style.display = isPart5 ? 'flex' : 'block');
        document.getElementById(`paginationBox${partSuffix}`).style.display = 'none';
        return;
    }

    const steps = isPart5 ? activeGroup.querySelectorAll('.q-row') : activeGroup.querySelectorAll('.questions-block');
    steps.forEach((step, index) => {
        if (index === currentStep) {
            step.style.display = isPart5 ? 'flex' : 'block';
            if (!isPart5) {
                // SỬA TẠI ĐÂY: Thay match[1] bằng match[2]
                const match = step.getAttribute('onmouseenter').match(/'([^']+)'/);
                if (match && match[2]) showPassage(match[2]); 
            }
        } else {
            step.style.display = 'none';
        }
    });

    document.getElementById(`btnPrev${partSuffix}`).disabled = (currentStep === 0);
    document.getElementById(`btnNext${partSuffix}`).disabled = (currentStep === steps.length - 1);
}
// --- 2. Sửa lỗi đóng ngoặc và phạm vi biến ID ---
function scrollToQuestion(id) {
    document.getElementById('navPanel').classList.remove('show');
    let group = 1;
    if (toeicData.part6.some(p => p.questions.some(q => q.id == id))) group = 2;
    if (toeicData.part7.some(p => p.questions.some(q => q.id == id))) group = 3;
    
    switchTab(group); 

    const activeGroup = document.getElementById(`q-group-${group}`);
    const steps = group === 1 ? activeGroup.querySelectorAll('.q-row') : activeGroup.querySelectorAll('.questions-block');
    
    steps.forEach((step, index) => {
        if (step.id === `q-row-${id}` || step.querySelector(`#q-row-${id}`)) {
            currentStep = index; 
        }
    });

    updatePagination(); 

    // Đảm bảo khối setTimeout này nằm TRONG hàm scrollToQuestion
    setTimeout(() => {
        let el = document.getElementById(`q-row-${id}`);
        if (el) {
            el.scrollIntoView({behavior: "smooth", block: "center"});
            el.style.transition = "background 0.5s";
            el.style.background = "#fff9c4";
            setTimeout(() => el.style.background = "transparent", 1000);

            let parentBlock = el.closest('.questions-block');
            if(parentBlock) {
                let mouseEvent = new MouseEvent('mouseenter');
                parentBlock.dispatchEvent(mouseEvent);
            }
        }
    }, 150);
}

function startTimer() {
    let display = document.getElementById("timer");
    timerInterval = setInterval(function () {
        let m = Math.floor(testDuration / 60);
        let s = testDuration % 60;
        display.textContent = `${m < 10 ? '0'+m : m}:${s < 10 ? '0'+s : s}`;
        if (--testDuration < 0) { 
            clearInterval(timerInterval); 
            submitTest(false); 
        }
    }, 1000);
}

// --- QUẢN LÝ LỊCH SỬ LÀM BÀI ---
const HISTORY_KEY = "snapenglish_test4_2026_history";
let isReviewingMode = false;
function openHistoryModal() {
    // Lấy dữ liệu lịch sử từ localStorage
    let history = JSON.parse(localStorage.getItem(HISTORY_KEY)) || [];
    let historyListEl = document.getElementById('historyList');
    let listHtml = '';

    // Kiểm tra nếu chưa có lịch sử
    if (history.length === 0) {
        listHtml = '<p style="text-align: center; color: #888; margin-top: 20px;">Chưa có dữ liệu làm bài.</p>';
    } else {
        // Duyệt qua từng bài làm và tạo giao diện hiển thị
        history.forEach(attempt => {
            listHtml += `
                <div class="history-item">
                    <div class="history-info">
                        <span class="history-date">📅 ${attempt.date} - ⏰ ${attempt.time}</span>
                        <span class="history-score">🏆 Điểm: ${attempt.score}/${attempt.total} (${attempt.toeicScore} điểm)</span>
                    </div>
                    <div style="display: flex; gap: 5px;">
                        <button class="btn-review" onclick="restoreAttempt(${attempt.id})">Xem lại</button>
                        <button class="btn-delete-history" onclick="deleteAttempt(${attempt.id})" title="Xóa bài làm này">✖</button>
                    </div>
                </div>
            `;
        });
    }
    
    // Đổ dữ liệu vào danh sách và hiển thị bảng Modal
    historyListEl.innerHTML = listHtml;
    document.getElementById('historyOverlay').style.display = 'flex';
}

function closeHistoryModal() {
    // Ẩn bảng Modal lịch sử
    document.getElementById('historyOverlay').style.display = 'none';
}
function saveAttemptToHistory(score, total, userAnswersMap) {
    let history = JSON.parse(localStorage.getItem(HISTORY_KEY)) || [];
    let now = new Date();
    
    let attempt = {
        id: Date.now(),
        date: now.toLocaleDateString('vi-VN'),
        time: now.toLocaleTimeString('vi-VN', { hour: '2-digit', minute: '2-digit' }),
        score: score,
        total: total,
        toeicScore: calculateToeicReading(score, total),
        answers: userAnswersMap // Lưu lại toàn bộ ABCD đã chọn
    };
    
    history.unshift(attempt); // Đẩy bài mới nhất lên đầu
    localStorage.setItem(HISTORY_KEY, JSON.stringify(history));

    // ĐỒNG BỘ LÊN CLOUD NGAY SAU KHI LƯU
    if (window.syncHistoryToCloud) {
        window.syncHistoryToCloud(history);
    }
}

function deleteAttempt(attemptId) {
    showCustomConfirm("Bạn có chắc chắn muốn xóa bài làm này khỏi lịch sử không?", function() {
        let history = JSON.parse(localStorage.getItem(HISTORY_KEY)) || [];
        history = history.filter(h => h.id !== attemptId); 
        localStorage.setItem(HISTORY_KEY, JSON.stringify(history)); 
        
        // ĐỒNG BỘ THAO TÁC XÓA LÊN CLOUD
        if (window.syncHistoryToCloud) {
            window.syncHistoryToCloud(history);
        }
        
        openHistoryModal(); 
    });
}
function restoreAttempt(attemptId) {
    let history = JSON.parse(localStorage.getItem(HISTORY_KEY)) || [];
    let attempt = history.find(h => h.id === attemptId);
    
    if(!attempt) return;

    isReviewingMode = true; // Bật cờ hiệu "Đang xem lại"
    document.getElementById('historyOverlay').style.display = 'none';
    document.getElementById('setupOverlay').style.display = 'none';
    
    document.querySelectorAll('input[type="radio"]').forEach(el => {
        el.disabled = false;
        el.checked = false; 
    });
    
    // Tự động đánh dấu lại các Radio button đáp án học viên đã chọn trong lịch sử
    for (let qId in attempt.answers) {
        let val = attempt.answers[qId];
        if (val) {
            let radio = document.querySelector(`input[name="q${qId}"][value="${val}"]`);
            if (radio) radio.checked = true;
        }
    }
    
   // Đổi chữ nút Nộp bài thành "Đang xem lại" cho ngầu
    let btnSubmit = document.querySelector('.btn-submit');
    if(btnSubmit) {
        btnSubmit.innerText = "ĐANG XEM LẠI";
        btnSubmit.style.background = "#888";
        btnSubmit.style.boxShadow = "none";
    }

    // --- THÊM 2 DÒNG NÀY VÀO TRƯỚC DẤU NGOẶC NHỌN ĐÓNG HÀM ---
    isSubmitted = false; 
    executeSubmit();
}


function scrollToEvidence(evId) {
    const evElement = document.getElementById(evId);
    if(evElement) {
        // Cuộn đoạn văn chứa dẫn chứng vào giữa màn hình
        evElement.scrollIntoView({behavior: "smooth", block: "center"});
        
        // Thêm class 'focus-blink' để bật chế độ nháy vàng in đậm
        evElement.classList.add("focus-blink");
        
        // Tắt nổi bật sau 1.5 giây để trả văn bản về bình thường
        setTimeout(() => {
            evElement.classList.remove("focus-blink");
        }, 1500);
    } else {
        showCustomAlert("Chưa được gắn ID dẫn chứng trong bài đọc!");
    }
}
// --- GRADING ---
function submitTest(manual) {
    if (isSubmitted) return;
    if (manual) document.getElementById('confirmOverlay').style.display = 'flex';
    else executeSubmit();
}

function closeConfirmModal() { document.getElementById('confirmOverlay').style.display = 'none'; }
function closeResultModal() { document.getElementById('resultOverlay').style.display = 'none'; }

function executeSubmit() {
    document.getElementById('confirmOverlay').style.display = 'none';
    isSubmitted = true;
updatePagination();
    clearInterval(timerInterval);
    document.querySelectorAll('input, select').forEach(el => el.disabled = true);
    
    document.getElementById('mainContainer').classList.add('show-translation');
    
    let activeTabIndex = 1;
    document.querySelectorAll('.tab-btn').forEach((b, i) => {
        if (b.classList.contains('active')) activeTabIndex = i + 1;
    });
    switchTab(activeTabIndex);
    
    let score = 0;
    let totalQuestions = allQuestionIds.length;
    let userAnswersMap = {}; // Thêm cái này để hứng đáp án học viên

    allQuestionIds.forEach(id => {
        let userAns = "";
        let radios = document.getElementsByName(`q${id}`);
        for (let r of radios) if (r.checked) userAns = r.value;
        
        userAnswersMap[id] = userAns; // Ghi nhận đáp án câu này

        let correctAns = answerKey[id];
        let isCorrect = (userAns === correctAns);
        if (isCorrect && userAns !== "") score++; // Có chọn mới tính điểm

        let feedbackEl = document.getElementById(`fb-${id}`);
        if(feedbackEl) {
            if(isCorrect && userAns !== "") {
                feedbackEl.innerHTML = `<span style="color:var(--correct);">✓ Đúng</span>`;
            } else if (userAns === "") {
                feedbackEl.innerHTML = `<span style="color:#888;">Trống (Đáp án: <span style="background:#dce775; color:#333; padding:2px 5px; border-radius:4px;">${correctAns}</span>)</span>`;
            } else {
                feedbackEl.innerHTML = `<span style="color:var(--wrong);">✗ Sai (Đáp án: <span style="background:#dce775; color:#333; padding:2px 5px; border-radius:4px;">${correctAns}</span>)</span>`;
            }
        }
        
        let nav = document.getElementById(`nav-${id}`);
        if(nav) {
            if (isCorrect && userAns !== "") {
                nav.style.background = "#c8e6c9"; nav.style.color = "#2e7d32"; nav.style.borderColor = "#81c784";
            } else {
                nav.style.background = "#ffcdd2"; nav.style.color = "#c62828"; nav.style.borderColor = "#ef9a9a";
            }
        }

        let expContainer = document.getElementById(`exp-${id}`);
        if(expContainer && explanations[id]) {
            let expData = explanations[id];
let contentHtml = "";

if (expData.exp) contentHtml += `<div class="exp-text">${expData.exp}</div>`;
if (expData.vocab) contentHtml += `<div class="exp-vocab">${expData.vocab}</div>`;
if (expData.tip) contentHtml += `<div style="margin-top:8px; color:var(--primary-dark); font-weight:600;">📌 Ghi chú: ${expData.tip}</div>`;

expContainer.innerHTML = `
    <div class="exp-box show">
        <div class="exp-title">💡 Giải thích chi tiết Câu ${id}</div>
        ${contentHtml}
    </div>
`;
        }
    });

   
    if (!isReviewingMode) {
        saveAttemptToHistory(score, totalQuestions, userAnswersMap);
        document.getElementById('resultMessage').innerHTML = `Bạn đã làm đúng <b style="color: var(--primary); font-size: 22px;">${score}/${totalQuestions}</b> câu.<br>Điểm TOEIC Reading quy đổi: <b>${calculateToeicReading(score, totalQuestions)}</b>`;
        document.getElementById('resultOverlay').style.display = 'flex';
        if(window.luuDiemTOEICReadingFull) {
            // Tính toán thời gian thực tế đã làm (số phút ban đầu trừ đi số phút còn lại)
            let minutesAssigned = (currentMode === 'mock') ? 75 : parseInt(document.getElementById('timeInput').value);
            if(isNaN(minutesAssigned) || minutesAssigned < 1) minutesAssigned = 75;
            let timeTaken = Math.round(minutesAssigned - (testDuration / 60));
            
            // Truyền thêm timeTaken vào hàm
            window.luuDiemTOEICReadingFull(score, totalQuestions, "ETS 2026 - Test 4", timeTaken);
        }
    } else {
        // Đưa khối else này ra đúng vị trí của nó
        let toastMsg = document.createElement("div");
        toastMsg.innerText = "Đã khôi phục bài làm ngày cũ!";
        toastMsg.style.cssText = "position:fixed; top:20px; right:20px; background:var(--primary); color:white; padding:15px 20px; border-radius:12px; font-weight:bold; font-family:'Quicksand',sans-serif; z-index:99999; box-shadow:0 10px 30px rgba(0,0,0,0.2);";
        document.body.appendChild(toastMsg);
        setTimeout(() => toastMsg.remove(), 3000);
    }
}
        

function calculateToeicReading(raw, total) {
    if (raw === 0) return 5;
    let percent = raw / total;
    let score = Math.round((percent * 495) / 5) * 5; 
    return score > 495 ? 495 : (score < 5 ? 5 : score);
}

// --- HIGHLIGHT SYSTEM ---
const mainContainer = document.getElementById("mainContainer");
const menu = document.getElementById("ctxMenu");
let targetElement = null;
let selectedRange = null;

// Chuyển menu sang fixed để bám đúng con trỏ chuột dù đang cuộn ở cột nào
menu.style.position = "fixed";

mainContainer.addEventListener("contextmenu", (e) => {
    e.preventDefault();
    targetElement = null; selectedRange = null;
    
    // Nếu click chuột phải vào vùng đã highlight -> Hiện nút Xóa
    if (e.target.classList.contains("highlight")) {
        targetElement = e.target;
        showMenu(e.clientX, e.clientY, "remove");
        return;
    }
    
    // Nếu bôi đen văn bản mới -> Hiện nút Thêm
    let sel = window.getSelection();
    if (sel.toString().trim().length > 0 && mainContainer.contains(sel.anchorNode)) {
        selectedRange = sel.getRangeAt(0);
        showMenu(e.clientX, e.clientY, "add");
    } else {
        menu.style.display = "none";
    }
});

// Bấm chuột trái ra ngoài thì ẩn menu
document.addEventListener("click", (e) => { 
    if (menu && !menu.contains(e.target)) menu.style.display = "none"; 
});

function showMenu(x, y, mode) {
    menu.style.display = "block";
    let mw = menu.offsetWidth;
    let mh = menu.offsetHeight;
    
    // Chống tràn màn hình
    let left = x + mw > window.innerWidth ? window.innerWidth - mw - 10 : x;
    let top = y + mh > window.innerHeight ? window.innerHeight - mh - 10 : y;
    
    menu.style.left = left + "px";
    menu.style.top = top + "px";
    
    menu.children[0].style.display = (mode === "add") ? "block" : "none";
    menu.children[1].style.display = (mode === "remove") ? "block" : "none";
}

function doHighlight() {
    if (selectedRange) {
        try { 
            let span = document.createElement("span");
            span.className = "highlight";
            selectedRange.surroundContents(span); 
        } catch(e) {
            showCustomAlert("Lưu ý: Chỉ có thể bôi vàng các cụm từ nằm trong cùng một đoạn văn. Vui lòng không bôi đen vắt ngang qua các khoảng ngắt dòng nhé!");
        }
        window.getSelection().removeAllRanges();
    }
    menu.style.display = "none";
}

function removeHighlight() {
    if (targetElement) {
        let text = document.createTextNode(targetElement.textContent);
        targetElement.parentNode.replaceChild(text, targetElement);
        mainContainer.normalize(); // Nối lại văn bản liền mạch
    }
    menu.style.display = "none";
}

    // 1. HÀM ĐẨY LỊCH SỬ LÊN CLOUD
    window.syncHistoryToCloud = async function(historyData) {
        if (!window.currentUserUid) return;
        try {
            // Đặt tên document phân biệt theo Test và User
            let docId = window.currentUserUid + "_history_test4_2026";
            await setDoc(doc(db, "user_test_histories", docId), {
                savedHistory: historyData,
                lastUpdated: Date.now()
            }, { merge: true }); // Merge true để không đè mất các field khác nếu có
            
        } catch (error) {
            console.error("Lỗi đồng bộ lịch sử: ", error);
        }
    }

    // 2. LẮNG NGHE ĐĂNG NHẬP VÀ KÉO LỊCH SỬ VỀ
    onAuthStateChanged(auth, (user) => {
        if (user) {
            window.currentUserUid = user.uid;
            window.currentUserEmail = user.email;
            
            // Tự động nhận diện ID file hiện tại (2018 hay 2019)
            let is2026 = document.title.includes("2026");
            let docSuffix = is2026 ? "_history_test4_2026" : "_history_test4_2026";
            let localKey = is2026 ? "snapenglish_test4_2026_history" : "snapenglish_test4_2026_history";
            
            let docId = user.uid + docSuffix;
            const docRef = doc(db, "user_test_histories", docId);
            
            // SỬ DỤNG ONSNAPSHOT ĐỂ ĐỒNG BỘ REAL-TIME
            onSnapshot(docRef, (docSnap) => {
                if (docSnap.exists()) {
                    let cloudData = docSnap.data().savedHistory;
                    if (cloudData) {
                        // Nạp vào máy tính/điện thoại hiện tại
                        localStorage.setItem(localKey, JSON.stringify(cloudData));
                        
                        // Tự động làm mới bảng lịch sử nếu người dùng đang mở nó
                        let historyModal = document.getElementById('historyOverlay');
                        if (historyModal && historyModal.style.display === 'flex') {
                            openHistoryModal();
                        }
                    }
                }
            }, (error) => {

            });

            showInGameToast("⚠️ Chưa đăng nhập! Lịch sử và Điểm sẽ không được đồng bộ.");
        }
    });

    window.luuDiemTOEICReadingFull = async function(correct, total, testTitle, timeTaken) {
        if (!window.currentUserUid) return;
        
        let scoreConverted = Math.round(((correct / total) * 495) / 5) * 5;
        let timestamp = Date.now();
        let docId = window.currentUserUid + "_toeic_" + timestamp;

        let now = new Date();
        let hours = now.getHours().toString().padStart(2, '0');
        let minutes = now.getMinutes().toString().padStart(2, '0');
        let timeString = hours + ":" + minutes; 

        try {
            await setDoc(doc(db, "user_toeic_scores", docId), {
                email: window.currentUserEmail,
                skill: "Reading",
                testName: testTitle,
                partName: "Full",
                correctQ: correct,
                totalQ: total,
                score: scoreConverted,
                date: now.toLocaleDateString('vi-VN'),
                time: timeString, 
                Time: timeString, 
                timeTaken: timeTaken,
                timestamp: timestamp
            });
            showInGameToast("☁️ Đã nộp điểm lên bảng vàng SnapEnglish!");
        } catch (e) {
            console.error(e);
        }
    }
