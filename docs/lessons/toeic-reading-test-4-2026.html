        {
  "id": 112,
  "q": "The posters must be completed soon ______ they can be put up in advance of the gala.",
  "options": [
    "so that",
    "despite",
    "whenever",
    "as if"
  ],
  "a": "so that",
  "exp": {
    "correct": "<div style='line-height: 1.6;'><p><strong>a. Phân tích thành phần câu (S-V-O):</strong></p><ul><li><strong>Mệnh đề 1:</strong> <code>The posters (S) + must be completed (V - Bị động với ĐT khiếm khuyết) + soon (Adv)</code></li><li><strong>Mệnh đề 2:</strong> <code>they (S) + can be put up (V) + in advance of the gala (Trạng ngữ)</code></li></ul><p><strong>b. Xác định loại từ & Ngữ cảnh:</strong> Hai bên chỗ trống đều là một mệnh đề hoàn chỉnh <code>(S + V ... S + V)</code> $\rightarrow$ Chỗ trống cần một <strong>Liên từ (Conjunction)</strong> để nối hai mệnh đề. Mối quan hệ giữa 2 mệnh đề là <i>Nguyên nhân - Mục đích</i>: Hoàn thành áp phích sớm <b>ĐỂ THỂ</b> treo lên kịp lúc.</p><p><strong>c. Lý do chọn đáp án:</strong> Liên từ <span style='color: #2e7d32; font-weight: bold;'>so that</span> mang nghĩa là <i>để, để mà</i>, dùng để dẫn dắt một mệnh đề trạng ngữ chỉ mục đích.</p></div>",
    "wrong": "<ul style='line-height: 1.6; list-style-type: none; padding-left: 0;'><li><strong style='color: #c62828;'>❌ (B) despite (prep):</strong> Mặc dù. Đây là Giới từ (đi với Noun/V-ing), không thể nối 2 mệnh đề. Nếu muốn nối 2 mệnh đề chỉ sự nhượng bộ phải dùng <i>although / even though</i>.</li><li><strong style='color: #c62828;'>❌ (C) whenever (conj):</strong> Bất cứ khi nào (chỉ thời gian). Đặt vào câu làm sai lệch logic ý nghĩa.</li><li><strong style='color: #c62828;'>❌ (D) as if (conj):</strong> Như thể là (chỉ sự so sánh/giả định). Không phù hợp ngữ cảnh mục đích của câu.</li></ul>",
    "grammar": "<div style='line-height: 1.6;'><p><strong>⭐ Mệnh đề trạng ngữ chỉ mục đích (Purpose Clause)</strong></p><p>Cấu trúc chuẩn dùng để diễn tả mục đích của hành động:</p><blockquote style='background: #f5f5f5; border-left: 4px solid #2e7d32; margin: 10px 0; padding: 10px;'><strong>Clause 1 + so that / in order that + S + can / could / will + V_inf</strong></blockquote><p><strong>💡 Phân biệt 'so that' và 'so':</strong></p><table border='1' style='width: 100%; border-collapse: collapse; border-color: #e0e0e0; margin-top: 8px; font-size: 14px;'><thead style='background-color: #f5f5f5; text-align: left;'><tr><th style='padding: 8px;'>Liên từ</th><th style='padding: 8px;'>Ý nghĩa & Quan hệ</th><th style='padding: 8px;'>Ví dụ</th></tr></thead><tbody><tr><td style='padding: 8px;'><strong style='color: #2e7d32;'>so that</strong></td><td style='padding: 8px;'>Để mà (Chỉ mục đích)</td><td style='padding: 8px;'>We printed brochures <i>so that</i> everyone could get one.</td></tr><tr><td style='padding: 8px;'><strong style='color: #e65100;'>so</strong></td><td style='padding: 8px;'>Vì vậy (Chỉ kết quả)</td><td style='padding: 8px;'>It rained heavily, <i>so</i> the event was canceled.</td></tr></tbody></table><br/><p><strong>⚠️ Bẫy cần tránh (Mẹo làm nhanh):</strong></p><ul><li>Phía sau chỗ trống là một mệnh đề <code>(S + V)</code> $\rightarrow$ Loại ngay các <strong>Giới từ</strong> như <i>despite, because of, due to</i>.</li><li>Bảng so sánh đáp án:</li></ul><table border='1' style='width: 100%; border-collapse: collapse; border-color: #e0e0e0; margin-top: 8px; font-size: 13px;'><thead style='background-color: #f5f5f5;'><tr><th style='padding: 6px;'>Đáp án</th><th style='padding: 6px;'>Loại từ</th><th style='padding: 6px;'>Quan hệ ngữ nghĩa</th><th style='padding: 6px;'>Đánh giá</th></tr></thead><tbody><tr><td style='padding: 6px;'><strong>A. so that</strong></td><td style='padding: 6px;'>Liên từ</td><td style='padding: 6px;'>Mục đích</td><td style='padding: 6px; color: #2e7d32; font-weight: bold;'>✅ Đúng</td></tr><tr><td style='padding: 6px;'><strong>B. despite</strong></td><td style='padding: 6px;'>Giới từ</td><td style='padding: 6px;'>Nhượng bộ</td><td style='padding: 6px; color: #c62828; font-weight: bold;'>❌ Sai loại từ</td></tr><tr><td style='padding: 6px;'><strong>C. whenever</strong></td><td style='padding: 6px;'>Liên từ</td><td style='padding: 6px;'>Thời gian</td><td style='padding: 6px; color: #c62828; font-weight: bold;'>❌ Sai nghĩa</td></tr><tr><td style='padding: 6px;'><strong>D. as if</strong></td><td style='padding: 6px;'>Liên từ</td><td style='padding: 6px;'>So sánh giả định</td><td style='padding: 6px; color: #c62828; font-weight: bold;'>❌ Sai nghĩa</td></tr></tbody></table></div>",
    "vocab": "<ul style='line-height: 1.6;'><li><strong style='color: #0288d1;'>so that + S + can/could + V</strong> (conj): để mà... (chỉ mục đích).</li><li><strong style='color: #0288d1;'>put up</strong> (phrasal v): treo lên, dựng lên (ví dụ: <i>put up a poster / sign / notice</i>).</li><li><strong style='color: #0288d1;'>in advance of + N</strong> (prep phr): trước khi một sự kiện xảy ra (phân biệt với <i>in advance</i> đứng cuối câu không có danh từ theo sau).</li><li><strong style='color: #0288d1;'>gala</strong> (n): buổi dạ tiệc, lễ hội.</li><li><strong style='color: #0288d1;'>complete</strong> (v): hoàn thành.</li></ul>",
    "trans": "<div style='line-height: 1.6; padding: 8px; background-color: #f9f9f9; border-left: 4px solid #0288d1;'><p style='margin: 0 0 8px 0;'><strong>Dịch nghĩa gốc:</strong> Các tấm áp phích phải được hoàn thành sớm để chúng có thể được treo lên trước buổi dạ tiệc.</p><p style='margin: 0; font-style: italic; color: #555;'><strong>Dịch tự nhiên:</strong> Các tấm áp phích cần hoàn thành sớm nhằm kịp treo trước khi buổi dạ tiệc diễn ra.</p></div>"
  }
},
        {
  "id": 113,
  "q": "Mr. Oliver praised the film in his review, even though he ______ disliked its aesthetic style.",
  "options": [
    "personal",
    "personally",
    "personals",
    "person"
  ],
  "a": "personally",
  "exp": {
    "correct": "<div style='line-height: 1.6;'><p><strong>a. Phân tích thành phần câu (S-V-O):</strong></p><ul><li><strong>Mệnh đề chính:</strong> <code>Mr. Oliver (S) + praised (V) + the film (O) + in his review (Trạng ngữ)</code></li><li><strong>Mệnh đề phụ (sau even though):</strong> <code>he (S) + personally (Adv) + disliked (V) + its aesthetic style (O)</code></li></ul><p><strong>b. Xác định loại từ & Ngữ cảnh:</strong> Chỗ trống nằm ở vị trí kẹp giữa <strong>Chủ ngữ (he)</strong> và <strong>Động từ chính (disliked)</strong>. Vị trí <code>S + [...] + V</code> hoàn toàn thuộc về một <span style='color: #2e7d32; font-weight: bold;'>Trạng từ (Adverb)</span> nhằm bổ nghĩa cho động từ/thái độ của chủ ngữ.</p><p><strong>c. Lý do chọn đáp án:</strong> Trạng từ <span style='color: #2e7d32; font-weight: bold;'>personally</span> mang nghĩa là <i>về mặt cá nhân, đích thân, xét theo quan điểm cá nhân</i>, bổ nghĩa chính xác cho hành động <i>disliked</i>.</p></div>",
    "wrong": "<ul style='line-height: 1.6; list-style-type: none; padding-left: 0;'><li><strong style='color: #c62828;'>❌ (A) personal (adj):</strong> Tính từ (cá nhân). Tính từ chỉ bổ nghĩa cho Danh từ, không thể đứng trước Động từ bổ nghĩa cho động từ (không có cấu trúc <i>adj + verb</i>).</li><li><strong style='color: #c62828;'>❌ (C) personals (n-s):</strong> Danh từ số nhiều (mục tìm bạn/rao vặt cá nhân trên báo). Sai cả cấu trúc lẫn ngữ nghĩa.</li><li><strong style='color: #c62828;'>❌ (D) person (n):</strong> Danh từ số ít (con người). Không thể đặt đứng giữa Chủ ngữ và Động từ.</li></ul>",
    "grammar": "<div style='line-height: 1.6;'><p><strong>⭐ Vị trí Trọng tâm của Trạng từ trong TOEIC</strong></p><p>Một trạng từ bổ nghĩa cho động từ thường đứng ở cấu trúc kẹp giữa Chủ ngữ và Động từ:</p><blockquote style='background: #f5f5f5; border-left: 4px solid #2e7d32; margin: 10px 0; padding: 10px;'><strong>Subject + Adverb + Verb</strong></blockquote><p><strong>💡 Một số cụm đi kèm Trạng từ quan điểm/mức độ thường gặp trong Part 5:</strong></p><table border='1' style='width: 100%; border-collapse: collapse; border-color: #e0e0e0; margin-top: 8px; font-size: 14px;'><thead style='background-color: #f5f5f5; text-align: left;'><tr><th style='padding: 8px;'>Cụm từ</th><th style='padding: 8px;'>Ý nghĩa</th><th style='padding: 8px;'>Ví dụ thực tế</th></tr></thead><tbody><tr><td style='padding: 8px;'><strong style='color: #2e7d32;'>personally dislike / believe</strong></td><td style='padding: 8px;'>Cá nhân không thích / tin rằng</td><td style='padding: 8px;'>He <i>personally approved</i> the budget.</td></tr><tr><td style='padding: 8px;'><strong style='color: #0288d1;'>carefully review</strong></td><td style='padding: 8px;'>Xem xét cẩn thận</td><td style='padding: 8px;'>We <i>carefully reviewed</i> the proposal.</td></tr><tr><td style='padding: 8px;'><strong style='color: #0288d1;'>strongly recommend</strong></td><td style='padding: 8px;'>Khuyến nghị mạnh mẽ</td><td style='padding: 8px;'>She <i>strongly recommended</i> the app.</td></tr></tbody></table><br/><p><strong>⚠️ Bẫy Từ loại (Parts of Speech) & Mẹo làm nhanh:</strong></p><ul><li>Khi thấy cấu trúc <code>S + [ ... ] + V</code>, ưu tiên kiểm tra xem vị trí đó có cần <strong>Trạng từ (-ly)</strong> hay không.</li><li>Phân tích nhanh loại từ của 4 phương án:</li></ul><table border='1' style='width: 100%; border-collapse: collapse; border-color: #e0e0e0; margin-top: 8px; font-size: 13px;'><thead style='background-color: #f5f5f5;'><tr><th style='padding: 6px;'>Đáp án</th><th style='padding: 6px;'>Loại từ</th><th style='padding: 6px;'>Khả năng đứng vị trí S [...] V</th><th style='padding: 6px;'>Đánh giá</th></tr></thead><tbody><tr><td style='padding: 6px;'><strong>A. personal</strong></td><td style='padding: 6px;'>Adjective</td><td style='padding: 6px;'>Không thể (Chỉ bổ nghĩa cho N)</td><td style='padding: 6px; color: #c62828; font-weight: bold;'>❌ Sai</td></tr><tr><td style='padding: 6px;'><strong>B. personally</strong></td><td style='padding: 6px;'>Adverb</td><td style='padding: 6px;'>Hoàn toàn phù hợp (Bổ nghĩa V)</td><td style='padding: 6px; color: #2e7d32; font-weight: bold;'>✅ Đúng</td></tr><tr><td style='padding: 6px;'><strong>C. personals</strong></td><td style='padding: 6px;'>Noun (plural)</td><td style='padding: 6px;'>Không thể</td><td style='padding: 6px; color: #c62828; font-weight: bold;'>❌ Sai</td></tr><tr><td style='padding: 6px;'><strong>D. person</strong></td><td style='padding: 6px;'>Noun (singular)</td><td style='padding: 6px;'>Không thể</td><td style='padding: 6px; color: #c62828; font-weight: bold;'>❌ Sai</td></tr></tbody></table></div>",
    "vocab": "<ul style='line-height: 1.6;'><li><strong style='color: #0288d1;'>personally</strong> (adv): về mặt cá nhân, đích thân.</li><li><strong style='color: #0288d1;'>praise</strong> (v): khen ngợi, tán dương (Collocation: <i>praise a product, highly praise</i>).</li><li><strong style='color: #0288d1;'>review</strong> (n): bài đánh giá, bài phê bình (Collocation: <i>customer review, movie review, performance review</i>).</li><li><strong style='color: #0288d1;'>aesthetic style</strong> (n phr): phong cách thẩm mỹ.</li><li><strong style='color: #0288d1;'>even though</strong> (conj): mặc dù (nối 2 mệnh đề có ý nghĩa tương phản).</li></ul>",
    "trans": "<div style='line-height: 1.6; padding: 8px; background-color: #f9f9f9; border-left: 4px solid #0288d1;'><p style='margin: 0 0 8px 0;'><strong>Dịch nghĩa gốc:</strong> Ông Oliver đã khen ngợi bộ phim trong bài đánh giá của mình, mặc dù về mặt cá nhân ông không thích phong cách thẩm mỹ của nó.</p><p style='margin: 0; font-style: italic; color: #555;'><strong>Dịch tự nhiên:</strong> Trong bài phê bình, ông Oliver đã dành nhiều lời khen cho bộ phim, mặc dù bản thân ông lại không thích phong cách thẩm mỹ của nó.</p></div>"
  }
},
        {
  "id": 114,
  "q": "______ weeks of record-setting rain, expect only blue skies this weekend.",
  "options": [
    "After",
    "Besides",
    "Opposite",
    "Alongside"
  ],
  "a": "After",
  "exp": {
    "correct": "<div style='line-height: 1.6;'><p><strong>a. Phân tích thành phần câu:</strong></p><ul><li><strong>Trạng ngữ chỉ thời gian:</strong> <code>[......] weeks of record-setting rain (Giới từ + Cụm danh từ)</code></li><li><strong>Mệnh đề chính (Mệnh lệnh):</strong> <code>expect (V) + only blue skies (O) + this weekend (Trạng ngữ)</code></li></ul><p><strong>b. Xác định loại từ & Ngữ cảnh:</strong> Phía sau chỗ trống là cụm danh từ chỉ khoảng thời gian <code>weeks of record-setting rain</code> $\rightarrow$ Chỗ trống cần một <strong>Giới từ (Preposition)</strong>. Ngữ cảnh diễn tả trình tự thời gian trước - sau: Nhiều tuần mưa lớn đã diễn ra xong, và tiếp theo sau đó thời tiết sẽ đẹp trở lại vào cuối tuần này.</p><p><strong>c. Lý do chọn đáp án:</strong> Giới từ <span style='color: #2e7d32; font-weight: bold;'>After</span> mang nghĩa là <i>Sau, sau khi</i>, hoàn toàn phù hợp để diễn tả sự việc xảy ra tiếp nối một khoảng thời gian/sự kiện đã kết thúc.</p></div>",
    "wrong": "<ul style='line-height: 1.6; list-style-type: none; padding-left: 0;'><li><strong style='color: #c62828;'>❌ (B) Besides (prep):</strong> Bên cạnh đó, ngoài ra (chỉ sự bổ sung). Đặt vào ngữ cảnh dự báo thời tiết gây vô lý về nghĩa.</li><li><strong style='color: #c62828;'>❌ (C) Opposite (prep):</strong> Đối diện. Chỉ vị trí không gian, không dùng cho thời gian.</li><li><strong style='color: #c62828;'>❌ (D) Alongside (prep):</strong> Dọc theo, sát cạnh, cùng với. Chỉ vị trí không gian hoặc sự đồng hành, không hợp nghĩa.</li></ul>",
    "grammar": "<div style='line-height: 1.6;'><p><strong>⭐ Cấu trúc Giới từ thời gian: AFTER</strong></p><p>Sử dụng để tạo thành cụm trạng ngữ chỉ thời gian đứng đầu câu hoặc cuối câu:</p><blockquote style='background: #f5f5f5; border-left: 4px solid #2e7d32; margin: 10px 0; padding: 10px;'><strong>After + Noun Phrase (Khoảng thời gian / Sự kiện)</strong></blockquote><p><strong>💡 Một số cụm từ chỉ trình tự thời gian thường gặp trong TOEIC:</strong></p><table border='1' style='width: 100%; border-collapse: collapse; border-color: #e0e0e0; margin-top: 8px; font-size: 14px;'><thead style='background-color: #f5f5f5; text-align: left;'><tr><th style='padding: 8px;'>Cụm từ</th><th style='padding: 8px;'>Ý nghĩa</th><th style='padding: 8px;'>Ví dụ thực tế</th></tr></thead><tbody><tr><td style='padding: 8px;'><strong style='color: #2e7d32;'>After + Noun Phrase</strong></td><td style='padding: 8px;'>Sau một khoảng thời gian / sự kiện</td><td style='padding: 8px;'><i>After months of planning</i>, construction started.</td></tr><tr><td style='padding: 8px;'><strong style='color: #0288d1;'>After + V-ing</strong></td><td style='padding: 8px;'>Sau khi làm gì</td><td style='padding: 8px;'><i>After reviewing</i> the proposal, we approved it.</td></tr><tr><td style='padding: 8px;'><strong style='color: #0288d1;'>Prior to / Before + N</strong></td><td style='padding: 8px;'>Trước một thời điểm / sự kiện</td><td style='padding: 8px;'>Please book <i>prior to the event</i>.</td></tr></tbody></table><br/><p><strong>⚠️ Phân loại Giới từ & Mẹo làm nhanh:</strong></p><ul><li>Khi cả 4 phương án đều là <strong>Giới từ</strong>, hãy phân loại theo nhóm chức năng (Thời gian, Không gian, Lý do, Bổ sung):</li></ul><table border='1' style='width: 100%; border-collapse: collapse; border-color: #e0e0e0; margin-top: 8px; font-size: 13px;'><thead style='background-color: #f5f5f5;'><tr><th style='padding: 6px;'>Đáp án</th><th style='padding: 6px;'>Loại giới từ</th><th style='padding: 6px;'>Mối quan hệ ý nghĩa</th><th style='padding: 6px;'>Đánh giá</th></tr></thead><tbody><tr><td style='padding: 6px;'><strong>A. After</strong></td><td style='padding: 6px;'>Thời gian</td><td style='padding: 6px;'>Chỉ trình tự trước - sau</td><td style='padding: 6px; color: #2e7d32; font-weight: bold;'>✅ Đúng</td></tr><tr><td style='padding: 6px;'><strong>B. Besides</strong></td><td style='padding: 6px;'>Bổ sung</td><td style='padding: 6px;'>Ngoài ra, bên cạnh đó</td><td style='padding: 6px; color: #c62828; font-weight: bold;'>❌ Sai nghĩa</td></tr><tr><td style='padding: 6px;'><strong>C. Opposite</strong></td><td style='padding: 6px;'>Vị trí không gian</td><td style='padding: 6px;'>Đối diện</td><td style='padding: 6px; color: #c62828; font-weight: bold;'>❌ Sai nghĩa</td></tr><tr><td style='padding: 6px;'><strong>D. Alongside</strong></td><td style='padding: 6px;'>Vị trí / Đồng hành</td><td style='padding: 6px;'>Sát cạnh, cùng với</td><td style='padding: 6px; color: #c62828; font-weight: bold;'>❌ Sai nghĩa</td></tr></tbody></table></div>",
    "vocab": "<ul style='line-height: 1.6;'><li><strong style='color: #0288d1;'>record-setting</strong> (adj): lập kỷ lục, đạt mức kỷ lục (ví dụ: <i>record-setting sales / rainfall / profits</i>).</li><li><strong style='color: #0288d1;'>blue skies</strong> (n phr): bầu trời trong xanh (ngụ ý thời tiết đẹp, quang đãng).</li><li><strong style='color: #0288d1;'>expect</strong> (v): mong đợi, dự đoán (Collocation: <i>expect delays, expect good weather, expect higher demand</i>).</li><li><strong style='color: #0288d1;'>in advance of</strong> (prep phr): trước (một sự kiện).</li></ul>",
    "trans": "<div style='line-height: 1.6; padding: 8px; background-color: #f9f9f9; border-left: 4px solid #0288d1;'><p style='margin: 0 0 8px 0;'><strong>Dịch nghĩa gốc:</strong> Sau nhiều tuần mưa lớn đạt mức kỷ lục, hãy mong đợi một bầu trời trong xanh vào cuối tuần này.</p><p style='margin: 0; font-style: italic; color: #555;'><strong>Dịch tự nhiên:</strong> Sau nhiều tuần mưa liên tiếp với lượng mưa kỷ lục, cuối tuần này thời tiết sẽ chuyển biến tốt với bầu trời quang đãng.</p></div>"
  }
},
        {
  "id": 115,
  "q": "The Serenica dining table comes with levelers ______ its stability on uneven surfaces.",
  "options": [
    "ensure",
    "ensures",
    "to ensure",
    "to be ensured"
  ],
  "a": "to ensure",
  "exp": {
    "correct": "<div style='line-height: 1.6;'><p><strong>a. Phân tích thành phần câu (S-V-O):</strong></p><ul><li><strong>Chủ ngữ (S):</strong> <code>The Serenica dining table (Bàn ăn Serenica)</code></li><li><strong>Động từ chính (V):</strong> <code>comes with (Đi kèm / Được trang bị)</code></li><li><strong>Tân ngữ (O):</strong> <code>levelers (Các chân chỉnh cân bằng)</code></li><li><strong>Cụm chỉ mục đích:</strong> <code>to ensure its stability on uneven surfaces</code></li></ul><p><strong>b. Xác định loại từ & Ngữ cảnh:</strong> Mệnh đề trước chỗ trống đã hoàn chỉnh về ngữ pháp <code>(S + V + O)</code> $\rightarrow$ Không thể chia thêm một động từ chính thứ 2. Vị trí này cần một <strong>Động từ nguyên mẫu có 'to' (To-V)</strong> để diễn tả mục đích của việc cái bàn được trang bị các nút chỉnh cân bằng.</p><p><strong>c. Lý do chọn đáp án:</strong> Cấu trúc chỉ mục đích <span style='color: #2e7d32; font-weight: bold;'>to ensure</span> mang nghĩa là <i>để đảm bảo</i> (chủ động - levelers chủ động đảm bảo sự ổn định cho bàn).</p></div>",
    "wrong": "<ul style='line-height: 1.6; list-style-type: none; padding-left: 0;'><li><strong style='color: #c62828;'>❌ (A) ensure (v_inf):</strong> Động từ nguyên thể không có 'to'. Không thể đứng làm động từ chia thì thứ 2 trong câu khi chưa có liên từ nối.</li><li><strong style='color: #c62828;'>❌ (B) ensures (v-s):</strong> Động từ chia thì Hiện tại đơn (ngôi 3 số ít). Sai vì tạo ra 2 động từ chính đứng liền kề trong một mệnh đề độc lập.</li><li><strong style='color: #c62828;'>❌ (D) to be ensured (to be V3):</strong> Cấu trúc To-V Bị động (để được đảm bảo). Sai ngữ nghĩa vì chân cân bằng 'chủ động' đảm bảo sự ổn định, không phải bản thân chân cân bằng 'được' đảm bảo.</li></ul>",
    "grammar": "<div style='line-height: 1.6;'><p><strong>⭐ Cấu trúc To-Infinitive Chỉ Mục Đích (Infinitive of Purpose)</strong></p><p>Dùng để giải thích lý do tại sao một hành động được thực hiện hoặc một đồ vật được trang bị:</p><blockquote style='background: #f5f5f5; border-left: 4px solid #2e7d32; margin: 10px 0; padding: 10px;'><strong>S + V + O + to / in order to / so as to + V_inf (Để làm gì)</strong></blockquote><p><strong>💡 Các Collocations quan trọng với 'Ensure' thường gặp trong TOEIC:</strong></p><table border='1' style='width: 100%; border-collapse: collapse; border-color: #e0e0e0; margin-top: 8px; font-size: 14px;'><thead style='background-color: #f5f5f5; text-align: left;'><tr><th style='padding: 8px;'>Cụm từ Collocation</th><th style='padding: 8px;'>Ý nghĩa</th><th style='padding: 8px;'>Ví dụ thực tế</th></tr></thead><tbody><tr><td style='padding: 8px;'><strong style='color: #2e7d32;'>ensure stability</strong></td><td style='padding: 8px;'>Đảm bảo sự ổn định</td><td style='padding: 8px;'>Levelers help <i>ensure stability</i>.</td></tr><tr><td style='padding: 8px;'><strong style='color: #0288d1;'>ensure quality / safety</strong></td><td style='padding: 8px;'>Đảm bảo chất lượng / an toàn</td><td style='padding: 8px;'>Inspections <i>ensure product quality</i>.</td></tr><tr><td style='padding: 8px;'><strong style='color: #0288d1;'>ensure customer satisfaction</strong></td><td style='padding: 8px;'>Đảm bảo sự hài lòng khách hàng</td><td style='padding: 8px;'>We strive to <i>ensure customer satisfaction</i>.</td></tr></tbody></table><br/><p><strong>⚠️ Quy trình giải nhanh bẫy Động từ (Verb Forms):</strong></p><ul><li><strong>Bước 1:</strong> Kiểm tra xem câu đã có Động từ chính chia thì chưa? $\rightarrow$ Đã có <code>comes with</code>.</li><li><strong>Bước 2:</strong> Loại ngay các phương án chia thì $\rightarrow$ Loại A (ensure) và B (ensuring/ensures).</li><li><strong>Bước 3:</strong> Xét ý nghĩa Chủ động hay Bị động $\rightarrow$ Levelers chủ động đảm bảo $\rightarrow$ Chọn C (to ensure).</li></ul><table border='1' style='width: 100%; border-collapse: collapse; border-color: #e0e0e0; margin-top: 8px; font-size: 13px;'><thead style='background-color: #f5f5f5;'><tr><th style='padding: 6px;'>Đáp án</th><th style='padding: 6px;'>Hình thái V</th><th style='padding: 6px;'>Vai trò ngữ pháp</th><th style='padding: 6px;'>Đánh giá</th></tr></thead><tbody><tr><td style='padding: 6px;'><strong>A. ensure</strong></td><td style='padding: 6px;'>V_bare</td><td style='padding: 6px;'>Động từ chính / Nguyên thể bare</td><td style='padding: 6px; color: #c62828; font-weight: bold;'>❌ Sai (Thừa V chính)</td></tr><tr><td style='padding: 6px;'><strong>B. ensures</strong></td><td style='padding: 6px;'>V_s/es</td><td style='padding: 6px;'>Động từ chính chia thì</td><td style='padding: 6px; color: #c62828; font-weight: bold;'>❌ Sai (Thừa V chính)</td></tr><tr><td style='padding: 6px;'><strong>C. to ensure</strong></td><td style='padding: 6px;'>To + V_inf</td><td style='padding: 6px;'>Mục đích (Chủ động)</td><td style='padding: 6px; color: #2e7d32; font-weight: bold;'>✅ Đúng</td></tr><tr><td style='padding: 6px;'><strong>D. to be ensured</strong></td><td style='padding: 6px;'>To be + V3</td><td style='padding: 6px;'>Mục đích (Bị động)</td><td style='padding: 6px; color: #c62828; font-weight: bold;'>❌ Sai thể bị động</td></tr></tbody></table></div>",
    "vocab": "<ul style='line-height: 1.6;'><li><strong style='color: #0288d1;'>come with</strong> (phrasal v): đi kèm, được trang bị cùng (Collocation: <i>come with a warranty / accessories / instructions</i>).</li><li><strong style='color: #0288d1;'>leveler</strong> (n): chân chỉnh độ cao thăng bằng, nút điều chỉnh cân bằng.</li><li><strong style='color: #0288d1;'>stability</strong> (n): sự ổn định, độ thăng bằng.</li><li><strong style='color: #0288d1;'>uneven surface</strong> (n phr): bề mặt không bằng phẳng, gồ ghề (trái nghĩa với <i>flat / smooth surface</i>).</li><li><strong style='color: #0288d1;'>ensure</strong> (v): đảm bảo, bảo đảm.</li></ul>",
    "trans": "<div style='line-height: 1.6; padding: 8px; background-color: #f9f9f9; border-left: 4px solid #0288d1;'><p style='margin: 0 0 8px 0;'><strong>Dịch nghĩa gốc:</strong> Bàn ăn Serenica đi kèm với các nút chỉnh cân bằng để đảm bảo độ ổn định của nó trên các bề mặt không bằng phẳng.</p><p style='margin: 0; font-style: italic; color: #555;'><strong>Dịch tự nhiên:</strong> Bàn ăn Serenica được trang bị các chân điều chỉnh độ cân bằng nhằm giúp bàn luôn đứng vững trên những bề mặt gồ ghề hoặc không bằng phẳng.</p></div>"
  }
},

  "options": [

  "exp": {
    "correct": "<div style='line-height: 1.6;'><p><strong>a. Phân tích thành phần câu (S-V-O):</strong></p><ul><li><strong>Chủ ngữ (S):</strong> <code>Applicants to any open position at Allcrest Engineering (Ứng viên ứng tuyển vào bất kỳ vị trí đang tuyển nào...)</code></li><li><strong>Động từ (V):</strong> <code>can expect (Động từ khuyết thiếu + V nguyên mẫu)</code></li><li><strong>Tân ngữ (O):</strong> <code>a response (Một lời phản hồi)</code></li><li><strong>Trạng ngữ chỉ thời gian:</strong> <code>within three business days (Trong vòng 3 ngày làm việc)</code></li></ul><p><strong>b. Xác định loại từ & Ngữ cảnh:</strong> Đứng sau mạo từ <code>a</code> và động từ <code>expect</code> là vị trí của một <span style='color: #2e7d32; font-weight: bold;'>Danh từ số ít đếm được</span>. Vì cả 4 phương án đều là Danh từ, đây không phải bài kiểm tra từ loại mà là câu hỏi về <strong>Từ vựng theo Ngữ cảnh tuyển dụng</strong> và <strong>Collocation (Cụm từ cố định)</strong>.</p><p><strong>c. Lý do chọn đáp án:</strong> Danh từ <span style='color: #2e7d32; font-weight: bold;'>response</span> mang nghĩa là <i>sự phản hồi, câu trả lời</i>. Trong ngữ cảnh tuyển dụng, người nộp hồ sơ (applicants) sẽ mong đợi nhận được phản hồi từ công ty trong một khoảng thời gian nhất định.</p></div>",
    "wrong": "<ul style='line-height: 1.6; list-style-type: none; padding-left: 0;'><li><strong style='color: #c62828;'>❌ (A) degree (n):</strong> Bằng cấp, học vị (ví dụ: <i>bachelor's degree, master's degree</i>). Không ai nộp hồ sơ xin việc để mong nhận lại \"bằng cấp\" từ công ty.</li><li><strong style='color: #c62828;'>❌ (B) raise (n):</strong> Sự tăng lương (ví dụ: <i>salary raise, receive a raise</i>). Người mới ứng tuyển chưa trở thành nhân viên chính thức nên không thể mong chờ \"tăng lương\".</li><li><strong style='color: #c62828;'>❌ (C) change (n):</strong> Sự thay đổi. Đúng ngữ pháp nhưng sai hoàn toàn về ngữ nghĩa trong quy trình tuyển dụng.</li></ul>",
    "grammar": "<div style='line-height: 1.6;'><p><strong>⭐ Cấu trúc Collocation Tuyển dụng & Giao tiếp Thương mại</strong></p><p>Các cụm từ đi kèm danh từ <strong>response</strong> cực kỳ phổ biến trong đề thi TOEIC Part 5 & Part 6:</p><blockquote style='background: #f5f5f5; border-left: 4px solid #2e7d32; margin: 10px 0; padding: 10px;'><strong>expect / receive / await + a response + within + [khoảng thời gian]</strong><br/><i>(Mong đợi / Nhận / Chờ đợi phản hồi trong vòng...)</i></blockquote><p><strong>💡 Bảng so sánh các Collocations nâng cao với 'Response':</strong></p><table border='1' style='width: 100%; border-collapse: collapse; border-color: #e0e0e0; margin-top: 8px; font-size: 14px;'><thead style='background-color: #f5f5f5; text-align: left;'><tr><th style='padding: 8px;'>Collocation</th><th style='padding: 8px;'>Ý nghĩa</th><th style='padding: 8px;'>Ví dụ thực tế</th></tr></thead><tbody><tr><td style='padding: 8px;'><strong style='color: #2e7d32;'>prompt / timely response</strong></td><td style='padding: 8px;'>Phản hồi nhanh chóng / kịp thời</td><td style='padding: 8px;'>Thank you for your <i>prompt response</i>.</td></tr><tr><td style='padding: 8px;'><strong style='color: #0288d1;'>in response to</strong></td><td style='padding: 8px;'>Để phản hồi lại cái gì</td><td style='padding: 8px;'>We are writing <i>in response to</i> your inquiry.</td></tr><tr><td style='padding: 8px;'><strong style='color: #0288d1;'>response rate / time</strong></td><td style='padding: 8px;'>Tỉ lệ / Tốc độ phản hồi</td><td style='padding: 8px;'>Our customer service has a fast <i>response time</i>.</td></tr></tbody></table><br/><p><strong>⚠️ Quy trình phân tích Ngữ cảnh & Mẹo làm nhanh:</strong></p><ul><li><strong>Bước 1:</strong> Xác định từ loại cần điền $\rightarrow$ Sau <code>expect a</code> cần Danh từ. Cả 4 đáp án đều là Danh từ $\rightarrow$ Chuyển sang xét nghĩa.</li><li><strong>Bước 2:</strong> Bắt các Từ khóa Ngữ cảnh (Keywords): <code>Applicants</code> (Ứng viên) + <code>open position</code> (Vị trí tuyển) + <code>within three business days</code> (Trong 3 ngày làm việc).</li><li><strong>Bước 3:</strong> Loại trừ dựa vào quy trình logic:</li></ul><table border='1' style='width: 100%; border-collapse: collapse; border-color: #e0e0e0; margin-top: 8px; font-size: 13px;'><thead style='background-color: #f5f5f5;'><tr><th style='padding: 6px;'>Đáp án</th><th style='padding: 6px;'>Nghĩa của từ</th><th style='padding: 6px;'>Thích hợp với ngữ cảnh 'Applicants'?</th><th style='padding: 6px;'>Đánh giá</th></tr></thead><tbody><tr><td style='padding: 6px;'><strong>A. degree</strong></td><td style='padding: 6px;'>Bằng cấp</td><td style='padding: 6px;'>Không (Công ty không cấp bằng cho ứng viên)</td><td style='padding: 6px; color: #c62828; font-weight: bold;'>❌ Sai</td></tr><tr><td style='padding: 6px;'><strong>B. raise</strong></td><td style='padding: 6px;'>Sự tăng lương</td><td style='padding: 6px;'>Không (Chưa đi làm nên không được tăng lương)</td><td style='padding: 6px; color: #c62828; font-weight: bold;'>❌ Sai</td></tr><tr><td style='padding: 6px;'><strong>C. change</strong></td><td style='padding: 6px;'>Sự thay đổi</td><td style='padding: 6px;'>Không (Không khớp với quy trình nhân sự)</td><td style='padding: 6px; color: #c62828; font-weight: bold;'>❌ Sai</td></tr><tr><td style='padding: 6px;'><strong>D. response</strong></td><td style='padding: 6px;'>Sự phản hồi</td><td style='padding: 6px;'>Rất phù hợp (Kết quả sau khi nộp hồ sơ)</td><td style='padding: 6px; color: #2e7d32; font-weight: bold;'>✅ Đúng</td></tr></tbody></table></div>",
    "vocab": "<ul style='line-height: 1.6;'><li><strong style='color: #0288d1;'>applicant</strong> (n): ứng viên, người nộp đơn (Collocation: <i>job applicant, qualified applicant, applicant pool</i>).</li><li><strong style='color: #0288d1;'>open position</strong> (n phr): vị trí đang tuyển dụng, vị trí còn trống (đồng nghĩa: <i>job vacancy</i>).</li><li><strong style='color: #0288d1;'>business days</strong> (n phr): ngày làm việc (thường từ Thứ 2 đến Thứ 6, trừ Cuối tuần và Ngày lễ).</li><li><strong style='color: #0288d1;'>response</strong> (n): sự phản hồi, câu trả lời.</li><li><strong style='color: #0288d1;'>expect</strong> (v): mong chờ, hy vọng, dự đoán.</li></ul>",

        {
  "id": 117,
  "q": "______ prepares the patient’s medical records is required to maintain confidentiality.",
  "options": [
    "Whoever",
    "Who",
    "Whose",
    "What"
  ],
  "a": "Whoever",
  "exp": {
    "correct": "<div style='line-height: 1.6;'><p><strong>a. Phân tích thành phần câu (Mệnh đề Danh ngữ):</strong></p><ul><li><strong>Mệnh đề Danh ngữ (S):</strong> <code>Whoever (S1) + prepares (V1) + the patient's medical records (O1)</code></li><li><strong>Mệnh đề chính:</strong> <code>Mệnh đề Danh ngữ (S) + is required (V2) + to maintain confidentiality (C)</code></li></ul><p><strong>b. Xác định loại từ & Ngữ cảnh:</strong> Câu có 2 động từ chia thì (<i>prepares</i> và <i>is required</i>). Chỗ trống nằm ở đầu câu, đứng trước động từ <i>prepares</i>, cần một <span style='color: #2e7d32; font-weight: bold;'>Đại từ Quan hệ Bất định (Compound Relative Pronoun)</span> để vừa làm Chủ ngữ cho <i>prepares</i>, vừa mở đầu Mệnh đề Danh ngữ làm Chủ ngữ cho toàn bộ câu.</p><p><strong>c. Lý do chọn đáp án:</strong> Đại từ <span style='color: #2e7d32; font-weight: bold;'>Whoever</span> mang nghĩa là <i>bất kỳ ai</i>, chỉ người ở dạng khái quát, hoàn toàn chính xác về cả ngữ pháp lẫn ngữ cảnh quy định bảo mật.</p></div>",
    "wrong": "<ul style='line-height: 1.6; list-style-type: none; padding-left: 0;'><li><strong style='color: #c62828;'>❌ (B) Who:</strong> Đại từ quan hệ (cần có Danh từ chỉ người đứng liền trước làm Tiền ngữ) hoặc Đại từ nghi vấn. Không dùng mở đầu Mệnh đề Danh ngữ đóng vai trò 'bất kỳ ai' trong ngữ cảnh quy định.</li><li><strong style='color: #c62828;'>❌ (C) Whose:</strong> Đại từ sở hữu, bắt buộc phải có Danh từ theo liền sau (<code>Whose + N</code>), không thể đứng trực tiếp trước Động từ (<i>prepares</i>).</li><li><strong style='color: #c62828;'>❌ (D) What:</strong> Đại từ mở đầu mệnh đề danh ngữ chỉ vật/điều gì (<i>cái mà/điều mà</i>), không thể dùng để bổ nghĩa cho hành động của người chuẩn bị hồ sơ bệnh án.</li></ul>",
    "grammar": "<div style='line-height: 1.6;'><p><strong>⭐ Mệnh đề Danh ngữ làm Chủ ngữ với Whoever</strong></p><p>Cấu trúc ngữ pháp trọng tâm trong đề thi TOEIC khi diễn đạt chính sách, quy định:</p><blockquote style='background: #f5f5f5; border-left: 4px solid #2e7d32; margin: 10px 0; padding: 10px;'><strong>[Whoever + V1 + O] + V2 (chia số ít) + ...</strong><br/><i>(Bất kỳ ai làm việc X thì đều bị/được Y...)</i></blockquote><p><strong>💡 Một số cấu trúc & Cụm từ cố định (Collocations) quan trọng trong bài:</strong></p><table border='1' style='width: 100%; border-collapse: collapse; border-color: #e0e0e0; margin-top: 8px; font-size: 14px;'><thead style='background-color: #f5f5f5; text-align: left;'><tr><th style='padding: 8px;'>Cụm từ / Cấu trúc</th><th style='padding: 8px;'>Ý nghĩa</th><th style='padding: 8px;'>Ví dụ thực tế</th></tr></thead><tbody><tr><td style='padding: 8px;'><strong style='color: #2e7d32;'>maintain confidentiality</strong></td><td style='padding: 8px;'>Duy trì / giữ gìn tính bảo mật</td><td style='padding: 8px;'>Staff must <i>maintain confidentiality</i>.</td></tr><tr><td style='padding: 8px;'><strong style='color: #0288d1;'>be required to V</strong></td><td style='padding: 8px;'>Được yêu cầu / bắt buộc phải làm gì</td><td style='padding: 8px;'>You are <i>required to sign</i> the form.</td></tr><tr><td style='padding: 8px;'><strong style='color: #0288d1;'>medical records</strong></td><td style='padding: 8px;'>Hồ sơ bệnh án</td><td style='padding: 8px;'>Access to <i>medical records</i> is restricted.</td></tr></tbody></table><br/><p><strong>⚠️ Mẹo làm nhanh dạng bài Noun Clause (Mệnh đề Danh ngữ):</strong></p><ul><li>Đếm số động từ chia thì trong câu: Nhận diện thấy 2 động từ (<code>prepares</code> và <code>is required</code>) $\rightarrow$ Cần từ nối mở đầu Mệnh đề.</li><li>Phân tích nhanh 4 phương án:</li></ul><table border='1' style='width: 100%; border-collapse: collapse; border-color: #e0e0e0; margin-top: 8px; font-size: 13px;'><thead style='background-color: #f5f5f5;'><tr><th style='padding: 6px;'>Đáp án</th><th style='padding: 6px;'>Loại từ / Vai trò</th><th style='padding: 6px;'>Điều kiện đi kèm</th><th style='padding: 6px;'>Đánh giá</th></tr></thead><tbody><tr><td style='padding: 6px;'><strong>A. Whoever</strong></td><td style='padding: 6px;'>Indefinite Relative Pronoun</td><td style='padding: 6px;'>Làm Chủ ngữ chỉ người (Bất kỳ ai)</td><td style='padding: 6px; color: #2e7d32; font-weight: bold;'>✅ Đúng</td></tr><tr><td style='padding: 6px;'><strong>B. Who</strong></td><td style='padding: 6px;'>Relative Pronoun</td><td style='padding: 6px;'>Cần Danh từ chỉ người đứng trước</td><td style='padding: 6px; color: #c62828; font-weight: bold;'>❌ Sai</td></tr><tr><td style='padding: 6px;'><strong>C. Whose</strong></td><td style='padding: 6px;'>Possessive Pronoun</td><td style='padding: 6px;'>Cần Danh từ đi liền sau (Whose + N)</td><td style='padding: 6px; color: #c62828; font-weight: bold;'>❌ Sai</td></tr><tr><td style='padding: 6px;'><strong>D. What</strong></td><td style='padding: 6px;'>Noun Clause Pronoun</td><td style='padding: 6px;'>Chỉ vật / điều mà (không chỉ người)</td><td style='padding: 6px; color: #c62828; font-weight: bold;'>❌ Sai</td></tr></tbody></table></div>",
    "vocab": "<ul style='line-height: 1.6;'><li><strong style='color: #0288d1;'>whoever</strong> (pronoun): bất kỳ ai (= anyone who).</li><li><strong style='color: #0288d1;'>medical records</strong> (n phr): hồ sơ bệnh án.</li><li><strong style='color: #0288d1;'>maintain confidentiality</strong> (v phr): duy trì / giữ gìn tính bảo mật.</li><li><strong style='color: #0288d1;'>be required to</strong> (v phr): được yêu cầu / bắt buộc phải làm gì.</li><li><strong style='color: #0288d1;'>patient</strong> (n): bệnh nhân.</li></ul>",
    "trans": "<div style='line-height: 1.6; padding: 8px; background-color: #f9f9f9; border-left: 4px solid #0288d1;'><p style='margin: 0 0 8px 0;'><strong>Dịch nghĩa gốc:</strong> Bất kỳ ai chuẩn bị hồ sơ bệnh án của bệnh nhân đều được yêu cầu phải duy trì tính bảo mật.</p><p style='margin: 0; font-style: italic; color: #555;'><strong>Dịch tự nhiên:</strong> Bất kỳ ai chịu trách nhiệm chuẩn bị hồ sơ bệnh án cho bệnh nhân đều có nghĩa vụ phải giữ bí mật thông tin.</p></div>"
  }
},

  "id": 118,
  "q": "Because of the high demand for our services, our office was ______ expanded last year.",
  "options": [
    "significantly",
    "tightly",
    "remotely",
    "identically"
  ],
  "a": "significantly",
  "exp": {
    "correct": "<div style='line-height: 1.6;'><p><strong>a. Phân tích thành phần câu (Trạng ngữ & Mệnh đề chính):</strong></p><ul><li><strong>Trạng ngữ chỉ nguyên nhân:</strong> <code>Because of the high demand for our services (Cụm Giới từ)</code></li><li><strong>Mệnh đề chính (Bị động):</strong> <code>our office (S) + was (be) + significantly (Adv) + expanded (V3/ed) + last year (Trạng ngữ thời gian)</code></li></ul><p><strong>b. Xác định loại từ & Ngữ cảnh:</strong> Chỗ trống kẹp giữa động từ to be (<i>was</i>) và Động từ dạng phân từ hai (<i>expanded</i>). Cấu trúc <code>be + [...] + V3/ed</code> yêu cầu một <span style='color: #2e7d32; font-weight: bold;'>Trạng từ (Adverb)</span> bổ nghĩa cho hành động bị động. Về ngữ cảnh, do nhu cầu dịch vụ tăng cao (<i>high demand</i>), việc mở rộng văn phòng diễn ra ở mức độ lớn/đáng kể.</p><p><strong>c. Lý do chọn đáp án:</strong> Trạng từ <span style='color: #2e7d32; font-weight: bold;'>significantly</span> mang nghĩa là <i>đáng kể, rất nhiều</i>, tạo thành kết hợp từ (collocation) vô cùng tự nhiên và phổ biến trong TOEIC: <i>significantly expanded</i>.</p></div>",
    "wrong": "<ul style='line-height: 1.6; list-style-type: none; padding-left: 0;'><li><strong style='color: #c62828;'>❌ (B) tightly (adv):</strong> Một cách chặt chẽ, sít sao (Thường đi với: <i>tightly closed, tightly controlled</i>). Không thể ghép với <i>expanded</i>.</li><li><strong style='color: #c62828;'>❌ (C) remotely (adv):</strong> Từ xa (Thường đi với: <i>work remotely, access remotely</i>). Văn phòng không thể 'mở rộng từ xa'.</li><li><strong style='color: #c62828;'>❌ (D) identically (adv):</strong> Một cách giống hệt nhau (Thường đi với: <i>identically dressed, identically designed</i>). Sai cả ngữ cảnh lẫn kết hợp từ.</li></ul>",
    "grammar": "<div style='line-height: 1.6;'><p><strong>⭐ Vị trí Trạng từ trong Câu Bị động & Collocations trong TOEIC</strong></p><p>Trạng từ bổ nghĩa cho động từ bị động thường được đặt ở vị trí xen giữa:</p><blockquote style='background: #f5f5f5; border-left: 4px solid #2e7d32; margin: 10px 0; padding: 10px;'><strong>Subject + be + Adverb + V3/ed</strong></blockquote><p><strong>💡 Các trạng từ đồng nghĩa chỉ mức độ \"Đáng kể / Lớn\" cực kỳ hay gặp trong Part 5:</strong></p><table border='1' style='width: 100%; border-collapse: collapse; border-color: #e0e0e0; margin-top: 8px; font-size: 14px;'><thead style='background-color: #f5f5f5; text-align: left;'><tr><th style='padding: 8px;'>Trạng từ</th><th style='padding: 8px;'>Ý nghĩa</th><th style='padding: 8px;'>Động từ hay đi cùng (Collocations)</th></tr></thead><tbody><tr><td style='padding: 8px;'><strong style='color: #2e7d32;'>significantly</strong></td><td style='padding: 8px;'>Đáng kể, nhiều</td><td style='padding: 8px;'><i>significantly expand / increase / improve</i></td></tr><tr><td style='padding: 8px;'><strong style='color: #0288d1;'>considerably</strong></td><td style='padding: 8px;'>Đáng kể</td><td style='padding: 8px;'><i>considerably grow / reduce / affect</i></td></tr><tr><td style='padding: 8px;'><strong style='color: #0288d1;'>substantially</strong></td><td style='padding: 8px;'>Thực sự / Đáng kể</td><td style='padding: 8px;'><i>substantially lower / rise / alter</i></td></tr></tbody></table><br/><p><strong>⚠️ Phân tích 4 phương án Trạng từ theo ngữ cảnh & Collocation:</strong></p><table border='1' style='width: 100%; border-collapse: collapse; border-color: #e0e0e0; margin-top: 8px; font-size: 13px;'><thead style='background-color: #f5f5f5;'><tr><th style='padding: 6px;'>Đáp án</th><th style='padding: 6px;'>Ý nghĩa</th><th style='padding: 6px;'>Khả năng đi với \"expanded\"</th><th style='padding: 6px;'>Đánh giá</th></tr></thead><tbody><tr><td style='padding: 6px;'><strong>A. significantly</strong></td><td style='padding: 6px;'>Đáng kể, rất nhiều</td><td style='padding: 6px;'>Hoàn toàn phù hợp (Chỉ quy mô)</td><td style='padding: 6px; color: #2e7d32; font-weight: bold;'>✅ Đúng</td></tr><tr><td style='padding: 6px;'><strong>B. tightly</strong></td><td style='padding: 6px;'>Chặt chẽ, sít sao</td><td style='padding: 6px;'>Không tự nhiên (Không có cụm)</td><td style='padding: 6px; color: #c62828; font-weight: bold;'>❌ Sai</td></tr><tr><td style='padding: 6px;'><strong>C. remotely</strong></td><td style='padding: 6px;'>Từ xa</td><td style='padding: 6px;'>Sai nghĩa (Không thể mở rộng từ xa)</td><td style='padding: 6px; color: #c62828; font-weight: bold;'>❌ Sai</td></tr><tr><td style='padding: 6px;'><strong>D. identically</strong></td><td style='padding: 6px;'>Giống hệt nhau</td><td style='padding: 6px;'>Không hợp lý</td><td style='padding: 6px; color: #c62828; font-weight: bold;'>❌ Sai</td></tr></tbody></table></div>",
    "vocab": "<ul style='line-height: 1.6;'><li><strong style='color: #0288d1;'>significantly</strong> (adv): một cách đáng kể, rất nhiều.</li><li><strong style='color: #0288d1;'>expand</strong> (v): mở rộng (quy mô, diện tích, thị trường).</li><li><strong style='color: #0288d1;'>high demand for</strong> (n phr): nhu cầu cao đối với (dịch vụ/sản phẩm).</li><li><strong style='color: #0288d1;'>work remotely</strong> (v phr): làm việc từ xa.</li><li><strong style='color: #0288d1;'>tightly controlled</strong> (adj phr): được kiểm soát chặt chẽ.</li></ul>",
    "trans": "<div style='line-height: 1.6; padding: 8px; background-color: #f9f9f9; border-left: 4px solid #0288d1;'><p style='margin: 0 0 8px 0;'><strong>Dịch nghĩa gốc:</strong> Bởi vì nhu cầu cao đối với các dịch vụ của chúng tôi, văn phòng của chúng tôi đã được mở rộng một cách đáng kể vào năm ngoái.</p><p style='margin: 0; font-style: italic; color: #555;'><strong>Dịch tự nhiên:</strong> Do nhu cầu sử dụng dịch vụ tăng mạnh, văn phòng của chúng tôi đã được mở rộng đáng kể trong năm qua.</p></div>"
  }
},

    "wrong": "<ul style='line-height: 1.6; list-style-type: none; padding-left: 0;'><li><strong style='color: #c62828;'>❌ (A) sustain (v):</strong> Duy trì, chống đỡ. Động từ nguyên mẫu không thể đứng trước danh từ <i>architecture</i> để bổ nghĩa.</li><li><strong style='color: #c62828;'>❌ (C) sustainer (n):</strong> Người hoặc vật duy trì. Danh từ ghép <i>sustainer architecture</i> không tạo thành cụm từ tự nhiên và sai ngữ cảnh.</li><li><strong style='color: #c62828;'>❌ (D) sustains (v-s):</strong> Động từ chia ngôi thứ 3 số ít. Sai hoàn toàn về mặt từ loại trong vị trí này.</li></ul>",
    "grammar": "<div style='line-height: 1.6;'><p><strong>⭐ Cấu trúc Cụm Danh từ chứa Tính từ bổ nghĩa (Part of Speech)</strong></p><p>Một trong những dạng bài ngữ pháp kinh điển nhất của TOEIC Part 5 là xác định tính từ đứng trước danh từ trong cụm giới từ:</p><blockquote style='background: #f5f5f5; border-left: 4px solid #2e7d32; margin: 10px 0; padding: 10px;'><strong>Preposition + Adjective + Noun</strong></blockquote><p><strong>💡 Các Cụm Danh từ (Collocations) phổ biến đi với \"Sustainable\" trong TOEIC:</strong></p><table border='1' style='width: 100%; border-collapse: collapse; border-color: #e0e0e0; margin-top: 8px; font-size: 14px;'><thead style='background-color: #f5f5f5; text-align: left;'><tr><th style='padding: 8px;'>Cụm từ</th><th style='padding: 8px;'>Ý nghĩa</th><th style='padding: 8px;'>Ví dụ ngữ cảnh</th></tr></thead><tbody><tr><td style='padding: 8px;'><strong style='color: #2e7d32;'>sustainable architecture</strong></td><td style='padding: 8px;'>Kiến trúc bền vững</td><td style='padding: 8px;'><i>green building design, eco-friendly materials</i></td></tr><tr><td style='padding: 8px;'><strong style='color: #0288d1;'>sustainable development</strong></td><td style='padding: 8px;'>Phát triển bền vững</td><td style='padding: 8px;'><i>economic growth, environmental care</i></td></tr><tr><td style='padding: 8px;'><strong style='color: #0288d1;'>sustainable energy</strong></td><td style='padding: 8px;'>Năng lượng tái tạo / bền vững</td><td style='padding: 8px;'><i>solar power, wind energy</i></td></tr></tbody></table><br/><p><strong>⚠️ Phân tích 4 phương án theo Họ từ (Word Family) & Vị trí:</strong></p><table border='1' style='width: 100%; border-collapse: collapse; border-color: #e0e0e0; margin-top: 8px; font-size: 13px;'><thead style='background-color: #f5f5f5;'><tr><th style='padding: 6px;'>Đáp án</th><th style='padding: 6px;'>Từ loại</th><th style='padding: 6px;'>Ý nghĩa</th><th style='padding: 6px;'>Đánh giá</th></tr></thead><tbody><tr><td style='padding: 6px;'><strong>A. sustain</strong></td><td style='padding: 6px;'>Verb (v)</td><td style='padding: 6px;'>Duy trì, chống đỡ</td><td style='padding: 6px; color: #c62828; font-weight: bold;'>❌ Sai từ loại</td></tr><tr><td style='padding: 6px;'><strong>B. sustainable</strong></td><td style='padding: 6px;'>Adjective (adj)</td><td style='padding: 6px;'>Bền vững, thân thiện môi trường</td><td style='padding: 6px; color: #2e7d32; font-weight: bold;'>✅ Đúng từ loại & nghĩa</td></tr><tr><td style='padding: 6px;'><strong>C. sustainer</strong></td><td style='padding: 6px;'>Noun (n)</td><td style='padding: 6px;'>Người / vật duy trì</td><td style='padding: 6px; color: #c62828; font-weight: bold;'>❌ Sai kết hợp từ</td></tr><tr><td style='padding: 6px;'><strong>D. sustains</strong></td><td style='padding: 6px;'>Verb (v-s)</td><td style='padding: 6px;'>Duy trì (chia số ít)</td><td style='padding: 6px; color: #c62828; font-weight: bold;'>❌ Sai từ loại</td></tr></tbody></table><br/><p><strong>🎯 Bẫy TOEIC & Mẹo làm nhanh:</strong></p><ul><li><strong>Mẹo 3 giây:</strong> Khi gặp công thức <code>Prep + ______ + Noun</code>, hãy tìm ngay <strong>Adjective</strong> trong các lựa chọn trước khi đọc hiểu.</li><li><strong>Cấu trúc bị động mở rộng:</strong> <code>award A to B</code> ➔ <code>A + be awarded to B</code> (được trao giải thưởng/hợp đồng cho ai).</li></ul></div>",
    "vocab": "<ul style='line-height: 1.6;'><li><strong style='color: #0288d1;'>sustainable architecture</strong> (n phr): kiến trúc bền vững (thân thiện với môi trường).</li><li><strong style='color: #0288d1;'>be awarded to sb</strong> (v phr): được trao giải thưởng cho ai.</li><li><strong style='color: #0288d1;'>sustain</strong> (v): duy trì, chống đỡ, chịu đựng.</li><li><strong style='color: #0288d1;'>sustainer</strong> (n): người hoặc vật duy trì.</li><li><strong style='color: #0288d1;'>prize for sth</strong> (n phr): giải thưởng dành cho lĩnh vực / thành tựu gì.</li></ul>",

        {
  "id": 120,
  "q": "We have been ______ problems with the thermostat in the western end of the warehouse.",
  "options": [
    "experiencing",
    "regarding",
    "repurposing",
    "establishing"
  ],
  "a": "experiencing",
  "exp": {
    "correct": "<div style='line-height: 1.6;'><p><strong>a. Phân tích thành phần câu (S - V - O):</strong></p><ul><li><strong>Chủ ngữ (S):</strong> <code>We</code></li><li><strong>Động từ (V):</strong> <code>have been experiencing (Thì Hiện tại hoàn thành tiếp diễn)</code></li><li><strong>Tân ngữ (O):</strong> <code>problems (Danh từ)</code></li><li><strong>Cụm bổ nghĩa:</strong> <code>with the thermostat (với bộ điều chỉnh nhiệt độ) + in the western end of the warehouse (ở phía tây nhà kho)</code></li></ul><p><strong>b. Xác định loại từ & Ngữ cảnh:</strong> Cấu trúc <code>have been + V-ing</code> chỉ hành động kéo dài liên tục từ quá khứ đến hiện tại. Phía sau chỗ trống có tân ngữ danh từ <i>problems</i>, thể hiện hành động ở thể chủ động mang nghĩa \"đang gặp phải / trải qua sự cố\".</p><p><strong>c. Lý do chọn đáp án:</strong> Động từ <span style='color: #2e7d32; font-weight: bold;'>experiencing</span> tạo thành kết hợp từ (collocation) cực kỳ phổ biến trong môi trường làm việc và bài thi TOEIC: <i>experience problems / difficulties / issues</i> (gặp phải sự cố/khó khăn).</p></div>",
    "wrong": "<ul style='line-height: 1.6; list-style-type: none; padding-left: 0;'><li><strong style='color: #c62828;'>❌ (B) regarding:</strong> Liên quan đến (thường đóng vai trò giới từ) hoặc coi như. Cấu trúc <i>regard A as B</i> không đi trực tiếp với <i>problems</i> theo nghĩa \"gặp sự cố\".</li><li><strong style='color: #c62828;'>❌ (C) repurposing (v-ing):</strong> Tái sử dụng cho mục đích khác (ví dụ: <i>repurpose old furniture</i>). Không thể đi với <i>problems</i>.</li><li><strong style='color: #c62828;'>❌ (D) establishing (v-ing):</strong> Thành lập, thiết lập (ví dụ: <i>establish a company / policy</i>). Không phù hợp ngữ nghĩa khi ghép với <i>problems</i>.</li></ul>",
    "grammar": "<div style='line-height: 1.6;'><p><strong>⭐ Cấu trúc Thì Hiện tại hoàn thành tiếp diễn & Collocations đi với \"Problems\"</strong></p><p>Thì hiện tại hoàn thành tiếp diễn diễn tả hành động bắt đầu trong quá khứ, kéo dài liên tục đến hiện tại và có thể còn tiếp diễn:</p><blockquote style='background: #f5f5f5; border-left: 4px solid #2e7d32; margin: 10px 0; padding: 10px;'><strong>Subject + have/has been + V-ing + Object</strong></blockquote><p><strong>💡 Các Động từ kết hợp (Collocations) rất hay gặp với \"Problems / Issues / Delays\" trong TOEIC:</strong></p><table border='1' style='width: 100%; border-collapse: collapse; border-color: #e0e0e0; margin-top: 8px; font-size: 14px;'><thead style='background-color: #f5f5f5; text-align: left;'><tr><th style='padding: 8px;'>Cụm từ cố định</th><th style='padding: 8px;'>Ý nghĩa</th><th style='padding: 8px;'>Ví dụ ngữ cảnh</th></tr></thead><tbody><tr><td style='padding: 8px;'><strong style='color: #2e7d32;'>experience problems / issues</strong></td><td style='padding: 8px;'>Gặp phải sự cố / vấn đề</td><td style='padding: 8px;'><i>technical issues, equipment failure</i></td></tr><tr><td style='padding: 8px;'><strong style='color: #0288d1;'>experience delays</strong></td><td style='padding: 8px;'>Gặp phải sự chậm trễ</td><td style='padding: 8px;'><i>shipment delays, flight delays</i></td></tr><tr><td style='padding: 8px;'><strong style='color: #0288d1;'>experience difficulties</strong></td><td style='padding: 8px;'>Gặp phải khó khăn</td><td style='padding: 8px;'><i>financial difficulties, operation struggle</i></td></tr></tbody></table><br/><p><strong>⚠️ Phân tích 4 phương án theo Ngữ cảnh & Kết hợp từ:</strong></p><table border='1' style='width: 100%; border-collapse: collapse; border-color: #e0e0e0; margin-top: 8px; font-size: 13px;'><thead style='background-color: #f5f5f5;'><tr><th style='padding: 6px;'>Đáp án</th><th style='padding: 6px;'>Từ loại</th><th style='padding: 6px;'>Khả năng đi với \"problems\"</th><th style='padding: 6px;'>Đánh giá</th></tr></thead><tbody><tr><td style='padding: 6px;'><strong>A. experiencing</strong></td><td style='padding: 6px;'>V-ing</td><td style='padding: 6px;'>Cụm chuẩn (gặp sự cố)</td><td style='padding: 6px; color: #2e7d32; font-weight: bold;'>✅ Đúng</td></tr><tr><td style='padding: 6px;'><strong>B. regarding</strong></td><td style='padding: 6px;'>Prep / V-ing</td><td style='padding: 6px;'>Không tự nhiên / Sai nghĩa</td><td style='padding: 6px; color: #c62828; font-weight: bold;'>❌ Sai</td></tr><tr><td style='padding: 6px;'><strong>C. repurposing</strong></td><td style='padding: 6px;'>V-ing</td><td style='padding: 6px;'>Sai ngữ nghĩa hoàn toàn</td><td style='padding: 6px; color: #c62828; font-weight: bold;'>❌ Sai</td></tr><tr><td style='padding: 6px;'><strong>D. establishing</strong></td><td style='padding: 6px;'>V-ing</td><td style='padding: 6px;'>Sai ngữ nghĩa hoàn toàn</td><td style='padding: 6px; color: #c62828; font-weight: bold;'>❌ Sai</td></tr></tbody></table><br/><p><strong>🎯 Bẫy TOEIC & Mẹo làm nhanh:</strong></p><ul><li><strong>Bẫy Chủ động vs Bị động:</strong> Dạng <code>have been + ___</code> dễ làm thí sinh nhầm với thể bị động <code>have been + V3/ed</code>. Tuy nhiên phía sau có tân ngữ <i>problems</i> nên bắt buộc phải dùng thể chủ động tiếp diễn <code>have been + V-ing</code>.</li><li><strong>Mẹo Collocation:</strong> Khi thấy các động từ như <code>experience / encounter / face</code> đi với <i>problems / issues / delays</i>, đây là bộ đôi từ cố định luôn được ưu tiên lựa chọn.</li></ul></div>",
    "vocab": "<ul style='line-height: 1.6;'><li><strong style='color: #0288d1;'>experience problems</strong> (v phr): gặp phải sự cố / vấn đề.</li><li><strong style='color: #0288d1;'>thermostat</strong> (n): bộ điều chỉnh nhiệt độ.</li><li><strong style='color: #0288d1;'>warehouse</strong> (n): nhà kho.</li><li><strong style='color: #0288d1;'>western end</strong> (n phr): khu vực/phần phía tây.</li><li><strong style='color: #0288d1;'>repurpose</strong> (v): tái sử dụng cho mục đích khác.</li></ul>",
    "trans": "<div style='line-height: 1.6; padding: 8px; background-color: #f9f9f9; border-left: 4px solid #0288d1;'><p style='margin: 0 0 8px 0;'><strong>Dịch nghĩa gốc:</strong> Chúng tôi đã và đang gặp phải các vấn đề với bộ điều chỉnh nhiệt độ ở khu vực phía tây của nhà kho.</p><p style='margin: 0; font-style: italic; color: #555;'><strong>Dịch tự nhiên:</strong> Chúng tôi dạo gần đây đang gặp phải một số sự cố với bộ điều chỉnh nhiệt độ ở khu vực phía tây của nhà kho.</p></div>"
  }

x;'>Verb (v)</td><td style='padding: 6px;'>Sai (2 động từ đứng cạnh nhau)</td><td style='padding: 6px; color: #c62828; font-weight: bold;'>❌ Sai ngữ pháp</td></tr><tr><td style='padding: 6px;'><strong>B. collaborative</strong></td><td style='padding: 6px;'>Adjective (adj)</td><td style='padding: 6px;'>Sai (Tính từ không bổ nghĩa động từ)</td><td style='padding: 6px; color: #c62828; font-weight: bold;'>❌ Sai từ loại</td></tr><tr><td style='padding: 6px;'><strong>C. collaboratively</strong></td><td style='padding: 6px;'>Adverb (adv)</td><td style='padding: 6px;'>Đúng (Trạng từ bổ nghĩa cho worked)</td><td style='padding: 6px; color: #2e7d32; font-weight: bold;'>✅ Đúng</td></tr><tr><td style='padding: 6px;'><strong>D. collaborated</strong></td><td style='padding: 6px;'>Verb (v-ed)</td><td style='padding: 6px;'>Sai (Trùng lặp động từ quá khứ)</td><td style='padding: 6px; color: #c62828; font-weight: bold;'>❌ Sai ngữ pháp</td></tr></tbody></table><br/><p><strong>🎯 Bẫy TOEIC & Mẹo làm nhanh:</strong></p><ul><li><strong>Mẹo làm nhanh:</strong> Khi gặp dạng <code>Verb + ______</code>, hãy tự hỏi: Chỗ trống mô tả hành động diễn ra như thế nào? Nếu có, ưu tiên chọn <strong>Adverb (-ly)</strong>.</li><li><strong>Phân biệt cấu trúc:</strong> Nếu muốn dùng động từ <i>collaborate</i>, câu phải viết là <code>collaborate on sth</code> chứ không đi sau <i>worked</i> (tránh lỗi <i>worked collaborate</i>).</li></ul></div>",
    "vocab": "<ul style='line-height: 1.6;'><li><strong style='color: #0288d1;'>work collaboratively</strong> (v phr): phối hợp làm việc cùng nhau.</li><li><strong style='color: #0288d1;'>collaborate on sth</strong> (v phr): hợp tác thực hiện dự án/công việc gì.</li><li><strong style='color: #0288d1;'>collaborative effort</strong> (n phr): nỗ lực hợp tác.</li><li><strong style='color: #0288d1;'>design of...</strong> (n phr): bản thiết kế / sự thiết kế của...</li></ul>",

  "options": [

    "smart",
    "close",

  "a": "exact",
  "exp": {
    "correct": "<div style='line-height: 1.6;'><p><strong>a. Phân tích thành phần câu (S - V - O):</strong></p><ul><li><strong>Chủ ngữ (S):</strong> <code>The images displayed on our gallery’s Web site (Cụm danh từ chứa mệnh đề quan hệ rút gọn dạng V3/ed)</code></li><li><strong>Động từ (V):</strong> <code>may not reflect (Động từ khuyết thiếu + V nguyên mẫu)</code></li><li><strong>Tân ngữ (O):</strong> <code>the exact colors of the artwork for sale (Cụm danh từ)</code></li></ul><p><strong>b. Xác định loại từ & Ngữ cảnh:</strong> Chỗ trống đứng sau mạo từ <i>the</i> và đứng trước danh từ <i>colors</i>. Cấu trúc <code>Article + [...] + Noun</code> yêu cầu một <span style='color: #2e7d32; font-weight: bold;'>Tính từ (Adjective)</span> để bổ nghĩa. Do cả 4 đáp án đều là tính từ nên câu hỏi tập trung vào <span style='color: #2e7d32; font-weight: bold;'>Ngữ nghĩa & Kết hợp từ</span> (Vocabulary & Collocation).</p><p><strong>c. Lý do chọn đáp án:</strong> Tính từ <span style='color: #2e7d32; font-weight: bold;'>exact</span> mang nghĩa là <i>chính xác, thực tế</i>, ghép với danh từ phía sau tạo thành kết hợp từ tự nhiên: <i>the exact colors</i> (màu sắc thực tế / chuẩn xác của sản phẩm).</p></div>",
    "wrong": "<ul style='line-height: 1.6; list-style-type: none; padding-left: 0;'><li><strong style='color: #c62828;'>❌ (A) loyal (adj):</strong> Trung thành (thường đi với: <i>loyal customer, loyal employee</i>). Không dùng để mô tả đặc tính màu sắc.</li><li><strong style='color: #c62828;'>❌ (B) smart (adj):</strong> Thông minh, bảnh bao (thường đi với: <i>smart phone, smart clothes</i>). Không phù hợp ngữ cảnh độ hiển thị màu sắc.</li><li><strong style='color: #c62828;'>❌ (C) close (adj):</strong> Gần gũi, gần giống. Cụm <i>close colors</i> không thể hiện chuẩn xác ý nghĩa \"màu sắc chính xác / thực tế\" của sản phẩm nghệ thuật.</li></ul>",
    "grammar": "<div style='line-height: 1.6;'><p><strong>⭐ Cụm Danh từ & Collocations kiểm tra Độ chính xác trong TOEIC</strong></p><p>Dạng bài tập từ vựng có các đáp án cùng loại từ (tính từ) đòi hỏi thí sinh phải dựa vào danh từ được bổ nghĩa và ngữ cảnh thương mại điện tử / mua sắm trực tuyến:</p><blockquote style='background: #f5f5f5; border-left: 4px solid #2e7d32; margin: 10px 0; padding: 10px;'><strong>Article + Adjective + Noun</strong></blockquote><p><strong>💡 Các Kết hợp từ (Collocations) phổ biến với \"Exact / Actual\" trong bài thi TOEIC:</strong></p><table border='1' style='width: 100%; border-collapse: collapse; border-color: #e0e0e0; margin-top: 8px; font-size: 14px;'><thead style='background-color: #f5f5f5; text-align: left;'><tr><th style='padding: 8px;'>Cụm từ cố định</th><th style='padding: 8px;'>Ý nghĩa</th><th style='padding: 8px;'>Ví dụ ngữ cảnh</th></tr></thead><tbody><tr><td style='padding: 8px;'><strong style='color: #2e7d32;'>exact colors / size</strong></td><td style='padding: 8px;'>Màu sắc / Kích thước chuẩn xác</td><td style='padding: 8px;'><i>online photos vs real product</i></td></tr><tr><td style='padding: 8px;'><strong style='color: #0288d1;'>reflect reality / truth</strong></td><td style='padding: 8px;'>Phản ánh thực tế / sự thật</td><td style='padding: 8px;'><i>accurate preview, reporting</i></td></tr><tr><td style='padding: 8px;'><strong style='color: #0288d1;'>artwork for sale</strong></td><td style='padding: 8px;'>Tác phẩm nghệ thuật đang rao bán</td><td style='padding: 8px;'><i>art gallery, auction</i></td></tr></tbody></table><br/><p><strong>⚠️ Phân tích 4 phương án Tính từ theo Ngữ cảnh:</strong></p><table border='1' style='width: 100%; border-collapse: collapse; border-color: #e0e0e0; margin-top: 8px; font-size: 13px;'><thead style='background-color: #f5f5f5;'><tr><th style='padding: 6px;'>Đáp án</th><th style='padding: 6px;'>Từ loại</th><th style='padding: 6px;'>Khả năng ghép với \"colors\"</th><th style='padding: 6px;'>Đánh giá</th></tr></thead><tbody><tr><td style='padding: 6px;'><strong>A. loyal</strong></td><td style='padding: 6px;'>Adjective</td><td style='padding: 6px;'>Không phù hợp (Trung thành)</td><td style='padding: 6px; color: #c62828; font-weight: bold;'>❌ Sai nghĩa</td></tr><tr><td style='padding: 6px;'><strong>B. smart</strong></td><td style='padding: 6px;'>Adjective</td><td style='padding: 6px;'>Không phù hợp (Thông minh)</td><td style='padding: 6px; color: #c62828; font-weight: bold;'>❌ Sai nghĩa</td></tr><tr><td style='padding: 6px;'><strong>C. close</strong></td><td style='padding: 6px;'>Adjective</td><td style='padding: 6px;'>Không chuẩn xác (Gần giống)</td><td style='padding: 6px; color: #c62828; font-weight: bold;'>❌ Sai nghĩa</td></tr><tr><td style='padding: 6px;'><strong>D. exact</strong></td><td style='padding: 6px;'>Adjective</td><td style='padding: 6px;'>Chuẩn kết hợp từ (Chính xác/Thực tế)</td><td style='padding: 6px; color: #2e7d32; font-weight: bold;'>✅ Đúng</td></tr></tbody></table><br/><p><strong>🎯 Bẫy TOEIC & Mẹo làm nhanh:</strong></p><ul><li><strong>Bẫy cùng Từ loại:</strong> Khi cả 4 phương án đều là Tính từ, mẹo nhìn từ loại không áp dụng được. Bạn cần xét sự kết hợp giữa động từ phía trước (<i>reflect</i>) và danh từ phía sau (<i>colors</i>).</li><li><strong>Ngữ cảnh E-commerce / Website:</strong> Các thông báo trực tuyến thường dùng cụm <i>may not reflect exact/actual colors</i> để cảnh báo về độ chênh lệch màu sắc giữa màn hình và sản phẩm thực tế.</li></ul></div>",
    "vocab": "<ul style='line-height: 1.6;'><li><strong style='color: #0288d1;'>reflect the exact colors</strong> (v phr): phản ánh màu sắc chính xác / thực tế.</li><li><strong style='color: #0288d1;'>artwork for sale</strong> (n phr): tác phẩm nghệ thuật đang rao bán.</li><li><strong style='color: #0288d1;'>reflect</strong> (v): phản ánh, thể hiện.</li><li><strong style='color: #0288d1;'>displayed on</strong> (v phr): được hiển thị trên.</li><li><strong style='color: #0288d1;'>loyal customer</strong> (n phr): khách hàng trung thành.</li></ul>",
    "trans": "<div style='line-height: 1.6; padding: 8px; background-color: #f9f9f9; border-left: 4px solid #0288d1;'><p style='margin: 0 0 8px 0;'><strong>Dịch nghĩa gốc:</strong> Các hình ảnh được hiển thị trên trang web phòng trưng bày của chúng tôi có thể sẽ không phản ánh màu sắc chính xác của tác phẩm nghệ thuật đang được rao bán.</p><p style='margin: 0; font-style: italic; color: #555;'><strong>Dịch tự nhiên:</strong> Những hình ảnh hiển thị trên trang web của phòng trưng bày có thể không phản ánh hoàn toàn chính xác màu sắc thực tế của các tác phẩm nghệ thuật đang được bày bán.</p></div>"
  }
},

    "wrong": "<ul style='line-height: 1.6; list-style-type: none; padding-left: 0;'><li><strong style='color: #c62828;'>❌ (A) inquirers (n-plural):</strong> Người hỏi / người yêu cầu thông tin. Động từ <i>answer</i> trong văn cảnh này đi với nội dung thắc mắc (câu hỏi/yêu cầu), không ghép thành <i>customers' inquirers</i> (người hỏi của khách hàng).</li><li><strong style='color: #c62828;'>❌ (B) inquired (v-ed):</strong> Đã hỏi / đã yêu cầu. Không thể đứng trực tiếp sau sở hữu cách <i>customers’</i>.</li><li><strong style='color: #c62828;'>❌ (C) to inquire (to V):</strong> Để hỏi. Sai từ loại vì dạng động từ nguyên mẫu có 'to' không đứng sau sở hữu cách.</li></ul>",

;'>Đánh giá</th></tr></thead><tbody><tr><td style='padding: 6px;'><strong>A. inquirers</strong></td><td style='padding: 6px;'>Noun (chỉ người)</td><td style='padding: 6px;'>Sai nghĩa (Người hỏi của khách hàng)</td><td style='padding: 6px; color: #c62828; font-weight: bold;'>❌ Sai nghĩa</td></tr><tr><td style='padding: 6px;'><strong>B. inquired</strong></td><td style='padding: 6px;'>Verb (v-ed)</td><td style='padding: 6px;'>Sai từ loại (Động từ quá khứ)</td><td style='padding: 6px; color: #c62828; font-weight: bold;'>❌ Sai ngữ pháp</td></tr><tr><td style='padding: 6px;'><strong>C. to inquire</strong></td><td style='padding: 6px;'>To-Verb</td><td style='padding: 6px;'>Sai từ loại (Động từ to-V)</td><td style='padding: 6px; color: #c62828; font-weight: bold;'>❌ Sai ngữ pháp</td></tr><tr><td style='padding: 6px;'><strong>D. inquiries</strong></td><td style='padding: 6px;'>Noun (chỉ sự việc)</td><td style='padding: 6px;'>Đúng từ loại & Kết hợp từ chuẩn</td><td style='padding: 6px; color: #2e7d32; font-weight: bold;'>✅ Đúng</td></tr></tbody></table><br/><p><strong>🎯 Bẫy TOEIC & Mẹo làm nhanh:</strong></p><ul><li><strong>Bẫy Danh từ chỉ Người vs Chỉ sự việc:</strong> Phân biệt <i>inquirer</i> (người hỏi) và <i>inquiry</i> (câu hỏi/yêu cầu). Động từ <i>answer</i> hoặc <i>respond to</i> đi với câu hỏi/yêu cầu (<i>inquiries</i>) chứ không đi với người hỏi (<i>inquirers</i>) trong cụm sở hữu cách này.</li><li><strong>Cụm thời gian kinh điển:</strong> Cấu trúc <code>within + [thời gian] + of receipt</code> (trong vòng [thời gian] kể từ khi tiếp nhận/nhận được) là cụm từ cực kỳ phổ biến trong email và chính sách doanh nghiệp.</li></ul></div>",
