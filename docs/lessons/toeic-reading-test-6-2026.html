        {
    id: 114, 
    q: "The Stallmain Corporation’s latest survey is intended to ------- employee satisfaction in several key categories.", 
    options: ["overcome", "prolong", "deserve", "determine"], 
    a: "determine", 
    exp: {
        correct: "<div style='line-height: 1.6;'><p><strong>a. Phân tích thành phần câu:</strong> Dạng bài kiểm tra từ vựng (Collocation trong ngữ cảnh kinh doanh):</p><ul><li><strong>Chủ ngữ (S):</strong> <code>The Stallmain Corporation's latest survey</code> — Bản khảo sát mới nhất của tập đoàn Stallmain.</li><li><strong>Động từ (V):</strong> <code>is intended to + V-inf</code> — Cấu trúc bị động chỉ mục đích (được thiết kế/thực hiện nhằm mục đích...).</li><li><strong>Tân ngữ (O):</strong> <code>employee satisfaction (N)</code> — Sự hài lòng của nhân viên (phần bổ ngữ sau động từ).</li></ul><p><strong>b. Xác định loại từ cần điền:</strong> Sau cấu trúc <code>intended to</code> cần một <strong>Động từ nguyên mẫu (V-inf)</strong>. Cả 4 phương án đều là động từ, do đó cần xét kết hợp từ (Collocation) và ngữ nghĩa.</p><p><strong>c. Lý do chọn đáp án:</strong> Động từ <span style='color: #2e7d32; font-weight: bold;'>determine</span> (xác định, đánh giá, đo lường) đi kèm rất tự nhiên với các danh từ như <i>satisfaction, needs, cause, demand</i>. Mục đích logic của một cuộc khảo sát (survey) là để <strong>xác định/đánh giá</strong> mức độ hài lòng của nhân viên, tạo thành cụm từ chuẩn: <span style='color: #2e7d32; font-weight: bold;'>determine employee satisfaction</span>.</p></div>",

        wrong: "<ul style='line-height: 1.6; list-style-type: none; padding-left: 0;'><li><strong style='color: #c62828;'>❌ (A) overcome:</strong> Nghĩa là <i>vượt qua</i> (khó khăn, chướng ngại: <i>overcome difficulties/obstacles</i>). Khảo sát không thể 'vượt qua' sự hài lòng.</li><li><strong style='color: #c62828;'>❌ (B) prolong:</strong> Nghĩa là <i>kéo dài</i> (thời gian, hợp đồng: <i>prolong a meeting/contract</i>). Không thể dùng "kéo dài sự hài lòng" làm mục đích cho khảo sát.</li><li><strong style='color: #c62828;'>❌ (C) deserve:</strong> Nghĩa là <i>xứng đáng</i> (khen thưởng, chú ý: <i>deserve recognition/praise</i>). Sai hoàn toàn về ngữ nghĩa logic đối với chủ ngữ <i>survey</i>.</li></ul>",

        grammar: "<div style='line-height: 1.6;'><p><strong>⭐ Cấu trúc Chỉ mục đích 'Be intended to' & Collocation từ vựng TOEIC</strong></p><p>Dạng câu hỏi chọn động từ phù hợp với ngữ cảnh doanh nghiệp xuất hiện rất thường xuyên trong Part 5.</p><table border='1' style='width: 100%; border-collapse: collapse; border-color: #e0e0e0; margin-top: 10px; font-size: 14px;'><thead style='background-color: #f5f5f5; text-align: left;'><tr><th style='padding: 8px;'>Cấu trúc / Cụm từ</th><th style='padding: 8px;'>Ý nghĩa ngữ pháp</th><th style='padding: 8px;'>Các từ đi kèm thường gặp</th><th style='padding: 8px;'>Ví dụ thực tế</th></tr></thead><tbody><tr><td style='padding: 8px;'><strong>Be intended to + V</strong></td><td style='padding: 8px;'>Được thiết kế / Nhằm mục đích...</td><td style='padding: 8px;'><i>intended to improve, intended to reduce</i></td><td style='padding: 8px;'><i>The program is intended to increase efficiency.</i></td></tr><tr><td style='padding: 8px;'><strong>Determine + Noun</strong></td><td style='padding: 8px;'>Xác định, đánh giá, đo lường...</td><td style='padding: 8px;'><i>satisfaction, needs, eligibility, demand</i></td><td style='padding: 8px;'><i>conduct a survey to determine customer needs</i></td></tr></tbody></table><p style='margin-top: 10px;'>💡 <strong>Mẹo làm nhanh:</strong> Khi cả 4 đáp án đều cùng một từ loại (ở đây là động từ), hãy nhìn vào danh từ đóng vai trò tân ngữ đứng phía sau. Khi thấy danh từ <i>satisfaction</i> đi kèm với ngữ cảnh <i>survey</i>, ưu tiên các động từ đo lường/đánh giá như <strong>determine, assess, evaluate, measure</strong>.</p></div>",

        vocab: "<ul style='line-height: 1.6;'><li><strong style='color: #0288d1;'>determine</strong> (v): xác định, đánh giá, tìm ra.</li><li><strong style='color: #0288d1;'>be intended to + V</strong> (str): nhằm mục đích làm gì.</li><li><strong style='color: #0288d1;'>employee satisfaction</strong> (n): sự hài lòng của nhân viên.</li><li><strong style='color: #0288d1;'>category</strong> (n): hạng mục, tiêu chí, nhóm.</li><li><strong style='color: #0288d1;'>prolong</strong> (v): kéo dài (thời gian).</li><li><strong style='color: #0288d1;'>overcome</strong> (v): khắc phục, vượt qua.</li></ul>",

        trans: "<div style='line-height: 1.6; padding: 8px; background-color: #f9f9f9; border-left: 4px solid #0288d1;'><p style='margin: 0;'><strong>Dịch nghĩa:</strong> Bản khảo sát mới nhất của Tập đoàn Stallmain được thực hiện nhằm xác định (đánh giá) mức độ hài lòng của nhân viên ở một số hạng mục quan trọng.</p></div>"
    }
},
        {
    id: 115, 
    q: "Garza’s Restaurant is ------- decorated with paintings and photographs of southern Mexico.", 
    options: ["elaborately", "elaborating", "elaborates", "elaboration"], 
    a: "elaborately", 
    exp: {
        correct: "<div style='line-height: 1.6;'><p><strong>a. Phân tích thành phần câu:</strong> Dạng bài kiểm tra Từ loại trong cấu trúc Bị động:</p><ul><li><strong>Chủ ngữ (S):</strong> <code>Garza's Restaurant</code> — Nhà hàng Garza.</li><li><strong>Động từ chính (V bị động):</strong> <code>is + [-------] + decorated (V3/ed)</code> — Được trang trí.</li><li><strong>Cụm giới từ bổ nghĩa:</strong> <code>with paintings and photographs of southern Mexico</code> — Bằng các bức tranh và ảnh chụp vùng nam Mexico.</li></ul><p><strong>b. Xác định loại từ cần điền:</strong> Vị trí nằm giữa trợ động từ <i>To Be</i> (<code>is</code>) và Quá khứ phân từ (<code>decorated - V3/ed</code>). Cần một <strong>Trạng từ (Adverb)</strong> để bổ nghĩa cho hành động <i>decorated</i>.</p><p><strong>c. Lý do chọn đáp án:</strong> Trong các phương án, chỉ có <span style='color: #2e7d32; font-weight: bold;'>elaborately</span> là trạng từ (có đuôi <i>-ly</i>), mang nghĩa 'mặc dù / công phu / tỉ mỉ'. Đáp án này tạo thành Collocation kinh điển: <span style='color: #2e7d32; font-weight: bold;'>elaborately decorated</span> (được bài trí/trang trí công phu).</p></div>",

        wrong: "<ul style='line-height: 1.6; list-style-type: none; padding-left: 0;'><li><strong style='color: #c62828;'>❌ (B) elaborating:</strong> Dạng <i>V-ing / Hiện tại phân từ</i> (<i>đang diễn giải/trình bày chi tiết</i>). Không thể đứng chen giữa cấu trúc bị động <i>is ... decorated</i>.</li><li><strong style='color: #c62828;'>❌ (C) elaborates:</strong> Động từ chia thì số ít ở thì Hiện tại đơn. Trong câu đã có động từ chính <i>is decorated</i> nên không thể chọn thêm động từ chia thì.</li><li><strong style='color: #c62828;'>❌ (D) elaboration:</strong> Danh từ có đuôi <i>-tion</i> (<i>sự diễn giải / sự trau chuốt</i>). Danh từ không thể đứng trước V3/ed để bổ nghĩa cho động từ.</li></ul>",

        grammar: "<div style='line-height: 1.6;'><p><strong>⭐ Vị trí Trạng từ trong Cấu trúc Bị động (Be + Adv + V3/ed)</strong></p><p>Đây là một trong những dạng bài kiểm tra Vị trí Từ loại xuất hiện với tần suất cao nhất trong TOEIC Part 5.</p><table border='1' style='width: 100%; border-collapse: collapse; border-color: #e0e0e0; margin-top: 10px; font-size: 14px;'><thead style='background-color: #f5f5f5; text-align: left;'><tr><th style='padding: 8px;'>Cấu trúc Bị động</th><th style='padding: 8px;'>Loại từ chen giữa</th><th style='padding: 8px;'>Vai trò ngữ pháp</th><th style='padding: 8px;'>Ví dụ thực tế</th></tr></thead><tbody><tr><td style='padding: 8px;'><strong>Be + [ Adv ] + V3/ed</strong></td><td style='padding: 8px;'><strong>Trạng từ (-ly)</strong></td><td style='padding: 8px;'>Bổ nghĩa về cách thức cho động từ phân từ.</td><td style='padding: 8px;'><i>is <strong>carefully</strong> designed / was <strong>professionally</strong> prepared</i></td></tr><tr><td style='padding: 8px;'><strong>Collocations với Decorate</strong></td><td style='padding: 8px;'><strong>Adv + decorated</strong></td><td style='padding: 8px;'>Trang trí theo cách thức cụ thể.</td><td style='padding: 8px;'><i><strong>elaborately</strong> decorated / <strong>beautifully</strong> decorated</i></td></tr></tbody></table><p style='margin-top: 10px;'>💡 <strong>Mẹo làm nhanh:</strong> Nhìn thấy cấu trúc <code>To Be + [___] + V3/ed</code> (hoặc <code>Have/Has + [___] + V3/ed</code>), lập tức tìm đáp án có đuôi <strong>-ly (Trạng từ)</strong> để chọn ngay mà không cần dịch nghĩa cả câu.</p></div>",

        vocab: "<ul style='line-height: 1.6;'><li><strong style='color: #0288d1;'>elaborately</strong> (adv): một cách công phu, tỉ mỉ, cầu kỳ.</li><li><strong style='color: #0288d1;'>decorate A with B</strong> (v): trang trí A bằng B.</li><li><strong style='color: #0288d1;'>painting</strong> (n): bức tranh vẽ.</li><li><strong style='color: #0288d1;'>photograph</strong> (n): bức ảnh chụp.</li><li><strong style='color: #0288d1;'>elaboration</strong> (n): sự diễn giải, sự trau chuốt chi tiết.</li></ul>",

        trans: "<div style='line-height: 1.6; padding: 8px; background-color: #f9f9f9; border-left: 4px solid #0288d1;'><p style='margin: 0;'><strong>Dịch nghĩa:</strong> Nhà hàng Garza được bài trí một cách rất công phu với những bức tranh và ảnh chụp về vùng miền nam Mexico.</p></div>"
    }

        {
    id: 116, 
    q: "Mr. Brighton’s first ------- at Glynn Engineering was in the materials testing group.", 
    options: ["assign", "assigned", "assigning", "assignment"], 
    a: "assignment", 
    exp: {
        correct: "<div style='line-height: 1.6;'><p><strong>a. Phân tích thành phần câu:</strong> Dạng bài kiểm tra Từ loại trong Cụm Danh từ làm Chủ ngữ:</p><ul><li><strong>Chủ ngữ (S):</strong> <code>Mr. Brighton's first [-------] at Glynn Engineering</code> — Cụm danh từ hoàn chỉnh làm chủ ngữ chính.</li><li><strong>Động từ chính (V):</strong> <code>was</code> — Động từ chia thì Quá khứ đơn số ít.</li><li><strong>Bổ ngữ / Cụm giới từ (C):</strong> <code>in the materials testing group</code> — Thuộc nhóm kiểm tra vật liệu.</li></ul><p><strong>b. Xác định loại từ cần điền:</strong> Đứng sau sở hữu cách <i>'s</i> và số từ thứ tự <i>first</i> (đóng vai trò tính từ), trước cụm giới từ <i>at Glynn Engineering</i>, ta cần một <strong>Danh từ (Noun)</strong> để làm danh từ chính bổ nghĩa cho toàn bộ cụm chủ ngữ.</p><p><strong>c. Lý do chọn đáp án:</strong> Trong các phương án, chỉ có <span style='color: #2e7d32; font-weight: bold;'>assignment</span> là danh từ (mang đuôi nhận diện <i>-ment</i>), có nghĩa là 'nhiệm vụ / công việc được giao'. Đáp án tạo thành cấu trúc chuẩn: <span style='color: #2e7d32; font-weight: bold;'>someone's first assignment</span> (công việc/nhiệm vụ đầu tiên của ai đó).</p></div>",

        wrong: "<ul style='line-height: 1.6; list-style-type: none; padding-left: 0;'><li><strong style='color: #c62828;'>❌ (A) assign:</strong> Động từ nguyên mẫu (<i>phân công, giao việc</i>). Động từ không thể đứng sau tính từ <i>first</i> để làm chủ ngữ cho <i>was</i>.</li><li><strong style='color: #c62828;'>❌ (B) assigned:</strong> Dạng <i>V-ed / Tính từ bị động</i> (<i>được phân công</i>). Đứng sau <i>first</i> không tạo thành cụm danh từ hoàn chỉnh vì thiếu danh từ trung tâm.</li><li><strong style='color: #c62828;'>❌ (C) assigning:</strong> Dạng <i>V-ing / Danh động từ</i> (<i>việc phân công</i>). Không hợp ngữ nghĩa khi đi kèm sở hữu cách <i>Mr. Brighton's first</i> trong ngữ cảnh này.</li></ul>",

        grammar: "<div style='line-height: 1.6;'><p><strong>⭐ Cấu trúc Cụm Danh từ làm Chủ ngữ (Possessive + Ordinal + Noun)</strong></p><p>Đây là một trong những dạng nhận diện từ loại cơ bản nhưng rất dễ ăn điểm trong TOEIC Part 5.</p><table border='1' style='width: 100%; border-collapse: collapse; border-color: #e0e0e0; margin-top: 10px; font-size: 14px;'><thead style='background-color: #f5f5f5; text-align: left;'><tr><th style='padding: 8px;'>Thành phần Cụm Danh từ</th><th style='padding: 8px;'>Loại từ đảm nhận</th><th style='padding: 8px;'>Vai trò ngữ pháp</th><th style='padding: 8px;'>Ví dụ thực tế</th></tr></thead><tbody><tr><td style='padding: 8px;'><strong>Sở hữu cách / Tính từ sở hữu</strong></td><td style='padding: 8px;'><strong>'s / His / Her / Our</strong></td><td style='padding: 8px;'>Xác định quyền sở hữu.</td><td style='padding: 8px;'><i>Mr. Brighton's / Her / Our</i></td></tr><tr><td style='padding: 8px;'><strong>Số thứ tự / Tính từ bổ nghĩa</strong></td><td style='padding: 8px;'><strong>first / last / next</strong></td><td style='padding: 8px;'>Bổ nghĩa vị trí, thứ tự.</td><td style='padding: 8px;'><i>first / second / latest</i></td></tr><tr><td style='padding: 8px;'><strong>Danh từ chính (Vị trí cần điền)</strong></td><td style='padding: 8px;'><strong>Noun (-ment, -tion...)</strong></td><td style='padding: 8px;'>Trung tâm của cụm danh từ.</td><td style='padding: 8px;'><i><strong>assignment</strong> / promotion / project</i></td></tr></tbody></table><p style='margin-top: 10px;'>💡 <strong>Mẹo làm nhanh:</strong> Nhìn thấy công thức <code>Someone's + first / last / next + [___]</code>, bạn hãy chọn ngay một <strong>Danh từ</strong> mà không cần phân vân chọn động từ hay tính từ đuôi <i>-ed/-ing</i>.</p></div>",

        vocab: "<ul style='line-height: 1.6;'><li><strong style='color: #0288d1;'>assignment</strong> (n): nhiệm vụ, công việc được giao.</li><li><strong style='color: #0288d1;'>assign</strong> (v): phân công, giao nhiệm vụ.</li><li><strong style='color: #0288d1;'>materials testing group</strong> (n): nhóm/bộ phận thử nghiệm vật liệu.</li><li><strong style='color: #0288d1;'>work / special / overseas assignment</strong> (n): nhiệm vụ công việc / đặc biệt / tại nước ngoài.</li></ul>",

        trans: "<div style='line-height: 1.6; padding: 8px; background-color: #f9f9f9; border-left: 4px solid #0288d1;'><p style='margin: 0;'><strong>Dịch nghĩa:</strong> Nhiệm vụ (công việc) đầu tiên của ông Brighton tại Glynn Engineering là ở bộ phận thử nghiệm vật liệu.</p></div>"
    }

        {
    id: 117, 
    q: "The installation of new benches throughout Haverford Park will cost ------- €5,000.", 
    options: ["briefly", "roughly", "correctly", "generously"], 
    a: "roughly", 
    exp: {
        correct: "<div style='line-height: 1.6;'><p><strong>a. Phân tích thành phần câu:</strong> Dạng bài kiểm tra Trạng từ chỉ ước lượng (Degree Adverb):</p><ul><li><strong>Chủ ngữ (S):</strong> <code>The installation of new benches throughout Haverford Park</code> — Cụm danh từ làm chủ ngữ (Việc lắp đặt các băng ghế mới trên toàn bộ Công viên Haverford).</li><li><strong>Động từ chính (V):</strong> <code>will cost</code> — Động từ chia thì Tương lai đơn (sẽ tốn chi phí...).</li><li><strong>Bổ ngữ chỉ số tiền (O):</strong> <code>[-------] + €5,000</code> — Cụm từ bổ nghĩa cho con số chi phí.</li></ul><p><strong>b. Xác định loại từ cần điền:</strong> Đứng trước con số cụ thể <code>€5,000</code>, ta cần một <strong>Trạng từ ước lượng (Adverb of Approximation)</strong> để thể hiện mức độ xấp xỉ của chi phí.</p><p><strong>c. Lý do chọn đáp án:</strong> Trong các phương án, chỉ có <span style='color: #2e7d32; font-weight: bold;'>roughly</span> (khoảng chừng, xấp xỉ = <i>approximately</i>) là trạng từ đứng trước con số chỉ số tiền/số lượng để thể hiện sự ước lượng, tạo thành cụm từ chuẩn: <span style='color: #2e7d32; font-weight: bold;'>cost roughly €5,000</span>.</p></div>",

        wrong: "<ul style='line-height: 1.6; list-style-type: none; padding-left: 0;'><li><strong style='color: #c62828;'>❌ (A) briefly:</strong> Nghĩa là <i>ngắn gọn, trong thời gian ngắn</i> (<i>speak/explain briefly</i>). Không đứng trước con số tiền bạc.</li><li><strong style='color: #c62828;'>❌ (C) correctly:</strong> Nghĩa là <i>chính xác, đúng đắn</i> (<i>answer/calculate correctly</i>). Để diễn tả "chính xác bao nhiêu tiền" người ta dùng <i>exactly</i>, không dùng <i>correctly</i>.</li><li><strong style='color: #c62828;'>❌ (D) generously:</strong> Nghĩa là <i>rộng lượng, hào phóng</i> (<i>donate/reward generously</i>). Chi phí tốn bao nhiêu không thể mang tính chất "hào phóng".</li></ul>",

        grammar: "<div style='line-height: 1.6;'><p><strong>⭐ Trạng từ đứng trước Con số / Số tiền trong TOEIC</strong></p><p>Đây là nhóm từ vựng chỉ sự ước lượng hoặc chính xác cực kỳ phổ biến trong các báo cáo chi phí, kế hoạch tài chính của TOEIC Part 5 & 6.</p><table border='1' style='width: 100%; border-collapse: collapse; border-color: #e0e0e0; margin-top: 10px; font-size: 14px;'><thead style='background-color: #f5f5f5; text-align: left;'><tr><th style='padding: 8px;'>Chức năng</th><th style='padding: 8px;'>Trạng từ thường gặp</th><th style='padding: 8px;'>Cấu trúc</th><th style='padding: 8px;'>Ví dụ thực tế</th></tr></thead><tbody><tr><td style='padding: 8px;'><strong>Xấp xỉ / Khoảng</strong></td><td style='padding: 8px;'><strong>roughly / approximately / about / around / nearly</strong></td><td style='padding: 8px;'>Adv + Con số / Số tiền</td><td style='padding: 8px;'><i><strong>roughly</strong> €5,000 / <strong>approximately</strong> 200 employees</i></td></tr><tr><td style='padding: 8px;'><strong>Chính xác</strong></td><td style='padding: 8px;'><strong>exactly / precisely</strong></td><td style='padding: 8px;'>Adv + Con số / Số tiền</td><td style='padding: 8px;'><i><strong>exactly</strong> $3 million</i></td></tr></tbody></table><p style='margin-top: 10px;'>💡 <strong>Mẹo làm nhanh:</strong> Nhìn thấy ngay sau chỗ trống là một <strong>con số / số tiền / phần trăm / khoảng thời gian</strong> (ví dụ: <i>€5,000; 20%; 100 people</i>), hãy ưu tiên tìm các trạng từ mang nghĩa "khoảng/xấp xỉ" như <strong>roughly, approximately, nearly, about, around</strong>.</p></div>",

        vocab: "<ul style='line-height: 1.6;'><li><strong style='color: #0288d1;'>roughly</strong> (adv): khoảng chừng, xấp xỉ (= approximately).</li><li><strong style='color: #0288d1;'>installation</strong> (n): việc lắp đặt, sự cài đặt.</li><li><strong style='color: #0288d1;'>bench</strong> (n): băng ghế dài (công viên/nơi công cộng).</li><li><strong style='color: #0288d1;'>cost + amount of money</strong> (v): có giá / tốn chi phí bao nhiêu.</li><li><strong style='color: #0288d1;'>briefly</strong> (adv): tóm tắt, ngắn gọn.</li></ul>",

        trans: "<div style='line-height: 1.6; padding: 8px; background-color: #f9f9f9; border-left: 4px solid #0288d1;'><p style='margin: 0;'><strong>Dịch nghĩa:</strong> Việc lắp đặt các băng ghế mới trên toàn bộ Công viên Haverford sẽ tốn chi phí khoảng 5.000 euro.</p></div>"
    }

        {
    id: 118, 
    q: "------- who is unable to attend the quarterly stakeholder meeting is welcome to appoint a representative.", 
    options: ["Such", "Whichever", "Anyone", "Those"], 
    a: "Anyone", 
    exp: {
        correct: "<div style='line-height: 1.6;'><p><strong>a. Phân tích thành thành phần câu:</strong> Dạng bài kiểm tra Đại từ bất định làm Chủ ngữ chính:</p><ul><li><strong>Chủ ngữ chính (S):</strong> <code>[-------] + who is unable to attend the quarterly stakeholder meeting</code> — Cụm danh từ bao gồm Đại từ chính + Mệnh đề quan hệ bổ nghĩa.</li><li><strong>Động từ chính (V):</strong> <code>is welcome</code> — Động từ chia thì Hiện tại đơn ở dạng <strong>số ít</strong>.</li><li><strong>Bổ ngữ (C):</strong> <code>to appoint a representative</code> — Cụm động từ nguyên mẫu chỉ quyền hạn / sự cho phép.</li></ul><p><strong>b. Xác định loại từ cần điền:</strong> Cần một <strong>Đại từ chỉ người số ít</strong> làm chủ ngữ chính, để vừa đi kèm với mệnh đề quan hệ <i>who</i> vừa hòa hợp với động từ số ít <i>is</i> phía sau.</p><p><strong>c. Lý do chọn đáp án:</strong> Trong các phương án, chỉ có <span style='color: #2e7d32; font-weight: bold;'>Anyone</span> là đại từ bất định chỉ người ở dạng số ít, tạo thành cấu trúc quy tắc: <span style='color: #2e7d32; font-weight: bold;'>Anyone who + V (số ít)</span> (Bất kỳ ai mà...).</p></div>",

        wrong: "<ul style='line-height: 1.6; list-style-type: none; padding-left: 0;'><li><strong style='color: #c62828;'>❌ (A) Such:</strong> Nghĩa là <i>như vậy, như thế</i> (<i>such a person / such people</i>). Không đứng một mình trước <i>who is...</i> để làm chủ ngữ chỉ người.</li><li><strong style='color: #c62828;'>❌ (B) Whichever:</strong> Nghĩa là <i>bất cứ cái nào</i> (dùng cho vật/sự lựa chọn). Không dùng <i>Whichever</i> kết hợp với mệnh đề quan hệ chỉ người <i>who is</i>.</li><li><strong style='color: #c62828;'>❌ (D) Those:</strong> Là đại từ chỉ người dạng <strong>số nhiều</strong> (<i>những người mà...</i>). Nếu chọn <i>Those</i>, mệnh đề phía sau bắt buộc phải là <i>Those who ARE unable...</i>.</li></ul>",

        grammar: "<div style='line-height: 1.6;'><p><strong>⭐ Cấu trúc Hòa hợp Chủ ngữ - Động từ: 'Anyone who + V(số ít)' vs 'Those who + V(số nhiều)'</strong></p><p>Đây là bẫy ngữ pháp cực kỳ điển hình và hay xuất hiện trong các thông báo, quy định công sở của TOEIC Part 5.</p><table border='1' style='width: 100%; border-collapse: collapse; border-color: #e0e0e0; margin-top: 10px; font-size: 14px;'><thead style='background-color: #f5f5f5; text-align: left;'><tr><th style='padding: 8px;'>Đại từ Chủ ngữ</th><th style='padding: 8px;'>Số ít / Số nhiều</th><th style='padding: 8px;'>Mệnh đề quan hệ đi kèm</th><th style='padding: 8px;'>Ví dụ thực tế</th></tr></thead><tbody><tr><td style='padding: 8px;'><strong>Anyone / Everyone</strong></td><td style='padding: 8px;'>Số ít (Singular)</td><td style='padding: 8px;'><strong>... who IS / HAS / V(s/es)</strong></td><td style='padding: 8px;'><i><strong>Anyone who has</strong> questions may contact HR.</i></td></tr><tr><td style='padding: 8px;'><strong>Those</strong></td><td style='padding: 8px;'>Số nhiều (Plural)</td><td style='padding: 8px;'><strong>... who ARE / HAVE / V(nguyên mẫu)</strong></td><td style='padding: 8px;'><i><strong>Those who are</strong> interested must apply early.</i></td></tr></tbody></table><p style='margin-top: 10px;'>💡 <strong>Mẹo làm nhanh:</strong> Khi gặp dạng <code>[___] + who + V</code>, hãy nhìn ngay vào động từ chia sau <i>who</i>: Nếu là động từ số ít (<i>is, has, V-s/es</i>) → Chọn <strong>Anyone / Everyone</strong>. Nếu là động từ số nhiều (<i>are, have, V-bare</i>) → Chọn <strong>Those</strong>.</p></div>",

        vocab: "<ul style='line-height: 1.6;'><li><strong style='color: #0288d1;'>anyone</strong> (pron): bất kỳ ai.</li><li><strong style='color: #0288d1;'>stakeholder</strong> (n): bên liên quan, cổ đông.</li><li><strong style='color: #0288d1;'>quarterly</strong> (adj/adv): hằng quý, theo quý.</li><li><strong style='color: #0288d1;'>be welcome to + V</strong> (str): được phép, được mời làm gì.</li><li><strong style='color: #0288d1;'>appoint a representative</strong> (v): chỉ định / cử một người đại diện.</li></ul>",

        trans: "<div style='line-height: 1.6; padding: 8px; background-color: #f9f9f9; border-left: 4px solid #0288d1;'><p style='margin: 0;'><strong>Dịch nghĩa:</strong> Bất kỳ ai không thể tham dự cuộc họp cổ đông (bên liên quan) hằng quý đều được phép chỉ định một người đại diện.</p></div>"
    }
},
        {
    id: 119, 
    q: "Singer Maria Stanley ------- today that she is scheduling a world tour.", 
    options: ["reveal", "revealed", "to reveal", "revealing"], 
    a: "revealed", 
    exp: {
        correct: "<div style='line-height: 1.6;'><p><strong>a. Phân tích thành phần câu:</strong> Dạng bài chia Thì Động từ chính trong câu:</p><ul><li><strong>Chủ ngữ chính (S):</strong> <code>Singer Maria Stanley</code> — Chủ ngữ chỉ người số ít.</li><li><strong>Động từ chính (V):</strong> <code>[-------]</code> — Cần động từ chính được chia thì hoàn chỉnh.</li><li><strong>Trạng ngữ thời gian:</strong> <code>today</code> — Hôm nay.</li><li><strong>Mệnh đề Tân ngữ bổ nghĩa (O Clause):</strong> <code>that she is scheduling a world tour</code> — Rằng cô ấy đang lên lịch cho một chuyến lưu diễn thế giới.</li></ul><p><strong>b. Xác định loại từ cần điền:</strong> Chỗ trống đứng ngay sau Chủ ngữ chính <i>Singer Maria Stanley</i> nên bắt buộc phải là một <strong>Động từ chia thì (Finite Verb)</strong>.</p><p><strong>c. Lý do chọn đáp án:</strong> Trong ngữ cảnh bản tin/thông cáo báo chí, phát biểu hoặc thông báo đã diễn ra (dù trong ngày hôm nay) sẽ được chia ở <strong>Thì Quá khứ đơn</strong>. Đáp án <span style='color: #2e7d32; font-weight: bold;'>revealed</span> đúng ngữ pháp và thể hiện sự kết hợp thì logic: Việc phát biểu/tiết lộ đã hoàn tất (<i>revealed</i>), còn việc lên kế hoạch chuyến lưu diễn vẫn đang tiếp diễn (<i>is scheduling</i>).</p></div>",

        wrong: "<ul style='line-height: 1.6; list-style-type: none; padding-left: 0;'><li><strong style='color: #c62828;'>❌ (A) reveal:</strong> Động từ nguyên mẫu. Nếu ở Hiện tại đơn với chủ ngữ số ít <i>Singer Maria Stanley</i> thì phải là <i>reveals</i>. Hơn nữa ngữ cảnh bản tin không miêu tả thói quen lặp đi lặp lại.</li><li><strong style='color: #c62828;'>❌ (C) to reveal:</strong> Động từ nguyên mẫu có <i>to</i> (To-infinitive). Không thể đứng độc lập làm động từ chính chia thì cho câu.</li><li><strong style='color: #c62828;'>❌ (D) revealing:</strong> Dạng <i>V-ing / Hiện tại phân từ</i>. Không thể đóng vai trò làm động từ chính nếu thiếu trợ động từ To Be (<i>is/was revealing</i>) đứng trước.</li></ul>",

        grammar: "<div style='line-height: 1.6;'><p><strong>⭐ Động từ Tường thuật trong Văn phong Tin tức & Bẫy 'Today'</strong></p><p>Đây là dạng bài chia thì động từ tường thuật cực kỳ phổ biến trong các bản tin, thông báo báo chí của TOEIC Part 5 & 6.</p><table border='1' style='width: 100%; border-collapse: collapse; border-color: #e0e0e0; margin-top: 10px; font-size: 14px;'><thead style='background-color: #f5f5f5; text-align: left;'><tr><th style='padding: 8px;'>Mẫu động từ Tường thuật</th><th style='padding: 8px;'>Thì sử dụng phổ biến</th><th style='padding: 8px;'>Giải thích ngữ cảnh</th><th style='padding: 8px;'>Ví dụ thực tế</th></tr></thead><tbody><tr><td style='padding: 8px;'><strong>announced / revealed / confirmed + that...</strong></td><td style='padding: 8px;'>Quá khứ đơn (V2/ed)</td><td style='padding: 8px;'>Tường thuật lại một phát biểu/sự kiện vừa được công bố (dù đi với <i>today</i>).</td><td style='padding: 8px;'><i>The CEO <strong>confirmed today that</strong> profits increased.</i></td></tr><tr><td style='padding: 8px;'><strong>is scheduling / planning...</strong></td><td style='padding: 8px;'>Hiện tại tiếp diễn</td><td style='padding: 8px;'>Diễn tả kế hoạch/hành động đang trong quá trình thực hiện.</td><td style='padding: 8px;'><i>She <strong>is scheduling</strong> a world tour.</i></td></tr></tbody></table><p style='margin-top: 10px;'>💡 <strong>Mẹo làm nhanh:</strong> Đừng mắc bẫy từ <i>today</i> mà vội chọn Hiện tại đơn! Khi gặp công thức <code>Subject + [___] + today + that + clause</code> tường thuật tin tức, hãy ưu tiên chọn động từ tường thuật ở <strong>Thì Quá khứ đơn</strong> (<i>announced, revealed, confirmed, stated</i>).</p></div>",

        vocab: "<ul style='line-height: 1.6;'><li><strong style='color: #0288d1;'>reveal that...</strong> (v): tiết lộ, công bố rằng...</li><li><strong style='color: #0288d1;'>schedule</strong> (v): lên lịch, sắp xếp kế hoạch.</li><li><strong style='color: #0288d1;'>world tour</strong> (n): chuyến lưu diễn vòng quanh thế giới.</li><li><strong style='color: #0288d1;'>announce / confirm / state</strong> (v): tuyên bố / xác nhận / phát biểu.</li></ul>",

        trans: "<div style='line-height: 1.6; padding: 8px; background-color: #f9f9f9; border-left: 4px solid #0288d1;'><p style='margin: 0;'><strong>Dịch nghĩa:</strong> Ca sĩ Maria Stanley hôm nay đã tiết lộ rằng cô ấy đang lên kế hoạch cho một chuyến lưu diễn vòng quanh thế giới.</p></div>"

        {
    id: 120, 
    q: "Biographer Amber Bowen has been recognized for her distinctive writing -------.", 
    options: ["styleless", "styled", "stylish", "style"], 
    a: "style", 
    exp: {
        correct: "<div style='line-height: 1.6;'><p><strong>a. Phân tích thành phần câu:</strong> Dạng bài kiểm tra Từ loại trong Cụm Danh từ ghép (Compound Noun):</p><ul><li><strong>Chủ ngữ (S):</strong> <code>Biographer Amber Bowen</code> — Nhà viết tiểu sử Amber Bowen.</li><li><strong>Động từ chính (V):</strong> <code>has been recognized</code> — Động từ thì Hiện tại hoàn thành dạng bị động (được công nhận/vinh danh).</li><li><strong>Cụm giới từ bổ nghĩa (O):</strong> <code>for her distinctive writing [-------]</code> — Cụm danh từ đóng vai trò tân ngữ đứng sau giới từ <i>for</i>.</li></ul><p><strong>b. Xác định loại từ cần điền:</strong> Trong cụm <i>her (Sở hữu) + distinctive (Adj) + writing (Noun Modifier) + [-------]</i>, chỗ trống bắt buộc phải là một <strong>Danh từ trung tâm (Head Noun)</strong> để hoàn thành Cụm danh từ ghép.</p><p><strong>c. Lý do chọn đáp án:</strong> Trong các phương án, chỉ có <span style='color: #2e7d32; font-weight: bold;'>style</span> là danh từ, kết hợp với <i>writing</i> tạo thành Danh từ ghép / Collocation rất phổ biến trong tiếng Anh thương mại & học thuật: <span style='color: #2e7d32; font-weight: bold;'>writing style</span> (phong cách viết, lối hành văn).</p></div>",

        wrong: "<ul style='line-height: 1.6; list-style-type: none; padding-left: 0;'><li><strong style='color: #c62828;'>❌ (A) styleless:</strong> Tính từ mang ý nghĩa tiêu cực (<i>không có phong cách, thiếu thẩm mỹ</i>). Không đúng loại từ cần điền và mâu thuẫn về nghĩa với <i>distinctive</i>.</li><li><strong style='color: #c62828;'>❌ (B) styled:</strong> Dạng <i>V-ed / Tính từ bị động</i> (<i>được thiết kế/tạo kiểu</i>). Không thể đứng sau <i>writing</i> để làm danh từ trung tâm.</li><li><strong style='color: #c62828;'>❌ (C) stylish:</strong> Tính từ mang nghĩa tích cực (<i>thời trang, sành điệu, hợp thời</i>). Tính từ không thể đứng ngay sau danh từ bổ nghĩa <i>writing</i> để chốt cụm danh từ.</li></ul>",

        grammar: "<div style='line-height: 1.6;'><p><strong>⭐ Cấu trúc Cụm Danh từ Ghép (Compound Noun) & Bổ ngữ Từ loại</strong></p><p>Đây là dạng bài kiểm tra khả năng nhận diện danh từ trung tâm đứng sau các từ bổ nghĩa (Sở hữu + Tính từ + Danh từ phụ) rất hay gặp trong Part 5.</p><table border='1' style='width: 100%; border-collapse: collapse; border-color: #e0e0e0; margin-top: 10px; font-size: 14px;'><thead style='background-color: #f5f5f5; text-align: left;'><tr><th style='padding: 8px;'>Thành phần Cụm Danh từ</th><th style='padding: 8px;'>Loại từ / Chức năng</th><th style='padding: 8px;'>Giải thích ngữ pháp</th><th style='padding: 8px;'>Ví dụ thực tế</th></tr></thead><tbody><tr><td style='padding: 8px;'><strong>Determiner / Possessive</strong></td><td style='padding: 8px;'>her / our / their</td><td style='padding: 8px;'>Tính từ sở hữu xác định.</td><td style='padding: 8px;'><i>her / their</i></td></tr><tr><td style='padding: 8px;'><strong>Adjective</strong></td><td style='padding: 8px;'>distinctive / excellent</td><td style='padding: 8px;'>Tính từ mô tả đặc điểm.</td><td style='padding: 8px;'><i>distinctive / unique</i></td></tr><tr><td style='padding: 8px;'><strong>Noun Modifier</strong></td><td style='padding: 8px;'>writing / sales / management</td><td style='padding: 8px;'>Danh từ đứng trước đóng vai trò bổ nghĩa.</td><td style='padding: 8px;'><i>writing / leadership</i></td></tr><tr><td style='padding: 8px;'><strong>Head Noun (Vị trí điền)</strong></td><td style='padding: 8px;'><strong>style / strategy / skills</strong></td><td style='padding: 8px;'>Danh từ chính làm trung tâm toàn cụm.</td><td style='padding: 8px;'><i><strong>writing style</strong> / sales strategy</i></td></tr></tbody></table><p style='margin-top: 10px;'>💡 <strong>Mẹo làm nhanh:</strong> Đừng nhầm lẫn <i>writing</i> là động từ V-ing! Khi đứng trước chỗ trống trong một cụm danh từ, <i>writing</i> đóng vai trò là một danh từ bổ nghĩa (Noun Modifier). Sau nó luôn cần một <strong>Danh từ trung tâm</strong> (<i>style, skills, task...</i>).</p></div>",

        vocab: "<ul style='line-height: 1.6;'><li><strong style='color: #0288d1;'>writing style</strong> (n): phong cách viết, lối hành văn.</li><li><strong style='color: #0288d1;'>biographer</strong> (n): nhà viết tiểu sử.</li><li><strong style='color: #0288d1;'>be recognized for</strong> (v): được vinh danh / công nhận vì điều gì.</li><li><strong style='color: #0288d1;'>distinctive</strong> (adj): đặc trưng, độc đáo, khác biệt.</li><li><strong style='color: #0288d1;'>stylish</strong> (adj): sành điệu, có phong cách.</li></ul>",

        trans: "<div style='line-height: 1.6; padding: 8px; background-color: #f9f9f9; border-left: 4px solid #0288d1;'><p style='margin: 0;'><strong>Dịch nghĩa:</strong> Nhà viết tiểu sử Amber Bowen đã được vinh danh nhờ vào phong cách viết lách (lối hành văn) cực kỳ đặc trưng của mình.</p></div>"
    }

        {
    id: 121, 
    q: "The award-winning stationery created by the artists at Paperi Designs is of ------- quality.", 
    options: ["comfortable", "exceptional", "hospitable", "ambitious"], 
    a: "exceptional", 
    exp: {
        correct: "<div style='line-height: 1.6;'><p><strong>a. Phân tích thành phần câu:</strong> Dạng bài chọn Từ vựng (Tính từ / Collocation):</p><ul><li><strong>Chủ ngữ (S):</strong> <code>The award-winning stationery created by the artists at Paperi Designs</code> — Cụm danh từ (Văn phòng phẩm từng đoạt giải thưởng do các nghệ sĩ tại Paperi Designs thiết kế).</li><li><strong>Động từ chính (V):</strong> <code>is</code> — Động từ To Be.</li><li><strong>Bổ ngữ (C):</strong> <code>of [-------] quality</code> — Cụm giới từ chỉ tính chất (be of + Adj + Noun).</li></ul><p><strong>b. Xác định loại từ cần điền:</strong> Cả 4 phương án đều là Tính từ. Do đó đây là câu hỏi chọn từ vựng dựa vào <strong>Ngữ nghĩa</strong> và <strong>Collocation (Sự kết hợp từ)</strong> với danh từ <i>quality</i>.</p><p><strong>c. Lý do chọn đáp án:</strong> Tính từ <span style='color: #2e7d32; font-weight: bold;'>exceptional</span> (xuất sắc, vượt trội) tạo thành cụm Collocation cố định: <span style='color: #2e7d32; font-weight: bold;'>of exceptional quality</span> (có chất lượng vượt trội/xuất sắc). Đồng thời, từ tín hiệu <i>award-winning</i> (đoạt giải thưởng) ở đầu câu khẳng định sản phẩm có chất lượng cao.</p></div>",

        wrong: "<ul style='line-height: 1.6; list-style-type: none; padding-left: 0;'><li><strong style='color: #c62828;'>❌ (A) comfortable:</strong> Nghĩa là <i>thoải mái, dễ chịu</i> (thường dùng cho ghế, quần áo, không gian, khách sạn). Không dùng <i>comfortable quality</i>.</li><li><strong style='color: #c62828;'>❌ (C) hospitable:</strong> Nghĩa là <i>hiếu khách, mến khách</i> (thường dùng cho người, nhân viên, dịch vụ lưu trú). Không đi ghép với <i>quality</i>.</li><li><strong style='color: #c62828;'>❌ (D) ambitious:</strong> Nghĩa là <i>đầy tham vọng, hoài bảo</i> (thường bổ nghĩa cho kế hoạch, dự án, con người). Không đi ghép với <i>quality</i>.</li></ul>",

        grammar: "<div style='line-height: 1.6;'><p><strong>⭐ Cấu trúc Miêu tả Tính chất 'Be of + Adj + Noun' & Collocations đi với Quality</strong></p><p>Đây là cấu trúc mang tính trang trọng (Formal) cực kỳ phổ biến trong các quảng cáo, thông báo của TOEIC.</p><table border='1' style='width: 100%; border-collapse: collapse; border-color: #e0e0e0; margin-top: 10px; font-size: 14px;'><thead style='background-color: #f5f5f5; text-align: left;'><tr><th style='padding: 8px;'>Mẫu cấu trúc Trang trọng</th><th style='padding: 8px;'>Cách diễn đạt tương đương</th><th style='padding: 8px;'>Ví dụ thực tế</th></tr></thead><tbody><tr><td style='padding: 8px;'><strong>be of high / exceptional quality</strong></td><td style='padding: 8px;'>be high-quality / exceptionally good</td><td style='padding: 8px;'><i>The items are <strong>of exceptional quality</strong>.</i></td></tr><tr><td style='padding: 8px;'><strong>be of great importance</strong></td><td style='padding: 8px;'>be very important</td><td style='padding: 8px;'><i>This decision is <strong>of great importance</strong>.</i></td></tr></tbody></table><p style='margin-top: 10px;'>💡 <strong>Mẹo làm nhanh Collocation với 'Quality':</strong> Khi thấy cụm <code>be of [___] quality</code>, ưu tiên các tính từ đánh giá chất lượng cao như: <strong>high, excellent, exceptional, superior, outstanding, top</strong>.</p></div>",

        vocab: "<ul style='line-height: 1.6;'><li><strong style='color: #0288d1;'>exceptional quality</strong> (n): chất lượng xuất sắc, chất lượng vượt trội.</li><li><strong style='color: #0288d1;'>stationery</strong> (n): văn phòng phẩm (<i>giấy, bút... - danh từ không đếm được</i>).</li><li><strong style='color: #0288d1;'>award-winning</strong> (adj): từng đoạt giải thưởng.</li><li><strong style='color: #0288d1;'>hospitable</strong> (adj): hiếu khách.</li><li><strong style='color: #0288d1;'>ambitious</strong> (adj): đầy tham vọng.</li></ul>",

        trans: "<div style='line-height: 1.6; padding: 8px; background-color: #f9f9f9; border-left: 4px solid #0288d1;'><p style='margin: 0;'><strong>Dịch nghĩa:</strong> Các sản phẩm văn phòng phẩm từng đoạt giải thưởng do các nghệ sĩ tại Paperi Designs sáng tạo có chất lượng vô cùng xuất sắc.</p></div>"
    }

        {
    id: 122, 
    q: "During the past quarter, ------- all of Renafy Technology’s sales came from one region.", 
    options: ["between", "nearly", "somewhat", "next to"], 
    a: "nearly", 
    exp: {
        correct: "<div style='line-height: 1.6;'><p><strong>a. Phân tích thành phần câu:</strong> Dạng bài chọn Trạng từ bổ nghĩa cho Lượng từ (Collocation):</p><ul><li><strong>Trạng ngữ thời gian:</strong> <code>During the past quarter</code> — Trong quý vừa qua.</li><li><strong>Chủ ngữ (S):</strong> <code>[-------] all of Renafy Technology’s sales</code> — Cụm danh từ làm chủ ngữ.</li><li><strong>Động từ chính (V):</strong> <code>came</code> — Động từ thì Quá khứ đơn (đến từ).</li><li><strong>Trạng ngữ chỉ nguồn gốc:</strong> <code>from one region</code> — Từ một khu vực.</li></ul><p><strong>b. Xác định loại từ cần điền:</strong> Vị trí đứng trước đại từ lượng từ <i>all of</i> cần một <strong>Trạng từ chỉ mức độ xấp xỉ</strong> để bổ nghĩa cho <i>all</i>.</p><p><strong>c. Lý do chọn đáp án:</strong> Trong các phương án, chỉ có <span style='color: #2e7d32; font-weight: bold;'>nearly</span> kết hợp hoàn hảo với <i>all</i> tạo thành Collocation chỉ số lượng/mức độ cực kỳ phổ biến: <span style='color: #2e7d32; font-weight: bold;'>nearly all of...</span> (gần như tất cả / hầu hết...).</p></div>",

        wrong: "<ul style='line-height: 1.6; list-style-type: none; padding-left: 0;'><li><strong style='color: #c62828;'>❌ (A) between:</strong> Giới từ (<i>ở giữa</i>). Thường đi theo cấu trúc <i>between A and B</i>, không thể đứng trực tiếp trước <i>all of</i>.</li><li><strong style='color: #c62828;'>❌ (C) somewhat:</strong> Trạng từ (<i>phần nào, hơi, tương đối</i>). Thường bổ nghĩa cho Tính từ/Động từ (<i>somewhat difficult, somewhat increased</i>), không đi ghép với <i>all of</i>.</li><li><strong style='color: #c62828;'>❌ (D) next to:</strong> Giới từ / Cụm giới từ (<i>bên cạnh</i>). Chỉ vị trí không gian (<i>next to the building</i>), hoàn toàn sai ngữ nghĩa và ngữ pháp.</li></ul>",

        grammar: "<div style='line-height: 1.6;'><p><strong>⭐ Cấu trúc Trạng từ Xấp xỉ Bổ nghĩa cho Lượng từ & Con số</strong></p><p>Trong báo cáo tài chính, doanh số và thống kê của TOEIC Part 5 & 6, các trạng từ chỉ sự gần đúng (xấp xỉ) luôn xuất hiện theo các Collocation cố định.</p><table border='1' style='width: 100%; border-collapse: collapse; border-color: #e0e0e0; margin-top: 10px; font-size: 14px;'><thead style='background-color: #f5f5f5; text-align: left;'><tr><th style='padding: 8px;'>Cụm Trạng từ chuẩn</th><th style='padding: 8px;'>Nghĩa tiếng Việt</th><th style='padding: 8px;'>Ví dụ thực tế trong TOEIC</th></tr></thead><tbody><tr><td style='padding: 8px;'><strong>nearly / almost / virtually + all</strong></td><td style='padding: 8px;'>Gần như tất cả, hầu hết</td><td style='padding: 8px;'><i><strong>Nearly all of</strong> the sales came from online orders.</i></td></tr><tr><td style='padding: 8px;'><strong>nearly / almost / approximately + con số</strong></td><td style='padding: 8px;'>Khoảng, xấp xỉ</td><td style='padding: 8px;'><i>The project cost <strong>nearly $50,000</strong>.</i></td></tr><tr><td style='padding: 8px;'><strong>nearly / almost + every / everyone</strong></td><td style='padding: 8px;'>Gần như mỗi / mọi người</td><td style='padding: 8px;'><i><strong>Nearly every</strong> employee attended the seminar.</i></td></tr></tbody></table><p style='margin-top: 10px;'>💡 <strong>Mẹo làm nhanh:</strong> Khi thấy phía sau chỗ trống là <code>all (of) / every / everyone / con số / phần trăm (%)</code>, hãy nghĩ ngay đến 3 từ “ruột” của TOEIC: <strong>Nearly / Almost / Virtually</strong>.</p></div>",

        vocab: "<ul style='line-height: 1.6;'><li><strong style='color: #0288d1;'>nearly all (of)</strong> (adv): gần như tất cả, hầu hết.</li><li><strong style='color: #0288d1;'>past quarter</strong> (n): quý vừa qua (khoảng thời gian 3 tháng).</li><li><strong style='color: #0288d1;'>sales</strong> (n): doanh số bán hàng.</li><li><strong style='color: #0288d1;'>region</strong> (n): khu vực, vùng miền.</li><li><strong style='color: #0288d1;'>somewhat</strong> (adv): phần nào, hơi hơi.</li></ul>",

        trans: "<div style='line-height: 1.6; padding: 8px; background-color: #f9f9f9; border-left: 4px solid #0288d1;'><p style='margin: 0;'><strong>Dịch nghĩa:</strong> Trong quý vừa qua, gần như toàn bộ doanh số bán hàng của Renafy Technology đều đến từ một khu vực.</p></div>"
    }
},
        {
    id: 123, 
    q: "Commercial property insurance covers the ------- associated with repairing or rebuilding a business property after certain events.", 
    options: ["expenses", "symptoms", "challenges", "opportunities"], 
    a: "expenses", 
    exp: {
        correct: "<div style='line-height: 1.6;'><p><strong>a. Phân tích thành phần câu:</strong> Dạng bài chọn Từ vựng (Danh từ / Collocation) thuộc ngữ cảnh Bảo hiểm & Tài chính:</p><ul><li><strong>Chủ ngữ (S):</strong> <code>Commercial property insurance</code> — Bảo hiểm tài sản thương mại.</li><li><strong>Động từ chính (V):</strong> <code>covers</code> — Chi trả, bảo hiểm cho.</li><li><strong>Tân ngữ (O):</strong> <code>the [-------] associated with repairing or rebuilding a business property...</code> — Cụm danh từ bao gồm Danh từ chính + Mệnh đề phân từ rút gọn (V3).</li></ul><p><strong>b. Xác định loại từ cần điền:</strong> Cả 4 phương án đều là Danh từ số nhiều. Do đó đây là câu hỏi chọn từ vựng dựa vào <strong>Ngữ nghĩa</strong> và <strong>Collocation</strong> đi với động từ <i>cover</i>.</p><p><strong>c. Lý do chọn đáp án:</strong> Danh từ <span style='color: #2e7d32; font-weight: bold;'>expenses</span> (chi phí) tạo thành cụm Collocation chuyên ngành bảo hiểm: <span style='color: #2e7d32; font-weight: bold;'>cover the expenses</span> (chi trả / bồi hoàn các khoản chi phí phát sinh).</p></div>",

        wrong: "<ul style='line-height: 1.6; list-style-type: none; padding-left: 0;'><li><strong style='color: #c62828;'>❌ (B) symptoms:</strong> Nghĩa là <i>triệu chứng</i> (dùng trong y tế: <i>flu symptoms, illness symptoms</i>). Bảo hiểm không chi trả cho \"triệu chứng\".</li><li><strong style='color: #c62828;'>❌ (C) challenges:</strong> Nghĩa là <i>thách thức, khó khăn</i>. Hoàn toàn mâu thuẫn về mặt ngữ nghĩa trong ngữ cảnh bồi thường bảo hiểm.</li><li><strong style='color: #c62828;'>❌ (D) opportunities:</strong> Nghĩa là <i>cơ hội</i>. Không phù hợp với ngữ cảnh khắc phục thiệt hại (<i>repairing or rebuilding</i>) sau sự cố.</li></ul>",

        grammar: "<div style='line-height: 1.6;'><p><strong>⭐ Rút gọn Mệnh đề Quan hệ dạng Bị động & Collocations Thuật ngữ Bảo hiểm</strong></p><p>Trong các hợp đồng và tài liệu bảo hiểm của TOEIC Part 5 & 6, cấu trúc cụm phân từ rút gọn đi sau danh từ chi phí xuất hiện rất phổ biến.</p><table border='1' style='width: 100%; border-collapse: collapse; border-color: #e0e0e0; margin-top: 10px; font-size: 14px;'><thead style='background-color: #f5f5f5; text-align: left;'><tr><th style='padding: 8px;'>Cụm từ gốc (Đầy đủ)</th><th style='padding: 8px;'>Rút gọn Phân từ (V3)</th><th style='padding: 8px;'>Nghĩa tiếng Việt</th></tr></thead><tbody><tr><td style='padding: 8px;'><strong>expenses which are associated with...</strong></td><td style='padding: 8px;'><strong>expenses associated with...</strong></td><td style='padding: 8px;'>Chi phí liên quan đến / gắn liền với...</td></tr><tr><td style='padding: 8px;'><strong>costs which are related to...</strong></td><td style='padding: 8px;'><strong>costs related to...</strong></td><td style='padding: 8px;'>Chi phí liên quan đến...</td></tr><tr><td style='padding: 8px;'><strong>damages which are caused by...</strong></td><td style='padding: 8px;'><strong>damages caused by...</strong></td><td style='padding: 8px;'>Thiệt hại gây ra bởi...</td></tr></tbody></table><p style='margin-top: 10px;'>💡 <strong>Mẹo làm nhanh chủ đề Insurance:</strong> Khi gặp các động từ như <code>cover / reimburse / incur / claim</code>, hãy ưu tiên các danh từ chỉ tiền bạc/thiệt hại: <strong>expenses, costs, damages, losses, claims</strong>.</p></div>",

        vocab: "<ul style='line-height: 1.6;'><li><strong style='color: #0288d1;'>cover expenses</strong> (v): chi trả / bao hàm chi phí.</li><li><strong style='color: #0288d1;'>commercial property insurance</strong> (n): bảo hiểm tài sản thương mại.</li><li><strong style='color: #0288d1;'>be associated with</strong> (v): liên quan đến, gắn liền với.</li><li><strong style='color: #0288d1;'>rebuild</strong> (v): xây dựng lại.</li><li><strong style='color: #0288d1;'>certain events</strong> (n): các sự kiện/sự cố nhất định (được quy định trong hợp đồng).</li></ul>",

        trans: "<div style='line-height: 1.6; padding: 8px; background-color: #f9f9f9; border-left: 4px solid #0288d1;'><p style='margin: 0;'><strong>Dịch nghĩa:</strong> Bảo hiểm tài sản thương mại chi trả cho các khoản chi phí liên quan đến việc sửa chữa hoặc xây dựng lại cơ sở kinh doanh sau một số sự cố nhất định.</p></div>"
    }
},
        {
    id: 124, 
    q: "The first-aid class usually fills up quickly, so prompt ------- is recommended.", 
    options: ["registration", "detection", "information", "certification"], 
    a: "registration", 
    exp: {
        correct: "<div style='line-height: 1.6;'><p><strong>a. Phân tích thành phần câu:</strong> Dạng bài chọn Từ vựng (Danh từ / Collocation) theo logic ngữ cảnh:</p><ul><li><strong>Mệnh đề 1 (Nguyên nhân):</strong> <code>The first-aid class usually fills up quickly</code> — Lớp học sơ cứu thường nhanh chóng kín chỗ.</li><li><strong>Liên từ:</strong> <code>so</code> — Cho nên, vì vậy.</li><li><strong>Mệnh đề 2 (Kết quả):</strong> <code>prompt [-------] is recommended</code> — Cụm danh từ làm Chủ ngữ + Động từ bị động <i>is recommended</i>.</li></ul><p><strong>b. Xác định loại từ cần điền:</strong> Chỗ trống đứng sau tính từ <i>prompt</i> (kịp thời, nhanh chóng) nên cần một <strong>Danh từ</strong> để làm chủ ngữ. Cả 4 phương án đều là danh từ, do đó cần xét mối quan hệ nguyên nhân - kết quả để chọn từ phù hợp.</p><p><strong>c. Lý do chọn đáp án:</strong> Do lớp học bị <i>kín chỗ nhanh</i> (fills up quickly), hành động logic duy nhất được khuyến nghị là <span style='color: #2e7d32; font-weight: bold;'>registration</span> (sự đăng ký ghi danh). Kết hợp tạo thành Collocation chuẩn: <span style='color: #2e7d32; font-weight: bold;'>prompt registration</span> (việc đăng ký sớm / kịp thời).</p></div>",

        wrong: "<ul style='line-height: 1.6; list-style-type: none; padding-left: 0;'><li><strong style='color: #c62828;'>❌ (B) detection:</strong> Nghĩa là <i>sự phát hiện, dò tìm</i> (thường dùng trong <i>fire detection, disease detection</i>). Hoàn toàn sai logic ngữ cảnh lớp học.</li><li><strong style='color: #c62828;'>❌ (C) information:</strong> Nghĩa là <i>thông tin</i>. Khi lớp học hết chỗ nhanh, việc cần làm là \"đăng ký sớm\" chứ không phải \"thông tin sớm\".</li><li><strong style='color: #c62828;'>❌ (D) certification:</strong> Nghĩa là <i>sự chứng nhận, cấp chứng chỉ</i>. Việc cấp chứng chỉ xảy ra sau khi hoàn thành khóa học, không phải hành động trước khi lớp hết chỗ.</li></ul>",

        grammar: "<div style='line-height: 1.6;'><p><strong>⭐ Ngữ cảnh 'Hết chỗ / Giới hạn số lượng' & Các Collocation Đăng ký trong TOEIC</strong></p><p>Trong các thông báo về hội thảo, khóa học hoặc sự kiện của Part 5 & Part 7, khi xuất hiện cụm từ chỉ tình trạng hết chỗ, các từ chỉ hành động giữ chỗ/đăng ký luôn là đáp án ưu tiên.</p><table border='1' style='width: 100%; border-collapse: collapse; border-color: #e0e0e0; margin-top: 10px; font-size: 14px;'><thead style='background-color: #f5f5f5; text-align: left;'><tr><th style='padding: 8px;'>Tín hiệu Ngữ cảnh (Context Clues)</th><th style='padding: 8px;'>Từ vựng Đi kèm Chuẩn (Collocations)</th><th style='padding: 8px;'>Nghĩa tiếng Việt</th></tr></thead><tbody><tr><td style='padding: 8px;'><strong>fills up quickly</strong> / <strong>space is limited</strong></td><td style='padding: 8px;'><strong>prompt / early registration</strong></td><td style='padding: 8px;'>Đăng ký sớm / kịp thời</td></tr><tr><td style='padding: 8px;'><strong>high demand</strong> / <strong>limited seats</strong></td><td style='padding: 8px;'><strong>advance reservation / booking</strong></td><td style='padding: 8px;'>Đặt chỗ trước</td></tr><tr><td style='padding: 8px;'><strong>first-come, first-served</strong></td><td style='padding: 8px;'><strong>early application</strong></td><td style='padding: 8px;'>Nộp hồ sơ sớm</td></tr></tbody></table><p style='margin-top: 10px;'>💡 <strong>Mẹo làm nhanh:</strong> Nhìn thấy các từ như <code>fills up / limited / popular / high demand</code> ở vế trước, hãy quét nhanh các đáp án chứa <strong>registration, reservation, booking, application</strong>.</p></div>",

        vocab: "<ul style='line-height: 1.6;'><li><strong style='color: #0288d1;'>prompt registration</strong> (n): sự đăng ký kịp thời / đăng ký sớm.</li><li><strong style='color: #0288d1;'>first-aid class</strong> (n): lớp học sơ cứu thương.</li><li><strong style='color: #0288d1;'>fill up</strong> (phr v): đầy, kín chỗ (lớp học, khách sạn, bãi xe).</li><li><strong style='color: #0288d1;'>prompt</strong> (adj): mau lẹ, nhanh chóng, kịp thời.</li><li><strong style='color: #0288d1;'>certification</strong> (n): sự cấp chứng chỉ / bằng cấp.</li></ul>",

        trans: "<div style='line-height: 1.6; padding: 8px; background-color: #f9f9f9; border-left: 4px solid #0288d1;'><p style='margin: 0;'><strong>Dịch nghĩa:</strong> Lớp học sơ cứu thường nhanh chóng kín chỗ, vì vậy việc đăng ký sớm (kịp thời) rất được khuyến nghị.</p></div>"
    }
},
        {
    id: 125, 
    q: "Manufacturing all its products in-house allows Long Bridge Steel Corp. to ------- every aspect of the production process.", 
    options: ["expect", "impress", "remain", "control"], 
    a: "control", 
    exp: {
        correct: "<div style='line-height: 1.6;'><p><strong>a. Phân tích thành phần câu:</strong> Dạng bài chọn Từ vựng (Động từ / Collocation) theo logic kinh doanh & sản xuất:</p><ul><li><strong>Chủ ngữ (S):</strong> <code>Manufacturing all its products in-house</code> — Danh động từ V-ing làm chủ ngữ (Việc sản xuất tất cả sản phẩm nội bộ).</li><li><strong>Động từ chính (V):</strong> <code>allows</code> — Động từ theo cấu trúc <i>allow sb to do sth</i> (Cho phép ai làm gì).</li><li><strong>Tân ngữ gián tiếp (O):</strong> <code>Long Bridge Steel Corp.</code> — Tên công ty.</li><li><strong>Cụm bổ ngữ (O/C):</strong> <code>to [-------] every aspect of the production process</code> — Động từ nguyên mẫu chỉ mục đích/khả năng + Tân ngữ trực tiếp.</li></ul><p><strong>b. Xác định loại từ cần điền:</strong> Chỗ trống đứng sau <i>to</i> cần một <strong>Động từ nguyên mẫu (Bare Infinitive)</strong>. Cả 4 phương án đều là động từ nguyên mẫu nên cần xét ngữ nghĩa và Collocation đi với <i>every aspect...</i>.</p><p><strong>c. Lý do chọn đáp án:</strong> Việc tự sản xuất nội bộ (in-house) giúp doanh nghiệp có khả năng <span style='color: #2e7d32; font-weight: bold;'>control</span> (kiểm soát, quản lý) mọi công đoạn. Kết hợp tạo thành Collocation chuẩn: <span style='color: #2e7d32; font-weight: bold;'>control every aspect of the production process</span> (kiểm soát mọi khía cạnh của quy trình sản xuất).</p></div>",

        wrong: "<ul style='line-height: 1.6; list-style-type: none; padding-left: 0;'><li><strong style='color: #c62828;'>❌ (A) expect:</strong> Nghĩa là <i>mong đợi, chờ đợi</i> (thường đi với <i>expect success, expect growth</i>). Không đi với tân ngữ <i>every aspect of the production process</i>.</li><li><strong style='color: #c62828;'>❌ (B) impress:</strong> Nghĩa là <i>gây ấn tượng</i> (thường đi với người: <i>impress clients, impress voters</i>). Không kết hợp với quy trình sản xuất.</li><li><strong style='color: #c62828;'>❌ (C) remain:</strong> Nghĩa là <i>duy trì, vẫn còn</i>. Đây là Nội động từ (Intransitive Verb) hoặc Liên động từ (Linking Verb - đứng trước Adj/Noun), không nhận tân ngữ trực tiếp <i>every aspect...</i> đằng sau.</li></ul>",

        grammar: "<div style='line-height: 1.6;'><p><strong>⭐ Cấu trúc Cho phép 'Allow sb to V' & Logic Từ vựng Quản lý Sản xuất (In-house vs Outsource)</strong></p><p>Trong các bài đọc và câu hỏi TOEIC về chủ đề Sản xuất & Vận hành (Manufacturing & Operations), sự đối lập giữa tự làm (In-house) và thuê ngoài (Outsource) luôn gắn liền với khái niệm \"Kiểm soát\" (Control).</p><table border='1' style='width: 100%; border-collapse: collapse; border-color: #e0e0e0; margin-top: 10px; font-size: 14px;'><thead style='background-color: #f5f5f5; text-align: left;'><tr><th style='padding: 8px;'>Khái niệm Vận hành</th><th style='padding: 8px;'>Lợi ích / Mục đích chính</th><th style='padding: 8px;'>Động từ / Collocation Thường gặp</th></tr></thead><tbody><tr><td style='padding: 8px;'><strong>In-house Production</strong><br><i>(Sản xuất nội bộ)</i></td><td style='padding: 8px;'>Làm chủ quy trình, đảm bảo chất lượng đồng đều.</td><td style='padding: 8px;'>• <strong>control / monitor / oversee</strong> quality<br>• <strong>control every aspect</strong> of production</td></tr><tr><td style='padding: 8px;'><strong>Outsourcing</strong><br><i>(Thuê ngoài)</i></td><td style='padding: 8px;'>Tối ưu chi phí, tập trung vào chuyên môn chính.</td><td style='padding: 8px;'>• <strong>reduce / cut</strong> operating expenses<br>• <strong>lower</strong> manufacturing costs</td></tr></tbody></table><p style='margin-top: 10px;'>💡 <strong>Mẹo làm nhanh:</strong> Thấy xuất hiện từ khóa <code>in-house</code> ở vế trước, hãy nghĩ ngay đến các động từ nhóm Quản lý / Kiểm soát: <strong>control, monitor, manage, supervise, oversee, inspect</strong>.</p></div>",

        vocab: "<ul style='line-height: 1.6;'><li><strong style='color: #0288d1;'>in-house</strong> (adj/adv): nội bộ, tự làm (không thuê ngoài).</li><li><strong style='color: #0288d1;'>control every aspect</strong> (v): kiểm soát mọi khía cạnh/giai đoạn.</li><li><strong style='color: #0288d1;'>production process</strong> (n): quy trình sản xuất.</li><li><strong style='color: #0288d1;'>allow somebody to do something</strong> (v): cho phép ai làm gì.</li><li><strong style='color: #0288d1;'>aspect</strong> (n): khía cạnh, góc độ.</li></ul>",

        trans: "<div style='line-height: 1.6; padding: 8px; background-color: #f9f9f9; border-left: 4px solid #0288d1;'><p style='margin: 0;'><strong>Dịch nghĩa:</strong> Việc sản xuất toàn bộ sản phẩm trong nội bộ cho phép Long Bridge Steel Corp. kiểm soát mọi khía cạnh của quy trình sản xuất.</p></div>"
    }

       {
    id: 126, 
    q: "------- its use on home-cooking shows, consumer demand for Silvershine Cookware has doubled.", 
    options: ["Moreover", "For example", "Even though", "Because of"], 
    a: "Because of", 
    exp: {
        correct: "<div style='line-height: 1.6;'><p><strong>a. Phân tích thành phần câu:</strong> Dạng bài phân biệt Giới từ vs Liên từ (Preposition vs Conjunction):</p><ul><li><strong>Thành phần đứng sau chỗ trống:</strong> <code>its use on home-cooking shows</code> — Cụm danh từ đóng vai trò làm Nguyên nhân (Việc sản xuất/sử dụng nó trên các chương trình nấu ăn).</li><li><strong>Mệnh đề chính (Mới có S + V):</strong> <code>consumer demand for Silvershine Cookware (S) + has doubled (V)</code> — Nhu cầu của người tiêu dùng đã tăng gấp đôi (Kết quả).</li></ul><p><strong>b. Xác định loại từ cần điền:</strong> Vị trí đứng trước một Cụm danh từ (Noun Phrase) để chỉ mối quan hệ Nguyên nhân - Kết quả bắt buộc phải là một <strong>Giới từ chỉ nguyên nhân</strong>.</p><p><strong>c. Lý do chọn đáp án:</strong> Trong các phương án, chỉ có <span style='color: #2e7d32; font-weight: bold;'>Because of</span> là giới từ chỉ nguyên nhân đi với Cụm danh từ: <span style='color: #2e7d32; font-weight: bold;'>Because of + Noun Phrase</span> (Bởi vì / Do...).</p></div>",

        wrong: "<ul style='line-height: 1.6; list-style-type: none; padding-left: 0;'><li><strong style='color: #c62828;'>❌ (A) Moreover:</strong> Trạng từ liên kết (<i>Hơn thế nữa</i>). Dùng để bổ sung thông tin giữa hai mệnh đề độc lập, không đứng trực tiếp trước cụm danh từ ở đầu câu.</li><li><strong style='color: #c62828;'>❌ (B) For example:</strong> Cụm trạng từ (<i>Ví dụ như</i>). Dùng để đưa ra ví dụ, không dùng chỉ nguyên nhân.</li><li><strong style='color: #c62828;'>❌ (C) Even though:</strong> Liên từ chỉ sự nhượng bộ (<i>Mặc dù</i>). Theo sau bắt buộc phải là một Mệnh đề hoàn chỉnh (S + V), không đi với Cụm danh từ.</li></ul>",

        grammar: "<div style='line-height: 1.6;'><p><strong>⭐ Bẫy Kinh Điển TOEIC: Phân biệt Giới từ (Preposition) & Liên từ (Conjunction)</strong></p><p>Bài thi Part 5 rất hay kiểm tra khả năng phân biệt cặp từ có cùng ngữ nghĩa nhưng khác nhau về mặt cấu trúc ngữ pháp đi kèm.</p><table border='1' style='width: 100%; border-collapse: collapse; border-color: #e0e0e0; margin-top: 10px; font-size: 14px;'><thead style='background-color: #f5f5f5; text-align: left;'><tr><th style='padding: 8px;'>Ý nghĩa ngữ cảnh</th><th style='padding: 8px;'>Giới từ ( + Noun / Noun Phrase / V-ing)</th><th style='padding: 8px;'>Liên từ ( + Clause: S + V)</th></tr></thead><tbody><tr><td style='padding: 8px;'><strong>Bởi vì, do...</strong><br><i>(Chỉ nguyên nhân)</i></td><td style='padding: 8px;'>• <strong>Because of</strong><br>• <strong>Due to / Owing to</strong></td><td style='padding: 8px;'>• <strong>Because / Since</strong><br>• <strong>As / Now that</strong></td></tr><tr><td style='padding: 8px;'><strong>Mặc dù...</strong><br><i>(Chỉ sự nhượng bộ)</i></td><td style='padding: 8px;'>• <strong>Despite</strong><br>• <strong>In spite of</strong></td><td style='padding: 8px;'>• <strong>Although / Even though</strong><br>• <strong>Though</strong></td></tr></tbody></table><p style='margin-top: 10px;'>💡 <strong>Mẹo làm nhanh trong 3 giây:</strong> Nhìn ngay sau chỗ trống:<br>1. Nếu có <code>Động từ chia thì (V)</code> ➔ Chọn <strong>Liên từ</strong> (Because, Although...).<br>2. Nếu chỉ có <code>Cụm Danh từ (Noun Phrase)</code> ➔ Chọn <strong>Giới từ</strong> (Because of, Due to, Despite...).</p></div>",

        vocab: "<ul style='line-height: 1.6;'><li><strong style='color: #0288d1;'>because of</strong> (prep): bởi vì, do.</li><li><strong style='color: #0288d1;'>consumer demand</strong> (n): nhu cầu của người tiêu dùng.</li><li><strong style='color: #0288d1;'>cookware</strong> (n): dụng cụ nấu ăn (nồi, chảo... - danh từ không đếm được).</li><li><strong style='color: #0288d1;'>double</strong> (v): tăng gấp đôi.</li><li><strong style='color: #0288d1;'>home-cooking show</strong> (n): chương trình dạy nấu ăn gia đình.</li></ul>",

        trans: "<div style='line-height: 1.6; padding: 8px; background-color: #f9f9f9; border-left: 4px solid #0288d1;'><p style='margin: 0;'><strong>Dịch nghĩa:</strong> Do được xuất hiện trong các chương trình dạy nấu ăn gia đình, nhu cầu của người tiêu dùng đối với dụng cụ nấu ăn Silvershine đã tăng gấp đôi.</p></div>"
    }

        {
    id: 127, 
    q: "Artists at Cavin Graphics work ------- with clients through all stages of the design process to ensure satisfaction.", 
    options: ["collaborative", "collaboratively", "collaborates", "collaborators"], 
    a: "collaboratively", 
    exp: {
        correct: "<div style='line-height: 1.6;'><p><strong>a. Phân tích thành phần câu:</strong> Dạng bài kiểm tra Từ loại (Part of Speech) bổ nghĩa cho Động từ:</p><ul><li><strong>Chủ ngữ (S):</strong> <code>Artists at Cavin Graphics</code> — Các nghệ sĩ/nhà thiết kế tại Cavin Graphics.</li><li><strong>Động từ chính (V):</strong> <code>work</code> — Nội động từ (Làm việc).</li><li><strong>Cụm giới từ bổ nghĩa (O):</strong> <code>with clients through all stages...</code> — Với khách hàng trong suốt mọi giai đoạn...</li></ul><p><strong>b. Xác định loại từ cần điền:</strong> Chỗ trống đứng ngay sau nội động từ <i>work</i> và trước giới từ <i>with</i>, bắt buộc phải là một <strong>Trạng từ (Adverb)</strong> để bổ nghĩa cách thức hành động cho động từ <i>work</i>.</p><p><strong>c. Lý do chọn đáp án:</strong> Trong các phương án, chỉ có <span style='color: #2e7d32; font-weight: bold;'>collaboratively</span> có đuôi <i>-ly</i> là Trạng từ. Tạo thành cụm diễn đạt vô cùng phổ biến trong môi trường làm việc: <span style='color: #2e7d32; font-weight: bold;'>work collaboratively with somebody</span> (làm việc phối hợp / hợp tác với ai).</p></div>",

        wrong: "<ul style='line-height: 1.6; list-style-type: none; padding-left: 0;'><li><strong style='color: #c62828;'>❌ (A) collaborative:</strong> Tính từ (<i>mang tính hợp tác</i>). Chỉ dùng đứng trước danh từ (ví dụ: <i>collaborative effort, collaborative project</i>), không thể đứng sau nội động từ <i>work</i>.</li><li><strong style='color: #c62828;'>❌ (C) collaborates:</strong> Động từ chia ngôi thứ 3 số ít ở thì Hiện tại đơn. Trong câu đã có động từ chính chia số nhiều là <i>work</i>, không thể xuất hiện động từ chia thì thứ hai.</li><li><strong style='color: #c62828;'>❌ (D) collaborators:</strong> Danh từ số nhiều (<i>những người cộng tác</i>). Không thể đứng chen giữa động từ <i>work</i> và giới từ <i>with</i>.</li></ul>",

        grammar: "<div style='line-height: 1.6;'><p><strong>⭐ Cấu trúc Vị trí Trạng từ Bổ nghĩa cho Động từ & Họ từ 'Collaborate'</strong></p><p>Đây là dạng câu hỏi nhận diện từ loại cơ bản nhưng rất hay gặp trong Part 5. Cấu trúc điển hình: <code>Subject + Verb (intransitive) + Adverb + Prepositional Phrase</code>.</p><table border='1' style='width: 100%; border-collapse: collapse; border-color: #e0e0e0; margin-top: 10px; font-size: 14px;'><thead style='background-color: #f5f5f5; text-align: left;'><tr><th style='padding: 8px;'>Từ loại</th><th style='padding: 8px;'>Từ vựng cụ thể</th><th style='padding: 8px;'>Cấu trúc ngữ pháp chuẩn</th><th style='padding: 8px;'>Ví dụ minh họa</th></tr></thead><tbody><tr><td style='padding: 8px;'><strong>Verb</strong></td><td style='padding: 8px;'>collaborate</td><td style='padding: 8px;'>collaborate with somebody</td><td style='padding: 8px;'><i>We <strong>collaborate</strong> with designers.</i></td></tr><tr><td style='padding: 8px;'><strong>Adverb (Điền)</strong></td><td style='padding: 8px;'><strong>collaboratively</strong></td><td style='padding: 8px;'><strong>work collaboratively with...</strong></td><td style='padding: 8px;'><i>They <strong>work collaboratively</strong>.</i></td></tr><tr><td style='padding: 8px;'><strong>Adjective</strong></td><td style='padding: 8px;'>collaborative</td><td style='padding: 8px;'>collaborative + Noun</td><td style='padding: 8px;'><i>a <strong>collaborative</strong> project</i></td></tr><tr><td style='padding: 8px;'><strong>Noun</strong></td><td style='padding: 8px;'>collaborator / collaboration</td><td style='padding: 8px;'>Head Noun / Object</td><td style='padding: 8px;'><i>in <strong>collaboration</strong> with...</i></td></tr></tbody></table><p style='margin-top: 10px;'>💡 <strong>Mẹo làm nhanh:</strong> Nhìn thấy các động từ phổ biến trong công việc như <code>work / communicate / respond / operate / serve</code> theo sau bởi một giới từ (<i>with, to, in</i>) ➔ Chỗ trống ở giữa luôn là một <strong>Trạng từ (-ly)</strong> (<i>closely, directly, collaboratively, efficiently, quickly</i>).</p></div>",

        vocab: "<ul style='line-height: 1.6;'><li><strong style='color: #0288d1;'>work collaboratively with</strong> (v): làm việc phối hợp / hợp tác với.</li><li><strong style='color: #0288d1;'>ensure satisfaction</strong> (v): đảm bảo sự hài lòng (<i>ensure customer satisfaction</i>).</li><li><strong style='color: #0288d1;'>stage</strong> (n): giai đoạn, bước thực hiện.</li><li><strong style='color: #0288d1;'>design process</strong> (n): quy trình thiết kế.</li><li><strong style='color: #0288d1;'>collaborator</strong> (n): người cộng tác.</li></ul>",

        trans: "<div style='line-height: 1.6; padding: 8px; background-color: #f9f9f9; border-left: 4px solid #0288d1;'><p style='margin: 0;'><strong>Dịch nghĩa:</strong> Các nhà thiết kế tại Cavin Graphics làm việc phối hợp chặt chẽ với khách hàng trong suốt mọi giai đoạn của quy trình thiết kế nhằm đảm bảo sự hài lòng.</p></div>"
    }

        {
    id: 128, 
    q: "Brile Construction’s contract for the mall development project has finally been ------- by the city supervisor.", 
    options: ["verifying", "verifiably", "verified", "verification"], 
    a: "verified", 
    exp: {
        correct: "<div style='line-height: 1.6;'><p><strong>a. Phân tích thành phần câu:</strong> Dạng bài kiểm tra Từ loại trong Thể bị động (Passive Voice):</p><ul><li><strong>Chủ ngữ (S):</strong> <code>Brile Construction’s contract for the mall development project</code> — Hợp đồng của Brile Construction cho dự án phát triển trung tâm thương mại (Vật - chịu tác động).</li><li><strong>Cụm động từ bị động (V):</strong> <code>has + finally (adv) + been + [-------]</code> — Thì Hiện tại hoàn thành dạng bị động.</li><li><strong>Tác nhân (Agent):</strong> <code>by the city supervisor</code> — Bởi người giám sát của thành phố.</li></ul><p><strong>b. Xác định loại từ cần điền:</strong> Cấu trúc bị động kinh điển của thì Hiện tại hoàn thành có dạng: <code>S + have/has + been + V3/ed + (by O)</code>. Chỗ trống đứng sau <i>has been</i> và trước <i>by</i> bắt buộc phải là một <strong>Quá khứ phân từ (V3/ed)</strong>.</p><p><strong>c. Lý do chọn đáp án:</strong> Trong các phương án, chỉ có <span style='color: #2e7d32; font-weight: bold;'>verified</span> là động từ ở dạng V3/ed. Ý nghĩa: Hợp đồng đã được <span style='color: #2e7d32; font-weight: bold;'>xác minh / phê duyệt</span>.</p></div>",

        wrong: "<ul style='line-height: 1.6; list-style-type: none; padding-left: 0;'><li><strong style='color: #c62828;'>❌ (A) verifying:</strong> Động từ ở dạng V-ing (Hiện tại phân từ). Trong cấu trúc <i>has been + V-ing</i> sẽ tạo thành thì Hiện tại hoàn thành tiếp diễn (Chủ động - Chủ ngữ tự thực hiện hành động), không phù hợp với chủ ngữ chỉ vật <i>contract</i> và không đi với giới từ <i>by</i> phía sau.</li><li><strong style='color: #c62828;'>❌ (B) verifiably:</strong> Trạng từ (<i>một cách có thể xác minh được</i>). Không thể đứng ngay sau <i>has been</i> để đóng vai trò làm động từ chính của câu.</li><li><strong style='color: #c62828;'>❌ (D) verification:</strong> Danh từ (<i>sự xác minh</i>). Không đứng sau <i>has been</i> để cấu tạo thì bị động.</li></ul>",

        grammar: "<div style='line-height: 1.6;'><p><strong>⭐ Cấu trúc Bị động của các Thì Hoàn thành & Tín hiệu Bị động Kinh điển</strong></p><p>Nhận diện nhanh thể Bị động (Passive Voice) giúp tiết kiệm thời gian làm bài Part 5 rất lớn.</p><table border='1' style='width: 100%; border-collapse: collapse; border-color: #e0e0e0; margin-top: 10px; font-size: 14px;'><thead style='background-color: #f5f5f5; text-align: left;'><tr><th style='padding: 8px;'>Thì (Tense)</th><th style='padding: 8px;'>Công thức Bị động (Passive)</th><th style='padding: 8px;'>Ví dụ TOEIC thường gặp</th></tr></thead><tbody><tr><td style='padding: 8px;'><strong>Hiện tại hoàn thành</strong></td><td style='padding: 8px;'>S + have/has + <strong>been + V3/ed</strong></td><td style='padding: 8px;'><i>The contract <strong>has been signed</strong>.</i></td></tr><tr><td style='padding: 8px;'><strong>Quá khứ hoàn thành</strong></td><td style='padding: 8px;'>S + had + <strong>been + V3/ed</strong></td><td style='padding: 8px;'><i>The plan <strong>had been approved</strong>.</i></td></tr><tr><td style='padding: 8px;'><strong>Động từ khuyết thiếu</strong></td><td style='padding: 8px;'>S + modal verb + <strong>be + V3/ed</strong></td><td style='padding: 8px;'><i>The form <strong>must be verified</strong>.</i></td></tr></tbody></table><p style='margin-top: 10px;'>💡 <strong>Mẹo làm nhanh 3 giây:</strong> Khi thấy công thức <code>have / has / had + been + [-------] + by + O</code> ➔ Chọn ngay <strong>V3/ed</strong> mà không cần dịch nghĩa cả câu.</p></div>",

        vocab: "<ul style='line-height: 1.6;'><li><strong style='color: #0288d1;'>verify</strong> (v): xác minh, kiểm tra, xác nhận (<i>verify documents, verify identity</i>).</li><li><strong style='color: #0288d1;'>contract</strong> (n): hợp đồng (<i>sign/renew/award a contract</i>).</li><li><strong style='color: #0288d1;'>development project</strong> (n): dự án phát triển / xây dựng.</li><li><strong style='color: #0288d1;'>supervisor</strong> (n): người giám sát, cấp trên.</li><li><strong style='color: #0288d1;'>verification</strong> (n): sự xác minh, quá trình kiểm tra.</li></ul>",

        trans: "<div style='line-height: 1.6; padding: 8px; background-color: #f9f9f9; border-left: 4px solid #0288d1;'><p style='margin: 0;'><strong>Dịch nghĩa:</strong> Hợp đồng của Brile Construction cho dự án phát triển trung tâm thương mại cuối cùng đã được người giám sát của thành phố xác minh/phê duyệt.</p></div>"
    }
},
        {
    id: 129, 
    q: "------- 4,000 Urlvac trash removal systems are in use in the eastern region.", 
    options: ["Always", "Quite", "Almost", "Closely"], 
    a: "Almost", 
    exp: {
        correct: "<div style='line-height: 1.6;'><p><strong>a. Phân tích thành phần câu:</strong> Dạng bài kiểm tra Trạng từ bổ nghĩa cho Con số / Lượng từ:</p><ul><li><strong>Cụm chủ ngữ (S):</strong> <code>[-------] 4,000 Urlvac trash removal systems</code> — [Trạng từ] + 4.000 hệ thống xử lý rác Urlvac.</li><li><strong>Động từ (V) & Cụm vị ngữ:</strong> <code>are in use in the eastern region</code> — Đang được sử dụng tại khu vực phía Đông.</li></ul><p><strong>b. Xác định loại từ cần điền:</strong> Vị trí đứng ngay trước một con số cụ thể (<i>4,000</i>) đóng vai trò bổ nghĩa cho số lượng/mức độ ước lượng, cần một <strong>Trạng từ xấp xỉ (Approximating Adverb)</strong>.</p><p><strong>c. Lý do chọn đáp án:</strong> Trong các phương án, chỉ có <span style='color: #2e7d32; font-weight: bold;'>Almost</span> tạo thành cấu trúc chuẩn: <span style='color: #2e7d32; font-weight: bold;'>Almost + Con số</span> (Gần như / Xấp xỉ đạt mức...). Ý câu: Gần 4.000 hệ thống đang được sử dụng.</p></div>",

        wrong: "<ul style='line-height: 1.6; list-style-type: none; padding-left: 0;'><li><strong style='color: #c62828;'>❌ (A) Always:</strong> Trạng từ chỉ tần suất (<i>Luôn luôn</i>). Không đi trực tiếp bổ nghĩa cho một con số cụ thể để chỉ số lượng.</li><li><strong style='color: #c62828;'>❌ (B) Quite:</strong> Trạng từ chỉ mức độ (<i>Khá, tương đối</i>). Chỉ bổ nghĩa cho Tính từ/Trạng từ (<i>quite good, quite quickly</i>) hoặc cụm từ như <i>quite a few</i>, không đứng trực tiếp ngay trước con số cụ thể (<i>quite 4,000</i> là sai).</li><li><strong style='color: #c62828;'>❌ (D) Closely:</strong> Trạng từ chỉ cách thức (<i>Một cách chặt chẽ</i>). Thường bổ nghĩa cho động từ (<i>work closely, monitor closely</i>), không đi với con số.</li></ul>",

        grammar: "<div style='line-height: 1.6;'><p><strong>⭐ Cấu trúc Trạng từ Bổ nghĩa cho Con số / Phần trăm (Approximating Adverbs)</strong></p><p>Trong các báo cáo số liệu, thống kê kinh doanh TOEIC Part 5, khi đứng trước một con số hoặc lượng từ (<i>all, every, half</i>), bài thi rất hay kiểm tra nhóm trạng từ mang nghĩa \"gần như / xấp xỉ\".</p><table border='1' style='width: 100%; border-collapse: collapse; border-color: #e0e0e0; margin-top: 10px; font-size: 14px;'><thead style='background-color: #f5f5f5; text-align: left;'><tr><th style='padding: 8px;'>Nhóm Trạng từ</th><th style='padding: 8px;'>Từ vựng Điển hình</th><th style='padding: 8px;'>Cấu trúc Đi kèm</th><th style='padding: 8px;'>Ví dụ Minh họa</th></tr></thead><tbody><tr><td style='padding: 8px;'><strong>Gần đạt mốc</strong><br><i>(Chưa tới nhưng rất gần)</i></td><td style='padding: 8px;'>• <strong>Almost</strong><br>• <strong>Nearly</strong></td><td style='padding: 8px;'><strong>+ Number / % / All / Every</strong></td><td style='padding: 8px;'>• <i><strong>Almost 4,000</strong> systems</i><br>• <i><strong>Nearly 50%</strong> of sales</i></td></tr><tr><td style='padding: 8px;'><strong>Xấp xỉ / Khoảng</strong><br><i>(Ước lượng chung)</i></td><td style='padding: 8px;'>• <strong>Approximately</strong><br>• <strong>Roughly / About</strong></td><td style='padding: 8px;'><strong>+ Number / Time / Amount</strong></td><td style='padding: 8px;'>• <i><strong>Approximately 200</strong> attendees</i><br>• <i><strong>Roughly $5,000</strong></i></td></tr></tbody></table><p style='margin-top: 10px;'>💡 <strong>Mẹo làm nhanh 3 giây:</strong> Thấy chỗ trống ở đầu câu đứng trước <code>Con số (4,000 / 100...)</code>, <code>Tỷ lệ %</code> hoặc <code>all / half / every</code> ➔ Ưu tiên chọn ngay <strong>Almost / Nearly / Approximately / Roughly</strong>.</p></div>",

        vocab: "<ul style='line-height: 1.6;'><li><strong style='color: #0288d1;'>almost</strong> (adv): gần như, xấp xỉ (<i>almost 1,000, almost all, almost half</i>).</li><li><strong style='color: #0288d1;'>be in use</strong> (expr): đang được sử dụng (ngược nghĩa: <i>out of use / no longer in use</i>).</li><li><strong style='color: #0288d1;'>trash removal system</strong> (n): hệ thống xử lý / thu gom rác thải.</li><li><strong style='color: #0288d1;'>eastern region</strong> (n): khu vực phía Đông.</li><li><strong style='color: #0288d1;'>closely</strong> (adv): chặt chẽ (<i>work closely with</i>).</li></ul>",

    exp: {
        correct: "<div style='line-height: 1.6;'><p><strong>a. Phân tích thành phần câu:</strong> Dạng bài kiểm tra Cụm từ nối / Cấu trúc song song (Parallel Structure):</p><ul><li><strong>Mệnh đề chính bị động:</strong> <code>The conference schedule (S) + will be posted online (V1)</code> — Lịch trình hội nghị sẽ được đăng tải trực tuyến.</li><li><strong>Thành phần phía sau chỗ trống:</strong> <code>mailed to attendees (V2)</code> — Được gửi thư qua bưu điện cho người tham dự.</li></ul><p><strong>b. Xác định loại từ cần điền:</strong> Hai hành động <i>posted</i> (V1) và <i>mailed</i> (V2) đều ở dạng Quá khứ phân từ (V3/ed) thuộc cấu trúc bị động. Vị trí ở giữa cần một <strong>Cụm từ nối chỉ sự lựa chọn / tương phản</strong> kết nối hai thành phần đồng dạng ngữ pháp (A chứ không phải B / A thay vì B).</p><p><strong>c. Lý do chọn đáp án:</strong> Chỉ có <span style='color: #2e7d32; font-weight: bold;'>rather than</span> là đáp án phù hợp về ngữ nghĩa lẫn ngữ pháp, tạo thành cấu trúc song song: <span style='color: #2e7d32; font-weight: bold;'>V3 (posted) + rather than + V3 (mailed)</span>.</p></div>",

        wrong: "<ul style='line-height: 1.6; list-style-type: none; padding-left: 0;'><li><strong style='color: #c62828;'>❌ (A) in order that:</strong> Liên từ chỉ mục đích (<i>để mà</i>). Theo sau bắt buộc phải là một Mệnh đề hoàn chỉnh (Clause: S + V), không đi trực tiếp với động từ V3 <i>mailed</i>.</li><li><strong style='color: #c62828;'>❌ (B) as soon as:</strong> Liên từ chỉ thời gian (<i>ngay khi</i>). Bắt buộc đi với một Mệnh đề (Clause: S + V) hoặc cụm V-ing, không thể nối trực tiếp V3 trong ngữ cảnh này.</li><li><strong style='color: #c62828;'>❌ (C) in case:</strong> Liên từ chỉ sự phòng ngừa (<i>phòng khi, trong trường hợp</i>). Theo sau bắt buộc phải là một Mệnh đề (S + V).</li></ul>",

        grammar: "<div style='line-height: 1.6;'><p><strong>⭐ Cấu trúc Lựa chọn 'Rather Than' & Nguyên tắc Cấu trúc Song song (Parallelism)</strong></p><p>Trong đề thi TOEIC Part 5, <strong>rather than</strong> thường được dùng để đối lập hai phương án (A thay vì B). Thành phần đứng trước và đứng sau <i>rather than</i> phải hoàn toàn đồng dạng về từ loại.</p><table border='1' style='width: 100%; border-collapse: collapse; border-color: #e0e0e0; margin-top: 10px; font-size: 14px;'><thead style='background-color: #f5f5f5; text-align: left;'><tr><th style='padding: 8px;'>Dạng từ loại nối</th><th style='padding: 8px;'>Cấu trúc Chuẩn với Rather Than</th><th style='padding: 8px;'>Ví dụ Minh họa TOEIC</th></tr></thead><tbody><tr><td style='padding: 8px;'><strong>Verb (V3/ed - Passive)</strong></td><td style='padding: 8px;'>V3 <strong>rather than</strong> V3</td><td style='padding: 8px;'><i>will be <strong>posted</strong> online <strong>rather than mailed</strong></i></td></tr><tr><td style='padding: 8px;'><strong>Verb (V-bare / V-ing)</strong></td><td style='padding: 8px;'>V-bare/ing <strong>rather than</strong> V-bare/ing</td><td style='padding: 8px;'><i><strong>email</strong> clients <strong>rather than call</strong> them</i></td></tr><tr><td style='padding: 8px;'><strong>Noun / Noun Phrase</strong></td><td style='padding: 8px;'>Noun <strong>rather than</strong> Noun</td><td style='padding: 8px;'><i>use <strong>digital forms rather than paper</strong></i></td></tr></tbody></table><p style='margin-top: 10px;'>💡 <strong>Mẹo loại trừ nhanh:</strong> Khi thấy đằng sau chỗ trống chỉ là một Động từ (V) hoặc Cụm danh từ (không có S + V) ➔ Loại ngay các liên từ bắt buộc đi với mệnh đề như <i>in order that, as soon as, in case, because, although</i>.</p></div>",

        vocab: "<ul style='line-height: 1.6;'><li><strong style='color: #0288d1;'>rather than</strong> (conj/prep): thay vì, chứ không phải.</li><li><strong style='color: #0288d1;'>post online</strong> (v): đăng tải trên mạng / trực tuyến.</li><li><strong style='color: #0288d1;'>mail</strong> (v): gửi qua đường bưu điện (thư giấy).</li><li><strong style='color: #0288d1;'>attendee</strong> (n): người tham dự (<i>conference attendees</i>).</li><li><strong style='color: #0288d1;'>conference schedule</strong> (n): lịch trình hội nghị.</li></ul>",
