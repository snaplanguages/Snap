    grammar: "<div style='line-height: 1.6;'><p><strong>⭐ Cấu trúc bổ ngữ và Trạng từ đứng trước Tính từ (Adverb + Adjective)</strong></p><p>Trong các bài thi TOEIC Part 5, bẫy từ loại liên quan đến cấu trúc bổ ngữ <code>Be + Adverb + Adjective</code> xuất hiện với tần suất cực kỳ cao. Quy tắc cốt lõi cần ghi nhớ là trạng từ (Adverb) có nhiệm vụ đứng trước để bổ nghĩa về mặt mức độ hoặc khía cạnh cho một tính từ đứng sau.</p><table border='1' style='width: 100%; border-collapse: collapse; border-color: #e0e0e0; margin-top: 10px; font-size: 14px;'><thead style='background-color: #f5f5f5; text-align: left;'><tr><th style='padding: 8px;'>Cấu trúc kết hợp từ</th><th style='padding: 8px;'>Vai trò ngữ pháp</th><th style='padding: 8px;'>Các cụm từ TOEIC phổ biến</th></tr></thead><tbody><tr><td style='padding: 8px;'><strong>Trạng từ + Tính từ</strong> (Adv + Adj)</td><td style='padding: 8px; color: #2e7d32; font-weight: bold;'>Hợp lệ tuyệt đối</td><td style='padding: 8px;'>financially responsible (hợp lý tài chính), highly effective (hiệu quả cao).</td></tr><tr><td style='padding: 8px;'><strong>Danh từ + Tính từ</strong> (Noun + Adj)</td><td style='padding: 8px; color: #c62828; font-weight: bold;'>KHÔNG hợp lệ</td><td style='padding: 8px;'>Danh từ không thể bổ nghĩa trực tiếp cho tính từ (trừ một vài trường hợp danh từ ghép đặc biệt).</td></tr></tbody></table><p style='margin-top: 10px;'><strong style='color: #e65100;'>🎯 Mẹo làm bài trong 3 giây:</strong> Khi gặp câu có khoảng trống nằm trong cấu trúc cụ thể: <code>be + [______] + tính từ (có các đuôi quen thuộc như -able, -ible, -ive, -ent)</code>, hãy quét nhanh các lựa chọn và ưu tiên khoanh ngay từ có đuôi <i>-ly</i> (Trạng từ) mà không cần mất thời gian dịch nghĩa toàn câu.</p></div>",
    vocab: "<ul style='line-height: 1.6;'><li><strong style='color: #0288d1;'>financially</strong> (adv): về mặt tài chính, xét trên khía cạnh kinh tế (Cụm từ hay gặp: <i>financially stable</i>: ổn định về tài chính, <i>financially independent</i>: độc lập tài chính).</li><li><strong style='color: #0288d1;'>responsible</strong> (adj): hợp lý, đúng đắn, có trách nhiệm (Trong ngữ cảnh quản trị doanh nghiệp, cụm <i>financially responsible</i> dùng để mô tả một quyết định chi tiêu khôn ngoan, an toàn cho ngân sách).</li><li><strong style='color: #0288d1;'>according to</strong> (prep): theo như, căn cứ theo ai/tài liệu nào đó (Cụm từ mở đầu cực kỳ phổ biến: <i>according to the report / survey / schedule</i>).</li></ul>",
    trans: "<div style='line-height: 1.6; padding: 8px; background-color: #f9f9f9; border-left: 4px solid #0288d1;'><p style='margin: 0 0 8px 0;'><strong>Dịch nghĩa gốc:</strong> Theo Giám đốc điều hành Mayu Yamada, nó sẽ không có trách nhiệm về mặt tài chính nếu mở rộng nhà kho vào thời điểm này.</p><p style='margin: 0; font-style: italic; color: #555;'><strong>Dịch tự nhiên:</strong> Theo Giám đốc điều hành Mayu Yamada, xét trên khía cạnh tài chính và ngân sách thì việc mở rộng quy mô nhà kho vào thời điểm hiện tại là một quyết định hoàn toàn không hợp lý.</p></div>"
  }
},
        {
  id: 113,
  q: "Analysts cannot say with any ______ what the regional demand for electric trucks will be.",
  options: [
    "certainty",
    "justice",
    "excellence",
    "denial"
  ],
  a: "certainty",
  exp: {
    correct: "<div style='line-height: 1.6;'><p><strong>a. Phân tích thành phần câu:</strong> Câu có cấu trúc phức chứa một mệnh đề danh từ đóng vai trò làm tân ngữ chính cho động từ, thành phần được phân tách cụ thể như sau:</p><ul><li><strong>S (Subject):</strong> <code>Analysts</code> (Các nhà phân tích).</li><li><strong>V (Verb):</strong> <code>cannot say</code> (không thể khẳng định/nói).</li><li><strong>Cụm giới từ bổ nghĩa:</strong> <code>with any ______</code> (với bất kỳ sự... nào).</li><li><strong>O (Object - Mệnh đề danh từ):</strong> <code>what the regional demand for electric trucks will be</code> (nhu cầu khu vực đối với xe tải điện sẽ ra sao trong tương lai).</li></ul><p><strong>b. Xác định từ loại:</strong> Khoảng trống đứng sau lượng từ <i>any</i> và giới từ <i>with</i>. Theo quy tắc cấu trúc ngữ pháp, vị trí này chắc chắn phải điền một <strong>Danh từ (Noun)</strong>.</p><p><strong>c. Lý do chọn đáp án:</strong> Do cả 4 phương án đưa ra đều là danh từ, ta phải xét đến ngữ cảnh dự báo thị trường và xu hướng kết hợp từ tự nhiên (collocation). Cụm từ cố định <i>say with certainty</i> mang nghĩa 'khẳng định một cách chắc chắn'. Do đó, phương án <span style='color: #2e7d32; font-weight: bold;'>certainty</span> là đáp án hoàn toàn chính xác.</p></div>",
    wrong: "<ul style='line-height: 1.6; list-style-type: none; padding-left: 0;'><li><strong style='color: #c62828;'>❌ (B) justice:</strong> Danh từ mang nghĩa 'công lý, sự công bằng' (Ví dụ: <i>social justice</i>: công bằng xã hội). Từ này hoàn toàn không phù hợp và không tạo ra ý nghĩa logic với hành động phát ngôn hay phân tích số liệu.</li><li><strong style='color: #c62828;'>❌ (C) excellence:</strong> Danh từ chỉ 'sự xuất sắc, ưu tú' (Ví dụ: <i>operational excellence</i>: sự tối ưu trong vận hành). Từ này sai hoàn toàn về mặt ngữ nghĩa khi ghép vào ngữ cảnh của câu.</li><li><strong style='color: #c62828;'>❌ (D) denial:</strong> Danh từ chỉ 'sự phủ nhận, từ chối thừa nhận' (Ví dụ: <i>issue a denial</i>: đưa ra lời phủ nhận). Phương án này không tạo thành một cụm diễn đạt hợp lý với động từ chính <i>say</i>.</li></ul>",
    grammar: "<div style='line-height: 1.6;'><p><strong>⭐ Cụm từ cố định với Giới từ & Bẫy từ vựng cùng từ loại (Prepositional Collocations)</strong></p><p>Trong đề thi TOEIC Part 5, khi cả 4 phương án đều có chung một từ loại (ở đây là danh từ), bài toán sẽ chuyển từ kiểm tra ngữ pháp thuần túy sang kiểm tra khả năng kết hợp từ (Collocation) tự nhiên. Cụm cấu trúc <code>with + [Danh từ trừu tượng]</code> thường được dùng tương đương như một trạng từ để bổ nghĩa cho động từ hành động phía trước.</p><table border='1' style='width: 100%; border-collapse: collapse; border-color: #e0e0e0; margin-top: 10px; font-size: 14px;'><thead style='background-color: #f5f5f5; text-align: left;'><tr><th style='padding: 8px;'>Cấu trúc Collocation cố định</th><th style='padding: 8px;'>Ý nghĩa tương đương</th><th style='padding: 8px;'>Động từ đi kèm phổ biến</th></tr></thead><tbody><tr><td style='padding: 8px;'><strong>with certainty</strong></td><td style='padding: 8px; color: #2e7d32; font-weight: bold;'>một cách chắc chắn</td><td style='padding: 8px;'>say, know, predict, determine</td></tr><tr><td style='padding: 8px;'><strong>with ease</strong></td><td style='padding: 8px; color: #2e7d32; font-weight: bold;'>một cách dễ dàng</td><td style='padding: 8px;'>complete, finish, solve, locate</td></tr></tbody></table><p style='margin-top: 10px;'><strong style='color: #e65100;'>🎯 Mẹo làm bài trong 3 giây:</strong> Khi gặp cấu trúc câu chứa cụm từ <code>say / know / predict + with + (any) + [______]</code>, hãy quét nhanh các lựa chọn và ưu tiên chọn ngay danh từ <i>certainty</i> (sự chắc chắn) hoặc <i>confidence</i> (sự tự tin). Đây là những cụm từ chuyên dụng xuất hiện liên tục trong các văn cảnh báo cáo kinh tế của đề thi TOEIC.</p></div>",
    vocab: "<ul style='line-height: 1.6;'><li><strong style='color: #0288d1;'>certainty</strong> (n): sự chắc chắn, điều xác thực (Cụm từ cốt lõi: <i>say/predict with certainty</i>: khẳng định/dự báo một cách chắc chắn).</li><li><strong style='color: #0288d1;'>demand for</strong> (n.phr): nhu cầu đối với hàng hóa hoặc dịch vụ nào đó (Lưu ý danh từ <i>demand</i> luôn đi với giới từ <i>for</i>, ví dụ: <i>demand for housing / skilled labor</i>).</li><li><strong style='color: #0288d1;'>analyst</strong> (n): nhà phân tích, chuyên viên phân tích (Các vị trí phổ biến: <i>market analyst</i>: nhà phân tích thị trường, <i>financial analyst</i>).</li></ul>",
    trans: "<div style='line-height: 1.6; padding: 8px; background-color: #f9f9f9; border-left: 4px solid #0288d1;'><p style='margin: 0 0 8px 0;'><strong>Dịch nghĩa gốc:</strong> Các nhà phân tích không thể nói với bất kỳ sự chắc chắn nào về việc nhu cầu khu vực đối với xe tải điện sẽ là gì.</p><p style='margin: 0; font-style: italic; color: #555;'><strong>Dịch tự nhiên:</strong> Các nhà phân tích hiện vẫn chưa thể khẳng định một cách chắc chắn về nhu cầu tiêu thụ xe tải điện tại khu vực này trong thời gian tới.</p></div>"
  }
},
        {
  id: 114,
  q: "As part of its marketing campaign, Elegancia Dishware is ______ soliciting feedback from customers.",
  options: [
    "lightly",
    "loyally",
    "actively",
    "cleanly"
  ],
  a: "actively",
  exp: {
    correct: "<div style='line-height: 1.6;'><p><strong>a. Phân tích thành phần câu:</strong> Câu ở thì Hiện tại tiếp diễn phối hợp cụm giới từ mở đầu chỉ mục đích, cấu trúc được bóc tách như sau:</p><ul><li><strong>Trạng ngữ chỉ bối cảnh:</strong> <code>As part of its marketing campaign</code> (Như là một phần của chiến dịch tiếp thị).</li><li><strong>S (Subject):</strong> <code>Elegancia Dishware</code> (Tên thương hiệu).</li><li><strong>V (Verb):</strong> <code>is soliciting</code> (Động từ chia ở thì Hiện tại tiếp diễn, mang nghĩa kêu gọi/thu thập).</li><li><strong>O (Object):</strong> <code>feedback from customers</code> (phản hồi từ khách hàng).</li></ul><p><strong>b. Xác định từ loại:</strong> Khoảng trống đứng giữa trợ động từ <i>is</i> và danh phân từ <i>soliciting</i> (V-ing) tạo nên vị ngữ chính. Quy tắc vị trí quy định thành phần chèn giữa cấu trúc thì tiếp diễn này phải là một <strong>Trạng từ (Adverb)</strong> để bổ nghĩa cho hành động phía sau.</p><p><strong>c. Lý do chọn đáp án:</strong> Cả 4 phương án đều là trạng từ đuôi -ly, do đó đây là bài toán chọn nghĩa theo sự kết hợp từ (Collocation). Trong một chiến dịch marketing, việc doanh nghiệp triển khai kêu gọi đóng góp ý kiến sẽ mang sắc thái \"chủ động, tích cực\". Phương án <span style='color: #2e7d32; font-weight: bold;'>actively</span> kết hợp hoàn hảo với động từ <i>solicit</i> để tạo nên nghĩa logic nhất.</p></div>",
    wrong: "<ul style='line-height: 1.6; list-style-type: none; padding-left: 0;'><li><strong style='color: #c62828;'>❌ (A) lightly:</strong> Trạng từ mang nghĩa 'nhẹ nhàng, hời hợt' (Ví dụ: <i>lightly seasoned</i>: nêm nếm nhẹ). Từ này hoàn toàn lệch tông khi mô tả tính chất nghiêm túc, bài bản của một chiến dịch marketing doanh nghiệp.</li><li><strong style='color: #c62828;'>❌ (B) loyally:</strong> Trạng từ mang nghĩa 'một cách trung thành' (Ví dụ: <i>loyally support the brand</i>: trung thành ủng hộ thương hiệu). Từ này dùng để chỉ phẩm chất của con người (khách hàng, nhân viên), không dùng để mô tả hành động thu thập dữ liệu của công ty.</li><li><strong style='color: #c62828;'>❌ (D) cleanly:</strong> Trạng từ mang nghĩa 'sạch sẽ, gọn gàng, dứt khoát' (Ví dụ: <i>cut cleanly</i>: cắt một cách dứt khoát). Từ này hoàn toàn sai ngữ nghĩa và không có mối liên kết logic với động từ <i>solicit</i>.</li></ul>",
    grammar: "<div style='line-height: 1.6;'><p><strong>⭐ Vị trí Trạng từ giữa thì tiếp diễn & Bẫy kết hợp từ thương mại (Adverb positions in Continuous Tenses)</strong></p><p>Trong cấu trúc câu của đề thi TOEIC, vị trí chèn giữa <code>Be + [______] + V-ing</code> luôn là đất diễn của các trạng từ chỉ cách thức hoặc tần suất. Khi bài toán cung cấp cả 4 phương án đều là trạng từ hợp ngữ pháp, điều duy nhất giúp bạn ăn điểm là nhận diện được các cụm từ thương mại cố định (Business Collocations).</p><table border='1' style='width: 100%; border-collapse: collapse; border-color: #e0e0e0; margin-top: 10px; font-size: 14px;'><thead style='background-color: #f5f5f5; text-align: left;'><tr><th style='padding: 8px;'>Trạng từ mục tiêu</th><th style='padding: 8px;'>Collocation với nhóm từ \"Tìm kiếm / Thu thập\"</th><th style='padding: 8px;'>Ngữ cảnh thực tế trong TOEIC</th></tr></thead><tbody><tr><td style='padding: 8px;'><strong>Actively</strong></td><td style='padding: 8px; color: #2e7d32; font-weight: bold;'>solicit feedback, seek solutions, recruit candidates</td><td style='padding: 8px;'>Chủ động, tích cực làm gì đó để đạt được mục tiêu chiến lược của công ty.</td></tr><tr><td style='padding: 8px;'><strong>Currently / Presently</strong></td><td style='padding: 8px; color: #0288d1; font-weight: bold;'>seeking, expanding, reviewing</td><td style='padding: 8px;'>Nhấn mạnh hành động đang diễn ra ngay tại thời điểm nói.</td></tr></tbody></table><p style='margin-top: 10px;'><strong style='color: #e65100;'>🎯 Mẹo làm bài trong 3 giây:</strong> Khi gặp cấu trúc <code>be + [______] + V-ing</code> liên quan đến các động từ mang tính chất thu thập/tìm kiếm như <i>solicit, seek, gather, promote</i> trong bối cảnh các chiến dịch kinh doanh, hãy quét nhanh đáp án và ưu tiên chọn ngay <code style='color: #2e7d32; font-weight: bold;'>actively</code> hoặc <code style='color: #0288d1; font-weight: bold;'>currently</code>.</p></div>",
    vocab: "<ul style='line-height: 1.6;'><li><strong style='color: #0288d1;'>solicit</strong> (v): kêu gọi, thu thập, xin (Mang tính chất chủ động đề nghị từ một phía. Các cụm từ TOEIC bắt buộc phải nhớ: <i>solicit feedback / opinions / donations / applications</i>).</li><li><strong style='color: #0288d1;'>feedback</strong> (n): ý kiến phản hồi (Lưu ý đây là danh từ không đếm được, thường đi kèm các động từ như <i>gather / receive / respond to feedback</i>).</li><li><strong style='color: #0288d1;'>as part of</strong> (idiom): như là một phần của, nằm trong khuôn khổ của (Cụm từ mở đầu cực kỳ phổ biến trong đề đọc: <i>as part of the training program / marketing campaign</i>).</li></ul>",
    trans: "<div style='line-height: 1.6; padding: 8px; background-color: #f9f9f9; border-left: 4px solid #0288d1;'><p style='margin: 0 0 8px 0;'><strong>Dịch nghĩa gốc:</strong> Như là một phần của chiến dịch tiếp thị của mình, Elegancia Dishware đang thu thập một cách tích cực phản hồi từ khách hàng.</p><p style='margin: 0; font-style: italic; color: #555;'><strong>Dịch tự nhiên:</strong> Nằm trong khuôn khổ chiến dịch marketing mới, thương hiệu Elegancia Dishware đang chủ động triển khai thu thập các ý kiến phản hồi đóng góp từ phía khách hàng.</p></div>"
  }
},
        {
  id: 115,
  q: "Rain gardens are intended to ______ water to prevent flooding of local roads.",
  options: [
    "engage",
    "undergo",
    "absorb",
    "overwhelm"
  ],
  a: "absorb",
  exp: {
    correct: "<div style='line-height: 1.6;'><p><strong>a. Phân tích thành phần câu:</strong> Câu sử dụng cấu trúc bị động thể hiện mục đích công năng của một sự vật, thành phần cụ thể bao gồm:</p><ul><li><strong>S (Subject):</strong> <code>Rain gardens</code> (Các khu vườn mưa - số nhiều).</li><li><strong>V (Passive Verb):</strong> <code>are intended</code> (Được thiết kế / Nhằm mục đích).</li><li><strong>To-V:</strong> <code>to ______</code> (Cụm động từ nguyên mẫu chỉ mục đích tác động trực tiếp lên tân ngữ phía sau).</li><li><strong>O (Object):</strong> <code>water</code> (nước).</li><li><strong>Cụm bổ nghĩa chỉ mục đích mở rộng:</strong> <code>to prevent flooding of local roads</code> (để ngăn ngừa tình trạng ngập lụt trên các tuyến đường địa phương).</li></ul><p><strong>b. Xác định từ loại:</strong> Khoảng trống đứng sau cấu trúc chỉ mục đích <i>to</i> và đứng ngay trước danh từ làm tân ngữ <i>water</i>. Do đó, vị trí này chắc chắn phải điền một <strong>Động từ nguyên mẫu (Bare Infinitive)</strong>. Vì cả 4 phương án đề bài đưa ra đều là động từ nguyên mẫu, đây là dạng bài toán chọn nghĩa của từ theo ngữ cảnh.</p><p><strong>c. Lý do chọn đáp án:</strong> Xét về mặt ngữ nghĩa và logic sinh thái, các khu vườn mưa được xây dựng nhằm giải quyết bài toán ngập lụt cục bộ, hành động cơ học phù hợp nhất của đất và thực vật đối với dòng nước chảy là \"thấm hút / hấp thụ\". Do đó, phương án <span style='color: #2e7d32; font-weight: bold;'>absorb</span> là đáp án hoàn toàn chính xác.</p></div>",
    wrong: "<ul style='line-height: 1.6; list-style-type: none; padding-left: 0;'><li><strong style='color: #c62828;'>❌ (A) engage:</strong> Động từ mang nghĩa 'tham gia, thu hút hoặc đính hôn' (Ví dụ: <i>engage in a project</i>: tham gia vào một dự án, <i>engage customers</i>). Từ này hoàn toàn không thể đi kèm với tân ngữ chỉ vật chất lỏng như nước.</li><li><strong style='color: #c62828;'>❌ (B) undergo:</strong> Động từ mang nghĩa 'trải qua, chịu đựng' một quá trình biến đổi, thử thách hoặc điều trị y tế (Ví dụ: <i>undergo maintenance</i>: trải qua bảo trì, <i>undergo surgery</i>). Từ này hoàn toàn lệch tông ngữ nghĩa trong ngữ cảnh này.</li><li><strong style='color: #c62828;'>❌ (D) overwhelm:</strong> Động từ mang nghĩa 'áp đảo, làm tràn ngập, quá tải' (Ví dụ: <i>overwhelm the system</i>: làm quá tải hệ thống). Trong thực tế tự nhiên, dòng nước mới là tác nhân làm ngập đường xá (<i>water overwhelms roads</i>), việc dùng khu vườn để áp đảo nước là cách dùng từ phản logic.</li></ul>",
    grammar: "<div style='line-height: 1.6;'><p><strong>⭐ Cấu trúc chỉ Mục đích Thiết kế & Sự kết hợp từ tự nhiên (Purpose Structures & Collocations)</strong></p><p>Trong đề thi TOEIC Part 5, cấu trúc <code>be intended to + V-inf</code> được dùng với tần suất rất cao để mô tả mục đích sử dụng, công năng hoặc đối tượng hướng tới của một sản phẩm, dịch vụ hay công trình. Khi xử lý bài toán từ vựng dạng này, việc nắm chắc các cụm từ đi liền (Collocation) liên quan đến chất lỏng hoặc các hiện tượng tự nhiên sẽ giúp bạn loại trừ phương án sai rất nhanh.</p><table border='1' style='width: 100%; border-collapse: collapse; border-color: #e0e0e0; margin-top: 10px; font-size: 14px;'><thead style='background-color: #f5f5f5; text-align: left;'><tr><th style='padding: 8px;'>Cấu trúc ngữ pháp tiêu biểu</th><th style='padding: 8px;'>Ý nghĩa bản chất</th><th style='padding: 8px;'>Collocation phổ biến đi kèm</th></tr></thead><tbody><tr><td style='padding: 8px;'><strong>be intended to + V-inf</strong></td><td style='padding: 8px; color: #2e7d32; font-weight: bold;'>Được thiết kế nhằm mục đích...</td><td style='padding: 8px;'>be intended to improve / reduce / help / prevent</td></tr><tr><td style='padding: 8px;'><strong>absorb + [Tân ngữ]</strong></td><td style='padding: 8px; color: #0288d1; font-weight: bold;'>Thấm hút, hấp thụ cái gì...</td><td style='padding: 8px;'>absorb water (hút nước), absorb moisture (hút ẩm), absorb heat (hấp thụ nhiệt)</td></tr></tbody></table><p style='margin-top: 10px;'><strong style='color: #e65100;'>🎯 Mẹo làm bài trong 3 giây:</strong> Khi gặp cấu trúc câu chứa tân ngữ là <code>water / moisture / liquid</code> phối hợp với một mệnh đề chỉ mục đích là <code>prevent flooding / damage</code> (ngăn lụt/thiệt hại), hãy quét nhanh đáp án và chọn ngay động từ <code style='color: #2e7d32; font-weight: bold;'>absorb</code>. Cụm <i>absorb water</i> là một collocation kinh điển xuất hiện liên tục trong văn cảnh môi trường và kỹ thuật của bài thi TOEIC.</p></div>",
    vocab: "<ul style='line-height: 1.6;'><li><strong style='color: #0288d1;'>absorb</strong> (v): thấm hút, hấp thụ (Các biến thể từ loại hay gặp khác: <i>absorption</i> (n): sự hấp thụ, <i>absorbent</i> (adj): có tính thấm hút cao).</li><li><strong style='color: #0288d1;'>be intended to do something</strong> (v.phr): được thiết kế để làm gì, dành riêng cho mục đích gì (Phân biệt với cụm chủ động <i>intend to do sth</i>: ai đó dự định làm gì).</li><li><strong style='color: #0288d1;'>prevent</strong> (v): ngăn chặn, phòng ngừa (Cấu trúc chuyên dụng cần nhớ: <i>prevent something from happening</i> hoặc <i>prevent flooding / delays / losses</i>).</li></ul>",
    trans: "<div style='line-height: 1.6; padding: 8px; background-color: #f9f9f9; border-left: 4px solid #0288d1;'><p style='margin: 0 0 8px 0;'><strong>Dịch nghĩa gốc:</strong> Các khu vườn mưa được thiết kế nhằm mục đích hấp thụ nước để ngăn chặn việc ngập lụt của các con đường địa phương.</p><p style='margin: 0; font-style: italic; color: #555;'><strong>Dịch tự nhiên:</strong> Các khu vườn mưa được xây dựng với mục đích thấm hút nước mưa nhằm hạn chế tối đa tình trạng ngập úng trên các tuyến đường trong khu vực.</p></div>"
  }
},
        {
  id: 116,
  q: "Theta Industries’ training program aims to increase the ______ of its manufacturing systems.",
  options: [
    "producer",
    "produced",
    "productive",
    "productivity"
  ],
  a: "productivity",
  exp: {
    correct: "<div style='line-height: 1.6;'><p><strong>a. Phân tích thành phần câu:</strong> Câu diễn tả mục tiêu hành động của một chương trình doanh nghiệp với cấu trúc cơ bản như sau:</p><ul><li><strong>S (Subject):</strong> <code>Theta Industries’ training program</code> (Chương trình đào tạo của công ty Theta Industries - cụm danh từ số ít).</li><li><strong>V (Verb):</strong> <code>aims</code> (động từ chính chia ở số ít theo chủ ngữ).</li><li><strong>To-V:</strong> <code>to increase</code> (động từ nguyên mẫu chỉ mục đích, mang nghĩa gia tăng/nâng cao).</li><li><strong>O (Object):</strong> Cụm danh từ làm tân ngữ chính bắt đầu bằng <code>the ______ of its manufacturing systems</code>.</li></ul><p><strong>b. Xác định từ loại:</strong> Khoảng trống nằm trong cấu trúc ngữ pháp kinh điển: <i>the + ______ + of + Cụm danh từ</i>. Dựa theo quy tắc cấu trúc cụm danh từ, vị trí nằm giữa mạo từ xác định <i>the</i> và giới từ <i>of</i> bắt buộc phải điền một <strong>Danh từ (Noun)</strong>.</p><p><strong>c. Lý do chọn đáp án:</strong> Đề bài đưa ra hai danh từ là <i>producer</i> (chỉ người/tổ chức) và <i>productivity</i> (chỉ khái niệm). Xét theo logic ngữ cảnh, mục đích của việc đào tạo nhân sự là để thúc đẩy \"năng suất/hiệu suất\" của hệ thống vận hành. Do đó, phương án <span style='color: #2e7d32; font-weight: bold;'>productivity</span> là đáp án hoàn toàn chính xác.</p></div>",
    wrong: "<ul style='line-height: 1.6; list-style-type: none; padding-left: 0;'><li><strong style='color: #c62828;'>❌ (A) producer:</strong> Danh từ đếm được chỉ người hoặc tổ chức mang nghĩa 'nhành sản xuất, người sản xuất' (Ví dụ: <i>movie producer</i>). Không thể dùng hành động tăng số lượng 'nhà sản xuất' của một hệ thống máy móc được, hoàn toàn sai logic ngữ nghĩa.</li><li><strong style='color: #c62828;'>❌ (B) produced:</strong> Dạng động từ chia quá khứ hoặc phân từ hai (V-ed) của động từ <i>produce</i>. Dạng từ này không có chức năng ngữ pháp để đứng độc lập sau mạo từ <i>the</i> trong cấu trúc này.</li><li><strong style='color: #c62828;'>❌ (C) productive:</strong> Tính từ mang nghĩa 'có năng suất cao, màu mỡ, hiệu quả' (Ví dụ: <i>a productive meeting</i>). Tính từ không thể đứng ngay trước giới từ <i>of</i> để cấu tạo nên cấu trúc cụm danh từ làm tân ngữ.</li></ul>",
    grammar: "<div style='line-height: 1.6;'><p><strong>⭐ Cấu trúc Cụm Danh từ & Phân biệt Danh từ chỉ người / vật (Noun Phrase Structure)</strong></p><p>Trong đề thi TOEIC Part 5, bẫy họ từ (Word Family) kết hợp phân biệt danh từ chỉ người và danh từ trừu tượng xuất hiện rất thường xuyên. Hãy nhớ nguyên tắc vàng: Cấu trúc <code>the + [______] + of</code> là dấu hiệu nhận biết danh từ chính xác đến 99%. Khi có nhiều hơn một danh từ xuất hiện, ta phải xét đến khả năng kết hợp từ với động từ phía trước (như <i>increase / improve / boost</i>).</p><table border='1' style='width: 100%; border-collapse: collapse; border-color: #e0e0e0; margin-top: 10px; font-size: 14px;'><thead style='background-color: #f5f5f5; text-align: left;'><tr><th style='padding: 8px;'>Họ từ của gốc \"Produce\"</th><th style='padding: 8px;'>Từ loại & Nghĩa bản chất</th><th style='padding: 8px;'>Collocation với động từ \"Increase\"</th></tr></thead><tbody><tr><td style='padding: 8px;'><strong>productivity</strong></td><td style='padding: 8px; color: #2e7d32; font-weight: bold;'>Danh từ (năng suất, hiệu suất)</td><td style='padding: 8px;'>increase / boost / improve productivity (Hợp lệ)</td></tr><tr><td style='padding: 8px;'><strong>producer</strong></td><td style='padding: 8px; color: #c62828; font-weight: bold;'>Danh từ (nhà sản xuất)</td><td style='padding: 8px;'>Không kết hợp với động từ tăng trưởng theo chỉ số.</td></tr></tbody></table><p style='margin-top: 10px;'><strong style='color: #e65100;'>🎯 Mẹo làm bài trong 3 giây:</strong> Khi nhìn thấy cấu trúc song hành <code>increase / improve + the + [______] + of</code>, hãy ưu tiên tìm kiếm các danh từ trừu tượng chỉ hiệu suất hoặc chất lượng có đuôi như <i>-activity, -ivity, -iciency, -y</i> để khoanh ngay lập tức.</p></div>",
    vocab: "<ul style='line-height: 1.6;'><li><strong style='color: #0288d1;'>productivity</strong> (n): năng suất, hiệu suất làm việc (Cụm từ cố định bắt buộc phải nhớ: <i>labor productivity</i>: năng suất lao động, <i>boost/improve productivity</i>).</li><li><strong style='color: #0288d1;'>aim to do something</strong> (v.phr): nhằm mục đích làm gì, hướng tới mục tiêu gì (Đồng nghĩa với cụm <i>be designed to do sth</i> hoặc <i>target sth</i>).</li><li><strong style='color: #0288d1;'>manufacturing system</strong> (n.phr): hệ thống sản xuất công nghiệp (Các thuật ngữ liên quan: <i>manufacturing plant</i>: nhà máy chế tạo, <i>manufacturing process</i>: quy trình sản xuất).</li></ul>",
    trans: "<div style='line-height: 1.6; padding: 8px; background-color: #f9f9f9; border-left: 4px solid #0288d1;'><p style='margin: 0 0 8px 0;'><strong>Dịch nghĩa gốc:</strong> Chương trình đào tạo của Theta Industries nhằm mục đích gia tăng năng suất của các hệ thống sản xuất của nó.</p><p style='margin: 0; font-style: italic; color: #555;'><strong>Dịch tự nhiên:</strong> Chương trình đào tạo của Theta Industries được triển khai nhằm cải thiện và nâng cao năng suất hoạt động của toàn bộ hệ thống sản xuất trong doanh nghiệp.</p></div>"
  }
},
        {
  id: 117,
  q: "The board of directors has voted to award Mr. Mitrakos a bonus for his role ______ obtaining the international contract.",
  options: [
    "in",
    "at",
    "except",
    "apart"
  ],
  a: "in",
  exp: {
    correct: "<div style='line-height: 1.6;'><p><strong>a. Phân tích thành phần câu:</strong> Câu sử dụng động từ truyền tặng có hai tân ngữ kết hợp với trạng ngữ chỉ nguyên do phía sau, cấu trúc phân tích như sau:</p><ul><li><strong>S (Subject):</strong> <code>The board of directors</code> (Hội đồng quản trị).</li><li><strong>V (Verb):</strong> <code>has voted to award</code> (Đã bỏ phiếu để trao thưởng).</li><li><strong>IO (Indirect Object):</strong> <code>Mr. Mitrakos</code> (Ông Mitrakos - tân ngữ gián tiếp).</li><li><strong>DO (Direct Object):</strong> <code>a bonus</code> (Khoản tiền thưởng - tân ngữ trực tiếp).</li><li><strong>Cụm giới từ chỉ lý do:</strong> <code>for his role ______ obtaining the international contract</code> (vì vai trò của ông... việc giành được hợp đồng quốc tế).</li></ul><p><strong>b. Xác định từ loại:</strong> Khoảng trống đứng sau danh từ <i>role</i> (vai trò) và đứng trước danh động từ <i>obtaining</i> (V-ing làm tân ngữ cho giới từ). Đây là dạng bài kiểm tra về <strong>Giới từ theo cụm cố định (Prepositional Collocation)</strong> đi kèm sau danh từ.</p><p><strong>c. Lý do chọn đáp án:</strong> Theo quy tắc kết hợp từ tự nhiên trong tiếng Anh thương mại, cấu trúc diễn tả \"vai trò của ai đó trong việc gì hoặc hành động gì\" bắt buộc phải đi với giới từ <i>in</i> (<i>role in doing something</i>). Do đó, phương án <span style='color: #2e7d32; font-weight: bold;'>in</span> là đáp án hoàn toàn chính xác.</p></div>",
    wrong: "<ul style='line-height: 1.6; list-style-type: none; padding-left: 0;'><li><strong style='color: #c62828;'>❌ (B) at:</strong> Giới từ thường chỉ vị trí không gian/thời gian cụ thể (Ví dụ: <i>at the office, at 9 AM</i>) hoặc mức độ. Hoàn toàn không tồn tại cấu trúc kết hợp <i>role at doing sth</i> trong ngữ pháp tiếng Anh.</li><li><strong style='color: #c62828;'>❌ (C) except:</strong> Giới từ mang nghĩa 'ngoại trừ, ngoại trừ khi'. Thông thường phải đi kèm từ <i>for</i> (<i>except for</i>) và hoàn toàn sai lệch về mặt ngữ nghĩa, làm câu trở nên vô lý.</li><li><strong style='color: #c62828;'>❌ (D) apart:</strong> Trạng từ mang nghĩa 'tách rời, biệt lập'. Từ này muốn làm giới từ mang nghĩa 'ngoại trừ' thì bắt buộc phải đi liền với từ <i>from</i> tạo thành cụm <i>apart from</i>, đứng một mình ở vị trí này là sai ngữ pháp.</li></ul>",
    grammar: "<div style='line-height: 1.6;'><p><strong>⭐ Cấu trúc Danh từ + Giới từ & Phân biệt các cấu trúc của \"Role\" (Noun + Preposition Collocations)</strong></p><p>Trong đề thi TOEIC Part 5, các câu hỏi về giới từ đi kèm danh từ hoặc động từ cố định xuất hiện rất nhiều. Riêng đối với danh từ <code>role</code> (vai trò), thí sinh cần đặc biệt phân biệt rõ hai cấu trúc cốt lõi dựa vào thành phần đứng ngay sau khoảng trống để tránh bị đánh lừa.</p><table border='1' style='width: 100%; border-collapse: collapse; border-color: #e0e0e0; margin-top: 10px; font-size: 14px;'><thead style='background-color: #f5f5f5; text-align: left;'><tr><th style='padding: 8px;'>Cấu trúc Collocation của \"Role\"</th><th style='padding: 8px;'>Thành phần theo sau</th><th style='padding: 8px;'>Ý nghĩa ngữ cảnh thực tế</th></tr></thead><tbody><tr><td style='padding: 8px;'><strong>Role + IN</strong></td><td style='padding: 8px; color: #2e7d32; font-weight: bold;'>Cụm Danh từ / V-ing</td><td style='padding: 8px;'>Vai trò đóng góp trong một tiến trình/hành động (Ví dụ: <i>role in obtaining the contract</i>).</td></tr><tr><td style='padding: 8px;'><strong>Role + AS</strong></td><td style='padding: 8px; color: #0288d1; font-weight: bold;'>Chức vụ / Danh từ chỉ người</td><td style='padding: 8px;'>Vai trò với tư cách, vị trí cụ thể trong tổ chức (Ví dụ: <i>role as a project manager</i>).</td></tr></tbody></table><p style='margin-top: 10px;'><strong style='color: #e65100;'>🎯 Mẹo làm bài trong 3 giây:</strong> Khi gặp câu có dạng <code>role + [______] + V-ing</code>, không cần suy nghĩ nhiều, hãy quét nhanh và chọn ngay giới từ <code style='color: #2e7d32; font-weight: bold;'>in</code>. Đây là nhóm bẫy giới từ đi kèm danh từ trừu tượng (như <i>interest in, participation in, confidence in, role in</i>) cực kỳ phổ biến trong TOEIC.</p></div>",
    vocab: "<ul style='line-height: 1.6;'><li><strong style='color: #0288d1;'>role in</strong> (n.phr): vai trò trong việc gì (Cụm động từ đi kèm phổ biến: <i>play a key/vital role in doing something</i>: đóng vai trò chủ chốt/quan trọng trong việc gì).</li><li><strong style='color: #0288d1;'>obtain</strong> (v): đạt được, giành được, có được (Mang sắc thái trang trọng, thường dùng cho hợp đồng, sự phê duyệt hoặc thông tin: <i>obtain a contract / approval / information</i>).</li><li><strong style='color: #0288d1;'>board of directors</strong> (n.phr): hội đồng quản trị (Các thuật ngữ liên quan: <i>board meeting</i>: họp hội đồng quản trị, <i>board member</i>: thành viên hội đồng).</li></ul>",
    trans: "<div style='line-height: 1.6; padding: 8px; background-color: #f9f9f9; border-left: 4px solid #0288d1;'><p style='margin: 0 0 8px 0;'><strong>Dịch nghĩa gốc:</strong> Hội đồng quản trị đã bỏ phiếu để trao tặng cho ông Mitrakos một khoản tiền thưởng vì vai trò của ông trong việc giành được hợp đồng quốc tế.</p><p style='margin: 0; font-style: italic; color: #555;'><strong>Dịch tự nhiên:</strong> Hội đồng quản trị đã quyết định trao thưởng cho ông Mitrakos nhằm ghi nhận những đóng góp to lớn của ông trong việc mang về bản hợp đồng quốc tế cho công ty.</p></div>"
  }
},
        {
  id: 118,
  q: "The finance director gave his approval ______ the project can move forward.",
  options: [
    "along",
    "furthermore",
    "cautiously",
    "so that"
  ],
  a: "so that",
  exp: {
    correct: "<div style='line-height: 1.6;'><p><strong>a. Phân tích thành phần câu:</strong> Câu được cấu tạo từ hai mệnh đề độc lập hoàn chỉnh về mặt ngữ nghĩa và đang khuyết thiếu thành phần liên kết:</p><ul><li><strong>Mệnh đề 1 (Mệnh đề chính):</strong> <code>The finance director gave his approval</code> (S1 - V1 - O1: Giám đốc tài chính đã đưa ra sự phê duyệt).</li><li><strong>Mệnh đề 2 (Mệnh đề phụ trạng ngữ):</strong> <code>the project can move forward</code> (S2 - Modal V - V2: dự án có thể tiến triển/tiếp tục).</li></ul><p><strong>b. Xác định từ loại:</strong> Khoảng trống nằm giữa hai mệnh đề hoàn chỉnh (đều có đủ Chủ ngữ và Động từ chính). Theo quy tắc cú pháp tiếng Anh, vị trí này bắt buộc phải điền một <strong>Liên từ phụ thuộc (Subordinating Conjunction)</strong> để kết nối hai mệnh đề lại với nhau.</p><p><strong>c. Lý do chọn đáp án:</strong> Xét về mối quan hệ logic, hành động \"phê duyệt\" ở mệnh đề 1 là điều kiện/tác nhân để thực hiện \"mục đích\" ở mệnh đề 2. Liên từ chỉ mục đích duy nhất trong các phương án là <span style='color: #2e7d32; font-weight: bold;'>so that</span> (để mà), thường đi kèm với các động từ khuyết thiếu như <i>can/could/will/would</i> ở mệnh đề sau.</p></div>",
    wrong: "<ul style='line-height: 1.6; list-style-type: none; padding-left: 0;'><li><strong style='color: #c62828;'>❌ (A) along:</strong> Giới từ hoặc trạng từ mang nghĩa 'dọc theo, cùng với' (Ví dụ: <i>walk along the river</i>). Giới từ không thể đứng trước một mệnh đề có đầy đủ chủ vị để làm nhiệm vụ liên kết câu.</li><li><strong style='color: #c62828;'>❌ (B) furthermore:</strong> Trạng từ liên kết (Conjunctive Adverb) mang nghĩa 'hơn nữa, vả lại'. Từ này chỉ dùng để nối hai câu độc lập tách biệt bằng dấu chấm/chấm phẩy (Ví dụ: <i>Clause 1. Furthermore, Clause 2</i>), không được dùng để nối trực tiếp hai mệnh đề trong câu đơn.</li><li><strong style='color: #c62828;'>❌ (C) cautiously:</strong> Trạng từ chỉ cách thức mang nghĩa 'một cách thận trọng'. Trạng từ có nhiệm vụ bổ nghĩa cho động từ hành động (Ví dụ: <i>cautiously approve</i>), hoàn toàn không có chức năng ngữ pháp để kết nối hai mệnh đề độc lập.</li></ul>",
    grammar: "<div style='line-height: 1.6;'><p><strong>⭐ Mệnh đề trạng ngữ chỉ Mục đích & Phân biệt Liên từ với Trạng từ liên kết (Purpose Clauses)</strong></p><p>Trong đề thi TOEIC Part 5, cấu trúc câu phức chứa hai mệnh đề là vùng bẫy cực kỳ phổ biến. Người học cần nắm chắc công thức tổng quát của mệnh đề chỉ mục đích: <code>S1 + V1 + so that / in order that + S2 + can/could/will/would + V2</code>. Bên cạnh đó, phải phân biệt được chức năng của Liên từ (nối trực tiếp mệnh đề) và Trạng từ liên kết (cần dấu câu bổ trợ).</p><table border='1' style='width: 100%; border-collapse: collapse; border-color: #e0e0e0; margin-top: 10px; font-size: 14px;'><thead style='background-color: #f5f5f5; text-align: left;'><tr><th style='padding: 8px;'>Từ loại & Từ đại diện</th><th style='padding: 8px;'>Quy tắc dấu câu bắt buộc</th><th style='padding: 8px;'>Khả năng nối 2 mệnh đề trực tiếp</th></tr></thead><tbody><tr><td style='padding: 8px;'><strong>Liên từ</strong> (so that, because, although)</td><td style='padding: 8px;'>Không cần dấu câu ngăn cách (hoặc chỉ cần dấu phẩy nếu đứng đầu câu).</td><td style='padding: 8px; color: #2e7d32; font-weight: bold;'>CÓ</td></tr><tr><td style='padding: 8px;'><strong>Trạng từ liên kết</strong> (furthermore, however, therefore)</td><td style='padding: 8px;'>Bắt buộc dùng dạng: <code>. Furthermore,</code> hoặc <code>; furthermore,</code></td><td style='padding: 8px; color: #c62828; font-weight: bold;'>KHÔNG</td></tr></tbody></table><p style='margin-top: 10px;'><strong style='color: #e65100;'>🎯 Mẹo làm bài trong 3 giây:</strong> Khi gặp dạng bài <code>Mệnh đề 1 + [______] + Mệnh đề 2</code> không có dấu chấm hay chấm phẩy ngăn cách, hãy loại ngay toàn bộ các trạng từ liên kết như <i>furthermore, however, therefore</i>. Tiếp theo, nếu thấy mệnh đề 2 xuất hiện trợ động từ <i>can / could / will</i>, hãy khoanh ngay lập tức liên từ <code style='color: #2e7d32; font-weight: bold;'>so that</code>.</p></div>",
    vocab: "<ul style='line-height: 1.6;'><li><strong style='color: #0288d1;'>so that</strong> (conj): để mà, nhằm mục đích (Đồng nghĩa với liên từ <i>in order that</i>; cần phân biệt với cụm từ <i>in order to / so as to + V-inf</i> vốn chỉ đi với động từ nguyên mẫu khi hai mệnh đề cùng chủ ngữ).</li><li><strong style='color: #0288d1;'>approval</strong> (n): sự phê duyệt, sự chấp thuận (Các cụm động từ đi kèm tần suất cao: <i>give approval</i>: phê duyệt, <i>obtain/receive approval</i>: nhận sự phê duyệt, <i>seek approval</i>: xin phê duyệt).</li><li><strong style='color: #0288d1;'>move forward</strong> (phr.v): tiến triển, tiếp tục triển khai (Thường đi với giới từ with: <i>move forward with the project/negotiations</i>).</li></ul>",
    trans: "<div style='line-height: 1.6; padding: 8px; background-color: #f9f9f9; border-left: 4px solid #0288d1;'><p style='margin: 0 0 8px 0;'><strong>Dịch nghĩa gốc:</strong> Giám đốc tài chính đã đưa ra sự phê duyệt của mình để mà dự án có thể tiến về phía trước.</p><p style='margin: 0; font-style: italic; color: #555;'><strong>Dịch tự nhiên:</strong> Giám đốc tài chính đã chính thức phê duyệt phương án nhằm giúp cho dự án có thể tiếp tục tiến triển và triển khai theo đúng tiến độ.</p></div>"
  }
},
        {
  id: 119,
  q: "The newspaper article describes ways job seekers can ______ for having little workplace experience.",
  options: [
    "reply",
    "capture",
    "compensate",
    "accumulate"
  ],
  a: "compensate",
  exp: {
    correct: "<div style='line-height: 1.6;'><p><strong>a. Phân tích thành phần câu:</strong> Câu chứa một mệnh đề quan hệ rút gọn bổ nghĩa cho danh từ đứng trước, cấu trúc bóc tách cụ thể như sau:</p><ul><li><strong>S (Subject) chính:</strong> <code>The newspaper article</code> (Bài báo).</li><li><strong>V (Verb) chính:</strong> <code>describes</code> (Mô tả).</li><li><strong>O (Object) chính:</strong> <code>ways</code> (Những cách thức).</li><li><strong>Mệnh đề phụ bổ nghĩa:</strong> <code>(that) job seekers can ______ for...</code> (Trong đó chủ ngữ là <i>job seekers</i>, đi kèm động từ khuyết thiếu <i>can</i>).</li></ul><p><strong>b. Xác định từ loại:</strong> Khoảng trống đứng ngay sau động từ khuyết thiếu <i>can</i> và đứng trước cấu trúc giới từ <i>for</i>. Quy tắc ngữ pháp yêu cầu vị trí này phải là một <strong>Động từ nguyên mẫu (Bare Infinitive)</strong>. Vì cả 4 đáp án đề bài đưa ra đều là động từ nguyên mẫu, đây là dạng bài kiểm tra sự kết hợp từ (Collocation).</p><p><strong>c. Lý do chọn đáp án:</strong> Điểm mấu chốt quyết định câu này nằm ở giới từ <code>for</code> đứng ngay sau khoảng trống. Trong số các phương án, chỉ có cụm từ <span style='color: #2e7d32; font-weight: bold;'>compensate for</span> mang nghĩa \"bù đắp cho\" tạo nên một cụm từ có nghĩa logic hoàn chỉnh với ngữ cảnh thiếu hụt kinh nghiệm làm việc.</p></div>",
    wrong: "<ul style='line-height: 1.6; list-style-type: none; padding-left: 0;'><li><strong style='color: #c62828;'>❌ (A) reply:</strong> Động từ mang nghĩa 'trả lời, phản hồi'. Quy tắc từ loại bắt buộc cụm này phải đi liền với giới từ <i>to</i> (Ví dụ: <i>reply to an email</i>), do đó không phù hợp khi đi với <i>for</i>.</li><li><strong style='color: #c62828;'>❌ (B) capture:</strong> Động từ mang nghĩa 'nắm bắt, thu giữ, đoạt được' (Ví dụ: <i>capture the market share</i>: chiếm lĩnh thị phần). Đây là một ngoại động từ đi kèm trực tiếp tân ngữ mà không dùng kèm giới từ.</li><li><strong style='color: #c62828;'>❌ (D) accumulate:</strong> Động từ mang nghĩa 'tích lũy, gom góp' (Ví dụ: <i>accumulate wealth / experience</i>). Tương tự như <i>capture</i>, từ này tác động trực tiếp lên tân ngữ chứ không đi kèm giới từ <i>for</i>.</li></ul>",
    grammar: "<div style='line-height: 1.6;'><p><strong>⭐ Cấu trúc Động từ + Giới từ cố định & Manh mối từ Giới từ theo sau (Verb + Preposition Collocations)</strong></p><p>Trong đề thi TOEIC Part 5, các câu hỏi từ loại động từ đi kèm giới từ cố định xuất hiện với tần suất rất cao. Khi xử lý dạng câu hỏi này, thay vì dịch nghĩa toàn bộ câu làm mất thời gian, hãy nhìn ngay phía sau khoảng trống xem có giới từ nào làm manh mối hay không. Cụm từ <code>compensate for something</code> đồng nghĩa hoàn toàn với cụm <code>make up for something</code>.</p><table border='1' style='width: 100%; border-collapse: collapse; border-color: #e0e0e0; margin-top: 10px; font-size: 14px;'><thead style='background-color: #f5f5f5; text-align: left;'><tr><th style='padding: 8px;'>Động từ mục tiêu</th><th style='padding: 8px;'>Giới từ đi kèm bắt buộc</th><th style='padding: 8px;'>Cụm từ thông dụng trong TOEIC</th></tr></thead><tbody><tr><td style='padding: 8px;'><strong>Compensate / Make up</strong></td><td style='padding: 8px; color: #2e7d32; font-weight: bold;'>for</td><td style='padding: 8px;'>compensate for lack of experience / delays / losses</td></tr><tr><td style='padding: 8px;'><strong>Reply / Respond</strong></td><td style='padding: 8px; color: #0288d1; font-weight: bold;'>to</td><td style='padding: 8px;'>reply to inquiries / respond to customer complaints</td></tr><tr><td style='padding: 8px;'><strong>Account</strong></td><td style='padding: 8px; color: #e65100; font-weight: bold;'>for</td><td style='padding: 8px;'>account for 50% of sales (chiếm tỷ lệ / giải thích)</td></tr></tbody></table><p style='margin-top: 10px;'><strong style='color: #e65100;'>🎯 Mẹo làm bài trong 3 giây:</strong> Khi gặp câu hỏi điền động từ mà ngay phía sau xuất hiện giới từ <code>for</code>, hãy quét nhanh đáp án và ưu tiên các từ như <code>compensate</code> hoặc <code>account</code>. Cụm <i>compensate for</i> là một collocation kinh điển trong các bài viết chủ đề nhân sự và tuyển dụng của TOEIC.</p></div>",
    vocab: "<ul style='line-height: 1.6;'><li><strong style='color: #0288d1;'>compensate for</strong> (v.phr): bù đắp cho cái gì, đền bù cho điều gì (Danh từ liên quan: <i>compensation</i>: khoản tiền đền bù/bồi thường hoặc chế độ đãi ngộ).</li><li><strong style='color: #0288d1;'>job seeker</strong> (n): người tìm việc (Đồng nghĩa với cụm từ <i>job applicant</i> hoặc <i>candidate</i>).</li><li><strong style='color: #0288d1;'>workplace experience</strong> (n.phr): kinh nghiệm làm việc thực tế tại công sở (Phân biệt với <i>academic background</i>: nền tảng học thuật).</li></ul>",
    trans: "<div style='line-height: 1.6; padding: 8px; background-color: #f9f9f9; border-left: 4px solid #0288d1;'><p style='margin: 0 0 8px 0;'><strong>Dịch nghĩa gốc:</strong> Bài báo mô tả các cách người tìm việc có thể bù đắp cho việc có ít kinh nghiệm tại nơi làm việc.</p><p style='margin: 0; font-style: italic; color: #555;'><strong>Dịch tự nhiên:</strong> Bài báo chia sẻ những phương pháp hữu ích giúp các ứng viên tìm việc có thể bù đắp được sự thiếu hụt về mặt kinh nghiệm làm việc thực tế.</p></div>"
  }
},
        {
  id: 120,
  q: "Mr. Ellis and Ms. Barnes were both highly qualified, but ______ got the job.",
  options: [
    "myself",
    "neither",
    "anybody",
    "whoever"
  ],
  a: "neither",
  exp: {
    correct: "<div style='line-height: 1.6;'><p><strong>a. Phân tích thành phần câu:</strong> Câu phức gồm hai mệnh đề độc lập tương phản nối với nhau bằng liên từ <i>but</i>:</p><ul><li><strong>Mệnh đề 1:</strong> <code>Mr. Ellis and Ms. Barnes were both highly qualified</code> (S1 + V1 + C1: Cả hai người đều có trình độ chuyên môn cao).</li><li><strong>Mệnh đề 2:</strong> <code>but ______ got the job</code> (Liên từ phản nghĩa + S2 + V2 + O2: Nhưng... nhận được công việc).</li></ul><p><strong>b. Xác định từ loại:</strong> Khoảng trống đứng đầu mệnh đề thứ hai, đóng vai trò làm <strong>Chủ ngữ (Subject)</strong> của động từ <i>got</i>. Vị trí này cần một đại từ để thay thế cho nhóm đối tượng được nhắc đến ở vế trước.</p><p><strong>c. Lý do chọn đáp án:</strong> Liên từ <i>but</i> báo hiệu một kết quả trái ngược logic với mong đợi (dù cả hai đều rất giỏi nhưng kết quả lại không như ý). Vì vế trước nói rõ chỉ có <strong>2 đối tượng</strong> (<i>Mr. Ellis and Ms. Barnes</i>), đại từ phủ định chuyên dụng duy nhất dành riêng cho nhóm 2 người/vật là <span style='color: #2e7d32; font-weight: bold;'>neither</span> (không ai trong hai người).</p></div>",
    wrong: "<ul style='line-height: 1.6; list-style-type: none; padding-left: 0;'><li><strong style='color: #c62828;'>❌ (A) myself:</strong> Đại từ phản thân mang nghĩa 'bản thân tôi'. Chỉ được dùng làm tân ngữ khi chủ ngữ là 'I' hoặc dùng để nhấn mạnh chính tôi, hoàn toàn không liên quan đến ngữ cảnh kể về hai nhân vật Ellis và Barnes.</li><li><strong style='color: #c62828;'>❌ (C) anybody:</strong> Đại từ bất định mang nghĩa 'bất kỳ ai'. Từ này thường dùng trong câu phủ định (đi với <i>not</i>), câu nghi vấn hoặc mang nghĩa bao hàm diện rộng. Điền vào đây sẽ làm câu mất đi mối quan hệ tương phản mà liên từ <i>but</i> bắt buộc phải có.</li><li><strong style='color: #c62828;'>❌ (D) whoever:</strong> Đại từ quan hệ tự do mang nghĩa 'bất cứ ai/người nào mà'. Từ này dùng để mở đầu một mệnh đề danh từ làm chủ ngữ lớn (Ví dụ: <i>Whoever comes first wins</i>), không dùng độc lập làm đại từ thay thế cho hai người cụ thể phía trước.</li></ul>",
    grammar: "<div style='line-height: 1.6;'><p><strong>⭐ Đại từ chỉ hai đối tượng & Bẫy logic từ liên từ tương phản (Pronouns for Two Entities)</strong></p><p>Trong các bài toán đại từ của TOEIC Part 5, khi ngữ cảnh thiết lập rõ ràng con số <strong>2 đối tượng</strong> (hai người, hai phòng ban, hai đối tác...), tư duy chọn từ của bạn phải lập tức khoanh vùng bộ ba kinh điển: <i>Both</i> (cả hai), <i>Either</i> (1 trong 2) và <i>Neither</i> (không ai trong 2). Việc quyết định chọn từ nào sẽ phụ thuộc hoàn toàn vào các liên từ chỉ hướng logic như <i>but, although, however</i>.</p><table border='1' style='width: 100%; border-collapse: collapse; border-color: #e0e0e0; margin-top: 10px; font-size: 14px;'><thead style='background-color: #f5f5f5; text-align: left;'><tr><th style='padding: 8px;'>Đại từ mục tiêu</th><th style='padding: 8px;'>Số lượng đối tượng áp dụng</th><th style='padding: 8px;'>Bản chất logic ngữ cảnh</th></tr></thead><tbody><tr><td style='padding: 8px;'><strong>Neither</strong></td><td style='padding: 8px; color: #2e7d32; font-weight: bold;'>Chính xác 2</td><td style='padding: 8px;'>Phủ định (Không ai / không cái nào trong hai).</td></tr><tr><td style='padding: 8px;'><strong>Either</strong></td><td style='padding: 8px; color: #0288d1; font-weight: bold;'>Chính xác 2</td><td style='padding: 8px;'>Lựa chọn (Một trong hai người / cái).</td></tr><tr><td style='padding: 8px;'><strong>None / Anyone</strong></td><td style='padding: 8px; color: #e65100; font-weight: bold;'>Từ 3 trở lên</td><td style='padding: 8px;'>Dùng cho số nhiều diện rộng, không dùng cho nhóm đôi.</td></tr></tbody></table><p style='margin-top: 10px;'><strong style='color: #e65100;'>🎯 Mẹo làm bài trong 3 giây:</strong> Khi gặp câu có dạng <code>[Đối tượng 1] and [Đối tượng 2]... + but + [______] + V</code>, hãy quét nhanh đáp án và chọn ngay <code style='color: #2e7d32; font-weight: bold;'>neither</code>. Liên từ <i>but</i> đi sau một vế tích cực mang hàm ý phủ định toàn bộ ở vế sau.</p></div>",
    vocab: "<ul style='line-height: 1.6;'><li><strong style='color: #0288d1;'>neither</strong> (pronoun): không ai / không cái nào trong hai (Lưu ý ngữ pháp: Khi làm chủ ngữ ở thì hiện tại, động từ theo sau <i>neither</i> luôn chia ở dạng số ít: <i>neither is / neither works</i>).</li><li><strong style='color: #0288d1;'>highly qualified</strong> (adj.phr): có trình độ chuyên môn rất cao, cực kỳ đủ năng lực (Thường dùng để mô tả ứng viên tiềm năng: <i>highly qualified applicants / candidates</i>).</li><li><strong style='color: #0288d1;'>get the job</strong> (v.phr): trúng tuyển, được nhận vào làm việc (Đồng nghĩa với các cụm: <i>be hired, secure the position</i>).</li></ul>",
    trans: "<div style='line-height: 1.6; padding: 8px; background-color: #f9f9f9; border-left: 4px solid #0288d1;'><p style='margin: 0 0 8px 0;'><strong>Dịch nghĩa gốc:</strong> Ông Ellis và bà Barnes đều có trình độ cao, nhưng không ai trong hai người có được công việc.</p><p style='margin: 0; font-style: italic; color: #555;'><strong>Dịch tự nhiên:</strong> Mặc dù cả ông Ellis và bà Barnes đều có năng lực chuyên môn rất xuất sắc, nhưng cuối cùng đáng tiếc là không một ai trong số hai người trúng tuyển vào vị trí đó.</p></div>"
  }
},
        {
  id: 121,
  q: "Ennis Photography purchased all new lighting equipment ______ the high cost.",
  options: [
    "even though",
    "however",
    "until",
    "despite"
  ],
  a: "despite",
  exp: {
    correct: "<div style='line-height: 1.6;'><p><strong>a. Phân tích thành phần câu:</strong> Câu gồm một mệnh đề chính và một cụm từ chỉ sự nhượng bộ tương phản ở phía sau:</p><ul><li><strong>Mệnh đề chính:</strong> <code>Ennis Photography purchased all new lighting equipment</code> (S + V + O: Công ty Nhiếp ảnh Ennis đã mua toàn bộ thiết bị chiếu sáng mới).</li><li><strong>Cụm nhượng bộ:</strong> <code>______ the high cost</code> (Từ nối + Cụm từ bổ nghĩa chỉ sự tương phản: ... chi phí cao).</li></ul><p><strong>b. Xác định từ loại:</strong> Vị trí khoảng trống đứng ngay trước cụm danh từ <i>the high cost</i> (mạo từ + tính từ + danh từ). Do đó, vị trí này bắt buộc phải điền một <strong>Giới từ (Preposition)</strong> để làm thành phần kết nối ngữ pháp.</p><p><strong>c. Lý do chọn đáp án:</strong> Ngữ cảnh câu thể hiện mối quan hệ đối lập logic (chi phí rất cao nhưng công ty vẫn quyết định đầu tư mua sắm toàn bộ thiết bị mới). Trong các phương án, từ duy nhất mang nghĩa nhượng bộ và đóng vai trò làm giới từ đi kèm trực tiếp với cụm danh từ phía sau là <span style='color: #2e7d32; font-weight: bold;'>despite</span> (mặc dù / bất chấp).</p></div>",
    wrong: "<ul style='line-height: 1.6; list-style-type: none; padding-left: 0;'><li><strong style='color: #c62828;'>❌ (A) even though:</strong> Liên từ phụ thuộc (Subordinating Conjunction) mang nghĩa 'mặc dù'. Từ này bắt buộc phải đi sau bởi một mệnh đề hoàn chỉnh (S + V) chứ không được đi kèm với một cụm danh từ độc lập.</li><li><strong style='color: #c62828;'>❌ (B) however:</strong> Trạng từ liên kết (Conjunctive Adverb) mang nghĩa 'tuy nhiên'. Dùng để liên kết hai câu độc lập (thường đứng sau dấu chấm và ngăn cách bằng dấu phẩy), không dùng làm giới từ đứng trước danh từ.</li><li><strong style='color: #c62828;'>❌ (C) until:</strong> Giới từ/Liên từ chỉ thời gian mang nghĩa 'cho đến khi'. Lựa chọn này hoàn toàn không phù hợp về mặt ngữ nghĩa và logic tương phản của câu đề bài.</li></ul>",
    grammar: "<div style='line-height: 1.6;'><p><strong>⭐ Giới từ & Liên từ chỉ sự nhượng bộ (Prepositions vs. Conjunctions of Concession)</strong></p><p>Trong các dạng bài ngữ pháp kinh điển của TOEIC Part 5, bẫy phân biệt giữa nhóm Giới từ và Liên từ có cùng một nét nghĩa xuất hiện rất thường xuyên. Chìa khóa để chọn nhanh đáp án nằm ở việc phân tích cấu trúc của các từ hoặc mệnh đề đứng ngay sau khoảng trống.</p><table border='1' style='width: 100%; border-collapse: collapse; border-color: #e0e0e0; margin-top: 10px; font-size: 14px;'><thead style='background-color: #f5f5f5; text-align: left;'><tr><th style='padding: 8px;'>Nhóm chức năng</th><th style='padding: 8px;'>Từ mục tiêu điển hình</th><th style='padding: 8px;'>Cấu trúc ngữ pháp bắt buộc phía sau</th></tr></thead><tbody><tr><td style='padding: 8px;'><strong>Giới từ nhượng bộ</strong></td><td style='padding: 8px; color: #2e7d32; font-weight: bold;'>Despite / In spite of</td><td style='padding: 8px;'>+ Cụm danh từ (Noun Phrase) / V-ing</td></tr><tr><td style='padding: 8px;'><strong>Liên từ nhượng bộ</strong></td><td style='padding: 8px; color: #0288d1; font-weight: bold;'>Although / Even though / Though</td><td style='padding: 8px;'>+ Mệnh đề hoàn chỉnh (Subject + Verb)</td></tr><tr><td style='padding: 8px;'><strong>Trạng từ liên kết</strong></td><td style='padding: 8px; color: #e65100; font-weight: bold;'>However / Nevertheless</td><td style='padding: 8px;'>Nối 2 câu độc lập. Thường dùng dạng: <i>. However, S + V</i></td></tr></tbody></table><p style='margin-top: 10px;'><strong style='color: #e65100;'>🎯 Mẹo làm bài trong 3 giây:</strong> Khi gặp câu hỏi lựa chọn từ mang nghĩa 'mặc dù', hãy quét nhanh phần phía sau khoảng trống. Nếu thấy có động từ chia thì (S + V) -> chọn nhóm <i>Although/Even though</i>. Nếu tuyệt đối không có động từ chính chia thì mà chỉ là cụm Danh từ/V-ing -> quét nhanh chọn ngay nhóm <code style='color: #2e7d32; font-weight: bold;'>despite / in spite of</code>.</p></div>",
    vocab: "<ul style='line-height: 1.6;'><li><strong style='color: #0288d1;'>despite</strong> (preposition): mặc dù, bất chấp (Lưu ý: Từ này dùng độc lập, không đi kèm giới từ 'of' như cụm đồng nghĩa <i>in spite of</i>).</li><li><strong style='color: #0288d1;'>purchase</strong> (verb): mua sắm, tậu (Từ vựng mang sắc thái trang trọng, thường thay thế cho từ <i>buy</i> trong môi trường công sở).</li><li><strong style='color: #0288d1;'>lighting equipment</strong> (noun phrase): thiết bị chiếu sáng (Lưu ý quan trọng: Danh từ <i>equipment</i> là danh từ không đếm được, tuyệt đối không bao giờ có dạng số nhiều thêm s).</li></ul>",
    trans: "<div style='line-height: 1.6; padding: 8px; background-color: #f9f9f9; border-left: 4px solid #0288d1;'><p style='margin: 0 0 8px 0;'><strong>Dịch nghĩa gốc:</strong> Công ty Nhiếp ảnh Ennis đã mua tất cả thiết bị chiếu sáng mới mặc dù chi phí cao.</p><p style='margin: 0; font-style: italic; color: #555;'><strong>Dịch tự nhiên:</strong> Công ty Nhiếp ảnh Ennis vẫn quyết định đầu tư đổi mới toàn bộ hệ thống thiết bị chiếu sáng bất chấp chi phí vô cùng đắt đỏ.</p></div>"
  }

        {
  id: 122,
  q: "Marburton residents who wish to ______ a home should contact the award-winning team at Kwan Real Estate.",
  options: [
    "seller",
    "sold",
    "sell",
    "selling"
  ],
  a: "sell",
  exp: {
    correct: "<div style='line-height: 1.6;'><p><strong>a. Phân tích thành phần câu:</strong> Câu cấu trúc phức hợp bao gồm một mệnh đề quan hệ bổ nghĩa trực tiếp cho chủ ngữ chính:</p><ul><li><strong>Mệnh đề chính:</strong> <code>Marburton residents ... should contact the award-winning team at Kwan Real Estate</code> (S + V + O: Cư dân Marburton... nên liên hệ với đội ngũ từng đoạt giải thưởng tại Kwan Real Estate).</li><li><strong>Mệnh đề quan hệ:</strong> <code>who wish to ______ a home</code> (Đại từ quan hệ + V + O: Những người mong muốn... một ngôi nhà).</li></ul><p><strong>b. Xác định từ loại:</strong> Khoảng trống nằm ở mệnh đề quan hệ phụ thuộc, đứng ngay sau cụm từ chỉ ý chí mong muốn <i>wish to</i> và đứng trước danh từ làm tân ngữ <i>a home</i>. Vị trí ngữ pháp này bắt buộc phải là một <strong>Động từ nguyên mẫu (Bare Infinitive)</strong>.</p><p><strong>c. Lý do chọn đáp án:</strong> Theo quy tắc kết hợp động từ trong tiếng Anh, cấu trúc <i>wish to do something</i> yêu cầu một động từ nguyên thể không chia đứng sau giới từ 'to' nhằm diễn tả mục đích, ý nguyện thực hiện hành động. Do đó, phương án động từ nguyên mẫu duy nhất là <span style='color: #2e7d32; font-weight: bold;'>sell</span> (bán) là lựa chọn chính xác hoàn chỉnh cho câu.</p></div>",
    wrong: "<ul style='line-height: 1.6; list-style-type: none; padding-left: 0;'><li><strong style='color: #c62828;'>❌ (A) seller:</strong> Danh từ đếm được mang nghĩa 'người bán'. Không thể đứng sau cụm cấu trúc 'wish to' khi đang cần bổ nghĩa bằng một hành động, đồng thời danh từ không thể tự nhận thêm một tân ngữ danh từ khác phía sau mà không có giới từ.</li><li><strong style='color: #c62828;'>❌ (B) sold:</strong> Động từ ở dạng quá khứ (V2) hoặc quá khứ phân từ (V3). Sai dạng thức biến đổi vì cấu trúc bắt buộc phải dùng động từ nguyên mẫu không chia.</li><li><strong style='color: #c62828;'>❌ (D) selling:</strong> Danh động từ hoặc phân từ hiện tại (V-ing). Dạng thức này hoàn toàn vi phạm cấu trúc ngữ pháp chuẩn 'wish to V'.</li></ul>",
    grammar: "<div style='line-height: 1.6;'><p><strong>⭐ Động từ đi kèm To-Infinitive & Các biến thể từ loại (Verbs Followed by To-Infinitive)</strong></p><p>Trong các câu hỏi về dạng thức từ (Word Form) của TOEIC Part 5, bẫy xác định dạng động từ sau 'to' xuất hiện cực kỳ đều đặn. Khi cụm từ thiết lập các động từ chỉ mong muốn, dự định hoặc quyết định (như <i>wish, plan, hope</i>), phân từ đứng sau bắt buộc phải giữ ở dạng nguyên thể không chia.</p><table border='1' style='width: 100%; border-collapse: collapse; border-color: #e0e0e0; margin-top: 10px; font-size: 14px;'><thead style='background-color: #f5f5f5; text-align: left;'><tr><th style='padding: 8px;'>Động từ hạt nhân</th><th style='padding: 8px;'>Cấu trúc To-Infinitive chuẩn</th><th style='padding: 8px;'>Bản chất diễn đạt ngữ cảnh</th></tr></thead><tbody><tr><td style='padding: 8px;'><strong>Wish / Hope</strong></td><td style='padding: 8px; color: #2e7d32; font-weight: bold;'>wish / hope to + V_inf</td><td style='padding: 8px;'>Mong ước, hy vọng thực hiện việc gì đó.</td></tr><tr><td style='padding: 8px;'><strong>Plan / Intend</strong></td><td style='padding: 8px; color: #0288d1; font-weight: bold;'>plan / intend to + V_inf</td><td style='padding: 8px;'>Lên kế hoạch, dự định triển khai hành động.</td></tr><tr><td style='padding: 8px;'><strong>Decide / Refuse</strong></td><td style='padding: 8px; color: #e65100; font-weight: bold;'>decide / refuse to + V_inf</td><td style='padding: 8px;'>Quyết định hoặc từ chối thực hiện việc gì.</td></tr></tbody></table><p style='margin-top: 10px;'><strong style='color: #e65100;'>🎯 Mẹo làm bài trong 3 giây:</strong> Khi nhận diện nhanh các động từ chỉ tâm lý/ý chí đi kèm 'to' như <i>wish to, expect to, plan to</i>, hãy quét nhanh các phương án đáp án. Nếu phía sau khoảng trống đã có sẵn danh từ mục tiêu đóng vai trò tân ngữ, chọn ngay động từ dạng nguyên thể <code style='color: #2e7d32; font-weight: bold;'>V_inf</code> mà không cần dịch nghĩa toàn câu.</p></div>",
    vocab: "<ul style='line-height: 1.6;'><li><strong style='color: #0288d1;'>wish to + V</strong> (v.phr): mong ước, mong muốn làm việc gì (Mang sắc thái trang trọng, lịch sự và chuyên nghiệp, được sử dụng rất nhiều trong văn phong email công sở và hợp đồng kinh doanh).</li><li><strong style='color: #0288d1;'>resident</strong> (noun): cư dân, người dân đang sinh sống định cư tại một khu vực địa lý.</li><li><strong style='color: #0288d1;'>award-winning</strong> (adj): từng đoạt giải thưởng danh giá (Tính từ ghép cực kỳ thông dụng trong đề thi TOEIC dùng để quảng bá độ uy tín của tổ chức, sản phẩm hoặc đội ngũ).</li><li><strong style='color: #0288d1;'>real estate</strong> (noun): ngành bất động sản, thị trường nhà đất.</li></ul>",
    trans: "<div style='line-height: 1.6; padding: 8px; background-color: #f9f9f9; border-left: 4px solid #0288d1;'><p style='margin: 0 0 8px 0;'><strong>Dịch nghĩa gốc:</strong> Những cư dân Marburton người mà mong muốn bán một ngôi nhà nên liên hệ với đội ngũ từng đoạt giải thưởng tại Kwan Real Estate.</p><p style='margin: 0; font-style: italic; color: #555;'><strong>Dịch tự nhiên:</strong> Các cư dân tại khu vực Marburton có nhu cầu bán nhà nên chủ động liên hệ với đội ngũ môi giới đạt nhiều giải thưởng xuất sắc của công ty bất động sản Kwan Real Estate.</p></div>"
  }

        {
  id: 123,
  q: "Maswa Bistro began a ______ agreement with local farmers to purchase a set amount of produce each week.",
  options: [
    "disruptive",
    "cooperative",
    "grateful",
    "concerned"
  ],
  a: "cooperative",
  exp: {
    correct: "<div style='line-height: 1.6;'><p><strong>a. Phân tích thành phần câu:</strong> Câu gồm một mệnh đề chính và một cụm động từ nguyên mẫu bổ nghĩa chỉ mục đích phía sau:</p><ul><li><strong>Mệnh đề chính:</strong> <code>Maswa Bistro began a ______ agreement with local farmers</code> (S + V + O + cụm giới từ bổ nghĩa: Nhà hàng Maswa Bistro đã bắt đầu một thỏa thuận... với nông dân địa phương).</li><li><strong>Cụm từ chỉ mục đích:</strong> <code>to purchase a set amount of produce each week</code> (to + V_inf + O: để thu mua một lượng nông sản cố định mỗi tuần).</li></ul><p><strong>b. Xác định từ loại:</strong> Vị trí khoảng trống nằm trong cụm tân ngữ, đứng sau mạo từ <i>a</i> và đứng ngay trước danh từ hạt nhân <i>agreement</i> (thỏa thuận). Do đó, vị trí này cần một <strong>Tính từ (Adjective)</strong> để bổ nghĩa cho danh từ đó.</p><p><strong>c. Lý do chọn đáp án:</strong> Do cả 4 phương án đều là tính từ, đây là bẫy từ vựng thuần túy dựa vào ngữ cảnh thương mại. Hành động cam kết thu mua một lượng nông sản ổn định hằng tuần thể hiện mối quan hệ cộng sinh, đôi bên cùng có lợi giữa nhà hàng và người cung ứng. Do đó, tính từ tạo nên cụm từ (collocation) hoàn chỉnh và hợp lý nhất là <span style='color: #2e7d32; font-weight: bold;'>cooperative</span>, tạo thành cụm <i>cooperative agreement</i> (thỏa thuận hợp tác).</p></div>",
    wrong: "<ul style='line-height: 1.6; list-style-type: none; padding-left: 0;'><li><strong style='color: #c62828;'>❌ (A) disruptive:</strong> Tính từ mang nghĩa 'gây gián đoạn, phá vỡ, đảo lộn' (Ví dụ: <i>disruptive technology</i> - công nghệ đột phá/đảo lộn thị trường). Điền vào câu sẽ làm sai hoàn toàn logic xây dựng nguồn cung bền vững của nhà hàng.</li><li><strong style='color: #c62828;'>❌ (C) grateful:</strong> Tính từ mang nghĩa 'biết ơn, tri ân'. Từ này là tính từ chỉ trạng thái cảm xúc, chuyên dùng để mô tả cho con người (Ví dụ: <i>grateful customers</i>), không dùng để làm tính chất bổ nghĩa cho một danh từ chỉ văn bản hay khái niệm trừu tượng như <i>agreement</i>.</li><li><strong style='color: #c62828;'>❌ (D) concerned:</strong> Tính từ mang nghĩa 'lo lắng, quan ngại' hoặc 'có liên quan' (khi đứng sau danh từ). Từ này hoàn toàn khiên cưỡng và không tạo ra bất kỳ mối liên kết ngữ nghĩa hợp lý nào với danh từ thỏa thuận trong ngữ cảnh này.</li></ul>",
    grammar: "<div style='line-height: 1.6;'><p><strong>⭐ Tính từ bổ nghĩa cho Danh từ & Bẫy từ vựng kết hợp trong văn phong thương mại (Collocations with 'Agreement')</strong></p><p>Trong các câu hỏi từ vựng của TOEIC Part 5, danh từ <i>agreement</i> (thỏa thuận/hợp đồng) là một gương mặt cực kỳ quen thuộc. Khi đề bài cho 4 đáp án cùng một loại từ (tính từ), cách làm nhanh nhất là không dịch từng từ một cách rời rạc, mà hãy đối chiếu ngay tính từ đó với danh từ đứng sau xem chúng có tạo thành một cụm từ cố định thường gặp trong môi trường kinh doanh hay không.</p><table border='1' style='width: 100%; border-collapse: collapse; border-color: #e0e0e0; margin-top: 10px; font-size: 14px;'><thead style='background-color: #f5f5f5; text-align: left;'><tr><th style='padding: 8px;'>Tính từ đi kèm</th><th style='padding: 8px;'>Cụm Collocation hoàn chỉnh</th><th style='padding: 8px;'>Ý nghĩa bản chất ngữ cảnh TOEIC</th></tr></thead><tbody><tr><td style='padding: 8px;'><strong>Cooperative</strong></td><td style='padding: 8px; color: #2e7d32; font-weight: bold;'>cooperative agreement</td><td style='padding: 8px;'>Thỏa thuận hợp tác (cùng thực hiện một mục tiêu chung).</td></tr><tr><td style='padding: 8px;'><strong>Confidential</strong></td><td style='padding: 8px; color: #0288d1; font-weight: bold;'>confidential agreement</td><td style='padding: 8px;'>Thỏa thuận bảo mật thông tin (tương đương NDA).</td></tr><tr><td style='padding: 8px;'><strong>Mutual</strong></td><td style='padding: 8px; color: #e65100; font-weight: bold;'>mutual agreement</td><td style='padding: 8px;'>Thỏa thuận chung, sự đồng thuận từ cả hai phía.</td></tr></tbody></table><p style='margin-top: 10px;'><strong style='color: #e65100;'>🎯 Mẹo làm bài trong 3 giây:</strong> Khi nhìn thấy khoảng trống đứng trước danh từ <code>agreement</code>, đồng thời ngữ cảnh xung quanh mô tả việc hai bên ký kết để hỗ trợ hoặc mua bán lẫn nhau (nhà hàng và nông dân), hãy quét nhanh đáp án và chọn ngay <code style='color: #2e7d32; font-weight: bold;'>cooperative</code> để tạo cụm từ thương mại quen thuộc.</p></div>",
    vocab: "<ul style='line-height: 1.6;'><li><strong style='color: #0288d1;'>cooperative agreement</strong> (n.phr): thỏa thuận hợp tác, cam kết phối hợp.</li><li><strong style='color: #0288d1;'>produce</strong> (noun): nông sản, rau củ quả tươi (Bẫy cực lớn trong TOEIC: Từ này ngoài dạng Động từ là sản xuất, thì khi làm Danh từ nó mang nghĩa là nông sản và là <i>danh từ không đếm được</i>, tuyệt đối không thêm s).</li><li><strong style='color: #0288d1;'>a set amount</strong> (noun phrase): một số lượng cố định, định lượng đã được thiết lập sẵn (= a fixed amount).</li><li><strong style='color: #0288d1;'>purchase</strong> (verb): thu mua, mua sắm (Mang sắc thái trang trọng, lịch sự hơn từ <i>buy</i>).</li></ul>",
    trans: "<div style='line-height: 1.6; padding: 8px; background-color: #f9f9f9; border-left: 4px solid #0288d1;'><p style='margin: 0 0 8px 0;'><strong>Dịch nghĩa gốc:</strong> Maswa Bistro đã bắt đầu một thỏa thuận hợp tác với các nông dân địa phương để mua một lượng nông sản cố định mỗi tuần.</p><p style='margin: 0; font-style: italic; color: #555;'><strong>Dịch tự nhiên:</strong> Nhà hàng Maswa Bistro đã thiết lập một thỏa thuận hợp tác với các hộ nông dân địa phương nhằm mục đích thu mua một số lượng nông sản cố định vào mỗi tuần.</p></div>"
  }
},
        {
  id: 124,
  q: "The City of Doyle’s new downtown parking ______ have been met with opposition by residents and visitors.",
  options: [
    "restricts",
    "restricted",
    "restrictions",
    "restricting"
  ],
  a: "restrictions",
  exp: {
    correct: "<div style='line-height: 1.6;'><p><strong>a. Phân tích thành phần câu:</strong> Câu cấu trúc bị động ở thì hiện tại hoàn thành, sở hữu một cụm danh từ dài đóng vai trò làm chủ ngữ chính:</p><ul><li><strong>Cụm chủ ngữ (Subject):</strong> <code>The City of Doyle’s new downtown parking restrictions</code> (Những quy định hạn chế đỗ xe mới ở trung tâm thành phố Doyle).</li><li><strong>Động từ chính (Verb):</strong> <code>have been met</code> (Đã vấp phải / đã gặp phải).</li><li><strong>Thành phần bổ ngữ:</strong> <code>with opposition by residents and visitors</code> (Sự phản đối từ cư dân và du khách).</li></ul><p><strong>b. Xác định từ loại:</strong> Khoảng trống nằm ở vị trí cuối cùng của cụm danh từ làm chủ ngữ, đứng ngay trước động từ chia ở số nhiều <i>have been met</i>. Vị trí này bắt buộc phải là một <strong>Danh từ số nhiều (Plural Noun)</strong> để làm danh từ hạt nhân (head noun) điều khiển động từ phía sau.</p><p><strong>c. Lý do chọn đáp án:</strong> Trợ động từ trong câu là <i>have</i> chỉ đi với chủ ngữ số nhiều. Do đó, danh từ làm chủ ngữ chính bắt buộc phải ở dạng số nhiều. Trong các phương án, chỉ có <span style='color: #2e7d32; font-weight: bold;'>restrictions</span> thỏa mãn chính xác cả về từ loại lẫn số từ, đồng thời tạo thành danh từ ghép thông dụng <i>parking restrictions</i> (các quy định hạn chế đỗ xe).</p></div>",
    wrong: "<ul style='line-height: 1.6; list-style-type: none; padding-left: 0;'><li><strong style='color: #c62828;'>❌ (A) restricts:</strong> Động từ chia ở ngôi thứ ba số ít (V-s). Vị trí này cần một danh từ làm chủ ngữ chính chứ không phải một động từ chia thì, và động từ số ít cũng hoàn toàn vi phạm quy tắc hòa hợp với trợ động từ số nhiều <i>have</i>.</li><li><strong style='color: #c62828;'>❌ (B) restricted:</strong> Động từ dạng quá khứ/phân từ (V-ed) hoặc tính từ mang nghĩa 'bị hạn chế'. Từ này không thể đứng độc lập làm danh từ hạt nhân đứng trước động từ chính được.</li><li><strong style='color: #c62828;'>❌ (D) restricting:</strong> Dạng phân từ hiện tại hoặc danh động từ (V-ing). Điền vào đây không tạo thành cụm danh từ ghép có ý nghĩa phù hợp và không thể làm chủ ngữ số nhiều đi với trợ động từ <i>have</i>.</li></ul>",
    grammar: "<div style='line-height: 1.6;'><p><strong>⭐ Danh từ ghép & Sự hòa hợp Chủ ngữ - Động từ (Compound Nouns & Subject-Verb Agreement)</strong></p><p>Trong đề thi TOEIC Part 5, bẫy kết hợp giữa nhận diện từ loại cụm danh từ và sự hòa hợp giữa chủ ngữ với động từ xuất hiện cực kỳ đều đặn. Chìa khóa để xử lý nhanh dạng bài này là không cần dịch nghĩa vội, hãy nhìn ngay vào trợ động từ hoặc động từ tobe đứng ngay sau khoảng trống (như <i>have/has, is/are, was/were</i>) để xác định danh từ chủ ngữ cần tìm là số ít hay số nhiều.</p><table border='1' style='width: 100%; border-collapse: collapse; border-color: #e0e0e0; margin-top: 10px; font-size: 14px;'><thead style='background-color: #f5f5f5; text-align: left;'><tr><th style='padding: 8px;'>Động từ chia thì phía sau</th><th style='padding: 8px;'>Đặc điểm Danh từ chủ ngữ bắt buộc</th><th style='padding: 8px;'>Ví dụ thực tế cấu trúc TOEIC</th></tr></thead><tbody><tr><td style='padding: 8px;'><strong>Have / Are / Were / V_nguyên mẫu</strong></td><td style='padding: 8px; color: #2e7d32; font-weight: bold;'>Danh từ số nhiều (Có đuôi -s/-es)</td><td style='padding: 8px;'>parking <strong>restrictions</strong> have been met...</td></tr><tr><td style='padding: 8px;'><strong>Has / Is / Was / V-s/es</strong></td><td style='padding: 8px; color: #0288d1; font-weight: bold;'>Danh từ số ít / Không đếm được</td><td style='padding: 8px;'>parking <strong>permit</strong> has been issued...</td></tr></tbody></table><p style='margin-top: 10px;'><strong style='color: #e65100;'>🎯 Mẹo làm bài trong 3 giây:</strong> Khi nhận diện khoảng trống nằm ở cuối cụm danh từ làm chủ ngữ và đứng ngay trước động từ số nhiều chia dạng <code>have been</code>, hãy quét nhanh các phương án và chọn ngay danh từ có đuôi số nhiều <code style='color: #2e7d32; font-weight: bold;'>-s</code>.</p></div>",
    vocab: "<ul style='line-height: 1.6;'><li><strong style='color: #0288d1;'>parking restrictions</strong> (n.phr): các quy định hạn chế đỗ xe, lệnh cấm đỗ xe đô thị.</li><li><strong style='color: #0288d1;'>be met with opposition</strong> (v.phr): vấp phải sự phản đối, gặp phải sự phản kháng từ công chúng hoặc một nhóm đối tượng.</li><li><strong style='color: #0288d1;'>downtown</strong> (adj/noun): khu trung tâm thương mại/trung tâm thành phố.</li><li><strong style='color: #0288d1;'>resident</strong> (noun): người dân địa phương, cư dân sinh sống ổn định tại khu vực.</li></ul>",
    trans: "<div style='line-height: 1.6; padding: 8px; background-color: #f9f9f9; border-left: 4px solid #0288d1;'><p style='margin: 0 0 8px 0;'><strong>Dịch nghĩa gốc:</strong> Các quy định hạn chế đỗ xe ở trung tâm thành phố mới của Thành phố Doyle đã bị gặp với sự phản đối bởi người dân và khách tham quan.</p><p style='margin: 0; font-style: italic; color: #555;'><strong>Dịch tự nhiên:</strong> Những quy định mới về việc hạn chế đỗ xe tại khu vực trung tâm thành phố Doyle đã vấp phải sự phản đối quyết liệt từ cả người dân địa phương lẫn du khách.</p></div>"
  }
},
        {
  id: 125,
  q: "The plumbing position requires extensive training, even for those who studied ______ in technical school.",
  options: [
    "diligently",
    "scientifically",
    "objectively",
    "decidedly"
  ],
  a: "diligently",
  exp: {
    correct: "<div style='line-height: 1.6;'><p><strong>a. Phân tích thành phần câu:</strong> Câu gồm một mệnh đề chính chứa cấu trúc bổ ngữ mở rộng bằng mệnh đề quan hệ rút gọn ở phía sau:</p><ul><li><strong>Mệnh đề chính:</strong> <code>The plumbing position requires extensive training</code> (S + V + O: Vị trí thợ sửa ống nước đòi hỏi phải được đào tạo chuyên sâu).</li><li><strong>Mệnh đề quan hệ bổ nghĩa:</strong> <code>even for those who studied ______ in technical school</code> (Ngay cả đối với những người đã học tập... ở trường kỹ thuật). Trong mệnh đề này, <i>who</i> làm chủ ngữ và <i>studied</i> là động từ chính.</li></ul><p><strong>b. Xác định từ loại:</strong> Khoảng trống đứng ngay sau động từ <i>studied</i> và đứng trước cụm giới từ chỉ nơi chốn. Vị trí ngữ pháp này cần một <strong>Trạng từ (Adverb)</strong> đóng vai trò bổ nghĩa cho hành động học tập.</p><p><strong>c. Lý do chọn đáp án:</strong> Do cả 4 phương án đều có đuôi <i>-ly</i> nên đây là câu hỏi từ vựng dựa vào ngữ cảnh. Ý nghĩa câu muốn nhấn mạnh rằng dù học viên có nỗ lực như thế nào ở trường nghề thì khi đi làm vẫn cần đào tạo lại chuyên sâu. Hành động học tập (study) kết hợp tự nhiên nhất với trạng từ <span style='color: #2e7d32; font-weight: bold;'>diligently</span> để tạo thành cụm từ cố định (collocation) <i>study diligently</i> mang nghĩa học tập một cách chăm chỉ, cần mẫn.</p></div>",
    wrong: "<ul style='line-height: 1.6; list-style-type: none; padding-left: 0;'><li><strong style='color: #c62828;'>❌ (B) scientifically:</strong> Trạng từ mang nghĩa 'một cách khoa học'. Từ này thường dùng để diễn tả các phương pháp nghiên cứu, phân tích hoặc chứng minh thực nghiệm (Ví dụ: <i>scientifically proven</i>), không phù hợp để mô tả thái độ học tập rèn luyện nghề của học viên.</li><li><strong style='color: #c62828;'>❌ (C) objectively:</strong> Trạng từ mang nghĩa 'một cách khách quan'. Chuyên đi kèm với các động từ chỉ sự đánh giá, xem xét, nhìn nhận sự việc (Ví dụ: <i>evaluate objectively</i>), hoàn toàn khiên cưỡng khi ghép với động từ học tập.</li><li><strong style='color: #c62828;'>❌ (D) decidedly:</strong> Trạng từ mang nghĩa 'rõ ràng, dứt khoát, chắc chắn'. Thường đóng vai trò làm trạng từ chỉ mức độ bổ nghĩa cho một tính từ đứng sau (Ví dụ: <i>decidedly different</i> - khác biệt rõ rệt), không dùng để diễn tả cách thức thực hiện hành động của động từ <i>study</i>.</li></ul>",
    grammar: "<div style='line-height: 1.6;'><p><strong>⭐ Trạng từ bổ nghĩa động từ hành động & Cụm từ thường gặp (Adverbs Modifying Verbs & Collocations)</strong></p><p>Trong cấu trúc câu Part 5 của bài thi TOEIC, khi vị trí trống yêu cầu một trạng từ để bổ nghĩa cho động từ hành động liên quan đến công việc hoặc học tập (như <i>study, work, review</i>), các trạng từ chỉ sự siêng năng và cẩn thận luôn là những đáp án ưu tiên hàng đầu. Việc nắm rõ sự kết hợp từ (collocation) sẽ giúp bạn tiết kiệm thời gian dịch nghĩa rất nhiều.</p><table border='1' style='width: 100%; border-collapse: collapse; border-color: #e0e0e0; margin-top: 10px; font-size: 14px;'><thead style='background-color: #f5f5f5; text-align: left;'><tr><th style='padding: 8px;'>Động từ hạt nhân</th><th style='padding: 8px;'>Trạng từ bắt cặp hoàn hảo</th><th style='padding: 8px;'>Ý nghĩa cụm Collocation thương mại</th></tr></thead><tbody><tr><td style='padding: 8px;'><strong>Study / Work</strong></td><td style='padding: 8px; color: #2e7d32; font-weight: bold;'>diligently</td><td style='padding: 8px;'>Học tập / Làm việc một cách chăm chỉ, cần mẫn.</td></tr><tr><td style='padding: 8px;'><strong>Examine / Review</strong></td><td style='padding: 8px; color: #0288d1; font-weight: bold;'>thoroughly / carefully</td><td style='padding: 8px;'>Kiểm tra / Xem xét một cách kỹ lưỡng, cẩn thận.</td></tr><tr><td style='padding: 8px;'><strong>Operate / Run</strong></td><td style='padding: 8px; color: #e65100; font-weight: bold;'>efficiently / smoothly</td><td style='padding: 8px;'>Vận hành một cách hiệu quả / mượt mà ổn định.</td></tr></tbody></table><p style='margin-top: 10px;'><strong style='color: #e65100;'>🎯 Mẹo làm bài trong 3 giây:</strong> Khi nhận diện được khoảng trống đứng sau các động từ chỉ sự nỗ lực làm việc hoặc tích lũy kiến thức như <code>study</code> hoặc <code>work</code>, hãy liếc nhanh xuống đáp án và chọn ngay <code style='color: #2e7d32; font-weight: bold;'>diligently</code> để tạo thành cụm từ chuẩn mực của văn phong TOEIC.</p></div>",
    vocab: "<ul style='line-height: 1.6;'><li><strong style='color: #0288d1;'>study diligently</strong> (v.phr): học tập chăm chỉ, cần mẫn, siêng năng.</li><li><strong style='color: #0288d1;'>plumbing position</strong> (n.phr): vị trí công việc thợ sửa ống nước (Lưu ý phát âm: âm 'b' trong từ <i>plumbing / plumber</i> là âm câm, không phát âm).</li><li><strong style='color: #0288d1;'>extensive training</strong> (n.phr): chương trình đào tạo chuyên sâu, toàn diện và kỹ lưỡng.</li><li><strong style='color: #0288d1;'>technical school</strong> (n.phr): trường nghề, trường kỹ thuật chuyên đào tạo thực hành.</li></ul>",
    trans: "<div style='line-height: 1.6; padding: 8px; background-color: #f9f9f9; border-left: 4px solid #0288d1;'><p style='margin: 0 0 8px 0;'><strong>Dịch nghĩa gốc:</strong> Vị trí sửa ống nước yêu cầu đào tạo chuyên sâu, ngay cả đối với những người đã học tập chăm chỉ ở trường kỹ thuật.</p><p style='margin: 0; font-style: italic; color: #555;'><strong>Dịch tự nhiên:</strong> Vị trí thợ sửa ống nước đòi hỏi một quy trình đào tạo rất chuyên sâu, ngay cả đối với những người từng học hành cực kỳ chăm chỉ tại các trường kỹ thuật.</p></div>"
  }
