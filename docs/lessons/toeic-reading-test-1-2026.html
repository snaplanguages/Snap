        {
  id: 126,
  q: "With its fixed price ______, Omega Cellular guarantees no phone bill increases for three years.",
  options: [
    "assurance",
    "assuredly",
    "assuring",
    "assures"
  ],
  a: "assurance",
  exp: {
    correct: "<div style='line-height: 1.6;'><p><strong>a. Phân tích thành phần câu:</strong> Câu gồm một cụm giới từ mở đầu bổ nghĩa và một mệnh đề độc lập hoàn chỉnh đóng vai trò mệnh đề chính phía sau:</p><ul><li><strong>Cụm giới từ bổ nghĩa:</strong> <code>With its fixed price ______</code> (Với cam kết mức giá cố định của mình).</li><li><strong>Mệnh đề chính:</strong> <code>Omega Cellular guarantees no phone bill increases for three years</code> (S + V + O + cụm từ chỉ thời gian: Omega Cellular đảm bảo không tăng hóa đơn điện thoại trong ba năm).</li></ul><p><strong>b. Xác định từ loại:</strong> Vị trí khoảng trống nằm ở cuối cùng của cụm giới từ bắt đầu bằng <i>With</i>, đứng ngay sau cụm từ bổ nghĩa <i>fixed price</i>. Vị trí ngữ pháp này bắt buộc phải là một <strong>Danh từ chính (Head Noun)</strong> để hoàn thiện cụm danh từ sau tính từ sở hữu <i>its</i>.</p><p><strong>c. Lý do chọn đáp án:</strong> Cấu trúc cụm danh từ tiêu chuẩn có dạng: <i>Tính từ sở hữu (its) + Danh từ bổ nghĩa (fixed price) + Danh từ chính</i>. Trong các phương án, chỉ có <span style='color: #2e7d32; font-weight: bold;'>assurance</span> (sự bảo đảm / sự cam kết) là danh từ đáp ứng chính xác yêu cầu từ loại, tạo thành cụm danh từ ghép thương mại thông dụng <i>fixed price assurance</i> (sự cam kết giá cố định).</p></div>",
    wrong: "<ul style='line-height: 1.6; list-style-type: none; padding-left: 0;'><li><strong style='color: #c62828;'>❌ (B) assuredly:</strong> Trạng từ (Adverb) mang nghĩa 'một cách chắc chắn'. Trạng từ chuyên dùng để bổ nghĩa cho động từ, tính từ hoặc toàn bộ mệnh đề, hoàn toàn không thể làm danh từ hạt nhân đứng ở vị trí này.</li><li><strong style='color: #c62828;'>❌ (C) assuring:</strong> Phân từ hiện tại (V-ing) hoặc tính từ mang nghĩa 'làm cho yên tâm'. Dạng thức này không thể làm danh từ trung tâm để kết thúc cụm giới từ sau một thành phần bổ nghĩa danh từ như <i>price</i>.</li><li><strong style='color: #c62828;'>❌ (D) assures:</strong> Động từ chia ở ngôi thứ ba số ít (V-s) mang nghĩa 'cam đoan / đảm bảo'. Vị trí sau giới từ và tính từ sở hữu cần một danh từ để hoàn thành cụm từ, không thể điền một động từ chia thì độc lập.</li></ul>",
    grammar: "<div style='line-height: 1.6;'><p><strong>⭐ Danh từ bổ nghĩa & Cấu trúc cụm danh từ nâng cao (Noun Modifiers & Noun Phrase Structure)</strong></p><p>Trong các câu hỏi từ loại của TOEIC Part 5, bẫy cụm danh từ chứa danh từ bổ nghĩa (Noun Modifier) xuất hiện vô cùng phổ biến. Nhiều thí sinh lầm tưởng danh từ đứng trước đã là danh từ hạt nhân nên chọn sai từ loại cho vị trí trống. Quy tắc bất biến là từ đứng cuối cùng trong cụm danh từ mới là từ quyết định loại từ và ý nghĩa cốt lõi của toàn cụm.</p><table border='1' style='width: 100%; border-collapse: collapse; border-color: #e0e0e0; margin-top: 10px; font-size: 14px;'><thead style='background-color: #f5f5f5; text-align: left;'><tr><th style='padding: 8px;'>Thành phần cụm danh từ</th><th style='padding: 8px;'>Từ mục tiêu trong câu</th><th style='padding: 8px;'>Vai trò ngữ pháp bản chất</th></tr></thead><tbody><tr><td style='padding: 8px;'><strong>Tính từ sở hữu</strong></td><td style='padding: 8px; color: #e65100; font-weight: bold;'>its</td><td style='padding: 8px;'>Xác định quyền sở hữu cho danh từ chính phía sau.</td></tr><tr><td style='padding: 8px;'><strong>Danh từ bổ nghĩa (Noun Modifier)</strong></td><td style='padding: 8px; color: #0288d1; font-weight: bold;'>fixed price</td><td style='padding: 8px;'>Đóng vai trò như tính từ để bổ nghĩa thuộc tính giá cả.</td></tr><tr><td style='padding: 8px;'><strong>Danh từ chính (Head Noun)</strong></td><td style='padding: 8px; color: #2e7d32; font-weight: bold;'>assurance</td><td style='padding: 8px;'>Thành phần cốt lõi quyết định từ loại của cả cụm.</td></tr></tbody></table><p style='margin-top: 10px;'><strong style='color: #e65100;'>🎯 Mẹo làm bài trong 3 giây:</strong> Khi nhận diện cấu trúc cụm giới từ có dạng <code>[With + its/our/their + Danh từ/Tính từ + ______]</code>, hãy bỏ qua các phương án động từ hoặc trạng từ, quét nhanh và chọn ngay một <code style='color: #2e7d32; font-weight: bold;'>Danh từ (Noun)</code> để hoàn thiện vị trí hạt nhân cuối cụm.</p></div>",
    vocab: "<ul style='line-height: 1.6;'><li><strong style='color: #0288d1;'>fixed price assurance</strong> (n.phr): sự cam kết mức giá cố định, sự bảo đảm giá không đổi.</li><li><strong style='color: #0288d1;'>guarantee</strong> (verb): bảo đảm, cam đoan (Từ vựng thương mại cốt lõi dùng để đưa ra lời cam kết dịch vụ hoặc chất lượng với khách hàng).</li><li><strong style='color: #0288d1;'>phone bill increase</strong> (n.phr): sự gia tăng hóa đơn tiền điện thoại (Lưu ý: <i>increases</i> trong đề bài đóng vai trò là một danh từ số nhiều).</li><li><strong style='color: #0288d1;'>fixed</strong> (adj): cố định, được thiết lập sẵn không thay đổi (= set, locked).</li></ul>",
    trans: "<div style='line-height: 1.6; padding: 8px; background-color: #f9f9f9; border-left: 4px solid #0288d1;'><p style='margin: 0 0 8px 0;'><strong>Dịch nghĩa gốc:</strong> Với sự bảo đảm giá cố định của nó, Omega Cellular đảm bảo không có sự tăng hóa đơn điện thoại trong ba năm.</p><p style='margin: 0; font-style: italic; color: #555;'><strong>Dịch tự nhiên:</strong> Nhờ cam kết duy trì mức giá cố định, công ty viễn thông Omega Cellular bảo đảm khách hàng sẽ không phải chịu bất kỳ khoản tăng cước điện thoại nào trong suốt ba năm tới.</p></div>"
  }
},
        {
  id: 127,
  q: "As chief analytics officer, Mr. Ko has worked at Lochston Ltd. with great ______ for more than twenty years.",
  options: [
    "deduction",
    "duplication",
    "declaration",
    "dedication"
  ],
  a: "dedication",
  exp: {
    correct: "<div style='line-height: 1.6;'><p><strong>a. Phân tích thành phần câu:</strong> Câu bắt đầu bằng một cụm giới từ chỉ chức danh, theo sau là mệnh đề chính hoàn chỉnh:</p><ul><li><strong>Cụm giới từ chỉ chức danh:</strong> <code>As chief analytics officer</code> (Với tư cách là giám đốc phân tích dữ liệu).</li><li><strong>Mệnh đề chính:</strong> <code>Mr. Ko has worked at Lochston Ltd. with great ______ for more than twenty years</code> (S + V + cụm trạng ngữ nơi chốn + cụm giới từ cách thức + cụm trạng ngữ thời gian).</li></ul><p><strong>b. Xác định từ loại:</strong> Vị trí khoảng trống đứng sau giới từ <i>with</i> và tính từ <i>great</i>. Vị trí ngữ pháp này bắt buộc phải điền một <strong>Danh từ (Noun)</strong> để hoàn thành cấu trúc cụm trạng ngữ chỉ cách thức: <i>with + (adj) + Noun</i>.</p><p><strong>c. Lý do chọn đáp án:</strong> Cả 4 phương án đều là danh từ có hậu tố tương đồng <i>-tion</i>, do đó đây là câu hỏi kiểm tra từ vựng dựa trên ngữ cảnh. Đề bài đề cập đến việc ông Ko đã làm việc liên tục tại một công ty trong suốt hơn 20 năm ở vị trí cấp cao. Hành động gắn bó lâu dài này thể hiện phẩm chất nghề nghiệp đáng quý. Sự kết hợp từ (collocation) tự nhiên và chính xác nhất là <span style='color: #2e7d32; font-weight: bold;'>dedication</span> để tạo thành cụm từ <i>work with great dedication</i> (làm việc với sự cống hiến/tận tụy to lớn).</p></div>",
    wrong: "<ul style='line-height: 1.6; list-style-type: none; padding-left: 0;'><li><strong style='color: #c62828;'>❌ (A) deduction:</strong> Danh từ mang nghĩa 'sự khấu trừ' (Ví dụ: <i>tax deduction</i>) hoặc 'sự suy luận'. Ý nghĩa này hoàn toàn không ăn nhập với ngữ cảnh mô tả tác phong làm việc suốt hai thập kỷ của nhân sự.</li><li><strong style='color: #c62828;'>❌ (B) duplication:</strong> Danh từ mang nghĩa 'sự sao chép, nhân bản' (Ví dụ: <i>data duplication</i>). Không dùng để mô tả phẩm chất làm việc của con người trong môi trường công sở.</li><li><strong style='color: #c62828;'>❌ (C) declaration:</strong> Danh từ mang nghĩa 'sự tuyên bố' hoặc 'tờ khai' (Ví dụ: <i>customs declaration</i>). Từ này hoàn toàn khiên cưỡng và không tạo thành cụm từ có nghĩa khi đi sau động từ <i>work</i>.</li></ul>",
    grammar: "<div style='line-height: 1.6;'><p><strong>⭐ Cấu trúc Cụm giới từ chỉ cách thức với 'With' & Danh từ trừu tượng (Prepositional Phrases of Manner)</strong></p><p>Trong văn phong chuyên nghiệp của bài thi TOEIC, thay vì dùng một trạng từ đơn lẻ (như <i>dedicatedly, carefully</i>), người ta rất chuộng cấu trúc nâng cao: <code>with + great/utmost + Danh từ trừu tượng chỉ phẩm chất</code> nhằm nhấn mạnh thái độ, tác phong làm việc của nhân viên.</p><table border='1' style='width: 100%; border-collapse: collapse; border-color: #e0e0e0; margin-top: 10px; font-size: 14px;'><thead style='background-color: #f5f5f5; text-align: left;'><tr><th style='padding: 8px;'>Động từ thường gặp</th><th style='padding: 8px;'>Cụm giới từ cố định (Collocation)</th><th style='padding: 8px;'>Ý nghĩa trong môi trường công sở</th></tr></thead><tbody><tr><td style='padding: 8px;'><strong>Work / Serve</strong></td><td style='padding: 8px; color: #2e7d32; font-weight: bold;'>with great dedication</td><td style='padding: 8px;'>Làm việc / Phục vụ với sự tận tụy, cống hiến to lớn.</td></tr><tr><td style='padding: 8px;'><strong>Handle / Treat</strong></td><td style='padding: 8px; color: #0288d1; font-weight: bold;'>with great care</td><td style='padding: 8px;'>Xử lý công việc / Đối xử với sự cẩn trọng cao độ.</td></tr><tr><td style='padding: 8px;'><strong>Listen / Cooperate</strong></td><td style='padding: 8px; color: #e65100; font-weight: bold;'>with great enthusiasm</td><td style='padding: 8px;'>Lắng nghe / Hợp tác với sự nhiệt huyết, hào hứng.</td></tr></tbody></table><p style='margin-top: 10px;'><strong style='color: #e65100;'>🎯 Mẹo làm bài trong 3 giây:</strong> Khi bắt gặp động từ chỉ quá trình làm việc lâu năm như <code>work</code> hoặc <code>serve</code> kết hợp với thành phần cấu trúc <code>with great + ______</code>, đáp án ưu tiên hàng đầu luôn là các danh từ chỉ thái độ tích cực như <code style='color: #2e7d32; font-weight: bold;'>dedication</code> hoặc <code>professionalism</code>.</p></div>",
    vocab: "<ul style='line-height: 1.6;'><li><strong style='color: #0288d1;'>chief analytics officer</strong> (n.phr): giám đốc phân tích dữ liệu (Chức danh quản lý cấp cao chịu trách nhiệm quản trị và phân tích hệ thống dữ liệu doanh nghiệp).</li><li><strong style='color: #0288d1;'>dedication to</strong> (n): sự cống hiến, lòng tận tụy đối với công việc hoặc mục tiêu (Thường đi kèm giới từ <i>to</i> phía sau).</li><li><strong style='color: #0288d1;'>be dedicated to + N/V-ing</strong> (adj.phr): hết lòng, tận tâm làm việc gì.</li><li><strong style='color: #0288d1;'>for more than [time]</strong> (prep.phr): trong hơn [khoảng thời gian] (Dấu hiệu nhận biết cốt lõi đi kèm với thì Hiện tại hoàn thành <i>has worked</i> để diễn tả hành động kéo dài từ quá khứ đến hiện tại).</li></ul>",
    trans: "<div style='line-height: 1.6; padding: 8px; background-color: #f9f9f9; border-left: 4px solid #0288d1;'><p style='margin: 0 0 8px 0;'><strong>Dịch nghĩa gốc:</strong> Với tư cách là giám đốc phân tích cấp cao, ông Ko đã làm việc tại Lochston Ltd. với sự cống hiến lớn trong hơn hai mươi năm.</p><p style='margin: 0; font-style: italic; color: #555;'><strong>Dịch tự nhiên:</strong> Trên cương vị Giám đốc Phân tích Dữ liệu, ông Ko đã cống hiến hết mình cho công ty Lochston Ltd. suốt hơn 20 năm qua.</p></div>"
  }
},
        {
  id: 128,
  q: "Milltown Hospital’s cafeteria serves lunch seven days a week ______ only on weekdays.",
  options: [
    "up to",
    "as though",
    "each time",
    "rather than"
  ],
  a: "rather than",
  exp: {
    correct: "<div style='line-height: 1.6;'><p><strong>a. Phân tích thành phần câu:</strong> Câu gồm một mệnh đề chính hoàn chỉnh kéo dài đến trước khoảng trống và một cụm từ bổ ngữ chỉ thời gian ở phía sau:</p><ul><li><strong>Mệnh đề chính:</strong> <code>Milltown Hospital’s cafeteria serves lunch seven days a week</code> (S + V + O + Cụm trạng ngữ tần suất: Nhà ăn của Bệnh viện Milltown phục vụ bữa trưa 7 ngày một tuần).</li><li><strong>Cụm từ bổ ngữ bổ sung ý nghĩa:</strong> <code>______ only on weekdays</code> (Chỉ vào các ngày trong tuần).</li></ul><p><strong>b. Xác định từ loại:</strong> Khoảng trống nằm giữa hai mốc thời gian mang tính chất loại trừ và đối lập nhau trực tiếp (7 ngày một tuần đối lại với chỉ các ngày trong tuần). Do đó, vị trí này cần một <strong>Cụm từ nối mang ý nghĩa đối lập/loại trừ (Preferential/Contrastive Connector)</strong>.</p><p><strong>c. Lý do chọn đáp án:</strong> Ngữ cảnh của câu nhằm nhấn mạnh ưu điểm dịch vụ vượt trội của nhà ăn bệnh viện (mở cửa suốt cả tuần) để phủ định giả định thông thường (chỉ mở vào ngày hành chính). Sự kết hợp từ chính xác nhất là <span style='color: #2e7d32; font-weight: bold;'>rather than</span> mang nghĩa \"thay vì / chứ không phải\" để liên kết hai vế một cách logic và mạch lạc.</p></div>",
    wrong: "<ul style='line-height: 1.6; list-style-type: none; padding-left: 0;'><li><strong style='color: #c62828;'>❌ (A) up to:</strong> Giới từ mang nghĩa 'lên đến' hoặc 'tối đa', thường đi kèm trực tiếp với một số lượng hoặc giới hạn cụ thể (Ví dụ: <i>up to 50 people</i>), hoàn toàn không có chức năng kết nối hai cụm trạng ngữ mang tính đối lập.</li><li><strong style='color: #c62828;'>❌ (B) as though:</strong> Liên từ phụ thuộc mang nghĩa 'như thể là' (= as if), theo sau bắt buộc phải là một mệnh đề hoàn chỉnh (S + V) để diễn tả tình huống giả định, không thể đứng trước cụm giới từ chỉ thời gian như trong đề bài.</li><li><strong style='color: #c62828;'>❌ (C) each time:</strong> Cụm từ đóng vai trò như liên từ chỉ thời gian mang nghĩa 'mỗi lần', bắt buộc phải đi kèm với một mệnh đề bổ nghĩa phía sau (Ví dụ: <i>each time you visit</i>), không phù hợp về cả cấu trúc ngữ pháp lẫn ngữ nghĩa.</li></ul>",
    grammar: "<div style='line-height: 1.6;'><p><strong>⭐ Cấu trúc so sánh loại trừ với 'Rather than' (Parallel Preferential Structures)</strong></p><p>Trong đề thi TOEIC Part 5, cấu trúc <code>A rather than B</code> (A thay vì B / A chứ không phải B) được sử dụng rất phổ biến để hiệu đính thông tin hoặc làm nổi bật một chính sách dịch vụ. Quy tắc cốt lõi của cấu trúc này là tính <strong>song hành (parallelism)</strong>: thành phần đứng sau <i>rather than</i> phải có cùng dạng thức ngữ pháp với thành phần được so sánh phía trước.</p><table border='1' style='width: 100%; border-collapse: collapse; border-color: #e0e0e0; margin-top: 10px; font-size: 14px;'><thead style='background-color: #f5f5f5; text-align: left;'><tr><th style='padding: 8px;'>Thành phần song hành</th><th style='padding: 8px;'>Ví dụ cấu trúc thực tế</th><th style='padding: 8px;'>Bản chất ứng dụng trong bài thi</th></tr></thead><tbody><tr><td style='padding: 8px;'><strong>Nối hai cụm Trạng ngữ</strong></td><td style='padding: 8px; color: #2e7d32; font-weight: bold;'>every day rather than on weekdays</td><td style='padding: 8px;'>So sánh và loại trừ hai mốc thời gian/tần suất hành động (Giống câu đề bài).</td></tr><tr><td style='padding: 8px;'><strong>Nối hai Danh từ</strong></td><td style='padding: 8px; color: #0288d1; font-weight: bold;'>hire professionals rather than amateurs</td><td style='padding: 8px;'>Đưa ra lựa chọn ưu tiên giữa hai đối tượng cụ thể.</td></tr><tr><td style='padding: 8px;'><strong>Nối hai Động từ</strong></td><td style='padding: 8px; color: #e65100; font-weight: bold;'>expand online rather than open stores</td><td style='padding: 8px;'>Lựa chọn phương hướng hành động của doanh nghiệp.</td></tr></tbody></table><p style='margin-top: 10px;'><strong style='color: #e65100;'>🎯 Mẹo làm bài trong 3 giây:</strong> Khi thấy câu xuất hiện hai cụm từ có cấu trúc tương đương nhưng mang ý nghĩa trái ngược rõ rệt, đặc biệt khi vế phía sau có chứa các từ giới hạn như <code>only</code> hoặc <code>just</code>, hãy quét nhanh các phương án và ưu tiên chọn ngay <code style='color: #2e7d32; font-weight: bold;'>rather than</code>.</p></div>",
    vocab: "<ul style='line-height: 1.6;'><li><strong style='color: #0288d1;'>rather than</strong> (prep/conj): thay vì, chứ không phải (= instead of).</li><li><strong style='color: #0288d1;'>weekday</strong> (n): ngày trong tuần, ngày làm việc hành chính (Từ thứ Hai đến thứ Sáu, phân biệt với <i>weekend</i> là hai ngày cuối tuần).</li><li><strong style='color: #0288d1;'>cafeteria</strong> (n): nhà ăn tự phục vụ, căng tin (Thường dùng cho môi trường bệnh viện, trường học hoặc tòa nhà công sở).</li><li><strong style='color: #0288d1;'>serve lunch</strong> (v.phr): phục vụ bữa trưa (Cụm từ cố định ngành dịch vụ nhà hàng - khách sạn).</li></ul>",
    trans: "<div style='line-height: 1.6; padding: 8px; background-color: #f9f9f9; border-left: 4px solid #0288d1;'><p style='margin: 0 0 8px 0;'><strong>Dịch nghĩa gốc:</strong> Nhà ăn của Bệnh viện Milltown phục vụ bữa trưa bảy ngày một tuần thay vì chỉ vào các ngày trong tuần.</p><p style='margin: 0; font-style: italic; color: #555;'><strong>Dịch tự nhiên:</strong> Nhà ăn của Bệnh viện Milltown mở cửa phục vụ bữa trưa tất cả các ngày trong tuần, chứ không phải chỉ phục vụ vào những ngày hành chính từ thứ Hai đến thứ Sáu.</p></div>"
  }
},
        {
  id: 129,
  q: "The store’s entire inventory of lumber comes from a nearby ______ supplier.",
  options: [
    "financial",
    "promotional",
    "chemical",
    "commercial"
  ],
  a: "commercial",
  exp: {

ự tin chọn ngay <code style='color: #2e7d32; font-weight: bold;'>commercial</code>.</p></div>",

    "passage": "<div class=\"article-container\">\n    <div class=\"article-body\">\n        <p><i>Tips for designing a Web site for a food-truck business</i></p><p>Owners of food trucks move from place to place, within and between cities, as they\ncarry out their business, <span class=\"clue-highlight-1\">so they often rely on word of mouth or social media to\nattract customers.</span> As a result, they may not build a Web site of their own. But in\nfact, by the very nature of their business, it is crucial that food truck owners have\na fixed place for the public to learn about them, order from them, contact them, etc. Furthermore, market research shows that a Web site can help build a loyal\ncustomer base. So, here are some tips for developing a great Web site for your food truck.</p>\n        <p>The Home page should have bold graphics with your food truck's name. The text\nmust prominently display key information, <span class=\"clue-highlight-2\">such as your truck's locations and\noperating hours.</span> Online forms with fields to fill out, such as reservation requests\nfor special events or services, give new visitors too much visual information. They\nare better incorporated as links or pop-up windows.</p>\n        <p>The Food Menu page needs attractive, high-definition images along with vivid and\nprecise text that describes each menu item in detail. Remember that your photos\nshould be big enough to look appealing on larger computer monitors.</p>\n        <p>The About Us page should include some text explaining your food truck's theme\nand concept, and some biographical data detailing your background in the food industry.</p>\n        <p><span class=\"clue-highlight-4\">The News page can include text informing visitors about seasonal food items and\nupcoming promotions or special events such as food festivals.</span></p>\n    </div>\n</div>\n<hr>\n<div class=\"email-container\">\n    <div class=\"email-header\">\n        <div><strong>To:</strong> Doug Abruzzo &lt;dabruzzo@dzacreative.com&gt;</div>\n        <div><strong>From:</strong> Ed Vale &lt;evale@saffronmail.com&gt;</div>\n        <div><strong>Date:</strong> March 29</div>\n        <div><strong>Subject:</strong> Feedback</div>\n    </div>\n    <div class=\"email-body\">\n        <p>Dear Mr. Abruzzo,</p>\n        <p><span class=\"clue-highlight-3\">Thank you again for creating the prototype Web site for my food-truck business.</span> I just\nwanted to reiterate that it has gotten positive feedback from customers who have tested it.\nI am so glad we followed the advice in that article you sent me about Web site design for food trucks!</p>\n        <p>As we discussed in our phone call yesterday, <span class=\"clue-highlight-5\">we will move forward with the prototype\nWeb site and launch it as the official site on April 5.</span> <span class=\"clue-highlight-4\">However, I still do not see the\ninformation I sent about our new promotion that will begin in mid-April, a free dessert\nwith any sandwich purchase.</span> Please be sure to add this important information before we\nlaunch the site.</p>\n        <p>Sincerely,</p>\n        <p>Ed</p>\n    </div>\n</div>",
    "translation": "<div class=\"translation-header\">Bản dịch & Phân tích</div>\n        <div class=\"article-container\">\n            <div class=\"article-body\">\n                <p>Các chủ xe đồ ăn thường di chuyển từ nơi này sang nơi khác, trong và giữa các thành phố khi họ kinh doanh, <span class=\"clue-highlight-1\">vì vậy họ thường dựa vào truyền miệng hoặc mạng xã hội để thu hút khách hàng.</span> Kết quả là, họ có thể không xây dựng một trang web riêng cho mình. Nhưng trên thực tế, do đặc thù kinh doanh, việc các chủ xe đồ ăn có một nơi cố định để công chúng tìm hiểu về họ, đặt hàng, liên hệ, v.v. là vô cùng quan trọng. Hơn nữa, nghiên cứu thị trường cho thấy một trang web có thể giúp xây dựng lượng khách hàng trung thành. Vì vậy, dưới đây là một số mẹo để phát triển một trang web tuyệt vời cho xe đồ ăn của bạn.</p>\n                <p>Trang chủ nên có đồ họa đậm nét cùng với tên xe đồ ăn của bạn. Văn bản phải hiển thị nổi bật các thông tin chính, <span class=\"clue-highlight-2\">chẳng hạn như vị trí và giờ hoạt động của xe.</span> Các biểu mẫu trực tuyến với các trường để điền thông tin, chẳng hạn như yêu cầu đặt chỗ cho các sự kiện hoặc dịch vụ đặc biệt, sẽ đưa ra quá nhiều thông tin hình ảnh cho khách truy cập mới. Chúng nên được kết hợp dưới dạng các liên kết hoặc cửa sổ bật lên (pop-up).</p>\n                <p>Trang Thực đơn đồ ăn cần những hình ảnh hấp dẫn, độ phân giải cao cùng với văn bản sống động và chính xác mô tả chi tiết từng món trong thực đơn. Hãy nhớ rằng ảnh của bạn nên đủ lớn để trông lôi cuốn trên các màn hình máy tính lớn.</p>\n                <p>Trang Về chúng tôi nên bao gồm một số văn bản giải thích về chủ đề và ý tưởng xe đồ ăn của bạn, cùng một số dữ liệu tiểu sử chi tiết về kinh nghiệm của bạn trong ngành thực phẩm.</p>\n                <p><span class=\"clue-highlight-4\">Trang Tin tức có thể bao gồm văn bản thông tin cho khách truy cập về các món ăn theo mùa và các chương trình khuyến mãi sắp tới</span> hoặc các sự kiện đặc biệt như lễ hội ẩm thực.</p>\n            </div>\n        </div>\n        <div class=\"email-container\">\n            <div class=\"email-body\">\n                <p>Người nhận: Doug Abruzzo &lt;dabruzzo@dzacreative.com&gt;</p>\n                <p>Người gửi: Ed Vale &lt;evale@saffronmail.com&gt;</p>\n                <p>Ngày: 29 tháng 3</p>\n                <p>Chủ đề: Phản hồi</p>\n                <p>Thân gửi ông Abruzzo,</p>\n                <p><span class=\"clue-highlight-3\">Cảm ơn ông một lần nữa vì đã tạo trang web mẫu cho xe đồ ăn của tôi.</span> Tôi chỉ muốn nhắc lại rằng nó đã nhận được phản hồi tích cực từ những khách hàng đã dùng thử. Tôi rất vui vì chúng ta đã làm theo lời khuyên trong bài báo mà ông đã gửi cho tôi về thiết kế trang web cho xe đồ ăn!</p>\n                <p>Như chúng ta đã thảo luận trong cuộc điện thoại hôm qua, <span class=\"clue-highlight-5\">chúng ta sẽ tiếp tục phát triển với trang web mẫu và ra mắt trang web chính thức vào ngày 5 tháng 4.</span> <span class=\"clue-highlight-4\">Tuy nhiên, tôi vẫn chưa thấy thông tin tôi đã gửi về chương trình khuyến mãi mới sẽ bắt đầu vào giữa tháng 4, tặng một món tráng miệng miễn phí khi mua bất kỳ loại bánh sandwich nào.</span> Vui lòng đảm bảo thêm thông tin quan trọng này trước khi chúng ta ra mắt trang web.</p>\n                <p>Trân trọng,<br>Ed</p>\n            </div>\n        </div>",

    "passage": "<div class=\"email-container\">\n    <div class=\"email-header\">\n        <div><strong>To:</strong> Manny Green &lt;mgreen@rhba.com&gt;</div>\n        <div><strong>From:</strong> John LaRose &lt;jlarose@rilamore.edu&gt;</div>\n        <div><strong>Date:</strong> May 18</div>\n        <div><strong>Subject:</strong> Drilling Notice</div>\n    </div>\n    <div class=\"email-body\">\n        <p>Dear Mr. Green,</p>\n        <p>As a courtesy, I am writing to you at the Red Hills Business Association, asking you to\nhelp me get the word out to your membership. It was announced in last month's Daily\nGazette that Rilamore University is moving forward with its Net Zero Initiative. <span class=\"clue-highlight-1\">Within\nthree years, we expect to have geothermal wells installed and operational for the heating\nand cooling of our entire campus.</span> Limiting the institution's reliance on fossil fuels has long been a goal, and the new system is a significant step toward achieving that goal.</p>\n        <p>Over the next month, we will conduct test drilling in several campus locations. If all\ngoes according to schedule, <span class=\"clue-highlight-3\">the crew will be drilling adjacent to the Red Hills Business\nDistrict and Oak Street Apartments starting Wednesday, June 5.</span> We want to tell business\nowners and residents near the campus to expect a higher-than-usual noise level during\nthe two weeks we estimate it will take to complete the work. The work hours for the\ndrilling crew are 10 A.M. to 3 P.M. each day, Monday through Friday.</p>\n        <p>We apologize in advance for the inconvenience this may cause to our neighbors. Any\nquestions or concerns should be directed to me at 813-555-0123.\n</p>\n        <p>John LaRose<br>Community Liaison, Rilamore University Office of Communications</p>\n    </div>\n</div>\n<hr>\n<div class=\"article-container\">\n    <div class=\"article-body\">\n        <p><strong>FOR IMMEDIATE RELEASE</strong><br>Contact: Manny Green, mgreen@rhba.com</p>\n        <p>RED HILLS (May 25) - The Red Hills Business Association is shifting the dates of\nits much-anticipated Lunch Hour Concert Series. <span class=\"clue-highlight-4\">Normally presented each Thursday\nin June, the four free concerts will instead take place each Thursday in July.</span>The\nlineup of artists remains unchanged-the Jaystone Jazz Trio will open the series on\nJuly 4, followed on successive Thursdays by Joss and the Jaybirds, Ray Starform, and the Barklay Bass Quintet.</p>\n        <p>As usual, all three blocks of Oak Street will be closed to traffic, restaurants will serve\nlunch at outdoor tables, and <span class=\"clue-highlight-5\">local arts-and-crafts vendors will display their work on\nthe lawn of the Cultural Center.</span> It is a beautiful celebration in the heart of a popular Red Hills neighborhood. We hope to see you there!</p>\n    </div>\n</div>",
    "translation": "<div class=\"translation-header\">Bản dịch & Phân tích</div>\n        <div class=\"email-container\">\n            <div class=\"email-body\">\n                <p>Người nhận: Manny Green</p>\n                <p>Người gửi: John LaRose</p>\n                <p>Ngày: 18 tháng 5</p>\n                <p>Chủ đề: Thông báo khoan</p>\n                <p>Kính gửi ông Green,</p>\n                <p>Như một sự thông báo, tôi viết thư này thay mặt Hiệp hội Doanh nghiệp Red Hills, đề nghị ông giúp chúng tôi thông báo tin này đến các thành viên hội đồng. Như đã được công bố trong số báo mới nhất của Daily Gazette rằng Đại học Rilamore đang tiến tới sáng kiến Net Zero. <span class=\"clue-highlight-1\">Trong vòng ba năm tới, chúng tôi kỳ vọng sẽ có các giếng địa nhiệt được lắp đặt và vận hành cho hệ thống sưởi và làm mát của toàn bộ khuôn viên.</span> Việc giảm sự phụ thuộc vào nhiên liệu hóa thạch từ lâu đã là một mục tiêu, và hệ thống mới này là một bước quan trọng để đạt được mục tiêu đó.</p>\n                <p>Trong tháng tới, việc tiến hành khoan thử nghiệm sẽ bắt đầu ở nhiều địa điểm khác nhau. Nếu mọi việc diễn ra theo kế hoạch, <span class=\"clue-highlight-3\">đội ngũ sẽ khoan bắt đầu từ khu Red Hills Business District và khu Oak Street Apartments vào thứ Tư, ngày 5 tháng 6.</span> Chúng tôi muốn các chủ doanh nghiệp và cư dân gần khuôn viên biết rằng sẽ có tiếng ồn lớn hơn bình thường, Trong khoảng 2 tuần chúng tôi ước tính để hoàn thành công việc. Thời gian làm việc cho việc khoan là từ 10 giờ sáng đến 3 giờ chiều mỗi ngày, từ thứ Hai đến thứ Sáu.</p>\n                <p>Chúng tôi xin lỗi vì sự bất tiện có thể gây ra cho các hàng xóm. Nếu có câu hỏi hoặc thắc mắc, vui lòng liên hệ với tôi theo số 813-555-0123.</p>\n                <p>John LaRose<br>Nhân viên liên lạc cộng đồng, Văn phòng Truyền thông Đại học Rilamore</p>\n            </div>\n        </div>\n        <div class=\"article-container\">\n            <div class=\"article-body\">\n                <p><strong>PHÁT HÀNH NGAY LẬP TỨC</strong><br>Liên hệ: Manny Green, mgreen@rhba.com</p>\n                <p>Hiệp hội Doanh nghiệp Red Hills rất vui cho biết ngày tổ chức chuỗi hòa nhạc Lunch Hour rất được mong đợi đã được thay đổi. <span class=\"clue-highlight-4\">Thông thường được tổ chức vào các ngày thứ Năm trong tháng 6, năm nay chuỗi hòa nhạc sẽ diễn ra vào các ngày thứ Năm trong tháng 7.</span> Danh sách nghĩ sĩ vẫn không thay đổi -  Jaystone Jazz Trio sẽ mở màn vào ngày 4 tháng 7, tiếp theo là các buổi biểu diễn liên tiếp của Thursday Blues và The Jaystone Jazz Trio.</p>\n                <p>Như thường lệ, cả ba dãy nhà trên đường Oak Street sẽ bị đóng để phục vụ giao thông, các nhà hàng sẽ phục vụ bữa trưa tại bàn ngoài trời, và <span class=\"clue-highlight-5\">các nghệ sĩ thủ công địa phương sẽ trưng bày tác phẩm của họ trên bãi cỏ Trung tâm Văn hóa.</span> Đây là một lễ hội tuyệt vời ngay tại trung tâm của khu dân cư Red Hills nổi tiếng. Chúng tôi hy vọng sẽ gặp bạn tại đó!</p>\n            </div>\n        </div>",

    let evElements = document.querySelectorAll('.ev-box');

    evElements.forEach(el => {
        let idString = el.id;
        if (!idString) return;
        let match = idString.match(/ev-(\d+)/);
        if (match) {
            let qId = match[1];
            if (!usedColors[qId]) {
                usedColors[qId] = pastelColors[colorIndex % pastelColors.length];
                colorIndex++;
            }
            el.style.backgroundColor = usedColors[qId].bg;
            el.style.color = usedColors[qId].text;
            el.style.padding = "2px 5px";
            el.style.borderRadius = "6px";
            el.style.fontWeight = "600";
            el.style.transition = "all 0.3s ease";
        }
    });
}

function formatAnswer(options, answer) {
    if(!options) return answer;
    if(Array.isArray(options)) {
        // Bỏ qua mảng object của Part 7 vì đáp án đã là A,B,C,D sẵn
        if (typeof options[0] === 'object') return answer; 
        let labels = ["A", "B", "C", "D"];
        let idx = options.indexOf(answer);
        return idx !== -1 ? labels[idx] : answer;
    }
    return answer; 
}

function createTOEICQuestion(qObj) {
    if(!qObj || !qObj.id) return "";
    
    // 1. Lấy nội dung câu hỏi
    let text = qObj.q || qObj.text || qObj.qEng || "";
    
    // XỬ LÝ LẶP SỐ: Nếu nội dung câu hỏi bắt đầu bằng "151. ", "152. "... thì xóa nó đi
    // vì đã có số thứ tự hiển thị trong vòng tròn màu hồng bên trái rồi.
    if (typeof text === 'string') {
        text = text.replace(/^\d+\.\s*/, ""); // Xóa số và dấu chấm ở đầu (vd: "131. " -> "")
        text = text.replace(/(\([^)]+\))/g, '<span class="vi-trans">$1</span>');
    }
    
    let opts = qObj.options;
    let optsHTML = "";
    let inputStyle = `margin-right:12px; transform:scale(1.3); cursor:pointer;`;
    let labelStyle = `display:block; margin:5px 0 5px -10px; padding:8px 12px; border-radius:10px; cursor:pointer; border:1px solid transparent; transition:0.2s; font-size:18px;`;

    if (Array.isArray(opts)) {
        let labels = ["A", "B", "C", "D"];
        opts.forEach((opt, i) => {
            // Sửa lỗi undefined cho các Option Part 6, 7 (dùng .text thay vì .en)
            let optText = typeof opt === 'object' ? (opt.text || opt.en || "") : opt;
            
            // XỬ LÝ LẶP NHÃN A. A.: Xóa "A. ", "B. " có sẵn trong dữ liệu
            if (typeof optText === 'string') {
                optText = optText.replace(/^[A-D]\.\s*/, ""); 
                optText = optText.replace(/(\([^)]+\))/g, '<span class="vi-trans">$1</span>');
            }

            let optValue = typeof opt === 'object' ? (opt.key || labels[i]) : labels[i];
            
            optsHTML += `
                <label class="mc-option" style="${labelStyle}" onmouseover="this.style.background='var(--exp-bg)'" onmouseout="this.style.background='transparent'">
                    <input type="radio" name="q${qObj.id}" value="${optValue}" style="${inputStyle}" onclick="checkNav(${qObj.id})"> 
                    <b>${labels[i]}.</b> ${optText}
                </label>`;
        });
    } else {
        // Trường hợp options là Object (thường cho Part 5)
        for (let key in opts) {
            let optText = opts[key];
            if (typeof optText === 'string') {
                optText = optText.replace(/^[A-D]\.\s*/, ""); 
                optText = optText.replace(/(\([^)]+\))/g, '<span class="vi-trans">$1</span>');
            }
            optsHTML += `
                <label class="mc-option" style="${labelStyle}" onmouseover="this.style.background='var(--exp-bg)'" onmouseout="this.style.background='transparent'">
                    <input type="radio" name="q${qObj.id}" value="${key}" style="${inputStyle}" onclick="checkNav(${qObj.id})"> 
                    <b>${key}.</b> ${optText}
                </label>`;
        }
    }

    return `<div class="q-row" id="q-row-${qObj.id}" style="margin-bottom:25px; display:flex;">
                <!-- Đây là nơi hiển thị số thứ tự trong vòng tròn -->
                <div class="q-num" style="min-width:35px; height:35px; background:var(--primary); color:white; border-radius:50%; display:flex; align-items:center; justify-content:center; font-weight:bold; margin-right:15px; flex-shrink:0;">${qObj.id}</div>
                <div class="q-text" style="flex:1; font-size:18px; line-height:1.8;">
                    <div class="q-content-wrapper">
                        <!-- Biến 'text' ở đây đã được cắt bỏ số thứ tự trùng lặp -->
                        <b>${text}</b><br>${optsHTML}
                        <span id="fb-${qObj.id}" class="feedback" style="font-weight:bold; margin-left:10px;"></span>
                    </div>
                    <div id="exp-${qObj.id}" class="exp-container"></div>
                </div>
            </div>`;
}

function createQuestionsBlock(passageObj) {
    let html = `<div class="questions-block" style="margin-bottom: 40px; background: transparent; padding: 0;" onmouseenter="showPassage('${passageObj.passageId}')">`;
    html += `<div style="color:var(--primary-dark); font-weight:bold; margin-bottom:15px; border-bottom: 2px solid var(--border); padding-bottom:10px; font-size: 18px;">📝 Questions for Passage: ${passageObj.passageId}</div>`;
    
    let validQuestions = passageObj.questions.filter(q => q && q.id);

validQuestions.forEach(q => {
    html += createTOEICQuestion(q);
    allQuestionIds.push(q.id);
    let correctAns = q.a || q.correct;
    if (!correctAns && Array.isArray(q.options) && typeof q.options === 'object') {
        let correctObj = q.options.find(o => o.isCorrect);
        if (correctObj) correctAns = correctObj.key;
    }
    answerKey[q.id] = formatAnswer(q.options, correctAns);
    // Nạp giải thích cho Part 6, 7 vào biến toàn cục
    explanations[q.id] = { exp: q.explanation || "" };
});
    html += `</div>`;
    return html;
}

function switchTab(n) {
    const mainContainer = document.getElementById('mainContainer');
    document.querySelectorAll('.tab-btn').forEach((b, i) => { b.classList.toggle('active', i + 1 === n); });
    document.querySelectorAll('.question-group').forEach((q, i) => { q.style.display = (i + 1 === n) ? 'block' : 'none'; });
    
    // Quản lý chế độ Part 5 hoặc 6-7
    if (n === 1) {
        mainContainer.classList.add('part5-mode');
    } else {
        mainContainer.classList.remove('part5-mode');

let currentStep = 0;

function updatePagination() {
    const activeGroup = document.querySelector('.question-group[style*="display: block"]');
    if (!activeGroup) return;

    const partSuffix = activeGroup.id.split('-').pop(); // Lấy số 1, 2 hoặc 3
    const isPart5 = activeGroup.id === 'q-group-1';
    
    // Nếu đã nộp bài: hiện tất cả, ẩn thanh điều hướng
    if (isSubmitted) {
        activeGroup.querySelectorAll('.questions-block, .q-row').forEach(el => el.style.display = isPart5 ? 'flex' : 'block');
        document.getElementById(`paginationBox${partSuffix}`).style.display = 'none';
        return;
    }

    const steps = isPart5 ? activeGroup.querySelectorAll('.q-row') : activeGroup.querySelectorAll('.questions-block');
    
    steps.forEach((step, index) => {
        if (index === currentStep) {
            step.style.display = isPart5 ? 'flex' : 'block';
            if (!isPart5) {
                // Đảm bảo gọi đúng hàm hiện bài đọc
                const pId = step.getAttribute('onmouseenter').match(/'([^']+)'/)[6];
                showPassage(pId);
            }
        } else {
            step.style.display = 'none';
        }
    });

    // Cập nhật trạng thái nút tương ứng với Part hiện tại
    document.getElementById(`btnPrev${partSuffix}`).disabled = (currentStep === 0);
    document.getElementById(`btnNext${partSuffix}`).disabled = (currentStep === steps.length - 1);
}

function changeStep(delta) {
    currentStep += delta;
    updatePagination();
}

function checkNav(id) {
    if(isSubmitted) return;
    let val = "";
    let radios = document.getElementsByName(`q${id}`);
    for (let r of radios) if (r.checked) val = r.value;

    let nav = document.getElementById(`nav-${id}`);
    if(nav) {
        if (val) nav.classList.add("done");
        else nav.classList.remove("done");
    }
}

function scrollToQuestion(id) {
    document.getElementById('navPanel').classList.remove('show');
    let group = 1;
    if (toeicData.part6.some(p => p.questions.some(q => q.id == id))) group = 2;
    if (toeicData.part7.some(p => p.questions.some(q => q.id == id))) group = 3;
    
    switchTab(group); // Chuyển Tab trước

    // Tìm xem câu hỏi này nằm ở vị trí (index) thứ mấy trong Part đó
    const activeGroup = document.getElementById(`q-group-${group}`);
    const steps = group === 1 ? activeGroup.querySelectorAll('.q-row') : activeGroup.querySelectorAll('.questions-block');
    
    steps.forEach((step, index) => {
        if (step.id === `q-row-${id}` || step.querySelector(`#q-row-${id}`)) {
            currentStep = index; // Cập nhật vị trí hiện tại
        }
    });

    updatePagination(); // Hiển thị câu hỏi đó lên
}
    
    setTimeout(() => {
        let el = document.getElementById(`q-row-${id}`);
        if (el) {
            el.scrollIntoView({behavior: "smooth", block: "center"});
            el.style.transition = "background 0.5s";
            el.style.background = "#fff9c4";
            setTimeout(() => el.style.background = "transparent", 1000);
            
            // Kích hoạt hiển thị đoạn văn luôn
            let parentBlock = el.closest('.questions-block');
            if(parentBlock) {
                // Kích hoạt event onmouseenter bằng code
                let mouseEvent = new MouseEvent('mouseenter');
                parentBlock.dispatchEvent(mouseEvent);
            }
        }
    }, 100);

const HISTORY_KEY = "snapenglish_test1_2026_history";
let isReviewingMode = false;
function openHistoryModal() {
    // Lấy dữ liệu lịch sử từ localStorage
    let history = JSON.parse(localStorage.getItem(HISTORY_KEY)) || [];
    let historyListEl = document.getElementById('historyList');

    // Kiểm tra nếu chưa có lịch sử

        history.forEach(attempt => {

                    </div>

            `;
        });
    }
    
    // Đổ dữ liệu vào danh sách và hiển thị bảng Modal

function saveAttemptToHistory(score, total, userAnswersMap) {
    let history = JSON.parse(localStorage.getItem(HISTORY_KEY)) || [];
    let now = new Date();
    
    let attempt = {
        id: Date.now(),
        date: now.toLocaleDateString('vi-VN'),
        time: now.toLocaleTimeString('vi-VN', { hour: '2-digit', minute: '2-digit' }),
        score: score,
        total: total,
        toeicScore: calculateToeicReading(score, total),
        answers: userAnswersMap // Lưu lại toàn bộ ABCD đã chọn
    };
    
    history.unshift(attempt); // Đẩy bài mới nhất lên đầu
    localStorage.setItem(HISTORY_KEY, JSON.stringify(history));

    // ĐỒNG BỘ LÊN CLOUD NGAY SAU KHI LƯU
    if (window.syncHistoryToCloud) {
        window.syncHistoryToCloud(history);
    }
}

function deleteAttempt(attemptId) {
    showCustomConfirm("Bạn có chắc chắn muốn xóa bài làm này khỏi lịch sử không?", function() {
        let history = JSON.parse(localStorage.getItem(HISTORY_KEY)) || [];
        history = history.filter(h => h.id !== attemptId); 
        localStorage.setItem(HISTORY_KEY, JSON.stringify(history)); 
        
        // ĐỒNG BỘ THAO TÁC XÓA LÊN CLOUD
        if (window.syncHistoryToCloud) {
            window.syncHistoryToCloud(history);
        }
        
        openHistoryModal(); 
    });
}
function restoreAttempt(attemptId) {
    let history = JSON.parse(localStorage.getItem(HISTORY_KEY)) || [];
    let attempt = history.find(h => h.id === attemptId);
    
    if(!attempt) return;

    isReviewingMode = true; // Bật cờ hiệu "Đang xem lại"
    document.getElementById('historyOverlay').style.display = 'none';
    document.getElementById('setupOverlay').style.display = 'none';
    
    document.querySelectorAll('input[type="radio"]').forEach(el => {
        el.disabled = false;
        el.checked = false; 
    });
    
    // Tự động đánh dấu lại các Radio button đáp án học viên đã chọn trong lịch sử
    for (let qId in attempt.answers) {
        let val = attempt.answers[qId];
        if (val) {
            let radio = document.querySelector(`input[name="q${qId}"][value="${val}"]`);
            if (radio) radio.checked = true;
        }
    }
    
   // Đổi chữ nút Nộp bài thành "Đang xem lại" cho ngầu
    let btnSubmit = document.querySelector('.btn-submit');
    if(btnSubmit) {
        btnSubmit.innerText = "ĐANG XEM LẠI";
        btnSubmit.style.background = "#888";
        btnSubmit.style.boxShadow = "none";
    }

    // --- THÊM 2 DÒNG NÀY VÀO TRƯỚC DẤU NGOẶC NHỌN ĐÓNG HÀM ---
    isSubmitted = false; 
    executeSubmit();
}

    else executeSubmit();

function executeSubmit() {
    document.getElementById('confirmOverlay').style.display = 'none';
    isSubmitted = true;
updatePagination();
    clearInterval(timerInterval);
    document.querySelectorAll('input, select').forEach(el => el.disabled = true);
    
    document.getElementById('mainContainer').classList.add('show-translation');
    
    let activeTabIndex = 1;
    document.querySelectorAll('.tab-btn').forEach((b, i) => {
        if (b.classList.contains('active')) activeTabIndex = i + 1;
    });
    switchTab(activeTabIndex);
    
    let score = 0;
    let totalQuestions = allQuestionIds.length;
    let userAnswersMap = {}; // Thêm cái này để hứng đáp án học viên

    allQuestionIds.forEach(id => {
        let userAns = "";
        let radios = document.getElementsByName(`q${id}`);
        for (let r of radios) if (r.checked) userAns = r.value;
        
        userAnswersMap[id] = userAns; // Ghi nhận đáp án câu này

        let correctAns = answerKey[id];
        let isCorrect = (userAns === correctAns);
        if (isCorrect && userAns !== "") score++; // Có chọn mới tính điểm

        let feedbackEl = document.getElementById(`fb-${id}`);
        if(feedbackEl) {
            if(isCorrect && userAns !== "") {
                feedbackEl.innerHTML = `<span style="color:var(--correct);">✓ Đúng</span>`;
            } else if (userAns === "") {
                feedbackEl.innerHTML = `<span style="color:#888;">Trống (Đáp án: <span style="background:#dce775; color:#333; padding:2px 5px; border-radius:4px;">${correctAns}</span>)</span>`;
            } else {
                feedbackEl.innerHTML = `<span style="color:var(--wrong);">✗ Sai (Đáp án: <span style="background:#dce775; color:#333; padding:2px 5px; border-radius:4px;">${correctAns}</span>)</span>`;
            }
        }
        
        let nav = document.getElementById(`nav-${id}`);
        if(nav) {
            if (isCorrect && userAns !== "") {
                nav.style.background = "#c8e6c9"; nav.style.color = "#2e7d32"; nav.style.borderColor = "#81c784";
            } else {
                nav.style.background = "#ffcdd2"; nav.style.color = "#c62828"; nav.style.borderColor = "#ef9a9a";
            }
        }

        let expContainer = document.getElementById(`exp-${id}`);
        if(expContainer && explanations[id]) {
            let expData = explanations[id];
let contentHtml = "";

if (expData.exp) contentHtml += `<div class="exp-text">${expData.exp}</div>`;
if (expData.vocab) contentHtml += `<div class="exp-vocab">${expData.vocab}</div>`;
if (expData.tip) contentHtml += `<div style="margin-top:8px; color:var(--primary-dark); font-weight:600;">📌 Ghi chú: ${expData.tip}</div>`;

expContainer.innerHTML = `
    <div class="exp-box show">
        <div class="exp-title">💡 Giải thích chi tiết Câu ${id}</div>
        ${contentHtml}
    </div>
`;
        }
    });

   
    if (!isReviewingMode) {
        saveAttemptToHistory(score, totalQuestions, userAnswersMap);
        document.getElementById('resultMessage').innerHTML = `Bạn đã làm đúng <b style="color: var(--primary); font-size: 22px;">${score}/${totalQuestions}</b> câu.<br>Điểm TOEIC Reading quy đổi: <b>${calculateToeicReading(score, totalQuestions)}</b>`;
        document.getElementById('resultOverlay').style.display = 'flex';
        if(window.luuDiemTOEICReadingFull) {
            // Tính toán thời gian thực tế đã làm (số phút ban đầu trừ đi số phút còn lại)
            let minutesAssigned = (currentMode === 'mock') ? 75 : parseInt(document.getElementById('timeInput').value);
            if(isNaN(minutesAssigned) || minutesAssigned < 1) minutesAssigned = 75;
            let timeTaken = Math.round(minutesAssigned - (testDuration / 60));
            
            // Truyền thêm timeTaken vào hàm
            window.luuDiemTOEICReadingFull(score, totalQuestions, "ETS 2026 - Test 1", timeTaken);
        }
    } else {
        // Đưa khối else này ra đúng vị trí của nó
        let toastMsg = document.createElement("div");
        toastMsg.innerText = "Đã khôi phục bài làm ngày cũ!";
        toastMsg.style.cssText = "position:fixed; top:20px; right:20px; background:var(--primary); color:white; padding:15px 20px; border-radius:12px; font-weight:bold; font-family:'Quicksand',sans-serif; z-index:99999; box-shadow:0 10px 30px rgba(0,0,0,0.2);";
        document.body.appendChild(toastMsg);
        setTimeout(() => toastMsg.remove(), 3000);
    }
}
        

function calculateToeicReading(raw, total) {
    if (raw === 0) return 5;
    let percent = raw / total;
    let score = Math.round((percent * 495) / 5) * 5; 
    return score > 495 ? 495 : (score < 5 ? 5 : score);
}

// --- HIGHLIGHT SYSTEM ---
const mainContainer = document.getElementById("mainContainer");
const menu = document.getElementById("ctxMenu");
let targetElement = null;
let selectedRange = null;

// Chuyển menu sang fixed để bám đúng con trỏ chuột dù đang cuộn ở cột nào
menu.style.position = "fixed";

mainContainer.addEventListener("contextmenu", (e) => {
    e.preventDefault();
    targetElement = null; selectedRange = null;
    
    // Nếu click chuột phải vào vùng đã highlight -> Hiện nút Xóa
    if (e.target.classList.contains("highlight")) {
        targetElement = e.target;
        showMenu(e.clientX, e.clientY, "remove");
        return;
    }
    
    // Nếu bôi đen văn bản mới -> Hiện nút Thêm
    let sel = window.getSelection();
    if (sel.toString().trim().length > 0 && mainContainer.contains(sel.anchorNode)) {
        selectedRange = sel.getRangeAt(0);
        showMenu(e.clientX, e.clientY, "add");
    } else {
        menu.style.display = "none";
    }
});

// Bấm chuột trái ra ngoài thì ẩn menu
document.addEventListener("click", (e) => { 
    if (menu && !menu.contains(e.target)) menu.style.display = "none"; 
});

function showMenu(x, y, mode) {
    menu.style.display = "block";
    let mw = menu.offsetWidth;
    let mh = menu.offsetHeight;
    
    // Chống tràn màn hình
    let left = x + mw > window.innerWidth ? window.innerWidth - mw - 10 : x;
    let top = y + mh > window.innerHeight ? window.innerHeight - mh - 10 : y;
    
    menu.style.left = left + "px";
    menu.style.top = top + "px";
    
    menu.children[0].style.display = (mode === "add") ? "block" : "none";
    menu.children[1].style.display = (mode === "remove") ? "block" : "none";
}

function doHighlight() {
    if (selectedRange) {
        try { 
            let span = document.createElement("span");
            span.className = "highlight";
            selectedRange.surroundContents(span); 
        } catch(e) {
            showCustomAlert("Lưu ý: Chỉ có thể bôi vàng các cụm từ nằm trong cùng một đoạn văn. Vui lòng không bôi đen vắt ngang qua các khoảng ngắt dòng nhé!");
        }
        window.getSelection().removeAllRanges();
    }
    menu.style.display = "none";
}

function removeHighlight() {
    if (targetElement) {
        let text = document.createTextNode(targetElement.textContent);
        targetElement.parentNode.replaceChild(text, targetElement);
        mainContainer.normalize(); // Nối lại văn bản liền mạch
    }
    menu.style.display = "none";
}
</script>

    window.syncHistoryToCloud = async function(historyData) {
        if (!window.currentUserUid) return;

            // Đặt tên document phân biệt theo Test và User
            let docId = window.currentUserUid + "_history_test1_2026";
            await setDoc(doc(db, "user_test_histories", docId), {
                savedHistory: historyData,
                lastUpdated: Date.now()

        } catch (error) {
            console.error("Lỗi đồng bộ lịch sử: ", error);
        }
    }

            onSnapshot(docRef, (docSnap) => {

                    let cloudData = docSnap.data().savedHistory;

                        localStorage.setItem(localKey, JSON.stringify(cloudData));

    window.luuDiemTOEICReadingFull = async function(correct, total, testTitle, timeTaken) {

        let hours = now.getHours().toString().padStart(2, '0');

                timeTaken: timeTaken,

            });
            showInGameToast("☁️ Đã nộp điểm lên bảng vàng SnapEnglish!");

            console.error(e);
        }
    }
