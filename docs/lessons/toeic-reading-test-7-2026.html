  {
    id: 115, 
    q: "The proposed purchase agreement is _______ being evaluated by officials at Corlan Tech.", 
    options: ["active", "actively", "activity", "activate"], 
    a: "actively", 
    exp: {
      correct: "<div style='line-height: 1.6;'><p><strong>a. Phân tích thành phần câu:</strong> Câu ở thì Hiện tại tiếp diễn dạng bị động (Present Continuous Passive).</p><ul><li><strong>Chủ ngữ (S):</strong> <code>The proposed purchase agreement</code></li><li><strong>Động từ to be (V1):</strong> <code>is</code></li><li><strong>Trạng từ bổ nghĩa (Adv):</strong> <code>actively</code></li><li><strong>Cụm bị động tiếp diễn (V2):</strong> <code>being evaluated</code></li><li><strong>Trạng ngữ chỉ tác nhân:</strong> <code>by officials at Corlan Tech</code></li></ul><p><strong>b. Xác định loại từ cần điền:</strong> Vị trí đứng giữa trợ động từ <i>is</i> và cụm bị động <i>being evaluated</i> (<code>is + _____ + being evaluated</code>) bắt buộc phải là một <span style='color: #2e7d32; font-weight: bold;'>Trạng từ (Adverb)</span> bổ nghĩa cho động từ.</p><p><strong>c. Lý do chọn đáp án:</strong> Trong 4 phương án, chỉ có <span style='color: #2e7d32; font-weight: bold;'>actively</span> là trạng từ (đuôi -ly). Cụm <i>actively being evaluated</i> nghĩa là 'đang được tích cực đánh giá/xem xét'.</p></div>",
      wrong: "<ul style='line-height: 1.6; list-style-type: none; padding-left: 0;'><li><strong style='color: #c62828;'>❌ (A) active:</strong> Tính từ ('tích cực / chủ động'), không đứng giữa trợ động từ và dạng bị động <i>being evaluated</i>.</li><li><strong style='color: #c62828;'>❌ (C) activity:</strong> Danh từ ('hoạt động'), không phù hợp vị trí ngữ pháp bổ nghĩa cho động từ.</li><li><strong style='color: #c62828;'>❌ (D) activate:</strong> Động từ nguyên mẫu ('kích hoạt'), không thể chen vào giữa <i>is</i> và <i>being</i>.</li></ul>",
      grammar: "<div style='line-height: 1.6;'><p><strong>⭐ Vị trí Trạng từ trong Cấu trúc Bị động tiếp diễn (Passive Continuous)</strong></p><p>Vị trí của trạng từ bổ nghĩa cho động từ bị động là một điểm ngữ pháp cốt lõi trong TOEIC Part 5: <code>S + be + ADVERB + being + V3/ed</code>.</p><table border='1' style='width: 100%; border-collapse: collapse; border-color: #e0e0e0; margin-top: 10px; font-size: 14px;'><thead style='background-color: #f5f5f5; text-align: left;'><tr><th style='padding: 8px;'>Thành phần câu</th><th style='padding: 8px;'>Vị trí công thức</th><th style='padding: 8px;'>Ví dụ thực tế</th></tr></thead><tbody><tr><td style='padding: 8px;'><strong>Chủ ngữ (S)</strong></td><td style='padding: 8px;'>The agreement</td><td style='padding: 8px;'>The proposal...</td></tr><tr><td style='padding: 8px;'><strong>Be + Adverb</strong></td><td style='padding: 8px;'>is + <strong>actively</strong></td><td style='padding: 8px;'>...is <strong>currently</strong>...</td></tr><tr><td style='padding: 8px;'><strong>Being + V3/ed</strong></td><td style='padding: 8px;'>being evaluated</td><td style='padding: 8px;'>...being reviewed.</td></tr></tbody></table><p style='margin-top: 10px;'>💡 <strong>Mẹo làm nhanh:</strong> Thấy công thức <code>be + _____ + V-ing / V3/ed</code> (hoặc <code>being + V3/ed</code>) → Chọn ngay <strong>Trạng từ có đuôi -ly</strong>.</p></div>",
      vocab: "<ul style='line-height: 1.6;'><li><strong style='color: #0288d1;'>purchase agreement</strong> (phr): hợp đồng / thỏa thuận mua bán.</li><li><strong style='color: #0288d1;'>evaluate</strong> (v): đánh giá, xem xét kỹ lưỡng.</li><li><strong style='color: #0288d1;'>proposed</strong> (adj): được đề xuất.</li></ul>",
      trans: "<div style='line-height: 1.6; padding: 8px; background-color: #f9f9f9; border-left: 4px solid #0288d1;'><p style='margin: 0;'><strong>Dịch nghĩa:</strong> Thỏa thuận mua bán được đề xuất hiện đang được các quan chức tại Corlan Tech tích cực xem xét.</p></div>"
    }

  {
    id: 116, 
    q: "Another _______ option for getting to the airport will be available once the subway station at the international terminal is completed.", 
    options: ["convenient", "receptive", "fortunate", "traditional"], 
    a: "convenient", 
    exp: {
      correct: "<div style='line-height: 1.6;'><p><strong>a. Phân tích thành phần câu:</strong> Câu phức gồm mệnh đề chính chỉ sự việc tương lai và mệnh đề trạng ngữ chỉ thời gian nối bằng <i>once</i>.</p><ul><li><strong>Chủ ngữ chính (S):</strong> <code>Another convenient option for getting to the airport</code></li><li><strong>Động từ chính (V):</strong> <code>will be available</code></li><li><strong>Mệnh đề trạng ngữ:</strong> <code>once the subway station at the international terminal is completed</code></li></ul><p><strong>b. Xác định loại từ cần điền:</strong> Chỗ trống đứng sau từ hạn định <i>Another</i> và trước danh từ <i>option</i> (<code>Another + _____ + option</code>), cần một <span style='color: #2e7d32; font-weight: bold;'>Tính từ (Adjective)</span> bổ nghĩa cho danh từ. Cả 4 lựa chọn đều là tính từ nên cần xét theo ngữ cảnh.</p><p><strong>c. Lý do chọn đáp án:</strong> Việc hoàn thành thêm một ga tàu điện ngầm sẽ đem lại một lựa chọn di chuyển thuận tiện (<span style='color: #2e7d32; font-weight: bold;'>convenient option</span>) tới sân bay.</p></div>",
      wrong: "<ul style='line-height: 1.6; list-style-type: none; padding-left: 0;'><li><strong style='color: #c62828;'>❌ (B) receptive:</strong> Tính từ nghĩa là 'cởi mở, dễ tiếp thu' (thường mô tả thái độ con người / ý tưởng: <i>receptive audience</i>), không bổ nghĩa cho <i>option</i>.</li><li><strong style='color: #c62828;'>❌ (C) fortunate:</strong> Tính từ nghĩa là 'may mắn', không dùng để miêu tả phương tiện hay lựa chọn giao thông.</li><li><strong style='color: #c62828;'>❌ (D) traditional:</strong> Tính từ nghĩa là 'truyền thống', không hợp lý khi nói về một tuyến tàu điện ngầm mới sắp hoàn thành.</li></ul>",
      grammar: "<div style='line-height: 1.6;'><p><strong>⭐ Các Collocation Tính từ đi với danh từ \"Option / Alternative\" trong TOEIC</strong></p><p>Từ <i>option</i> (lựa chọn) rất hay đi kèm các tính từ chỉ tính hữu ích, chi phí hoặc sự thuận tiện.</p><table border='1' style='width: 100%; border-collapse: collapse; border-color: #e0e0e0; margin-top: 10px; font-size: 14px;'><thead style='background-color: #f5f5f5; text-align: left;'><tr><th style='padding: 8px;'>Cụm Collocation</th><th style='padding: 8px;'>Ý nghĩa</th><th style='padding: 8px;'>Ví dụ thực tế</th></tr></thead><tbody><tr><td style='padding: 8px;'><strong>convenient option</strong></td><td style='padding: 8px;'>Lựa chọn thuận tiện</td><td style='padding: 8px;'>Subway is a <i>convenient option</i> for commuters.</td></tr><tr><td style='padding: 8px;'><strong>viable / feasible option</strong></td><td style='padding: 8px;'>Lựa chọn khả thi</td><td style='padding: 8px;'>A <i>viable option</i> for small businesses.</td></tr><tr><td style='padding: 8px;'><strong>cost-effective option</strong></td><td style='padding: 8px;'>Lựa chọn tiết kiệm chi phí</td><td style='padding: 8px;'>Carpooling is a <i>cost-effective option</i>.</td></tr><tr><td style='padding: 8px;'><strong>preferred option</strong></td><td style='padding: 8px;'>Lựa chọn được ưu tiên</td><td style='padding: 8px;'>Email remains the <i>preferred option</i>.</td></tr></tbody></table><p style='margin-top: 10px;'>💡 <strong>Mẹo làm nhanh:</strong> Khi nói về phương tiện giao thông, địa điểm kinh doanh hoặc tiện ích công cộng → 90% ưu tiên chọn tính từ <strong>convenient</strong>.</p></div>",
      vocab: "<ul style='line-height: 1.6;'><li><strong style='color: #0288d1;'>convenient option</strong> (phr): lựa chọn thuận tiện.</li><li><strong style='color: #0288d1;'>once + Clause</strong> (conj): ngay khi / một khi... (sau <i>once</i> dùng thì hiện tại đơn để diễn tả hành động tương lai).</li><li><strong style='color: #0288d1;'>international terminal</strong> (phr): nhà ga quốc tế (sân bay).</li></ul>",
      trans: "<div style='line-height: 1.6; padding: 8px; background-color: #f9f9f9; border-left: 4px solid #0288d1;'><p style='margin: 0;'><strong>Dịch nghĩa:</strong> Sẽ có thêm một lựa chọn thuận tiện để đến sân bay sau khi ga tàu điện ngầm tại nhà ga quốc tế được hoàn thành.</p></div>"
    }

        {
    id: 117,
    q: "Given the forecast for rain on Saturday, the ceremony _______ indoors at the Raheen Gallery.",
    options: ["is held", "was held", "will be held", "had been held"],
    a: "will be held",
    exp: {
      correct: "<div style='line-height: 1.6;'><p><strong>a. Phân tích thành phần câu:</strong> Câu gồm cụm giới từ mở đầu chỉ lý do/căn cứ và mệnh đề chính theo sau.</p><ul><li><strong>Cụm giới từ chỉ lý do:</strong> <code>Given the forecast for rain on Saturday</code></li><li><strong>Mệnh đề chính:</strong> <code>the ceremony (S) + will be held (V) + indoors at the Raheen Gallery (Adv)</code></li></ul><p><strong>b. Xác định loại từ cần điền:</strong> Vị trí đứng sau chủ ngữ <i>the ceremony</i> cần một <span style='color: #2e7d32; font-weight: bold;'>Động từ chia thì ở thể Bị động (Passive Voice)</span>.</p><p><strong>c. Lý do chọn đáp án:</strong> Cụm <i>forecast for rain on Saturday</i> chỉ dự báo thời tiết cho thứ Bảy sắp tới (tương lai). Đồng thời, buổi lễ (<i>ceremony</i>) phải 'được tổ chức' bởi ban tổ chức nên cần dùng thể Bị động Tương lai đơn <span style='color: #2e7d32; font-weight: bold;'>will be held</span>.</p></div>",
      wrong: "<ul style='line-height: 1.6; list-style-type: none; padding-left: 0;'><li><strong style='color: #c62828;'>❌ (A) is held:</strong> Thì Hiện tại đơn bị động, thường dùng cho lịch trình cố định lặp đi lặp lại hoặc sự thật hiển nhiên. Đề bài có <i>forecast for Saturday</i> thể hiện một quyết định điều chỉnh theo dự báo thời tiết.</li><li><strong style='color: #c62828;'>❌ (B) was held:</strong> Thì Quá khứ đơn bị động, không dùng cho sự việc căn cứ theo dự báo thời tiết chưa diễn ra.</li><li><strong style='color: #c62828;'>❌ (D) had been held:</strong> Thì Quá khứ hoàn thành bị động, yêu cầu phải có một mốc thời gian/hành động quá khứ khác để làm mốc so sánh.</li></ul>",
      grammar: "<div style='line-height: 1.6;'><p><strong>⭐ Cấu trúc Bị động Tương lai đơn & Cụm từ chỉ căn cứ \"Given + Noun\"</strong></p><p>Cụm từ <i>Given + Danh từ</i> đứng đầu câu là cấu trúc rất hay gặp trong TOEIC, dùng để đưa ra căn cứ nhằm thực hiện một quyết định tiếp theo.</p><table border='1' style='width: 100%; border-collapse: collapse; border-color: #e0e0e0; margin-top: 10px; font-size: 14px;'><thead style='background-color: #f5f5f5; text-align: left;'><tr><th style='padding: 8px;'>Thành phần</th><th style='padding: 8px;'>Công thức</th><th style='padding: 8px;'>Ví dụ thực tế</th></tr></thead><tbody><tr><td style='padding: 8px;'><strong>Cụm căn cứ</strong></td><td style='padding: 8px;'>Given + Noun / Noun Phrase</td><td style='padding: 8px;'><i>Given the bad weather</i>,...</td></tr><tr><td style='padding: 8px;'><strong>Bị động tương lai</strong></td><td style='padding: 8px;'>S + will be + V3/ed</td><td style='padding: 8px;'>The event <i>will be held</i> inside.</td></tr></tbody></table><p style='margin-top: 10px;'>💡 <strong>Mẹo làm nhanh:</strong> Nhìn thấy <i>Given the forecast</i> (Dự báo) → Quyết định xử lý sự việc trong tương lai → Chọn dạng bị động tương lai <strong>will be + V3/ed</strong>.</p></div>",

      trans: "<div style='line-height: 1.6; padding: 8px; background-color: #f9f9f9; border-left: 4px solid #0288d1;'><p style='margin: 0;'><strong>Dịch nghĩa:</strong> Theo yêu cầu của ông Rzayev, các pallet gỗ dư đã được xếp chồng phía sau nhà kho cũ.</p></div>"

      wrong: "<ul style='line-height: 1.6; list-style-type: none; padding-left: 0;'><li><strong style='color: #c62828;'>❌ (A) diversion:</strong> Danh từ ('sự làm xao nhãng / sự chuyển hướng'), không thể đứng trước danh từ <i>range</i> để bổ nghĩa trong ngữ cảnh này.</li><li><strong style='color: #c62828;'>❌ (B) diversely:</strong> Trạng từ ('một cách đa dạng'), không bổ nghĩa trực tiếp cho danh từ <i>range</i>.</li><li><strong style='color: #c62828;'>❌ (D) diversify:</strong> Động từ ('đa dạng hóa'), sai vị trí ngữ pháp.</li></ul>",

      trans: "<div style='line-height: 1.6; padding: 8px; background-color: #f9f9f9; border-left: 4px solid #0288d1;'><p style='margin: 0;'><strong>Dịch nghĩa:</strong> Giáo sư McNamara đã xuất bản nhiều cuốn sách về nhiều chủ đề đa dạng.</p></div>"

      wrong: "<ul style='line-height: 1.6; list-style-type: none; padding-left: 0;'><li><strong style='color: #c62828;'>❌ (A) consent:</strong> Danh từ ('sự đồng ý / sự tán thành'), không hợp ngữ cảnh giải thích nguyên nhân dự án thất bại.</li><li><strong style='color: #c62828;'>❌ (B) break:</strong> Danh từ ('sự nghỉ ngơi / giờ giải lao / sự đứt gãy'), không ghép thành cụm từ có nghĩa với <i>milestones</i>.</li><li><strong style='color: #c62828;'>❌ (D) complex:</strong> Tính từ ('phức tạp') hoặc danh từ ('khu phức hợp'), không tạo thành cụm từ hợp lý trong trường hợp này.</li></ul>",
      grammar: "<div style='line-height: 1.6;'><p><strong>⭐ Cấu trúc Danh từ \"A lack of + N\" chỉ sự thiếu hụt trong TOEIC</strong></p><p>Từ <i>lack</i> vừa là động từ vừa là danh từ, cách dùng với giới từ rất hay được kiểm tra.</p><table border='1' style='width: 100%; border-collapse: collapse; border-color: #e0e0e0; margin-top: 10px; font-size: 14px;'><thead style='background-color: #f5f5f5; text-align: left;'><tr><th style='padding: 8px;'>Từ loại</th><th style='padding: 8px;'>Cấu trúc</th><th style='padding: 8px;'>Ví dụ thực tế</th></tr></thead><tbody><tr><td style='padding: 8px;'><strong>Danh từ (Noun)</strong></td><td style='padding: 8px;'><strong>a lack of + N</strong> (có <i>of</i>)</td><td style='padding: 8px;'>Due to <i>a lack of</i> funding...</td></tr><tr><td style='padding: 8px;'><strong>Động từ (Verb)</strong></td><td style='padding: 8px;'><strong>lack + N</strong> (không có <i>of</i>)</td><td style='padding: 8px;'>They <i>lack</i> experience.</td></tr></tbody></table><p style='margin-top: 10px;'>💡 <strong>Mẹo làm nhanh:</strong> Thấy cấu trúc <code>A + _____ + OF + Noun</code> kết hợp với nghĩa tiêu cực (<i>failed / rejected</i>) → Chọn ngay danh từ <strong>lack</strong>.</p></div>",
      vocab: "<ul style='line-height: 1.6;'><li><strong style='color: #0288d1;'>lack of</strong> (phr): sự thiếu hụt...</li><li><strong style='color: #0288d1;'>milestone</strong> (n): cột mốc quan trọng.</li><li><strong style='color: #0288d1;'>clearly defined</strong> (adj): được xác định rõ ràng.</li></ul>",
      trans: "<div style='line-height: 1.6; padding: 8px; background-color: #f9f9f9; border-left: 4px solid #0288d1;'><p style='margin: 0;'><strong>Dịch nghĩa:</strong> Sự thiếu các cột mốc được xác định rõ ràng có lẽ là lý do khiến dự án phát triển phần mềm thất bại.</p></div>"

        {
    id: 121,
    q: "Rosemont Department Store employees are said to be very well-informed, _______, and responsive.",
    options: ["person", "personably", "personify", "personable"],
    a: "personable",
    exp: {
      correct: "<div style='line-height: 1.6;'><p><strong>a. Phân tích thành phần câu:</strong> Câu sử dụng bị động đặc biệt với động từ chỉ ý kiến/đánh giá kết hợp cấu trúc liệt kê song song.</p><ul><li><strong>Chủ ngữ (S):</strong> <code>Rosemont Department Store employees</code></li><li><strong>Động từ (V):</strong> <code>are said to be</code></li><li><strong>Bổ ngữ chủ ngữ (C):</strong> <code>very well-informed, personable, and responsive</code></li></ul><p><strong>b. Xác định loại từ cần điền:</strong> Vị trí nằm trong chuỗi liệt kê nối bằng dấu phẩy và liên từ <i>and</i> (<code>well-informed, _____, and responsive</code>). Cả từ đứng trước (<i>well-informed</i>) và từ đứng sau (<i>responsive</i>) đều là tính từ. Theo <span style='color: #2e7d32; font-weight: bold;'>Cấu trúc song song (Parallel Structure)</span>, vị trí trống bắt buộc phải là một <strong>Tính từ (Adjective)</strong>.</p><p><strong>c. Lý do chọn đáp án:</strong> Tính từ <span style='color: #2e7d32; font-weight: bold;'>personable</span> (thân thiện, dễ mến) bổ nghĩa cho chủ ngữ <i>employees</i>, tạo thành bộ 3 phẩm chất hoàn hảo của nhân viên bán hàng.</p></div>",
      wrong: "<ul style='line-height: 1.6; list-style-type: none; padding-left: 0;'><li><strong style='color: #c62828;'>❌ (A) person:</strong> Danh từ ('con người'), không thể đứng vào chuỗi tính từ làm bổ ngữ cho chủ ngữ sau <i>be</i>.</li><li><strong style='color: #c62828;'>❌ (B) personably:</strong> Trạng từ ('một cách lịch sự / dễ gần'), không bổ nghĩa cho chủ ngữ đứng sau động từ <i>to be</i>.</li><li><strong style='color: #c62828;'>❌ (C) personify:</strong> Động từ ('nhân hóa / là hiện thân của'), sai từ loại.</li></ul>",
      grammar: "<div style='line-height: 1.6;'><p><strong>⭐ Cấu trúc Song song (Parallel Structure) & Họ từ vựng của \"Person\"</strong></p><p>Khi thấy liên từ <i>and / or / but</i> nối các từ cùng chức năng, các từ đó bắt buộc phải đồng dạng từ loại với nhau.</p><table border='1' style='width: 100%; border-collapse: collapse; border-color: #e0e0e0; margin-top: 10px; font-size: 14px;'><thead style='background-color: #f5f5f5; text-align: left;'><tr><th style='padding: 8px;'>Từ loại</th><th style='padding: 8px;'>Từ vựng</th><th style='padding: 8px;'>Ý nghĩa</th></tr></thead><tbody><tr><td style='padding: 8px;'><strong>Tính từ (Adj)</strong></td><td style='padding: 8px;'><strong>personable</strong></td><td style='padding: 8px;'>Thân thiện, dễ mến, có duyên</td></tr><tr><td style='padding: 8px;'><strong>Trạng từ (Adv)</strong></td><td style='padding: 8px;'>personably</td><td style='padding: 8px;'>Một cách thân thiện</td></tr><tr><td style='padding: 8px;'><strong>Danh từ (N)</strong></td><td style='padding: 8px;'>person / personality</td><td style='padding: 8px;'>Con người / Tính cách</td></tr><tr><td style='padding: 8px;'><strong>Động từ (V)</strong></td><td style='padding: 8px;'>personify</td><td style='padding: 8px;'>Nhân hóa, là hình mẫu cho</td></tr></tbody></table><p style='margin-top: 10px;'>💡 <strong>Mẹo làm nhanh:</strong> Nhìn thấy dạng <code>Adj, _____ , and Adj</code> → Tự động chọn ngay <strong>Tính từ</strong> mà không cần dịch nghĩa cả câu.</p></div>",
      vocab: "<ul style='line-height: 1.6;'><li><strong style='color: #0288d1;'>well-informed</strong> (adj): am hiểu, có tri thức sâu rộng.</li><li><strong style='color: #0288d1;'>personable</strong> (adj): thân thiện, dễ mến.</li><li><strong style='color: #0288d1;'>responsive</strong> (adj): phản hồi nhanh chóng, nhiệt tình.</li><li><strong style='color: #0288d1;'>be said to + V</strong> (phr): được cho là / được nói là...</li></ul>",
      trans: "<div style='line-height: 1.6; padding: 8px; background-color: #f9f9f9; border-left: 4px solid #0288d1;'><p style='margin: 0;'><strong>Dịch nghĩa:</strong> Nhân viên của cửa hàng bách hóa Rosemont được cho là rất hiểu biết, thân thiện và phản hồi khách hàng rất nhanh.</p></div>"
    }

  {
    id: 122,
    q: "The security officer at the front gate will _______ delivery drivers as to where to drop off packages.",
    options: ["invite", "instruct", "provide", "present"],
    a: "instruct",
    exp: {
      correct: "<div style='line-height: 1.6;'><p><strong>a. Phân tích thành phần câu:</strong> Câu đơn chứa trợ động từ tương lai và cụm giới từ chỉ nội dung hướng dẫn.</p><ul><li><strong>Chủ ngữ (S):</strong> <code>The security officer at the front gate</code></li><li><strong>Động từ (V):</strong> <code>will instruct</code></li><li><strong>Tân ngữ (O):</strong> <code>delivery drivers</code></li><li><strong>Cụm bổ nghĩa:</strong> <code>as to where to drop off packages</code></li></ul><p><strong>b. Xác định loại từ cần điền:</strong> Vị trí đứng sau <i>will</i> cần một <span style='color: #2e7d32; font-weight: bold;'>Động từ nguyên mẫu (Bare Infinitive)</span>. Cả 4 đáp án đều là động từ nên cần xét cấu trúc Collocation đi kèm.</p><p><strong>c. Lý do chọn đáp án:</strong> Động từ <span style='color: #2e7d32; font-weight: bold;'>instruct</span> đi hợp chuẩn xác với cấu trúc <span style='color: #2e7d32; font-weight: bold;'>instruct somebody as to / on / how to...</span> (hướng dẫn ai về việc gì / làm thế nào).</p></div>",
      wrong: "<ul style='line-height: 1.6; list-style-type: none; padding-left: 0;'><li><strong style='color: #c62828;'>❌ (A) invite:</strong> Động từ ('mời'), có cấu trúc <i>invite somebody to somewhere/do something</i>, không dùng với <i>as to</i>.</li><li><strong style='color: #c62828;'>❌ (C) provide:</strong> Động từ ('cung cấp'), bắt buộc đi với cấu trúc <i>provide somebody WITH something</i> hoặc <i>provide something FOR somebody</i>.</li><li><strong style='color: #c62828;'>❌ (D) present:</strong> Động từ ('trình bày, trao tặng'), đi với <i>present something to somebody</i>, không đi với <i>as to</i>.</li></ul>",
      grammar: "<div style='line-height: 1.6;'><p><strong>⭐ Collocation của Động từ \"Instruct\" & Cụm giới từ \"As to\" trong TOEIC</strong></p><p>Cụm <i>as to</i> tương đương với <i>about / regarding</i> (về việc). Khi kết hợp với các động từ chỉ dẫn sẽ tạo thành cấu trúc câu làm việc rất phổ biến.</p><table border='1' style='width: 100%; border-collapse: collapse; border-color: #e0e0e0; margin-top: 10px; font-size: 14px;'><thead style='background-color: #f5f5f5; text-align: left;'><tr><th style='padding: 8px;'>Cấu trúc</th><th style='padding: 8px;'>Ý nghĩa</th><th style='padding: 8px;'>Ví dụ thực tế</th></tr></thead><tbody><tr><td style='padding: 8px;'><strong>instruct sb as to + Wh-</strong></td><td style='padding: 8px;'>Hướng dẫn ai về việc...</td><td style='padding: 8px;'>instruct staff <i>as to</i> where to go</td></tr><tr><td style='padding: 8px;'><strong>instruct sb to V</strong></td><td style='padding: 8px;'>Yêu cầu/Chỉ thị ai làm gì</td><td style='padding: 8px;'>instruct drivers <i>to park</i> outside</td></tr><tr><td style='padding: 8px;'><strong>provide sb with sth</strong></td><td style='padding: 8px;'>Cung cấp cho ai cái gì</td><td style='padding: 8px;'>provide drivers <i>with</i> badges</td></tr></tbody></table><p style='margin-top: 10px;'>💡 <strong>Mẹo làm nhanh:</strong> Nhìn thấy phía sau tân ngữ có cụm <code>as to + Wh-question</code> → Chọn ngay động từ <strong>instruct</strong>.</p></div>",
      vocab: "<ul style='line-height: 1.6;'><li><strong style='color: #0288d1;'>instruct somebody as to...</strong> (phr): hướng dẫn ai về...</li><li><strong style='color: #0288d1;'>drop off</strong> (phr v): giao hàng, để lại, thả (khách/hàng).</li><li><strong style='color: #0288d1;'>as to</strong> (prep): về, liên quan đến (= regarding / concerning).</li><li><strong style='color: #0288d1;'>security officer</strong> (n): nhân viên an ninh / bảo vệ.</li></ul>",
      trans: "<div style='line-height: 1.6; padding: 8px; background-color: #f9f9f9; border-left: 4px solid #0288d1;'><p style='margin: 0;'><strong>Dịch nghĩa:</strong> Nhân viên an ninh ở cổng chính sẽ hướng dẫn các tài xế giao hàng về nơi họ cần để các kiện hàng.</p></div>"
    }
  },
  {
    id: 123,
    q: "_______ some tickets to the concert are still available, all the best seats have already been taken.",
    options: ["Although", "Except", "Notice", "After"],
    a: "Although",
    exp: {
      correct: "<div style='line-height: 1.6;'><p><strong>a. Phân tích thành phần câu:</strong> Câu phức gồm hai mệnh đề có quan hệ đối lập/nhượng bộ.</p><ul><li><strong>Mệnh đề 1:</strong> <code>some tickets to the concert (S1) + are (V1) + still available (C1)</code></li><li><strong>Mệnh đề 2:</strong> <code>all the best seats (S2) + have already been taken (V2)</code></li></ul><p><strong>b. Xác định loại từ cần điền:</strong> Vị trí đứng đầu câu nối hai mệnh đề hoàn chỉnh (<code>_____ + Clause 1, Clause 2</code>) bắt buộc phải là một <span style='color: #2e7d32; font-weight: bold;'>Liên từ phụ thuộc (Subordinating Conjunction)</span>.</p><p><strong>c. Lý do chọn đáp án:</strong> Ý vế 1 là 'vẫn còn vé', ý vế 2 là 'chỗ đẹp nhất đã hết'. Hai ý trái ngược nhau nên liên từ chỉ sự tương phản <span style='color: #2e7d32; font-weight: bold;'>Although</span> (Mặc dù) là đáp án duy nhất đúng cả về ngữ pháp lẫn logic.</p></div>",
      wrong: "<ul style='line-height: 1.6; list-style-type: none; padding-left: 0;'><li><strong style='color: #c62828;'>❌ (B) Except:</strong> Giới từ ('ngoại trừ'), phải đi với Danh từ/Cụm danh từ (hoặc <i>except that + Clause</i>), không đi trực tiếp với mệnh đề <i>some tickets... are...</i></li><li><strong style='color: #c62828;'>❌ (C) Notice:</strong> Danh từ ('thông báo') hoặc Động từ ('chú ý'), không thể đóng vai trò liên từ nối hai mệnh đề.</li><li><strong style='color: #c62828;'>❌ (D) After:</strong> Liên từ chỉ thời gian ('sau khi'), không phù hợp về mặt logic mối quan hệ tương phản giữa hai mệnh đề.</li></ul>",
      grammar: "<div style='line-height: 1.6;'><p><strong>⭐ Phân biệt Liên từ Tương phản vs Giới từ Tương phản trong TOEIC</strong></p><p>Bài thi TOEIC thường xuyên bắt thí sinh phân biệt nhóm từ đi với Mệnh đề (S + V) và nhóm từ đi với Cụm danh từ (Noun / V-ing).</p><table border='1' style='width: 100%; border-collapse: collapse; border-color: #e0e0e0; margin-top: 10px; font-size: 14px;'><thead style='background-color: #f5f5f5; text-align: left;'><tr><th style='padding: 8px;'>Loại từ</th><th style='padding: 8px;'>Từ vựng tiêu biểu</th><th style='padding: 8px;'>Cấu trúc bắt buộc</th></tr></thead><tbody><tr><td style='padding: 8px;'><strong>Liên từ (Conjunction)</strong></td><td style='padding: 8px;'><strong>Although / Though / Even though</strong></td><td style='padding: 8px;'><strong>+ Mệnh đề (S + V)</strong></td></tr><tr><td style='padding: 8px;'><strong>Giới từ (Preposition)</strong></td><td style='padding: 8px;'>Despite / In spite of / Except for</td><td style='padding: 8px;'><strong>+ Noun / V-ing</strong></td></tr></tbody></table><p style='margin-top: 10px;'>💡 <strong>Mẹo làm nhanh:</strong> Mối quan hệ tương phản (vừa tích cực vừa tiêu cực) + Phía sau là Mệnh đề đầy đủ (<i>some tickets... are...</i>) → Chọn ngay <strong>Although</strong>.</p></div>",
      vocab: "<ul style='line-height: 1.6;'><li><strong style='color: #0288d1;'>available</strong> (adj): có sẵn, còn vé/phòng.</li><li><strong style='color: #0288d1;'>take a seat</strong> (phr): đặt chỗ, mua chỗ (bị động: <i>seats are taken</i>).</li><li><strong style='color: #0288d1;'>although + Clause</strong> (conj): mặc dù...</li></ul>",
      trans: "<div style='line-height: 1.6; padding: 8px; background-color: #f9f9f9; border-left: 4px solid #0288d1;'><p style='margin: 0;'><strong>Dịch nghĩa:</strong> Mặc dù vẫn còn một số vé của buổi hòa nhạc, tất cả những chỗ ngồi đẹp nhất đã được bán hết.</p></div>"
    }
  },
  {
    id: 124,
    q: "Visitors must park in the designated parking area _______ risk having their vehicle towed.",
    options: ["or", "but", "yet", "and"],
    a: "or",
    exp: {
      correct: "<div style='line-height: 1.6;'><p><strong>a. Phân tích thành phần câu:</strong> Câu nối hai vế hành động và hậu quả bằng liên từ kết hợp.</p><ul><li><strong>Vế 1 (Yêu cầu):</strong> <code>Visitors (S) + must park in the designated parking area (V1)</code></li><li><strong>Vế 2 (Hậu quả nếu không tuân thủ):</strong> <code>[or] + risk having their vehicle towed (V2)</code></li></ul><p><strong>b. Xác định loại từ cần điền:</strong> Vị trí nối hai cụm động từ/mệnh đề cần một <span style='color: #2e7d32; font-weight: bold;'>Liên từ kết hợp (Coordinating Conjunction)</span>.</p><p><strong>c. Lý do chọn đáp án:</strong> Cấu trúc cảnh báo quy định chuẩn trong tiếng Anh kinh doanh là <span style='color: #2e7d32; font-weight: bold;'>Do A, OR + Bad Outcome</span> (Hãy làm A, nếu không thì sẽ gặp hậu quả B). Liên từ <span style='color: #2e7d32; font-weight: bold;'>or</span> mang nghĩa 'nếu không thì'.</p></div>",
      wrong: "<ul style='line-height: 1.6; list-style-type: none; padding-left: 0;'><li><strong style='color: #c62828;'>❌ (B) but:</strong> Liên từ ('nhưng'), dùng nối 2 ý tương phản thuần túy, không diễn tả mối quan hệ điều kiện - hậu quả bị phạt.</li><li><strong style='color: #c62828;'>❌ (C) yet:</strong> Liên từ ('tuy nhiên / vậy mà'), tương tự <i>but</i>, không phù hợp logic câu cảnh báo quy định.</li><li><strong style='color: #c62828;'>❌ (D) and:</strong> Liên từ ('và'), nếu chọn <i>and</i> câu sẽ mang nghĩa 'khách tham quan phải đỗ xe đúng nơi VÀ phải chịu rủi ro bị kéo xe', hoàn toàn sai logic.</li></ul>",
      grammar: "<div style='line-height: 1.6;'><p><strong>⭐ Mẫu câu Quy định & Cảnh báo hậu quả với \"OR\" trong TOEIC</strong></p><p>Trong các biển báo, thông báo quy định tòa nhà hay quy chế công ty, cấu trúc mệnh lệnh/bắt buộc đi với <i>OR</i> rất phổ biến.</p><table border='1' style='width: 100%; border-collapse: collapse; border-color: #e0e0e0; margin-top: 10px; font-size: 14px;'><thead style='background-color: #f5f5f5; text-align: left;'><tr><th style='padding: 8px;'>Cấu trúc</th><th style='padding: 8px;'>Ý nghĩa ngữ pháp</th><th style='padding: 8px;'>Ví dụ thực tế</th></tr></thead><tbody><tr><td style='padding: 8px;'><strong>Must + V, OR + V...</strong></td><td style='padding: 8px;'>Phải làm A, nếu không thì...</td><td style='padding: 8px;'>Pay now, <i>or</i> face a fine.</td></tr><tr><td style='padding: 8px;'><strong>risk + V-ing</strong></td><td style='padding: 8px;'>Có nguy cơ / Đối mặt rủi ro</td><td style='padding: 8px;'>...<i>risk losing</i> money.</td></tr><tr><td style='padding: 8px;'><strong>have + Sth + V3/ed</strong></td><td style='padding: 8px;'>Thủ động truyền sai (bị người khác làm gì)</td><td style='padding: 8px;'>have their vehicle <i>towed</i></td></tr></tbody></table><p style='margin-top: 10px;'>💡 <strong>Mẹo làm nhanh:</strong> Thấy vế đầu là bắt buộc (<i>must park...</i>) + vế sau là rủi ro/hình phạt (<i>risk having... towed</i>) → Chọn ngay liên từ <strong>or</strong>.</p></div>",
      vocab: "<ul style='line-height: 1.6;'><li><strong style='color: #0288d1;'>designated parking area</strong> (phr): khu vực đỗ xe được chỉ định.</li><li><strong style='color: #0288d1;'>risk + V-ing</strong> (phr): có nguy cơ bị / liều lĩnh làm gì.</li><li><strong style='color: #0288d1;'>tow a vehicle</strong> (phr): cẩu / kéo xe vi phạm về bãi.</li></ul>",
      trans: "<div style='line-height: 1.6; padding: 8px; background-color: #f9f9f9; border-left: 4px solid #0288d1;'><p style='margin: 0;'><strong>Dịch nghĩa:</strong> Khách tham quan phải đỗ xe ở khu vực được chỉ định, nếu không xe của họ có nguy cơ bị kéo đi.</p></div>"
    }
  },
  {
    id: 125,
    q: "When Ms. Liu was hired, the _______ was to train her to work in the chemistry lab.",
    options: ["intend", "intention", "intended", "intentional"],
    a: "intention",
    exp: {
      correct: "<div style='line-height: 1.6;'><p><strong>a. Phân tích thành phần câu:</strong> Câu phức gồm mệnh đề trạng ngữ thời gian và mệnh đề chính.</p><ul><li><strong>Mệnh đề phụ:</strong> <code>When Ms. Liu was hired</code></li><li><strong>Mệnh đề chính:</strong> <code>the intention (S) + was (V) + to train her to work in the chemistry lab (C)</code></li></ul><p><strong>b. Xác định loại từ cần điền:</strong> Vị trí đứng sau mạo từ <i>the</i> và trước động từ <i>was</i> (<code>the + _____ + was</code>) bắt buộc phải là một <span style='color: #2e7d32; font-weight: bold;'>Danh từ (Noun)</span> giữ chức năng làm chủ ngữ.</p><p><strong>c. Lý do chọn đáp án:</strong> Trong 4 phương án, <span style='color: #2e7d32; font-weight: bold;'>intention</span> (ý định, mục đích) là danh từ duy nhất. Tạo thành cụm cố định <span style='color: #2e7d32; font-weight: bold;'>The intention was to + V</span> (Mục đích là để làm gì).</p></div>",
      wrong: "<ul style='line-height: 1.6; list-style-type: none; padding-left: 0;'><li><strong style='color: #c62828;'>❌ (A) intend:</strong> Động từ nguyên mẫu ('dự định'), không thể đứng sau mạo từ <i>the</i> làm chủ ngữ.</li><li><strong style='color: #c62828;'>❌ (C) intended:</strong> Tính từ / Quá khứ phân từ ('được dự định'), không đứng một mình làm danh từ chủ ngữ trong trường hợp này.</li><li><strong style='color: #c62828;'>❌ (D) intentional:</strong> Tính từ ('có ý định / cố ý'), không làm chủ ngữ được.</li></ul>",
      grammar: "<div style='line-height: 1.6;'><p><strong>⭐ Cấu trúc \"The intention is/was to + V\" & Họ từ vựng của \"Intend\"</strong></p><p>Cấu trúc chỉ mục đích công việc rất hay xuất hiện trong các bài đọc và bài tập từ loại Part 5.</p><table border='1' style='width: 100%; border-collapse: collapse; border-color: #e0e0e0; margin-top: 10px; font-size: 14px;'><thead style='background-color: #f5f5f5; text-align: left;'><tr><th style='padding: 8px;'>Từ loại</th><th style='padding: 8px;'>Từ vựng</th><th style='padding: 8px;'>Ý nghĩa</th></tr></thead><tbody><tr><td style='padding: 8px;'><strong>Danh từ (N)</strong></td><td style='padding: 8px;'><strong>intention</strong></td><td style='padding: 8px;'>Ý định, mục đích (<i>The intention was to V</i>)</td></tr><tr><td style='padding: 8px;'><strong>Động từ (V)</strong></td><td style='padding: 8px;'>intend</td><td style='padding: 8px;'>Dự định (<i>intend to V</i>)</td></tr><tr><td style='padding: 8px;'><strong>Tính từ (Adj)</strong></td><td style='padding: 8px;'>intended / intentional</td><td style='padding: 8px;'>Được dự định / Cố ý, có tính toán</td></tr></tbody></table><p style='margin-top: 10px;'>💡 <strong>Mẹo làm nhanh:</strong> Thấy cấu trúc <code>The + _____ + was / is + to V</code> → Chọn ngay danh từ chỉ mục đích <strong>intention</strong>.</p></div>",
      vocab: "<ul style='line-height: 1.6;'><li><strong style='color: #0288d1;'>intention</strong> (n): ý định, mục đích.</li><li><strong style='color: #0288d1;'>train somebody to V</strong> (phr): đào tạo ai làm gì.</li><li><strong style='color: #0288d1;'>chemistry lab</strong> (phr): phòng thí nghiệm hóa học.</li></ul>",
      trans: "<div style='line-height: 1.6; padding: 8px; background-color: #f9f9f9; border-left: 4px solid #0288d1;'><p style='margin: 0;'><strong>Dịch nghĩa:</strong> Khi cô Liu được tuyển dụng, mục đích là đào tạo cô ấy làm việc trong phòng thí nghiệm hóa học.</p></div>"
    }

        {
    id: 126,
    q: "A _______ effect of increased tourism in our city has been rapid growth in the number of hospitality-related jobs.",
    options: ["tentative", "negotiable", "favorable", "perceptive"],
    a: "favorable",
    exp: {
      correct: "<div style='line-height: 1.6;'><p><strong>a. Phân tích thành phần câu:</strong> Câu đơn chứa cụm danh từ chủ ngữ kéo dài và vị ngữ thì hiện tại hoàn thành.</p><ul><li><strong>Chủ ngữ (S):</strong> <code>A favorable effect of increased tourism in our city</code></li><li><strong>Động từ (V):</strong> <code>has been</code></li><li><strong>Bổ ngữ chủ ngữ (C):</strong> <code>rapid growth in the number of hospitality-related jobs</code></li></ul><p><strong>b. Xác định loại từ cần điền:</strong> Chỗ trống đứng giữa mạo từ <i>A</i> và danh từ <i>effect</i> (<code>A + _____ + effect</code>) → Cần một <span style='color: #2e7d32; font-weight: bold;'>Tính từ (Adjective)</span> để bổ nghĩa cho danh từ.</p><p><strong>c. Lý do chọn đáp án:</strong> Vế sau thể hiện kết quả tích cực (<i>rapid growth in jobs</i> - sự gia tăng nhanh chóng số lượng việc làm). Do đó, tính từ mang nghĩa tích cực <span style='color: #2e7d32; font-weight: bold;'>favorable</span> (thuận lợi, tích cực) là lựa chọn duy nhất phù hợp với ngữ cảnh.</p></div>",
      wrong: "<ul style='line-height: 1.6; list-style-type: none; padding-left: 0;'><li><strong style='color: #c62828;'>❌ (A) tentative:</strong> Tính từ ('dự kiến, tạm thời / chưa chắc chắn'), không dùng để miêu tả tác động tạo ra việc làm.</li><li><strong style='color: #c62828;'>❌ (B) negotiable:</strong> Tính từ ('có thể thương lượng'), thường đi với <i>salary / price / contract</i>, không đi với <i>effect</i>.</li><li><strong style='color: #c62828;'>❌ (D) perceptive:</strong> Tính từ ('tinh tế, có óc quan sát'), dùng miêu tả tính cách con người, không dùng cho tác động.</li></ul>",
      grammar: "<div style='line-height: 1.6;'><p><strong>⭐ Collocation với Tính từ \"Favorable\" trong Văn phong Doanh nghiệp</strong></p><p>Trong TOEIC, <i>favorable</i> là một tính từ rất phổ biến xuất hiện trong các bài báo cáo và tin tức kinh tế.</p><table border='1' style='width: 100%; border-collapse: collapse; border-color: #e0e0e0; margin-top: 10px; font-size: 14px;'><thead style='background-color: #f5f5f5; text-align: left;'><tr><th style='padding: 8px;'>Cụm từ cố định</th><th style='padding: 8px;'>Ý nghĩa</th><th style='padding: 8px;'>Ngữ cảnh hay gặp</th></tr></thead><tbody><tr><td style='padding: 8px;'><strong>favorable effect / impact</strong></td><td style='padding: 8px;'>Tác động tích cực / thuận lợi</td><td style='padding: 8px;'>Thị trường, du lịch, chính sách mới</td></tr><tr><td style='padding: 8px;'><strong>favorable conditions</strong></td><td style='padding: 8px;'>Điều kiện thuận lợi</td><td style='padding: 8px;'>Thời tiết, môi trường kinh doanh</td></tr><tr><td style='padding: 8px;'><strong>favorable response / review</strong></td><td style='padding: 8px;'>Phản hồi tích cực</td><td style='padding: 8px;'>Đánh giá sản phẩm, khảo sát khách hàng</td></tr></tbody></table><p style='margin-top: 10px;'>💡 <strong>Mẹo làm nhanh:</strong> Nếu 4 đáp án đều là tính từ, hãy nhìn vế sau: kết quả tốt → chọn tính từ có nét nghĩa tích cực như <strong>favorable</strong>.</p></div>",
      vocab: "<ul style='line-height: 1.6;'><li><strong style='color: #0288d1;'>favorable effect</strong> (phr): tác động tích cực / có lợi.</li><li><strong style='color: #0288d1;'>rapid growth</strong> (phr): sự tăng trưởng nhanh chóng.</li><li><strong style='color: #0288d1;'>hospitality industry</strong> (n): ngành dịch vụ nhà hàng - khách sạn - du lịch.</li></ul>",
      trans: "<div style='line-height: 1.6; padding: 8px; background-color: #f9f9f9; border-left: 4px solid #0288d1;'><p style='margin: 0;'><strong>Dịch nghĩa:</strong> Một tác động tích cực của việc du lịch phát triển ở thành phố chúng ta là sự gia tăng nhanh chóng số lượng việc làm trong ngành dịch vụ khách sạn và du lịch.</p></div>"
    }

  {
    id: 127,
    q: "The new payroll system will send an e-mail to employees _______ a manager edits their time sheet.",
    options: ["now that", "or else", "despite", "whenever"],
    a: "whenever",
    exp: {
      correct: "<div style='line-height: 1.6;'><p><strong>a. Phân tích thành phần câu:</strong> Câu phức nối mệnh đề chính và mệnh đề trạng ngữ chỉ thời gian.</p><ul><li><strong>Mệnh đề chính:</strong> <code>The new payroll system (S1) + will send (V1) + an e-mail to employees (O1)</code></li><li><strong>Mệnh đề trạng ngữ:</strong> <code>[whenever] + a manager (S2) + edits (V2) + their time sheet (O2)</code></li></ul><p><strong>b. Xác định loại từ cần điền:</strong> Phía sau là một mệnh đề hoàn chỉnh (<i>a manager edits...</i>) → Vị trí cần điền một <span style='color: #2e7d32; font-weight: bold;'>Liên từ phụ thuộc (Subordinating Conjunction)</span>.</p><p><strong>c. Lý do chọn đáp án:</strong> <span style='color: #2e7d32; font-weight: bold;'>Whenever</span> (bất cứ khi nào) diễn tả một hành động lặp đi lặp lại mang tính tự động theo thời gian: <i>Mỗi khi quản lý chỉnh sửa bảng chấm công thì hệ thống tự động gửi email.</i></p></div>",
      wrong: "<ul style='line-height: 1.6; list-style-type: none; padding-left: 0;'><li><strong style='color: #c62828;'>❌ (A) now that:</strong> Liên từ ('vì bây giờ / do hiện tại'), dùng để giải thích nguyên nhân cho một sự thật mới xảy ra, không phù hợp về logic hệ thống tự động.</li><li><strong style='color: #c62828;'>❌ (B) or else:</strong> Trạng từ / Liên từ ('nếu không thì'), dùng trong câu đe dọa hoặc cảnh báo hậu quả xấu.</li><li><strong style='color: #c62828;'>❌ (C) despite:</strong> Giới từ ('mặc dù'), theo sau bắt buộc là Danh từ / V-ing, không được đi với mệnh đề.</li></ul>",
      grammar: "<div style='line-height: 1.6;'><p><strong>⭐ Phân biệt các Từ nối thời gian & Nguyên nhân trong TOEIC</strong></p><p>Nhìn vào thành phần đứng sau khoảng trống để loại trừ nhanh các từ khác loại từ (Giới từ vs Liên từ).</p><table border='1' style='width: 100%; border-collapse: collapse; border-color: #e0e0e0; margin-top: 10px; font-size: 14px;'><thead style='background-color: #f5f5f5; text-align: left;'><tr><th style='padding: 8px;'>Từ nối</th><th style='padding: 8px;'>Từ loại</th><th style='padding: 8px;'>Cấu trúc & Ý nghĩa</th></tr></thead><tbody><tr><td style='padding: 8px;'><strong>whenever</strong></td><td style='padding: 8px;'>Liên từ</td><td style='padding: 8px;'><strong>+ Mệnh đề (S + V)</strong>: Bất cứ khi nào (lặp lại)</td></tr><tr><td style='padding: 8px;'><strong>now that</strong></td><td style='padding: 8px;'>Liên từ</td><td style='padding: 8px;'><strong>+ Mệnh đề (S + V)</strong>: Vì giờ đây (= because)</td></tr><tr><td style='padding: 8px;'><strong>despite</strong></td><td style='padding: 8px;'>Giới từ</td><td style='padding: 8px;'><strong>+ Noun / V-ing</strong>: Mặc dù (= in spite of)</td></tr></tbody></table><p style='margin-top: 10px;'>💡 <strong>Mẹo làm nhanh:</strong> Nếu đằng sau là Mệnh đề (S + V) → Loại ngay <i>despite</i>. Xét nghĩa hành động lặp lại tự động → Chọn <strong>whenever</strong>.</p></div>",
      vocab: "<ul style='line-height: 1.6;'><li><strong style='color: #0288d1;'>payroll system</strong> (n): hệ thống tính/trả lương.</li><li><strong style='color: #0288d1;'>time sheet</strong> (n): bảng chấm công / bảng ghi giờ làm việc.</li><li><strong style='color: #0288d1;'>whenever + Clause</strong> (conj): bất cứ khi nào.</li></ul>",
      trans: "<div style='line-height: 1.6; padding: 8px; background-color: #f9f9f9; border-left: 4px solid #0288d1;'><p style='margin: 0;'><strong>Dịch nghĩa:</strong> Hệ thống trả lương mới sẽ gửi email cho nhân viên bất cứ khi nào người quản lý chỉnh sửa bảng chấm công của họ.</p></div>"
    }
  },
  {
    id: 128,
    q: "The order of the speakers has been changed _______ Mr. Chen arrives late.",
    options: ["so", "as of", "during", "in case"],
    a: "in case",
    exp: {
      correct: "<div style='line-height: 1.6;'><p><strong>a. Phân tích thành phần câu:</strong> Câu phức nối mệnh đề chính và mệnh đề trạng ngữ chỉ sự phòng ngừa.</p><ul><li><strong>Mệnh đề chính:</strong> <code>The order of the speakers (S1) + has been changed (V1)</code></li><li><strong>Mệnh đề trạng ngữ:</strong> <code>[in case] + Mr. Chen (S2) + arrives late (V2)</code></li></ul><p><strong>b. Xác định loại từ cần điền:</strong> Phía sau là mệnh đề (<i>Mr. Chen arrives late</i>) → Cần một <span style='color: #2e7d32; font-weight: bold;'>Liên từ (Conjunction)</span>.</p><p><strong>c. Lý do chọn đáp án:</strong> Cụm liên từ <span style='color: #2e7d32; font-weight: bold;'>in case</span> (phòng khi / đề phòng trường hợp) thể hiện việc chuẩn bị sẵn một phương án cho một tình huống rủi ro có thể xảy ra trong tương lai.</p></div>",
      wrong: "<ul style='line-height: 1.6; list-style-type: none; padding-left: 0;'><li><strong style='color: #c62828;'>❌ (A) so:</strong> Liên từ ('vì vậy / cho nên'), dùng để chỉ kết quả thực tế xảy ra, không dùng cho sự phòng ngừa trước.</li><li><strong style='color: #c62828;'>❌ (B) as of:</strong> Giới từ ('kể từ...'), đi kèm với một mốc thời gian (ví dụ: <i>as of Monday</i>), không đi với mệnh đề.</li><li><strong style='color: #c62828;'>❌ (C) during:</strong> Giới từ ('trong suốt'), bắt buộc đi với danh từ chỉ khoảng thời gian (ví dụ: <i>during the meeting</i>), không đi với mệnh đề.</li></ul>",
      grammar: "<div style='line-height: 1.6;'><p><strong>⭐ Cấu trúc \"In Case\" và Cách dùng Thì Hiện tại đơn trong TOEIC</strong></p><p>Sau <i>in case</i>, dù hành động phòng ngừa hướng tới tương lai nhưng động từ trong mệnh đề phụ vẫn chia ở <strong>Hiện tại đơn (Present Simple)</strong>.</p><table border='1' style='width: 100%; border-collapse: collapse; border-color: #e0e0e0; margin-top: 10px; font-size: 14px;'><thead style='background-color: #f5f5f5; text-align: left;'><tr><th style='padding: 8px;'>Cấu trúc</th><th style='padding: 8px;'>Ngữ pháp thì</th><th style='padding: 8px;'>Ví dụ tương tự</th></tr></thead><tbody><tr><td style='padding: 8px;'><strong>In case + S + V(s/es)</strong></td><td style='padding: 8px;'>Mệnh đề phụ dùng <i>Present Simple</i> (arrives)</td><td style='padding: 8px;'>Take an umbrella <i>in case it rains</i>.</td></tr><tr><td style='padding: 8px;'><strong>If + S + V(s/es)</strong></td><td style='padding: 8px;'>Điều kiện (chỉ làm khi điều đó xảy ra)</td><td style='padding: 8px;'>Call me <i>if you need help</i>.</td></tr></tbody></table><p style='margin-top: 10px;'>💡 <strong>Mẹo phân biệt nhanh:</strong> <i>In case</i> = Làm trước để chuẩn bị phòng rủi ro. Phía sau có mệnh đề S + V → Chọn <strong>in case</strong> (loại giới từ <i>during, as of</i>).</p></div>",
      vocab: "<ul style='line-height: 1.6;'><li><strong style='color: #0288d1;'>in case + Clause</strong> (conj): phòng khi, đề phòng trường hợp...</li><li><strong style='color: #0288d1;'>order of the speakers</strong> (phr): thứ tự các diễn giả phát biểu.</li><li><strong style='color: #0288d1;'>arrive late</strong> (vp): đến muộn / trễ giờ.</li></ul>",
      trans: "<div style='line-height: 1.6; padding: 8px; background-color: #f9f9f9; border-left: 4px solid #0288d1;'><p style='margin: 0;'><strong>Dịch nghĩa:</strong> Thứ tự phát biểu của các diễn giả đã được thay đổi để phòng trường hợp ông Chen đến muộn.</p></div>"
    }
  },
  {
    id: 129,
    q: "Even though the fuel container can hold up to a _______ of ten liters, the manufacturer recommends putting in only nine.",
    options: ["maximum", "potential", "greatness", "collection"],
    a: "maximum",
    exp: {
      correct: "<div style='line-height: 1.6;'><p><strong>a. Phân tích thành phần câu:</strong> Câu chứa mệnh đề nhượng bộ chỉ giới hạn dung tích.</p><ul><li><strong>Mệnh đề phụ:</strong> <code>Even though the fuel container (S1) + can hold (V1) + up to a maximum of ten liters (O1)</code></li><li><strong>Mệnh đề chính:</strong> <code>the manufacturer (S2) + recommends (V2) + putting in only nine (O2)</code></li></ul><p><strong>b. Xác định loại từ cần điền:</strong> Nằm trong cấu trúc <i>a + _____ + of + số lượng</i> → Cần một <span style='color: #2e7d32; font-weight: bold;'>Danh từ (Noun)</span> tạo thành cụm định lượng.</p><p><strong>c. Lý do chọn đáp án:</strong> Cụm từ chuẩn <span style='color: #2e7d32; font-weight: bold;'>a maximum of + số lượng</span> (tối đa là bao nhiêu) thể hiện giới hạn sức chứa của bình nhiên liệu.</p></div>",
      wrong: "<ul style='line-height: 1.6; list-style-type: none; padding-left: 0;'><li><strong style='color: #c62828;'>❌ (B) potential:</strong> Danh từ ('tiềm năng'), không kết hợp với con số dung tích (không nói <i>a potential of ten liters</i>).</li><li><strong style='color: #c62828;'>❌ (C) greatness:</strong> Danh từ ('sự vĩ đại / sự lớn lao'), sai nghĩa hoàn toàn.</li><li><strong style='color: #c62828;'>❌ (D) collection:</strong> Danh từ ('bộ sưu tập / sự thu gom'), không dùng để đo lường thể tích chất lỏng.</li></ul>",

// --- HÀM TÔ MÀU DẪN CHỨNG HIỆN SẴN ---
function applyEvidenceColors() {
    const pastelColors = [
        { bg: '#ffadad', text: '#5a1c1c' }, // Đỏ pastel
        { bg: '#ffd6a5', text: '#663d14' }, // Cam pastel
        { bg: '#caffbf', text: '#1f4d1f' }, // Xanh lá pastel
        { bg: '#9bf6ff', text: '#16565c' }, // Xanh dương pastel
        { bg: '#a0c4ff', text: '#1c3666' }, // Xanh biển pastel
        { bg: '#bdb2ff', text: '#352666' }, // Tím pastel
        { bg: '#ffc6ff', text: '#661a66' }, // Hồng pastel
        { bg: '#e2f0cb', text: '#3e5222' }  // Xanh rêu pastel
    ];

    let colorIndex = 0;
    let usedColors = {}; 

    let evElements = document.querySelectorAll('.ev-box');

    evElements.forEach(el => {
        let idString = el.id;
        if (!idString) return;
        let match = idString.match(/ev-(\d+)/);
        if (match) {
            let qId = match[1];
            if (!usedColors[qId]) {
                usedColors[qId] = pastelColors[colorIndex % pastelColors.length];
                colorIndex++;
            }
            el.style.backgroundColor = usedColors[qId].bg;
            el.style.color = usedColors[qId].text;
            el.style.padding = "2px 5px";
            el.style.borderRadius = "6px";
            el.style.fontWeight = "600";
            el.style.transition = "all 0.3s ease";
        }
    });
}

function formatAnswer(options, answer) {
    if(!options) return answer;
    if(Array.isArray(options)) {
        // Bỏ qua mảng object của Part 7 vì đáp án đã là A,B,C,D sẵn
        if (typeof options[0] === 'object') return answer; 
        let labels = ["A", "B", "C", "D"];
        let idx = options.indexOf(answer);
        return idx !== -1 ? labels[idx] : answer;
    }
    return answer; 
}

function createTOEICQuestion(qObj) {
    if(!qObj || !qObj.id) return "";
    
    // 1. Lấy nội dung câu hỏi
    let text = qObj.q || qObj.text || qObj.qEng || "";
    
    // XỬ LÝ LẶP SỐ: Nếu nội dung câu hỏi bắt đầu bằng "151. ", "152. "... thì xóa nó đi
    // vì đã có số thứ tự hiển thị trong vòng tròn màu hồng bên trái rồi.
    if (typeof text === 'string') {
        text = text.replace(/^\d+\.\s*/, ""); // Xóa số và dấu chấm ở đầu (vd: "131. " -> "")
        text = text.replace(/(\([^)]+\))/g, '<span class="vi-trans">$1</span>');
    }
    
    let opts = qObj.options;
    let optsHTML = "";
    let inputStyle = `margin-right:12px; transform:scale(1.3); cursor:pointer;`;
    let labelStyle = `display:block; margin:10px 0; padding:12px 18px; border-radius:var(--radius); cursor:pointer; border:2px solid #f1f5f9; background:#f8fafc; transition:all 0.2s ease; font-size:17px;`;

    if (Array.isArray(opts)) {
        let labels = ["A", "B", "C", "D"];
        opts.forEach((opt, i) => {
            // Sửa lỗi undefined cho các Option Part 6, 7 (dùng .text thay vì .en)
            let optText = typeof opt === 'object' ? (opt.text || opt.en || "") : opt;
            
            // XỬ LÝ LẶP NHÃN A. A.: Xóa "A. ", "B. " có sẵn trong dữ liệu
            if (typeof optText === 'string') {
                optText = optText.replace(/^[A-D]\.\s*/, ""); 
                optText = optText.replace(/(\([^)]+\))/g, '<span class="vi-trans">$1</span>');
            }

            let optValue = typeof opt === 'object' ? (opt.key || labels[i]) : labels[i];
            
            optsHTML += `
                <label class="mc-option" style="${labelStyle}" onmouseover="this.style.background='var(--exp-bg)'" onmouseout="this.style.background='transparent'">
                    <input type="radio" name="q${qObj.id}" value="${optValue}" style="${inputStyle}" onclick="checkNav(${qObj.id})"> 
                    <b>${labels[i]}.</b> ${optText}
                </label>`;
        });
    } else {
        // Trường hợp options là Object (thường cho Part 5)
        for (let key in opts) {
            let optText = opts[key];
            if (typeof optText === 'string') {
                optText = optText.replace(/^[A-D]\.\s*/, ""); 
                optText = optText.replace(/(\([^)]+\))/g, '<span class="vi-trans">$1</span>');
            }
            optsHTML += `
                <label class="mc-option" style="${labelStyle}" onmouseover="this.style.background='var(--exp-bg)'" onmouseout="this.style.background='transparent'">
                    <input type="radio" name="q${qObj.id}" value="${key}" style="${inputStyle}" onclick="checkNav(${qObj.id})"> 
                    <b>${key}.</b> ${optText}
                </label>`;
        }
    }

    return `<div class="q-row" id="q-row-${qObj.id}" style="margin-bottom:30px; display:flex; background:white; padding:25px; border-radius:var(--radius); box-shadow:var(--shadow); border:1px solid var(--border);">
<div class="q-num" style="min-width:42px; height:42px; background:linear-gradient(135deg, var(--primary), var(--primary-dark)); color:white; border-radius:10px; display:flex; align-items:center; justify-content:center; font-weight:800; margin-right:20px; flex-shrink:0; box-shadow: 0 4px 10px rgba(30,58,138,0.2);">${qObj.id}</div>
                <div class="q-text" style="flex:1; font-size:18px; line-height:1.8;">
                    <div class="q-content-wrapper">
                        <!-- Biến 'text' ở đây đã được cắt bỏ số thứ tự trùng lặp -->
                        <b>${text}</b><br>${optsHTML}
                        <span id="fb-${qObj.id}" class="feedback" style="font-weight:bold; margin-left:10px;"></span>
                    </div>
                    <div id="exp-${qObj.id}" class="exp-container"></div>
                </div>
            </div>`;
}

function createQuestionsBlock(passageObj) {
    let html = `<div class="questions-block" style="margin-bottom: 40px; background: transparent; padding: 0;" onmouseenter="showPassage('${passageObj.passageId}')">`;
    html += `<div style="color:var(--primary-dark); font-weight:bold; margin-bottom:15px; border-bottom: 2px solid var(--border); padding-bottom:10px; font-size: 18px;">📝 Questions for Passage: ${passageObj.passageId}</div>`;
    
    let validQuestions = passageObj.questions.filter(q => q && q.id);
    
    validQuestions.forEach(q => {
        html += createTOEICQuestion(q);
        allQuestionIds.push(q.id);
        
        // --- BẮT ĐẦU PHẦN SỬA LỖI ---
        let correctAns = q.a || q.correct; 
        
        // Nếu là Part 6/7 (options là mảng các object)
        if (!correctAns && Array.isArray(q.options)) {
            // Tìm vị trí của option có thuộc tính "correct" là true
            const foundIdx = q.options.findIndex(o => typeof o === 'object' && o.correct === true);
            if (foundIdx !== -1) {
                const labels = ["A", "B", "C", "D"];
                correctAns = labels[foundIdx]; // Chuyển index 0,1,2,3 thành A,B,C,D
            }
        }
        
        answerKey[q.id] = correctAns; // Lưu nhãn A,B,C,D vào bộ nhớ chấm điểm
        // --- KẾT THÚC PHẦN SỬA LỖI ---

        explanations[q.id] = { exp: q.explanation || "" };
    });
    html += `</div>`;
    return html;
}

function switchTab(n) {
    const mainContainer = document.getElementById('mainContainer');
    document.querySelectorAll('.tab-btn').forEach((b, i) => { b.classList.toggle('active', i + 1 === n); });
    document.querySelectorAll('.question-group').forEach((q, i) => { q.style.display = (i + 1 === n) ? 'block' : 'none'; });
    
    // Quản lý chế độ Part 5 hoặc 6-7
    if (n === 1) {
        mainContainer.classList.add('part5-mode');
    } else {
        mainContainer.classList.remove('part5-mode');
    }

    // Reset pagination khi đổi Part
    currentStep = 0;
    updatePagination();
    
    document.querySelector('.pane-right').scrollTop = 0;
}
function showPassage(passageId) {
    document.querySelectorAll('.passage-text-content').forEach(p => p.style.display = 'none');
    
    // Hiện bài tiếng Anh
    let pEng = document.getElementById(`passage-${passageId}`);
    if (pEng) pEng.style.display = 'block';

    // Hiện bản dịch tiếng Việt tương ứng (Cột 2)
    let pVie = document.getElementById(`vie-passage-${passageId}`);
    if (pVie) pVie.style.display = 'block';
}
let currentStep = 0;

function updatePagination() {
    const activeGroup = document.querySelector('.question-group[style*="display: block"]');
    if (!activeGroup) return;
    const partSuffix = activeGroup.id.split('-').pop();
    const isPart5 = activeGroup.id === 'q-group-1';

    if (isSubmitted) {
        activeGroup.querySelectorAll('.questions-block, .q-row').forEach(el => el.style.display = isPart5 ? 'flex' : 'block');
        document.getElementById(`paginationBox${partSuffix}`).style.display = 'none';
        return;
    }

    const steps = isPart5 ? activeGroup.querySelectorAll('.q-row') : activeGroup.querySelectorAll('.questions-block');
    steps.forEach((step, index) => {
        if (index === currentStep) {
            step.style.display = isPart5 ? 'flex' : 'block';
            if (!isPart5) {
                // SỬA TẠI ĐÂY: Thay match[1] bằng match[2]
                const match = step.getAttribute('onmouseenter').match(/'([^']+)'/);
                if (match && match[2]) showPassage(match[2]); 
            }
        } else {
            step.style.display = 'none';
        }
    });

    document.getElementById(`btnPrev${partSuffix}`).disabled = (currentStep === 0);
    document.getElementById(`btnNext${partSuffix}`).disabled = (currentStep === steps.length - 1);
}
// --- 2. Sửa lỗi đóng ngoặc và phạm vi biến ID ---
function scrollToQuestion(id) {
    document.getElementById('navPanel').classList.remove('show');
    let group = 1;
    if (toeicData.part6.some(p => p.questions.some(q => q.id == id))) group = 2;
    if (toeicData.part7.some(p => p.questions.some(q => q.id == id))) group = 3;
    
    switchTab(group); 

    const activeGroup = document.getElementById(`q-group-${group}`);
    const steps = group === 1 ? activeGroup.querySelectorAll('.q-row') : activeGroup.querySelectorAll('.questions-block');
    
    steps.forEach((step, index) => {
        if (step.id === `q-row-${id}` || step.querySelector(`#q-row-${id}`)) {
            currentStep = index; 
        }
    });

    updatePagination(); 

    // Đảm bảo khối setTimeout này nằm TRONG hàm scrollToQuestion
    setTimeout(() => {
        let el = document.getElementById(`q-row-${id}`);
        if (el) {
            el.scrollIntoView({behavior: "smooth", block: "center"});
            el.style.transition = "background 0.5s";
            el.style.background = "#fff9c4";
            setTimeout(() => el.style.background = "transparent", 1000);

            let parentBlock = el.closest('.questions-block');
            if(parentBlock) {
                let mouseEvent = new MouseEvent('mouseenter');
                parentBlock.dispatchEvent(mouseEvent);
            }
        }
    }, 150);
}

        let s = testDuration % 60;
        display.textContent = `${m < 10 ? '0'+m : m}:${s < 10 ? '0'+s : s}`;

const HISTORY_KEY = "snapenglish_test7_2026_history";
let isReviewingMode = false;
function openHistoryModal() {
    // Lấy dữ liệu lịch sử từ localStorage
    let history = JSON.parse(localStorage.getItem(HISTORY_KEY)) || [];
    let historyListEl = document.getElementById('historyList');
    let listHtml = '';

    // Kiểm tra nếu chưa có lịch sử
    if (history.length === 0) {
        listHtml = '<p style="text-align: center; color: #888; margin-top: 20px;">Chưa có dữ liệu làm bài.</p>';
    } else {
        // Duyệt qua từng bài làm và tạo giao diện hiển thị
        history.forEach(attempt => {
            listHtml += `
                <div class="history-item">
                    <div class="history-info">
                        <span class="history-date">📅 ${attempt.date} - ⏰ ${attempt.time}</span>
                        <span class="history-score">🏆 Điểm: ${attempt.score}/${attempt.total} (${attempt.toeicScore} điểm)</span>
                    </div>
                    <div style="display: flex; gap: 5px;">
                        <button class="btn-review" onclick="restoreAttempt(${attempt.id})">Xem lại</button>
                        <button class="btn-delete-history" onclick="deleteAttempt(${attempt.id})" title="Xóa bài làm này">✖</button>
                    </div>
                </div>
            `;
        });
    }
    
    // Đổ dữ liệu vào danh sách và hiển thị bảng Modal
    historyListEl.innerHTML = listHtml;
    document.getElementById('historyOverlay').style.display = 'flex';
}

function closeHistoryModal() {
    // Ẩn bảng Modal lịch sử
    document.getElementById('historyOverlay').style.display = 'none';
}
function saveAttemptToHistory(score, total, userAnswersMap) {
    let history = JSON.parse(localStorage.getItem(HISTORY_KEY)) || [];
    let now = new Date();
    
    let attempt = {
        id: Date.now(),
        date: now.toLocaleDateString('vi-VN'),
        time: now.toLocaleTimeString('vi-VN', { hour: '2-digit', minute: '2-digit' }),
        score: score,
        total: total,
        toeicScore: calculateToeicReading(score, total),
        answers: userAnswersMap // Lưu lại toàn bộ ABCD đã chọn
    };
    
    history.unshift(attempt); // Đẩy bài mới nhất lên đầu
    localStorage.setItem(HISTORY_KEY, JSON.stringify(history));

    // ĐỒNG BỘ LÊN CLOUD NGAY SAU KHI LƯU
    if (window.syncHistoryToCloud) {
        window.syncHistoryToCloud(history);
    }
}

function deleteAttempt(attemptId) {
    showCustomConfirm("Bạn có chắc chắn muốn xóa bài làm này khỏi lịch sử không?", function() {
        let history = JSON.parse(localStorage.getItem(HISTORY_KEY)) || [];
        history = history.filter(h => h.id !== attemptId); 
        localStorage.setItem(HISTORY_KEY, JSON.stringify(history)); 
        
        // ĐỒNG BỘ THAO TÁC XÓA LÊN CLOUD
        if (window.syncHistoryToCloud) {
            window.syncHistoryToCloud(history);
        }
        
        openHistoryModal(); 
    });
}
function restoreAttempt(attemptId) {
    let history = JSON.parse(localStorage.getItem(HISTORY_KEY)) || [];
    let attempt = history.find(h => h.id === attemptId);
    
    if(!attempt) return;

    isReviewingMode = true; // Bật cờ hiệu "Đang xem lại"
    document.getElementById('historyOverlay').style.display = 'none';
    document.getElementById('setupOverlay').style.display = 'none';
    
    document.querySelectorAll('input[type="radio"]').forEach(el => {
        el.disabled = false;
        el.checked = false; 
    });
    
    // Tự động đánh dấu lại các Radio button đáp án học viên đã chọn trong lịch sử
    for (let qId in attempt.answers) {
        let val = attempt.answers[qId];
        if (val) {
            let radio = document.querySelector(`input[name="q${qId}"][value="${val}"]`);
            if (radio) radio.checked = true;
        }
    }
    
   // Đổi chữ nút Nộp bài thành "Đang xem lại" cho ngầu
    let btnSubmit = document.querySelector('.btn-submit');
    if(btnSubmit) {
        btnSubmit.innerText = "ĐANG XEM LẠI";
        btnSubmit.style.background = "#888";
        btnSubmit.style.boxShadow = "none";
    }

    // --- THÊM 2 DÒNG NÀY VÀO TRƯỚC DẤU NGOẶC NHỌN ĐÓNG HÀM ---
    isSubmitted = false; 
    executeSubmit();
}

`;

    if (!isReviewingMode) {
        saveAttemptToHistory(score, totalQuestions, userAnswersMap);
        document.getElementById('resultMessage').innerHTML = `Bạn đã làm đúng <b style="color: var(--primary); font-size: 22px;">${score}/${totalQuestions}</b> câu.<br>Điểm TOEIC Reading quy đổi: <b>${calculateToeicReading(score, totalQuestions)}</b>`;
        document.getElementById('resultOverlay').style.display = 'flex';
        if(window.luuDiemTOEICReadingFull) {
            // Tính toán thời gian thực tế đã làm (số phút ban đầu trừ đi số phút còn lại)
            let minutesAssigned = (currentMode === 'mock') ? 75 : parseInt(document.getElementById('timeInput').value);
            if(isNaN(minutesAssigned) || minutesAssigned < 1) minutesAssigned = 75;
            let timeTaken = Math.round(minutesAssigned - (testDuration / 60));
            
            // Truyền thêm timeTaken vào hàm
            window.luuDiemTOEICReadingFull(score, totalQuestions, "ETS 2026 - Test 7", timeTaken);
        }
    } else {
        // Đưa khối else này ra đúng vị trí của nó
        let toastMsg = document.createElement("div");
        toastMsg.innerText = "Đã khôi phục bài làm ngày cũ!";
        toastMsg.style.cssText = "position:fixed; top:20px; right:20px; background:var(--primary); color:white; padding:15px 20px; border-radius:12px; font-weight:bold; font-family:'Quicksand',sans-serif; z-index:99999; box-shadow:0 10px 30px rgba(0,0,0,0.2);";
        document.body.appendChild(toastMsg);
        setTimeout(() => toastMsg.remove(), 3000);
    }
}
        

function calculateToeicReading(raw, total) {
    if (raw === 0) return 5;
    let percent = raw / total;
    let score = Math.round((percent * 495) / 5) * 5; 
    return score > 495 ? 495 : (score < 5 ? 5 : score);
}

// --- HIGHLIGHT SYSTEM ---
const mainContainer = document.getElementById("mainContainer");
const menu = document.getElementById("ctxMenu");
let targetElement = null;
let selectedRange = null;

// Chuyển menu sang fixed để bám đúng con trỏ chuột dù đang cuộn ở cột nào
menu.style.position = "fixed";

mainContainer.addEventListener("contextmenu", (e) => {
    e.preventDefault();
    targetElement = null; selectedRange = null;
    
    // Nếu click chuột phải vào vùng đã highlight -> Hiện nút Xóa
    if (e.target.classList.contains("highlight")) {
        targetElement = e.target;
        showMenu(e.clientX, e.clientY, "remove");
        return;
    }
    
    // Nếu bôi đen văn bản mới -> Hiện nút Thêm
    let sel = window.getSelection();
    if (sel.toString().trim().length > 0 && mainContainer.contains(sel.anchorNode)) {
        selectedRange = sel.getRangeAt(0);
        showMenu(e.clientX, e.clientY, "add");
    } else {
        menu.style.display = "none";
    }
});

// Bấm chuột trái ra ngoài thì ẩn menu
document.addEventListener("click", (e) => { 
    if (menu && !menu.contains(e.target)) menu.style.display = "none"; 
});

function showMenu(x, y, mode) {
    menu.style.display = "block";
    let mw = menu.offsetWidth;
    let mh = menu.offsetHeight;
    
    // Chống tràn màn hình
    let left = x + mw > window.innerWidth ? window.innerWidth - mw - 10 : x;
    let top = y + mh > window.innerHeight ? window.innerHeight - mh - 10 : y;
    
    menu.style.left = left + "px";
    menu.style.top = top + "px";
    
    menu.children[0].style.display = (mode === "add") ? "block" : "none";
    menu.children[1].style.display = (mode === "remove") ? "block" : "none";
}

function doHighlight() {
    if (selectedRange) {
        try { 
            let span = document.createElement("span");
            span.className = "highlight";
            selectedRange.surroundContents(span); 
        } catch(e) {
            showCustomAlert("Lưu ý: Chỉ có thể bôi vàng các cụm từ nằm trong cùng một đoạn văn. Vui lòng không bôi đen vắt ngang qua các khoảng ngắt dòng nhé!");
        }
        window.getSelection().removeAllRanges();
    }
    menu.style.display = "none";
}

function removeHighlight() {
    if (targetElement) {
        let text = document.createTextNode(targetElement.textContent);
        targetElement.parentNode.replaceChild(text, targetElement);
        mainContainer.normalize(); // Nối lại văn bản liền mạch
    }
    menu.style.display = "none";
}
</script>

    // 1. HÀM ĐẨY LỊCH SỬ LÊN CLOUD
    window.syncHistoryToCloud = async function(historyData) {
        if (!window.currentUserUid) return;
        try {
            // Đặt tên document phân biệt theo Test và User
            let docId = window.currentUserUid + "_history_test7_2026";
            await setDoc(doc(db, "user_test_histories", docId), {
                savedHistory: historyData,
                lastUpdated: Date.now()

        } catch (error) {
            console.error("Lỗi đồng bộ lịch sử: ", error);
        }
    }

    // 2. LẮNG NGHE ĐĂNG NHẬP VÀ KÉO LỊCH SỬ VỀ
    onAuthStateChanged(auth, (user) => {

            // SỬ DỤNG ONSNAPSHOT ĐỂ ĐỒNG BỘ REAL-TIME
            onSnapshot(docRef, (docSnap) => {
                if (docSnap.exists()) {
                    let cloudData = docSnap.data().savedHistory;
                    if (cloudData) {
                        // Nạp vào máy tính/điện thoại hiện tại
                        localStorage.setItem(localKey, JSON.stringify(cloudData));

    });

    window.luuDiemTOEICReadingFull = async function(correct, total, testTitle, timeTaken) {
        if (!window.currentUserUid) return;
        
        let scoreConverted = Math.round(((correct / total) * 495) / 5) * 5;
        let timestamp = Date.now();

        let now = new Date();
        let hours = now.getHours().toString().padStart(2, '0');
        let minutes = now.getMinutes().toString().padStart(2, '0');
        let timeString = hours + ":" + minutes; 

        try {
            await setDoc(doc(db, "user_toeic_scores", docId), {
                email: window.currentUserEmail,
                skill: "Reading",
                testName: testTitle,
                partName: "Full",
                correctQ: correct,
                totalQ: total,
                score: scoreConverted,
                date: now.toLocaleDateString('vi-VN'),
                time: timeString, 
                Time: timeString, 
                timeTaken: timeTaken,
                timestamp: timestamp
            });
            showInGameToast("☁️ Đã nộp điểm lên bảng vàng SnapEnglish!");
        } catch (e) {
            console.error(e);
        }
    }
