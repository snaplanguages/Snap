<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grammar| SnapEnglish</title>
    <link rel="icon" type="image/png" href="ảnh.png">
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #f05248;      /* Màu hồng cam đào đo đỏ chủ đạo */
            --primary-hover: #d93d33;
            --primary-light: #fff0ed;      /* Màu nền thẻ / badge nhạt */
            --bg-color: #fff8f6;           /* Màu nền trang web */
            --text-dark: #2d3436;
            --text-muted: #888888;
            --card-bg: #ffffff;
            --border-color: #ffe3de;
        }

        * {
            box-sizing: border-box;
        }

        body { 
            font-family: 'Quicksand', sans-serif; 
            margin: 0;
            padding-top: 80px; /* Chừa khoảng trống cho navbar cố định */
            background-color: var(--bg-color);
            min-height: 100vh;
            color: var(--text-dark);
        }

        /* NAVBAR CỐ ĐỊNH */
        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 70px;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 5%;
            box-shadow: 0 2px 15px rgba(240, 82, 72, 0.08);
            border-bottom: 1px solid var(--border-color);
            z-index: 1000;
        }

        .nav-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .brand-btn {
            background: linear-gradient(135deg, #ff6b6b, #f05248);
            color: #ffffff;
            padding: 8px 18px;
            border-radius: 20px;
            font-weight: 700;
            font-size: 15px;
            display: flex;
            align-items: center;
            gap: 6px;
            box-shadow: 0 4px 10px rgba(240, 82, 72, 0.25);
            text-decoration: none;
        }

        .nav-divider {
            color: var(--primary-color);
            font-weight: 600;
            font-size: 16px;
        }

        .nav-title {
            font-weight: 700;
            font-size: 16px;
            color: var(--text-dark);
        }

        /* SEARCH BAR TRÊN NAVBAR */
        .search-wrapper {
            position: relative;
            width: 320px;
        }

        #searchInput {
            width: 100%;
            padding: 10px 40px 10px 18px;
            border-radius: 25px;
            border: 1px solid var(--border-color);
            background: var(--primary-light);
            font-family: 'Quicksand', sans-serif;
            font-size: 14px;
            color: var(--text-dark);
            outline: none;
            transition: all 0.3s ease;
        }

        #searchInput:focus {
            border-color: var(--primary-color);
            background: #ffffff;
            box-shadow: 0 0 10px rgba(240, 82, 72, 0.15);
        }

        .search-icon {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 15px;
            pointer-events: none;
            opacity: 0.7;
        }

        /* DANH SÁCH BÀI HỌC */
        .main-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        .container { 
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 20px;
        }

        /* CARD BÀI HỌC */
        a.unit-card { 
            background: var(--card-bg);
            border-radius: 16px;
            padding: 18px 20px;
            border-top: 5px solid var(--primary-color);
            box-shadow: 0 4px 15px rgba(0,0,0,0.03);
            transition: all 0.25s ease;
            text-decoration: none;
            color: inherit;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-height: 120px;
            border-left: 1px solid #f0f0f0;
            border-right: 1px solid #f0f0f0;
            border-bottom: 1px solid #f0f0f0;
        }
        
        a.unit-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 25px rgba(240, 82, 72, 0.15);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .unit-badge {
            background-color: var(--primary-light);
            color: var(--primary-color);
            font-size: 11px;
            font-weight: 800;
            padding: 4px 10px;
            border-radius: 12px;
            letter-spacing: 0.5px;
        }

        .unit-title {
            font-size: 17px;
            font-weight: 700;
            color: var(--text-dark);
            margin: 4px 0 16px 0;
            line-height: 1.4;
        }

        .card-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 12px;
            border-top: 1px stroke #f5f5f5;
        }

        .unit-time {
            font-size: 12px;
            color: var(--text-muted);
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .arrow-btn {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background-color: var(--primary-light);
            color: var(--primary-color);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            transition: all 0.2s ease;
        }

        a.unit-card:hover .arrow-btn {
            background-color: var(--primary-color);
            color: #ffffff;
        }

        .hidden { display: none !important; }
        
        #noResults {
            text-align: center;
            grid-column: 1 / -1;
            color: var(--text-muted);
            font-style: italic;
            display: none;
            padding: 40px 0;
        }

        @media (max-width: 600px) {
            .navbar {
                padding: 0 15px;
            }
            .search-wrapper {
                width: 160px;
            }
            .nav-title {
                display: none;
            }
        }
    </style>
</head>
<body>

    <!-- NAVBAR CỐ ĐỊNH -->
    <header class="navbar">
        <div class="nav-left">
            <a href="#" class="brand-btn">⚡ SnapEnglish</a>
            <span class="nav-divider">/</span>
            <span class="nav-title">Grammar Collection</span>
        </div>
        <div class="search-wrapper">
            <input type="text" id="searchInput" placeholder="Tìm bài học (VD: 12, Bẫy, Thì)...">
            <span class="search-icon">🔍</span>
        </div>
    </header>

    <!-- CONTENT -->
    <main class="main-container">
        <div class="container" id="unitContainer">
            <div id="noResults">Không tìm thấy bài học nào phù hợp nè... 🥺</div>
        </div>
    </main>

    <script>
        const titles = [
            "Cấu trúc câu trong tiếng Anh", "Danh từ & Đại từ", "Mạo từ", "Lượng từ", 
            "Thì hiện tại đơn", "Thì hiện tại tiếp diễn", "Thì hiện tại hoàn thành", 
            "Thì quá khứ đơn", "Thì quá khứ tiếp diễn", "Thì quá khứ hoàn thành", 
            "Thì tương lai đơn", "Tương lai gần", "Sự hòa hợp giữa chủ ngữ và động từ", 
            "Trật tự của tính từ trước danh từ", "Giới từ", "Danh động từ và động từ nguyên mẫu", 
            "Cấu tạo từ", "Liên từ", "Động từ khuyết thiếu", "Câu tường thuật (Phần 1)", 
            "Câu tường thuật (Phần 2)", "Câu bị động", "Câu điều kiện", "Mệnh đề quan hệ", 
            "Các dạng so sánh", "So sánh kép", "Giả định thức", "Những câu thường gặp trong giao tiếp", 
            "Tình huống giao tiếp & cách đáp lại", "Thành ngữ, tục ngữ trong giao tiếp"
        ];

        const links = [
            "unit-1-grammar.html", "unit-2-grammar.html", "unit-3-grammar.html", "unit-4-grammar.html", "unit-5-grammar.html", 
            "unit-6-grammar.html", "unit-7-grammar.html", "unit-8-grammar.html", "unit-9-grammar.html", "unit-10-grammar.html", 
            "unit-11-grammar.html", "unit-12-grammar.html", "unit-13-grammar.html", "unit-14-grammar.html", "unit-15-grammar.html", 
            "unit-16-grammar.html", "unit-17-grammar.html", "unit-18-grammar.html", "unit-19-grammar.html", "unit-20-grammar.html", 
            "unit-21-grammar.html", "unit-22-grammar.html", "unit-23-grammar.html", "unit-24-grammar.html", "unit-25-grammar.html", 
            "unit-26-grammar.html", "unit-27-grammar.html", "unit-28-grammar.html", "unit-29-grammar.html", "unit-30-grammar.html"
        ];

        const container = document.getElementById('unitContainer');
        const searchInput = document.getElementById('searchInput');
        const noResultsMsg = document.getElementById('noResults');

        function renderUnits() {
            titles.forEach((title, index) => {
                const unitNum = index + 1;
                const formattedNum = unitNum < 10 ? `0${unitNum}` : unitNum;
                const link = links[index] || "#"; 

                const card = document.createElement('a');
                card.className = 'unit-card';
                card.setAttribute('data-search', `unit ${unitNum} ${title.toLowerCase()}`);
                
                if (link !== "#") {
                    card.href = link;
                } else {
                    card.href = "javascript:void(0)";
                    card.onclick = function() {
                        alert("🚧 Bài này chưa được gắn link (cần sửa trong code)!");
                    };
                }

                card.innerHTML = `
                    <div>
                        <div class="card-header">
                            <span class="unit-badge">UNIT ${formattedNum}</span>
                        </div>
                        <h3 class="unit-title">${title}</h3>
                    </div>
                    <div class="card-footer">
                        <span class="unit-time">⏱ ~15-20 phút học</span>
                        <div class="arrow-btn">➔</div>
                    </div>
                `;
                container.insertBefore(card, noResultsMsg);
            });
        }

        // Tìm kiếm realtime
        searchInput.addEventListener('keyup', function() {
            const filter = this.value.toLowerCase().trim();
            const cards = document.querySelectorAll('.unit-card');
            let hasResult = false;

            cards.forEach(card => {
                const searchText = card.getAttribute('data-search');
                if (searchText.includes(filter)) {
                    card.classList.remove('hidden');
                    hasResult = true;
                } else {
                    card.classList.add('hidden');
                }
            });

            noResultsMsg.style.display = hasResult ? 'none' : 'block';
        });

        renderUnits();
    </script>
</body>
</html>
