    "a": "accessible",
    "exp": {
      "correct": "<div style='line-height: 1.6;'><p><strong>a. Phân tích thành phần câu (S-V-C):</strong> Câu được cấu tạo theo dạng S - To Be - Complement:</p><ul><li><strong>Subject (S):</strong> <code>The city's harbor</code> (Cảng biển của thành phố).</li><li><strong>Verb (V):</strong> <code>is</code> (Động từ to be).</li><li><strong>Complement (C):</strong> <code>______ to container ships...</code> (Cụm tính từ + giới từ).</li></ul><p><strong>b. Xác định từ loại:</strong> Sau động từ <i>is</i> cần một <strong>Tính từ (Adjective)</strong> làm bổ ngữ. Cả 4 đáp án đều là tính từ nên ta xét đến cấu trúc đi kèm giới từ <i>to</i> phía sau.</p><p><strong>c. Lý do chọn đáp án:</strong> Ta có cấu trúc cố định <code>be accessible to + N</code> mang nghĩa \"có thể tiếp cận / cho phép cái gì ra vào / sử dụng\". Chọn <span style='color: #2e7d32; font-weight: bold;'>accessible</span> hoàn toàn phù hợp nghĩa: Bến cảng có thể tiếp nhận các tàu container và tàu đánh cá đủ mọi kích cỡ.</p></div>",
      "wrong": "<ul style='line-height: 1.6; list-style-type: none; padding-left: 0;'><li><strong style='color: #c62828;'>❌ (B) formal:</strong> Tính từ mang nghĩa \"trang trọng, chính thức\" (thường đi với <i>formal meeting, formal dress</i>), không đi với cấu trúc <i>formal to ships</i>.</li><li><strong style='color: #c62828;'>❌ (C) reasonable:</strong> Tính từ mang nghĩa \"hợp lý, vừa phải\" (thường đi với <i>reasonable price, reasonable decision</i>), không phù hợp nghĩa.</li><li><strong style='color: #c62828;'>❌ (D) likely:</strong> Bẫy cực lớn! Dù có cấu trúc <i>be likely to</i>, nhưng sau <i>to</i> của <i>likely</i> bắt buộc phải là <strong>Động từ nguyên mẫu (V-bare)</strong>. Trong khi ở đây theo sau <i>to</i> là cụm danh từ <i>container ships</i> (giới từ <i>to</i> + Noun).</li></ul>",
      "grammar": "<div style='line-height: 1.6;'><p><strong>⭐ Cấu trúc Tính từ đi kèm Giới từ (Adjective + Preposition)</strong></p><p>Cần phân biệt rõ hai cấu trúc có <i>to</i> thường gặp trong TOEIC để tránh mắc bẫy:</p><ul><li><code>be accessible to + Noun / Noun Phrase</code>: Có thể tiếp cận / truy cập / ra vào đối với cái gì.</li><li><code>be likely to + V-bare</code>: Có khả năng làm gì (Sau <i>to</i> là Động từ nguyên mẫu).</li></ul><p style='margin-top: 10px;'><strong style='color: #e65100;'>🎯 Mẹo làm bài trong 3 giây:</strong> Thấy <code>is ______ to + Danh từ</code> -> Loại ngay <i>likely</i> (vì <i>likely to</i> đi với V-bare). Chọn <span style='color: #2e7d32; font-weight: bold;'>ACCESSIBLE</span> (accessible to + Noun).</p></div>",
      "vocab": "<ul style='line-height: 1.6;'><li><strong style='color: #0288d1;'>be accessible to sth/sb</strong> (adj.phr): có thể tiếp cận/cho phép đối tượng nào ra vào.</li><li><strong style='color: #0288d1;'>harbor</strong> (n): bến cảng (= <i>port</i>).</li><li><strong style='color: #0288d1;'>vessel</strong> (n): tàu thuyền lớn (<i>fishing vessel</i>: tàu đánh cá, <i>container ship</i>: tàu chở container).</li><li><strong style='color: #0288d1;'>of all sizes</strong> (prep.phr): thuộc mọi kích cỡ.</li></ul>",
      "trans": "<div style='line-height: 1.6; padding: 8px; background-color: #f9f9f9; border-left: 4px solid #0288d1;'><p style='margin: 0 0 8px 0;'><strong>Dịch nghĩa gốc:</strong> Cảng của thành phố thì có thể tiếp cận được đối với tàu chở container và tàu đánh cá đủ mọi kích cỡ.</p><p style='margin: 0; font-style: italic; color: #555;'><strong>Dịch tự nhiên:</strong> Bến cảng của thành phố có khả năng tiếp nhận các loại tàu container và tàu đánh cá thuộc mọi kích cỡ.</p></div>"

      wrong: "<ul style='line-height: 1.6; list-style-type: none; padding-left: 0;'><li><strong style='color: #c62828;'>❌ (A) controlling:</strong> Dạng V-ing, không thể đặt vào giữa cụm <i>have ... V3</i> để bổ nghĩa cho động từ. Sai từ loại.</li><li><strong style='color: #c62828;'>❌ (C) beneath:</strong> Giới từ mang nghĩa \"bên dưới\", không đứng ở vị trí bổ nghĩa cho động từ.</li><li><strong style='color: #c62828;'>❌ (D) even though:</strong> Liên từ mang nghĩa \"mặc dù\" (chỉ sự đối lập), theo sau phải là một mệnh đề hoàn chỉnh (S + V). Trong câu sau khoảng trống chỉ có động từ <i>increased</i> nên sai ngữ pháp và sai cả logic nghĩa.</li></ul>",
      grammar: "<div style='line-height: 1.6;'><p><strong>⭐ Vị trí của Trạng từ trong thì Hiện tại hoàn thành</strong></p><p>Trong đề thi TOEIC, vị trí giữa trợ động từ <code>have/has</code> và động từ <code>V3/V-ed</code> là vị trí đặc trưng của trạng từ bổ nghĩa: <code>have/has + Adv + V3</code>.</p><table border='1' style='width: 100%; border-collapse: collapse; border-color: #e0e0e0; margin-top: 10px; font-size: 14px;'><thead style='background-color: #f5f5f5; text-align: left;'><tr><th style='padding: 8px;'>Trạng từ thường gặp</th><th style='padding: 8px;'>Ý nghĩa</th><th style='padding: 8px;'>Ví dụ ngữ cảnh TOEIC</th></tr></thead><tbody><tr><td style='padding: 8px;'><strong>consequently</strong></td><td style='padding: 8px;'>Do đó, vì vậy</td><td style='padding: 8px;'><i>sales have <strong>consequently</strong> increased</i></td></tr><tr><td style='padding: 8px;'><strong>significantly / steadily</strong></td><td style='padding: 8px;'>Đáng kể / Đều đặn</td><td style='padding: 8px;'><i>has <strong>significantly</strong> improved</i></td></tr><tr><td style='padding: 8px;'><strong>recently / already</strong></td><td style='padding: 8px;'>Gần đây / Đã... rồi</td><td style='padding: 8px;'><i>has <strong>recently</strong> opened</i></td></tr></tbody></table><p style='margin-top: 10px;'><strong style='color: #e65100;'>🎯 Bẫy ETS của câu này:</strong> ETS kiểm tra đồng thời từ loại (Cần Adverb) và quan hệ logic (Cause &rarr; Effect chứ không phải Contrast hay Time).</p></div>",
      vocab: "<ul style='line-height: 1.6;'><li><strong style='color: #0288d1;'>consequently</strong> (adv): do đó, kết quả là (= <i>therefore, thus, as a result, accordingly</i>).</li><li><strong style='color: #0288d1;'>expand a market</strong> (v.phr): mở rộng thị trường (= <i>expand business, expand production</i>).</li><li><strong style='color: #0288d1;'>sales increase</strong> (v.phr): doanh số bán hàng tăng (= <i>sales rise, sales improve</i>).</li></ul>",

    exp: {

      vocab: "<ul style='line-height: 1.6;'><li><strong style='color: #0288d1;'>not ... until ...</strong> (phr): không ... cho tới khi ...</li><li><strong style='color: #0288d1;'>customer survey</strong> (n.phr): khảo sát ý kiến khách hàng.</li><li><strong style='color: #0288d1;'>analyze results</strong> (v.phr): phân tích kết quả (= <i>analyze data, analyze reports</i>).</li></ul>",
      trans: "<div style='line-height: 1.6; padding: 8px; background-color: #f9f9f9; border-left: 4px solid #0288d1;'><p style='margin: 0 0 8px 0;'><strong>Dịch nghĩa gốc:</strong> Dobson Ice Cream sẽ không giới thiệu bất kỳ hương vị mới nào cho đến khi các kết quả khảo sát khách hàng được phân tích.</p><p style='margin: 0; font-style: italic; color: #555;'><strong>Dịch tự nhiên:</strong> Hãng kem Dobson Ice Cream sẽ không ra mắt thêm hương vị mới nào cho tới khi phân tích xong kết quả khảo sát khách hàng.</p></div>"

    a: "has been equipped",

      correct: "<div style='line-height: 1.6;'><p><strong>a. Phân tích thành phần câu (S-V-C):</strong></p><ul><li><strong>Subject (S):</strong> <code>The renovated company gym</code> (Phòng tập thể hình của công ty vừa được cải tạo).</li><li><strong>Verb (V):</strong> Cần động từ chính chia thì cho câu.</li><li><strong>Complement / Cụm giới từ:</strong> <code>with free weights and exercise machines</code>.</li></ul><p><strong>b. Xác định thể của động từ:</strong> Chủ ngữ <i>'The gym'</i> (vật) không thể tự thực hiện hành động \"trang bị\" mà phải \"được trang bị\" &rArr; Bắt buộc chia ở <strong>Thể bị động (Passive Voice)</strong>. Ngay sau khoảng trống có giới từ <i>with</i> tạo thành collocation cố định <code>be equipped with</code>.</p><p><strong>c. Lý do chọn đáp án:</strong> Chọn <span style='color: #2e7d32; font-weight: bold;'>has been equipped</span> (Hiện tại hoàn thành dạng bị động) vừa phù hợp với chủ ngữ số ít vừa đúng ngữ pháp bị động.</p></div>",

      grammar: "<div style='line-height: 1.6;'><p><strong>⭐ Cấu trúc Bị động & Collocation \"be equipped with\"</strong></p><p>Khi chủ ngữ là vật thể/công trình (gym, office, building, equipment), bạn nên ưu tiên cân nhắc dạng Bị động. Cấu trúc đi kèm phổ biến: <code>be equipped with + Noun</code> (được trang bị cái gì).</p><p style='margin-top: 10px;'><strong style='color: #e65100;'>🎯 Mẹo làm bài trong 3 giây:</strong> Nhìn thấy phía sau có cụm <i>with + danh từ chỉ thiết bị</i> và chủ ngữ là vật &rArr; Chọn ngay đáp án có dạng Bị động (<code>be + V3/V-ed</code>).</p></div>",

thuật quốc tế, nơi tôi đã làm việc trong 5 năm qua, cũng đã mang lại cho tôi nhiều kinh nghiệm quản lý các đội ngũ, lịch trình và ngân sách. Mặc dù tôi yêu thích công việc mình đang làm, nhưng tôi nhận thấy rõ ràng rằng <span class=\"clue-highlight-3\">mình cần động lực từ một sứ mệnh mạnh mẽ</span>. Mục tiêu của quý công ty trong việc tạo ra các dự án nhà ở bền vững là điều mà tôi ủng hộ nhiệt thành và rất hân hạnh được tham gia.</p>\n            <p style=\"margin-bottom: 14px;\">Thông qua các hoạt động công việc và tình nguyện, tôi đã dành nhiều tháng ở nước ngoài tại nhiều quốc gia khắp châu Á và Trung Đông. Điều này có vẻ đặc biệt phù hợp để đề cập đến, vì tôi cảm thấy thoải mái khi lãnh đạo <span class=\"clue-highlight-4\">các đội ngũ đa dạng về địa lý và văn hóa</span>.</p>\n            <p style=\"margin-bottom: 14px;\">Cảm ơn ông đã dành thời gian quan tâm, và tôi rất mong sớm được trao đổi với ông.</p>\n            <p style=\"margin-bottom: 0;\">Trân trọng,<br><strong>Maria McFarland</strong></p>\n        </div>\n    </div>",

our facility's specific needs and assist you in arranging your space and choosing the most suitable furniture. Recently, for example, we were chosen by a major producer of biofuels to provide expert help in <span class=\"clue-highlight-2\">changing the layout of a research laboratory</span> to maximize available space. As a result of this project, this client has realized substantial savings by reducing energy usage in the lab.</p>\n        <p style=\"margin-bottom: 0;\">Please visit the \"Lab Planning\" section of this Web site if you are interested in learning more about building or renovating a laboratory facility. There, you can <span class=\"clue-highlight-3\">fill out an interest form</span> to contact one of our consultants about your next project.</p>\n    </div>\n</div>",

            <h2 style="margin-top: 0; color: #1e293b; font-size: 1.2rem; font-weight: 700; margin-bottom: 10px;">Gorman Unveils Newest Smartphone Model</h2>
            <p style="margin-bottom: 15px;"><strong>LONDON (20 April)</strong>—Gorman Mobile <span class="clue-highlight-1">unveiled its newest smartphone</span> to an eager reception at the annual Technobrit Conference. The Pro Phone 4, which includes 512 GB of storage, a 7-inch screen display, and an optional stylus pen, will hit the shelves on 11 June. Unlike its predecessor—the Pro Phone 3—it features a larger screen, an ultrawide camera lens, and 8K-resolution filming capability. <span class="clue-highlight-4">— [1] —</span>. The £999 starting price is £100 more than that of the previous model. Add-ons, such as the stylus pen, protective case, and <span class="clue-highlight-2">wireless headphones, cost an additional £39, £59, and £79, respectively</span>.</p>
            <p style="margin-bottom: 15px;">Gorman Product Manager Ian Hill doesn\'t believe the price increase will dissuade customers. — [2] —.</p>
            <p style="margin-bottom: 15px;">\"The Pro Phone 4 is a game changer in terms of its picture quality and sleek design,\" said Hill. \"Improvements were based on direct customer feedback, which cited the poor camera functionality as the biggest drawback of prior models. Our clients spoke, and we listened and adapted accordingly.\" — [3] —.</p>
            <p style="margin-bottom: 0;">One <span class="clue-highlight-3">similarity that the Pro Phone 4 has with previous models is the charger</span>. Going against the trend of competing wireless companies, Gorman is instead focusing on convenience.<br>\"We want to afford our customers the ability to reuse elements of the other Gorman devices they\'ve already purchased,\" said Hill. \"Why add to the overload of cables already in circulation?\" — [4] —.</p>

            <h2 style="margin-top: 0; color: #1e293b; font-size: 1.2rem; font-weight: 700; margin-bottom: 10px;">Gorman Ra Mắt Mẫu Điện Thoại Thông Minh Mới Nhất</h2>
            <p style="margin-bottom: 15px;"><strong>LUÂN ĐÔN (20 tháng 4)</strong>—Gorman Mobile đã <span class="clue-highlight-1">ra mắt mẫu điện thoại thông minh mới nhất của mình</span> trước sự đón nhận nồng nhiệt tại Hội nghị Technobrit thường niên. Pro Phone 4, bao gồm dung lượng lưu trữ 512 GB, màn hình 7 inch và bút cảm ứng tùy chọn, sẽ chính thức lên kệ vào ngày 11 tháng 6. Không giống như phiên bản tiền nhiệm—Pro Phone 3—nó sở hữu màn hình lớn hơn, ống kính máy ảnh góc siêu rộng và khả năng quay phim độ phân giải 8K. <span class="clue-highlight-4">— [1] —</span>. Mức giá khởi điểm 999 bảng Anh cao hơn 100 bảng so với mẫu máy trước đó. Các phụ kiện đi kèm, như bút cảm ứng, ốp lưng bảo vệ và <span class="clue-highlight-2">tai nghe không dây, có giá lần lượt là 39 bảng, 59 bảng và 79 bảng</span>.</p>
            <p style="margin-bottom: 15px;">Giám đốc Sản phẩm của Gorman, Ian Hill, không tin rằng việc tăng giá sẽ làm chùn bước khách hàng. — [2] —.</p>

ential material. <span class=\"clue-highlight-3\">I can update the security settings so that you do not have to reset the password on a regular basis</span>.\n\nI want to make sure that you understand the risk involved with a lower level of security. Anyone who gains access to your voice-mail account can do more than simply listen to your messages. They would be able to delete messages, change your greeting, or change your password so that you would lose access to your own voice mail (at least until someone here at IT could override the password change). <span class=\"clue-highlight-4\">If you still feel comfortable with that level of risk, let me know</span>, and I will change the settings so that your password never expires.\n\nSam Arnold\n\nTech Support Associate\n        </div>\n    </div>\n</div>",

 công nghệ</td></tr>\n            <tr><td class=\"label\">Tóm tắt:</td><td>Cài đặt bảo mật hộp thư thoại (Voice-mail)</td></tr>\n            <tr><td class=\"label\">Kỹ thuật viên phụ trách:</td><td>Arnold, Sam</td></tr>\n            <tr><td class=\"label\">Mã trạm làm việc:</td><td>HYS31</td></tr>\n        </table>\n        <strong>Mô tả chi tiết:</strong>\n        <div class=\"desc-box\">\n            Liệu có thể loại bỏ các lớp bảo mật mới trên hộp thư thoại của tôi trong <span class=\"clue-highlight-1\">hệ thống điện thoại mới</span> không? Tôi <span class=\"clue-highlight-3\">thực sự không muốn dùng mật khẩu</span>, và tôi <span class=\"clue-highlight-3\">chắc chắn không muốn phải đổi mật khẩu mỗi tháng</span>. Tôi không cần mức độ bảo mật cao vì công việc của tôi không phải là tài liệu bảo mật. Nếu ai đó khác truy cập được vào tin nhắn của tôi, điều đó cũng chẳng gây hại gì nhiều.\n        </div>\n    </div>\n\n    <!-- BẢN DỊCH VĂN BẢN 2: EMAIL -->\n    <div class=\"doc-box\">\n        <div class=\"email-header\">\n            <div class=\"email-field\"><div class=\"email-label\">Tới:</div><div class=\"email-val\">Gina Xi</div></div>\n            <div class=\"email-field\"><div class=\"email-label\">Từ:</div><div class=\"email-val\">Sam Arnold</div></div>\n            <div class=\"email-field\"><div class=\"email-label\">Ngày:</div><div class=\"email-val\">Thứ Năm, ngày 10 tháng 4</div></div>\n            <div class=\"email-field\"><div class=\"email-label\">Chủ đề:</div><div class=\"email-val\">Yêu cầu hỗ trợ kỹ thuật <span class=\"clue-highlight-2\">7549</span></div></div>\n        </div>\n        <div class=\"email-body\">\nXin chào cô Xi,\n\nEmail này liên quan đến phiếu yêu cầu công việc 7549 của cô về hệ thống điện thoại mới. Tôi rất vui được hỗ trợ cô về vấn đề này. Tôi hiểu rằng cô cảm thấy không cần mức bảo mật cao cho cài đặt hộp thư thoại, nhưng <span class=\"clue-highlight-3\">hệ thống mới bắt buộc cô phải có mật khẩu</span> để nghe thư thoại. Tuy nhiên, chính sách công ty cho phép tôi thay đổi cài đặt cho các nhân viên không làm việc với tài liệu bảo mật. <span class=\"clue-highlight-3\">Tôi có thể cập nhật các cài đặt bảo mật để cô không phải đặt lại mật khẩu thường xuyên</span>.\n\nTôi muốn đảm bảo rằng cô hiểu rõ rủi ro liên quan đến mức bảo mật thấp hơn. Bất kỳ ai truy cập được vào tài khoản hộp thư thoại của cô đều có thể làm nhiều việc hơn là chỉ nghe tin nhắn. Họ sẽ có thể xóa tin nhắn, thay đổi lời chào của cô, hoặc đổi mật khẩu để cô mất quyền truy cập vào hộp thư thoại của chính mình (ít nhất là cho đến khi nhân viên IT ở đây có thể ghi đè thay đổi mật khẩu đó). <span class=\"clue-highlight-4\">Nếu cô vẫn cảm thấy thoải mái với mức độ rủi ro đó, hãy cho tôi biết</span>, và tôi sẽ thay đổi cài đặt để mật khẩu của cô không bao giờ hết hạn.\n\nSam Arnold\n\nChuyên viên Hỗ trợ Kỹ thuật\n        </div>\n    </div>\n</div>",

an style='color: #8e44ad; font-weight: bold;'>🔄 Paraphrase từ ETS:</span><br>\n- <span style='color: #d35400;'>the new phone system</span> &rarr; <span style='color: #16a085;'>recently changed its phone system</span>.<br><br>\n\n<strong>Đáp án:</strong> ✅ (C) It has recently changed its phone system.\n</div>"

            <h3 style="margin-top: 0; margin-bottom: 5px; color: #0f172a; font-size: 1.1rem;">Review of Titan Adventure: Neptune's Voyage</h3>
            <p style="font-size: 0.85rem; color: #64748b; margin-bottom: 15px;">By Leo Weber, April 1</p>
            <p style="margin-bottom: 15px;">This new installment of Titan Adventure will surprise and delight both new players and old aficionados long familiar with the series. <span class="clue-highlight-2">Though open-world formats have been widespread in recent years, Neptune's Voyage brings something new to the format.</span> <span class="clue-highlight-4">By stripping down instructional guides, the game gives users the opportunity to discover new areas and devices.</span> In Neptune's Voyage, you wake up as Thetis, a dolphin that is tasked with rescuing Neptune from an underwater cave. Users then climb, run, ride, sail, and fly through the world of the game, encountering new towns, ruins, and other creatures along the way. Some of these creatures will be familiar to longtime fans, but there is plenty of novelty as well. <span class="clue-highlight-3">This newest version also corrects the green and blue image rendering</span> that was sometimes a problem in earlier installments of Titan Adventure.</p>
            <p style="margin-bottom: 0;">Neptune's Voyage <span class="clue-highlight-5">launches May 5</span> on Rimerko Clutch and FS5. It is available in English, Korean, Japanese, French, and Spanish.</p>
        </div>
    </div>`,

eight: 1.6; color: #1e293b; background: white; }\n    \n    /* Job Ad Styling */\n    .job-ad { line-height: 1.5; font-size: 0.9rem; }\n    .job-ad h3 { margin: 0 0 4px 0; font-size: 1.05rem; color: #0f172a; text-align: center; }\n    .job-ad .date-posted { font-style: italic; color: #64748b; font-size: 0.85rem; margin-bottom: 15px; text-align: center; border-bottom: 1px solid #e2e8f0; padding-bottom: 8px; }\n    .job-section-title { font-weight: 700; color: #0f172a; margin-top: 12px; margin-bottom: 6px; font-size: 0.95rem; text-transform: uppercase; letter-spacing: 0.5px; }\n    .job-ad ul { margin: 6px 0 12px 20px; padding: 0; }\n    .job-ad li { margin-bottom: 6px; }\n    </style>\n\n<div class=\"toeic-triple-container\">\n    <!-- Document 1: Broadcast Schedule -->\n    <div class=\"doc-box\">\n        <div class=\"doc-title\">Wonder Ridge Radio Broadcast Schedule, Monday–Friday</div>\n        <table class=\"schedule-table\">\n            <thead>\n                <tr>\n                    <th style=\"width: 25%;\">6 A.M.–Noon</th>\n                    <th style=\"width: 25%;\">Noon–4 P.M.</th>\n                    <th style=\"width: 25%;\">4 P.M.–7 P.M.</th>\n                    <th style=\"width: 25%;\">7 P.M.–10 P.M.</th>\n                </tr>\n            </thead>\n            <tbody>\n                <tr>\n                    <td>\n                        <span class=\"show-title\">COFFEE BREAK</span>\n                        <span class=\"show-desc\">Local news and <span class=\"clue-highlight-5\">interviews with community members</span></span>\n                    </td>\n                    <td>\n                        <span class=\"show-title\">AFTERNOON JAZZ</span>\n                        <span class=\"show-desc\">Music from traditional jazz to jazz fusion</span>\n                    </td>\n                    <td>\n                        <span class=\"show-title\">FOLK FRENZY</span>\n                        <span class=\"show-desc\"><span class=\"clue-highlight-3\">Folk music from around the world</span></span>\n                    </td>\n                    <td>\n                        <span class=\"show-title\">JOSIE'S JOINT</span>\n                        <span class=\"show-desc\">Modern sounds selected by <span class=\"clue-highlight-1\">our station's own music director</span></span>\n                    </td>\n                </tr>\n                <tr>\n                    <td><span class=\"show-host\">Host:<br>Felice Finney</span></td>\n                    <td><span class=\"show-host\">Host:<br>Malachi Mzee</span></td>\n                    <td><span class=\"show-host\">Host:<br>Penny Ariza</span></td>\n                    <td><span class=\"show-host\">Host:<br>Josie Jones</span></td>\n                </tr>\n            </tbody>\n        </table>\n    </div>\n\n    <!-- Document 2: E-mail -->\n    <div class=\"doc-box\" style=\"padding: 0;\">\n        <div class=\"email-container\">\n            <div class=\"email-header-bar\">*E-mail*</div>\n            <div class=\"email-fields\">\n                <div class=\"email-label\">To:</div>\n                <div class=\"email-val-box\">feedback@wonderridgeradio.org</div>\n                <div class=\"email-label\">From:</div>\n                <div class=\"email-val-box\">pfabre@sendmail.net</div>\n                <div class=\"email-label\">Subject:</div>\n                <div class=\"email-val-box\">My new radio station!</div>\n                <div class=\"email-label\">Date:</div>\n                <div class=\"email-val-box\">October 22</div>\n            </div>\n            <div class=\"email-body\">\n                <p style=\"margin-top: 0;\">To the folks at Wonder Ridge Radio:</p>\n                <p>As I was driving last week, I got tired of listening to sports talk and turned the dial. Suddenly, my car was filled with a song that I hadn't heard in many years. It was <span class=\"clue-highlight-3\">traditional music from France</span>, where my grandmother was born. She used to play that song when I was a child. I never expected to hear it on the radio here in Wonder Ridge. <span class=\"clue-highlight-2\">Thanks for this experience and for all your great programs.</span></p>\n                <p style=\"margin-bottom: 0;\"><span class=\"clue-highlight-2\">Your new fan,</span><br><br>Pierre Fabre</p>\n            </div>\n        </div>\n    </div>\n\n    <!-- Document 3: Job Opening -->\n    <div class=\"doc-box job-ad\">\n        <h3>Wonder Ridge Radio Job Opening: Programming Assistant</h3>\n        <div class=\"date-posted\">Posted November 2</div>\n        \n        <div class=\"job-section-title\">Job Description</div>\n        <p style=\"margin-top: 4px;\">The programming assistant reports to the director of programming and supports the radio station by performing a variety of research and communication functions. This role is an entry-level, part-time position.</p>\n        \n        <div class=\"job-section-title\">Responsibilities</div>\n        <ul>\n            <li><span class=\"clue-highlight-5\">Conducting background research on interviewees</span></li>\n            <li><span class=\"clue-highlight-5\">Keeping up-to-date on news and news makers in order to suggest potential topics and guests for on-air interviews</span></li>\n            <li><span class=\"clue-highlight-4\">Updating the station's Web site</span> and program host biography pages</li>
            <li><span class=\"clue-highlight-4\">Using scheduling software</span> to update the broadcast schedule</li>\n            <li><span class=\"clue-highlight-4\">Communicating with listeners, especially via e-mail</span> and social media</li>\n        </ul>\n        \n        <p style=\"margin-bottom: 0;\">To apply, e-mail a résumé and cover letter to hiring@wonderridgeradio.org.</p>\n    </div>\n</div>`,
  "translation": `<div class=\"translation-header\">Bản dịch & Phân tích Đa văn bản (Triple Passage)</div>\n<div class=\"toeic-triple-container\">\n    <!-- Văn bản 1 -->\n    <div class=\"doc-box\">\n        <div class=\"doc-title\">Lịch Phát sóng Đài Radio Wonder Ridge, Thứ Hai–Thứ Sáu</div>\n        <table class=\"schedule-table\">\n            <thead>\n                <tr>\n                    <th style=\"width: 25%;\">6 A.M.–12 P.M.</th>\n                    <th style=\"width: 25%;\">12 P.M.–4 P.M.</th>\n                    <th style=\"width: 25%;\">4 P.M.–7 P.M.</th>\n                    <th style=\"width: 25%;\">7 P.M.–10 P.M.</th>\n                </tr>\n            </thead>\n            <tbody>\n                <tr>\n                    <td>\n                        <span class=\"show-title\">GIỜ NGHỈ GIẢI LAO (COFFEE BREAK)</span>\n                        <span class=\"show-desc\">Tin tức địa phương và <span class=\"clue-highlight-5\">các buổi phỏng vấn với thành viên cộng đồng</span></span>\n                    </td>\n                    <td>\n                        <span class=\"show-title\">NHẠC JAZZ CHIỀU (AFTERNOON JAZZ)</span>\n                        <span class=\"show-desc\">Âm nhạc từ jazz truyền thống đến jazz kết hợp</span>\n                    </td>\n                    <td>\n                        <span class=\"show-title\">SÔI ĐỘNG NHẠC DÂN GIAN (FOLK FRENZY)</span>\n                        <span class=\"show-desc\"><span class=\"clue-highlight-3\">Nhạc dân gian từ khắp nơi trên thế giới</span></span>\n                    </td>\n                    <td>\n                        <span class=\"show-title\">GÓC CỦA JOSIE (JOSIE'S JOINT)</span>\n                        <span class=\"show-desc\">Giai điệu hiện đại do chính <span class=\"clue-highlight-1\">giám đốc âm nhạc của đài</span> lựa chọn</span>\n                    </td>\n                </tr>\n                <tr>\n                    <td><span class=\"show-host\">Người dẫn:<br>Felice Finney</span></td>\n                    <td><span class=\"show-host\">Người dẫn:<br>Malachi Mzee</span></td>\n                    <td><span class=\"show-host\">Người dẫn:<br>Penny Ariza</span></td>\n                    <td><span class=\"show-host\">Người dẫn:<br>Josie Jones</span></td>\n                </tr>\n            </tbody>\n        </table>\n    </div>\n\n    <!-- Văn bản 2 -->\n    <div class=\"doc-box\" style=\"padding: 0;\">\n        <div class=\"email-container\">\n            <div class=\"email-header-bar\">*Thư điện tử*</div>\n            <div class=\"email-fields\">\n                <div class=\"email-label\">Tới:</div>\n                <div class=\"email-val-box\">feedback@wonderridgeradio.org</div>\n                <div class=\"email-label\">Từ:</div>\n                <div class=\"email-val-box\">pfabre@sendmail.net</div>\n                <div class=\"email-label\">Chủ đề:</div>\n                <div class=\"email-val-box\">Đài phát thanh mới của tôi!</div>\n                <div class=\"email-label\">Ngày:</div>\n                <div class=\"email-val-box\">22 tháng 10</div>\n            </div>\n            <div class=\"email-body\">\n                <p style=\"margin-top: 0;\">Gửi các bạn tại Đài Radio Wonder Ridge:</p>\n                <p>Khi tôi đang lái xe vào tuần trước, tôi thấy chán nghe trò chuyện thể thao nên đã vặn đài chuyển kênh. Đột nhiên, chiếc xe của tôi tràn ngập một bài hát mà tôi đã nhiều năm không được nghe. Đó là <span class=\"clue-highlight-3\">bản nhạc truyền thống của Pháp</span>, nơi bà ngoại tôi sinh ra. Bà thường mở bài hát đó khi tôi còn là một đứa trẻ. Tôi chưa bao giờ mong đợi sẽ nghe thấy nó trên đài phát thanh ở Wonder Ridge này. <span class=\"clue-highlight-2\">Cảm ơn các bạn vì trải nghiệm này và vì tất cả các chương trình tuyệt vời của các bạn.</span></p>\n                <p style=\"margin-bottom: 0;\"><span class=\"clue-highlight-2\">Thính giả mới của các bạn,</span><br><br>Pierre Fabre</p>\n            </div>\n        </div>\n    </div>\n\n    <!-- Văn bản 3 -->\n    <div class=\"doc-box job-ad\">\n        <h3>Wonder Ridge Radio Thông Báo Tuyển Dụng: Trợ Lý Chương Trình</h3>\n        <div class=\"date-posted\">Đăng ngày 2 tháng 11</div>\n        \n        <div class=\"job-section-title\">Mô Tả Công Việc</div>\n        <p style=\"margin-top: 4px;\">Trợ lý chương trình báo cáo trực tiếp cho giám đốc chương trình và hỗ trợ đài phát thanh bằng cách thực hiện nhiều nhiệm vụ nghiên cứu và truyền thông. Đây là vị trí bán thời gian, cấp độ khởi đầu (entry-level).</p>\n        \n        <div class=\"job-section-title\">Trách Nhiệm Công Việc</div>\n        <ul>\n            <li><span class=\"clue-highlight-5\">Thực hiện nghiên cứu thông tin nền về những người được phỏng vấn</span></li>\n            <li><span class=\"clue-highlight-5\">Cập nhật tin tức và các nhân vật tạo tin tức để đề xuất các chủ đề và khách mời tiềm năng cho các cuộc phỏng vấn phát sóng</span></li>\n            <li><span class=\"clue-highlight-4\">Cập nhật trang Web của đài</span> và các trang tiểu sử của người dẫn chương trình</li>\n            <li><span class=\"clue-highlight-4\">Sử dụng phần mềm lập lịch</span> để cập nhật lịch phát sóng</li>\n            <li><span class=\"clue-highlight-4\">Giao tiếp với thính giả, đặc biệt qua e-mail</span> và mạng xã hội</li>\n        </ul>\n        \n        <p style=\"margin-bottom: 0;\">Để ứng tuyển, hãy gửi email kèm sơ yếu lý lịch (CV) và thư xin việc đến hiring@wonderridgeradio.org.</p>\n    </div>\n</div>`,

function applyEvidenceColors() {
    const pastelColors = [
        { bg: '#ffadad', text: '#5a1c1c' }, // Đỏ pastel
        { bg: '#ffd6a5', text: '#663d14' }, // Cam pastel
        { bg: '#caffbf', text: '#1f4d1f' }, // Xanh lá pastel
        { bg: '#9bf6ff', text: '#16565c' }, // Xanh dương pastel
        { bg: '#a0c4ff', text: '#1c3666' }, // Xanh biển pastel
        { bg: '#bdb2ff', text: '#352666' }, // Tím pastel
        { bg: '#ffc6ff', text: '#661a66' }, // Hồng pastel
        { bg: '#e2f0cb', text: '#3e5222' }  // Xanh rêu pastel
    ];

    let colorIndex = 0;
    let usedColors = {}; 

    let evElements = document.querySelectorAll('.ev-box');

    evElements.forEach(el => {
        let idString = el.id;
        if (!idString) return;
        let match = idString.match(/ev-(\d+)/);
        if (match) {
            let qId = match[1];
            if (!usedColors[qId]) {
                usedColors[qId] = pastelColors[colorIndex % pastelColors.length];
                colorIndex++;
            }
            el.style.backgroundColor = usedColors[qId].bg;
            el.style.color = usedColors[qId].text;
            el.style.padding = "2px 5px";
            el.style.borderRadius = "6px";
            el.style.fontWeight = "600";
            el.style.transition = "all 0.3s ease";
        }
    });
}

function formatAnswer(options, answer) {
    if(!options) return answer;
    if(Array.isArray(options)) {
        // Bỏ qua mảng object của Part 7 vì đáp án đã là A,B,C,D sẵn
        if (typeof options[0] === 'object') return answer; 
        let labels = ["A", "B", "C", "D"];
        let idx = options.indexOf(answer);
        return idx !== -1 ? labels[idx] : answer;
    }
    return answer; 
}

function createTOEICQuestion(qObj) {
    if(!qObj || !qObj.id) return "";
    
    // 1. Lấy nội dung câu hỏi
    let text = qObj.q || qObj.text || qObj.qEng || "";
    
    // XỬ LÝ LẶP SỐ: Nếu nội dung câu hỏi bắt đầu bằng "151. ", "152. "... thì xóa nó đi
    // vì đã có số thứ tự hiển thị trong vòng tròn màu hồng bên trái rồi.
    if (typeof text === 'string') {
        text = text.replace(/^\d+\.\s*/, ""); // Xóa số và dấu chấm ở đầu (vd: "131. " -> "")
        text = text.replace(/(\([^)]+\))/g, '<span class="vi-trans">$1</span>');
    }
    
    let opts = qObj.options;
    let optsHTML = "";
    let inputStyle = `margin-right:12px; transform:scale(1.3); cursor:pointer;`;
    let labelStyle = `display:block; margin:10px 0; padding:12px 18px; border-radius:var(--radius); cursor:pointer; border:2px solid #f1f5f9; background:#f8fafc; transition:all 0.2s ease; font-size:17px;`;

    if (Array.isArray(opts)) {
        let labels = ["A", "B", "C", "D"];
        opts.forEach((opt, i) => {
            // Sửa lỗi undefined cho các Option Part 6, 7 (dùng .text thay vì .en)
            let optText = typeof opt === 'object' ? (opt.text || opt.en || "") : opt;
            
            // XỬ LÝ LẶP NHÃN A. A.: Xóa "A. ", "B. " có sẵn trong dữ liệu
            if (typeof optText === 'string') {
                optText = optText.replace(/^[A-D]\.\s*/, ""); 
                optText = optText.replace(/(\([^)]+\))/g, '<span class="vi-trans">$1</span>');
            }

            let optValue = typeof opt === 'object' ? (opt.key || labels[i]) : labels[i];
            
            optsHTML += `
                <label class="mc-option" style="${labelStyle}" onmouseover="this.style.background='var(--exp-bg)'" onmouseout="this.style.background='transparent'">
                    <input type="radio" name="q${qObj.id}" value="${optValue}" style="${inputStyle}" onclick="checkNav(${qObj.id})"> 
                    <b>${labels[i]}.</b> ${optText}
                </label>`;
        });
    } else {
        // Trường hợp options là Object (thường cho Part 5)
        for (let key in opts) {
            let optText = opts[key];
            if (typeof optText === 'string') {
                optText = optText.replace(/^[A-D]\.\s*/, ""); 
                optText = optText.replace(/(\([^)]+\))/g, '<span class="vi-trans">$1</span>');
            }
            optsHTML += `
                <label class="mc-option" style="${labelStyle}" onmouseover="this.style.background='var(--exp-bg)'" onmouseout="this.style.background='transparent'">
                    <input type="radio" name="q${qObj.id}" value="${key}" style="${inputStyle}" onclick="checkNav(${qObj.id})"> 
                    <b>${key}.</b> ${optText}
                </label>`;
        }
    }

    return `<div class="q-row" id="q-row-${qObj.id}" style="margin-bottom:30px; display:flex; background:white; padding:25px; border-radius:var(--radius); box-shadow:var(--shadow); border:1px solid var(--border);">

                    </div>
                    <div id="exp-${qObj.id}" class="exp-container"></div>

}

function createQuestionsBlock(passageObj) {
    let html = `<div class="questions-block" style="margin-bottom: 40px; background: transparent; padding: 0;" onmouseenter="showPassage('${passageObj.passageId}')">`;
    html += `<div style="color:var(--primary-dark); font-weight:bold; margin-bottom:15px; border-bottom: 2px solid var(--border); padding-bottom:10px; font-size: 18px;">📝 Questions for Passage: ${passageObj.passageId}</div>`;
    
    let validQuestions = passageObj.questions.filter(q => q && q.id);
    
    validQuestions.forEach(q => {
        html += createTOEICQuestion(q);
        allQuestionIds.push(q.id);
        
        // --- BẮT ĐẦU PHẦN SỬA LỖI ---
        let correctAns = q.a || q.correct; 
        
        // Nếu là Part 6/7 (options là mảng các object)
        if (!correctAns && Array.isArray(q.options)) {
            // Tìm vị trí của option có thuộc tính "correct" là true
            const foundIdx = q.options.findIndex(o => typeof o === 'object' && o.correct === true);
            if (foundIdx !== -1) {
                const labels = ["A", "B", "C", "D"];
                correctAns = labels[foundIdx]; // Chuyển index 0,1,2,3 thành A,B,C,D
            }
        }
        
        answerKey[q.id] = correctAns; // Lưu nhãn A,B,C,D vào bộ nhớ chấm điểm
        // --- KẾT THÚC PHẦN SỬA LỖI ---

        explanations[q.id] = { exp: q.explanation || "" };
    });
    html += `</div>`;
    return html;
}

function switchTab(n) {
    const mainContainer = document.getElementById('mainContainer');
    document.querySelectorAll('.tab-btn').forEach((b, i) => { b.classList.toggle('active', i + 1 === n); });
    document.querySelectorAll('.question-group').forEach((q, i) => { q.style.display = (i + 1 === n) ? 'block' : 'none'; });
    
    // Quản lý chế độ Part 5 hoặc 6-7
    if (n === 1) {
        mainContainer.classList.add('part5-mode');
    } else {
        mainContainer.classList.remove('part5-mode');
    }

    // Reset pagination khi đổi Part
    currentStep = 0;
    updatePagination();
    
    document.querySelector('.pane-right').scrollTop = 0;

function showPassage(passageId) {
    document.querySelectorAll('.passage-text-content').forEach(p => p.style.display = 'none');
    
    // Hiện bài tiếng Anh
    let pEng = document.getElementById(`passage-${passageId}`);

    let pVie = document.getElementById(`vie-passage-${passageId}`);

let currentStep = 0;

function updatePagination() {
    const activeGroup = document.querySelector('.question-group[style*="display: block"]');
    if (!activeGroup) return;
    const partSuffix = activeGroup.id.split('-').pop();
    const isPart5 = activeGroup.id === 'q-group-1';

    if (isSubmitted) {
        activeGroup.querySelectorAll('.questions-block, .q-row').forEach(el => el.style.display = isPart5 ? 'flex' : 'block');
        document.getElementById(`paginationBox${partSuffix}`).style.display = 'none';
        return;
    }

    const steps = isPart5 ? activeGroup.querySelectorAll('.q-row') : activeGroup.querySelectorAll('.questions-block');
    steps.forEach((step, index) => {
        if (index === currentStep) {
            step.style.display = isPart5 ? 'flex' : 'block';
            if (!isPart5) {
                // SỬA TẠI ĐÂY: Thay match[1] bằng match[2]
                const match = step.getAttribute('onmouseenter').match(/'([^']+)'/);
                if (match && match[2]) showPassage(match[2]); 
            }
        } else {
            step.style.display = 'none';
        }
    });

    document.getElementById(`btnPrev${partSuffix}`).disabled = (currentStep === 0);
    document.getElementById(`btnNext${partSuffix}`).disabled = (currentStep === steps.length - 1);
}

function scrollToQuestion(id) {
    document.getElementById('navPanel').classList.remove('show');
    let group = 1;
    if (toeicData.part6.some(p => p.questions.some(q => q.id == id))) group = 2;
    if (toeicData.part7.some(p => p.questions.some(q => q.id == id))) group = 3;
    
    switchTab(group); 

    const activeGroup = document.getElementById(`q-group-${group}`);
    const steps = group === 1 ? activeGroup.querySelectorAll('.q-row') : activeGroup.querySelectorAll('.questions-block');
    
    steps.forEach((step, index) => {
        if (step.id === `q-row-${id}` || step.querySelector(`#q-row-${id}`)) {
            currentStep = index; 
        }
    });

    updatePagination(); 

    // Đảm bảo khối setTimeout này nằm TRONG hàm scrollToQuestion
    setTimeout(() => {
        let el = document.getElementById(`q-row-${id}`);
        if (el) {
            el.scrollIntoView({behavior: "smooth", block: "center"});
            el.style.transition = "background 0.5s";
            el.style.background = "#fff9c4";
            setTimeout(() => el.style.background = "transparent", 1000);

            let parentBlock = el.closest('.questions-block');
            if(parentBlock) {

                parentBlock.dispatchEvent(mouseEvent);
            }

const HISTORY_KEY = "snapenglish_test1_2023_history";
let isReviewingMode = false;
function openHistoryModal() {

    let history = JSON.parse(localStorage.getItem(HISTORY_KEY)) || [];

function saveAttemptToHistory(score, total, userAnswersMap) {
    let history = JSON.parse(localStorage.getItem(HISTORY_KEY)) || [];
    let now = new Date();
    
    let attempt = {
        id: Date.now(),
        date: now.toLocaleDateString('vi-VN'),
        time: now.toLocaleTimeString('vi-VN', { hour: '2-digit', minute: '2-digit' }),
        score: score,
        total: total,
        toeicScore: calculateToeicReading(score, total),
        answers: userAnswersMap // Lưu lại toàn bộ ABCD đã chọn
    };
    
    history.unshift(attempt); // Đẩy bài mới nhất lên đầu
    localStorage.setItem(HISTORY_KEY, JSON.stringify(history));

    // ĐỒNG BỘ LÊN CLOUD NGAY SAU KHI LƯU
    if (window.syncHistoryToCloud) {
        window.syncHistoryToCloud(history);
    }
}

function deleteAttempt(attemptId) {
    showCustomConfirm("Bạn có chắc chắn muốn xóa bài làm này khỏi lịch sử không?", function() {
        let history = JSON.parse(localStorage.getItem(HISTORY_KEY)) || [];
        history = history.filter(h => h.id !== attemptId); 
        localStorage.setItem(HISTORY_KEY, JSON.stringify(history)); 
        
        // ĐỒNG BỘ THAO TÁC XÓA LÊN CLOUD
        if (window.syncHistoryToCloud) {
            window.syncHistoryToCloud(history);
        }
        
        openHistoryModal(); 
    });
}
function restoreAttempt(attemptId) {
    let history = JSON.parse(localStorage.getItem(HISTORY_KEY)) || [];
    let attempt = history.find(h => h.id === attemptId);
    
    if(!attempt) return;

    isReviewingMode = true; // Bật cờ hiệu "Đang xem lại"
    document.getElementById('historyOverlay').style.display = 'none';
    document.getElementById('setupOverlay').style.display = 'none';
    
    document.querySelectorAll('input[type="radio"]').forEach(el => {

        el.checked = false; 
    });
    
    // Tự động đánh dấu lại các Radio button đáp án học viên đã chọn trong lịch sử
    for (let qId in attempt.answers) {
        let val = attempt.answers[qId];
        if (val) {
            let radio = document.querySelector(`input[name="q${qId}"][value="${val}"]`);
            if (radio) radio.checked = true;
        }

   // Đổi chữ nút Nộp bài thành "Đang xem lại" cho ngầu

    isSubmitted = false; 
    executeSubmit();
}

        document.getElementById('resultOverlay').style.display = 'flex';
        if(window.luuDiemTOEICReadingFull) {

            let minutesAssigned = (currentMode === 'mock') ? 75 : parseInt(document.getElementById('timeInput').value);
            if(isNaN(minutesAssigned) || minutesAssigned < 1) minutesAssigned = 75;
            let timeTaken = Math.round(minutesAssigned - (testDuration / 60));
            
            // Truyền thêm timeTaken vào hàm
            window.luuDiemTOEICReadingFull(score, totalQuestions, "ETS 2023 - Test 1", timeTaken);

        document.body.appendChild(toastMsg);
        setTimeout(() => toastMsg.remove(), 3000);
    }
}
        

function calculateToeicReading(raw, total) {
    if (raw === 0) return 5;
    let percent = raw / total;
    let score = Math.round((percent * 495) / 5) * 5; 
    return score > 495 ? 495 : (score < 5 ? 5 : score);
}

const mainContainer = document.getElementById("mainContainer");
const menu = document.getElementById("ctxMenu");
let targetElement = null;
let selectedRange = null;

// Chuyển menu sang fixed để bám đúng con trỏ chuột dù đang cuộn ở cột nào
menu.style.position = "fixed";

mainContainer.addEventListener("contextmenu", (e) => {
    e.preventDefault();
    targetElement = null; selectedRange = null;
    
    // Nếu click chuột phải vào vùng đã highlight -> Hiện nút Xóa
    if (e.target.classList.contains("highlight")) {
        targetElement = e.target;
        showMenu(e.clientX, e.clientY, "remove");
        return;
    }
    
    // Nếu bôi đen văn bản mới -> Hiện nút Thêm
    let sel = window.getSelection();
    if (sel.toString().trim().length > 0 && mainContainer.contains(sel.anchorNode)) {
        selectedRange = sel.getRangeAt(0);
        showMenu(e.clientX, e.clientY, "add");
    } else {
        menu.style.display = "none";
    }
});

// Bấm chuột trái ra ngoài thì ẩn menu
document.addEventListener("click", (e) => { 
    if (menu && !menu.contains(e.target)) menu.style.display = "none"; 
});

function showMenu(x, y, mode) {
    menu.style.display = "block";
    let mw = menu.offsetWidth;
    let mh = menu.offsetHeight;
    
    // Chống tràn màn hình
    let left = x + mw > window.innerWidth ? window.innerWidth - mw - 10 : x;
    let top = y + mh > window.innerHeight ? window.innerHeight - mh - 10 : y;
    
    menu.style.left = left + "px";
    menu.style.top = top + "px";
    
    menu.children[0].style.display = (mode === "add") ? "block" : "none";
    menu.children[1].style.display = (mode === "remove") ? "block" : "none";
}

function doHighlight() {
    if (selectedRange) {
        try { 
            let span = document.createElement("span");
            span.className = "highlight";
            selectedRange.surroundContents(span); 
        } catch(e) {
            showCustomAlert("Lưu ý: Chỉ có thể bôi vàng các cụm từ nằm trong cùng một đoạn văn. Vui lòng không bôi đen vắt ngang qua các khoảng ngắt dòng nhé!");
        }
        window.getSelection().removeAllRanges();
    }
    menu.style.display = "none";
}

function removeHighlight() {
    if (targetElement) {
        let text = document.createTextNode(targetElement.textContent);
        targetElement.parentNode.replaceChild(text, targetElement);
        mainContainer.normalize(); // Nối lại văn bản liền mạch
    }
    menu.style.display = "none";
}

        }
    }

    // 2. LẮNG NGHE ĐĂNG NHẬP VÀ KÉO LỊCH SỬ VỀ
    onAuthStateChanged(auth, (user) => {
        if (user) {
            window.currentUserUid = user.uid;
            window.currentUserEmail = user.email;
            
            // Tự động nhận diện ID file hiện tại (2018 hay 2019)
            let is2023 = document.title.includes("2023");
            let docSuffix = is2023 ? "_history_test1_2023" : "_history_test1_2023";
            let localKey = is2023 ? "snapenglish_test1_2023_history" : "snapenglish_test1_2023_history";
            
            let docId = user.uid + docSuffix;
            const docRef = doc(db, "user_test_histories", docId);
            
            // SỬ DỤNG ONSNAPSHOT ĐỂ ĐỒNG BỘ REAL-TIME
            onSnapshot(docRef, (docSnap) => {
                if (docSnap.exists()) {
                    let cloudData = docSnap.data().savedHistory;
                    if (cloudData) {
                        // Nạp vào máy tính/điện thoại hiện tại
                        localStorage.setItem(localKey, JSON.stringify(cloudData));
                        
                        // Tự động làm mới bảng lịch sử nếu người dùng đang mở nó
                        let historyModal = document.getElementById('historyOverlay');
                        if (historyModal && historyModal.style.display === 'flex') {
                            openHistoryModal();
                        }
                    }
                }
            }, (error) => {
                console.error("Lỗi đồng bộ Realtime: ", error);
            });

        } else {
            showInGameToast("⚠️ Chưa đăng nhập! Lịch sử và Điểm sẽ không được đồng bộ.");
        }
    });

    window.luuDiemTOEICReadingFull = async function(correct, total, testTitle, timeTaken) {
        if (!window.currentUserUid) return;
        
        let scoreConverted = Math.round(((correct / total) * 495) / 5) * 5;
        let timestamp = Date.now();
        let docId = window.currentUserUid + "_toeic_" + timestamp;

        let now = new Date();
        let hours = now.getHours().toString().padStart(2, '0');
        let minutes = now.getMinutes().toString().padStart(2, '0');
        let timeString = hours + ":" + minutes; 

        try {
            await setDoc(doc(db, "user_toeic_scores", docId), {
                email: window.currentUserEmail,
                skill: "Reading",
                testName: testTitle,
                partName: "Full",
                correctQ: correct,
                totalQ: total,
                score: scoreConverted,
                date: now.toLocaleDateString('vi-VN'),
                time: timeString, 
                Time: timeString, 
                timeTaken: timeTaken,
                timestamp: timestamp
            });
            showInGameToast("☁️ Đã nộp điểm lên bảng vàng SnapEnglish!");
        } catch (e) {
            console.error(e);
        }
    }
</script>
