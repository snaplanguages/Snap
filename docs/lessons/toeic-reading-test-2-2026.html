  id: 121,
  q: "While we typically charge $25 for missed appointments, we understand that ______ circumstances may arise.",
  options: [
    "unforeseen",
    "excessive",
    "approximate",
    "acclaimed"
  ],
  a: "unforeseen",
  exp: {
    correct: "<div style='line-height: 1.6;'><p><strong>a. Phân tích thành phần câu (S–V–O):</strong> Câu ghép gồm mệnh đề nhượng bộ chỉ sự đối lập và mệnh đề chính chứa danh ngữ làm tân ngữ:</p><ul><li><strong>Adverbial Clause of Concession (Mệnh đề nhượng bộ):</strong> <code>While we typically charge $25 for missed appointments</code> (Mặc dù chúng tôi thường tính phí $25 cho các cuộc hẹn lỡ).<ul><li><strong>Subordinator:</strong> <code>While</code> (Mặc dù).</li><li><strong>Subject (S):</strong> <code>we</code>.</li><li><strong>Verb (V):</strong> <code>typically charge</code>.</li><li><strong>Object (O):</strong> <code>$25</code> (kèm cụm giới từ lý do <i>for missed appointments</i>).</li></ul></li><li><strong>Main Clause (Mệnh đề chính):</strong> <code>we understand that...</code> (Chúng tôi hiểu rằng...). Mệnh đề bổ ngữ <i>that</i> đóng vai trò là tân ngữ, trong đó:<ul><li><strong>Subject (S):</strong> <code>unforeseen circumstances</code> (Những tình huống/hoàn cảnh không lường trước).</li><li><strong>Verb (V):</strong> <code>may arise</code> (Có thể nảy sinh / phát sinh).</li></ul></li></ul><p><strong>b. Xác định từ loại:</strong> Chỗ trống đứng ngay trước danh từ <code>circumstances</code> (tình huống, hoàn cảnh). Vị trí này yêu cầu một <strong>Tính từ (Adjective)</strong> để bổ nghĩa cho danh từ phía sau.</p><p><strong>c. Lý do chọn đáp án:</strong> Cả 4 phương án đều là tính từ, do đó câu này kiểm tra về <i>Collocation (Cụm từ cố định)</i> và <i>Ngữ nghĩa</i>. Cụm từ cố định <span style='color: #2e7d32; font-weight: bold;'>unforeseen circumstances</span> mang nghĩa 'những tình huống không lường trước được / sự cố bất ngờ', rất phổ biến trong các thông báo chính sách dịch vụ khách hàng.</p></div>",
    wrong: "<ul style='line-height: 1.6; list-style-type: none; padding-left: 0;'><li><strong style='color: #c62828;'>❌ (B) excessive:</strong> Tính từ mang nghĩa 'quá mức, thái quá' (VD: <i>excessive noise, excessive spending</i>). Không kết hợp với <i>circumstances</i> để tạo thành cụm từ tự nhiên.</li><li><strong style='color: #c62828;'>❌ (C) approximate:</strong> Tính từ mang nghĩa 'xấp xỉ, gần đúng' (VD: <i>approximate cost, approximate time</i>). Không hợp nghĩa khi đi với danh từ <i>circumstances</i>.</li><li><strong style='color: #c62828;'>❌ (D) acclaimed:</strong> Tính từ mang nghĩa 'được ca ngợi, được hoan nghênh' (VD: <i>acclaimed author, acclaimed film</i>). Không đi với danh từ chỉ hoàn cảnh/sự cố.</li></ul>",
    grammar: "<div style='line-height: 1.6;'><p><strong>⭐ Bộ Cụm Từ (Collocations) Tính Từ + Danh Từ Về Tình Huống / Sự Cố Trong TOEIC</strong></p><p>Trong văn phong thương mại, hợp đồng và chính sách khách hàng, TOEIC rất hay kiểm tra các cụm tính từ cố định đi kèm với danh từ chỉ sự việc/sự cố.</p><table border='1' style='width: 100%; border-collapse: collapse; border-color: #e0e0e0; margin-top: 10px; font-size: 14px;'><thead style='background-color: #f5f5f5; text-align: left;'><tr><th style='padding: 8px;'>Tính từ thường gặp</th><th style='padding: 8px;'>Danh từ kết hợp</th><th style='padding: 8px;'>Cụm Collocation hoàn chỉnh</th><th style='padding: 8px;'>Dịch nghĩa TOEIC</th></tr></thead><tbody><tr><td style='padding: 8px;'><span style='color: #2e7d32; font-weight: bold;'>unforeseen / unexpected</span></td><td style='padding: 8px;'>circumstances / events</td><td style='padding: 8px;'><strong>unforeseen circumstances</strong></td><td style='padding: 8px;'>Tình huống ngoài dự kiến / sự cố bất ngờ</td></tr><tr><td style='padding: 8px;'>adverse</td><td style='padding: 8px;'>weather / conditions</td><td style='padding: 8px;'>adverse weather conditions</td><td style='padding: 8px;'>Điều kiện thời tiết khắc nghiệt</td></tr><tr><td style='padding: 8px;'>unfavorable</td><td style='padding: 8px;'>market / conditions</td><td style='padding: 8px;'>unfavorable market conditions</td><td style='padding: 8px;'>Điều kiện thị trường không thuận lợi</td></tr><tr><td style='padding: 8px;'>unprecedented</td><td style='padding: 8px;'>growth / demand</td><td style='padding: 8px;'>unprecedented growth</td><td style='padding: 8px;'>Sự tăng trưởng chưa từng có</td></tr></tbody></table><p style='margin-top: 10px;'><strong style='color: #e65100;'>🎯 Mẹo làm bài trong 3 giây:</strong> Nhìn thấy danh từ <code>circumstances</code> hoặc <code>events</code>, hãy nghĩ ngay tới tính từ <span style='color: #2e7d32; font-weight: bold;'>unforeseen</span> hoặc <i>unexpected</i>.</p></div>",
    vocab: "<ul style='line-height: 1.6;'><li><strong style='color: #0288d1;'>unforeseen circumstances</strong> (n.phr): những tình huống / sự cố không lường trước được.</li><li><strong style='color: #0288d1;'>charge (someone) for something</strong> (v.phr): tính phí / thu phí ai đó về việc gì.</li><li><strong style='color: #0288d1;'>missed appointments</strong> (n.phr): các cuộc hẹn bị lỡ / bỏ qua.</li><li><strong style='color: #0288d1;'>problems / issues arise</strong> (v.phr): các vấn đề / sự cố nảy sinh, phát sinh.</li></ul>",
    trans: "<div style='line-height: 1.6; padding: 8px; background-color: #f9f9f9; border-left: 4px solid #0288d1;'><p style='margin: 0 0 8px 0;'><strong>Dịch nghĩa gốc:</strong> Mặc dù thông thường chúng tôi tính phí $25 cho các cuộc hẹn bị lỡ, nhưng chúng tôi hiểu rằng đôi khi có những tình huống KHÔNG LƯỜNG TRƯỚC ĐƯỢC có thể phát sinh.</p><p style='margin: 0; font-style: italic; color: #555;'><strong>Dịch tự nhiên:</strong> Dù quy định thường thu phí 25 USD đối với việc bỏ lỡ cuộc hẹn, chúng tôi hoàn toàn cảm thông nếu quý khách gặp phải những sự cố đột xuất ngoài dự kiến.</p></div>"
  }
},
        {
  id: 122,
  q: 'At Blu Hedge, clients receive 1 percent interest, pay no account fees, and can make unlimited ______.',
  options: [
    'transfer',
    'transfers',
    'transferred',
    'transferring'
  ],
  a: 'transfers',
  exp: {
    correct: "<div style='line-height: 1.6;'><p><strong>a. Phân tích thành phần câu (S–V–O):</strong> Đây là câu đơn có cấu trúc song song (Parallel Structure) với 1 chủ ngữ đi kèm 3 cụm động từ:</p><ul><li><strong>Subject (S):</strong> <code>clients</code> (khách hàng).</li><li><strong>Verb 1 + Object 1:</strong> <code>receive 1 percent interest</code> (nhận lãi suất 1%).</li><li><strong>Verb 2 + Object 2:</strong> <code>pay no account fees</code> (không trả phí tài khoản).</li><li><strong>Verb 3 + Object 3:</strong> <code>can make unlimited transfers</code> (có thể thực hiện chuyển khoản không giới hạn). In which:<ul><li><strong>Verb:</strong> <code>can make</code>.</li><li><strong>Adjective:</strong> <code>unlimited</code> (không giới hạn).</li><li><strong>Noun / Object:</strong> <code>transfers</code> (các giao dịch chuyển khoản).</li></ul></li></ul><p><strong>b. Xác định từ loại:</strong> Sau động từ <code>make</code> và tính từ <code>unlimited</code>, ta cần một <strong>Danh từ (Noun)</strong> làm tân ngữ. Vì <code>transfer</code> là danh từ đếm được và đi sau <code>unlimited</code> (diễn tả số lượng không giới hạn) nên danh từ phải ở dạng <strong>số nhiều</strong>.</p><p><strong>c. Lý do chọn đáp án:</strong> Đáp án <strong>transfers</strong> (danh từ số nhiều) thỏa mãn cả về từ loại, ngữ pháp lẫn ngữ nghĩa trong ngữ cảnh ngân hàng.</p></div>",
    wrong: "<ul style='line-height: 1.6; list-style-type: none; padding-left: 0;'><li><strong style='color: #c62828;'>❌ (A) transfer:</strong> Danh từ số ít / Động từ nguyên mẫu. Nếu là danh từ đếm được số ít thì bắt buộc phải có mạn từ (như <i>a transfer</i>), không thể đi trực tiếp sau <i>unlimited</i> trong ngữ cảnh này.</li><li><strong style='color: #c62828;'>❌ (C) transferred:</strong> Động từ dạng quá khứ / Phân từ hai (V-ed), không thể đóng vai trò danh từ làm tân ngữ sau <i>make unlimited</i>.</li><li><strong style='color: #c62828;'>❌ (D) transferring:</strong> Danh động từ (V-ing), không dùng sau cụm <i>make unlimited</i> trong cấu trúc này.</li></ul>",
    grammar: "<div style='line-height: 1.6;'><p><strong>⭐ Cấu Trúc Cố Định & Danh Từ Số Nhiều Đi Với 'Unlimited' Trong TOEIC</strong></p><p>Trong các thông báo quảng cáo thương mại và ngân hàng, TOEIC rất hay kiểm tra cấu trúc kết hợp danh từ đi sau các tính từ chỉ số lượng hoặc tính chất không giới hạn.</p><table border='1' style='width: 100%; border-collapse: collapse; border-color: #e0e0e0; margin-top: 10px; font-size: 14px;'><thead style='background-color: #f5f5f5; text-align: left;'><tr><th style='padding: 8px;'>Tính từ</th><th style='padding: 8px;'>Cấu trúc / Cụm từ</th><th style='padding: 8px;'>Ví dụ Collocation</th><th style='padding: 8px;'>Dịch nghĩa TOEIC</th></tr></thead><tbody><tr><td style='padding: 8px;'><span style='color: #2e7d32; font-weight: bold;'>unlimited</span></td><td style='padding: 8px;'>unlimited + N (số nhiều)</td><td style='padding: 8px;'><strong>unlimited transfers / calls / access</strong></td><td style='padding: 8px;'>Chuyển tiền / cuộc gọi / truy cập không giới hạn</td></tr><tr><td style='padding: 8px;'><span style='color: #2e7d32; font-weight: bold;'>make</span></td><td style='padding: 8px;'>make + a + N / make + Ns</td><td style='padding: 8px;'><strong>make a transfer / make transfers</strong></td><td style='padding: 8px;'>Thực hiện giao dịch chuyển tiền</td></tr><tr><td style='padding: 8px;'>parallel</td><td style='padding: 8px;'>V1, V2, and V3</td><td style='padding: 8px;'>receive..., pay..., and make...</td><td style='padding: 8px;'>Cấu trúc động từ song song</td></tr></tbody></table><p style='margin-top: 10px;'><strong style='color: #e65100;'>🎯 Mẹo làm bài trong 3 giây:</strong> Khi thấy <code>make + unlimited + ______</code>, hãy chọn ngay <strong>danh từ số nhiều</strong> (như <i>transfers, calls, revisions...</i>).</p></div>",
    vocab: "<ul style='line-height: 1.6;'><li><strong style='color: #0288d1;'>make a transfer / make transfers</strong> (v.phr): thực hiện giao dịch chuyển tiền.</li><li><strong style='color: #0288d1;'>interest rate / earn interest</strong> (n.phr / v.phr): lãi suất / nhận tiền lãi.</li><li><strong style='color: #0288d1;'>account fee / service fee</strong> (n.phr): phí tài khoản / phí dịch vụ.</li><li><strong style='color: #0288d1;'>unlimited access / transfers</strong> (n.phr): truy cập / giao dịch chuyển khoản không giới hạn.</li></ul>",
    trans: "<div style='line-height: 1.6; padding: 8px; background-color: #f9f9f9; border-left: 4px solid #0288d1;'><p style='margin: 0 0 8px 0;'><strong>Dịch nghĩa gốc:</strong> Tại Blu Hedge, khách hàng nhận 1 phần trăm tiền lãi, không trả phí tài khoản, và có thể thực hiện CÁC GIAO DỊCH CHUYỂN TIỀN không giới hạn.</p><p style='margin: 0; font-style: italic; color: #555;'><strong>Dịch tự nhiên:</strong> Tại Blu Hedge, khách hàng được hưởng lãi suất 1%, miễn phí tài khoản và có thể thực hiện giao dịch chuyển tiền không giới hạn số lần.</p></div>"
  }
},
        {
  id: 123,
  q: 'Farist Bakery, which specializes in dessert catering, is located ______ the Liverpool Convention Complex.',
  options: [
    'near',
    'without',
    'since',
    'following'
  ],
  a: 'near',
  exp: {
    correct: "<div style='line-height: 1.6;'><p><strong>a. Phân tích thành phần câu (S–V–O):</strong> Câu đơn chứa mệnh đề quan hệ không xác định (Non-defining Relative Clause) bổ nghĩa cho chủ ngữ:</p><ul><li><strong>Subject (S):</strong> <code>Farist Bakery</code> (Tiệm bánh Farist).</li><li><strong>Relative Clause (Mệnh đề quan hệ bổ nghĩa):</strong> <code>, which specializes in dessert catering,</code> (chuyên về dịch vụ tiệc tráng miệng).<ul><li><strong>Relative Pronoun:</strong> <code>which</code>.</li><li><strong>Verb (V):</strong> <code>specializes</code>.</li><li><strong>Prepositional Phrase:</strong> <code>in dessert catering</code>.</li></ul></li><li><strong>Main Verb (V):</strong> <code>is located</code> (tọa lạc / nằm ở).</li><li><strong>Complement / Prepositional Phrase:</strong> <code>near the Liverpool Convention Complex</code> (gần Khu phức hợp Hội nghị Liverpool).</li></ul><p><strong>b. Xác định từ loại:</strong> Đứng sau động từ chỉ vị trí <code>is located</code> và trước cụm danh từ chỉ địa điểm <code>the Liverpool Convention Complex</code>, chỗ trống bắt buộc phải là một <strong>Giới từ chỉ vị trí (Preposition of Place)</strong>.</p><p><strong>c. Lý do chọn đáp án:</strong> Cụm từ cố định <span style='color: #2e7d32; font-weight: bold;'>be located near + N (địa điểm)</span> mang nghĩa 'tọa lạc / nằm ở gần địa điểm nào đó'. Phương án <strong>near</strong> là giới từ duy nhất chỉ vị trí không gian phù hợp ngữ cảnh bài thi TOEIC.</p></div>",
    wrong: "<ul style='line-height: 1.6; list-style-type: none; padding-left: 0;'><li><strong style='color: #c62828;'>❌ (B) without:</strong> Giới từ mang nghĩa 'mà không có, thiếu' (VD: <i>without permission, without delay</i>). Không dùng để diễn tả vị trí địa lý.</li><li><strong style='color: #c62828;'>❌ (C) since:</strong> Giới từ/liên từ chỉ thời gian mang nghĩa 'kể từ khi' (VD: <i>since Monday, since 2022</i>) hoặc liên từ chỉ nguyên nhân ('bởi vì'). Không đi với danh từ địa điểm để chỉ vị trí.</li><li><strong style='color: #c62828;'>❌ (D) following:</strong> Giới từ chỉ thời gian / trình tự mang nghĩa 'sau khi, tiếp theo' (VD: <i>following the meeting</i>). Không dùng để diễn đạt vị trí địa lý tự nhiên.</li></ul>",
    grammar: "<div style='line-height: 1.6;'><p><strong>⭐ Bộ Cấu Trúc Đi Với 'Be Located' Chỉ Vị Trí Địa Lý Trong TOEIC</strong></p><p>Trong văn phong quảng cáo doanh nghiệp, brochure và email thương mại, TOEIC rất hay kiểm tra các giới từ đi kèm với động từ <i>is/are located</i> để chỉ địa điểm.</p><table border='1' style='width: 100%; border-collapse: collapse; border-color: #e0e0e0; margin-top: 10px; font-size: 14px;'><thead style='background-color: #f5f5f5; text-align: left;'><tr><th style='padding: 8px;'>Cấu trúc giới từ</th><th style='padding: 8px;'>Loại địa điểm đi kèm</th><th style='padding: 8px;'>Ví dụ Collocation</th><th style='padding: 8px;'>Dịch nghĩa TOEIC</th></tr></thead><tbody><tr><td style='padding: 8px;'><span style='color: #2e7d32; font-weight: bold;'>be located near</span></td><td style='padding: 8px;'>Danh từ địa điểm lân cận</td><td style='padding: 8px;'><strong>located near the station / airport</strong></td><td style='padding: 8px;'>Tọa lạc gần ga tàu / sân bay</td></tr><tr><td style='padding: 8px;'>be located in</td><td style='padding: 8px;'>Thành phố, khu vực, quốc gia</td><td style='padding: 8px;'>located in downtown / Hanoi</td><td style='padding: 8px;'>Nằm ở trung tâm / Hà Nội</td></tr><tr><td style='padding: 8px;'>be located at</td><td style='padding: 8px;'>Địa chỉ cụ thể, số nhà</td><td style='padding: 8px;'>located at 15 King Street</td><td style='padding: 8px;'>Tọa lạc tại số 15 đường King</td></tr><tr><td style='padding: 8px;'>be located within</td><td style='padding: 8px;'>Khoảng cách / phạm vi</td><td style='padding: 8px;'>located within walking distance</td><td style='padding: 8px;'>Nằm trong khoảng cách đi bộ</td></tr></tbody></table><p style='margin-top: 10px;'><strong style='color: #e65100;'>🎯 Mẹo làm bài trong 3 giây:</strong> Nhìn thấy cụm <code>is located ______ + N (địa điểm)</code>, hãy tìm ngay giới từ chỉ vị trí địa lý như <span style='color: #2e7d32; font-weight: bold;'>near</span>, <i>in</i>, <i>at</i>, hoặc <i>next to</i>.</p></div>",
    vocab: "<ul style='line-height: 1.6;'><li><strong style='color: #0288d1;'>be located near</strong> (v.phr): tọa lạc gần / nằm gần vị trí nào.</li><li><strong style='color: #0288d1;'>specialize in something</strong> (v.phr): chuyên về lĩnh vực / dịch vụ gì.</li><li><strong style='color: #0288d1;'>dessert catering</strong> (n.phr): dịch vụ cung cấp / phục vụ tiệc tráng miệng.</li><li><strong style='color: #0288d1;'>convention complex</strong> (n.phr): khu phức hợp / trung tâm hội nghị.</li></ul>",
    trans: "<div style='line-height: 1.6; padding: 8px; background-color: #f9f9f9; border-left: 4px solid #0288d1;'><p style='margin: 0 0 8px 0;'><strong>Dịch nghĩa gốc:</strong> Tiệm bánh Farist, nơi chuyên về dịch vụ tiệc tráng miệng, nằm Ở GẦN Khu phức hợp Hội nghị Liverpool.</p><p style='margin: 0; font-style: italic; color: #555;'><strong>Dịch tự nhiên:</strong> Farist Bakery, đơn vị chuyên phục vụ tiệc tráng miệng, tọa lạc gần Khu phức hợp Hội nghị Liverpool.</p></div>"
  }
},
        {
  id: 124,
  q: 'The presentations were ______ than we expected, so there was ample time left for questions.',
  options: [
    'brief',
    'briefly',
    'briefer',
    'briefest'
  ],
  a: 'briefer',
  exp: {
    correct: "<div style='line-height: 1.6;'><p><strong>a. Phân tích thành phần câu (S–V–O):</strong> Đây là câu ghép gồm hai mệnh đề độc lập nối với nhau bằng liên từ chỉ kết quả <code>so</code>:</p><ul><li><strong>Clause 1 (Mệnh đề chính 1):</strong> <code>The presentations were briefer than we expected</code> (Các bài thuyết trình ngắn gọn hơn dự kiến).<ul><li><strong>Subject (S):</strong> <code>The presentations</code>.</li><li><strong>Linking Verb (V):</strong> <code>were</code>.</li><li><strong>Subject Complement (C):</strong> <code>briefer than we expected</code> (Cụm tính từ so sánh hơn làm bổ ngữ cho chủ ngữ).</li></ul></li><li><strong>Clause 2 (Mệnh đề chính 2):</strong> <code>there was ample time left for questions</code> (Nên còn dư nhiều thời gian cho câu hỏi).<ul><li><strong>Dummy Subject + Verb:</strong> <code>there was</code>.</li><li><strong>Real Subject:</strong> <code>ample time</code> (kèm cụm phân từ <i>left for questions</i> bổ nghĩa).</li></ul></li></ul><p><strong>b. Xác định từ loại:</strong> Chỗ trống đứng sau động từ liên kết <code>were</code> (cần tính từ) và ngay trước từ nhận biết <code>than</code>. Đây là cấu trúc <strong>So sánh hơn (Comparative Degree)</strong> đối với tính từ.</p><p><strong>c. Lý do chọn đáp án:</strong> Tính từ <i>brief</i> (ngắn gọn) ở dạng so sánh hơn là <span style='color: #2e7d32; font-weight: bold;'>briefer</span>. Cụm <code>briefer than expected</code> hợp ngữ cảnh vì thuyết trình ngắn hơn dự kiến thì mới còn dư nhiều thời gian (<i>ample time</i>) dành cho phần hỏi đáp.</p></div>",
    wrong: "<ul style='line-height: 1.6; list-style-type: none; padding-left: 0;'><li><strong style='color: #c62828;'>❌ (A) brief:</strong> Tính từ ở dạng nguyên cấp. Không thể đứng trực tiếp trước <i>than</i> trong cấu trúc so sánh hơn.</li><li><strong style='color: #c62828;'>❌ (B) briefly:</strong> Trạng từ. Không làm bổ ngữ trực tiếp cho động từ to be <i>were</i> và không đi với <i>than</i> trong cấu trúc này.</li><li><strong style='color: #c62828;'>❌ (D) briefest:</strong> Tính từ ở dạng so sánh nhất (Superlative). Cần có <i>the</i> phía trước và không dùng khi có từ <i>than</i> theo sau.</li></ul>",
    grammar: "<div style='line-height: 1.6;'><p><strong>⭐ Cấu Trúc So Sánh Hơn Của Tính Từ & Các Cụm So Sánh Đi Với 'Than Expected' Trong TOEIC</strong></p><p>Trong các bài thi TOEIC Part 5, cấu trúc so sánh hơn đi kèm với liên từ <i>than</i> xuất hiện rất phổ biến nhằm so sánh thực tế với kỳ vọng hoặc dự báo.</p><table border='1' style='width: 100%; border-collapse: collapse; border-color: #e0e0e0; margin-top: 10px; font-size: 14px;'><thead style='background-color: #f5f5f5; text-align: left;'><tr><th style='padding: 8px;'>Công thức</th><th style='padding: 8px;'>Tính từ loại</th><th style='padding: 8px;'>Ví dụ Collocation với 'than expected'</th><th style='padding: 8px;'>Dịch nghĩa TOEIC</th></tr></thead><tbody><tr><td style='padding: 8px;'><span style='color: #2e7d32; font-weight: bold;'>Adj-er + than</span></td><td style='padding: 8px;'>Tính từ ngắn (1 âm tiết)</td><td style='padding: 8px;'><strong>briefer / shorter / lower than expected</strong></td><td style='padding: 8px;'>Ngắn hơn / thấp hơn dự kiến</td></tr><tr><td style='padding: 8px;'><span style='color: #2e7d32; font-weight: bold;'>more + Adj + than</span></td><td style='padding: 8px;'>Tính từ dài (2+ âm tiết)</td><td style='padding: 8px;'><strong>more expensive than expected</strong></td><td style='padding: 8px;'>Đắt đỏ hơn so với dự tính</td></tr><tr><td style='padding: 8px;'>Irregular + than</td><td style='padding: 8px;'>Tính từ bất quy tắc</td><td style='padding: 8px;'><strong>better / worse than expected</strong></td><td style='padding: 8px;'>Tốt hơn / tồi tệ hơn dự tính</td></tr></tbody></table><p style='margin-top: 10px;'><strong style='color: #e65100;'>🎯 Mẹo làm bài trong 3 giây:</strong> Nhìn thấy từ <code>than</code> ngay sau chỗ trống, hãy loại ngay các phương án nguyên cấp hoặc so sánh nhất, ưu tiên tìm ngay dạng <span style='color: #2e7d32; font-weight: bold;'>Adj-er</span> hoặc <i>more + Adj</i>.</p></div>",
    vocab: "<ul style='line-height: 1.6;'><li><strong style='color: #0288d1;'>briefer than expected</strong> (adj.phr): ngắn gọn hơn so với dự tính/dự kiến.</li><li><strong style='color: #0288d1;'>ample time / opportunity / space</strong> (n.phr): dư dả / dồi dào thời gian / cơ hội / không gian.</li><li><strong style='color: #0288d1;'>leave time for something</strong> (v.phr): dành ra / để lại thời gian cho việc gì.</li></ul>",
    trans: "<div style='line-height: 1.6; padding: 8px; background-color: #f9f9f9; border-left: 4px solid #0288d1;'><p style='margin: 0 0 8px 0;'><strong>Dịch nghĩa gốc:</strong> Các bài thuyết trình diễn ra NGẮN GỌN HƠN so với chúng tôi dự kiến, vì vậy đã có dư dả thời gian còn lại dành cho các câu hỏi.</p><p style='margin: 0; font-style: italic; color: #555;'><strong>Dịch tự nhiên:</strong> Các bài thuyết trình diễn ra ngắn gọn hơn dự kiến, do đó vẫn còn dư khá nhiều thời gian dành cho phần hỏi đáp.</p></div>"
  }

        {
  id: 125,
  q: 'According to our ______, your order will arrive in three days or we will refund 50 percent of the cost.',
  options: [
    'distribution',
    'guarantee',
    'exception',
    'discount'
  ],
  a: 'guarantee',
  exp: {
    correct: "<div style='line-height: 1.6;'><p><strong>a. Phân tích thành phần câu (S–V–O):</strong> Đây là câu ghép gồm hai mệnh đề nối với nhau bằng liên từ lựa chọn <code>or</code> (nếu không thì):</p><ul><li><strong>Prepositional Phrase (Trạng ngữ):</strong> <code>According to our guarantee</code> (Theo như cam kết của chúng tôi).<ul><li><strong>Prepositional Operator:</strong> <code>According to</code>.</li><li><strong>Possessive Adjective:</strong> <code>our</code>.</li><li><strong>Noun / Object of Preposition:</strong> <code>guarantee</code>.</li></ul></li><li><strong>Clause 1 (Mệnh đề 1):</strong> <code>your order will arrive in three days</code> (Đơn hàng của bạn sẽ đến trong vòng 3 ngày).<ul><li><strong>Subject (S):</strong> <code>your order</code>.</li><li><strong>Verb (V):</strong> <code>will arrive</code>.</li><li><strong>Time Modifier:</strong> <code>in three days</code>.</li></ul></li><li><strong>Clause 2 (Mệnh đề 2):</strong> <code>we will refund 50 percent of the cost</code> (Chúng tôi sẽ hoàn trả 50% chi phí).<ul><li><strong>Subject (S):</strong> <code>we</code>.</li><li><strong>Verb (V):</strong> <code>will refund</code>.</li><li><strong>Object (O):</strong> <code>50 percent of the cost</code>.</li></ul></li></ul><p><strong>b. Xác định từ loại:</strong> Chỗ trống đứng sau tính từ sở hữu <code>our</code> và giới từ <code>according to</code>, nên bắt buộc phải là một <strong>Danh từ (Noun)</strong>. Cả 4 phương án đều là danh từ, do đó đây là câu hỏi kiểm tra về <i>Từ vựng theo ngữ cảnh (Vocabulary in Context)</i>.</p><p><strong>c. Lý do chọn đáp án:</strong> Ngữ cảnh mang tính chất bồi thường/lời hứa dịch vụ: 'Hàng tới trong 3 ngày HOẶC sẽ hoàn lại 50% chi phí'. Từ <span style='color: #2e7d32; font-weight: bold;'>guarantee</span> (sự bảo đảm / lời cam kết) là lựa chọn duy nhất hợp ngữ cảnh thương mại này.</p></div>",
    wrong: "<ul style='line-height: 1.6; list-style-type: none; padding-left: 0;'><li><strong style='color: #c62828;'>❌ (A) distribution:</strong> Danh từ mang nghĩa 'sự phân phối' (VD: <i>product distribution, distribution center</i>). Không hợp nghĩa với chính sách bồi hoàn dịch vụ.</li><li><strong style='color: #c62828;'>❌ (C) exception:</strong> Danh từ mang nghĩa 'sự ngoại lệ' (VD: <i>make an exception, with the exception of</i>). Không tạo thành cụm từ tự nhiên và không hợp nghĩa ngữ cảnh.</li><li><strong style='color: #c62828;'>❌ (D) discount:</strong> Danh từ mang nghĩa 'sự giảm giá' (VD: <i>offer a discount</i>). Việc hoàn 50% tiền nếu giao trễ là chính sách cam kết dịch vụ (guarantee) chứ không phải chương trình giảm giá bán hàng lẻ.</li></ul>",
    grammar: "<div style='line-height: 1.6;'><p><strong>⭐ Cụm Từ Chỉ Cam Kết & Bồi Thường Dịch Vụ Khách Hàng Trong TOEIC</strong></p><p>Trong văn phong dịch vụ khách hàng, mua sắm và vận chuyển thương mại, TOEIC rất hay kiểm tra các danh từ chỉ chính sách bảo đảm đi kèm với điều khoản hoàn tiền.</p><table border='1' style='width: 100%; border-collapse: collapse; border-color: #e0e0e0; margin-top: 10px; font-size: 14px;'><thead style='background-color: #f5f5f5; text-align: left;'><tr><th style='padding: 8px;'>Danh từ chính</th><th style='padding: 8px;'>Mô tả / Collocation</th><th style='padding: 8px;'>Ví dụ Collocation</th><th style='padding: 8px;'>Dịch nghĩa TOEIC</th></tr></thead><tbody><tr><td style='padding: 8px;'><span style='color: #2e7d32; font-weight: bold;'>guarantee</span></td><td style='padding: 8px;'>According to + possessive + guarantee</td><td style='padding: 8px;'><strong>delivery / money-back guarantee</strong></td><td style='padding: 8px;'>Cam kết giao hàng / cam kết hoàn tiền</td></tr><tr><td style='padding: 8px;'>refund</td><td style='padding: 8px;'>issue / receive / request + a refund</td><td style='padding: 8px;'>refund 50 percent of the cost</td><td style='padding: 8px;'>Hoàn lại 50% chi phí</td></tr><tr><td style='padding: 8px;'>according to</td><td style='padding: 8px;'>According to + N (chính sách/hồ sơ)</td><td style='padding: 8px;'>according to policy / records</td><td style='padding: 8px;'>Căn cứ theo chính sách / hồ sơ</td></tr></tbody></table><p style='margin-top: 10px;'><strong style='color: #e65100;'>🎯 Mẹo làm bài trong 3 giây:</strong> Khi thấy vế sau có thông tin bồi thường <code>...or we will refund...</code>, hãy chọn ngay <span style='color: #2e7d32; font-weight: bold;'>guarantee</span> (lời cam kết / bảo đảm).</p></div>",
    vocab: "<ul style='line-height: 1.6;'><li><strong style='color: #0288d1;'>delivery guarantee</strong> (n.phr): cam kết bảo đảm giao hàng.</li><li><strong style='color: #0288d1;'>refund the cost</strong> (v.phr): hoàn trả lại chi phí / tiền hàng.</li><li><strong style='color: #0288d1;'>according to something</strong> (prep.phr): theo như / căn cứ theo cái gì.</li><li><strong style='color: #0288d1;'>arrive in [time]</strong> (v.phr): đến / giao tới trong vòng [khoảng thời gian].</li></ul>",
    trans: "<div style='line-height: 1.6; padding: 8px; background-color: #f9f9f9; border-left: 4px solid #0288d1;'><p style='margin: 0 0 8px 0;'><strong>Dịch nghĩa gốc:</strong> Theo LỜI CAM KẾT của chúng tôi, đơn hàng của bạn sẽ đến trong vòng ba ngày, nếu không chúng tôi sẽ hoàn lại 50% chi phí.</p><p style='margin: 0; font-style: italic; color: #555;'><strong>Dịch tự nhiên:</strong> Theo chính sách bảo đảm của chúng tôi, đơn hàng sẽ được giao trong ba ngày; nếu không, chúng tôi sẽ hoàn lại 50% giá trị đơn hàng.</p></div>"
  }

        {
  id: 126,
  q: 'Several Seoul-based companies have ______ redesigned their workplaces to be more colorful and comfortable.',
  options: [
    'note',
    'noted',
    'notable',
    'notably'
  ],
  a: 'notably',
  exp: {
    correct: "<div style='line-height: 1.6;'><p><strong>a. Phân tích thành phần câu (S–V–O):</strong> Câu ở thì Hiện tại hoàn thành (Present Perfect) diễn tả hành động đã xảy ra và bổ ngữ chỉ mục đích:</p><ul><li><strong>Subject (S):</strong> <code>Several Seoul-based companies</code> (Một số công ty có trụ sở tại Seoul).</li><li><strong>Verb (V):</strong> <code>have notably redesigned</code> (Đã thiết kế lại một cách đáng chú ý). In which:<ul><li><strong>Auxiliary Verb:</strong> <code>have</code>.</li><li><strong>Adverb:</strong> <code>notably</code>.</li><li><strong>Main Verb (V3/ed):</strong> <code>redesigned</code>.</li></ul></li><li><strong>Object (O):</strong> <code>their workplaces</code> (không gian / nơi làm việc của họ).</li><li><strong>Infinitive Phrase of Purpose (Bổ ngữ chỉ mục đích):</strong> <code>to be more colorful and comfortable</code> (để trở nên nhiều màu sắc và thoải mái hơn).</li></ul><p><strong>b. Xác định từ loại:</strong> Chỗ trống kẹp giữa trợ động từ <code>have</code> và động từ chính ở dạng quá khứ phân từ <code>redesigned</code>. Vị trí này bắt buộc phải là một <strong>Trạng từ (Adverb)</strong> để bổ nghĩa cho động từ chính.</p><p><strong>c. Lý do chọn đáp án:</strong> Trạng từ <span style='color: #2e7d32; font-weight: bold;'>notably</span> (một cách đáng chú ý / nổi bật) đứng ở vị trí kẹp giữa thì hoàn thành là hoàn toàn đúng ngữ pháp và mang lại ý nghĩa tự nhiên cho câu.</p></div>",
    wrong: "<ul style='line-height: 1.6; list-style-type: none; padding-left: 0;'><li><strong style='color: #c62828;'>❌ (A) note:</strong> Danh từ / Động từ nguyên mẫu. Không thể kẹp vào giữa trợ động từ <i>have</i> và V3 <i>redesigned</i>.</li><li><strong style='color: #c62828;'>❌ (B) noted:</strong> Tính từ ('nổi tiếng, được biết đến') / Động từ dạng V3. Không dùng hai dạng V3 đứng sát nhau không có liên từ hoặc dùng tính từ để bổ nghĩa cho động từ.</li><li><strong style='color: #c62828;'>❌ (C) notable:</strong> Tính từ ('đáng chú ý, đáng kể'). Tính từ chỉ bổ nghĩa cho danh từ, không đứng giữa <i>have ... V3</i> để bổ nghĩa cho hành động.</li></ul>",
    grammar: "<div style='line-height: 1.6;'><p><strong>⭐ Vị Trí Kinh Điển Của Trạng Từ Trong Thì Hoàn Thành (Present/Past Perfect) trong TOEIC</strong></p><p>Trong đề thi TOEIC Part 5, cấu trúc chèn trạng từ vào giữa trợ động từ <i>have / has / had</i> và động từ chính <i>V3/ed</i> là một trong những câu hỏi kiểm tra từ loại xuất hiện nhiều nhất.</p><table border='1' style='width: 100%; border-collapse: collapse; border-color: #e0e0e0; margin-top: 10px; font-size: 14px;'><thead style='background-color: #f5f5f5; text-align: left;'><tr><th style='padding: 8px;'>Cấu trúc vị trí</th><th style='padding: 8px;'>Các trạng từ chỉ mức độ / thời gian thường gặp</th><th style='padding: 8px;'>Ví dụ Collocation TOEIC</th><th style='padding: 8px;'>Dịch nghĩa TOEIC</th></tr></thead><tbody><tr><td style='padding: 8px;'><span style='color: #2e7d32; font-weight: bold;'>have/has + Adv + V3</span></td><td style='padding: 8px;'>notably / significantly / drastically</td><td style='padding: 8px;'><strong>have notably redesigned</strong></td><td style='padding: 8px;'>Đã thiết kế lại một cách đáng chú ý</td></tr><tr><td style='padding: 8px;'>have/has + Adv + V3</td><td style='padding: 8px;'>recently / already / currently</td><td style='padding: 8px;'>have recently moved</td><td style='padding: 8px;'>Gần đây đã chuyển đi</td></tr><tr><td style='padding: 8px;'>have/has + Adv + V3</td><td style='padding: 8px;'>successfully / officially / newly</td><td style='padding: 8px;'>has successfully completed</td><td style='padding: 8px;'>Đã hoàn thành thành công</td></tr></tbody></table><p style='margin-top: 10px;'><strong style='color: #e65100;'>🎯 Mẹo làm bài trong 3 giây:</strong> Nhìn thấy cấu trúc <code>have / has / had + ______ + V3/ed</code>, hãy chọn ngay <strong>Trạng từ (Adverb - đuôi -ly)</strong> mà không cần phân vân dịch nghĩa.</p></div>",
    vocab: "<ul style='line-height: 1.6;'><li><strong style='color: #0288d1;'>Seoul-based / Tokyo-based company</strong> (adj.phr): công ty có trụ sở tại Seoul / Tokyo.</li><li><strong style='color: #0288d1;'>redesign the workplace</strong> (v.phr): thiết kế lại không gian / môi trường làm việc.</li><li><strong style='color: #0288d1;'>notably / significantly</strong> (adv): một cách đáng chú ý / đáng kể.</li><li><strong style='color: #0288d1;'>colorful and comfortable</strong> (adj.phr): nhiều màu sắc và thoải mái.</li></ul>",
    trans: "<div style='line-height: 1.6; padding: 8px; background-color: #f9f9f9; border-left: 4px solid #0288d1;'><p style='margin: 0 0 8px 0;'><strong>Dịch nghĩa gốc:</strong> Một vài công ty có trụ sở tại Seoul đã thiết kế lại không gian làm việc của họ ĐẶC BIỆT ĐÁNG CHÚ Ý để trở nên nhiều màu sắc và thoải mái hơn.</p><p style='margin: 0; font-style: italic; color: #555;'><strong>Dịch tự nhiên:</strong> Một số công ty tại Seoul đã có những thay đổi đáng kể trong việc thiết kế lại không gian làm việc, giúp môi trường làm việc trở nên sinh động và thoải mái hơn.</p></div>"
  }

        {
  id: 127,
  q: 'The employee picnic will be postponed until next Friday because of the ______ cold temperatures this week.',
  options: [
    'deceptively',
    'unnecessarily',
    'irresponsibly',
    'unseasonably'
  ],
  a: 'unseasonably',
  exp: {
    correct: "<div style='line-height: 1.6;'><p><strong>a. Phân tích thành phần câu (S–V–O):</strong> Câu đơn có chứa cụm giới từ chỉ nguyên nhân đi kèm thì Tương lai bị động:</p><ul><li><strong>Subject (S):</strong> <code>The employee picnic</code> (Buổi dã ngoại của nhân viên).</li><li><strong>Verb (Passive Voice):</strong> <code>will be postponed</code> (Sẽ bị hoãn lại).</li><li><strong>Time Modifier:</strong> <code>until next Friday</code> (Cho tới thứ Sáu tuần sau).</li><li><strong>Prepositional Phrase of Cause (Cụm giới từ chỉ nguyên nhân):</strong> <code>because of the unseasonably cold temperatures this week</code> (Do nhiệt độ lạnh trái mùa tuần này). In which:<ul><li><strong>Preposition:</strong> <code>because of</code>.</li><li><strong>Article:</strong> <code>the</code>.</li><li><strong>Adverb:</strong> <code>unseasonably</code>.</li><li><strong>Adjective:</strong> <code>cold</code>.</li><li><strong>Head Noun:</strong> <code>temperatures</code>.</li><li><strong>Time Modifier:</strong> <code>this week</code>.</li></ul></li></ul><p><strong>b. Xác định từ loại:</strong> Chỗ trống đứng trước tính từ <code>cold</code> và sau mạo từ <code>the</code>. Vị trí này yêu cầu một <strong>Trạng từ (Adverb)</strong> để bổ nghĩa cho tính từ phía sau theo cấu trúc <code>Adv + Adj + N</code>.</p><p><strong>c. Lý do chọn đáp án:</strong> Cả 4 phương án đều là trạng từ. Đây là câu hỏi kiểm tra về <i>Collocation (Cụm từ cố định)</i> trong dự báo thời tiết. Cụm từ cố định <span style='color: #2e7d32; font-weight: bold;'>unseasonably cold</span> mang nghĩa 'lạnh trái mùa / lạnh bất thường so với mùa', rất phù hợp với ngữ cảnh hoãn sự kiện ngoài trời.</p></div>",
    wrong: "<ul style='line-height: 1.6; list-style-type: none; padding-left: 0;'><li><strong style='color: #c62828;'>❌ (A) deceptively:</strong> Trạng từ mang nghĩa 'một cách dối trá, làm cho lầm tưởng' (VD: <i>deceptively simple, deceptively easy</i>). Không kết hợp với tính từ chỉ thời tiết.</li><li><strong style='color: #c62828;'>❌ (B) unnecessarily:</strong> Trạng từ mang nghĩa 'không cần thiết' (VD: <i>unnecessarily expensive, unnecessarily complicated</i>). Không dùng để mô tả hiện tượng tự nhiên.</li><li><strong style='color: #c62828;'>❌ (C) irresponsibly:</strong> Trạng từ mang nghĩa 'vô trách nhiệm' (VD: <i>act irresponsibly</i>). Dùng để chỉ hành vi con người, không đi với tính từ thời tiết.</li></ul>",
    grammar: "<div style='line-height: 1.6;'><p><strong>⭐ Bộ Cụm Trạng Từ + Tính Từ Chỉ Thời Tiết & Cụm Giới Từ Bổ Nghĩa Trong TOEIC</strong></p><p>Trong các bản tin thời tiết, tin tức sự kiện và thông báo nội bộ, TOEIC rất hay kiểm tra các trạng từ đi cùng tính từ thời tiết để diễn tả sự bất thường so với mùa.</p><table border='1' style='width: 100%; border-collapse: collapse; border-color: #e0e0e0; margin-top: 10px; font-size: 14px;'><thead style='background-color: #f5f5f5; text-align: left;'><tr><th style='padding: 8px;'>Trạng từ</th><th style='padding: 8px;'>Tính từ kết hợp</th><th style='padding: 8px;'>Cụm Collocation hoàn chỉnh</th><th style='padding: 8px;'>Dịch nghĩa TOEIC</th></tr></thead><tbody><tr><td style='padding: 8px;'><span style='color: #2e7d32; font-weight: bold;'>unseasonably</span></td><td style='padding: 8px;'>cold / warm / hot / cool</td><td style='padding: 8px;'><strong>unseasonably cold / warm</strong></td><td style='padding: 8px;'>Lạnh / ấm trái mùa (bất thường)</td></tr><tr><td style='padding: 8px;'>unusually / extremely</td><td style='padding: 8px;'>high / low / bad</td><td style='padding: 8px;'>unusually high temperatures</td><td style='padding: 8px;'>Nhiệt độ cao bất thường</td></tr><tr><td style='padding: 8px;'>because of</td><td style='padding: 8px;'>Noun / Noun Phrase</td><td style='padding: 8px;'>because of severe weather</td><td style='padding: 8px;'>Bởi vì thời tiết khắc nghiệt</td></tr></tbody></table><p style='margin-top: 10px;'><strong style='color: #e65100;'>🎯 Mẹo làm bài trong 3 giây:</strong> Khi thấy các tính từ chỉ thời tiết như <code>cold</code>, <code>warm</code>, <code>hot</code>, <code>cool</code> đi cùng danh từ <code>weather / temperatures</code>, hãy nghĩ ngay tới trạng từ <span style='color: #2e7d32; font-weight: bold;'>unseasonably</span>.</p></div>",
    vocab: "<ul style='line-height: 1.6;'><li><strong style='color: #0288d1;'>unseasonably cold / warm</strong> (adv.phr): lạnh / ấm trái mùa, bất thường.</li><li><strong style='color: #0288d1;'>postpone an event / picnic</strong> (v.phr): hoãn lại một sự kiện / buổi dã ngoại (= delay / put off).</li><li><strong style='color: #0288d1;'>because of + Noun Phrase</strong> (prep): bởi vì cái gì.</li><li><strong style='color: #0288d1;'>employee picnic</strong> (n.phr): buổi dã ngoại của nhân viên.</li></ul>",
    trans: "<div style='line-height: 1.6; padding: 8px; background-color: #f9f9f9; border-left: 4px solid #0288d1;'><p style='margin: 0 0 8px 0;'><strong>Dịch nghĩa gốc:</strong> Buổi dã ngoại của nhân viên sẽ bị hoãn lại cho đến thứ Sáu tuần sau do nhiệt độ TRÁI MÙA lạnh giá tuần này.</p><p style='margin: 0; font-style: italic; color: #555;'><strong>Dịch tự nhiên:</strong> Chuyến dã ngoại của nhân viên sẽ dời sang thứ Sáu tuần sau do thời tiết trong tuần này lạnh bất thường so với mùa.</p></div>"
  }
},
        {
  id: 128,
  q: 'The accounting department is in first place in the office fund-raising challenge, ______ just two more days to go.',
  options: [
    'against',
    'namely',
    'with',
    'else'
  ],
  a: 'with',
  exp: {
    correct: "<div style='line-height: 1.6;'><p><strong>a. Phân tích thành phần câu (S–V–O):</strong> Câu đơn kèm cụm trạng ngữ bổ sung thông tin chỉ hoàn cảnh/thời gian còn lại phía sau dấu phẩy:</p><ul><li><strong>Main Clause (Mệnh đề chính):</strong> <code>The accounting department is in first place in the office fund-raising challenge</code> (Phòng kế toán đang ở vị trí dẫn đầu trong thử thách gây quỹ của văn phòng).<ul><li><strong>Subject (S):</strong> <code>The accounting department</code>.</li><li><strong>Verb (V):</strong> <code>is</code>.</li><li><strong>Subject Complement (C):</strong> <code>in first place</code>.</li><li><strong>Modifier (Trạng ngữ):</strong> <code>in the office fund-raising challenge</code>.</li></ul></li><li><strong>Prepositional Phrase (Cụm trạng ngữ chỉ hoàn cảnh):</strong> <code>with just two more days to go</code> (với việc chỉ còn hai ngày nữa là kết thúc). In which:<ul><li><strong>Preposition:</strong> <code>with</code>.</li><li><strong>Noun Phrase / Complement:</strong> <code>just two more days</code>.</li><li><strong>To-infinitive Modifier:</strong> <code>to go</code>.</li></ul></li></ul><p><strong>b. Xác định từ loại:</strong> Đứng trước cụm danh từ <code>just two more days to go</code> sau dấu phẩy, chỗ trống bắt buộc phải là một <strong>Giới từ (Preposition)</strong> để mở đầu cụm trạng ngữ chỉ hoàn cảnh đi kèm.</p><p><strong>c. Lý do chọn đáp án:</strong> Cấu trúc cố định <span style='color: #2e7d32; font-weight: bold;'>with + [time] + to go</span> mang nghĩa 'chỉ còn [khoảng thời gian] nữa là tới đích / kết thúc'. Do đó, giới từ <strong>with</strong> là đáp án chuẩn xác duy nhất về ngữ pháp và thành ngữ.</p></div>",
    wrong: "<ul style='line-height: 1.6; list-style-type: none; padding-left: 0;'><li><strong style='color: #c62828;'>❌ (A) against:</strong> Giới từ mang nghĩa 'chống lại, đối đầu với' (VD: <i>compete against, vote against</i>). Không tạo thành cụm từ chỉ thời gian còn lại.</li><li><strong style='color: #c62828;'>❌ (B) namely:</strong> Trạng từ giải thích mang nghĩa 'cụ thể là, nghĩa là' (VD: <i>three members, namely Tom, John, and Lisa</i>). Không dùng để mở đầu cụm hoàn cảnh thời gian.</li><li><strong style='color: #c62828;'>❌ (D) else:</strong> Trạng từ/tính từ mang nghĩa 'khác, nữa' (VD: <i>someone else, nowhere else</i>). Không đóng vai trò giới từ nối cụm trạng ngữ đứng sau dấu phẩy.</li></ul>",
    grammar: "<div style='line-height: 1.6;'><p><strong>⭐ Cấu Trúc Chỉ Hoàn Cảnh Đi Kèm & Cụm Từ 'To Go' Trong TOEIC</strong></p><p>Trong văn phong tin tức, báo cáo tiến độ và cuộc thi nội bộ, TOEIC rất hay kiểm tra cấu trúc trạng ngữ đi kèm dạng <i>With + Noun + To V / V-ing</i> để chỉ bối cảnh hoặc khoảng thời gian còn lại.</p><table border='1' style='width: 100%; border-collapse: collapse; border-color: #e0e0e0; margin-top: 10px; font-size: 14px;'><thead style='background-color: #f5f5f5; text-align: left;'><tr><th style='padding: 8px;'>Công thức cụm</th><th style='padding: 8px;'>Mô tả thành phần</th><th style='padding: 8px;'>Ví dụ Collocation TOEIC</th><th style='padding: 8px;'>Dịch nghĩa TOEIC</th></tr></thead><tbody><tr><td style='padding: 8px;'><span style='color: #2e7d32; font-weight: bold;'>with + [Time] + to go</span></td><td style='padding: 8px;'>Giới từ + Khoảng thời gian + to go</td><td style='padding: 8px;'><strong>with just two more days to go</strong></td><td style='padding: 8px;'>Chỉ còn 2 ngày nữa là xong / hết giờ</td></tr><tr><td style='padding: 8px;'>with + N + V-ing/Adj</td><td style='padding: 8px;'>Giới từ + Danh từ + Tính từ/Hiện tại phân từ</td><td style='padding: 8px;'>with only a few tasks remaining</td><td style='padding: 8px;'>Với việc chỉ còn lại vài nhiệm vụ</td></tr><tr><td style='padding: 8px;'>in first place</td><td style='padding: 8px;'>Giới từ + Thứ hạng danh từ</td><td style='padding: 8px;'>finish / be in first place</td><td style='padding: 8px;'>Đứng ở vị trí thứ nhất / dẫn đầu</td></tr></tbody></table><p style='margin-top: 10px;'><strong style='color: #e65100;'>🎯 Mẹo làm bài trong 3 giây:</strong> Khi thấy đuôi <code>______ + [Thời gian/Số lượng] + to go</code> ở cuối mệnh đề, hãy nghĩ ngay tới giới từ <span style='color: #2e7d32; font-weight: bold;'>with</span>.</p></div>",
    vocab: "<ul style='line-height: 1.6;'><li><strong style='color: #0288d1;'>with [time] to go</strong> (phrase): chỉ còn [khoảng thời gian] nữa là kết thúc / cán đích.</li><li><strong style='color: #0288d1;'>be in first place</strong> (v.phr): đứng ở vị trí thứ nhất / dẫn đầu.</li><li><strong style='color: #0288d1;'>fund-raising challenge / campaign</strong> (n.phr): thử thách / chiến dịch gây quỹ.</li><li><strong style='color: #0288d1;'>accounting department</strong> (n.phr): phòng / bộ phận kế toán.</li></ul>",
    trans: "<div style='line-height: 1.6; padding: 8px; background-color: #f9f9f9; border-left: 4px solid #0288d1;'><p style='margin: 0 0 8px 0;'><strong>Dịch nghĩa gốc:</strong> Phòng kế toán đang ở vị trí dẫn đầu trong thử thách gây quỹ của văn phòng, VỚI việc chỉ còn hai ngày nữa là kết thúc.</p><p style='margin: 0; font-style: italic; color: #555;'><strong>Dịch tự nhiên:</strong> Phòng kế toán hiện đang đứng đầu thử thách gây quỹ của công ty, khi chỉ còn đúng hai ngày nữa là cuộc thi khép lại.</p></div>"
  }
},
        {
  id: 129,
  q: 'Pink Geranium Coffee has struggled to ______ its new bottled espresso from similar beverages on the market.',
  options: [
    'participate',
    'distinguish',
    'overturn',
    'revoke'
  ],
  a: 'distinguish',
  exp: {
    correct: "<div style='line-height: 1.6;'><p><strong>a. Phân tích thành phần câu (S–V–O):</strong> Câu ở thì Hiện tại hoàn thành (Present Perfect) kết hợp cấu trúc động từ đi kèm cụm giới từ:</p><ul><li><strong>Subject (S):</strong> <code>Pink Geranium Coffee</code> (Thương hiệu Pink Geranium Coffee).</li><li><strong>Verb (V):</strong> <code>has struggled</code> (Đã gặp khó khăn / chật vật).</li><li><strong>Infinitive Phrase (Cụm động từ nguyên mẫu):</strong> <code>to distinguish its new bottled espresso from similar beverages on the market</code> (trong việc tạo sự khác biệt cho dòng espresso đóng chai mới so với các loại đồ uống tương tự trên thị trường). In which:<ul><li><strong>Verb (Bare Infinitive):</strong> <code>distinguish</code>.</li><li><strong>Object (O):</strong> <code>its new bottled espresso</code>.</li><li><strong>Prepositional Phrase:</strong> <code>from similar beverages on the market</code>.</li></ul></li></ul><p><strong>b. Xác định từ loại:</strong> Đứng sau cấu trúc <code>struggle + to V</code>, chỗ trống bắt buộc phải là một <strong>Động từ nguyên mẫu (Bare Infinitive)</strong>. Cả 4 phương án đều là động từ, nên đây là câu hỏi về <i>Từ vựng & Giới từ đi kèm (Verb + Preposition Collocation)</i>.</p><p><strong>c. Lý do chọn đáp án:</strong> Động từ <span style='color: #2e7d32; font-weight: bold;'>distinguish</span> đi kèm với giới từ <code>from</code> tạo thành cấu trúc cố định <i>distinguish A from B</i> (phân biệt A với B / tạo sự khác biệt cho A so với B), rất phù hợp với ngữ cảnh thương mại và marketing sản phẩm.</p></div>",
    wrong: "<ul style='line-height: 1.6; list-style-type: none; padding-left: 0;'><li><strong style='color: #c62828;'>❌ (A) participate:</strong> Động từ mang nghĩa 'tham gia', bắt buộc phải đi với giới từ <i>in</i> (<i>participate in something</i>), không dùng với tân ngữ + <i>from</i>.</li><li><strong style='color: #c62828;'>❌ (C) overturn:</strong> Động từ mang nghĩa 'lật ngược, bác bỏ' (VD: <i>overturn a decision, overturn a ruling</i>). Không hợp nghĩa và không đi với giới từ <i>from</i>.</li><li><strong style='color: #c62828;'>❌ (D) revoke:</strong> Động từ mang nghĩa 'thu hồi, hủy bỏ' giấy phép/quyền lợi (VD: <i>revoke a license, revoke a permit</i>). Hoàn toàn không hợp nghĩa trong ngữ cảnh quảng bá đồ uống.</li></ul>",
    grammar: "<div style='line-height: 1.6;'><p><strong>⭐ Bộ Động Từ Đi Với Giới Từ 'From' Cực Kỳ Hay Gặp Trong TOEIC</strong></p><p>Trong lĩnh vực marketing, kinh doanh và quy định thương mại, TOEIC rất hay kiểm tra các động từ đi kèm với giới từ <i>from</i> để diễn tả sự phân biệt, ngăn chặn hoặc khác biệt.</p><table border='1' style='width: 100%; border-collapse: collapse; border-color: #e0e0e0; margin-top: 10px; font-size: 14px;'><thead style='background-color: #f5f5f5; text-align: left;'><tr><th style='padding: 8px;'>Động từ chính</th><th style='padding: 8px;'>Cấu trúc giới từ</th><th style='padding: 8px;'>Ví dụ Collocation TOEIC</th><th style='padding: 8px;'>Dịch nghĩa TOEIC</th></tr></thead><tbody><tr><td style='padding: 8px;'><span style='color: #2e7d32; font-weight: bold;'>distinguish</span></td><td style='padding: 8px;'>distinguish A from B</td><td style='padding: 8px;'><strong>distinguish a product from competitors</strong></td><td style='padding: 8px;'>Tạo sự khác biệt cho sản phẩm so với đối thủ</td></tr><tr><td style='padding: 8px;'>prevent / protect</td><td style='padding: 8px;'>prevent A from V-ing</td><td style='padding: 8px;'>prevent data from being lost</td><td style='padding: 8px;'>Ngăn chặn dữ liệu khỏi bị mất</td></tr><tr><td style='padding: 8px;'>differ</td><td style='padding: 8px;'>differ from + N</td><td style='padding: 8px;'>differ from previous models</td><td style='padding: 8px;'>Khác biệt so với các mẫu trước đó</td></tr><tr><td style='padding: 8px;'>struggle</td><td style='padding: 8px;'>struggle to + V</td><td style='padding: 8px;'>struggle to meet deadlines</td><td style='padding: 8px;'>Gặp khó khăn trong việc kịp thời hạn</td></tr></tbody></table><p style='margin-top: 10px;'><strong style='color: #e65100;'>🎯 Mẹo làm bài trong 3 giây:</strong> Nhìn thấy cấu trúc <code>______ + Object + from + N</code>, hãy nghĩ ngay tới động từ <span style='color: #2e7d32; font-weight: bold;'>distinguish</span>.</p></div>",
    vocab: "<ul style='line-height: 1.6;'><li><strong style='color: #0288d1;'>distinguish A from B</strong> (v.phr): phân biệt A với B / tạo sự khác biệt cho A so với B.</li><li><strong style='color: #0288d1;'>struggle to do something</strong> (v.phr): gặp khó khăn / chật vật làm việc gì.</li><li><strong style='color: #0288d1;'>bottled espresso / beverage</strong> (n.phr): cà phê espresso đóng chai / đồ uống.</li><li><strong style='color: #0288d1;'>similar beverages on the market</strong> (n.phr): các loại đồ uống tương tự trên thị trường.</li></ul>",
    trans: "<div style='line-height: 1.6; padding: 8px; background-color: #f9f9f9; border-left: 4px solid #0288d1;'><p style='margin: 0 0 8px 0;'><strong>Dịch nghĩa gốc:</strong> Pink Geranium Coffee đã gặp khó khăn trong việc PHÂN BIỆT sản phẩm espresso đóng chai mới của họ với các loại đồ uống tương tự trên thị trường.</p><p style='margin: 0; font-style: italic; color: #555;'><strong>Dịch tự nhiên:</strong> Pink Geranium Coffee đã gặp nhiều khó khăn trong việc tạo sự khác biệt cho dòng espresso đóng chai mới của mình so với các sản phẩm cùng loại trên thị trường.</p></div>"
  }
},
       {
  id: 130,
  q: '______ it is occasionally inconvenient, Mr. Ohtani expects all team members to attend his weekly meeting.',
  options: [
    'Though',
    'As soon as',
    'Because',
    'When'
  ],
  a: 'Though',
  exp: {
    correct: "<div style='line-height: 1.6;'><p><strong>a. Phân tích thành phần câu (S–V–O):</strong> Câu ghép gồm hai mệnh đề nối với nhau bằng liên từ phụ thuộc đứng ở đầu câu:</p><ul><li><strong>Adverbial Clause of Concession (Mệnh đề nhượng bộ):</strong> <code>Though it is occasionally inconvenient</code> (Mặc dù đôi khi điều đó khá bất tiện).<ul><li><strong>Subordinating Conjunction:</strong> <code>Though</code>.</li><li><strong>Subject (S):</strong> <code>it</code>.</li><li><strong>Linking Verb (V):</strong> <code>is</code>.</li><li><strong>Subject Complement (C):</strong> <code>occasionally inconvenient</code> (Trạng từ bổ nghĩa cho Tính từ).</li></ul></li><li><strong>Main Clause (Mệnh đề chính):</strong> <code>Mr. Ohtani expects all team members to attend his weekly meeting</code> (Ông Ohtani vẫn yêu cầu tất cả các thành viên tham gia cuộc họp hàng tuần).<ul><li><strong>Subject (S):</strong> <code>Mr. Ohtani</code>.</li><li><strong>Verb (V):</strong> <code>expects</code>.</li><li><strong>Object (O):</strong> <code>all team members</code>.</li><li><strong>Object Complement (To-infinitive):</strong> <code>to attend his weekly meeting</code>.</li></ul></li></ul><p><strong>b. Xác định từ loại:</strong> Chỗ trống đứng trước một mệnh đề hoàn chỉnh (<code>it is...</code>) và nối với mệnh đề chính qua dấu phẩy, do đó bắt buộc phải chọn một <strong>Liên từ phụ thuộc (Subordinating Conjunction)</strong>.</p><p><strong>c. Lý do chọn đáp án:</strong> Hai mệnh đề mang ý nghĩa đối lập (MĐ1: <i>bất tiện</i> ❌ vs. MĐ2: <i>vẫn bắt buộc tham gia</i> ✅). Liên từ nhượng bộ <span style='color: #2e7d32; font-weight: bold;'>Though</span> (Mặc dù) là lựa chọn hợp lý duy nhất thể hiện mối quan hệ tương phản này.</p></div>",

    grammar: "<div style='line-height: 1.6;'><p><strong>⭐ Bộ Liên Từ Nhượng Bộ & Cấu Trúc Động Từ Đi Kèm Tân Ngữ 'Expect' Trong TOEIC</strong></p><p>Trong các thông báo quản lý văn phòng và quy định nội bộ, TOEIC rất hay kiểm tra sự tương phản giữa hai mệnh đề sử dụng các liên từ nhượng bộ.</p><table border='1' style='width: 100%; border-collapse: collapse; border-color: #e0e0e0; margin-top: 10px; font-size: 14px;'><thead style='background-color: #f5f5f5; text-align: left;'><tr><th style='padding: 8px;'>Công thức</th><th style='padding: 8px;'>Mô tả thành phần</th><th style='padding: 8px;'>Ví dụ Collocation TOEIC</th><th style='padding: 8px;'>Dịch nghĩa TOEIC</th></tr></thead><tbody><tr><td style='padding: 8px;'><span style='color: #2e7d32; font-weight: bold;'>Though / Although + Clause</span></td><td style='padding: 8px;'>Mặt dù + Mệnh đề (S + V)</td><td style='padding: 8px;'><strong>Though it is inconvenient,...</strong></td><td style='padding: 8px;'>Mặc dù việc đó bất tiện,...</td></tr><tr><td style='padding: 8px;'>expect + sb + to V</td><td style='padding: 8px;'>Yêu cầu / kỳ vọng ai làm gì</td><td style='padding: 8px;'>expect members to attend</td><td style='padding: 8px;'>Mặc định/yêu cầu thành viên tham dự</td></tr><tr><td style='padding: 8px;'>attend + N (no prep)</td><td style='padding: 8px;'>Tham dự sự kiện / cuộc họp</td><td style='padding: 8px;'>attend a meeting / conference</td><td style='padding: 8px;'>Tham dự cuộc họp / hội thảo</td></tr></tbody></table><p style='margin-top: 10px;'><strong style='color: #e65100;'>🎯 Mẹo làm bài trong 3 giây:</strong> Phân tích mối quan hệ 2 mệnh đề: <i>Bất tiện (Tiêu cực)</i> nhưng <i>Yêu cầu có mặt (Bắt buộc)</i> -> Bản chất là đối lập/nhượng bộ, chọn ngay <span style='color: #2e7d32; font-weight: bold;'>Though / Although / Even though</span>.</p></div>",

function applyEvidenceColors() {
    const pastelColors = [
        { bg: '#ffadad', text: '#5a1c1c' }, // Đỏ pastel
        { bg: '#ffd6a5', text: '#663d14' }, // Cam pastel
        { bg: '#caffbf', text: '#1f4d1f' }, // Xanh lá pastel
        { bg: '#9bf6ff', text: '#16565c' }, // Xanh dương pastel
        { bg: '#a0c4ff', text: '#1c3666' }, // Xanh biển pastel
        { bg: '#bdb2ff', text: '#352666' }, // Tím pastel
        { bg: '#ffc6ff', text: '#661a66' }, // Hồng pastel
        { bg: '#e2f0cb', text: '#3e5222' }  // Xanh rêu pastel
    ];

    let colorIndex = 0;
    let usedColors = {}; 

    let evElements = document.querySelectorAll('.ev-box');

    evElements.forEach(el => {
        let idString = el.id;
        if (!idString) return;
        let match = idString.match(/ev-(\d+)/);
        if (match) {
            let qId = match[1];
            if (!usedColors[qId]) {
                usedColors[qId] = pastelColors[colorIndex % pastelColors.length];
                colorIndex++;
            }
            el.style.backgroundColor = usedColors[qId].bg;
            el.style.color = usedColors[qId].text;
            el.style.padding = "2px 5px";
            el.style.borderRadius = "6px";
            el.style.fontWeight = "600";
            el.style.transition = "all 0.3s ease";
        }
    });
}

function formatAnswer(options, answer) {
    if(!options) return answer;
    if(Array.isArray(options)) {
        // Bỏ qua mảng object của Part 7 vì đáp án đã là A,B,C,D sẵn
        if (typeof options[0] === 'object') return answer; 
        let labels = ["A", "B", "C", "D"];
        let idx = options.indexOf(answer);
        return idx !== -1 ? labels[idx] : answer;
    }
    return answer; 
}

function createTOEICQuestion(qObj) {
    if(!qObj || !qObj.id) return "";
    
    // 1. Lấy nội dung câu hỏi
    let text = qObj.q || qObj.text || qObj.qEng || "";
    
    // XỬ LÝ LẶP SỐ: Nếu nội dung câu hỏi bắt đầu bằng "151. ", "152. "... thì xóa nó đi
    // vì đã có số thứ tự hiển thị trong vòng tròn màu hồng bên trái rồi.
    if (typeof text === 'string') {
        text = text.replace(/^\d+\.\s*/, ""); // Xóa số và dấu chấm ở đầu (vd: "131. " -> "")
        text = text.replace(/(\([^)]+\))/g, '<span class="vi-trans">$1</span>');
    }
    
    let opts = qObj.options;
    let optsHTML = "";
    let inputStyle = `margin-right:12px; transform:scale(1.3); cursor:pointer;`;
    let labelStyle = `display:block; margin:5px 0 5px -10px; padding:8px 12px; border-radius:10px; cursor:pointer; border:1px solid transparent; transition:0.2s; font-size:18px;`;

    if (Array.isArray(opts)) {
        let labels = ["A", "B", "C", "D"];
        opts.forEach((opt, i) => {
            // Sửa lỗi undefined cho các Option Part 6, 7 (dùng .text thay vì .en)
            let optText = typeof opt === 'object' ? (opt.text || opt.en || "") : opt;
            
            // XỬ LÝ LẶP NHÃN A. A.: Xóa "A. ", "B. " có sẵn trong dữ liệu
            if (typeof optText === 'string') {
                optText = optText.replace(/^[A-D]\.\s*/, ""); 
                optText = optText.replace(/(\([^)]+\))/g, '<span class="vi-trans">$1</span>');
            }

            let optValue = typeof opt === 'object' ? (opt.key || labels[i]) : labels[i];
            
            optsHTML += `
                <label class="mc-option" style="${labelStyle}" onmouseover="this.style.background='var(--exp-bg)'" onmouseout="this.style.background='transparent'">
                    <input type="radio" name="q${qObj.id}" value="${optValue}" style="${inputStyle}" onclick="checkNav(${qObj.id})"> 
                    <b>${labels[i]}.</b> ${optText}
                </label>`;
        });
    } else {
        // Trường hợp options là Object (thường cho Part 5)
        for (let key in opts) {
            let optText = opts[key];
            if (typeof optText === 'string') {
                optText = optText.replace(/^[A-D]\.\s*/, ""); 
                optText = optText.replace(/(\([^)]+\))/g, '<span class="vi-trans">$1</span>');
            }
            optsHTML += `
                <label class="mc-option" style="${labelStyle}" onmouseover="this.style.background='var(--exp-bg)'" onmouseout="this.style.background='transparent'">
                    <input type="radio" name="q${qObj.id}" value="${key}" style="${inputStyle}" onclick="checkNav(${qObj.id})"> 
                    <b>${key}.</b> ${optText}
                </label>`;
        }
    }

    return `<div class="q-row" id="q-row-${qObj.id}" style="margin-bottom:25px; display:flex;">
                <!-- Đây là nơi hiển thị số thứ tự trong vòng tròn -->
                <div class="q-num" style="min-width:35px; height:35px; background:var(--primary); color:white; border-radius:50%; display:flex; align-items:center; justify-content:center; font-weight:bold; margin-right:15px; flex-shrink:0;">${qObj.id}</div>
                <div class="q-text" style="flex:1; font-size:18px; line-height:1.8;">
                    <div class="q-content-wrapper">
                        <!-- Biến 'text' ở đây đã được cắt bỏ số thứ tự trùng lặp -->
                        <b>${text}</b><br>${optsHTML}
                        <span id="fb-${qObj.id}" class="feedback" style="font-weight:bold; margin-left:10px;"></span>
                    </div>
                    <div id="exp-${qObj.id}" class="exp-container"></div>
                </div>
            </div>`;
}

function createQuestionsBlock(passageObj) {
    let html = `<div class="questions-block" style="margin-bottom: 40px; background: transparent; padding: 0;" onmouseenter="showPassage('${passageObj.passageId}')">`;
    html += `<div style="color:var(--primary-dark); font-weight:bold; margin-bottom:15px; border-bottom: 2px solid var(--border); padding-bottom:10px; font-size: 18px;">📝 Questions for Passage: ${passageObj.passageId}</div>`;
    
    let validQuestions = passageObj.questions.filter(q => q && q.id);

validQuestions.forEach(q => {
    html += createTOEICQuestion(q);
    allQuestionIds.push(q.id);
    let correctAns = q.a || q.correct;
    if (!correctAns && Array.isArray(q.options) && typeof q.options === 'object') {
        let correctObj = q.options.find(o => o.isCorrect);
        if (correctObj) correctAns = correctObj.key;
    }
    answerKey[q.id] = formatAnswer(q.options, correctAns);
    // Nạp giải thích cho Part 6, 7 vào biến toàn cục
    explanations[q.id] = { exp: q.explanation || "" };
});
    html += `</div>`;
    return html;
}

function switchTab(n) {
    const mainContainer = document.getElementById('mainContainer');
    document.querySelectorAll('.tab-btn').forEach((b, i) => { b.classList.toggle('active', i + 1 === n); });
    document.querySelectorAll('.question-group').forEach((q, i) => { q.style.display = (i + 1 === n) ? 'block' : 'none'; });
    
    // Quản lý chế độ Part 5 hoặc 6-7
    if (n === 1) {
        mainContainer.classList.add('part5-mode');
    } else {
        mainContainer.classList.remove('part5-mode');
    }

    // Reset pagination khi đổi Part
    currentStep = 0;
    updatePagination();
    
    document.querySelector('.pane-right').scrollTop = 0;
}
function showPassage(passageId) {
    document.querySelectorAll('.passage-text-content').forEach(p => p.style.display = 'none');
    
    // Hiện bài tiếng Anh
    let pEng = document.getElementById(`passage-${passageId}`);

}
let currentStep = 0;

function updatePagination() {
    const activeGroup = document.querySelector('.question-group[style*="display: block"]');
    if (!activeGroup) return;

    const partSuffix = activeGroup.id.split('-').pop(); // Lấy số 1, 2 hoặc 3
    const isPart5 = activeGroup.id === 'q-group-1';
    
    // Nếu đã nộp bài: hiện tất cả, ẩn thanh điều hướng
    if (isSubmitted) {
        activeGroup.querySelectorAll('.questions-block, .q-row').forEach(el => el.style.display = isPart5 ? 'flex' : 'block');
        document.getElementById(`paginationBox${partSuffix}`).style.display = 'none';
        return;
    }

    const steps = isPart5 ? activeGroup.querySelectorAll('.q-row') : activeGroup.querySelectorAll('.questions-block');
    
    steps.forEach((step, index) => {
        if (index === currentStep) {
            step.style.display = isPart5 ? 'flex' : 'block';
            if (!isPart5) {
                // Đảm bảo gọi đúng hàm hiện bài đọc
                const pId = step.getAttribute('onmouseenter').match(/'([^']+)'/)[6];
                showPassage(pId);
            }
        } else {
            step.style.display = 'none';
        }
    });

    // Cập nhật trạng thái nút tương ứng với Part hiện tại
    document.getElementById(`btnPrev${partSuffix}`).disabled = (currentStep === 0);
    document.getElementById(`btnNext${partSuffix}`).disabled = (currentStep === steps.length - 1);
}

function changeStep(delta) {
    currentStep += delta;
    updatePagination();
}

function checkNav(id) {
    if(isSubmitted) return;
    let val = "";
    let radios = document.getElementsByName(`q${id}`);
    for (let r of radios) if (r.checked) val = r.value;

    let nav = document.getElementById(`nav-${id}`);
    if(nav) {
        if (val) nav.classList.add("done");
        else nav.classList.remove("done");
    }
}

function scrollToQuestion(id) {
    document.getElementById('navPanel').classList.remove('show');
    let group = 1;
    if (toeicData.part6.some(p => p.questions.some(q => q.id == id))) group = 2;
    if (toeicData.part7.some(p => p.questions.some(q => q.id == id))) group = 3;
    
    switchTab(group); // Chuyển Tab trước

    // Tìm xem câu hỏi này nằm ở vị trí (index) thứ mấy trong Part đó
    const activeGroup = document.getElementById(`q-group-${group}`);
    const steps = group === 1 ? activeGroup.querySelectorAll('.q-row') : activeGroup.querySelectorAll('.questions-block');
    
    steps.forEach((step, index) => {
        if (step.id === `q-row-${id}` || step.querySelector(`#q-row-${id}`)) {
            currentStep = index; // Cập nhật vị trí hiện tại
        }
    });

    updatePagination(); // Hiển thị câu hỏi đó lên
}
    
    setTimeout(() => {
        let el = document.getElementById(`q-row-${id}`);
        if (el) {
            el.scrollIntoView({behavior: "smooth", block: "center"});
            el.style.transition = "background 0.5s";
            el.style.background = "#fff9c4";
            setTimeout(() => el.style.background = "transparent", 1000);
            
            // Kích hoạt hiển thị đoạn văn luôn
            let parentBlock = el.closest('.questions-block');
            if(parentBlock) {
                // Kích hoạt event onmouseenter bằng code
                let mouseEvent = new MouseEvent('mouseenter');
                parentBlock.dispatchEvent(mouseEvent);
            }
        }
    }, 100);

        // Duyệt qua từng bài làm và tạo giao diện hiển thị
        history.forEach(attempt => {
            listHtml += `
                <div class="history-item">
                    <div class="history-info">
                        <span class="history-date">📅 ${attempt.date} - ⏰ ${attempt.time}</span>
                        <span class="history-score">🏆 Điểm: ${attempt.score}/${attempt.total} (${attempt.toeicScore} điểm)</span>
                    </div>
                    <div style="display: flex; gap: 5px;">
                        <button class="btn-review" onclick="restoreAttempt(${attempt.id})">Xem lại</button>
                        <button class="btn-delete-history" onclick="deleteAttempt(${attempt.id})" title="Xóa bài làm này">✖</button>
                    </div>
                </div>
            `;
        });
    }
    
    // Đổ dữ liệu vào danh sách và hiển thị bảng Modal
    historyListEl.innerHTML = listHtml;
    document.getElementById('historyOverlay').style.display = 'flex';
}

function closeHistoryModal() {
    // Ẩn bảng Modal lịch sử
    document.getElementById('historyOverlay').style.display = 'none';
}
function saveAttemptToHistory(score, total, userAnswersMap) {
    let history = JSON.parse(localStorage.getItem(HISTORY_KEY)) || [];
    let now = new Date();
    
    let attempt = {
        id: Date.now(),
        date: now.toLocaleDateString('vi-VN'),
        time: now.toLocaleTimeString('vi-VN', { hour: '2-digit', minute: '2-digit' }),
        score: score,
        total: total,
        toeicScore: calculateToeicReading(score, total),
        answers: userAnswersMap // Lưu lại toàn bộ ABCD đã chọn
    };
    
    history.unshift(attempt); // Đẩy bài mới nhất lên đầu
    localStorage.setItem(HISTORY_KEY, JSON.stringify(history));

    // ĐỒNG BỘ LÊN CLOUD NGAY SAU KHI LƯU
    if (window.syncHistoryToCloud) {
        window.syncHistoryToCloud(history);
    }
}

function deleteAttempt(attemptId) {
    showCustomConfirm("Bạn có chắc chắn muốn xóa bài làm này khỏi lịch sử không?", function() {
        let history = JSON.parse(localStorage.getItem(HISTORY_KEY)) || [];
        history = history.filter(h => h.id !== attemptId); 
        localStorage.setItem(HISTORY_KEY, JSON.stringify(history)); 
        
        // ĐỒNG BỘ THAO TÁC XÓA LÊN CLOUD
        if (window.syncHistoryToCloud) {
            window.syncHistoryToCloud(history);
        }
        
        openHistoryModal(); 
    });
}
function restoreAttempt(attemptId) {
    let history = JSON.parse(localStorage.getItem(HISTORY_KEY)) || [];
    let attempt = history.find(h => h.id === attemptId);
    
    if(!attempt) return;

    isReviewingMode = true; // Bật cờ hiệu "Đang xem lại"
    document.getElementById('historyOverlay').style.display = 'none';
    document.getElementById('setupOverlay').style.display = 'none';
    
    document.querySelectorAll('input[type="radio"]').forEach(el => {
        el.disabled = false;
        el.checked = false; 
    });
    
    // Tự động đánh dấu lại các Radio button đáp án học viên đã chọn trong lịch sử
    for (let qId in attempt.answers) {
        let val = attempt.answers[qId];
        if (val) {
            let radio = document.querySelector(`input[name="q${qId}"][value="${val}"]`);
            if (radio) radio.checked = true;
        }
    }
    
   // Đổi chữ nút Nộp bài thành "Đang xem lại" cho ngầu
    let btnSubmit = document.querySelector('.btn-submit');
    if(btnSubmit) {
        btnSubmit.innerText = "ĐANG XEM LẠI";
        btnSubmit.style.background = "#888";
        btnSubmit.style.boxShadow = "none";
    }

    // --- THÊM 2 DÒNG NÀY VÀO TRƯỚC DẤU NGOẶC NHỌN ĐÓNG HÀM ---
    isSubmitted = false; 
    executeSubmit();
}


function scrollToEvidence(evId) {
    const evElement = document.getElementById(evId);
    if(evElement) {
        // Cuộn đoạn văn chứa dẫn chứng vào giữa màn hình
        evElement.scrollIntoView({behavior: "smooth", block: "center"});
        
        // Thêm class 'focus-blink' để bật chế độ nháy vàng in đậm
        evElement.classList.add("focus-blink");
        
        // Tắt nổi bật sau 1.5 giây để trả văn bản về bình thường
        setTimeout(() => {
            evElement.classList.remove("focus-blink");
        }, 1500);
    } else {
        showCustomAlert("Chưa được gắn ID dẫn chứng trong bài đọc!");
    }
}
// --- GRADING ---
function submitTest(manual) {
    if (isSubmitted) return;
    if (manual) document.getElementById('confirmOverlay').style.display = 'flex';
    else executeSubmit();
}

function closeConfirmModal() { document.getElementById('confirmOverlay').style.display = 'none'; }
function closeResultModal() { document.getElementById('resultOverlay').style.display = 'none'; }

function executeSubmit() {
    document.getElementById('confirmOverlay').style.display = 'none';
    isSubmitted = true;
updatePagination();
    clearInterval(timerInterval);
    document.querySelectorAll('input, select').forEach(el => el.disabled = true);
    
    document.getElementById('mainContainer').classList.add('show-translation');
    
    let activeTabIndex = 1;
    document.querySelectorAll('.tab-btn').forEach((b, i) => {
        if (b.classList.contains('active')) activeTabIndex = i + 1;
    });
    switchTab(activeTabIndex);
    
    let score = 0;
    let totalQuestions = allQuestionIds.length;
    let userAnswersMap = {}; // Thêm cái này để hứng đáp án học viên

    allQuestionIds.forEach(id => {
        let userAns = "";
        let radios = document.getElementsByName(`q${id}`);
        for (let r of radios) if (r.checked) userAns = r.value;
        
        userAnswersMap[id] = userAns; // Ghi nhận đáp án câu này

        let correctAns = answerKey[id];
        let isCorrect = (userAns === correctAns);
        if (isCorrect && userAns !== "") score++; // Có chọn mới tính điểm

        let feedbackEl = document.getElementById(`fb-${id}`);
        if(feedbackEl) {
            if(isCorrect && userAns !== "") {
                feedbackEl.innerHTML = `<span style="color:var(--correct);">✓ Đúng</span>`;
            } else if (userAns === "") {
                feedbackEl.innerHTML = `<span style="color:#888;">Trống (Đáp án: <span style="background:#dce775; color:#333; padding:2px 5px; border-radius:4px;">${correctAns}</span>)</span>`;
            } else {
                feedbackEl.innerHTML = `<span style="color:var(--wrong);">✗ Sai (Đáp án: <span style="background:#dce775; color:#333; padding:2px 5px; border-radius:4px;">${correctAns}</span>)</span>`;
            }
        }
        
        let nav = document.getElementById(`nav-${id}`);
        if(nav) {
            if (isCorrect && userAns !== "") {
                nav.style.background = "#c8e6c9"; nav.style.color = "#2e7d32"; nav.style.borderColor = "#81c784";
            } else {
                nav.style.background = "#ffcdd2"; nav.style.color = "#c62828"; nav.style.borderColor = "#ef9a9a";
            }
        }

        let expContainer = document.getElementById(`exp-${id}`);
        if(expContainer && explanations[id]) {
            let expData = explanations[id];
let contentHtml = "";

if (expData.exp) contentHtml += `<div class="exp-text">${expData.exp}</div>`;
if (expData.vocab) contentHtml += `<div class="exp-vocab">${expData.vocab}</div>`;
if (expData.tip) contentHtml += `<div style="margin-top:8px; color:var(--primary-dark); font-weight:600;">📌 Ghi chú: ${expData.tip}</div>`;

expContainer.innerHTML = `
    <div class="exp-box show">
        <div class="exp-title">💡 Giải thích chi tiết Câu ${id}</div>
        ${contentHtml}
    </div>
`;
        }
    });

   
    if (!isReviewingMode) {
        saveAttemptToHistory(score, totalQuestions, userAnswersMap);
        document.getElementById('resultMessage').innerHTML = `Bạn đã làm đúng <b style="color: var(--primary); font-size: 22px;">${score}/${totalQuestions}</b> câu.<br>Điểm TOEIC Reading quy đổi: <b>${calculateToeicReading(score, totalQuestions)}</b>`;
        document.getElementById('resultOverlay').style.display = 'flex';
        if(window.luuDiemTOEICReadingFull) {
            // Tính toán thời gian thực tế đã làm (số phút ban đầu trừ đi số phút còn lại)
            let minutesAssigned = (currentMode === 'mock') ? 75 : parseInt(document.getElementById('timeInput').value);
            if(isNaN(minutesAssigned) || minutesAssigned < 1) minutesAssigned = 75;
            let timeTaken = Math.round(minutesAssigned - (testDuration / 60));
            
            // Truyền thêm timeTaken vào hàm
            window.luuDiemTOEICReadingFull(score, totalQuestions, "ETS 2026 - Test 2", timeTaken);
        }
    } else {
        // Đưa khối else này ra đúng vị trí của nó
        let toastMsg = document.createElement("div");
        toastMsg.innerText = "Đã khôi phục bài làm ngày cũ!";
        toastMsg.style.cssText = "position:fixed; top:20px; right:20px; background:var(--primary); color:white; padding:15px 20px; border-radius:12px; font-weight:bold; font-family:'Quicksand',sans-serif; z-index:99999; box-shadow:0 10px 30px rgba(0,0,0,0.2);";
        document.body.appendChild(toastMsg);
        setTimeout(() => toastMsg.remove(), 3000);
    }
}
        

function calculateToeicReading(raw, total) {
    if (raw === 0) return 5;
    let percent = raw / total;
    let score = Math.round((percent * 495) / 5) * 5; 
    return score > 495 ? 495 : (score < 5 ? 5 : score);
}

// --- HIGHLIGHT SYSTEM ---
const mainContainer = document.getElementById("mainContainer");
const menu = document.getElementById("ctxMenu");
let targetElement = null;
let selectedRange = null;

// Chuyển menu sang fixed để bám đúng con trỏ chuột dù đang cuộn ở cột nào
menu.style.position = "fixed";

mainContainer.addEventListener("contextmenu", (e) => {
    e.preventDefault();
    targetElement = null; selectedRange = null;
    
    // Nếu click chuột phải vào vùng đã highlight -> Hiện nút Xóa
    if (e.target.classList.contains("highlight")) {
        targetElement = e.target;
        showMenu(e.clientX, e.clientY, "remove");
        return;
    }
    
    // Nếu bôi đen văn bản mới -> Hiện nút Thêm
    let sel = window.getSelection();
    if (sel.toString().trim().length > 0 && mainContainer.contains(sel.anchorNode)) {
        selectedRange = sel.getRangeAt(0);
        showMenu(e.clientX, e.clientY, "add");
    } else {
        menu.style.display = "none";
    }
});

// Bấm chuột trái ra ngoài thì ẩn menu
document.addEventListener("click", (e) => { 
    if (menu && !menu.contains(e.target)) menu.style.display = "none"; 
});

function showMenu(x, y, mode) {
    menu.style.display = "block";
    let mw = menu.offsetWidth;
    let mh = menu.offsetHeight;
    
    // Chống tràn màn hình
    let left = x + mw > window.innerWidth ? window.innerWidth - mw - 10 : x;
    let top = y + mh > window.innerHeight ? window.innerHeight - mh - 10 : y;
    
    menu.style.left = left + "px";
    menu.style.top = top + "px";
    
    menu.children[0].style.display = (mode === "add") ? "block" : "none";
    menu.children[1].style.display = (mode === "remove") ? "block" : "none";
}

function doHighlight() {
    if (selectedRange) {
        try { 
            let span = document.createElement("span");
            span.className = "highlight";
            selectedRange.surroundContents(span); 
        } catch(e) {
            showCustomAlert("Lưu ý: Chỉ có thể bôi vàng các cụm từ nằm trong cùng một đoạn văn. Vui lòng không bôi đen vắt ngang qua các khoảng ngắt dòng nhé!");
        }
        window.getSelection().removeAllRanges();
    }
    menu.style.display = "none";
}

function removeHighlight() {
    if (targetElement) {
        let text = document.createTextNode(targetElement.textContent);
        targetElement.parentNode.replaceChild(text, targetElement);
        mainContainer.normalize(); // Nối lại văn bản liền mạch
    }
    menu.style.display = "none";
}

    // 1. HÀM ĐẨY LỊCH SỬ LÊN CLOUD
    window.syncHistoryToCloud = async function(historyData) {
        if (!window.currentUserUid) return;
        try {
            // Đặt tên document phân biệt theo Test và User
            let docId = window.currentUserUid + "_history_test2_2026";
            await setDoc(doc(db, "user_test_histories", docId), {
                savedHistory: historyData,
                lastUpdated: Date.now()
            }, { merge: true }); // Merge true để không đè mất các field khác nếu có
            
        } catch (error) {
            console.error("Lỗi đồng bộ lịch sử: ", error);
        }
    }

    // 2. LẮNG NGHE ĐĂNG NHẬP VÀ KÉO LỊCH SỬ VỀ
    onAuthStateChanged(auth, (user) => {

            window.currentUserUid = user.uid;
            window.currentUserEmail = user.email;
            
            // Tự động nhận diện ID file hiện tại (2018 hay 2019)
            let is2026 = document.title.includes("2026");

            const docRef = doc(db, "user_test_histories", docId);
            
            // SỬ DỤNG ONSNAPSHOT ĐỂ ĐỒNG BỘ REAL-TIME
            onSnapshot(docRef, (docSnap) => {
                if (docSnap.exists()) {
                    let cloudData = docSnap.data().savedHistory;
                    if (cloudData) {
