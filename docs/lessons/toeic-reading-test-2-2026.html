        {
  id: 109,
  q: "After accepting a job offer, a candidate must ______ all onboarding tasks before the start date.",
  options: [
    "complete",
    "proceed",
    "recover",
    "enlist"
  ],
  a: "complete",
  exp: {
    correct: "<div style='line-height: 1.6;'><p><strong>a. Phân tích thành phần câu (S–V–O):</strong> Câu được mở đầu bằng một cụm giới từ chỉ thời gian và mệnh đề chính có động từ khuyết thiếu:</p><ul><li><strong>Adverbial Phrase (Trạng ngữ):</strong> <code>After accepting a job offer</code> (Sau khi chấp nhận lời mời làm việc).</li><li><strong>Subject (S):</strong> <code>a candidate</code> (Một ứng viên).</li><li><strong>Verb (V):</strong> <code>must complete</code> (Phải hoàn thành - Động từ khuyết thiếu <i>must</i> + Bare Infinitive).</li><li><strong>Object (O):</strong> <code>all onboarding tasks</code> (Tất cả các nhiệm vụ nhận việc/hội nhập).</li><li><strong>Prepositional Phrase (Trạng ngữ thời gian):</strong> <code>before the start date</code> (Trước ngày bắt đầu đi làm).</li></ul><p><strong>b. Xác định từ loại:</strong> Đứng sau động từ khuyết thiếu <i>must</i> là khoảng trống cần một <strong>Động từ nguyên mẫu không 'to' (Bare Infinitive)</strong>. Cả 4 phương án đều là động từ nguyên mẫu, do đó đây là câu hỏi về <i>Từ vựng / Collocation (Kết hợp từ)</i>.</p><p><strong>c. Lý do chọn đáp án:</strong> Động từ đi kèm với tân ngữ <code>tasks</code> (nhiệm vụ, thủ tục) để tạo thành cụm từ tự nhiên trong môi trường doanh nghiệp là <span style='color: #2e7d32; font-weight: bold;'>complete</span> (<i>complete a task = hoàn thành một nhiệm vụ/thủ tục</i>).</p></div>",
    wrong: "<ul style='line-height: 1.6; list-style-type: none; padding-left: 0;'><li><strong style='color: #c62828;'>❌ (B) proceed:</strong> Động từ nội (Intransitive Verb) mang nghĩa 'tiến hành, tiếp tục'. Bắt buộc phải có giới từ đi kèm nếu có tân ngữ (<i>proceed with something</i>), không đi trực tiếp với tân ngữ <i>tasks</i>.</li><li><strong style='color: #c62828;'>❌ (C) recover:</strong> Mang nghĩa 'hồi phục (sức khỏe), khôi phục (dữ liệu/chi phí)' (VD: <i>recover lost data, recover from illness</i>). Hoàn toàn không hợp ngữ nghĩa.</li><li><strong style='color: #c62828;'>❌ (D) enlist:</strong> Mang nghĩa 'nhập ngũ, tuyển mộ, tranh thủ sự hỗ trợ' (VD: <i>enlist in the army, enlist support</i>). Không kết hợp với tân ngữ <i>tasks</i>.</li></ul>",
    grammar: "<div style='line-height: 1.6;'><p><strong>⭐ Collocations Phổ Biến Với Động Từ 'COMPLETE' Trong TOEIC HR & Office</strong></p><p>Trong các bài thi TOEIC Part 5 & 6, động từ <strong>complete</strong> (/kəmˈpliːt/) xuất hiện với tần suất cực kỳ cao khi đi cùng các tân ngữ chỉ công việc, biểu mẫu hoặc chương trình đào tạo.</p><table border='1' style='width: 100%; border-collapse: collapse; border-color: #e0e0e0; margin-top: 10px; font-size: 14px;'><thead style='background-color: #f5f5f5; text-align: left;'><tr><th style='padding: 8px;'>Cụm động từ (Collocation)</th><th style='padding: 8px;'>Dịch nghĩa chuyên ngành</th><th style='padding: 8px;'>Ví dụ ngữ cảnh TOEIC</th></tr></thead><tbody><tr><td style='padding: 8px;'><strong>Complete a task / assignment</strong></td><td style='padding: 8px;'>Hoàn thành nhiệm vụ / bài tập</td><td style='padding: 8px;'>must <strong>complete all onboarding tasks</strong></td></tr><tr><td style='padding: 8px;'><strong>Complete a form / application</strong></td><td style='padding: 8px;'>Điền đầy đủ đơn / mẫu đăng ký</td><td style='padding: 8px;'>please <strong>complete the attached form</strong></td></tr><tr><td style='padding: 8px;'><strong>Complete a project / report</strong></td><td style='padding: 8px;'>Hoàn thành dự án / báo cáo</td><td style='padding: 8px;'><strong>complete the quarterly report</strong> on time</td></tr><tr><td style='padding: 8px;'><strong>Complete training / course</strong></td><td style='padding: 8px;'>Hoàn thành khóa đào tạo</td><td style='padding: 8px;'>upon <strong>completing the safety training</strong></td></tr></tbody></table><p style='margin-top: 10px;'><strong style='color: #e65100;'>🎯 Mẹo làm bài trong 3 giây:</strong> Nhìn nhanh tân ngữ phía sau khoảng trống, nếu thấy các từ như <code>task, form, application, project, survey, training</code>, đáp án ưu tiên hàng đầu luôn là động từ <span style='color: #2e7d32; font-weight: bold;'>complete</span> (hoặc <i>submit, fill out</i>).</p></div>",
    vocab: "<ul style='line-height: 1.6;'><li><strong style='color: #0288d1;'>onboarding</strong> (n): quá trình tiếp nhận và hội nhập nhân viên mới (Cụm từ HR: <i>onboarding process, onboarding training, onboarding documents</i>).</li><li><strong style='color: #0288d1;'>candidate</strong> (n): ứng viên xin việc (= <i>applicant</i>).</li><li><strong style='color: #0288d1;'>accept a job offer</strong> (v.phr): chấp nhận lời mời làm việc (Trái nghĩa: <i>decline / reject a job offer</i>).</li><li><strong style='color: #0288d1;'>start date</strong> (n.phr): ngày bắt đầu làm việc chính thức.</li></ul>",
    trans: "<div style='line-height: 1.6; padding: 8px; background-color: #f9f9f9; border-left: 4px solid #0288d1;'><p style='margin: 0 0 8px 0;'><strong>Dịch nghĩa gốc:</strong> Sau khi chấp nhận lời mời làm việc, một ứng viên phải HOÀN THÀNH tất cả các thủ tục nhận việc trước ngày bắt đầu đi làm.</p><p style='margin: 0; font-style: italic; color: #555;'><strong>Dịch tự nhiên:</strong> Sau khi đồng ý nhận việc, ứng viên phải hoàn tất toàn bộ các thủ tục hội nhập nhân viên mới trước ngày chính thức đi làm.</p></div>"
  }
},
        {
  id: 110,
  q: "Although ______ training has just begun, Ms. Yu has already mastered the company’s proprietary accounting software.",
  options: [
    "her",
    "she",
    "hers",
    "herself"
  ],
  a: "her",
  exp: {
    correct: "<div style='line-height: 1.6;'><p><strong>a. Phân tích thành phần câu (Câu phức chứa liên từ Although):</strong> Câu gồm mệnh đề phụ chỉ sự nhượng bộ và mệnh đề chính độc lập:</p><ul><li><strong>Adverbial Clause of Concession (Mệnh đề phụ):</strong> <code>Although her training has just begun</code> (Mặc dù quá trình đào tạo của cô ấy chỉ mới bắt đầu - trong đó <i>Although</i> là liên từ, <i>her training</i> là chủ ngữ, <i>has just begun</i> là động từ).</li><li><strong>Main Clause (Mệnh đề chính):</strong> <code>Ms. Yu has already mastered the company’s proprietary accounting software</code> (Cô Yu đã thành thạo phần mềm kế toán độc quyền của công ty).</li></ul><p><strong>b. Xác định từ loại:</strong> Khoảng trống đứng ngay trước danh từ <code>training</code> (việc đào tạo / khóa đào tạo). Vị trí này cần một <strong>Tính từ sở hữu (Possessive Adjective)</strong> để đứng trước bổ nghĩa cho danh từ, trả lời cho câu hỏi 'khóa đào tạo của ai?'.</p><p><strong>c. Lý do chọn đáp án:</strong> Tính từ sở hữu tương ứng với đại từ nhân xưng chỉ nữ giới (Ms. Yu) là <span style='color: #2e7d32; font-weight: bold;'>her</span> (<i>her + Noun = her training</i>).</p></div>",
    wrong: "<ul style='line-height: 1.6; list-style-type: none; padding-left: 0;'><li><strong style='color: #c62828;'>❌ (B) she:</strong> Đại từ nhân xưng làm Chủ ngữ (Subject Pronoun). Chỉ đứng làm chủ ngữ của động từ, không được đứng ngay trước danh từ bổ nghĩa (Không dùng <i>she training</i>).</li><li><strong style='color: #c62828;'>❌ (C) hers:</strong> Đại từ sở hữu (Possessive Pronoun = her + Noun). Đại từ sở hữu đứng độc lập, tuyệt đối không đi kèm danh từ ngay phía sau (Không dùng <i>hers training</i>).</li><li><strong style='color: #c62828;'>❌ (D) herself:</strong> Đại từ phản thân (Reflexive Pronoun). Dùng để nhấn mạnh hoặc đóng vai trò tân ngữ khi chủ ngữ và tân ngữ là một (Không dùng <i>herself training</i>).</li></ul>",
    grammar: "<div style='line-height: 1.6;'><p><strong>⭐ Bảng Phân Biệt Các Dạng Đại Từ Thường Gặp Trong TOEIC Part 5</strong></p><p>Dạng câu hỏi phân biệt 4 dạng biến thể của Đại từ (Nhân xưng, Tính từ sở hữu, Đại từ sở hữu, Phản thân) xuất hiện trong 100% các bài thi TOEIC. Nắm chắc vị trí ngữ pháp của từng loại giúp bạn khoanh đáp án cực nhanh.</p><table border='1' style='width: 100%; border-collapse: collapse; border-color: #e0e0e0; margin-top: 10px; font-size: 14px;'><thead style='background-color: #f5f5f5; text-align: left;'><tr><th style='padding: 8px;'>Loại đại từ</th><th style='padding: 8px;'>Hình thái</th><th style='padding: 8px;'>Cấu trúc & Đắc điểm ngữ pháp</th><th style='padding: 8px;'>Ví dụ minh họa</th></tr></thead><tbody><tr><td style='padding: 8px;'><strong>Tính từ sở hữu</strong></td><td style='padding: 8px;'><span style='color: #2e7d32; font-weight: bold;'>her / my / his...</span></td><td style='padding: 8px;'>Bắt buộc: <strong>[ Tính từ sở hữu + Noun ]</strong></td><td style='padding: 8px;'><strong>her training</strong>, his office</td></tr><tr><td style='padding: 8px;'><strong>Đại từ nhân xưng</strong></td><td style='padding: 8px;'>she / I / he...</td><td style='padding: 8px;'>Đứng đầu mệnh đề: <strong>[ Subject + Verb ]</strong></td><td style='padding: 8px;'><strong>She</strong> mastered the software.</td></tr><tr><td style='padding: 8px;'><strong>Đại từ sở hữu</strong></td><td style='padding: 8px;'>hers / mine / his...</td><td style='padding: 8px;'>Đứng độc lập (= Possessive Adj + Noun)</td><td style='padding: 8px;'>The laptop is <strong>hers</strong>.</td></tr><tr><td style='padding: 8px;'><strong>Đại từ phản thân</strong></td><td style='padding: 8px;'>herself / myself...</td><td style='padding: 8px;'>Nhấn mạnh hoặc đứng sau Verb/Prep</td><td style='padding: 8px;'>She completed it <strong>herself</strong>.</td></tr></tbody></table><p style='margin-top: 10px;'><strong style='color: #e65100;'>🎯 Mẹo làm bài trong 3 giây:</strong> Khi thấy khoảng trống nằm ngay trước một Danh từ (ví dụ: <i>______ training / report / proposal...</i>) và 4 phương án là các dạng đại từ, hãy chọn ngay <span style='color: #2e7d32; font-weight: bold;'>Tính từ sở hữu</span> (<i>my, your, his, her, its, our, their</i>).</p></div>",
    vocab: "<ul style='line-height: 1.6;'><li><strong style='color: #0288d1;'>master</strong> (v): thành thạo, làm chủ, nắm vững (Collocations: <i>master a skill, master software, master a language</i>).</li><li><strong style='color: #0288d1;'>proprietary</strong> (adj): độc quyền, thuộc quyền sở hữu riêng (= <i>exclusive, privately owned</i>).</li><li><strong style='color: #0288d1;'>accounting software</strong> (n.phr): phần mềm kế toán (Từ vựng văn phòng phổ biến).</li><li><strong style='color: #0288d1;'>although + Clause</strong> (conj): mặc dù... (Liên từ chỉ sự nhượng bộ, không đi kèm <i>but</i> trong mệnh đề chính).</li></ul>",
    trans: "<div style='line-height: 1.6; padding: 8px; background-color: #f9f9f9; border-left: 4px solid #0288d1;'><p style='margin: 0 0 8px 0;'><strong>Dịch nghĩa gốc:</strong> Mặc dù khóa đào tạo CỦA CÔ ẤY chỉ mới bắt đầu, cô Yu đã hoàn toàn thành thạo phần mềm kế toán độc quyền của công ty.</p><p style='margin: 0; font-style: italic; color: #555;'><strong>Dịch tự nhiên:</strong> Dù mới chỉ bắt đầu chương trình đào tạo, cô Yu đã làm chủ được phần mềm kế toán nội bộ của công ty.</p></div>"
  }
},
        {
  id: 111,
  q: "Ms. Clayton was ______ to find that none of her files had been lost during the power failure.",
  options: [
    "easy",
    "delightful",
    "relieved",
    "absolute"
  ],
  a: "relieved",
  exp: {
    correct: "<div style='line-height: 1.6;'><p><strong>a. Phân tích thành phần câu (S–V–C):</strong> Câu được cấu tạo bởi động từ nối (Linking Verb) và cụm bổ ngữ diễn tả nguyên nhân cảm xúc:</p><ul><li><strong>Subject (S):</strong> <code>Ms. Clayton</code> (Bà Clayton).</li><li><strong>Verb (V - Linking Verb):</strong> <code>was</code> (Động từ to be ở quá khứ).</li><li><strong>Subject Complement (C):</strong> <code>relieved</code> (Tính từ chỉ cảm xúc làm bổ ngữ cho chủ ngữ Ms. Clayton).</li><li><strong>Prepositional Phrase / Clause (Cụm bổ nghĩa):</strong> <code>to find that none of her files had been lost during the power failure</code> (Mệnh đề chỉ nguyên nhân dẫn đến cảm xúc nhẹ nhõm).</li></ul><p><strong>b. Xác định từ loại:</strong> Khoảng trống nằm sau động từ to be <i>was</i> và đứng trước cụm <code>to V</code>. Cả 4 phương án đều là tính từ, do đó đây là câu hỏi kiểm tra <i>Nghĩa của từ trong ngữ cảnh (Vocabulary in Context)</i>.</p><p><strong>c. Lý do chọn đáp án:</strong> Đọc mệnh đề phía sau: <i>'không có file nào bị mất trong sự cố mất điện'</i> (tin tốt sau một lo âu). Cảm xúc phù hợp nhất của con người lúc này là <span style='color: #2e7d32; font-weight: bold;'>relieved</span> (cảm thấy nhẹ nhõm, an tâm).</p></div>",
    wrong: "<ul style='line-height: 1.6; list-style-type: none; padding-left: 0;'><li><strong style='color: #c62828;'>❌ (A) easy:</strong> Tính từ chỉ mức độ 'dễ dàng' của sự việc (VD: <i>an easy task</i>). Nếu ghép vào câu sẽ mang nghĩa 'Bà Clayton dễ bị tìm thấy' (vô lý về mặt ngữ nghĩa).</li><li><strong style='color: #c62828;'>❌ (B) delightful:</strong> Tính từ mô tả tính chất sự vật 'thú vị, làm say mê' (VD: <i>a delightful trip</i>). Không dùng để diễn tả cảm xúc yên tâm/nhẹ nhõm của con người trước một sự việc cụ thể.</li><li><strong style='color: #c62828;'>❌ (D) absolute:</strong> Tính từ mang nghĩa 'tuyệt đối, hoàn toàn' (VD: <i>absolute certainty, absolute authority</i>). Không dùng để diễn tả cảm xúc cá nhân.</li></ul>",
    grammar: "<div style='line-height: 1.6;'><p><strong>⭐ Cấu Trúc Diễn Tả Cảm Xúc [ Be + Adjective + to-V / that-Clause ] Trong TOEIC</strong></p><p>Trong đề thi TOEIC Reading, cấu trúc diễn tả cảm xúc của một cá nhân khi nhận được tin tức hoặc phát hiện ra một sự việc cực kỳ phổ biến. Các tính từ này bắt buộc phải phản ánh đúng bản chất của thông tin nhận được (tích cực hay tiêu cực).</p><table border='1' style='width: 100%; border-collapse: collapse; border-color: #e0e0e0; margin-top: 10px; font-size: 14px;'><thead style='background-color: #f5f5f5; text-align: left;'><tr><th style='padding: 8px;'>Tính từ chỉ cảm xúc</th><th style='padding: 8px;'>Dịch nghĩa cảm xúc</th><th style='padding: 8px;'>Ngữ cảnh nhận tin thường gặp</th></tr></thead><tbody><tr><td style='padding: 8px;'><strong>Be relieved to V / that...</strong></td><td style='padding: 8px;'>Nhẹ nhõm, an tâm khi...</td><td style='padding: 8px;'>Mọi thứ an toàn sau sự cố / hư hỏng.</td></tr><tr><td style='padding: 8px;'><strong>Be pleased / delighted to V</strong></td><td style='padding: 8px;'>Vui mừng, hài lòng khi...</td><td style='padding: 8px;'>Nhận được hợp đồng / thăng chức / khen thưởng.</td></tr><tr><td style='padding: 8px;'><strong>Be disappointed to V</strong></td><td style='padding: 8px;'>Thất vọng khi...</td><td style='padding: 8px;'>Dự án bị hủy / doanh thu giảm.</td></tr><tr><td style='padding: 8px;'><strong>Be surprised to V</strong></td><td style='padding: 8px;'>Bất ngờ / Ngạc nhiên khi...</td><td style='padding: 8px;'>Kết quả vượt ngoài mong đợi.</td></tr></tbody></table><p style='margin-top: 10px;'><strong style='color: #e65100;'>🎯 Mẹo làm bài trong 3 giây:</strong> Khi gặp dạng bài <code>be + [adj] + to find / hear / know / learn that...</code>, hãy đọc nhanh thông tin trong mệnh đề <i>that</i>. Nếu kết quả là 'tránh được rủi ro' (như <i>no files lost, no damage</i>), đáp án chính xác luôn là <span style='color: #2e7d32; font-weight: bold;'>relieved</span>.</p></div>",
    vocab: "<ul style='line-height: 1.6;'><li><strong style='color: #0288d1;'>be relieved to V</strong> (adj.phr): nhẹ nhõm / yên tâm khi làm gì (Collocations: <i>be relieved to find, be relieved to hear, feel relieved</i>).</li><li><strong style='color: #0288d1;'>power failure</strong> (n.phr): sự cố mất điện (= <i>power outage, blackout</i>).</li><li><strong style='color: #0288d1;'>none of + N</strong> (quantifier): không một ai / không một cái nào trong số...</li><li><strong style='color: #0288d1;'>lose files</strong> (v.phr) -> <strong>files had been lost</strong>: mất tập tin / dữ liệu (Dạng bị động thì Quá khứ hoàn thành).</li></ul>",
    trans: "<div style='line-height: 1.6; padding: 8px; background-color: #f9f9f9; border-left: 4px solid #0288d1;'><p style='margin: 0 0 8px 0;'><strong>Dịch nghĩa gốc:</strong> Bà Clayton cảm thấy NHẸ NHÕM khi phát hiện ra rằng không có tập tin nào của mình bị mất trong lúc mất điện.</p><p style='margin: 0; font-style: italic; color: #555;'><strong>Dịch tự nhiên:</strong> Bà Clayton trút được gánh nặng khi biết toàn bộ dữ liệu của mình vẫn còn nguyên vẹn sau sự cố cúp điện.</p></div>"
  }
},
       {
  id: 112,
  q: "During Mr. Nagahori’s tenure as CEO at Unten Properties, the company has grown ______.",
  options: [
    "signify",
    "significance",
    "significant",
    "significantly"
  ],
  a: "significantly",
  exp: {
    correct: "<div style='line-height: 1.6;'><p><strong>a. Phân tích thành phần câu (S–V–A):</strong> Câu gồm một trạng ngữ chỉ thời gian mở đầu và một mệnh đề chính độc lập:</p><ul><li><strong>Adverbial Phrase (Trạng ngữ):</strong> <code>During Mr. Nagahori’s tenure as CEO at Unten Properties</code> (Trong suốt nhiệm kỳ làm CEO của ông Nagahori tại Unten Properties).</li><li><strong>Subject (S):</strong> <code>the company</code> (Công ty).</li><li><strong>Verb (V - Intransitive Verb):</strong> <code>has grown</code> (Đã và đang phát triển - Nội động từ chia ở thì Hiện tại hoàn thành).</li><li><strong>Adverb (A):</strong> <code>significantly</code> (Trạng từ bổ nghĩa trực tiếp cho động từ <i>has grown</i>).</li></ul><p><strong>b. Xác định từ loại:</strong> Động từ <i>grow</i> trong câu đóng vai trò là một <strong>nội động từ (Intransitive Verb)</strong>, không cần tân ngữ theo sau. Vị trí cuối câu đứng ngay sau nội động từ hoàn chỉnh bắt buộc phải là một <span style='color: #2e7d32; font-weight: bold;'>Trạng từ (Adverb)</span> để trả lời cho câu hỏi 'phát triển như thế nào?'.</p><p><strong>c. Lý do chọn đáp án:</strong> Trạng từ có đuôi <i>-ly</i> duy nhất trong 4 phương án là <span style='color: #2e7d32; font-weight: bold;'>significantly</span> (phát triển một cách đáng kể).</p></div>",
    wrong: "<ul style='line-height: 1.6; list-style-type: none; padding-left: 0;'><li><strong style='color: #c62828;'>❌ (A) signify:</strong> Động từ nguyên mẫu (Verb) mang nghĩa 'biểu thị, báo hiệu'. Không thể đứng sau một động từ đã chia thì như <i>has grown</i>.</li><li><strong style='color: #c62828;'>❌ (B) significance:</strong> Danh từ (Noun) mang nghĩa 'sự quan trọng, ý nghĩa'. Đứng sau nội động từ <i>grow</i> không tạo thành cụm từ có nghĩa (Không dùng <i>grow significance</i>).</li><li><strong style='color: #c62828;'>❌ (C) significant:</strong> Tính từ (Adjective) mang nghĩa 'đáng kể'. Tính từ chỉ bổ nghĩa cho danh từ hoặc đứng sau động từ nối (Linking Verbs như <i>be, become, seem</i>), không bổ nghĩa cho nội động từ hành động <i>grow</i>.</li></ul>",
    grammar: "<div style='line-height: 1.6;'><p><strong>⭐ Bộ Trạng Từ Chỉ Mức Độ Tăng / Giảm Cực Kỳ Phổ Biến Trong TOEIC</strong></p><p>Dạng bài kết hợp giữa Động từ chỉ sự biến động (<i>increase, decrease, grow, rise, drop, expand...</i>) và Trạng từ chỉ mức độ xuất hiện liên tục trong bài thi TOEIC Part 5 & 6.</p><table border='1' style='width: 100%; border-collapse: collapse; border-color: #e0e0e0; margin-top: 10px; font-size: 14px;'><thead style='background-color: #f5f5f5; text-align: left;'><tr><th style='padding: 8px;'>Trạng từ (Adverbs)</th><th style='padding: 8px;'>Đồng nghĩa (Synonyms)</th><th style='padding: 8px;'>Động từ hay đi kèm (Collocations)</th></tr></thead><tbody><tr><td style='padding: 8px;'><span style='color: #2e7d32; font-weight: bold;'>significantly</span></td><td style='padding: 8px;'>considerably, substantially</td><td style='padding: 8px;'>grow / increase / improve / decline</td></tr><tr><td style='padding: 8px;'>dramatically</td><td style='padding: 8px;'>sharply, steeply</td><td style='padding: 8px;'>rise / fall / drop / change</td></tr><tr><td style='padding: 8px;'>steadily</td><td style='padding: 8px;'>gradually, consistently</td><td style='padding: 8px;'>increase / expand / progress</td></tr><tr><td style='padding: 8px;'>rapidly</td><td style='padding: 8px;'>swiftly, quickly</td><td style='padding: 8px;'>grow / expand / develop</td></tr></tbody></table><p style='margin-top: 10px;'><strong style='color: #e65100;'>🎯 Mẹo làm bài trong 3 giây:</strong> Nhận diện bẫy Từ loại (Word Form) khi cả 4 phương án xuất phát từ một gốc từ (<i>signify</i>). Nhìn trước khoảng trống thấy cấu trúc hoàn chỉnh <code>Subject + Intransitive Verb</code> (<i>the company has grown</i>), lập tức chọn <span style='color: #2e7d32; font-weight: bold;'>Trạng từ (-ly)</span>.</p></div>",
    vocab: "<ul style='line-height: 1.6;'><li><strong style='color: #0288d1;'>grow significantly</strong> (v.phr): phát triển / tăng trưởng đáng kể.</li><li><strong style='color: #0288d1;'>tenure</strong> (n): nhiệm kỳ, thời gian đảm nhiệm chức vụ (VD: <i>during one's tenure as CEO</i>).</li><li><strong style='color: #0288d1;'>during + Noun</strong> (prep): trong suốt khoảng thời gian nào đó.</li><li><strong style='color: #0288d1;'>proprietary / real estate / properties</strong> (n): tài sản, bất động sản.</li></ul>",
    trans: "<div style='line-height: 1.6; padding: 8px; background-color: #f9f9f9; border-left: 4px solid #0288d1;'><p style='margin: 0 0 8px 0;'><strong>Dịch nghĩa gốc:</strong> Trong suốt nhiệm kỳ làm CEO của ông Nagahori tại Unten Properties, công ty đã phát triển ĐÁNG KỂ.</p><p style='margin: 0; font-style: italic; color: #555;'><strong>Dịch tự nhiên:</strong> Trong thời gian ông Nagahori giữ chức CEO tại Unten Properties, công ty đã đạt được mức tăng trưởng rất ấn tượng.</p></div>"
  }

        {
  id: 113,
  q: "Safety must always be the top ______ in each step of the glassblowing process.",
  options: [
    "surface",
    "material",
    "priority",
    "position"
  ],
  a: "priority",
  exp: {
    correct: "<div style='line-height: 1.6;'><p><strong>a. Phân tích thành phần câu (S–V–C):</strong> Câu sử dụng động từ khiếm khuyết kết hợp với động từ nối (Linking Verb):</p><ul><li><strong>Subject (S):</strong> <code>Safety</code> (Sự an toàn - Danh từ không đếm được).</li><li><strong>Verb (V - Modal + Linking Verb):</strong> <code>must always be</code> (Luôn luôn phải là).</li><li><strong>Subject Complement (C):</strong> <code>the top priority</code> (Cụm danh từ đóng vai trò bổ ngữ cho chủ ngữ <i>Safety</i>).</li><li><strong>Prepositional Phrase (Trạng ngữ chỉ phạm vi):</strong> <code>in each step of the glassblowing process</code> (Trong từng bước của quy trình thổi thủy tinh).</li></ul><p><strong>b. Xác định từ loại:</strong> Đứng sau tính từ <i>top</i> (hàng đầu) cần một <strong>Danh từ (Noun)</strong> để cấu tạo thành cụm danh từ bổ nghĩa cho chủ ngữ. Cả 4 phương án đều là danh từ, do đó đây là câu hỏi kiểm tra <i>Cụm từ cố định (Collocation) / Ngữ cảnh từ vựng</i>.</p><p><strong>c. Lý do chọn đáp án:</strong> Đi với tính từ <i>top</i> trong môi trường làm việc, sản xuất để chỉ điều quan trọng nhất phải đặt lên hàng đầu chính là cụm <span style='color: #2e7d32; font-weight: bold;'>top priority</span> (ưu tiên hàng đầu).</p></div>",
    wrong: "<ul style='line-height: 1.6; list-style-type: none; padding-left: 0;'><li><strong style='color: #c62828;'>❌ (A) surface:</strong> Danh từ mang nghĩa 'bề mặt' (VD: <i>glass surface, smooth surface</i>). Ghép vào câu mang nghĩa 'bề mặt hàng đầu' (hoàn toàn vô nghĩa).</li><li><strong style='color: #c62828;'>❌ (B) material:</strong> Danh từ mang nghĩa 'vật liệu, nguyên liệu' (VD: <i>raw materials, building materials</i>). An toàn không thể là một 'vật liệu'.</li><li><strong style='color: #c62828;'>❌ (D) position:</strong> Danh từ mang nghĩa 'vị trí, chức vụ' (VD: <i>job position, top position</i>). Dù có cụm <i>top position</i> nhưng từ này chỉ vị trí thứ hạng / chức vụ công việc, không dùng để nói về tầm quan trọng của quy tắc an toàn.</li></ul>",
    grammar: "<div style='line-height: 1.6;'><p><strong>⭐ Tổng Hợp Các Collocations Quan Trọng Nhất Với Từ 'Priority' Trong TOEIC</strong></p><p>Trong môi trường quản trị doanh nghiệp, an toàn lao động và chăm sóc khách hàng, các cấu trúc đi với danh từ <i>priority</i> xuất hiện với tần suất cực cao trong cả hai phần Listening và Reading.</p><table border='1' style='width: 100%; border-collapse: collapse; border-color: #e0e0e0; margin-top: 10px; font-size: 14px;'><thead style='background-color: #f5f5f5; text-align: left;'><tr><th style='padding: 8px;'>Cụm từ / Cấu trúc</th><th style='padding: 8px;'>Dịch nghĩa</th><th style='padding: 8px;'>Ví dụ ngữ cảnh TOEIC</th></tr></thead><tbody><tr><td style='padding: 8px;'><span style='color: #2e7d32; font-weight: bold;'>top priority / highest priority</span></td><td style='padding: 8px;'>Ưu tiên hàng đầu / cao nhất</td><td style='padding: 8px;'>Customer satisfaction is our <strong>top priority</strong>.</td></tr><tr><td style='padding: 8px;'><strong>make something a priority</strong></td><td style='padding: 8px;'>Coi cái gì là ưu tiên hàng đầu</td><td style='padding: 8px;'>We make workplace safety a <strong>priority</strong>.</td></tr><tr><td style='padding: 8px;'><strong>give priority to + N/V-ing</strong></td><td style='padding: 8px;'>Dành sự ưu tiên cho...</td><td style='padding: 8px;'>We give <strong>priority</strong> to urgent orders.</td></tr><tr><td style='padding: 8px;'><strong>take priority over + N</strong></td><td style='padding: 8px;'>Có mức độ ưu tiên cao hơn...</td><td style='padding: 8px;'>Quality takes <strong>priority</strong> over speed.</td></tr></tbody></table><p style='margin-top: 10px;'><strong style='color: #e65100;'>🎯 Mẹo làm bài trong 3 giây:</strong> Khi thấy phía trước khoảng trống có các từ chỉ mức độ như <i>top, highest, main, first</i> và câu đang đề cập đến các chủ đề như <i>Safety (An toàn), Customer Satisfaction (Sự hài lòng khách hàng), Quality (Chất lượng)</i>, hãy chọn ngay <span style='color: #2e7d32; font-weight: bold;'>priority</span>.</p></div>",
    vocab: "<ul style='line-height: 1.6;'><li><strong style='color: #0288d1;'>top priority</strong> (n.phr): ưu tiên hàng đầu.</li><li><strong style='color: #0288d1;'>glassblowing process</strong> (n.phr): quy trình thổi thủy tinh (một ngành nghề thủ công).</li><li><strong style='color: #0288d1;'>safety precautions / standards</strong> (n.phr): các biện pháp phòng ngừa / tiêu chuẩn an toàn.</li><li><strong style='color: #0288d1;'>in each step of...</strong> (prep.phr): trong từng bước / công đoạn của...</li></ul>",
    trans: "<div style='line-height: 1.6; padding: 8px; background-color: #f9f9f9; border-left: 4px solid #0288d1;'><p style='margin: 0 0 8px 0;'><strong>Dịch nghĩa gốc:</strong> An toàn luôn luôn phải là ƯU TIÊN hàng đầu trong từng bước của quá trình thổi thủy tinh.</p><p style='margin: 0; font-style: italic; color: #555;'><strong>Dịch tự nhiên:</strong> Ở mọi công đoạn của quy trình thổi thủy tinh, an toàn lao động luôn phải được đặt lên hàng đầu.</p></div>"
  }

        {
  id: 114,
  q: "Central Science Museum hosts online seminars by experts who ______ topics related to information technology.",
  options: [
    "are covered",
    "covering",
    "to cover",
    "cover"
  ],
  a: "cover",
  exp: {
    correct: "<div style='line-height: 1.6;'><p><strong>a. Phân tích thành phần câu (S–V–O):</strong> Câu bao gồm mệnh đề chính và một mệnh đề quan hệ (Relative Clause) bổ nghĩa cho tân ngữ chỉ người:</p><ul><li><strong>Main Clause (Mệnh đề chính):</strong> <code>Central Science Museum hosts online seminars by experts</code> (Bảo tàng Khoa học Trung tâm tổ chức các buổi hội thảo trực tuyến bởi các chuyên gia).</li><li><strong>Relative Clause (Mệnh đề quan hệ):</strong> <code>who cover topics related to information technology</code> (những người trình bày về các chủ đề liên quan đến công nghệ thông tin). Trong đó:<ul><li><strong>Subject (S):</strong> <code>who</code> (Đại từ quan hệ đóng vai trò chủ ngữ, thay thế cho danh từ số nhiều chỉ người <i>experts</i>).</li><li><strong>Verb (V):</strong> <code>cover</code> (Động từ chính của mệnh đề quan hệ, chia theo số nhiều ở thì Hiện tại đơn).</li><li><strong>Object (O):</strong> <code>topics related to information technology</code> (Các chủ đề liên quan đến CNTT).</li></ul></li></ul><p><strong>b. Xác định từ loại:</strong> Đứng sau đại từ quan hệ <i>who</i> và đứng trước tân ngữ <i>topics</i> bắt buộc phải là một <strong>Động từ chia thì chính (Finite Verb)</strong> ở thể chủ động.</p><p><strong>c. Lý do chọn đáp án:</strong> <i>Who</i> thay thế cho <i>experts</i> (danh từ số nhiều), hành động mang tính chất sự thật/chuyên môn nên dùng thì Hiện tại đơn ở dạng nguyên mẫu <span style='color: #2e7d32; font-weight: bold;'>cover</span>.</p></div>",
    wrong: "<ul style='line-height: 1.6; list-style-type: none; padding-left: 0;'><li><strong style='color: #c62828;'>❌ (A) are covered:</strong> Động từ ở dạng Bị động (Passive Voice). Phía sau đã có tân ngữ <i>topics</i> nên câu phải mang nghĩa chủ động ('chuyên gia trình bày chủ đề', không thể là 'chuyên gia bị trình bày chủ đề').</li><li><strong style='color: #c62828;'>❌ (B) covering:</strong> Dạng V-ing. Không thể đóng vai trò làm động từ chia thì đứng ngay sau đại từ quan hệ <i>who</i> (Không dùng <i>who covering</i>).</li><li><strong style='color: #c62828;'>❌ (C) to cover:</strong> Dạng To-V. Không đóng vai trò là động từ chia thì chính trong mệnh đề quan hệ (Không dùng <i>who to cover</i>).</li></ul>",
    grammar: "<div style='line-height: 1.6;'><p><strong>⭐ Đa Năng Từ 'COVER' Trong Đề Thi TOEIC Reading & Listening</strong></p><p>Động từ <i>cover</i> là một trong những từ đa nghĩa nhất xuất hiện liên tục trong TOEIC với các nét nghĩa hoàn toàn khác nhau tùy thuộc vào ngữ cảnh.</p><table border='1' style='width: 100%; border-collapse: collapse; border-color: #e0e0e0; margin-top: 10px; font-size: 14px;'><thead style='background-color: #f5f5f5; text-align: left;'><tr><th style='padding: 8px;'>Nét nghĩa của Cover</th><th style='padding: 8px;'>Dịch nghĩa</th><th style='padding: 8px;'>Ví dụ ngữ cảnh TOEIC</th></tr></thead><tbody><tr><td style='padding: 8px;'><span style='color: #2e7d32; font-weight: bold;'>Cover a topic / subject</span></td><td style='padding: 8px;'>Bao quát, đề cập, trình bày chủ đề</td><td style='padding: 8px;'>The seminar will <strong>cover</strong> digital marketing.</td></tr><tr><td style='padding: 8px;'><strong>Cover the costs / expenses</strong></td><td style='padding: 8px;'>Chi trả, bao bọc chi phí</td><td style='padding: 8px;'>The grant will <strong>cover</strong> travel expenses.</td></tr><tr><td style='padding: 8px;'><strong>Cover an event (Media)</strong></td><td style='padding: 8px;'>Đưa tin, tường thuật sự kiện</td><td style='padding: 8px;'>Journalists arrived to <strong>cover</strong> the conference.</td></tr><tr><td style='padding: 8px;'><strong>Cover for someone</strong></td><td style='padding: 8px;'>Làm thay / Ca trực cho ai đó</td><td style='padding: 8px;'>Can you <strong>cover for</strong> me this afternoon?</td></tr></tbody></table><p style='margin-top: 10px;'><strong style='color: #e65100;'>🎯 Mẹo làm bài trong 3 giây:</strong> Khi thấy cấu trúc <code>Noun (chỉ người) + who + _____ + Noun (tân ngữ)</code>, khoảng trống 100% bắt buộc phải là một <strong>Động từ chia thì chủ động</strong>. Hãy kiểm tra danh từ phía trước là số ít hay số nhiều để chọn dạng chia đúng của động từ.</p></div>",
    vocab: "<ul style='line-height: 1.6;'><li><strong style='color: #0288d1;'>cover a topic</strong> (v.phr): đề cập / bao quát một chủ đề.</li><li><strong style='color: #0288d1;'>host a seminar / event</strong> (v.phr): tổ chức một buổi hội thảo / sự kiện.</li><li><strong style='color: #0288d1;'>information technology (IT)</strong> (n.phr): ngành công nghệ thông tin.</li><li><strong style='color: #0288d1;'>related to + N</strong> (adj.phr): liên quan tới... (= <i>associated with, connected to</i>).</li></ul>",
    trans: "<div style='line-height: 1.6; padding: 8px; background-color: #f9f9f9; border-left: 4px solid #0288d1;'><p style='margin: 0 0 8px 0;'><strong>Dịch nghĩa gốc:</strong> Bảo tàng Khoa học Trung tâm tổ chức các buổi hội thảo trực tuyến bởi các chuyên gia, những người TRÌNH BÀY các chủ đề liên quan đến công nghệ thông tin.</p><p style='margin: 0; font-style: italic; color: #555;'><strong>Dịch tự nhiên:</strong> Bảo tàng Khoa học Trung tâm thường xuyên tổ chức các hội thảo trực tuyến do những chuyên gia am hiểu về công nghệ thông tin trực tiếp giảng dạy.</p></div>"
  }

        {
  id: 115,
  q: "Conradia Computers ______ changed the direction of its marketing strategy last week.",
  options: [
    "thickly",
    "abruptly",
    "formerly",
    "frequently"
  ],
  a: "abruptly",
  exp: {
    correct: "<div style='line-height: 1.6;'><p><strong>a. Phân tích thành phần câu (S–V–O):</strong> Câu mang cấu trúc cơ bản kèm trạng ngữ thời gian xác định ở quá khứ:</p><ul><li><strong>Subject (S):</strong> <code>Conradia Computers</code> (Tên công ty).</li><li><strong>Adverb (A):</strong> <code>abruptly</code> (Trạng từ chỉ cách thức bổ nghĩa trực tiếp cho động từ <i>changed</i>).</li><li><strong>Verb (V):</strong> <code>changed</code> (Động từ chia ở thì Quá khứ đơn).</li><li><strong>Object (O):</strong> <code>the direction of its marketing strategy</code> (Định hướng chiến lược marketing của công ty).</li><li><strong>Adverbial of Time (Trạng ngữ thời gian):</strong> <code>last week</code> (Tuần trước).</li></ul><p><strong>b. Xác định từ loại:</strong> Đứng trước động từ chính <i>changed</i> là vị trí của một <strong>Trạng từ (Adverb)</strong>. Cả 4 phương án đều là trạng từ đuôi <i>-ly</i>, do đó đây là câu hỏi kiểm tra <i>Nghĩa của Trạng từ trong ngữ cảnh (Vocabulary in Context)</i>.</p><p><strong>c. Lý do chọn đáp án:</strong> Động từ <i>change</i> (thay đổi) kết hợp với mốc thời gian <i>last week</i> (chỉ một sự việc đã chốt trong tuần trước). Việc thay đổi một chiến lược doanh nghiệp diễn ra đột ngột phù hợp nhất với trạng từ <span style='color: #2e7d32; font-weight: bold;'>abruptly</span> (đột ngột, bất ngờ).</p></div>",
    wrong: "<ul style='line-height: 1.6; list-style-type: none; padding-left: 0;'><li><strong style='color: #c62828;'>❌ (A) thickly:</strong> Trạng từ chỉ độ dày / dày đặc (VD: <i>thickly sliced bread, thickly populated</i>). Hoàn toàn vô nghĩa khi đi với động từ <i>change</i>.</li><li><strong style='color: #c62828;'>❌ (C) formerly:</strong> Trạng từ chỉ thời gian 'trước đây'. Thường dùng trong cấu trúc <i>formerly known as</i> (trước đây được biết đến là) hoặc mô tả trạng thái quá khứ, không dùng để bổ nghĩa cho hành động bộc phát ở mốc <i>last week</i>.</li><li><strong style='color: #c62828;'>❌ (D) frequently:</strong> Trạng từ chỉ tần suất 'thường xuyên'. Mâu thuẫn về mặt logic khi đi với mốc thời gian cụ thể <i>last week</i> (không thể 'thường xuyên thay đổi' chỉ trong vỏn vẹn tuần trước).</li></ul>",
    grammar: "<div style='line-height: 1.6;'><p><strong>⭐ Bộ Trạng Từ Hay Đi Cùng Động Từ 'CHANGE' Trong TOEIC Part 5</strong></p><p>Khi đề thi TOEIC kiểm tra trạng từ đi kèm với động từ <i>change / adjust / modify</i> (thay đổi/điều chỉnh), đáp án thường rơi vào 2 nhóm cách thức chính: <strong>Thay đổi đột ngột</strong> hoặc <strong>Thay đổi dần dần/từng chút một</strong>.</p><table border='1' style='width: 100%; border-collapse: collapse; border-color: #e0e0e0; margin-top: 10px; font-size: 14px;'><thead style='background-color: #f5f5f5; text-align: left;'><tr><th style='padding: 8px;'>Nhóm cách thức thay đổi</th><th style='padding: 8px;'>Các trạng từ tiêu biểu</th><th style='padding: 8px;'>Ví dụ ngữ cảnh TOEIC</th></tr></thead><tbody><tr><td style='padding: 8px;'><span style='color: #2e7d32; font-weight: bold;'>Đột ngột / Bất ngờ</span></td><td style='padding: 8px;'><strong>abruptly, suddenly, unexpectedly</strong></td><td style='padding: 8px;'>The CEO <strong>abruptly</strong> changed the policy.</td></tr><tr><td style='padding: 8px;'><strong>Dần dần / Từ từ</strong></td><td style='padding: 8px;'>gradually, steadily, incrementally</td><td style='padding: 8px;'>Prices changed <strong>gradually</strong> over time.</td></tr><tr><td style='padding: 8px;'><strong>Đáng kể / Nhiều</strong></td><td style='padding: 8px;'>significantly, drastically, dramatically</td><td style='padding: 8px;'>The schedule was <strong>drastically</strong> changed.</td></tr></tbody></table><p style='margin-top: 10px;'><strong style='color: #e65100;'>🎯 Mẹo làm bài trong 3 giây:</strong> Phân loại nhóm chức năng của trạng từ: Trạng từ chỉ cách thức (<i>abruptly</i>), Trạng từ chỉ tần suất (<i>frequently</i>), Trạng từ chỉ thời gian (<i>formerly</i>). Nếu động từ miêu tả hành động đơn lẻ trong quá khứ, hãy ưu tiên chọn <strong>Trạng từ chỉ cách thức (Manner)</strong>.</p></div>",
    vocab: "<ul style='line-height: 1.6;'><li><strong style='color: #0288d1;'>abruptly change</strong> (v.phr): đột ngột thay đổi (= <i>suddenly change</i>).</li><li><strong style='color: #0288d1;'>marketing strategy</strong> (n.phr): chiến lược tiếp thị / marketing.</li><li><strong style='color: #0288d1;'>change direction</strong> (v.phr): thay đổi định hướng / phương hướng.</li><li><strong style='color: #0288d1;'>formerly known as</strong> (expr): trước đây được biết đến với tên gọi là...</li></ul>",
    trans: "<div style='line-height: 1.6; padding: 8px; background-color: #f9f9f9; border-left: 4px solid #0288d1;'><p style='margin: 0 0 8px 0;'><strong>Dịch nghĩa gốc:</strong> Công ty Conradia Computers đã ĐỘT NGỘT thay đổi định hướng chiến lược tiếp thị của mình vào tuần trước.</p><p style='margin: 0; font-style: italic; color: #555;'><strong>Dịch tự nhiên:</strong> Tuần trước, Conradia Computers đã bất ngờ xoay trục định hướng chiến lược marketing của mình.</p></div>"
  }

        {
  id: 116,
  q: "Because of an abundance of ______ candidates, Xaniper Industries may take longer than expected to name a new CEO.",
  options: [
    "qualify",
    "qualifier",
    "qualified",
    "qualifies"
  ],
  a: "qualified",
  exp: {
    correct: "<div style='line-height: 1.6;'><p><strong>a. Phân tích thành phần câu (S–V–O):</strong> Câu gồm cụm giới từ chỉ nguyên nhân mở đầu và mệnh đề chính:</p><ul><li><strong>Prepositional Phrase (Cụm giới từ chỉ nguyên nhân):</strong> <code>Because of an abundance of qualified candidates</code> (Do có rất nhiều ứng viên đủ tiêu chuẩn). Trong đó <i>because of</i> là giới từ, <i>an abundance</i> là danh từ chính, <i>qualified candidates</i> là cụm danh từ làm tân ngữ của giới từ <i>of</i>.</li><li><strong>Subject (S):</strong> <code>Xaniper Industries</code> (Tên tập đoàn/công ty).</li><li><strong>Verb (V - Modal Verb):</strong> <code>may take</code> (Có thể sẽ mất/tốn).</li><li><strong>Complement & Purpose Clause:</strong> <code>longer than expected to name a new CEO</code> (Thời gian lâu hơn dự kiến để bổ nhiệm một CEO mới).</li></ul><p><strong>b. Xác định từ loại:</strong> Khoảng trống đứng ngay trước danh từ chỉ người số nhiều <code>candidates</code> (các ứng viên). Vị trí này bắt buộc cần một <strong>Tính từ (Adjective)</strong> để bổ nghĩa cho danh từ phía sau.</p><p><strong>c. Lý do chọn đáp án:</strong> Quá khứ phân từ <span style='color: #2e7d32; font-weight: bold;'>qualified</span> đóng vai trò là một tính từ hoàn chỉnh mang nghĩa 'đủ tiêu chuẩn, đủ năng lực' (<i>qualified candidates = ứng viên đủ tiêu chuẩn</i>).</p></div>",
    wrong: "<ul style='line-height: 1.6; list-style-type: none; padding-left: 0;'><li><strong style='color: #c62828;'>❌ (A) qualify:</strong> Động từ nguyên mẫu (Verb) mang nghĩa 'làm cho đủ điều kiện'. Không đứng trực tiếp trước danh từ để bổ nghĩa (Không dùng <i>qualify candidates</i>).</li><li><strong style='color: #c62828;'>❌ (B) qualifier:</strong> Danh từ (Noun) mang nghĩa 'người thắng vòng loại / từ bổ nghĩa'. Đặt vào tạo thành hai danh từ đứng cạnh nhau bị mâu thuẫn về mặt ngữ nghĩa.</li><li><strong style='color: #c62828;'>❌ (D) qualifies:</strong> Động từ chia ở thì Hiện tại đơn ngôi thứ ba số ít (<i>he/she/it qualifies</i>). Sai hoàn toàn về mặt ngữ pháp từ loại khi đứng trước danh từ.</li></ul>",
    grammar: "<div style='line-height: 1.6;'><p><strong>⭐ Bộ Tính Từ Dạng V-ed Chỉ Trạng Thái / Năng Lực Của Nhân Sự Trong TOEIC</strong></p><p>Trong các chủ đề về Tuyển dụng (Recruitment), Nhân sự (Human Resources) và Văn phòng, rất nhiều Quá khứ phân từ (V-ed) được sử dụng cố định như một Tính từ để miêu tả đặc điểm/năng lực của ứng viên hoặc nhân viên.</p><table border='1' style='width: 100%; border-collapse: collapse; border-color: #e0e0e0; margin-top: 10px; font-size: 14px;'><thead style='background-color: #f5f5f5; text-align: left;'><tr><th style='padding: 8px;'>Tính từ V-ed phổ biến</th><th style='padding: 8px;'>Dịch nghĩa</th><th style='padding: 8px;'>Cụm danh từ thường gặp (Collocations)</th></tr></thead><tbody><tr><td style='padding: 8px;'><span style='color: #2e7d32; font-weight: bold;'>qualified</span></td><td style='padding: 8px;'>Đủ tiêu chuẩn, đủ năng lực</td><td style='padding: 8px;'><strong>qualified candidates / applicants</strong></td></tr><tr><td style='padding: 8px;'>experienced</td><td style='padding: 8px;'>Có kinh nghiệm, lành nghề</td><td style='padding: 8px;'>experienced workers / professionals</td></tr><tr><td style='padding: 8px;'>certified</td><td style='padding: 8px;'>Được cấp chứng chỉ, chứng nhận</td><td style='padding: 8px;'>certified accountants / technicians</td></tr><tr><td style='padding: 8px;'>preferred</td><td style='padding: 8px;'>Được ưu tiên, lựa chọn hàng đầu</td><td style='padding: 8px;'>preferred qualifications / candidates</td></tr></tbody></table><p style='margin-top: 10px;'><strong style='color: #e65100;'>🎯 Mẹo làm bài trong 3 giây:</strong> Khi thấy cấu trúc <code>______ + candidates / applicants / staff / employees</code> và các phương án xuất phát từ cùng một gốc từ, hãy tìm ngay Tính từ đuôi <span style='color: #2e7d32; font-weight: bold;'>-ed</span> chỉ năng lực/tiêu chuẩn.</p></div>",
    vocab: "<ul style='line-height: 1.6;'><li><strong style='color: #0288d1;'>qualified candidates</strong> (n.phr): các ứng viên đủ tiêu chuẩn / năng lực.</li><li><strong style='color: #0288d1;'>an abundance of + N</strong> (expr): sự dồi dào, rất nhiều (= <i>a large quantity/number of</i>).</li><li><strong style='color: #0288d1;'>name a new CEO</strong> (v.phr): bổ nhiệm / chỉ định một CEO mới (= <i>appoint a new CEO</i>).</li><li><strong style='color: #0288d1;'>take longer than expected</strong> (expr): mất nhiều thời gian hơn dự kiến.</li></ul>",
    trans: "<div style='line-height: 1.6; padding: 8px; background-color: #f9f9f9; border-left: 4px solid #0288d1;'><p style='margin: 0 0 8px 0;'><strong>Dịch nghĩa gốc:</strong> Do có quá nhiều ứng viên ĐỦ TIÊU CHUẨN, Xaniper Industries có thể sẽ mất nhiều thời gian hơn dự kiến để bổ nhiệm một tân CEO.</p><p style='margin: 0; font-style: italic; color: #555;'><strong>Dịch tự nhiên:</strong> Vì số lượng hồ sơ ứng viên đạt yêu cầu là rất lớn, Xaniper Industries có thể phải tốn nhiều thời gian hơn dự kiến để chọn ra Giám đốc điều hành mới.</p></div>"
  }

        {
  id: 117,
  q: "All of our tablet computers come with a one-year warranty ______ includes hardware repairs and replacements.",
  options: [
    "that",
    "who",
    "what",
    "it"
  ],
  a: "that",
  exp: {
    correct: "<div style='line-height: 1.6;'><p><strong>a. Phân tích thành phần câu (S–V–O):</strong> Câu dạng phức bao gồm mệnh đề chính và mệnh đề quan hệ bổ nghĩa:</p><ul><li><strong>Main Clause (Mệnh đề chính):</strong><ul><li><strong>Subject (S):</strong> <code>All of our tablet computers</code> (Tất cả máy tính bảng của chúng tôi).</li><li><strong>Verb (V):</strong> <code>come with</code> (Đi kèm với).</li><li><strong>Object (O):</strong> <code>a one-year warranty</code> (Gói bảo hành một năm - Danh từ chỉ vật).</li></ul></li><li><strong>Relative Clause (Mệnh đề quan hệ):</strong> <code>that includes hardware repairs and replacements</code> (Bao gồm sửa chữa và thay thế phần cứng). Mệnh đề này bổ nghĩa trực tiếp cho danh từ <i>a one-year warranty</i> đứng ngay trước nó.</li></ul><p><strong>b. Xác định từ loại:</strong> Chỗ trống đứng ngay sau danh từ chỉ vật <code>a one-year warranty</code> và đứng trước động từ <code>includes</code>. Vị trí này cần một <strong>Đại từ quan hệ (Relative Pronoun)</strong> thay thế cho danh từ chỉ vật và làm Chủ ngữ cho mệnh đề phía sau.</p><p><strong>c. Lý do chọn đáp án:</strong> <span style='color: #2e7d32; font-weight: bold;'>that</span> là đại từ quan hệ duy nhất phù hợp để thay thế cho danh từ chỉ vật (<i>a one-year warranty</i>) và đóng vai trò làm Chủ ngữ chỉ định trong mệnh đề quan hệ.</p></div>",
    wrong: "<ul style='line-height: 1.6; list-style-type: none; padding-left: 0;'><li><strong style='color: #c62828;'>❌ (B) who:</strong> Đại từ quan hệ chỉ dùng để thay thế cho danh từ chỉ người (VD: <i>customers who buy, employees who work</i>). Không dùng cho vật <i>warranty</i>.</li><li><strong style='color: #c62828;'>❌ (C) what:</strong> Đại từ bản thân nó đã chứa danh từ (<i>what = the thing that</i>), do đó <strong>không bao giờ</strong> đứng ngay sau một danh từ xác định để làm đại từ quan hệ (Không dùng <i>a warranty what includes...</i>).</li><li><strong style='color: #c62828;'>❌ (D) it:</strong> Đại từ nhân xưng đóng vai trò chủ ngữ độc lập. Nếu dùng <i>it</i> sẽ tạo thành lỗi 'Run-on sentence' (2 mệnh đề nối liền không có từ liên kết / đại từ quan hệ).</li></ul>",
    grammar: "<div style='line-height: 1.6;'><p><strong>⭐ Phân Biệt Nhanh Các Từ Dễ Nhầm Lẫn Trong Dạng Bài Mệnh Đề Quan Hệ</strong></p><p>TOEIC Part 5 rất hay cài bẫy giữa Đại từ quan hệ (<i>that/which</i>), Đại từ nhân xưng (<i>it/they</i>) và Nghi vấn từ/Mệnh đề danh ngữ (<i>what</i>).</p><table border='1' style='width: 100%; border-collapse: collapse; border-color: #e0e0e0; margin-top: 10px; font-size: 14px;'><thead style='background-color: #f5f5f5; text-align: left;'><tr><th style='padding: 8px;'>Từ lựa chọn</th><th style='padding: 8px;'>Đứng sau danh từ?</th><th style='padding: 8px;'>Chức năng trong câu</th><th style='padding: 8px;'>Cấu trúc điển hình</th></tr></thead><tbody><tr><td style='padding: 8px;'><span style='color: #2e7d32; font-weight: bold;'>that / which</span></td><td style='padding: 8px;'><strong>CÓ</strong> (Chỉ vật)</td><td style='padding: 8px;'>Nối mệnh đề & thay thế danh từ đứng trước</td><td style='padding: 8px;'>Noun (vật) + <strong>that/which</strong> + V + O</td></tr><tr><td style='padding: 8px;'>who</td><td style='padding: 8px;'><strong>CÓ</strong> (Chỉ người)</td><td style='padding: 8px;'>Thay thế danh từ chỉ người đứng trước</td><td style='padding: 8px;'>Noun (người) + <strong>who</strong> + V + O</td></tr><tr><td style='padding: 8px;'>what</td><td style='padding: 8px;'><strong>KHÔNG</strong></td><td style='padding: 8px;'>Mở đầu Mệnh đề danh ngữ làm S hoặc O</td><td style='padding: 8px;'>V / Prep + <strong>what</strong> + S + V</td></tr><tr><td style='padding: 8px;'>it</td><td style='padding: 8px;'><strong>KHÔNG</strong></td><td style='padding: 8px;'>Chủ ngữ câu độc lập (không có tính nối)</td><td style='padding: 8px;'>S + V. <strong>It</strong> + V + O.</td></tr></tbody></table><p style='margin-top: 10px;'><strong style='color: #e65100;'>🎯 Mẹo làm bài trong 3 giây:</strong> Khi thấy công thức <code>Noun (vật) + ______ + Verb</code>, chọn ngay <span style='color: #2e7d32; font-weight: bold;'>that</span> hoặc <i>which</i>.</p></div>",
    vocab: "<ul style='line-height: 1.6;'><li><strong style='color: #0288d1;'>one-year warranty</strong> (n.phr): chế độ / thời hạn bảo hành một năm.</li><li><strong style='color: #0288d1;'>come with</strong> (v.phr): đi kèm với, bao gồm.</li><li><strong style='color: #0288d1;'>hardware repairs and replacements</strong> (n.phr): việc sửa chữa và thay thế linh kiện phần cứng.</li><li><strong style='color: #0288d1;'>extended warranty</strong> (n.phr): gói bảo hành mở rộng.</li></ul>",
    trans: "<div style='line-height: 1.6; padding: 8px; background-color: #f9f9f9; border-left: 4px solid #0288d1;'><p style='margin: 0 0 8px 0;'><strong>Dịch nghĩa gốc:</strong> Tất cả các máy tính bảng của chúng tôi đều đi kèm với chế độ bảo hành một năm, CÁI MÀ bao gồm việc sửa chữa và thay thế phần cứng.</p><p style='margin: 0; font-style: italic; color: #555;'><strong>Dịch tự nhiên:</strong> Tất cả máy tính bảng của chúng tôi đều được bảo hành một năm, bao gồm dịch vụ sửa chữa và thay thế linh kiện phần cứng.</p></div>"
  }
},
        {
  id: 118,
  q: "The Expirite Foundation Board of Directors is ______ of nine members who are elected annually by the public.",
  options: [
    "expected",
    "described",
    "composed",
    "announced"
  ],
  a: "composed",
  exp: {
    correct: "<div style='line-height: 1.6;'><p><strong>a. Phân tích thành phần câu (S–V–C):</strong> Câu dạng phức chứa mệnh đề quan hệ bị động bổ nghĩa cho danh từ:</p><ul><li><strong>Main Clause (Mệnh đề chính):</strong><ul><li><strong>Subject (S):</strong> <code>The Expirite Foundation Board of Directors</code> (Hội đồng quản trị Quỹ Expirite).</li><li><strong>Verb (V - Linking Verb):</strong> <code>is</code> (Tobe chia số ít theo chủ ngữ <i>Board</i>).</li><li><strong>Subject Complement (C - Cụm tính từ/phân từ):</strong> <code>composed of nine members</code> (Bao gồm chín thành viên).</li></ul></li><li><strong>Relative Clause (Mệnh đề quan hệ bổ nghĩa):</strong> <code>who are elected annually by the public</code> (Những người được bầu chọn hàng năm bởi công chúng). Mệnh đề bị động này bổ nghĩa trực tiếp cho danh từ <i>nine members</i>.</li></ul><p><strong>b. Xác định từ loại & Cấu trúc:</strong> Chỗ trống đứng sau Động từ Tobe <code>is</code> và đứng ngay trước Giới từ <code>of</code>. Vị trí này yêu cầu một Quá khứ phân từ (V-ed) ghép với <i>is ... of</i> để tạo thành một <strong>Collocation (Cụm từ cố định)</strong> hoàn chỉnh.</p><p><strong>c. Lý do chọn đáp án:</strong> Ta có cụm từ cố định <span style='color: #2e7d32; font-weight: bold;'>be composed of</span> mang nghĩa 'bao gồm / được cấu thành từ'. Do đó <strong>composed</strong> là đáp án đúng duy nhất.</p></div>",
    wrong: "<ul style='line-height: 1.6; list-style-type: none; padding-left: 0;'><li><strong style='color: #c62828;'>❌ (A) expected:</strong> Được mong đợi. Cụm cấu trúc đúng phải là <i>be expected to + V-inf</i> (Được kỳ vọng làm gì) hoặc <i>be expected by...</i>. Không đi với giới từ <i>of</i>.</li><li><strong style='color: #c62828;'>❌ (B) described:</strong> Được miêu tả/mô tả. Cụm cấu trúc đúng phải là <i>be described as...</i> (Được mô tả như là). Không đi với <i>of</i>.</li><li><strong style='color: #c62828;'>❌ (D) announced:</strong> Được công bố. Cụm cấu trúc đúng là <i>be announced by / to...</i> (Được công bố bởi / tới). Không dùng <i>be announced of</i>.</li></ul>",
    grammar: "<div style='line-height: 1.6;'><p><strong>⭐ Bộ Cụm Từ 'BAO GỒM / CẤU THÀNH TỪ' Kinh Điển Trong TOEIC Part 5</strong></p><p>Để diễn tả ý nghĩa một tổ chức, ủy ban hay sản phẩm 'bao gồm những phần/thành viên nào', TOEIC kiểm tra 3 cụm từ rất dễ nhầm lẫn về mặt cấu trúc dưới đây:</p><table border='1' style='width: 100%; border-collapse: collapse; border-color: #e0e0e0; margin-top: 10px; font-size: 14px;'><thead style='background-color: #f5f5f5; text-align: left;'><tr><th style='padding: 8px;'>Cụm từ cố định</th><th style='padding: 8px;'>Có Tobe 'Be'?</th><th style='padding: 8px;'>Giới từ đi kèm</th><th style='padding: 8px;'>Ví dụ minh họa TOEIC</th></tr></thead><tbody><tr><td style='padding: 8px;'><span style='color: #2e7d32; font-weight: bold;'>be composed of</span></td><td style='padding: 8px;'><strong>CÓ</strong> (is / are / was...)</td><td style='padding: 8px;'><strong>of</strong></td><td style='padding: 8px;'>The board <strong>is composed of</strong> 9 members.</td></tr><tr><td style='padding: 8px;'>consist of</td><td style='padding: 8px;'><strong style='color: #c62828;'>KHÔNG</strong> (Chủ động)</td><td style='padding: 8px;'><strong>of</strong></td><td style='padding: 8px;'>The team <strong>consists of</strong> 5 engineers.</td></tr><tr><td style='padding: 8px;'>be made up of</td><td style='padding: 8px;'><strong>CÓ</strong> (is / are / was...)</td><td style='padding: 8px;'><strong>of</strong></td><td style='padding: 8px;'>The committee <strong>is made up of</strong> experts.</td></tr></tbody></table><p style='margin-top: 10px;'><strong style='color: #e65100;'>🎯 Mẹo làm bài trong 3 giây:</strong> Khi thấy công thức <code>be + ______ + of</code>, nghĩ ngay đến <span style='color: #2e7d32; font-weight: bold;'>composed</span> (hoặc <i>made up</i>). Nếu KHÔNG có <i>be</i> phía trước, chọn <i>consists of</i>.</p></div>",
    vocab: "<ul style='line-height: 1.6;'><li><strong style='color: #0288d1;'>be composed of</strong> (v.phr): bao gồm, được tạo thành từ (= <i>consist of / be made up of</i>).</li><li><strong style='color: #0288d1;'>Board of Directors</strong> (n.phr): Hội đồng Quản trị (viết tắt: BOD).</li><li><strong style='color: #0288d1;'>elect someone annually</strong> (v.phr): bầu chọn ai đó hàng năm.</li><li><strong style='color: #0288d1;'>foundation</strong> (n): quỹ / tổ chức từ thiện / sự thành lập.</li></ul>",
    trans: "<div style='line-height: 1.6; padding: 8px; background-color: #f9f9f9; border-left: 4px solid #0288d1;'><p style='margin: 0 0 8px 0;'><strong>Dịch nghĩa gốc:</strong> Hội đồng quản trị Quỹ Expirite BAO GỒM chín thành viên, những người được công chúng bầu chọn hằng năm.</p><p style='margin: 0; font-style: italic; color: #555;'><strong>Dịch tự nhiên:</strong> Hội đồng quản trị của Quỹ Expirite gồm 9 thành viên do người dân bầu chọn mỗi năm.</p></div>"

  q: "Mortgage brokers generally prefer to review all the financial documents ______ meeting with a new client.",
  options: [
    "toward",
    "further",
    "lately",
    "before"
  ],
  a: "before",
  exp: {
    correct: "<div style='line-height: 1.6;'><p><strong>a. Phân tích thành phần câu (S–V–O):</strong> Câu mang cấu trúc câu đơn hoàn chỉnh kèm cụm trạng ngữ chỉ thời gian:</p><ul><li><strong>Subject (S):</strong> <code>Mortgage brokers</code> (Các chuyên viên môi giới thế chấp).</li><li><strong>Adverb (A):</strong> <code>generally</code> (Thường, nhìn chung).</li><li><strong>Verb (V):</strong> <code>prefer to review</code> (Thích/ưu tiên xem xét).</li><li><strong>Object (O):</strong> <code>all the financial documents</code> (Tất cả các tài liệu tài chính).</li><li><strong>Adverbial of Time (Trạng ngữ thời gian):</strong> <code>before meeting with a new client</code> (Trước khi gặp gỡ một khách hàng mới).</li></ul><p><strong>b. Xác định từ loại:</strong> Phía sau chỗ trống là danh động từ <code>meeting</code> (dạng <i>V-ing</i>). Vị trí này yêu cầu một <strong>Giới từ chỉ thời gian (Preposition of time)</strong> để liên kết mệnh đề chính với hành động diễn ra theo trình tự thời gian.</p><p><strong>c. Lý do chọn đáp án:</strong> Xét theo logic nghiệp vụ tài chính, việc xem xét hồ sơ (<i>review documents</i>) sẽ diễn ra 'trước khi' gặp trực tiếp khách hàng. Giới từ <span style='color: #2e7d32; font-weight: bold;'>before</span> thỏa mãn hoàn toàn cả về ngữ pháp (<i>Before + V-ing</i>) lẫn ngữ nghĩa.</p></div>",
    wrong: "<ul style='line-height: 1.6; list-style-type: none; padding-left: 0;'><li><strong style='color: #c62828;'>❌ (A) toward:</strong> Giới từ chỉ phương hướng 'hướng về phía' (VD: <i>walk toward the exit</i>). Không đi với <i>V-ing</i> để diễn tả trình tự thời gian làm việc.</li><li><strong style='color: #c62828;'>❌ (B) further:</strong> Tính từ/Trạng từ mang nghĩa 'xa hơn, thêm nữa' (VD: <i>further information</i>). Không đóng vai trò là một giới từ đứng trước <i>V-ing</i>.</li><li><strong style='color: #c62828;'>❌ (C) lately:</strong> Trạng từ chỉ thời gian mang nghĩa 'gần đây' (= <i>recently</i>). Thường đứng ở cuối câu hoặc đi với thì Hiện tại hoàn thành, không dùng trực tiếp trước danh động từ <i>V-ing</i>.</li></ul>",
    grammar: "<div style='line-height: 1.6;'><p><strong>⭐ Bộ Giới Từ Đi Kèm Với Danh Động Từ (V-ing) Thường Gặp Nhất Trong TOEIC</strong></p><p>Trong TOEIC Part 5, các giới từ chỉ trình tự, mục đích hoặc phương thức rất hay đứng trực tiếp trước dạng <i>V-ing</i> để rút gọn mệnh đề.</p><table border='1' style='width: 100%; border-collapse: collapse; border-color: #e0e0e0; margin-top: 10px; font-size: 14px;'><thead style='background-color: #f5f5f5; text-align: left;'><tr><th style='padding: 8px;'>Giới từ</th><th style='padding: 8px;'>Cấu trúc với V-ing</th><th style='padding: 8px;'>Ý nghĩa ngữ pháp</th><th style='padding: 8px;'>Ví dụ TOEIC</th></tr></thead><tbody><tr><td style='padding: 8px;'><span style='color: #2e7d32; font-weight: bold;'>before / after</span></td><td style='padding: 8px;'><strong>before / after + V-ing</strong></td><td style='padding: 8px;'>Trước khi / Sau khi làm gì</td><td style='padding: 8px;'><strong>before signing</strong> the agreement</td></tr><tr><td style='padding: 8px;'>without</td><td style='padding: 8px;'>without + V-ing</td><td style='padding: 8px;'>Mạch văn 'mà không làm gì'</td><td style='padding: 8px;'>without <strong>checking</strong> the details</td></tr><tr><td style='padding: 8px;'>by</td><td style='padding: 8px;'>by + V-ing</td><td style='padding: 8px;'>Bằng cách / Nhờ vào việc</td><td style='padding: 8px;'>by <strong>reducing</strong> operating costs</td></tr><tr><td style='padding: 8px;'>upon / on</td><td style='padding: 8px;'>upon + V-ing</td><td style='padding: 8px;'>Ngay khi làm gì (= <i>as soon as</i>)</td><td style='padding: 8px;'>upon <strong>arriving</strong> at the airport</td></tr></tbody></table><p style='margin-top: 10px;'><strong style='color: #e65100;'>🎯 Mẹo làm bài trong 3 giây:</strong> Nhìn phía sau chỗ trống thấy <code>V-ing</code>, ưu tiên kiểm tra các Giới từ kinh điển như <span style='color: #2e7d32; font-weight: bold;'>before, after, by, without, upon</span>.</p></div>",
    vocab: "<ul style='line-height: 1.6;'><li><strong style='color: #0288d1;'>mortgage broker</strong> (n.phr): chuyên viên / nhà môi giới thế chấp (vay ngân hàng).</li><li><strong style='color: #0288d1;'>financial document</strong> (n.phr): hồ sơ / tài liệu tài chính.</li><li><strong style='color: #0288d1;'>before meeting with...</strong> (prep.phr): trước khi gặp gỡ với...</li><li><strong style='color: #0288d1;'>prefer to + V-inf</strong> (v.phr): thích / ưu tiên làm gì hơn.</li></ul>",
    trans: "<div style='line-height: 1.6; padding: 8px; background-color: #f9f9f9; border-left: 4px solid #0288d1;'><p style='margin: 0 0 8px 0;'><strong>Dịch nghĩa gốc:</strong> Các chuyên viên môi giới thế chấp thường thích xem xét toàn bộ các tài liệu tài chính TRƯỚC KHI gặp gỡ một khách hàng mới.</p><p style='margin: 0; font-style: italic; color: #555;'><strong>Dịch tự nhiên:</strong> Nhìn chung, các chuyên viên môi giới vay thế chấp luôn ưu tiên nghiên cứu kỹ hồ sơ tài chính trước khi tiếp xúc với khách hàng mới.</p></div>"

  id: 120,
  q: "Management ______ candidates for promotion by the end of the month.",
  options: [
    "identify",
    "identifying",
    "will identify",
    "to identify"
  ],
  a: "will identify",
  exp: {
    correct: "<div style='line-height: 1.6;'><p><strong>a. Phân tích thành phần câu (S–V–O):</strong> Câu mang cấu trúc câu đơn hoàn chỉnh chứa trạng ngữ thời gian chỉ tương lai:</p><ul><li><strong>Subject (S):</strong> <code>Management</code> (Ban quản lý - Danh từ tập hợp số ít).</li><li><strong>Verb (V):</strong> <code>will identify</code> (Động từ chia ở thì Tương lai đơn - Sẽ xác định/lựa chọn).</li><li><strong>Object (O):</strong> <code>candidates for promotion</code> (Các ứng viên cho việc thăng chức).</li><li><strong>Adverbial of Time (Trạng ngữ thời gian):</strong> <code>by the end of the month</code> (Trước/vào thời điểm cuối tháng này).</li></ul><p><strong>b. Xác định từ loại:</strong> Chỗ trống đứng sau Chủ ngữ <code>Management</code> và trước Tân ngữ <code>candidates</code>. Vị trí này bắt buộc phải là một <strong>Động từ chính (Finite Verb)</strong> được chia theo thì của câu.</p><p><strong>c. Lý do chọn đáp án:</strong> Cụm trạng ngữ thời gian <i>by the end of the month</i> mang ý nghĩa hướng tới một mốc thời gian trong tương lai. Do đó động từ cần chia ở thì Tương lai. Đáp án <span style='color: #2e7d32; font-weight: bold;'>will identify</span> thỏa mãn hoàn toàn cả về ngữ pháp lẫn ngữ nghĩa.</p></div>",
    wrong: "<ul style='line-height: 1.6; list-style-type: none; padding-left: 0;'><li><strong style='color: #c62828;'>❌ (A) identify:</strong> Động từ nguyên mẫu. Nếu dùng ở thì Hiện tại đơn với chủ ngữ số ít <i>Management</i> thì động từ bắt buộc phải chia đuôi <i>-es</i> (<i>identifies</i>). Ngoài ra, câu có mốc thời gian tương lai nên dùng hiện tại đơn là không hợp lý.</li><li><strong style='color: #c62828;'>❌ (B) identifying:</strong> Dạng V-ing. Không thể đứng một mình đóng vai trò làm động từ chính của câu khi thiếu trợ động từ Tobe (<i>is/are identifying</i>).</li><li><strong style='color: #c62828;'>❌ (D) to identify:</strong> Dạng To-V (Động từ nguyên mẫu có 'to'). Không bao giờ làm động từ chia thì chính cho chủ ngữ.</li></ul>",
    grammar: "<div style='line-height: 1.6;'><p><strong>⭐ Dấu Hiệu Thì Tương Lai Với Giới Từ 'BY + MỐC THỜI GIAN' Trong TOEIC</strong></p><p>Trong TOEIC Part 5, cụm từ <code>By + [Mốc thời gian tương lai]</code> (mang nghĩa: trước/vào thời điểm nào đó) là dấu hiệu nhận biết rất quan trọng của các thì Tương lai.</p><table border='1' style='width: 100%; border-collapse: collapse; border-color: #e0e0e0; margin-top: 10px; font-size: 14px;'><thead style='background-color: #f5f5f5; text-align: left;'><tr><th style='padding: 8px;'>Cụm từ nhận biết</th><th style='padding: 8px;'>Thì thường dùng</th><th style='padding: 8px;'>Cấu trúc</th><th style='padding: 8px;'>Ví dụ TOEIC</th></tr></thead><tbody><tr><td style='padding: 8px;'><span style='color: #2e7d32; font-weight: bold;'>by the end of the month / year</span></td><td style='padding: 8px;'>Tương lai đơn / TL Hoàn thành</td><td style='padding: 8px;'><strong>will + V-inf</strong> / <strong>will have + V3</strong></td><td style='padding: 8px;'>We <strong>will decide</strong> by Friday.</td></tr><tr><td style='padding: 8px;'>by next week / month</td><td style='padding: 8px;'>Tương lai đơn / TL Hoàn thành</td><td style='padding: 8px;'><strong>will + V-inf</strong></td><td style='padding: 8px;'>The board <strong>will meet</strong> by next Monday.</td></tr><tr><td style='padding: 8px;'>by the time + S + V(pres)</td><td style='padding: 8px;'>Tương lai hoàn thành</td><td style='padding: 8px;'><strong>will have + V3/ed</strong></td><td style='padding: 8px;'>By the time he arrives, we <strong>will have left</strong>.</td></tr></tbody></table><p style='margin-top: 10px;'><strong style='color: #e65100;'>🎯 Mẹo làm bài trong 3 giây:</strong><br>1. Loại ngay dạng không thể làm động từ chính: <code>V-ing</code> (<i>identifying</i>) và <code>To-V</code> (<i>to identify</i>).<br>2. Thấy cụm <i>by the end of...</i> chọn ngay dạng động từ thì Tương lai <span style='color: #2e7d32; font-weight: bold;'>will + V-inf</span>.</p></div>",
    vocab: "<ul style='line-height: 1.6;'><li><strong style='color: #0288d1;'>identify candidates</strong> (v.phr): xác định / tìm kiếm / lựa chọn ứng viên.</li><li><strong style='color: #0288d1;'>candidates for promotion</strong> (n.phr): các ứng viên để xét thăng chức.</li><li><strong style='color: #0288d1;'>by the end of the month</strong> (expr): trước / vào thời điểm cuối tháng.</li><li><strong style='color: #0288d1;'>eligible for promotion</strong> (adj.phr): đủ điều kiện để được thăng tiến.</li></ul>",
    trans: "<div style='line-height: 1.6; padding: 8px; background-color: #f9f9f9; border-left: 4px solid #0288d1;'><p style='margin: 0 0 8px 0;'><strong>Dịch nghĩa gốc:</strong> Ban quản lý SẼ XÁC ĐỊNH các ứng viên để thăng chức trước thời điểm cuối tháng này.</p><p style='margin: 0; font-style: italic; color: #555;'><strong>Dịch tự nhiên:</strong> Trước khi hết tháng này, ban lãnh đạo sẽ lựa chọn ra danh sách các ứng viên được đề bạt thăng chức.</p></div>"
