  {
    "id": 117,
    "q": "The ------- in the brochure are an accurate representation of what guests staying at the resort can expect to find.",
    "options": [
      "image",
      "images",
      "imaged",
      "imaging"
    ],
    "a": "images",
    "exp": {
      "correct": "<div style='line-height: 1.6;'><p><strong>a. Phân tích thành phần câu:</strong></p><ul><li><strong>Subject (S):</strong> <code>The _______ in the brochure</code> (Cụm chủ ngữ).</li><li><strong>Verb (V):</strong> <code>are</code> (Động từ to-be chia ở số nhiều).</li><li><strong>Complement (C):</strong> <code>an accurate representation...</code></li></ul><p><strong>b. Xác định từ loại:</strong> Đứng sau mạo từ <i>The</i> và đứng trước cụm giới từ <i>in the brochure</i> làm chủ ngữ cho động từ <b>are</b>, vị trí này bắt buộc phải là một <strong>Danh từ số nhiều (Plural Noun)</strong>.</p><p><strong>c. Lý do chọn đáp án:</strong> Động từ chính của câu là <b>are</b> (số nhiều), do đó chủ ngữ chính phải chọn đáp án danh từ số nhiều <span style='color: #2e7d32; font-weight: bold;'>images</span> để đảm bảo sự hòa hợp Chủ ngữ - Động từ (Subject-Verb Agreement).</p></div>",
      "wrong": "<ul style='line-height: 1.6; list-style-type: none; padding-left: 0;'><li><strong style='color: #c62828;'>❌ (A) image:</strong> Danh từ số ít. Nếu làm chủ ngữ thì động từ phải là 'is', không dùng với 'are'.</li><li><strong style='color: #c62828;'>❌ (C) imaged:</strong> Động từ dạng quá khứ / phân từ II, không phù hợp làm chủ ngữ chính.</li><li><strong style='color: #c62828;'>❌ (D) imaging:</strong> Danh từ dạng V-ing (việc tạo ảnh/hình ảnh y khoa), không phù hợp ngữ cảnh và là danh từ không đếm được/số ít.</li></ul>",
      "grammar": "<div style='line-height: 1.6;'><p><strong>⭐ Sự hòa hợp Chủ ngữ - Động từ (Subject - Verb Agreement)</strong></p><p>Nhìn nhanh động từ chính của câu để xác định dạng của danh từ chủ ngữ.</p><table border='1' style='width: 100%; border-collapse: collapse; border-color: #e0e0e0; margin-top: 10px; font-size: 14px;'><thead style='background-color: #f5f5f5; text-align: left;'><tr><th style='padding: 8px;'>Chủ ngữ</th><th style='padding: 8px;'>Động từ đi kèm</th><th style='padding: 8px;'>Ví dụ</th></tr></thead><tbody><tr><td style='padding: 8px;'><strong>Danh từ số ít / Không đếm được</strong></td><td style='padding: 8px;'>is / wash / has</td><td style='padding: 8px;'>The <strong>image is</strong> clear.</td></tr><tr><td style='padding: 8px;'><strong>Danh từ số nhiều (-s/-es)</strong></td><td style='padding: 8px;'>are / wash / have</td><td style='padding: 8px;'>The <strong>images are</strong> clear.</td></tr></tbody></table><p style='margin-top: 10px;'><strong style='color: #e65100;'>🎯 Mẹo làm bài:</strong> Khi thấy vị trí trống làm chủ ngữ, hãy liếc nhanh ngay phía sau xem động từ là <i>is</i> hay <i>are</i>. Thấy <b>are</b> -> Chọn ngay danh từ số nhiều có đuôi <b>-s/-es</b> (<span style='color: #2e7d32; font-weight: bold;'>images</span>).</p></div>",
      "vocab": "<ul style='line-height: 1.6;'><li><strong style='color: #0288d1;'>brochure</strong> (n): cuốn cẩm nang quảng cáo, tập sách nhỏ.</li><li><strong style='color: #0288d1;'>accurate representation</strong> (n.phr): sự phản ánh / mô tả chính xác.</li><li><strong style='color: #0288d1;'>expect to V</strong> (v.phr): mong đợi làm gì.</li><li><strong style='color: #0288d1;'>resort</strong> (n): khu nghỉ dưỡng.</li></ul>",
      "trans": "<div style='line-height: 1.6; padding: 8px; background-color: #f9f9f9; border-left: 4px solid #0288d1;'><p style='margin: 0 0 8px 0;'><strong>Dịch nghĩa gốc:</strong> Những hình ảnh trong tập quảng cáo là sự mô tả chính xác về những gì khách lưu trú tại khu nghỉ dưỡng có thể mong đợi tìm thấy.</p><p style='margin: 0; font-style: italic; color: #555;'><strong>Dịch tự nhiên:</strong> Hình ảnh trong cuốn quảng cáo phản ánh hoàn toàn chính xác những trải nghiệm thực tế mà du khách có thể tận hưởng tại khu nghỉ dưỡng.</p></div>"
    }
  },
  {
    "id": 118,
    "q": "Current employees interested in the new managerial position should ------- about the internal hiring process.",
    "options": [
      "provide",
      "inquire",
      "evaluate",
      "control"
    ],
    "a": "inquire",
    "exp": {
      "correct": "<div style='line-height: 1.6;'><p><strong>a. Phân tích thành phần câu:</strong></p><ul><li><strong>Chủ ngữ (S):</strong> <code>Current employees interested in the new managerial position</code> (Các nhân viên hiện tại quan tâm đến vị trí quản lý mới).</li><li><strong>Động từ (V):</strong> <code>should _______</code> (Nên làm gì).</li><li><strong>Cụm giới từ:</strong> <code>about the internal hiring process</code> (Về quy trình tuyển dụng nội bộ).</li></ul><p><strong>b. Xác định từ loại:</strong> Đứng sau động từ khuyết thiếu <i>should</i> cần một <strong>Động từ nguyên mẫu (Bare Infinitive)</strong>. Cả 4 phương án đều là động từ nguyên mẫu, do đó cần xét đến ngữ nghĩa và đi kèm giới từ.</p><p><strong>c. Lý do chọn đáp án:</strong> Động từ đi kèm với giới từ <b>about</b> tạo thành cụm <code>inquire about sth</code> có nghĩa là \"hỏi/tìm hiểu thông tin về cái gì\". Do đó chọn <span style='color: #2e7d32; font-weight: bold;'>inquire</span>.</p></div>",
      "wrong": "<ul style='line-height: 1.6; list-style-type: none; padding-left: 0;'><li><strong style='color: #c62828;'>❌ (A) provide:</strong> Thường đi với cấu trúc 'provide sb with sth' hoặc 'provide sth for sb', không đi trực tiếp với 'about'.</li><li><strong style='color: #c62828;'>❌ (C) evaluate:</strong> Là ngoại động từ đi trực tiếp với tân ngữ (evaluate sth), không dùng 'evaluate about'.</li><li><strong style='color: #c62828;'>❌ (D) control:</strong> Là ngoại động từ đi trực tiếp với tân ngữ (control sth), không dùng 'control about'.</li></ul>",
      "grammar": "<div style='line-height: 1.6;'><p><strong>⭐ Động từ đi kèm giới từ (Verb + Preposition Collocations)</strong></p><p>Trong TOEIC Part 5, có nhiều động từ bắt buộc phải đi kèm giới từ cố định đi sau:</p><table border='1' style='width: 100%; border-collapse: collapse; border-color: #e0e0e0; margin-top: 10px; font-size: 14px;'><thead style='background-color: #f5f5f5; text-align: left;'><tr><th style='padding: 8px;'>Cụm Động từ + Giới từ</th><th style='padding: 8px;'>Ý nghĩa</th><th style='padding: 8px;'>Ví dụ TOEIC</th></tr></thead><tbody><tr><td style='padding: 8px;'><strong>inquire about</strong></td><td style='padding: 8px;'>Hỏi / Tìm hiểu về...</td><td style='padding: 8px;'><strong>inquire about</strong> the process / price</td></tr><tr><td style='padding: 8px;'><strong>comply with</strong></td><td style='padding: 8px;'>Tuân thủ...</td><td style='padding: 8px;'><strong>comply with</strong> regulations</td></tr><tr><td style='padding: 8px;'><strong>proceed with</strong></td><td style='padding: 8px;'>Tiến hành...</td><td style='padding: 8px;'><strong>proceed with</strong> the plan</td></tr></tbody></table><p style='margin-top: 10px;'><strong style='color: #e65100;'>🎯 Mẹo làm bài:</strong> Thấy ngay phía sau chỗ trống có giới từ <b>about</b> -> Chọn ngay <span style='color: #2e7d32; font-weight: bold;'>inquire</span> (inquire about = ask about).</p></div>",
      "vocab": "<ul style='line-height: 1.6;'><li><strong style='color: #0288d1;'>inquire about sth</strong> (v.phr): hỏi, tìm hiểu thông tin về cái gì (= ask about).</li><li><strong style='color: #0288d1;'>managerial position</strong> (n.phr): vị trí quản lý.</li><li><strong style='color: #0288d1;'>internal hiring process</strong> (n.phr): quy trình tuyển dụng nội bộ.</li><li><strong style='color: #0288d1;'>be interested in</strong> (adj.phr): quan tâm, hứng thú với cái gì.</li></ul>",
      "trans": "<div style='line-height: 1.6; padding: 8px; background-color: #f9f9f9; border-left: 4px solid #0288d1;'><p style='margin: 0 0 8px 0;'><strong>Dịch nghĩa gốc:</strong> Các nhân viên hiện tại quan tâm đến vị trí quản lý mới nên tìm hiểu về quy trình tuyển dụng nội bộ.</p><p style='margin: 0; font-style: italic; color: #555;'><strong>Dịch tự nhiên:</strong> Nhân viên đang làm việc nếu có nguyện vọng ứng tuyển vào vị trí quản lý mới nên chủ động hỏi thông tin về quy trình tuyển dụng nội bộ.</p></div>"
    }

  {
    "id": 119,
    "q": "Colleagues in the accounting department consider the matter closed and ------- cannot provide more input.",
    "options": [
      "large",
      "consequently",
      "very",
      "anyone"
    ],
    "a": "consequently",
    "exp": {
      "correct": "<div style='line-height: 1.6;'><p><strong>a. Phân tích thành phần câu:</strong></p><ul><li><strong>Mệnh đề 1:</strong> <code>Colleagues in the accounting department consider the matter closed</code> (Các đồng nghiệp ở phòng kế toán xem vấn đề đã được giải quyết xong).</li><li><strong>Liên từ:</strong> <code>and</code></li><li><strong>Mệnh đề 2 (Lược chủ ngữ):</strong> <code>[_______] cannot provide more input</code> (... do đó không thể cung cấp thêm ý kiến).</li></ul><p><strong>b. Xác định từ loại:</strong> Vị trí khoảng trống đứng giữa liên từ <i>and</i> và động từ <i>cannot provide</i> nhằm chỉ quan hệ nguyên nhân - kết quả giữa 2 vế. Do đó cần một <strong>Trạng từ liên kết (Linking Adverb)</strong>.</p><p><strong>c. Lý do chọn đáp án:</strong> Chọn trạng từ <span style='color: #2e7d32; font-weight: bold;'>consequently</span> (vì vậy, do đó) để thể hiện kết quả hợp lý: Vì xem vấn đề đã đóng lại, NÊN họ không thể đóng góp thêm thông tin.</p></div>",
      "wrong": "<ul style='line-height: 1.6; list-style-type: none; padding-left: 0;'><li><strong style='color: #c62828;'>❌ (A) large:</strong> Tính từ (rộng/lớn), không dùng để nối vế câu.</li><li><strong style='color: #c62828;'>❌ (C) very:</strong> Trạng từ chỉ mức độ (rất), chỉ đi trước tính từ hoặc trạng từ khác, không đứng trước động từ khuyết thiếu 'cannot'.</li><li><strong style='color: #c62828;'>❌ (D) anyone:</strong> Đại từ bất định (bất kỳ ai), sai về cả mặt ngữ pháp lẫn ngữ nghĩa.</li></ul>",
      "grammar": "<div style='line-height: 1.6;'><p><strong>⭐ Trạng từ liên kết chỉ Kết quả (Consequence Linking Adverbs)</strong></p><p>Các trạng từ liên kết thường dùng sau 'and' hoặc đứng đầu mệnh đề để diễn tả hệ quả của hành động trước đó:</p><table border='1' style='width: 100%; border-collapse: collapse; border-color: #e0e0e0; margin-top: 10px; font-size: 14px;'><thead style='background-color: #f5f5f5; text-align: left;'><tr><th style='padding: 8px;'>Trạng từ</th><th style='padding: 8px;'>Ý nghĩa</th><th style='padding: 8px;'>Từ đồng nghĩa hay gặp</th></tr></thead><tbody><tr><td style='padding: 8px;'><strong>consequently</strong></td><td style='padding: 8px;'>Vì vậy, do đó, kết quả là</td><td style='padding: 8px;'>therefore, thus, as a result, accordingly</td></tr></tbody></table><p style='margin-top: 10px;'><strong style='color: #e65100;'>🎯 Mẹo làm bài:</strong> Cấu trúc <code>Clause 1 + and + [consequently/therefore] + Verb</code> là cấu trúc rất phổ biến trong TOEIC để chỉ hệ quả logic.</p></div>",
      "vocab": "<ul style='line-height: 1.6;'><li><strong style='color: #0288d1;'>consequently</strong> (adv): kết quả là, vì vậy (= therefore, as a result).</li><li><strong style='color: #0288d1;'>consider sth + Adj/Closed</strong> (v.phr): coi cái gì như thế nào / coi như xong.</li><li><strong style='color: #0288d1;'>accounting department</strong> (n.phr): phòng/bộ phận kế toán.</li><li><strong style='color: #0288d1;'>provide input</strong> (v.phr): cung cấp ý kiến đóng góp/thông tin.</li></ul>",
      "trans": "<div style='line-height: 1.6; padding: 8px; background-color: #f9f9f9; border-left: 4px solid #0288d1;'><p style='margin: 0 0 8px 0;'><strong>Dịch nghĩa gốc:</strong> Các đồng nghiệp trong bộ phận kế toán xem như vấn đề đã được khép lại và do đó không thể cung cấp thêm đóng góp.</p><p style='margin: 0; font-style: italic; color: #555;'><strong>Dịch tự nhiên:</strong> Bộ phận kế toán coi như vụ việc đã giải quyết xong nên sẽ không đưa ra thêm bất kỳ ý kiến nào nữa.</p></div>"
    }

  {
    "id": 120,
    "q": "The CEO hopes that the consultant's advice will ultimately ------- higher profits for the company.",
    "options": [
      "yield",
      "submit",
      "invent",
      "resolve"

    "a": "yield",
    "exp": {
      "correct": "<div style='line-height: 1.6;'><p><strong>a. Phân tích thành phần câu:</strong></p><ul><li><strong>Main Subject & Verb:</strong> <code>The CEO hopes that...</code></li><li><strong>Sub-Subject:</strong> <code>the consultant's advice</code> (Lời khuyên của chuyên gia tư vấn).</li><li><strong>Sub-Verb:</strong> <code>will ultimately _______</code> (Sẽ rốt cuộc...).</li><li><strong>Sub-Object:</strong> <code>higher profits for the company</code> (Lợi nhuận cao hơn cho công ty).</li></ul><p><strong>b. Xác định từ loại:</strong> Đứng sau trợ động từ <i>will</i> và trạng từ <i>ultimately</i> cần một <strong>Động từ nguyên mẫu (Bare Infinitive)</strong>.</p><p><strong>c. Lý do chọn đáp án:</strong> Xét về Collocation trong thương mại, động từ <span style='color: #2e7d32; font-weight: bold;'>yield</span> kết hợp với <i>profits / results / benefits</i> mang nghĩa là \"mang lại / sinh ra (lợi nhuận / kết quả / lợi ích)\". Cụm <code>yield higher profits</code> hoàn toàn chuẩn xác.</p></div>",
      "wrong": "<ul style='line-height: 1.6; list-style-type: none; padding-left: 0;'><li><strong style='color: #c62828;'>❌ (B) submit:</strong> Mang nghĩa 'nộp/đệ trình' (submit a report/application), không dùng với 'profits'.</li><li><strong style='color: #c62828;'>❌ (C) invent:</strong> Mang nghĩa 'phát minh/sáng chế', không dùng cho lợi nhuận tài chính.</li><li><strong style='color: #c62828;'>❌ (D) resolve:</strong> Mang nghĩa 'giải quyết' (resolve a problem/issue/conflict), không đi với 'profits'.</li></ul>",
      "grammar": "<div style='line-height: 1.6;'><p><strong>⭐ Collocation Kinh doanh với động từ YIELD</strong></p><p>Động từ <i>yield</i> rất hay xuất hiện trong các bài đọc và câu hỏi từ vựng thương mại của TOEIC với ý nghĩa \"sinh ra, mang lại\":</p><table border='1' style='width: 100%; border-collapse: collapse; border-color: #e0e0e0; margin-top: 10px; font-size: 14px;'><thead style='background-color: #f5f5f5; text-align: left;'><tr><th style='padding: 8px;'>Cụm Collocation</th><th style='padding: 8px;'>Ý nghĩa</th></tr></thead><tbody><tr><td style='padding: 8px;'><strong>yield profits / revenue</strong></td><td style='padding: 8px;'>Mang lại lợi nhuận / doanh thu</td></tr><tr><td style='padding: 8px;'><strong>yield results / benefits</strong></td><td style='padding: 8px;'>Mang lại kết quả / lợi ích</td></tr><tr><td style='padding: 8px;'><strong>yield a high return</strong></td><td style='padding: 8px;'>Mang lại tỷ suất sinh lời cao</td></tr></tbody></table><p style='margin-top: 10px;'><strong style='color: #e65100;'>🎯 Mẹo làm bài:</strong> Nhìn thấy tân ngữ phía sau là <i>profits/results/revenue</i> -> Ưu tiên chọn ngay <span style='color: #2e7d32; font-weight: bold;'>yield</span> hoặc <i>generate/produce</i>.</p></div>",
      "vocab": "<ul style='line-height: 1.6;'><li><strong style='color: #0288d1;'>yield profits</strong> (v.phr): mang lại/sinh ra lợi nhuận (= generate/produce profits).</li><li><strong style='color: #0288d1;'>ultimately</strong> (adv): cuối cùng, rốt cuộc (= eventually, in the end).</li><li><strong style='color: #0288d1;'>consultant's advice</strong> (n.phr): lời khuyên của chuyên gia tư vấn.</li></ul>",
      "trans": "<div style='line-height: 1.6; padding: 8px; background-color: #f9f9f9; border-left: 4px solid #0288d1;'><p style='margin: 0 0 8px 0;'><strong>Dịch nghĩa gốc:</strong> Giám đốc điều hành hy vọng rằng lời khuyên của chuyên gia tư vấn cuối cùng sẽ mang lại lợi nhuận cao hơn cho công ty.</p><p style='margin: 0; font-style: italic; color: #555;'><strong>Dịch tự nhiên:</strong> CEO kỳ vọng những tư vấn từ chuyên gia rốt cuộc sẽ giúp công ty thu về lợi nhuận cao hơn.</p></div>"
    }

        {
    "id": 121,
    "q": "A team of experts is reviewing the contract from a financial -------, so please do not share it with the client yet.",
    "options": [
      "perspective",
      "belief",
      "movement",
      "proportion"
    ],
    "a": "perspective",
    "exp": {
      "correct": "<div style='line-height: 1.6;'><p><strong>a. Phân tích thành phần câu (S-V-O):</strong> Mệnh đề chính theo sau bởi lời yêu cầu nối bằng liên từ <i>so</i>:</p><ul><li><strong>Chủ ngữ (S):</strong> <code>A team of experts</code> (Một nhóm các chuyên gia).</li><li><strong>Động từ (V):</strong> <code>is reviewing</code> (Đang xem xét).</li><li><strong>Tân ngữ (O):</strong> <code>the contract</code> (Hợp đồng).</li><li><strong>Cụm giới từ:</strong> <code>from a financial perspective</code> (Từ góc độ tài chính).</li></ul><p><strong>b. Xác định từ loại:</strong> Vị trí khoảng trống đứng sau mạo từ + tính từ <i>a financial</i> nên bắt buộc cần một <strong>Danh từ (Noun)</strong> để tạo thành cụm danh từ làm tân ngữ cho giới từ <i>from</i>.</p><p><strong>c. Lý do chọn đáp án:</strong> Xét về mặt kết hợp từ (Collocation), cụm từ <code>from a financial perspective</code> mang nghĩa 'từ góc độ/khía cạnh tài chính'. Vì hợp đồng vẫn đang trong quá trình đánh giá tài chính nên cần bảo mật thông tin với khách hàng.</p></div>",
      "wrong": "<ul style='line-height: 1.6; list-style-type: none; padding-left: 0;'><li><strong style='color: #c62828;'>❌ (B) belief:</strong> Danh từ mang nghĩa 'niềm tin, đức tin'. Không kết hợp với <i>financial</i> trong ngữ cảnh phân tích hợp đồng kinh doanh.</li><li><strong style='color: #c62828;'>❌ (C) movement:</strong> Danh từ mang nghĩa 'sự chuyển động, phong trào'. Hoàn toàn không hợp ngữ nghĩa.</li><li><strong style='color: #c62828;'>❌ (D) proportion:</strong> Danh từ mang nghĩa 'tỷ lệ, sự cân đối'. Không tạo thành collocation tự nhiên với <i>from a financial...</i> trong ngữ cảnh này.</li></ul>",
      "grammar": "<div style='line-height: 1.6;'><p><strong>⭐ Collocation với \"Perspective\" trong TOEIC</strong></p><p>Trong đề thi TOEIC, cấu trúc <i>from a/an + [Adjective] + perspective</i> là một cụm cố định rất phổ biến dùng để chỉ góc nhìn hoặc khía cạnh đánh giá vấn đề.</p><table border='1' style='width: 100%; border-collapse: collapse; border-color: #e0e0e0; margin-top: 10px; font-size: 14px;'><thead style='background-color: #f5f5f5; text-align: left;'><tr><th style='padding: 8px;'>Cụm từ Collocation</th><th style='padding: 8px;'>Ý nghĩa</th><th style='padding: 8px;'>Ví dụ ngữ cảnh TOEIC</th></tr></thead><tbody><tr><td style='padding: 8px;'><strong>from a financial perspective</strong></td><td style='padding: 8px;'>Từ góc độ tài chính</td><td style='padding: 8px;'><i>Review the budget from a financial perspective.</i></td></tr><tr><td style='padding: 8px;'><strong>from a legal perspective</strong></td><td style='padding: 8px;'>Từ góc độ pháp lý</td><td style='padding: 8px;'><i>Examine terms from a legal perspective.</i></td></tr><tr><td style='padding: 8px;'><strong>from a marketing perspective</strong></td><td style='padding: 8px;'>Từ góc độ tiếp thị</td><td style='padding: 8px;'><i>Analyze campaigns from a marketing perspective.</i></td></tr></tbody></table><p style='margin-top: 10px;'><strong style='color: #e65100;'>🎯 Mẹo làm bài trong 3 giây:</strong> Khi thấy cấu trúc <code>from a/an + [Lĩnh vực] + _______</code>, hãy nghĩ ngay đến danh từ <span style='color: #2e7d32; font-weight: bold;'>perspective</span>.</p></div>",
      "vocab": "<ul style='line-height: 1.6;'><li><strong style='color: #0288d1;'>from a financial perspective</strong> (n.phr): từ góc độ/khía cạnh tài chính.</li><li><strong style='color: #0288d1;'>review a contract</strong> (v.phr): xem xét/đánh giá hợp đồng.</li><li><strong style='color: #0288d1;'>share A with B</strong> (v.phr): chia sẻ thông tin A với đối tượng B.</li></ul>",
      "trans": "<div style='line-height: 1.6; padding: 8px; background-color: #f9f9f9; border-left: 4px solid #0288d1;'><p style='margin: 0 0 8px 0;'><strong>Dịch nghĩa gốc:</strong> Một nhóm các chuyên gia đang xem xét hợp đồng từ một góc độ tài chính, vì vậy xin vui lòng không chia sẻ nó với khách hàng vào lúc này.</p><p style='margin: 0; font-style: italic; color: #555;'><strong>Dịch tự nhiên:</strong> Nhóm chuyên gia đang đánh giá hợp đồng dưới góc độ tài chính, do đó vui lòng chưa gửi bản hợp đồng này cho khách hàng.</p></div>"

    "id": 122,
    "q": "To prevent noise that is distracting to performers, the lobby gift shop is ------- open during performances.",
    "options": [
      "almost",
      "even",
      "never",
      "soon"
    ],
    "a": "never",
    "exp": {
      "correct": "<div style='line-height: 1.6;'><p><strong>a. Phân tích thành phần câu:</strong> Câu gồm cụm trạng ngữ chỉ mục đích đứng đầu và mệnh đề chính phía sau:</p><ul><li><strong>Cụm chỉ mục đích:</strong> <code>To prevent noise that is distracting to performers</code> (Để ngăn chặn tiếng ồn gây xao nhãng cho người biểu diễn).</li><li><strong>Chủ ngữ (S):</strong> <code>the lobby gift shop</code> (Cửa hàng quà tặng ở sảnh).</li><li><strong>Động từ (V):</strong> <code>is</code> (Động từ to be).</li><li><strong>Trạng từ & Tính từ (Adv + Adj):</strong> <code>never open</code> (Không bao giờ mở cửa).</li></ul><p><strong>b. Xác định từ loại:</strong> Chỗ trống đứng sau động từ to be <i>is</i> và trước tính từ <i>open</i>, cần một <strong>Trạng từ (Adverb)</strong> bổ nghĩa cho tính từ.</p><p><strong>c. Lý do chọn đáp án:</strong> Cả 4 phương án đều là trạng từ, do đó câu này đòi hỏi phân tích ngữ nghĩa logic. Nhằm tránh gây tiếng ồn cho nghệ sĩ, cửa hàng quà tặng ở sảnh sẽ <span style='color: #2e7d32; font-weight: bold;'>never</span> (không bao giờ) mở cửa trong suốt các buổi biểu diễn.</p></div>",
      "wrong": "<ul style='line-height: 1.6; list-style-type: none; padding-left: 0;'><li><strong style='color: #c62828;'>❌ (A) almost:</strong> Trạng từ mang nghĩa 'gần như'. Mở cửa 'gần như' vẫn gây ra tiếng ồn, trái ngược với mục đích <i>to prevent noise</i>.</li><li><strong style='color: #c62828;'>❌ (B) even:</strong> Trạng từ mang nghĩa 'thậm chí'. Không tạo thành cấu trúc hợp lý khi đi với tính từ <i>open</i> trong ngữ cảnh này.</li><li><strong style='color: #c62828;'>❌ (D) soon:</strong> Trạng từ mang nghĩa 'sớm/chẳng mấy chốc'. Thường dùng chỉ thì tương lai, không bổ nghĩa cho trạng thái mở cửa cố định during performances.</li></ul>",
      "grammar": "<div style='line-height: 1.6;'><p><strong>⭐ Trạng từ tần suất đứng sau động từ \"To be\"</strong></p><p>Các trạng từ chỉ tần suất (<i>always, usually, often, never...</i>) có vị trí ngữ pháp cố định trong câu khi đi kèm động từ To be và Tính từ.</p><p>Cấu trúc chuẩn: <code>Subject + To Be + Adverb + Adjective</code></p><ul style='margin-top: 8px;'><li><code>is always available</code> (Luôn sẵn có)</li><li><code>is never open</code> (Không bao giờ mở cửa)</li><li><code>is often crowded</code> (Thường xuyên đông đúc)</li></ul><p style='margin-top: 10px;'><strong style='color: #e65100;'>🎯 Mẹo làm bài:</strong> Khi cả 4 phương án đều là Trạng từ, hãy tìm từ khóa chỉ nguyên nhân/mục đích (như <i>To prevent noise</i>) để suy luận ra logic khẳng định hay phủ định.</p></div>",
      "vocab": "<ul style='line-height: 1.6;'><li><strong style='color: #0288d1;'>prevent noise</strong> (v.phr): ngăn chặn/tránh tiếng ồn.</li><li><strong style='color: #0288d1;'>be distracting to sb</strong> (adj.phr): gây xao nhãng, làm mất tập trung đối với ai.</li><li><strong style='color: #0288d1;'>performance</strong> (n): buổi biểu diễn, đêm diễn.</li></ul>",
      "trans": "<div style='line-height: 1.6; padding: 8px; background-color: #f9f9f9; border-left: 4px solid #0288d1;'><p style='margin: 0 0 8px 0;'><strong>Dịch nghĩa gốc:</strong> Để ngăn chặn tiếng ồn cái mà gây mất tập trung cho các nghệ sĩ biểu diễn, cửa hàng quà tặng ở sảnh thì không bao giờ mở cửa trong suốt các buổi biểu diễn.</p><p style='margin: 0; font-style: italic; color: #555;'><strong>Dịch tự nhiên:</strong> Nhằm tránh tiếng ồn làm ảnh hưởng đến nghệ sĩ, cửa hàng quà tặng tại sảnh sẽ không bao giờ hoạt động trong thời gian diễn ra buổi biểu diễn.</p></div>"

    "exp": {
      "correct": "<div style='line-height: 1.6;'><p><strong>a. Phân tích thành phần câu (S-V-O):</strong> Mệnh đề đơn so sánh hiệu suất:</p><ul><li><strong>Chủ ngữ (S):</strong> <code>Zuper Brite lightbulbs</code> (Bóng đèn Zuper Brite).</li><li><strong>Trạng từ (Adv):</strong> <code>greatly</code> (Đáng kể - bổ nghĩa cho động từ).</li><li><strong>Động từ chính (V):</strong> <code>reduce</code> (Giảm thiểu).</li><li><strong>Tân ngữ (O):</strong> <code>energy consumption</code> (Mức tiêu thụ năng lượng).</li><li><strong>Thành phần so sánh:</strong> <code>when compared with...</code> (Khi được so sánh với...).</li></ul><p><strong>b. Xác định từ loại:</strong> Chỗ trống đứng giữa Chủ ngữ và Động từ thường <i>reduce</i>. Vị trí này bắt buộc phải điền một <strong>Trạng từ chỉ mức độ (Adverb)</strong> để bổ nghĩa cho động từ.</p><p><strong>c. Lý do chọn đáp án:</strong> Trong các phương án, chỉ có <span style='color: #2e7d32; font-weight: bold;'>greatly</span> mang đuôi <i>-ly</i> là trạng từ. Sự kết hợp <code>greatly reduce</code> tạo thành cụm từ vô cùng phổ biến trong tiếng Anh thương mại.</p></div>",
      "wrong": "<ul style='line-height: 1.6; list-style-type: none; padding-left: 0;'><li><strong style='color: #c62828;'>❌ (A) great:</strong> Tính từ nguyên mẫu. Tính từ không thể đứng trước để bổ nghĩa trực tiếp cho động từ thường <i>reduce</i>.</li><li><strong style='color: #c62828;'>❌ (B) greater:</strong> Tính từ ở dạng so sánh hơn. Sai từ loại.</li><li><strong style='color: #c62828;'>❌ (C) greatest:</strong> Tính từ ở dạng so sánh nhất. Sai từ loại.</li></ul>",
      "grammar": "<div style='line-height: 1.6;'><p><strong>⭐ Vị trí Trạng từ bổ nghĩa cho Động từ (Adverb + Verb)</strong></p><p>Một trong những quy tắc kinh điển nhất của TOEIC Part 5 về từ loại là trạng từ đứng trước động từ thường để làm rõ mức độ hoặc cách thức hành động diễn ra.</p><p>Cấu trúc: <code>Subject + Adverb + Main Verb + Object</code></p><table border='1' style='width: 100%; border-collapse: collapse; border-color: #e0e0e0; margin-top: 10px; font-size: 14px;'><thead style='background-color: #f5f5f5; text-align: left;'><tr><th style='padding: 8px;'>Cụm Adv + Verb hay gặp</th><th style='padding: 8px;'>Ý nghĩa</th></tr></thead><tbody><tr><td style='padding: 8px;'><strong>greatly reduce / improve</strong></td><td style='padding: 8px;'>Giảm / Cải thiện đáng kể</td></tr><tr><td style='padding: 8px;'><strong>significantly increase</strong></td><td style='padding: 8px;'>Tăng lên đáng kể</td></tr><tr><td style='padding: 8px;'><strong>dramatically fall</strong></td><td style='padding: 8px;'>Sụt giảm nghiêm trọng</td></tr></tbody></table><p style='margin-top: 10px;'><strong style='color: #e65100;'>🎯 Mẹo làm bài trong 3 giây:</strong> Thấy khoảng trống nằm giữa Chủ ngữ và Động từ chỉ hành động <code>S + [______] + Verb</code> -> Chọn ngay đáp án có đuôi <b>-ly (Adverb)</b>.</p></div>",
      "vocab": "<ul style='line-height: 1.6;'><li><strong style='color: #0288d1;'>energy consumption</strong> (n.phr): mức tiêu thụ/tiêu hao năng lượng.</li><li><strong style='color: #0288d1;'>greatly reduce</strong> (v.phr): giảm thiểu đáng kể (= <i>significantly reduce</i>).</li><li><strong style='color: #0288d1;'>incandescent lightbulb</strong> (n.phr): bóng đèn sợi đốt.</li><li><strong style='color: #0288d1;'>compared with/to</strong> (phr): so với, khi so sánh với.</li></ul>",
      "trans": "<div style='line-height: 1.6; padding: 8px; background-color: #f9f9f9; border-left: 4px solid #0288d1;'><p style='margin: 0 0 8px 0;'><strong>Dịch nghĩa gốc:</strong> Bóng đèn Zuper Brite giảm đáng kể sự tiêu thụ năng lượng khi được so sánh với bóng đèn sợi đốt tiêu chuẩn.</p><p style='margin: 0; font-style: italic; color: #555;'><strong>Dịch tự nhiên:</strong> So với bóng đèn sợi đốt thông thường, bóng đèn Zuper Brite giúp cắt giảm đáng kể điện năng tiêu thụ.</p></div>"

    "a": "modernization",
    "exp": {
      "correct": "<div style='line-height: 1.6;'><p><strong>a. Phân tích thành phần câu (S-V-O):</strong></p><ul><li><strong>Chủ ngữ (S):</strong> Cụm danh từ <code>The airport's proposed modernization project</code> (Dự án hiện đại hóa được đề xuất của sân bay).</li><li><strong>Động từ (V):</strong> <code>will include</code> (Sẽ bao gồm).</li><li><strong>Tân ngữ (O):</strong> <code>two remodeled terminals and an updated transportation system</code> (Hai nhà ga được cải tạo và hệ thống giao thông cập nhật).</li></ul><p><strong>b. Xác định từ loại:</strong> Khoảng trống đứng sau tính từ phân từ <i>proposed</i> và trước danh từ <i>project</i>. Ta cần một <strong>Danh từ (Noun)</strong> ghép với <i>project</i> để tạo thành Danh từ ghép (Compound Noun) chỉ tên loại hình dự án.</p><p><strong>c. Lý do chọn đáp án:</strong> Dựa vào thông tin hạng mục công trình 'cải tạo nhà ga' và 'nâng cấp hệ thống giao thông', đây chính là bản chất của một dự án <span style='color: #2e7d32; font-weight: bold;'>modernization</span> (hiện đại hóa).</p></div>",

      "grammar": "<div style='line-height: 1.6;'><p><strong>⭐ Danh từ ghép chỉ dự án (Compound Nouns with \"Project\")</strong></p><p>Trong môi trường doanh nghiệp và TOEIC, các danh từ chỉ loại hình đầu tư/phát triển thường ghép trực tiếp với <code>project</code> để làm tên công trình.</p><ul style='margin-top: 8px;'><li><code>modernization project</code>: Dự án hiện đại hóa</li><li><code>construction project</code>: Dự án xây dựng</li><li><code>expansion project</code>: Dự án mở rộng</li><li><code>renovation project</code>: Dự án cải tạo</li></ul><p style='margin-top: 10px;'><strong style='color: #e65100;'>🎯 Mẹo làm bài:</strong> Mặc dù cả 4 phương án đều là danh từ, hãy chú ý các từ chỉ nội dung công việc phía sau (<i>remodeled, updated</i>) để suy ra danh từ ghép mang nghĩa phù hợp nhất.</p></div>",
      "vocab": "<ul style='line-height: 1.6;'><li><strong style='color: #0288d1;'>modernization project</strong> (n.phr): dự án hiện đại hóa.</li><li><strong style='color: #0288d1;'>remodeled terminal</strong> (n.phr): nhà ga (sân bay) được sửa sang/cải tạo.</li><li><strong style='color: #0288d1;'>transportation system</strong> (n.phr): hệ thống giao thông vận tải.</li></ul>",

    "q": "Market Research is the ------- of the company concerned with better understanding our clients' needs.",
    "options": [

    "a": "division",
    "exp": {
      "correct": "<div style='line-height: 1.6;'><p><strong>a. Phân tích thành phần câu (S-V-C):</strong></p><ul><li><strong>Chủ ngữ (S):</strong> <code>Market Research</code> (Ngành/Bộ phận Nghiên cứu thị trường).</li><li><strong>Động từ (V):</strong> <code>is</code> (Động từ nối).</li><li><strong>Bổ ngữ (C):</strong> <code>the division of the company...</code> (Phân trợ/Bộ phận của công ty...).</li><li><strong>Mệnh đề tính từ rút gọn:</strong> <code>concerned with better understanding...</code> (Chịu trách nhiệm cho việc hiểu rõ hơn...).</li></ul><p><strong>b. Xác định từ loại:</strong> Vị trí nằm giữa mạo từ <i>the</i> và giới từ <i>of</i> (<code>the + _______ + of</code>) bắt buộc phải là một <strong>Danh từ (Noun)</strong> đóng vai trò làm bổ ngữ chính trong câu.</p><p><strong>c. Lý do chọn đáp án:</strong> Trong các từ được cho, <span style='color: #2e7d32; font-weight: bold;'>division</span> là danh từ duy nhất mang nghĩa 'bộ phận, phòng ban', phù hợp hoàn toàn với danh xưng 'Market Research'.</p></div>",
      "wrong": "<ul style='line-height: 1.6; list-style-type: none; padding-left: 0;'><li><strong style='color: #c62828;'>❌ (A) divisional:</strong> Tính từ (thuộc về bộ phận/phân khu). Không đứng độc lập sau <i>the</i> để làm chủ ngữ/bổ ngữ.</li><li><strong style='color: #c62828;'>❌ (B) divisible:</strong> Tính từ (có thể chia được). Không phù hợp từ loại lẫn nghĩa.</li><li><strong style='color: #c62828;'>❌ (D) divide:</strong> Động từ nguyên mẫu (chia ra, phân chia). Cần danh từ, không dùng động từ ở vị trí này.</li></ul>",
      "grammar": "<div style='line-height: 1.6;'><p><strong>⭐ Cấu trúc \"The + Noun + Of\" & Tên các phòng ban</strong></p><p>Công thức nhận diện từ loại kinh điển: <code>The + NOUN + of + Noun/Clause</code></p><table border='1' style='width: 100%; border-collapse: collapse; border-color: #e0e0e0; margin-top: 10px; font-size: 14px;'><thead style='background-color: #f5f5f5; text-align: left;'><tr><th style='padding: 8px;'>Tên bộ phận (Division)</th><th style='padding: 8px;'>Ví dụ ngữ cảnh TOEIC</th></tr></thead><tbody><tr><td style='padding: 8px;'><strong>Sales division</strong></td><td style='padding: 8px;'>Bộ phận kinh doanh / bán hàng</td></tr><tr><td style='padding: 8px;'><strong>Research division</strong></td><td style='padding: 8px;'>Bộ phận nghiên cứu & phát triển</td></tr><tr><td style='padding: 8px;'><strong>Marketing division</strong></td><td style='padding: 8px;'>Bộ phận tiếp thị</td></tr></tbody></table><p style='margin-top: 10px;'><strong style='color: #e65100;'>🎯 Mẹo làm bài trong 3 giây:</strong> Nhìn thấy vị trí <code>the + [______] + of</code> -> Hãy tìm danh từ chính xác trong 4 phương án để điền vào.</p></div>",
      "vocab": "<ul style='line-height: 1.6;'><li><strong style='color: #0288d1;'>division</strong> (n): bộ phận, phòng ban trong tổ chức (= <i>department</i>).</li><li><strong style='color: #0288d1;'>be concerned with</strong> (v.phr): liên quan đến, chịu trách nhiệm về, quan tâm đến.</li><li><strong style='color: #0288d1;'>clients' needs</strong> (n.phr): nhu cầu của khách hàng.</li></ul>",
      "trans": "<div style='line-height: 1.6; padding: 8px; background-color: #f9f9f9; border-left: 4px solid #0288d1;'><p style='margin: 0 0 8px 0;'><strong>Dịch nghĩa gốc:</strong> Nghiên cứu thị trường là bộ phận của công ty cái mà liên quan đến việc hiểu tốt hơn nhu cầu của khách hàng.</p><p style='margin: 0; font-style: italic; color: #555;'><strong>Dịch tự nhiên:</strong> Nghiên cứu thị trường là bộ phận chịu trách nhiệm tiếp cận và thấu hiểu rõ hơn các nhu cầu của khách hàng.</p></div>"

        {
    "id": 126,
    "q": "Mr. Tanaka was so pleased by the quarterly performance report _______ he canceled the weekly updates.",
    "options": [
      "in case",
      "which",
      "that",
      "seldom"
    ],
    "a": "that",
    "exp": {
      "correct": "<div style='line-height: 1.6;'><p><strong>a. Phân tích thành phần câu (S-V-C):</strong> Câu được cấu tạo bởi hai mệnh đề nối với nhau theo cấu trúc kết quả:</p><ul><li><strong>Mệnh đề chính (S-V-C):</strong> <code>Mr. Tanaka</code> (S) + <code>was</code> (V) + <code>so pleased by the quarterly performance report</code> (C/Subject Complement).</li><li><strong>Mệnh đề kết quả (S-V-O):</strong> <code>he</code> (S) + <code>canceled</code> (V) + <code>the weekly updates</code> (O).</li></ul><p><strong>b. Xác định từ loại:</strong> Vị trí khoảng trống dùng để nối hai mệnh đề hoàn chỉnh (Clause + Clause). Do đó, vị trí này chắc chắn cần một <strong>Liên từ (Conjunction)</strong>.</p><p><strong>c. Lý do chọn đáp án:</strong> Trong câu đã xuất hiện từ <i>so</i> đi kèm tính từ <i>pleased</i> (<code>so pleased</code>). Theo ngữ pháp kinh điển, cấu trúc đi kèm sẽ là <code>so + Adj/Adv + that + S + V</code> (quá... đến nỗi...). Do đó, ta chọn <span style='color: #2e7d32; font-weight: bold;'>that</span> để hoàn thành cấu trúc chỉ chỉ kết quả.</p></div>",
      "wrong": "<ul style='line-height: 1.6; list-style-type: none; padding-left: 0;'><li><strong style='color: #c62828;'>❌ (A) in case:</strong> Liên từ mang nghĩa \"phòng trường hợp\" (mục đích/phòng ngừa). Không phù hợp vì mệnh đề phía sau chỉ kết quả trực tiếp của hành động hài lòng, không phải tình huống phòng ngừa.</li><li><strong style='color: #c62828;'>❌ (B) which:</strong> Đại từ quan hệ dùng để thay thế cho danh từ chỉ vật. Phía sau <i>which</i> phải là mệnh đề thiếu (thiếu S hoặc O), trong khi mệnh đề phía sau đã đầy đủ thành phần.</li><li><strong style='color: #c62828;'>❌ (D) seldom:</strong> Trạng từ tần suất mang nghĩa \"hiếm khi\". Trạng từ đơn thuần không có chức năng nối hai mệnh đề độc lập.</li></ul>",
      "grammar": "<div style='line-height: 1.6;'><p><strong>⭐ Cấu trúc So... That (Quá... Đến nỗi...)</strong></p><p>Trong đề thi TOEIC Part 5, cấu trúc nhấn mạnh kết quả rất hay xuất hiện dưới dạng điền liên từ <i>that</i> hoặc điền từ nhấn mạnh <i>so/such</i>.</p><table border='1' style='width: 100%; border-collapse: collapse; border-color: #e0e0e0; margin-top: 10px; font-size: 14px;'><thead style='background-color: #f5f5f5; text-align: left;'><tr><th style='padding: 8px;'>Cấu trúc</th><th style='padding: 8px;'>Công thức</th><th style='padding: 8px;'>Ví dụ ngữ cảnh TOEIC</th></tr></thead><tbody><tr><td style='padding: 8px;'><strong>So... that</strong></td><td style='padding: 8px;'>So + Adj/Adv + <strong>that</strong> + S + V</td><td style='padding: 8px;'><i>so pleased <strong>that</strong> he canceled...</i></td></tr><tr><td style='padding: 8px;'><strong>Such... that</strong></td><td style='padding: 8px;'>Such + (a/an) + Adj + N + <strong>that</strong> + S + V</td><td style='padding: 8px;'><i>such a good report <strong>that</strong> he approved...</i></td></tr></tbody></table><p style='margin-top: 10px;'><strong style='color: #e65100;'>🎯 Mẹo làm bài trong 3 giây:</strong> Khi thấy phía trước khoảng trống có <code>so + Tính từ/Trạng từ</code>, hãy nhìn nhanh các phương án. Đáp án gần như chắc chắn là <span style='color: #2e7d32; font-weight: bold;'>THAT</span>.</p></div>",
      "vocab": "<ul style='line-height: 1.6;'><li><strong style='color: #0288d1;'>be pleased with/by sth</strong> (adj.phr): hài lòng, hân hoan về điều gì (= <i>be satisfied with</i>).</li><li><strong style='color: #0288d1;'>quarterly performance report</strong> (n.phr): báo cáo kết quả hoạt động kinh doanh hàng quý.</li><li><strong style='color: #0288d1;'>cancel</strong> (v): hủy bỏ (= <i>call off</i>).</li><li><strong style='color: #0288d1;'>weekly updates</strong> (n.phr): các bản cập nhật hàng tuần.</li></ul>",
      "trans": "<div style='line-height: 1.6; padding: 8px; background-color: #f9f9f9; border-left: 4px solid #0288d1;'><p style='margin: 0 0 8px 0;'><strong>Dịch nghĩa gốc:</strong> Ông Tanaka đã rất hài lòng bởi báo cáo hiệu suất hàng quý đến mức ông ấy đã hủy các bản cập nhật hàng tuần.</p><p style='margin: 0; font-style: italic; color: #555;'><strong>Dịch tự nhiên:</strong> Ông Tanaka hài lòng với báo cáo kết quả kinh doanh hàng quý đến mức đã cho hủy luôn các bản cập nhật hàng tuần.</p></div>"
    }

  {
    "id": 127,
    "q": "Quincycom’s price increase is justifiable _______ there is an improvement in the quality of the Internet service we receive.",
    "options": [
      "whereas",
      "likewise",
      "because of",
      "only if"
    ],
    "a": "only if",
    "exp": {
      "correct": "<div style='line-height: 1.6;'><p><strong>a. Phân tích thành phần câu (S-V-C):</strong> Câu bao gồm hai mệnh đề độc lập:</p><ul><li><strong>Mệnh đề 1:</strong> <code>Quincycom's price increase</code> (S) + <code>is</code> (V) + <code>justifiable</code> (C - Tính từ).</li><li><strong>Mệnh đề 2:</strong> <code>there</code> (S giả) + <code>is</code> (V) + <code>an improvement in the quality...</code> (S thực).</li></ul><p><strong>b. Xác định từ loại:</strong> Phía sau chỗ trống là một mệnh đề hoàn chỉnh (S + V). Vị trí này bắt buộc phải là một <strong>Liên từ chỉ điều kiện/mối quan hệ (Conjunction)</strong>.</p><p><strong>c. Lý do chọn đáp án:</strong> Xét ngữ nghĩa, việc \"tăng giá\" (price increase) của công ty chỉ có thể chấp nhận/hợp lý (justifiable) dưới điều kiện \"chất lượng dịch vụ được cải thiện\". Do đó, chọn liên từ điều kiện <span style='color: #2e7d32; font-weight: bold;'>only if</span> (chỉ khi) để thể hiện đúng mối quan hệ này.</p></div>",
      "wrong": "<ul style='line-height: 1.6; list-style-type: none; padding-left: 0;'><li><strong style='color: #c62828;'>❌ (A) whereas:</strong> Liên từ mang nghĩa \"trong khi\" (chỉ sự đối lập, tương phản giữa hai sự thật). Không phù hợp về ngữ cảnh điều kiện.</li><li><strong style='color: #c62828;'>❌ (B) likewise:</strong> Trạng từ liên kết mang nghĩa \"tương tự như vậy\". Không đứng trước một mệnh đề để làm liên từ phụ thuộc.</li><li><strong style='color: #c62828;'>❌ (C) because of:</strong> Giới từ chỉ nguyên nhân (\"bởi vì\"). Theo sau <i>because of</i> bắt buộc phải là Danh từ / Cụm Danh từ / V-ing, không được đi kèm mệnh đề có động từ chia thì (<i>there is...</i>).</li></ul>",
      "grammar": "<div style='line-height: 1.6;'><p><strong>⭐ Phân biệt Liên từ điều kiện & Giới từ trong TOEIC</strong></p><p>Một bẫy rất quen thuộc trong Part 5 là đưa ra cả Liên từ (cần S+V) và Giới từ (cần N/V-ing) có nghĩa tương tự nhau.</p><table border='1' style='width: 100%; border-collapse: collapse; border-color: #e0e0e0; margin-top: 10px; font-size: 14px;'><thead style='background-color: #f5f5f5; text-align: left;'><tr><th style='padding: 8px;'>Loại từ</th><th style='padding: 8px;'>Từ nhận biết</th><th style='padding: 8px;'>Cấu trúc theo sau</th></tr></thead><tbody><tr><td style='padding: 8px;'><strong>Liên từ điều kiện</strong></td><td style='padding: 8px;'><strong>only if</strong>, if, provided that</td><td style='padding: 8px;'>Mệnh đề (S + V)</td></tr><tr><td style='padding: 8px;'><strong>Giới từ</strong></td><td style='padding: 8px;'><strong>because of</strong>, due to, in spite of</td><td style='padding: 8px;'>Danh từ / Cụm N / V-ing</td></tr></tbody></table><p style='margin-top: 10px;'><strong style='color: #e65100;'>🎯 Mẹo làm bài trong 3 giây:</strong> Nhìn ngay sau khoảng trống có <code>there is...</code> (cấu trúc S+V), gạch ngay phương án Giới từ <i>because of</i>. Dựa vào nghĩa hợp lý chọn <span style='color: #2e7d32; font-weight: bold;'>ONLY IF</span>.</p></div>",
      "vocab": "<ul style='line-height: 1.6;'><li><strong style='color: #0288d1;'>justifiable</strong> (adj): hợp lý, có thể biện minh được (= <i>acceptable, reasonable</i>).</li><li><strong style='color: #0288d1;'>price increase</strong> (n.phr): sự tăng giá.</li><li><strong style='color: #0288d1;'>improvement in sth</strong> (n.phr): sự cải thiện về cái gì.</li><li><strong style='color: #0288d1;'>only if</strong> (conj): chỉ khi (điều kiện duy nhất).</li></ul>",
      "trans": "<div style='line-height: 1.6; padding: 8px; background-color: #f9f9f9; border-left: 4px solid #0288d1;'><p style='margin: 0 0 8px 0;'><strong>Dịch nghĩa gốc:</strong> Sự tăng giá của Quincycom là có thể chấp nhận được chỉ khi có một sự cải thiện về chất lượng của dịch vụ Internet chúng ta nhận được.</p><p style='margin: 0; font-style: italic; color: #555;'><strong>Dịch tự nhiên:</strong> Việc tăng giá cước của Quincycom chỉ hợp lý nếu chất lượng dịch vụ Internet mà chúng ta sử dụng được cải thiện.</p></div>"
    }

  {
    "id": 128,
    "q": "The chart attached to this e-mail presents a ------- of Vivasyco’s latest smartphone with a model from Eustace Tech.",
    "options": [
      "comparison",
      "pronouncement",
      "guideline",
      "publicity"
    ],
    "a": "comparison",
    "exp": {
      "correct": "<div style='line-height: 1.6;'><p><strong>a. Phân tích thành phần câu (S-V-O):</strong></p><ul><li><strong>Subject (S):</strong> <code>The chart attached to this e-mail</code> (Biểu đồ được đính kèm theo email này - chứa mệnh đề rút gọn dạng bị động <i>attached to...</i>).</li><li><strong>Verb (V):</strong> <code>presents</code> (Trình bày / đưa ra).</li><li><strong>Object (O):</strong> <code>a comparison of Vivasyco's latest smartphone with a model from Eustace Tech</code> (Sự so sánh điện thoại...).</li></ul><p><strong>b. Xác định từ loại:</strong> Khoảng trống đứng sau mạo từ <i>a</i> nên bắt buộc phải là một <strong>Danh từ đếm được số ít (Noun)</strong> đóng vai trò làm tân ngữ cho động từ <i>presents</i>.</p><p><strong>c. Lý do chọn đáp án:</strong> Cả 4 phương án đều là danh từ, đây là câu hỏi về từ vựng và Collocation. Ta có cụm cố định <code>comparison of A with B</code> (sự so sánh giữa A và B). Kết hợp với ngữ cảnh \"biểu đồ\" (chart), chọn <span style='color: #2e7d32; font-weight: bold;'>comparison</span> là chính xác nhất.</p></div>",
      "wrong": "<ul style='line-height: 1.6; list-style-type: none; padding-left: 0;'><li><strong style='color: #c62828;'>❌ (B) pronouncement:</strong> Danh từ nghĩa là \"lời tuyên bố chính thức\". Biểu đồ dữ liệu không thể dùng để đưa ra lời tuyên bố.</li><li><strong style='color: #c62828;'>❌ (C) guideline:</strong> Danh từ nghĩa là \"hướng dẫn / quy tắc chỉ dẫn\". Không đi với cấu trúc <i>guideline of A with B</i> trong ngữ cảnh đối chiếu sản phẩm.</li><li><strong style='color: #c62828;'>❌ (D) publicity:</strong> Danh từ không đếm được nghĩa là \"sự công khai / sự quảng bá truyền thông\". Không đứng sau mạo từ <i>a</i> và không hợp ngữ cảnh.</li></ul>",
      "grammar": "<div style='line-height: 1.6;'><p><strong>⭐ Collocation quen thuộc với Danh từ chỉ sự So sánh</strong></p><p>Trong TOEIC Part 5, các từ vựng chỉ bảng biểu (chart, table, report) rất hay đi kèm với cấu trúc so sánh đối chiếu hai đối tượng.</p><table border='1' style='width: 100%; border-collapse: collapse; border-color: #e0e0e0; margin-top: 10px; font-size: 14px;'><thead style='background-color: #f5f5f5; text-align: left;'><tr><th style='padding: 8px;'>Cấu trúc Collocation</th><th style='padding: 8px;'>Ý nghĩa</th><th style='padding: 8px;'>Ví dụ ngữ cảnh TOEIC</th></tr></thead><tbody><tr><td style='padding: 8px;'><strong>comparison of A with/to B</strong></td><td style='padding: 8px;'>Sự so sánh A với B</td><td style='padding: 8px;'><i>a <strong>comparison</strong> of product A with product B</i></td></tr><tr><td style='padding: 8px;'><strong>comparison between A and B</strong></td><td style='padding: 8px;'>Sự so sánh giữa A và B</td><td style='padding: 8px;'><i>a <strong>comparison</strong> between the two models</i></td></tr></tbody></table><p style='margin-top: 10px;'><strong style='color: #e65100;'>🎯 Mẹo làm bài trong 3 giây:</strong> Thấy cấu trúc <code>a [______] of A with B</code> đi kèm chủ ngữ <i>chart/graph</i>, khoanh ngay <span style='color: #2e7d32; font-weight: bold;'>COMPARISON</span>.</p></div>",
      "vocab": "<ul style='line-height: 1.6;'><li><strong style='color: #0288d1;'>comparison of A with B</strong> (n.phr): sự so sánh giữa A và B.</li><li><strong style='color: #0288d1;'>attached to</strong> (adj/v-ed): được đính kèm với.</li><li><strong style='color: #0288d1;'>present</strong> (v): trình bày, xuất trình, đưa ra (= <i>display, show</i>).</li><li><strong style='color: #0288d1;'>latest smartphone</strong> (n.phr): mẫu điện thoại thông minh mới nhất.</li></ul>",
      "trans": "<div style='line-height: 1.6; padding: 8px; background-color: #f9f9f9; border-left: 4px solid #0288d1;'><p style='margin: 0 0 8px 0;'><strong>Dịch nghĩa gốc:</strong> Biểu đồ được đính kèm với email này trình bày một sự so sánh của điện thoại thông minh mới nhất của Vivasyco với một mẫu từ Eustace Tech.</p><p style='margin: 0; font-style: italic; color: #555;'><strong>Dịch tự nhiên:</strong> Bảng biểu đính kèm email này thể hiện sự so sánh giữa mẫu điện thoại mới nhất của Vivasyco và sản phẩm cùng dòng của Eustace Tech.</p></div>"
    }
  },
  {
    "id": 129,
    "q": "It is the catering director's ------- to inform the chef of the intended menu well in advance of the event.",
    "options": [
      "obliged",
      "obligated",
      "obligatory",
      "obligation"
    ],
    "a": "obligation",
    "exp": {
      "correct": "<div style='line-height: 1.6;'><p><strong>a. Phân tích thành phần câu (S-V-C):</strong></p><ul><li><strong>Chủ ngữ giả (It) & Động từ (V):</strong> <code>It is</code>.</li><li><strong>Bổ ngữ (C):</strong> <code>the catering director's obligation</code> (Nghĩa vụ của giám đốc dịch vụ ăn uống).</li><li><strong>Mệnh đề thực (to V):</strong> <code>to inform the chef...</code> (thông báo cho đầu bếp...).</li></ul><p><strong>b. Xác định từ loại:</strong> Vị trí khoảng trống đứng ngay sau danh từ sở hữu cách <i>director's</i>. Theo ngữ pháp, sau sở hữu cách bắt buộc phải là một <strong>Danh từ (Noun)</strong> đóng vai trò làm danh từ trung tâm.</p><p><strong>c. Lý do chọn đáp án:</strong> Xét họ từ (Word Form) của từ \"oblige\": <i>obliged</i> (Adj), <i>obligated</i> (Adj), <i>obligatory</i> (Adj) và <i>obligation</i> (N). Do đó, chọn danh từ <span style='color: #2e7d32; font-weight: bold;'>obligation</span> là đáp án duy nhất đúng về mặt ngữ pháp.</p></div>",
      "wrong": "<ul style='line-height: 1.6; list-style-type: none; padding-left: 0;'><li><strong style='color: #c62828;'>❌ (A) obliged:</strong> Quá khứ phân từ/Tính từ mang nghĩa \"cảm thấy có nghĩa vụ/trách nhiệm\" (thường dùng trong cấu trúc <i>be obliged to V</i>). Không đứng sau sở hữu cách.</li><li><strong style='color: #c62828;'>❌ (B) obligated:</strong> Tính từ mang nghĩa \"bắt buộc\" (thường dùng trong cấu trúc <i>be obligated to V</i>).</li><li><strong style='color: #c62828;'>❌ (C) obligatory:</strong> Tính từ mang nghĩa \"có tính chất cưỡng bách, bắt buộc\" (ví dụ: <i>obligatory course</i> - môn học bắt buộc). Tính từ không thể làm danh từ chính đứng sau sở hữu cách.</li></ul>",
      "grammar": "<div style='line-height: 1.6;'><p><strong>⭐ Cấu trúc Chủ ngữ giả & Sở hữu cách</strong></p><p>Đây là dạng bài biến thể Word Form rất điển hình trong TOEIC Part 5 kết hợp cấu trúc chủ ngữ giả <i>It is...</i></p><table border='1' style='width: 100%; border-collapse: collapse; border-color: #e0e0e0; margin-top: 10px; font-size: 14px;'><thead style='background-color: #f5f5f5; text-align: left;'><tr><th style='padding: 8px;'>Cấu trúc</th><th style='padding: 8px;'>Công thức</th><th style='padding: 8px;'>Danh từ thường gặp</th></tr></thead><tbody><tr><td style='padding: 8px;'><strong>Chủ ngữ giả + Noun</strong></td><td style='padding: 8px;'>It is + [Possessive 's] + <strong>NOUN</strong> + to V</td><td style='padding: 8px;'><strong>duty, obligation, responsibility, job</strong></td></tr></tbody></table><p style='margin-top: 10px;'><strong style='color: #e65100;'>🎯 Mẹo làm bài trong 3 giây:</strong> Thấy danh từ có đuôi sở hữu cách <code>'s</code> (như <i>director's</i>) -> Cần tìm ngay một <strong>Danh từ</strong>. Trong 4 đáp án chỉ có đuôi <i>-tion</i> là danh từ -> Chọn <span style='color: #2e7d32; font-weight: bold;'>OBLIGATION</span>.</p></div>",
      "vocab": "<ul style='line-height: 1.6;'><li><strong style='color: #0288d1;'>obligation to V</strong> (n): nghĩa vụ, trách nhiệm phải làm gì (= <i>responsibility, duty</i>).</li><li><strong style='color: #0288d1;'>catering director</strong> (n.phr): giám đốc/quản lý dịch vụ tiệc ăn uống.</li><li><strong style='color: #0288d1;'>inform sb of sth</strong> (v.phr): thông báo cho ai về điều gì.</li><li><strong style='color: #0288d1;'>well in advance of</strong> (prep.phr): trước (sự kiện) một khoảng thời gian khá dài.</li></ul>",

      "wrong": "<ul style='line-height: 1.6; list-style-type: none; padding-left: 0;'><li><strong style='color: #c62828;'>❌ (A) formerly:</strong> Trạng từ nghĩa là \"trước đây, thuở xưa\" (chỉ thời gian). Không phù hợp vì câu đang nói ở thì hiện tại (<i>is</i>).</li><li><strong style='color: #c62828;'>❌ (B) expectantly:</strong> Trạng từ nghĩa là \"với sự mong đợi, kì vọng\". Không dùng để bổ nghĩa mức độ cho tính từ <i>well suited</i>.</li><li><strong style='color: #c62828;'>❌ (D) avoidably:</strong> Trạng từ nghĩa là \"một cách có thể tránh được\". Hoàn toàn trái ngược và không hợp logic nghĩa của câu.</li></ul>",

e box office, 521 Perry Avenue, Fenton.</p>\n    </div>\n</div>",

  "passage": "<style>\n    .letter-container {\n        border: 1px solid #222222;\n        padding: 30px 40px;\n        background-color: #ffffff;\n        max-width: 650px;\n        margin: 0 auto 1.5rem auto;\n        font-family: 'Times New Roman', Times, serif;\n        color: #000000;\n        line-height: 1.5;\n        box-shadow: 0 4px 6px rgba(0,0,0,0.03);\n    }\n    .letter-recipient {\n        margin-bottom: 20px;\n        font-size: 1.05rem;\n    }\n    .letter-body p {\n        margin-bottom: 16px;\n        text-align: justify;\n        font-size: 1.05rem;\n    }\n    .letter-closing {\n        margin-top: 25px;\n        font-size: 1.05rem;\n    }\n    .letter-signature {\n        font-family: 'Brush Script MT', 'Dancing Script', cursive, serif;\n        font-size: 1.4rem;\n        margin: 6px 0 2px 0;\n    }\n</style>\n<div class=\"letter-container\">\n    <div class=\"letter-recipient\">\n        Pierre Gitane<br>\n        26 Bent Tree Lane<br>\n        Charlotte, NC 28804<br>\n        April 15\n    </div>\n    <div class=\"letter-body\">\n        <p>Dear Mr. Gitane,</p>\n        <p>This letter is to inform you that <span class=\"clue-highlight-1\">you are due for your semiannual dental care visit</span>. Go to our Web site and fill out a form to request an appointment. Or if you prefer, call us at (704) 555-0138 to reach one of our receptionists.</p>\n        <p>We are happy to announce that <span class=\"clue-highlight-2\">we now offer teeth whitening</span> and invisible braces to improve your smile. Please let us know if you are interested in one or both of these services.</p>\n        <p>We look forward to hearing from you soon.</p>\n    </div>\n    <div class=\"letter-closing\">\n        All best,<br>\n        <div class=\"letter-signature\">Sarah Hamadi</div>\n        Sarah Hamadi<br>\n        Office manager, Red Street Dental Care\n    </div>\n</div>",
  "translation": "<div class=\"translation-header\">Bản dịch & Phân tích</div>\n<style>\n    .letter-container {\n        border: 1px solid #222222;\n        padding: 30px 40px;\n        background-color: #ffffff;\n        max-width: 650px;\n        margin: 0 auto 1.5rem auto;\n        font-family: 'Times New Roman', Times, serif;\n        color: #000000;\n        line-height: 1.5;\n        box-shadow: 0 4px 6px rgba(0,0,0,0.03);\n    }\n    .letter-recipient {\n        margin-bottom: 20px;\n        font-size: 1.05rem;\n    }\n    .letter-body p {\n        margin-bottom: 16px;\n        text-align: justify;\n        font-size: 1.05rem;\n    }\n    .letter-closing {\n        margin-top: 25px;\n        font-size: 1.05rem;\n    }\n    .letter-signature {\n        font-family: 'Brush Script MT', 'Dancing Script', cursive, serif;\n        font-size: 1.4rem;\n        margin: 6px 0 2px 0;\n    }\n</style>\n<div class=\"letter-container\">\n    <div class=\"letter-recipient\">\n        Pierre Gitane<br>\n        26 Bent Tree Lane<br>\n        Charlotte, NC 28804<br>\n        Ngày 15 tháng 4\n    </div>\n    <div class=\"letter-body\">\n        <p>Kính gửi ông Gitane,</p>\n        <p>Thư này nhằm thông báo cho ông biết rằng <span class=\"clue-highlight-1\">ông đã đến hạn tái khám chăm sóc răng miệng 6 tháng một lần</span>. Hãy truy cập trang web của chúng tôi và điền vào biểu mẫu để yêu cầu một cuộc hẹn. Hoặc nếu muốn, ông có thể gọi cho chúng tôi theo số (704) 555-0138 để gặp một trong những nhân viên lễ tân của chúng tôi.</p>\n        <p>Chúng tôi rất vui mừng thông báo rằng <span class=\"clue-highlight-2\">hiện tại chúng tôi cung cấp dịch vụ tẩy trắng răng</span> và niềng răng trong suốt để cải thiện nụ cười của ông. Vui lòng cho chúng tôi biết nếu ông quan tâm đến một hoặc cả hai dịch vụ này.</p>\n        <p>Chúng tôi rất mong sớm nhận được phản hồi từ ông.</p>\n    </div>\n    <div class=\"letter-closing\">\n        Trân trọng,<br>\n        <div class=\"letter-signature\">Sarah Hamadi</div>\n        Sarah Hamadi<br>\n        Quản lý văn phòng, Red Street Dental Care\n    </div>\n</div>",

  "passage": "<style>\n    .chat-container {\n        border: 1px solid #cbd5e1;\n        border-radius: 12px;\n        background-color: #f8fafc;\n        padding: 20px;\n        max-width: 580px;\n        margin: 0 auto 1.5rem auto;\n        font-family: -apple-system, BlinkMacSystemFont, \"Segoe UI\", Roboto, Helvetica, Arial, sans-serif;\n        box-shadow: 0 4px 6px rgba(0,0,0,0.05);\n    }\n    .chat-message {\n        margin-bottom: 16px;\n    }\n    .chat-message:last-child {\n        margin-bottom: 0;\n    }\n    .chat-header {\n        font-weight: 700;\n        color: #0f172a;\n        font-size: 0.95rem;\n        margin-bottom: 4px;\n    }\n    .chat-time {\n        font-weight: 400;\n        color: #64748b;\n        font-size: 0.85rem;\n        margin-left: 4px;\n    }\n    .chat-bubble {\n        background-color: #ffffff;\n        border: 1px solid #e2e8f0;\n        border-radius: 8px;\n        padding: 10px 14px;\n        color: #334155;\n        line-height: 1.5;\n        font-size: 0.95rem;\n    }\n</style>\n<div class=\"chat-container\">\n    <div class=\"chat-message\">\n        <div class=\"chat-header\">Teleshia Thomas <span class=\"chat-time\">(8:12 A.M.)</span></div>\n        <div class=\"chat-bubble\">Laura, are you in the office already or still on your way in? I have a favor to ask.</div>\n    </div>\n    <div class=\"chat-message\">\n        <div class=\"chat-header\">Laura Penn <span class=\"chat-time\">(8:14 A.M.)</span></div>\n        <div class=\"chat-bubble\"><span class=\"clue-highlight-1\">I'm here.</span></div>\n    </div>\n    <div class=\"chat-message\">\n        <div class=\"chat-header\">Teleshia Thomas <span class=\"chat-time\">(8:16 A.M.)</span></div>\n        <div class=\"chat-bubble\">It's Jack's farewell breakfast this morning. I have juice, coffee, fruit, and pastries with me, but I haven't passed around cards for colleagues to sign to wish him well. Do you think you could do that? There are some cards on my desk.</div>\n    </div>\n    <div class=\"chat-message\">\n        <div class=\"chat-header\">Laura Penn <span class=\"chat-time\">(8:18 A.M.)</span></div>\n        <div class=\"chat-bubble\">Actually, I can send out an e-mail and ask staff to go into your office to sign the cards. <span class=\"clue-highlight-2\">I'll arrange them on the round table in the corner.</span> I'll do that straightaway.</div>\n    </div>\n</div>",
  "translation": "<div class=\"translation-header\">Bản dịch & Phân tích</div>\n<style>\n    .chat-container {\n        border: 1px solid #cbd5e1;\n        border-radius: 12px;\n        background-color: #f8fafc;\n        padding: 20px;\n        max-width: 580px;\n        margin: 0 auto 1.5rem auto;\n        font-family: -apple-system, BlinkMacSystemFont, \"Segoe UI\", Roboto, Helvetica, Arial, sans-serif;\n        box-shadow: 0 4px 6px rgba(0,0,0,0.05);\n    }\n    .chat-message {\n        margin-bottom: 16px;\n    }\n    .chat-message:last-child {\n        margin-bottom: 0;\n    }\n    .chat-header {\n        font-weight: 700;\n        color: #0f172a;\n        font-size: 0.95rem;\n        margin-bottom: 4px;\n    }\n    .chat-time {\n        font-weight: 400;\n        color: #64748b;\n        font-size: 0.85rem;\n        margin-left: 4px;\n    }\n    .chat-bubble {\n        background-color: #ffffff;\n        border: 1px solid #e2e8f0;\n        border-radius: 8px;\n        padding: 10px 14px;\n        color: #334155;\n        line-height: 1.5;\n        font-size: 0.95rem;\n    }\n</style>\n<div class=\"chat-container\">\n    <div class=\"chat-message\">\n        <div class=\"chat-header\">Teleshia Thomas <span class=\"chat-time\">(8:12 A.M.)</span></div>\n        <div class=\"chat-bubble\">Laura, bạn đã ở văn phòng chưa hay vẫn đang trên đường tới? Mình có một việc nhờ bạn giúp.</div>\n    </div>\n    <div class=\"chat-message\">\n        <div class=\"chat-header\">Laura Penn <span class=\"chat-time\">(8:14 A.M.)</span></div>\n        <div class=\"chat-bubble\"><span class=\"clue-highlight-1\">Mình ở đây rồi.</span></div>\n    </div>\n    <div class=\"chat-message\">\n        <div class=\"chat-header\">Teleshia Thomas <span class=\"chat-time\">(8:16 A.M.)</span></div>\n        <div class=\"chat-bubble\">Sáng nay là bữa sáng chia tay Jack. Mình có mang theo nước ép, cà phê, trái cây và bánh ngọt, nhưng mình chưa chuyền thiệp để các đồng nghiệp ký tên chúc anh ấy những điều tốt đẹp. Bạn có thể giúp mình làm việc đó không? Có một vài tấm thiệp trên bàn làm việc của mình.</div>\n    </div>\n    <div class=\"chat-message\">\n        <div class=\"chat-header\">Laura Penn <span class=\"chat-time\">(8:18 A.M.)</span></div>\n        <div class=\"chat-bubble\">Thực ra, mình có thể gửi một email và nhờ nhân viên vào văn phòng của bạn để ký thiệp. <span class=\"clue-highlight-2\">Mình sẽ sắp xếp chúng trên chiếc bàn tròn ở góc phòng.</span> Mình sẽ làm việc đó ngay lập tức.</div>\n    </div>\n</div>",

      "text": "153. At 8:14 A.M., what does Ms. Penn most likely mean when she writes, \"I'm here\"?",

        { "text": "(B) She is in the same room as Ms. Thomas.", "correct": false },
        { "text": "(C) She is waiting for Ms. Thomas to arrive.", "correct": false },
        { "text": "(D) She is already at the office.", "correct": true }
      ],
      "explanation": "<div class='exp-clue' style='line-height: 1.6;'>\n    <b style='color: #2c3e50; font-size: 1.1rem;'>🎯 Dạng văn bản:</b> Business Chat / Instant Messaging (Hội thoại tin nhắn công sở)<br>\n    <b style='color: #2c3e50; font-size: 1.1rem;'>🎯 Mục đích chính:</b> Trao đổi công việc nội bộ, nhờ đồng nghiệp chuẩn bị thiệp chia tay cho nhân viên rời công ty.<br><br>\n    <span style='color: #e67e22; font-weight: bold;'>1. Dạng câu hỏi:</span> 👉 <span style='color: #e67e22;'>Inference Question / Clue-based Meaning</span> (Câu hỏi suy luận ý nghĩa câu nói trong ngữ cảnh).<br><br>\n    <span style='color: #27ae60; font-weight: bold;'>2. Evidence:</span><br>\n    - Teleshia Thomas (8:12 A.M.): <i>\"Laura, are you in the office already or still on your way in? I have a favor to ask.\"</i><br>\n    - Laura Penn (8:14 A.M.): <i>\"<span class='clue-highlight-1'>I'm here.</span>\"</i><br><br>\n    <span style='color: #2980b9; font-weight: bold;'>3. Phân tích các đáp án theo thứ tự:</span><br>\n    * (A) <i>She is paying attention:</i> Sai. Mặc dù \"I'm here\" trong một số trường hợp giao tiếp có thể hiểu là \"Tôi đang lắng nghe bạn đây\", nhưng ở đây Teleshia đang trực tiếp hỏi về vị trí địa lý của Laura (đã ở văn phòng hay còn đang trên đường).<br>\n    * (B) <i>She is in the same room as Ms. Thomas:</i> Sai. Teleshia ở tin nhắn tiếp theo có nói \"There are some cards on my desk\", cho thấy họ không ở cùng một vị trí / một phòng tại thời điểm đó nên mới cần gửi tin nhắn nhờ vả.<br>\n    * (C) <i>She is waiting for Ms. Thomas to arrive:</i> Sai. Bài không hề đề cập đến việc Laura đang đứng chờ Teleshia đến.<br>\n    * (D) <b>She is already at the office.</b> &rarr; Chính xác. Đáp lại câu hỏi lựa chọn \"Are you in the office already or still on your way in?\", câu trả lời \"I'm here\" (Tôi ở đây rồi) đồng nghĩa với việc Laura đã có mặt tại văn phòng làm việc.<br><br>\n    <span style='color: #8e44ad; font-weight: bold;'>🔄 Paraphrase từ ETS:</span><br>\n    - <span style='color: #d35400;'>are you in the office already? / I'm here</span> &rarr; <span style='color: #16a085;'>already at the office</span>.<br><br>\n    <strong>Đáp án:</strong> ✅ (D) She is already at the office.\n</div>"
    },

  "passage": "<style>\n        .news-container { border: 1px solid #cbd5e1; border-radius: 8px; overflow: hidden; margin-bottom: 1.5rem; box-shadow: 0 4px 6px rgba(0,0,0,0.05); background: #ffffff; padding: 24px; font-family: \"Georgia\", serif; max-width: 680px; }\n        .news-title { font-size: 1.35rem; font-weight: 800; font-family: Arial, sans-serif; color: #0f172a; margin-bottom: 12px; border-bottom: 2px solid #0f172a; padding-bottom: 6px; }\n        .news-header { padding-bottom: 8px; margin-bottom: 14px; display: flex; align-items: baseline; gap: 8px; font-family: Arial, sans-serif; }\n        .news-location { font-weight: 800; font-size: 1rem; color: #0f172a; text-transform: uppercase; letter-spacing: 0.5px; }\n        .news-date { font-weight: 400; font-size: 0.95rem; color: #64748b; }\n        .news-content { line-height: 1.65; color: #334155; font-size: 0.98rem; text-align: justify; }\n        .news-content p { margin-bottom: 14px; }\n        .news-content p:last-child { margin-bottom: 0; }\n    </style>\n    <div class=\"news-container\">\n        <h2 class=\"news-title\">New Addition to Shadeside Plaza</h2>\n        <div class=\"news-header\">\n            <span class=\"news-location\">BIRCH CITY</span>\n            <span class=\"news-date\">(November 12)</span>\n        </div>\n        <div class=\"news-content\">\n            <p>Design Glory, a jewelry business operated by lifelong Birch City resident Tamara Banda, has set up a brick-and-mortar store in the city's Shadeside Plaza shopping area. — [1] —. Ms. Banda said the shop, which opened on November 9, features her entire line of handmade jewelry along with <span class=\"clue-highlight-1\">a selection of beautiful natural crystals that can become the centerpiece of any room</span>.</p>\n            <p>Ms. Banda emphasizes that she sets her jewelry brand apart from others by <span class=\"clue-highlight-2\">offering handmade designs at price points that won't break a budget</span>. To keep her overhead costs in check, she says she sources materials creatively from a variety of local metal suppliers. — [2] —. Although managing the store, which is open Tuesday through Saturday from 11:00 A.M. to 5:00 P.M., will occupy much of her time, Ms. Banda said she still intends to operate booths at regional arts festivals. <span class=\"clue-highlight-4\">— [3] —</span>. She will also continue to serve on the planning committee for the annual art show at Central Arts University, where she learned her jewelry-making techniques.</p>\n            <p>The idea of opening a physical store came to Ms. Banda when a friend, Brad Machado, told her of his positive experience in <span class=\"clue-highlight-3\">operating his retail bookshop</span> on the opposite side of Shadeside Plaza from where Design Glory is now. — [4] —. The shopping area, he said, benefits from the heavy foot traffic nearby.</p>\n        </div>\n    </div>",
  "translation": "<div class=\"translation-header\">Bản dịch & Phân tích</div>\n    <div class=\"news-container\">\n        <h2 class=\"news-title\">Bổ sung mới cho Khu phức hợp Shadeside Plaza</h2>\n        <div class=\"news-header\">\n            <span class=\"news-location\">BIRCH CITY</span>\n            <span class=\"news-date\">(Ngày 12 tháng 11)</span>\n        </div>\n        <div class=\"news-content\">\n            <p>Design Glory, một doanh nghiệp trang sức do cư dân lâu năm của Birch City là cô Tamara Banda vận hành, đã mở một cửa hàng truyền thống tại khu mua sắm Shadeside Plaza của thành phố. — [1] —. Cô Banda cho biết cửa hàng, vốn mở cửa vào ngày 9 tháng 11, trưng bày toàn bộ dòng trang sức thủ công của cô cùng với <span class=\"clue-highlight-1\">một bộ sưu tập các tinh thể đá tự nhiên tuyệt đẹp có thể trở thành điểm nhấn trang trí cho bất kỳ căn phòng nào</span>.</p>\n            <p>Cô Banda nhấn mạnh rằng cô tạo sự khác biệt cho thương hiệu trang sức của mình so với các thương hiệu khác bằng cách <span class=\"clue-highlight-2\">cung cấp các thiết kế thủ công ở mức giá không làm vượt ngân sách</span>. Để kiểm soát chi phí vận hành, cô cho biết mình tìm kiếm nguyên liệu một cách sáng tạo từ nhiều nhà cung cấp kim loại tại địa phương. — [2] —. Mặc dù việc quản lý cửa hàng, vốn mở cửa từ thứ Ba đến thứ Bảy từ 11:00 sáng đến 5:00 chiều, sẽ chiếm phần lớn thời gian của cô, cô Banda cho biết cô vẫn dự định vận hành các gian hàng tại các lễ hội nghệ thuật trong khu vực. <span class=\"clue-highlight-4\">— [3] —</span>. Cô cũng sẽ tiếp tục phục vụ trong ban tổ chức cho cuộc triển lãm nghệ thuật hằng năm tại Đại học Nghệ thuật Central, nơi cô đã học các kỹ thuật chế tác trang sức của mình.</p>\n            <p>Ý tưởng mở một cửa hàng thực tế đến với cô Banda khi một người bạn, Brad Machado, kể cho cô nghe về trải nghiệm tích cực của ông trong việc <span class=\"clue-highlight-3\">vận hành cửa hàng bán sách lẻ của mình</span> ở phía đối diện của Shadeside Plaza so với vị trí của Design Glory hiện tại. — [4] —. Ông cho biết khu mua sắm này hưởng lợi từ lượng khách đi bộ đông đúc gần đó.</p>\n        </div>\n    </div>",

         <span class=\"email-field-label\">Date:</span>\n                <div class=\"email-field-val\">September 4</div>\n            </div>\n            <div class=\"email-field-row\">\n                <span class=\"email-field-label\">Subject:</span>\n                <div class=\"email-field-val\">Job tip</div>\n            </div>\n        </div>\n        <div class=\"email-body\">\n            <p style=\"margin-top: 0;\">Hello, Juan,</p>\n            <p>It was nice to see you again at the Tech Writers' Conference in Mexico City. You mentioned that your cousin Carlos Cruz wants to find a product design job here in Dallas. Well, the company I work for, AMTR Corporation, <span class=\"clue-highlight-1\">is about to post a job for a junior industrial designer</span>, which might interest him. So far, the company has announced the opening only to current employees, but next week it will appear on the company Web site. The salary is good, and there may not be any qualified candidates in-house. <span class=\"clue-highlight-1\">Please let him know about this opportunity.</span></p>\n            <p style=\"margin-bottom: 0;\">Heide Markas</p>\n        </div>\n    </div>\n\n    <!-- DOCUMENT 2: WEBPAGE -->\n    <div class=\"webpage-window\">\n        <div class=\"web-address-bar\">\n            <div class=\"web-url-box\">https://www.amtrcorp.com</div>\n        </div>\n        <div class=\"web-nav-bar\">\n            <div class=\"web-brand\">AMTR<br>Corporation</div>\n            <div class=\"web-menu\">\n                <span>HOME</span>\n                <span>ABOUT</span>\n                <span class=\"active\">CAREERS</span>\n                <span>CONTACT</span>\n                <span>BLOG</span>\n            </div>\n        </div>\n        <div class=\"web-body\">\n            <h2>Current Opportunities</h2>\n            <p><strong>Junior Industrial Designer:</strong> This is a full-time position developing and improving the full range of products manufactured by AMTR Corporation in Dallas, Texas.</p>\n            <h3>Sample Job Duties:</h3>\n            <ul>\n                <li>Design consumer and <span class=\"clue-highlight-2\">office supply products, including personal computers, tablets, copiers, and printers</span></li>\n                <li>Collaborate with design team and colleagues from engineering, marketing, and manufacturing departments to develop new products</li>\n                <li>Improve sustainability efforts by promoting the use of recycled, recyclable, and reusable materials</li>\n            </ul>\n            <h3>Qualifications:</h3>\n            <ul>\n                <li>Understanding of design principles, theories, and concepts</li>\n                <li>Ability to analyze and apply customer feedback</li>\n                <li>Proven analytical and problem-solving skills</li>\n                <li>Experience in creating sketches, storyboards, models, and prototypes</li>\n                <li><span class=\"clue-highlight-5\">Bachelor's or master's degree in industrial design</span></li>\n            </ul>\n        </div>\n    </div>\n\n    <!-- DOCUMENT 3: EMAIL 2 -->\n    <div class=\"email-window\">\n        <div class=\"email-title-bar\">*E-mail*</div>\n        <div class=\"email-header-fields\">\n            <div class=\"email-field-row\">\n                <span class=\"email-field-label\">To:</span>\n                <div class=\"email-field-val\">Carlos Cruz &lt;ccruz@bmail.com&gt;</div>\n            </div>\n            <div class=\"email-field-row\">\n                <span class=\"email-field-label\">From:</span>\n                <div class=\"email-field-val\">Pamela Wang &lt;wangp@amtrcorp.com&gt;</div>\n            </div>\n            <div class=\"email-field-row\">\n                <span class=\"email-field-label\">Date:</span>\n                <div class=\"email-field-val\">November 11</div>\n            </div>\n            <div class=\"email-field-row\">\n                <span class=\"email-field-label\">Subject:</span>\n                <div class=\"email-field-val\">Job Application</div>\n            </div>\n        </div>\n        <div class=\"email-body\">\n            <p style=\"margin-top: 0;\">Dear Mr. Cruz,</p>\n            <p>Thank you for submitting your application for junior industrial designer to AMTR Corporation. Our hiring committee has reviewed your application and <span class=\"clue-highlight-5\">determined that you meet the qualifications for the position</span>. <span class=\"clue-highlight-3\">We will contact you shortly to schedule an initial interview.</span> <span class=\"clue-highlight-4\">Interviews will be held on-site at our Dallas headquarters during the first two weeks of December.</span> <span class=\"clue-highlight-3\">In the meantime, you will receive a request for professional references via e-mail.</span> Please respond to the request as soon as you receive it.</p>\n            <p style=\"margin-bottom: 0;\">Cordially,<br><br>Pamela Wang<br>Human Resources Specialist<br>AMTR Corporation</p>\n        </div>\n    </div>\n</div>",
  "translation": "<div class=\"translation-header\">Bản dịch & Phân tích Chi tiết</div>\n<div class=\"doc-container\">\n    <!-- DOCUMENT 1: EMAIL 1 TRANSLATION -->\n    <div class=\"email-window\">\n        <div class=\"email-title-bar\">*Thư điện tử 1*</div>\n        <div class=\"email-header-fields\">\n            <div class=\"email-field-row\">\n                <span class=\"email-field-label\">Người nhận:</span>\n                <div class=\"email-field-val\">jsantos@coloniamenor.com</div>\n            </div>\n            <div class=\"email-field-row\">\n                <span class=\"email-field-label\">Người gửi:</span>\n                <div class=\"email-field-val\">markash@amtrcorp.com</div>\n            </div>\n            <div class=\"email-field-row\">\n                <span class=\"email-field-label\">Ngày:</span>\n                <div class=\"email-field-val\">4 tháng 9</div>\n            </div>\n            <div class=\"email-field-row\">\n                <span class=\"email-field-label\">Tiêu đề:</span>\n                <div class=\"email-field-val\">Mẹo công việc</div>\n            </div>\n        </div>\n        <div class=\"email-body\">\n            <p style=\"margin-top: 0;\">Xin chào, Juan,</p>\n            <p>Rất vui được gặp lại anh tại Hội thảo Nhà văn Công nghệ ở Thành phố Mexico. Anh có đề cập rằng em họ của anh, Carlos Cruz, muốn tìm một công việc thiết kế sản phẩm tại Dallas này. Chà, công ty tôi đang làm việc, Tập đoàn AMTR, <span class=\"clue-highlight-1\">sắp đăng tuyển vị trí nhà thiết kế công nghiệp cấp thấp (Junior Industrial Designer)</span>, điều mà anh ấy có thể quan tâm. Cho đến nay, công ty mới chỉ thông báo tin tuyển dụng cho các nhân viên hiện tại, nhưng tuần tới thông tin này sẽ xuất hiện trên trang web của công ty. Mức lương rất tốt và có thể không có bất kỳ ứng viên nội bộ nào đủ điều kiện. <span class=\"clue-highlight-1\">Xin vui lòng cho anh ấy biết về cơ hội này.</span></p>\n            <p style=\"margin-bottom: 0;\">Heide Markas</p>\n        </div>\n    </div>\n\n    <!-- DOCUMENT 2: WEBPAGE TRANSLATION -->\n    <div class=\"webpage-window\">\n        <div class=\"web-address-bar\">\n            <div class=\"web-url-box\">https://www.amtrcorp.com</div>\n        </div>\n        <div class=\"web-nav-bar\">\n            <div class=\"web-brand\">Tập đoàn<br>AMTR</div>\n            <div class=\"web-menu\">\n                <span>TRANG CHỦ</span>\n                <span>GIỚI THIỆU</span>\n                <span class=\"active\">TUYỂN DỤNG</span>\n                <span>LIÊN HỆ</span>\n                <span>BLOG</span>\n            </div>\n        </div>\n        <div class=\"web-body\">\n            <h2>Cơ hội việc làm hiện tại</h2>\n            <p><strong>Nhà thiết kế công nghiệp cấp thấp (Junior Industrial Designer):</strong> Đây là vị trí toàn thời gian phát triển và cải tiến toàn bộ các dòng sản phẩm do Tập đoàn AMTR sản xuất tại Dallas, Texas.</p>\n            <h3>Nhiệm vụ công việc mẫu:</h3>\n            <ul>\n                <li>Thiết kế các sản phẩm tiêu dùng và <span class=\"clue-highlight-2\">thiết bị văn phòng, bao gồm máy tính cá nhân, máy tính bảng, máy photocopy và máy in</span></li>\n                <li>Hợp tác với đội ngũ thiết kế và các đồng nghiệp từ các bộ phận kỹ thuật, tiếp thị và sản xuất để phát triển sản phẩm mới</li>\n                <li>Cải thiện các nỗ lực phát triển bền vững bằng cách thúc đẩy việc sử dụng các vật liệu tái chế, có thể tái chế và có thể tái sử dụng</li>\n            </ul>\n            <h3>Yêu cầu tuyển dụng:</h3>\n            <ul>\n                <li>Hiểu biết về các nguyên lý, lý thuyết và khái niệm thiết kế</li>\n                <li>Khả năng phân tích và áp dụng phản hồi của khách hàng</li>\n                <li>Kỹ năng phân tích và giải quyết vấn đề đã được chứng minh</li>\n                <li>Kinh nghiệm tạo bản phác thảo, kịch bản hình ảnh (storyboard), mô hình và nguyên mẫu</li>\n                <li><span class=\"clue-highlight-5\">Có bằng cử nhân hoặc thạc sĩ về thiết kế công nghiệp</span></li>\n            </ul>\n        </div>\n    </div>\n\n    <!-- DOCUMENT 3: EMAIL 2 TRANSLATION -->\n    <div class=\"email-window\">\n        <div class=\"email-title-bar\">*Thư điện tử 2*</div>\n        <div class=\"email-header-fields\">\n            <div class=\"email-field-row\">\n                <span class=\"email-field-label\">Người nhận:</span>\n                <div class=\"email-field-val\">Carlos Cruz &lt;ccruz@bmail.com&gt;</div>\n            </div>\n            <div class=\"email-field-row\">\n                <span class=\"email-field-label\">Người gửi:</span>\n                <div class=\"email-field-val\">Pamela Wang &lt;wangp@amtrcorp.com&gt;</div>\n            </div>\n            <div class=\"email-field-row\">\n                <span class=\"email-field-label\">Ngày:</span>\n                <div class=\"email-field-val\">11 tháng 11</div>\n            </div>\n            <div class=\"email-field-row\">\n                <span class=\"email-field-label\">Tiêu đề:</span>\n                <div class=\"email-field-val\">Hồ sơ ứng tuyển</div>\n            </div>\n        </div>\n        <div class=\"email-body\">\n            <p style=\"margin-top: 0;\">Kính gửi ông Cruz,</p>\n            <p>Cảm ơn ông đã gửi hồ sơ ứng tuyển cho vị trí nhà thiết kế công nghiệp cấp thấp tại Tập đoàn AMTR. Hội đồng tuyển dụng của chúng tôi đã xem xét hồ sơ của ông và <span class=\"clue-highlight-5\">xác định rằng ông đáp ứng các yêu cầu cho vị trí này</span>. <span class=\"clue-highlight-3\">Chúng tôi sẽ sớm liên hệ với ông để sắp xếp một buổi phỏng vấn ban đầu.</span> <span class=\"clue-highlight-4\">Các buổi phỏng vấn sẽ được tổ chức trực tiếp tại trụ sở Dallas của chúng tôi trong hai tuần đầu tiên của tháng 12.</span> <span class=\"clue-highlight-3\">Trong thời gian chờ đợi, ông sẽ nhận được yêu cầu cung cấp thông tin người tham chiếu nghề nghiệp qua email.</span> Vui lòng phản hồi yêu cầu ngay khi ông nhận được.</p>\n            <p style=\"margin-bottom: 0;\">Trân trọng,<br><br>Pamela Wang<br>Chuyên viên Nhân sự<br>Tập đoàn AMTR</p>\n        </div>\n    </div>\n</div>",
