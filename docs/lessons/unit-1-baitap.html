<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luyện Tập Unit 1 - Cấu Trúc Câu | SnapEnglish</title>
    <link rel="icon" type="image/png" href="ảnh.png">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #f05248;        /* Tông hồng cam đào đo đỏ */
            --primary-gradient: linear-gradient(135deg, #ff6b6b, #f05248);
            --bg-color: #fff8f6;
            --peach-light: #fff0ed;
            --peach-border: #ffdcd6;
            --text-dark: #2d3436;
            --text-muted: #636e72;
            --white: #ffffff;
        }

        * {
            box-sizing: border-box;
            font-family: 'Nunito', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            background-image: radial-gradient(#ffcfc6 2px, transparent 2px);
            background-size: 28px 28px;
            color: var(--text-dark);
            margin: 0;
            padding-top: 65px;
            line-height: 1.6;
        }

        /* NAVBAR CỐ ĐỊNH */
        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 60px;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 4%;
            box-shadow: 0 2px 12px rgba(240, 82, 72, 0.1);
            border-bottom: 1px solid var(--peach-border);
            z-index: 1000;
        }

        .brand-btn {
            background: var(--primary-gradient);
            color: #ffffff;
            padding: 7px 16px;
            border-radius: 20px;
            font-weight: 800;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 6px;
            box-shadow: 0 3px 10px rgba(240, 82, 72, 0.25);
            text-decoration: none;
            transition: transform 0.2s ease;
        }

        .brand-btn:hover {
            transform: scale(1.03);
        }

        .nav-unit-title {
            font-weight: 800;
            font-size: 14px;
            color: var(--primary-color);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* HEADER BANNER */
        header {
            text-align: center;
            padding: 30px 20px 25px 20px;
            background: linear-gradient(135deg, #ff7675, #ff9f43, #ff6b6b);
            border-bottom-left-radius: 35px;
            border-bottom-right-radius: 35px;
            box-shadow: 0 10px 25px rgba(240, 82, 72, 0.25);
            margin-bottom: 30px;
            color: #fff;
        }

        h1 {
            font-size: 2.2em;
            margin: 0;
            text-shadow: 2px 2px 6px rgba(0,0,0,0.15);
            font-weight: 900;
        }

        .subtitle {
            font-size: 1.05em;
            font-weight: 700;
            margin-top: 5px;
            opacity: 0.95;
        }

        .score-board {
            display: inline-block;
            background: #ffffff;
            padding: 8px 24px;
            border-radius: 30px;
            font-size: 1.25em;
            font-weight: 900;
            color: var(--primary-color);
            margin-top: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            border: 3px dashed #ffb8b8;
        }

        .container {
            max-width: 880px;
            margin: 0 auto;
            padding: 0 15px 80px 15px;
        }

        /* CÁC THẺ BÀI TẬP (NHIỀU MÀU SẮC DỄ THƯƠNG) */
        .exercise-card {
            background: var(--white);
            border-radius: 20px;
            padding: 22px 25px;
            margin-bottom: 30px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.04);
            border: 2px solid transparent;
            transition: all 0.3s ease;
        }

        .exercise-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 30px rgba(240, 82, 72, 0.12);
        }

        .ex-title {
            font-size: 1.4em;
            font-weight: 900;
            margin-top: 0;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .tip-box {
            border-radius: 12px;
            padding: 12px 16px;
            margin-bottom: 20px;
            font-weight: 700;
            font-size: 0.95em;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .question-block {
            background: #fffafa;
            border-radius: 14px;
            padding: 16px;
            margin-bottom: 15px;
            border: 1px solid #ffe8e5;
        }

        .question-text {
            font-size: 1.05em;
            font-weight: 800;
            margin-bottom: 12px;
            color: #2d3436;
        }

        .options {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .option-btn {
            background: #ffffff;
            border: 2px solid #ffdcd6;
            padding: 8px 20px;
            border-radius: 20px;
            font-size: 0.98em;
            font-weight: 800;
            color: #555;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .option-btn:hover:not(:disabled) {
            border-color: var(--primary-color);
            background: var(--peach-light);
            color: var(--primary-color);
            transform: scale(1.04);
        }

        .option-btn:disabled {
            cursor: not-allowed;
        }

        .option-btn.correct {
            background: #e6f9ed !important;
            border-color: #2ecc71 !important;
            color: #27ae60 !important;
            animation: pop 0.35s ease;
        }

        .option-btn.incorrect {
            background: #ffeaea !important;
            border-color: #ff7675 !important;
            color: #d63031 !important;
            opacity: 0.85;
        }

        /* PHẦN GIẢI THÍCH RỰC RỠ & RÕ RÀNG */
        .explanation {
            margin-top: 12px;
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 0.95em;
            font-weight: 700;
            display: none;
            line-height: 1.5;
            animation: slideDown 0.3s ease forwards;
        }

        .explanation.show {
            display: block;
        }

        .explanation.success {
            background: #e8f8f5;
            color: #117a65;
            border-left: 5px solid #1abc9c;
            box-shadow: 0 4px 12px rgba(26, 188, 156, 0.1);
        }

        .explanation.error {
            background: #fdedec;
            color: #78281f;
            border-left: 5px solid #e74c3c;
            box-shadow: 0 4px 12px rgba(231, 76, 60, 0.1);
        }

        .explanation-badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 6px;
            font-size: 0.85em;
            font-weight: 900;
            margin-right: 6px;
            color: #fff;
        }

        .badge-success { background: #1abc9c; }
        .badge-error { background: #e74c3c; }

        @keyframes pop {
            0% { transform: scale(1); }
            50% { transform: scale(1.08); }
            100% { transform: scale(1); }
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* CÁC GAM MÀU PASTEL SẮC MÀU CHO TỪNG BÀI TẬP */
        /* Ex 1: Hồng Đào */
        .color-1 { border-color: #ffb8b8; }
        .color-1 .ex-title { color: #f05248; }
        .color-1 .tip-box { background: #fff0ed; color: #d63031; border: 1.5px dashed #ffb8b8; }

        /* Ex 2: Cam Tươi */
        .color-2 { border-color: #ffeaa7; }
        .color-2 .ex-title { color: #e67e22; }
        .color-2 .tip-box { background: #fff9e6; color: #d35400; border: 1.5px dashed #f39c12; }

        /* Ex 3: Tím Hồng Pastel */
        .color-3 { border-color: #f3a683; }
        .color-3 .ex-title { color: #e84393; }
        .color-3 .tip-box { background: #fde8f0; color: #c2185b; border: 1.5px dashed #f3a683; }

        /* Ex 4: Xanh Mint Tươi */
        .color-4 { border-color: #55efc4; }
        .color-4 .ex-title { color: #00b894; }
        .color-4 .tip-box { background: #e6faf5; color: #008f68; border: 1.5px dashed #55efc4; }

        /* Ex 5: Xanh Da Trời Dịu */
        .color-5 { border-color: #74b9ff; }
        .color-5 .ex-title { color: #0984e3; }
        .color-5 .tip-box { background: #ebf5ff; color: #026aa7; border: 1.5px dashed #74b9ff; }

        /* NÚT XEM LÝ THUYẾT NỔI */
        .floating-theory-btn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: var(--primary-gradient);
            color: white;
            padding: 10px 20px;
            border-radius: 30px;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 6px 18px rgba(240, 82, 72, 0.35);
            text-decoration: none;
            transition: all 0.25s;
            z-index: 1000;
        }

        .floating-theory-btn:hover {
            transform: translateY(-3px) scale(1.03);
            box-shadow: 0 10px 22px rgba(240, 82, 72, 0.45);
        }

        @media (max-width: 600px) {
            .nav-unit-title {
                font-size: 12px;
                max-width: 170px;
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
            }
            h1 { font-size: 1.7em; }
        }
    </style>
</head>
<body>

    <!-- THANH CỐ ĐỊNH -->
    <header class="navbar">
        <a href="grammar.html" class="brand-btn">⚡ SnapEnglish</a>
        <div class="nav-unit-title">UNIT 1: CẤU TRÚC CÂU TRONG TIẾNG ANH</div>
    </header>


    <!-- DANH SÁCH BÀI TẬP -->
    <div class="container" id="app"></div>

    <!-- NÚT QUAY LẠI BÀI HỌC -->
    <a href="unit-1-grammar.html" class="floating-theory-btn">
        📖 Xem Lý Thuyết
    </a>

    <script>
        const exercises = [
            {
                title: "Exercise 1: Nhận diện Chủ ngữ (Subject - S)",
                tip: "💡 Chủ ngữ chỉ người/vật thực hiện hành động. Thường đứng đầu câu và trước động từ chính!",
                colorClass: "color-1",
                icon: "🦄",
                questions: [
                    { q: "1. 'She eats very much.' Chủ ngữ trong câu là:", options: ["She", "eats", "very much"], a: "She", exp: "Đại từ 'She' đứng đầu câu làm chủ thể cho hành động 'eats'." },
                    { q: "2. 'Watching TV too much may cause eye diseases.' Chủ ngữ trong câu là:", options: ["Watching TV too much", "may cause", "eye diseases"], a: "Watching TV too much", exp: "Cụm danh động từ 'Watching TV too much' đóng vai trò làm chủ ngữ." },
                    { q: "3. 'I am a student.' Chủ ngữ trong câu là:", options: ["I", "am", "a student"], a: "I", exp: "Đại từ nhân xưng 'I' làm chủ ngữ." },
                    { q: "4. 'My father works in a factory.' Chủ ngữ là:", options: ["works", "in a factory", "My father"], a: "My father", exp: "Cụm danh từ 'My father' làm chủ ngữ cho động từ 'works'." },
                    { q: "5. 'Tom can play the piano.' Chủ ngữ trong câu là:", options: ["can play", "Tom", "the piano"], a: "Tom", exp: "Danh từ riêng 'Tom' đóng vai trò chủ ngữ." },
                    { q: "6. 'His brother is graduating from university next month.' Chủ ngữ là:", options: ["His brother", "is graduating", "next month"], a: "His brother", exp: "Cụm danh từ 'His brother' làm chủ thể hành động." },
                    { q: "7. 'Yesterday a new clothes shop was opened.' Chủ ngữ là:", options: ["Yesterday", "a new clothes shop", "was opened"], a: "a new clothes shop", exp: "Cụm danh từ 'a new clothes shop' làm chủ ngữ (đứng sau trạng ngữ thời gian)." },
                    { q: "8. 'We hope to see you soon.' Chủ ngữ là:", options: ["hope", "to see you soon", "We"], a: "We", exp: "Đại từ 'We' làm chủ ngữ chính." },
                    { q: "9. 'It is raining.' Chủ ngữ trong câu là:", options: ["It", "is", "raining"], a: "It", exp: "Đại từ 'It' đóng vai trò chủ ngữ giả chỉ thời tiết." },
                    { q: "10. 'They are playing football.' Chủ ngữ là:", options: ["are playing", "football", "They"], a: "They", exp: "Đại từ 'They' làm chủ ngữ cho hành động đang diễn ra." }
                ]
            },
            {
                title: "Exercise 2: Nhận diện Động từ (Verb - V)",
                tip: "💡 Động từ đứng sau chủ ngữ, diễn tả hành động/trạng thái. Chú ý động từ chia theo thì nha!",
                colorClass: "color-2",
                icon: "🧸",
                questions: [
                    { q: "1. 'My mother is watching TV.' Động từ trong câu là:", options: ["My mother", "is watching", "TV"], a: "is watching", exp: "Động từ chia ở thì hiện tại tiếp diễn 'is watching'." },
                    { q: "2. 'He often helps us with the housework.' Động từ chính là:", options: ["often", "helps", "us"], a: "helps", exp: "Động từ chính 'helps' chia theo chủ ngữ ngôi ba số ít 'He'." },
                    { q: "3. 'She comes from England.' Động từ trong câu là:", options: ["She", "comes", "from England"], a: "comes", exp: "Động từ 'comes' chỉ hành động/nguồn gốc." },
                    { q: "4. 'My parents bought me a new bike last week.' Động từ là:", options: ["bought", "a new bike", "last week"], a: "bought", exp: "Động từ 'buy' chia quá khứ đơn là 'bought'." },
                    { q: "5. 'We are building a sand castle.' Động từ trong câu là:", options: ["We", "are building", "a sand castle"], a: "are building", exp: "Cụm động từ chỉ hành động 'are building'." },
                    { q: "6. 'I walk to school everyday.' Động từ là:", options: ["I", "walk", "to school"], a: "walk", exp: "Động từ chỉ hành động 'walk'." },
                    { q: "7. 'He smiled.' Động từ trong câu là:", options: ["He", "smiled", "Không có"], a: "smiled", exp: "Động từ 'smiled' chia quá khứ đơn." },
                    { q: "8. 'I like listening to music.' Động từ chính của câu là:", options: ["I", "like", "listening"], a: "like", exp: "Động từ chính chia theo chủ ngữ là 'like'." },
                    { q: "9. 'She gave me a lift.' Động từ trong câu là:", options: ["She", "gave", "a lift"], a: "gave", exp: "Động từ quá khứ 'gave'." },
                    { q: "10. 'He teaches us English.' Động từ là:", options: ["He", "teaches", "English"], a: "teaches", exp: "Động từ 'teaches' chia ở hiện tại đơn." }
                ]
            },
            {
                title: "Exercise 3: Nhận diện Tân ngữ (Object - O)",
                tip: "💡 Tân ngữ đứng sau động từ, là đối tượng chịu tác động (Tân ngữ trực tiếp & gián tiếp).",
                colorClass: "color-3",
                icon: "✨",
                questions: [
                    { q: "1. 'My mother bought a new dress yesterday.' Tân ngữ trực tiếp là:", options: ["My mother", "a new dress", "yesterday"], a: "a new dress", exp: "Cụm 'a new dress' nhận tác động trực tiếp của hành động mua." },
                    { q: "2. 'I gave him a book.' Tân ngữ trực tiếp (chỉ vật) là:", options: ["I", "him", "a book"], a: "a book", exp: "Vật được đưa 'a book' là tân ngữ trực tiếp." },
                    { q: "3. 'I gave him a book.' Tân ngữ gián tiếp (chỉ người) là:", options: ["I", "him", "a book"], a: "him", exp: "Người nhận 'him' là tân ngữ gián tiếp." },
                    { q: "4. 'They are playing football.' Tân ngữ là:", options: ["They", "are playing", "football"], a: "football", exp: "'football' là môn thể thao chịu tác động của hành động chơi." },
                    { q: "5. 'She gave me a lift.' Tân ngữ gián tiếp (O1) là:", options: ["She", "me", "a lift"], a: "me", exp: "'me' là người tiếp nhận hành động quá cảnh/cho đi nhờ." },
                    { q: "6. 'He teaches us English.' Tân ngữ trực tiếp (O2) là:", options: ["He", "us", "English"], a: "English", exp: "Môn học 'English' là tân ngữ trực tiếp." },
                    { q: "7. 'I like listening to music.' Tân ngữ của câu là:", options: ["I", "like", "listening to music"], a: "listening to music", exp: "Cụm danh động từ 'listening to music' làm tân ngữ." },
                    { q: "8. 'We are building a sand castle.' Tân ngữ là:", options: ["We", "are building", "a sand castle"], a: "a sand castle", exp: "Vật được xây dựng 'a sand castle'." },
                    { q: "9. 'My parents bought me a new bike.' Tân ngữ trực tiếp là:", options: ["me", "a new bike", "My parents"], a: "a new bike", exp: "Món đồ được mua 'a new bike' là tân ngữ trực tiếp." },
                    { q: "10. 'Tom can play the piano.' Tân ngữ trong câu là:", options: ["Tom", "play", "the piano"], a: "the piano", exp: "Nhạc cụ được chơi 'the piano'." }
                ]
            },
            {
                title: "Exercise 4: Bổ ngữ (C) & Trạng ngữ (A)",
                tip: "💡 Bổ ngữ bổ nghĩa cho chủ ngữ/tân ngữ. Trạng ngữ chỉ thời gian, nơi chốn, tần suất...",
                colorClass: "color-4",
                icon: "🍀",
                questions: [
                    { q: "1. 'She is a doctor.' Cụm 'a doctor' đóng vai trò là:", options: ["Tân ngữ (O)", "Bổ ngữ (C)", "Trạng ngữ (A)"], a: "Bổ ngữ (C)", exp: "Đứng sau động từ 'is' để bổ nghĩa cho chủ ngữ 'She'." },
                    { q: "2. 'We hope to see you soon.' Cụm 'to see you soon' là:", options: ["Tân ngữ (O)", "Bổ ngữ (C)", "Trạng ngữ (A)"], a: "Bổ ngữ (C)", exp: "Bổ nghĩa cho động từ 'hope'." },
                    { q: "3. 'She looks tired.' Từ 'tired' đóng vai trò là:", options: ["Tân ngữ (O)", "Bổ ngữ (C)", "Trạng ngữ (A)"], a: "Bổ ngữ (C)", exp: "Tính từ đứng sau động từ nối 'looks' làm bổ ngữ." },
                    { q: "4. 'He considers himself an artist.' Cụm 'an artist' là:", options: ["Tân ngữ (O)", "Bổ ngữ (C)", "Trạng ngữ (A)"], a: "Bổ ngữ (C)", exp: "Bổ nghĩa cho tân ngữ 'himself'." },
                    { q: "5. 'Yesterday a new clothes shop was opened.' Từ 'Yesterday' là:", options: ["Bổ ngữ (C)", "Trạng ngữ (A)", "Chủ ngữ (S)"], a: "Trạng ngữ (A)", exp: "Trạng ngữ chỉ thời gian." },
                    { q: "6. 'I live in the city.' Cụm 'in the city' là:", options: ["Trạng ngữ (A)", "Tân ngữ (O)", "Bổ ngữ (C)"], a: "Trạng ngữ (A)", exp: "Trạng ngữ chỉ nơi chốn/địa điểm." },
                    { q: "7. 'I saw him when I was walking.' Mệnh đề 'when I was walking' là:", options: ["Tân ngữ (O)", "Bổ ngữ (C)", "Trạng ngữ (A)"], a: "Trạng ngữ (A)", exp: "Mệnh đề trạng ngữ chỉ thời gian." },
                    { q: "8. 'He often helps us.' Từ 'often' là:", options: ["Trạng ngữ (A)", "Bổ ngữ (C)", "Tân ngữ (O)"], a: "Trạng ngữ (A)", exp: "Trạng từ chỉ tần suất." },
                    { q: "9. 'I walk to school everyday.' Từ 'everyday' là:", options: ["Tân ngữ (O)", "Bổ ngữ (C)", "Trạng ngữ (A)"], a: "Trạng ngữ (A)", exp: "Trạng ngữ chỉ thời gian." },
                    { q: "10. 'My parents bought me a bike last week.' Cụm 'last week' là:", options: ["Trạng ngữ (A)", "Tân ngữ (O)", "Bổ ngữ (C)"], a: "Trạng ngữ (A)", exp: "Trạng ngữ chỉ thời gian." }
                ]
            },
            {
                title: "Exercise 5: Xác định Cấu trúc câu",
                tip: "💡 Ghép nối các thành tố S, V, O, C, A để tìm công thức đúng nhất!",
                colorClass: "color-5",
                icon: "🍓",
                questions: [
                    { q: "1. Câu 'It is raining.' thuộc cấu trúc nào?", options: ["S - V", "S - V - O", "S - V - C"], a: "S - V", exp: "It (S) + is raining (V)." },
                    { q: "2. Câu 'He smiled.' thuộc cấu trúc nào?", options: ["S - V", "S - V - O", "S - V - O - O"], a: "S - V", exp: "He (S) + smiled (V)." },
                    { q: "3. Câu 'I like listening to music.' thuộc cấu trúc nào?", options: ["S - V", "S - V - O", "S - V - C"], a: "S - V - O", exp: "I (S) + like (V) + listening to music (O)." },
                    { q: "4. Câu 'They are playing football.' thuộc cấu trúc nào?", options: ["S - V - O", "S - V - C", "S - V - O - A"], a: "S - V - O", exp: "They (S) + are playing (V) + football (O)." },
                    { q: "5. Câu 'She gave me a lift.' thuộc cấu trúc nào?", options: ["S - V - O", "S - V - O - O", "S - V - C"], a: "S - V - O - O", exp: "She (S) + gave (V) + me (O1) + a lift (O2)." },
                    { q: "6. Câu 'He teaches us English.' thuộc cấu trúc nào?", options: ["S - V - O - C", "S - V - C", "S - V - O - O"], a: "S - V - O - O", exp: "He (S) + teaches (V) + us (O1) + English (O2)." },
                    { q: "7. Câu 'He considers himself an artist.' thuộc cấu trúc nào?", options: ["S - V - O - O", "S - V - O - C", "S - V - O - A"], a: "S - V - O - C", exp: "He (S) + considers (V) + himself (O) + an artist (C)." },
                    { q: "8. Câu 'She looks tired.' thuộc cấu trúc nào?", options: ["S - V - O", "S - V - C", "S - V"], a: "S - V - C", exp: "She (S) + looks (V - Động từ nối) + tired (C)." },
                    { q: "9. Câu 'We have known each other for a long time.' thuộc cấu trúc nào?", options: ["S - V - O - A", "S - V - O - C", "S - V - O - O"], a: "S - V - O - A", exp: "We (S) + have known (V) + each other (O) + for a long time (A)." },
                    { q: "10. Câu 'I live in the city.' thuộc cấu trúc nào?", options: ["S - V - O", "S - V - A", "S - V - C"], a: "S - V - A", exp: "I (S) + live (V) + in the city (A)." }
                ]
            }
        ];

        let currentScore = 0;
        const app = document.getElementById("app");
        const scoreDisplay = document.getElementById("score");

        exercises.forEach((ex) => {
            const card = document.createElement("div");
            card.className = `exercise-card ${ex.colorClass}`;

            card.innerHTML = `
                <h2 class="ex-title">${ex.icon} ${ex.title}</h2>
                <div class="tip-box">
                    <span>${ex.tip}</span>
                </div>
            `;

            ex.questions.forEach((qObj) => {
                const qBlock = document.createElement("div");
                qBlock.className = "question-block";

                const qText = document.createElement("div");
                qText.className = "question-text";
                qText.innerText = qObj.q;
                qBlock.appendChild(qText);

                const optContainer = document.createElement("div");
                optContainer.className = "options";
                
                const expDiv = document.createElement("div");
                expDiv.className = "explanation";

                qObj.options.forEach(opt => {
                    const btn = document.createElement("button");
                    btn.className = "option-btn";
                    btn.innerText = opt;
                    
                    btn.onclick = () => {
                        const siblings = optContainer.querySelectorAll(".option-btn");
                        siblings.forEach(sibling => sibling.disabled = true);

                        if(opt === qObj.a) {
                            btn.classList.add("correct");
                            currentScore++;
                            scoreDisplay.innerText = currentScore;
                            expDiv.classList.add("success", "show");
                            expDiv.innerHTML = `<span class="explanation-badge badge-success">🎉 Chính xác!</span> ${qObj.exp}`;
                        } else {
                            btn.classList.add("incorrect");
                            siblings.forEach(sibling => {
                                if(sibling.innerText === qObj.a) sibling.classList.add("correct");
                            });
                            expDiv.classList.add("error", "show");
                            expDiv.innerHTML = `<span class="explanation-badge badge-error">❌ Thử lại nhé!</span> Đáp án đúng là <b>${qObj.a}</b>. ${qObj.exp}`;
                        }
                    };
                    optContainer.appendChild(btn);
                });

                qBlock.appendChild(optContainer);
                qBlock.appendChild(expDiv);
                card.appendChild(qBlock);
            });

            app.appendChild(card);
        });
    </script>
</body>
</html>
