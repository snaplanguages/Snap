<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luyện Tập Unit 1 - Cấu Trúc Câu | SnapEnglish</title>
    <link rel="icon" type="image/png" href="ảnh.png">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #f05248;        /* Tông hồng cam đào đỏ */
            --primary-gradient: linear-gradient(135deg, #ff6b6b, #f05248);
            --bg-gradient: linear-gradient(135deg, #fff5f2 0%, #ffe8e3 100%);
            --peach-light: #fff0ed;
            --peach-border: #ffdcd6;
            --text-dark: #2d3436;
            --text-muted: #636e72;
            --white: #ffffff;
        }

        * {
            box-sizing: border-box;
            font-family: 'Nunito', sans-serif;
        }

        body {
            background: var(--bg-gradient);
            color: var(--text-dark);
            margin: 0;
            padding-top: 75px;
            line-height: 1.6;
            min-height: 100vh;
        }

        /* NAVBAR CỐ ĐỊNH */
        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 60px;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 4%;
            box-shadow: 0 2px 12px rgba(240, 82, 72, 0.12);
            border-bottom: 1px solid var(--peach-border);
            z-index: 1000;
        }

        .brand-btn {
            background: var(--primary-gradient);
            color: #ffffff;
            padding: 7px 16px;
            border-radius: 20px;
            font-weight: 800;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 6px;
            box-shadow: 0 3px 10px rgba(240, 82, 72, 0.25);
            text-decoration: none;
            transition: transform 0.2s ease;
        }

        .brand-btn:hover {
            transform: scale(1.03);
        }

        .nav-unit-title {
            font-weight: 800;
            font-size: 14px;
            color: var(--primary-color);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .container {
            max-width: 820px;
            margin: 0 auto;
            padding: 0 15px 80px 15px;
        }

        /* BẢNG ĐIỂM & THANH TIẾN TRÌNH */
        .header-status {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #ffffff;
            padding: 12px 24px;
            border-radius: 18px;
            box-shadow: 0 4px 15px rgba(240, 82, 72, 0.08);
            margin-bottom: 20px;
            border: 1px solid var(--peach-border);
        }

        .step-badge {
            font-weight: 800;
            color: var(--primary-color);
            background: var(--peach-light);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.95em;
        }

        .score-board {
            font-size: 1.1em;
            font-weight: 900;
            color: var(--primary-color);
        }

        /* THẺ BÀI TẬP (SINGLE CARD VIEW) */
        .exercise-card {
            background: var(--white);
            border-radius: 24px;
            padding: 28px 30px;
            box-shadow: 0 12px 30px rgba(240, 82, 72, 0.1);
            border: 2px solid transparent;
            animation: fadeIn 0.4s ease-out;
        }

        .ex-title {
            font-size: 1.5em;
            font-weight: 900;
            margin-top: 0;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .tip-box {
            border-radius: 14px;
            padding: 14px 18px;
            margin-bottom: 25px;
            font-weight: 700;
            font-size: 0.95em;
            line-height: 1.5;
        }

        .question-block {
            background: #fffcfb;
            border-radius: 16px;
            padding: 18px;
            margin-bottom: 20px;
            border: 1px solid #ffe8e5;
        }

        .question-text {
            font-size: 1.05em;
            font-weight: 800;
            margin-bottom: 12px;
            color: #2d3436;
        }

        .options {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .option-btn {
            background: #ffffff;
            border: 2px solid #ffdcd6;
            padding: 9px 22px;
            border-radius: 20px;
            font-size: 0.98em;
            font-weight: 800;
            color: #555;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .option-btn:hover:not(:disabled) {
            border-color: var(--primary-color);
            background: var(--peach-light);
            color: var(--primary-color);
            transform: translateY(-2px);
        }

        .option-btn:disabled {
            cursor: not-allowed;
        }

        .option-btn.correct {
            background: #e6f9ed !important;
            border-color: #2ecc71 !important;
            color: #27ae60 !important;
            animation: pop 0.35s ease;
        }

        .option-btn.incorrect {
            background: #ffeaea !important;
            border-color: #ff7675 !important;
            color: #d63031 !important;
            opacity: 0.85;
        }

        /* PHẦN GIẢI THÍCH CHUYÊN NGHIỆP */
        .explanation {
            margin-top: 14px;
            padding: 14px 18px;
            border-radius: 12px;
            font-size: 0.95em;
            font-weight: 700;
            display: none;
            line-height: 1.6;
            animation: slideDown 0.3s ease forwards;
        }

        .explanation.show {
            display: block;
        }

        .explanation.success {
            background: #e8f8f5;
            color: #117a65;
            border-left: 5px solid #1abc9c;
        }

        .explanation.error {
            background: #fdedec;
            color: #78281f;
            border-left: 5px solid #e74c3c;
        }

        .explanation-badge {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 6px;
            font-size: 0.85em;
            font-weight: 900;
            margin-right: 8px;
            color: #fff;
        }

        .badge-success { background: #1abc9c; }
        .badge-error { background: #e74c3c; }

        /* THANH ĐIỀU HƯỚNG NÚT TIẾP THEO / QUAY LẠI */
        .nav-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 25px;
            gap: 15px;
        }

        .ctrl-btn {
            background: #ffffff;
            border: 2px solid var(--primary-color);
            color: var(--primary-color);
            padding: 12px 28px;
            border-radius: 30px;
            font-size: 1em;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.25s ease;
            box-shadow: 0 4px 12px rgba(240, 82, 72, 0.12);
        }

        .ctrl-btn:hover:not(:disabled) {
            background: var(--primary-gradient);
            color: #ffffff;
            transform: translateY(-2px);
            box-shadow: 0 6px 18px rgba(240, 82, 72, 0.25);
        }

        .ctrl-btn:disabled {
            opacity: 0.4;
            border-color: #ccc;
            color: #aaa;
            cursor: not-allowed;
            box-shadow: none;
        }

        /* TÔNG MÀU DẠNG BÀI */
        .color-1 { border-color: #ffb8b8; }
        .color-1 .ex-title { color: #f05248; }
        .color-1 .tip-box { background: #fff0ed; color: #d63031; border: 1.5px dashed #ffb8b8; }

        .color-2 { border-color: #ffeaa7; }
        .color-2 .ex-title { color: #e67e22; }
        .color-2 .tip-box { background: #fff9e6; color: #d35400; border: 1.5px dashed #f39c12; }

        .color-3 { border-color: #f3a683; }
        .color-3 .ex-title { color: #e84393; }
        .color-3 .tip-box { background: #fde8f0; color: #c2185b; border: 1.5px dashed #f3a683; }

        .color-4 { border-color: #a8e6cf; }
        .color-4 .ex-title { color: #00b894; }
        .color-4 .tip-box { background: #e6faf5; color: #008f68; border: 1.5px dashed #55efc4; }

        .color-5 { border-color: #74b9ff; }
        .color-5 .ex-title { color: #0984e3; }
        .color-5 .tip-box { background: #ebf5ff; color: #026aa7; border: 1.5px dashed #74b9ff; }

        .floating-theory-btn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: var(--primary-gradient);
            color: white;
            padding: 10px 20px;
            border-radius: 30px;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 6px 18px rgba(240, 82, 72, 0.35);
            text-decoration: none;
            transition: all 0.25s;
            z-index: 1000;
        }

        .floating-theory-btn:hover {
            transform: translateY(-3px) scale(1.03);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes pop {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 600px) {
            .nav-unit-title { font-size: 11px; max-width: 150px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
            .ctrl-btn { padding: 10px 18px; font-size: 0.9em; }
            .exercise-card { padding: 20px 18px; }
        }
    </style>
</head>
<body>

    <!-- THANH C CỐ ĐỊNH -->
    <header class="navbar">
        <a href="grammar.html" class="brand-btn">⚡ SnapEnglish</a>
        <div class="nav-unit-title">UNIT 1: CẤU TRÚC CÂU TRONG TIẾNG ANH</div>
    </header>

    <div class="container">
        <!-- BẢNG TIẾN TRÌNH & ĐIỂM SỐ -->
        <div class="header-status">
            <div class="step-badge" id="stepIndicator">Dạng 1 / 5</div>
            <div class="score-board">⭐ Điểm số: <span id="score">0</span></div>
        </div>

        <!-- KHU VỰC HIỂN THỊ 1 THẺ BÀI TẬP -->
        <div id="exerciseContainer"></div>

        <!-- THANH ĐIỀU HƯỚNG NÚT -->
        <div class="nav-controls">
            <button class="ctrl-btn" id="prevBtn" onclick="changeExercise(-1)">⬅️ Dạng trước</button>
            <button class="ctrl-btn" id="nextBtn" onclick="changeExercise(1)">Dạng tiếp theo ➡️</button>
        </div>
    </div>

    <!-- NÚT XEM LÝ THUYẾT -->
    <a href="unit-1-grammar.html" class="floating-theory-btn">
        📖 Xem Lý Thuyết
    </a>

    <script>
        const exercises = [
            {
                title: "Exercise 1: Nhận diện Chủ ngữ (Subject - S)",
                tip: "💡 Chủ ngữ (S) thực hiện hành động hoặc là đối tượng chính được nói tới. Thường đứng đầu câu và đứng trước động từ chính!",
                colorClass: "color-1",
                icon: "🦄",
                questions: [
                    { q: "1. 'She eats very much.' Chủ ngữ trong câu là:", options: ["She", "eats", "very much"], a: "She", exp: "Đại từ nhân xưng 'She' làm chủ ngữ thực hiện hành động ăn ('eats')." },
                    { q: "2. 'Watching TV too much may cause eye diseases.' Chủ ngữ trong câu là:", options: ["Watching TV too much", "may cause", "eye diseases"], a: "Watching TV too much", exp: "Cụm danh động từ (V-ing phrase) 'Watching TV too much' đóng vai trò danh từ làm chủ ngữ số ít." },
                    { q: "3. 'I am a student.' Chủ ngữ trong câu là:", options: ["I", "am", "a student"], a: "I", exp: "Đại từ 'I' đứng đầu câu đóng vai trò làm chủ ngữ chính đi với động từ to-be 'am'." },
                    { q: "4. 'My father works in a factory.' Chủ ngữ là:", options: ["works", "in a factory", "My father"], a: "My father", exp: "Cụm danh từ 'My father' làm chủ ngữ thực hiện hành động 'works'." },
                    { q: "5. 'Tom can play the piano.' Chủ ngữ trong câu là:", options: ["can play", "Tom", "the piano"], a: "Tom", exp: "Danh từ riêng 'Tom' đóng vai trò làm chủ ngữ cho trợ động từ 'can'." },
                    { q: "6. 'His brother is graduating from university next month.' Chủ ngữ là:", options: ["His brother", "is graduating", "next month"], a: "His brother", exp: "Cụm danh từ 'His brother' làm chủ thể thực hiện hành động tốt nghiệp ('is graduating')." },
                    { q: "7. 'Yesterday a new clothes shop was opened.' Chủ ngữ là:", options: ["Yesterday", "a new clothes shop", "was opened"], a: "a new clothes shop", exp: "'a new clothes shop' là cụm danh từ làm chủ ngữ trong câu bị động (đứng sau trạng ngữ chỉ thời gian 'Yesterday')." },
                    { q: "8. 'We hope to see you soon.' Chủ ngữ là:", options: ["hope", "to see you soon", "We"], a: "We", exp: "Đại từ nhân xưng số nhiều 'We' làm chủ ngữ cho động từ 'hope'." },
                    { q: "9. 'It is raining.' Chủ ngữ trong câu là:", options: ["It", "is", "raining"], a: "It", exp: "'It' là chủ ngữ giả (Dummy Subject) dùng để chỉ thời tiết." },
                    { q: "10. 'They are playing football.' Chủ ngữ là:", options: ["are playing", "football", "They"], a: "They", exp: "Đại từ 'They' làm chủ ngữ chỉ nhóm người đang chơi đá bóng." }
                ]
            },
            {
                title: "Exercise 2: Nhận diện Động từ (Verb - V)",
                tip: "💡 Động từ (V) đứng sau chủ ngữ, diễn tả hành động, quá trình hoặc trạng thái của chủ ngữ.",
                colorClass: "color-2",
                icon: "🧸",
                questions: [
                    { q: "1. 'My mother is watching TV.' Động từ trong câu là:", options: ["My mother", "is watching", "TV"], a: "is watching", exp: "Động từ 'is watching' ở thì Hiện tại tiếp diễn (be + V-ing) diễn tả hành động đang xảy ra." },
                    { q: "2. 'He often helps us with the housework.' Động từ chính là:", options: ["often", "helps", "us"], a: "helps", exp: "'helps' là động từ chính được chia ở hiện tại đơn theo chủ ngữ số ít 'He'." },
                    { q: "3. 'She comes from England.' Động từ trong câu là:", options: ["She", "comes", "from England"], a: "comes", exp: "'comes' là động từ thường chỉ nguồn gốc, xuất xứ." },
                    { q: "4. 'My parents bought me a new bike last week.' Động từ là:", options: ["bought", "a new bike", "last week"], a: "bought", exp: "'bought' là dạng quá khứ đơn bất quy tắc của động từ 'buy'." },
                    { q: "5. 'We are building a sand castle.' Động từ trong câu là:", options: ["We", "are building", "a sand castle"], a: "are building", exp: "'are building' là thì hiện tại tiếp diễn diễn tả hành động đang xây dựng." },
                    { q: "6. 'I walk to school everyday.' Động từ là:", options: ["I", "walk", "to school"], a: "walk", exp: "'walk' là động từ nguyên mẫu chỉ thói quen đi bộ hàng ngày." },
                    { q: "7. 'He smiled.' Động từ trong câu là:", options: ["He", "smiled", "Không có"], a: "smiled", exp: "'smiled' là nội động từ (Intransitive Verb) chia ở quá khứ đơn, không cần tân ngữ đi kèm." },
                    { q: "8. 'I like listening to music.' Động từ chính của câu là:", options: ["I", "like", "listening"], a: "like", exp: "'like' là động từ chính chia theo chủ ngữ 'I'. 'listening' là danh động từ đóng vai trò tân ngữ." },
                    { q: "9. 'She gave me a lift.' Động từ trong câu là:", options: ["She", "gave", "a lift"], a: "gave", exp: "'gave' là động từ chia ở quá khứ đơn của 'give'." },
                    { q: "10. 'He teaches us English.' Động từ là:", options: ["He", "teaches", "English"], a: "teaches", exp: "'teaches' là động từ chia theo chủ ngữ 'He' ở thì hiện tại đơn." }
                ]
            },
            {
                title: "Exercise 3: Nhận diện Tân ngữ (Object - O)",
                tip: "💡 Tân ngữ (O) đứng sau động từ, chịu tác động của hành động. Gồm Tân ngữ trực tiếp (Od - chỉ vật) & Tân ngữ gián tiếp (Oi - chỉ người).",
                colorClass: "color-3",
                icon: "✨",
                questions: [
                    { q: "1. 'My mother bought a new dress yesterday.' Tân ngữ trực tiếp là:", options: ["My mother", "a new dress", "yesterday"], a: "a new dress", exp: "Cụm danh từ 'a new dress' là Tân ngữ trực tiếp (Direct Object) chịu tác động trực tiếp của hành động 'bought'." },
                    { q: "2. 'I gave him a book.' Tân ngữ trực tiếp (chỉ vật) là:", options: ["I", "him", "a book"], a: "a book", exp: "Đồ vật được trao đi 'a book' là Tân ngữ trực tiếp (Od)." },
                    { q: "3. 'I gave him a book.' Tân ngữ gián tiếp (chỉ người) là:", options: ["I", "him", "a book"], a: "him", exp: "Người tiếp nhận đồ vật 'him' là Tân ngữ gián tiếp (Indirect Object - Oi)." },
                    { q: "4. 'They are playing football.' Tân ngữ là:", options: ["They", "are playing", "football"], a: "football", exp: "'football' là danh từ đóng vai trò tân ngữ trực tiếp cho hành động 'playing'." },
                    { q: "5. 'She gave me a lift.' Tân ngữ gián tiếp (Oi) là:", options: ["She", "me", "a lift"], a: "me", exp: "'me' là tân ngữ gián tiếp (chỉ người nhận hành động cho đi nhờ)." },
                    { q: "6. 'He teaches us English.' Tân ngữ trực tiếp (Od) là:", options: ["He", "us", "English"], a: "English", exp: "Môn học 'English' là tân ngữ trực tiếp chỉ nội dung được giảng dạy." },
                    { q: "7. 'I like listening to music.' Tân ngữ của câu là:", options: ["I", "like", "listening to music"], a: "listening to music", exp: "Cụm danh động từ 'listening to music' giữ vai trò làm tân ngữ cho động từ 'like'." },
                    { q: "8. 'We are building a sand castle.' Tân ngữ là:", options: ["We", "are building", "a sand castle"], a: "a sand castle", exp: "'a sand castle' là tân ngữ trực tiếp chỉ kết quả của việc xây dựng." },
                    { q: "9. 'My parents bought me a new bike.' Tân ngữ trực tiếp là:", options: ["me", "a new bike", "My parents"], a: "a new bike", exp: "Chiếc xe đạp 'a new bike' là tân ngữ trực tiếp (Od)." },
                    { q: "10. 'Tom can play the piano.' Tân ngữ trong câu là:", options: ["Tom", "play", "the piano"], a: "the piano", exp: "'the piano' là tân ngữ bổ nghĩa cho động từ 'play'." }
                ]
            },
            {
                title: "Exercise 4: Bổ ngữ (C) & Trạng ngữ (A)",
                tip: "💡 Bổ ngữ (C) làm rõ nghĩa cho S hoặc O (đứng sau to-be/động từ nối). Trạng ngữ (A) bổ sung thông tin thời gian, nơi chốn, cách thức.",
                colorClass: "color-4",
                icon: "🍀",
                questions: [
                    { q: "1. 'She is a doctor.' Cụm 'a doctor' đóng vai trò là:", options: ["Tân ngữ (O)", "Bổ ngữ (C)", "Trạng ngữ (A)"], a: "Bổ ngữ (C)", exp: "'a doctor' là Bổ ngữ cho chủ ngữ (Subject Complement - Cs), đứng sau động từ to-be 'is' để giải thích rõ danh tính của 'She'." },
                    { q: "2. 'We hope to see you soon.' Cụm 'to see you soon' là:", options: ["Tân ngữ (O)", "Bổ ngữ (C)", "Trạng ngữ (A)"], a: "Bổ ngữ (C)", exp: "Cụm 'to see you soon' làm Bổ ngữ bổ nghĩa cho động từ 'hope'." },
                    { q: "3. 'She looks tired.' Từ 'tired' đóng vai trò là:", options: ["Tân ngữ (O)", "Bổ ngữ (C)", "Trạng ngữ (A)"], a: "Bổ ngữ (C)", exp: "'tired' là tính từ đóng vai trò Bổ ngữ (Cs) đứng sau động từ nối (Linking verb) 'looks'." },
                    { q: "4. 'He considers himself an artist.' Cụm 'an artist' là:", options: ["Tân ngữ (O)", "Bổ ngữ (C)", "Trạng ngữ (A)"], a: "Bổ ngữ (C)", exp: "'an artist' là Bổ ngữ cho tân ngữ (Object Complement - Co) làm rõ chức danh của tân ngữ 'himself'." },
                    { q: "5. 'Yesterday a new clothes shop was opened.' Từ 'Yesterday' là:", options: ["Bổ ngữ (C)", "Trạng ngữ (A)", "Chủ ngữ (S)"], a: "Trạng ngữ (A)", exp: "'Yesterday' là Trạng ngữ (Adverbial) chỉ thời gian." },
                    { q: "6. 'I live in the city.' Cụm 'in the city' là:", options: ["Trạng ngữ (A)", "Tân ngữ (O)", "Bổ ngữ (C)"], a: "Trạng ngữ (A)", exp: "'in the city' là Trạng ngữ chỉ địa điểm / nơi chốn." },
                    { q: "7. 'I saw him when I was walking.' Mệnh đề 'when I was walking' là:", options: ["Tân ngữ (O)", "Bổ ngữ (C)", "Trạng ngữ (A)"], a: "Trạng ngữ (A)", exp: "Mệnh đề 'when I was walking' làm Trạng ngữ chỉ thời điểm xảy ra sự việc." },
                    { q: "8. 'He often helps us.' Từ 'often' là:", options: ["Trạng ngữ (A)", "Bổ ngữ (C)", "Tân ngữ (O)"], a: "Trạng ngữ (A)", exp: "'often' là Trạng từ chỉ tần suất." },
                    { q: "9. 'I walk to school everyday.' Từ 'everyday' là:", options: ["Tân ngữ (O)", "Bổ ngữ (C)", "Trạng ngữ (A)"], a: "Trạng ngữ (A)", exp: "'everyday' là Trạng ngữ chỉ thời gian/tần suất thực hiện hành động." },
                    { q: "10. 'My parents bought me a bike last week.' Cụm 'last week' là:", options: ["Trạng ngữ (A)", "Tân ngữ (O)", "Bổ ngữ (C)"], a: "Trạng ngữ (A)", exp: "'last week' là Trạng ngữ chỉ thời gian trong quá khứ." }
                ]
            },
            {
                title: "Exercise 5: Xác định Cấu trúc câu tổng hợp",
                tip: "💡 Phân tích từng thành tố trong câu theo công thức: S (Chủ ngữ), V (Động từ), O (Tân ngữ), C (Bổ ngữ), A (Trạng ngữ).",
                colorClass: "color-5",
                icon: "🍓",
                questions: [
                    { q: "1. Câu 'It is raining.' thuộc cấu trúc nào?", options: ["S - V", "S - V - O", "S - V - C"], a: "S - V", exp: "Cấu trúc S - V: It (S) + is raining (V - động từ nội không cần tân ngữ)." },
                    { q: "2. Câu 'He smiled.' thuộc cấu trúc nào?", options: ["S - V", "S - V - O", "S - V - O - O"], a: "S - V", exp: "Cấu trúc S - V: He (S) + smiled (V)." },
                    { q: "3. Câu 'I like listening to music.' thuộc cấu trúc nào?", options: ["S - V", "S - V - O", "S - V - C"], a: "S - V - O", exp: "Cấu trúc S - V - O: I (S) + like (V) + listening to music (O)." },
                    { q: "4. Câu 'They are playing football.' thuộc cấu trúc nào?", options: ["S - V - O", "S - V - C", "S - V - O - A"], a: "S - V - O", exp: "Cấu trúc S - V - O: They (S) + are playing (V) + football (O)." },
                    { q: "5. Câu 'She gave me a lift.' thuộc cấu trúc nào?", options: ["S - V - O", "S - V - O - O", "S - V - C"], a: "S - V - O - O", exp: "Cấu trúc S - V - O - O: She (S) + gave (V) + me (O1 - gián tiếp) + a lift (O2 - trực tiếp)." },
                    { q: "6. Câu 'He teaches us English.' thuộc cấu trúc nào?", options: ["S - V - O - C", "S - V - C", "S - V - O - O"], a: "S - V - O - O", exp: "Cấu trúc S - V - O - O: He (S) + teaches (V) + us (O1) + English (O2)." },
                    { q: "7. Câu 'He considers himself an artist.' thuộc cấu trúc nào?", options: ["S - V - O - O", "S - V - O - C", "S - V - O - A"], a: "S - V - O - C", exp: "Cấu trúc S - V - O - C: He (S) + considers (V) + himself (O) + an artist (C bổ nghĩa cho O)." },
                    { q: "8. Câu 'She looks tired.' thuộc cấu trúc nào?", options: ["S - V - O", "S - V - C", "S - V"], a: "S - V - C", exp: "Cấu trúc S - V - C: She (S) + looks (V - Động từ nối) + tired (C bổ nghĩa cho S)." },
                    { q: "9. Câu 'We have known each other for a long time.' thuộc cấu trúc nào?", options: ["S - V - O - A", "S - V - O - C", "S - V - O - O"], a: "S - V - O - A", exp: "Cấu trúc S - V - O - A: We (S) + have known (V) + each other (O) + for a long time (A - trạng ngữ chỉ thời gian)." },
                    { q: "10. Câu 'I live in the city.' thuộc cấu trúc nào?", options: ["S - V - O", "S - V - A", "S - V - C"], a: "S - V - A", exp: "Cấu trúc S - V - A: I (S) + live (V) + in the city (A - trạng ngữ chỉ nơi chốn)." }
                ]
            }
        ];

        let currentExerciseIndex = 0;
        let score = 0;

        const exerciseContainer = document.getElementById("exerciseContainer");
        const stepIndicator = document.getElementById("stepIndicator");
        const scoreDisplay = document.getElementById("score");
        const prevBtn = document.getElementById("prevBtn");
        const nextBtn = document.getElementById("nextBtn");

        function renderExercise(index) {
            const ex = exercises[index];
            stepIndicator.innerText = `Dạng ${index + 1} / ${exercises.length}`;

            // Cập nhật trạng thái nút
            prevBtn.disabled = index === 0;
            if (index === exercises.length - 1) {
                nextBtn.innerText = "Hoàn thành 🎉";
            } else {
                nextBtn.innerText = "Dạng tiếp theo ➡️";
            }

            // Tạo khung thẻ
            const card = document.createElement("div");
            card.className = `exercise-card ${ex.colorClass}`;

            card.innerHTML = `
                <h2 class="ex-title">${ex.icon} ${ex.title}</h2>
                <div class="tip-box">
                    <span>${ex.tip}</span>
                </div>
            `;

            ex.questions.forEach((qObj) => {
                const qBlock = document.createElement("div");
                qBlock.className = "question-block";

                const qText = document.createElement("div");
                qText.className = "question-text";
                qText.innerText = qObj.q;
                qBlock.appendChild(qText);

                const optContainer = document.createElement("div");
                optContainer.className = "options";
                
                const expDiv = document.createElement("div");
                expDiv.className = "explanation";

                qObj.options.forEach(opt => {
                    const btn = document.createElement("button");
                    btn.className = "option-btn";
                    btn.innerText = opt;
                    
                    btn.onclick = () => {
                        const siblings = optContainer.querySelectorAll(".option-btn");
                        siblings.forEach(sibling => sibling.disabled = true);

                        if(opt === qObj.a) {
                            btn.classList.add("correct");
                            score += 10;
                            scoreDisplay.innerText = score;
                            expDiv.classList.add("success", "show");
                            expDiv.innerHTML = `<span class="explanation-badge badge-success">🎉 Chính xác!</span> ${qObj.exp}`;
                        } else {
                            btn.classList.add("incorrect");
                            siblings.forEach(sibling => {
                                if(sibling.innerText === qObj.a) sibling.classList.add("correct");
                            });
                            expDiv.classList.add("error", "show");
                            expDiv.innerHTML = `<span class="explanation-badge badge-error">❌ Chưa đúng!</span> Đáp án đúng là <b>${qObj.a}</b>.<br><b>Giải thích:</b> ${qObj.exp}`;
                        }
                    };
                    optContainer.appendChild(btn);
                });

                qBlock.appendChild(optContainer);
                qBlock.appendChild(expDiv);
                card.appendChild(qBlock);
            });

            exerciseContainer.innerHTML = "";
            exerciseContainer.appendChild(card);
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function changeExercise(step) {
            const newIndex = currentExerciseIndex + step;
            if (newIndex >= 0 && newIndex < exercises.length) {
                currentExerciseIndex = newIndex;
                renderExercise(currentExerciseIndex);
            } else if (newIndex >= exercises.length) {
                alert(`Chúc mừng bạn đã hoàn thành tất cả các bài tập! Tổng điểm của bạn là: ${score}`);
            }
        }

        // Khởi tạo bài tập đầu tiên
        renderExercise(currentExerciseIndex);
    </script>
</body>
</html>
