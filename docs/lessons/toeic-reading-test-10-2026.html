an class=\"clue-highlight-3\">On the exhibition's final day, the works will be dismantled, and all the recyclable materials, including the items brought by visitors, will be transported to a Flyner Industries facility</span>, where they will be shredded and transformed into material for waterproof curtains.</p>\n        <p>MCAC is open daily from 10:00 A.M. to 5:00 P.M. Admission to the art center is free. <span class=\"clue-highlight-4\">In addition to Ms. Alonso's show, works by several local art students will be on view in MCAC's main gallery.</span></p>\n    </div>\n</div>",

    "passage": "<div class=\"article-container\">\n    <div class=\"article-title\" style=\"text-align: center; \"><b>WELCOME TO RICHMOND SUPERMARKET!</b></div>\n    <div class=\"article-title\" style=\"text-align: center; \"><b>DID YOU KNOW?</b></div>\n    <div class=\"article-body\">\n        <p>Richmond Supermarket is now offering cooking classes in our own state-of-the-art kitchen, the same kitchen where we create flavourful soups, salads, and entrées for our prepared foods department. Every Monday evening from 7:00 P.M. to 8:30 P.M. we turn our kitchen over to a guest chef from one of Richmond's many fine restaurants. Participants learn to prepare a different dish each week. Learn new techniques you can bring home to delight your friends and family! <span class=\"clue-highlight-1\">All classes use ingredients you can find right here in the store.</span></p>\n        <p>This month's classes are as follows:</p>\n        <ul style=\"list-style-type: none; padding-left: 20px;\">\n            <li>2 August - Butter Chicken (India)</li>\n            <li>9 August - Pad Thai (Thailand)</li>\n            <li><span class=\"clue-highlight-3\">16 August - Fish Tacos (Mexico)</span></li>\n            <li>23 August - Roast Vegetable Lasagna (Italy)</li>\n        </ul>\n        <p>The fee for each class is $55.00. To register, please call us at 604-555-0175 or visit www.richmondsupermarket.ca. There is a limit of 15 students per class. Classes sell out quickly, so reserve your spot today.</p>\n        <hr style=\"margin: 20px 0;\">\n        <div style=\"border: 1px solid #ccc; padding: 10px; margin-top: 15px;\">\n            <div style=\"background: #f4f4f4; padding: 5px; font-family: monospace;\">https://www.richmondsupermarket.ca/reviews</div>\n            <div style=\"display: flex; gap: 10px; border-bottom: 1px solid #ccc; padding: 5px 0;\">\n                <span>Online Shopping</span> | <span>Contact Us</span> | <b>Reviews</b> | <span>Cooking Classes</span>\n            </div>\n            <div style=\"padding-top: 10px;\">\n                <p>Thanks to Richmond Supermarket's new cooking classes, community members can take lessons from some of the best chefs in the area. <span class=\"clue-highlight-3\">Last week I learned how to prepare fish tacos</span> with Mateo Bernal, head chef at Bernal's Restaurant. We made every component of the tacos from scratch, <span class=\"clue-highlight-4\">including the corn tortillas, grilled tilapia, and tomatillo salsa.</span> Before leaving, each attendee received a small notebook containing the recipe we made that day as well as a few of Mr. Bernal's other favourite recipes. <span class=\"clue-highlight-5\">I'm going to clear my Monday evenings so I can go back again and again!</span></p>\n                <p>—Astrid Klein</p>\n            </div>\n        </div>\n    </div>\n</div>",
    "translation": "<div class=\"translation-header\">Bản dịch & Phân tích</div>\n        <div class=\"article-container\">\n            <div class=\"article-body\">\n                <p style=\"text-align: center; font-weight: bold;\">CHÀO MỪNG ĐẾN VỚI SIÊU THỊ RICHMOND!</p>\n                <p style=\"text-align: center; font-weight: bold;\">BẠN CÓ BIẾT?</p>\n                <p>Siêu thị Richmond hiện đang cung cấp các lớp học nấu ăn ngay tại căn bếp hiện đại của chúng tôi, cùng căn bếp nơi chúng tôi chế biến các món súp, salad và món chính đậm đà cho bộ phận thực phẩm chế biến sẵn. Vào mỗi tối thứ Hai từ 19:00 đến 20:30, chúng tôi bàn giao căn bếp cho một đầu bếp khách mời từ một trong nhiều nhà hàng cao cấp ở Richmond. Người tham gia sẽ học cách chế biến một món ăn khác nhau mỗi tuần. Hãy học các kỹ thuật mới mà bạn có thể mang về nhà để làm hài lòng bạn bè và gia đình! <span class=\"clue-highlight-1\">Tất cả các lớp học đều sử dụng nguyên liệu mà bạn có thể tìm thấy ngay tại cửa hàng.</span></p>\n                <p>Các lớp học trong tháng này như sau:</p>\n                <ul style=\"list-style-type: none; padding-left: 20px;\">\n                    <li>2 tháng 8 - Gà nấu bơ (Ấn Độ)</li>\n                    <li>9 tháng 8 - Pad Thai (Thái Lan)</li>\n                    <li><span class=\"clue-highlight-3\">16 tháng 8 - Fish Tacos (Mexico)</span></li>\n                    <li>23 tháng 8 - Lasagna rau củ đút lò (Ý)</li>\n                </ul>\n                <p>Học phí cho mỗi lớp là $55.00. Để đăng ký, vui lòng gọi cho chúng tôi theo số 604-555-0175 hoặc truy cập www.richmondsupermarket.ca. Mỗi lớp giới hạn tối đa 15 học viên. Các lớp học hết chỗ rất nhanh, vì vậy hãy giữ chỗ ngay hôm nay.</p>\n                <hr style=\"margin: 20px 0;\">\n                <p><b>[Đánh giá trực tuyến]</b></p>\n                <p>Nhờ các lớp học nấu ăn mới của Siêu thị Richmond, cư dân trong cộng đồng có thể học hỏi từ một số đầu bếp giỏi nhất trong khu vực. <span class=\"clue-highlight-3\">Tuần trước, tôi đã học cách làm món fish tacos</span> với Mateo Bernal, bếp trưởng tại Nhà hàng Bernal's. Chúng tôi đã tự làm từng thành phần của món tacos từ đầu, <span class=\"clue-highlight-4\">bao gồm bánh tortillas ngô, cá rô phi nướng và sốt tomatillo.</span> Trước khi ra về, mỗi người tham dự đều nhận được một cuốn sổ tay nhỏ chứa công thức nấu ăn chúng tôi đã làm ngày hôm đó cũng như một vài công thức yêu thích khác của ông Bernal. <span class=\"clue-highlight-5\">Tôi sẽ sắp xếp trống các tối thứ Hai của mình để có thể quay lại nhiều lần nữa!</span></p>\n                <p>—Astrid Klein</p>\n            </div>\n        </div>",

    "passage": "<div class=\"article-container\">\n    <div class=\"article-title\" style=\"text-align: center;\"><b>New Dean Appointed at Institute</b></div>\n    <div class=\"article-title\" style=\"text-align: center;\"><b>__________________________</b></div>\n    <div class=\"article-body\">\n        <p><span style=\"font-size: 1.05rem;\">YORK (17 January)—The Callard Eye Institute announced on Tuesday that <span class=\"clue-highlight-1\">Jennifer Robbins, M.D., has accepted the position of dean, effective immediately.</span></span></p>\n        <p>Dr. Robbins, who grew up in York, earned her medical degree at Labato School of Medicine and <span class=\"clue-highlight-2\">completed a postdoctoral residency at Petersen Medical Center.</span> Before she arrived at the institute, Dr. Robbins was the founder and director of the ophthalmology clinic at Morseville Hospital. Her innovations in treating eye diseases have benefited thousands of patients worldwide.</p>\n        <p>On April 17, Dr. Robbins will be in Berlin to receive the Kramer Medal for Medical Excellence at this year's conference of the International Center for Vision Advancement.</p>\n        <hr style=\"margin: 20px 0; border: 0; border-top: 1px solid #ccc;\">\n        <div style=\"text-align: center; font-weight: bold;\">International Center for Vision Advancement (ICVA) Conference</div>\n        <div style=\"text-align: center;\">JT Pepper Convention Hall (17–19 April)<br>Rosenthaler Strasse 65, Berlin, Germany 25627</div><br>\n        <div style=\"text-align: center; font-weight: bold;\">Day 1 Schedule: Monday, 17 April</div>\n        <table border=\"1\" cellpadding=\"6\" cellspacing=\"0\" style=\"width:100%; margin-top:10px; border-collapse: collapse;\">\n            <tr><td>8:00–10:00 A.M.</td><td>Breakfast</td><td>Maiwald Lounge</td></tr>\n            <tr><td>10:00–11:00 A.M.</td><td>Welcome and <span class=\"clue-highlight-5\">keynote address</span></td><td>Jahn Conference Hall</td></tr>\n            <tr><td>11:15 A.M.–1:15 P.M.</td><td>Session 1: New Technologies</td><td>Breakout rooms, as assigned</td></tr>\n            <tr><td>1:30–3:30 P.M.</td><td>Lunch group seminar</td><td>Edwards Room</td></tr>\n            <tr><td>3:45–5:45 P.M.</td><td>Session 2: Quality Eye Care</td><td>Breakout rooms, as assigned</td></tr>\n            <tr><td>6:00–7:30 P.M.</td><td>Free period</td><td>---</td></tr>\n            <tr><td>7:30–9:00 P.M.</td><td>Dinner</td><td>Regal Ballroom</td></tr>\n            <tr><td>9:00–9:30 P.M.</td><td>Dessert and <span class=\"clue-highlight-3\">awards ceremony</span></td><td><span class=\"clue-highlight-3\">Regal Ballroom</span></td></tr>\n        </table>\n        <hr style=\"margin: 20px 0; border: 0; border-top: 1px solid #ccc;\">\n        <div style=\"text-align: center; font-weight: bold;\">*E-mail*</div>\n        <p><b>To:</b> Dae-Ho Sohn<br><b>From:</b> Paulina Raskin<br><b>Subject:</b> Your presentation<br><b>Date:</b> 22 April</p>\n        <p>Dear Dr. Sohn,</p>\n        <p><span class=\"clue-highlight-4\">I just wanted to thank you again for speaking at the ICVA conference in Berlin last week.</span> I am sure I am not alone in saying that the highlight of the conference was <span class=\"clue-highlight-5\">your keynote address</span>. Your insights into recent advancements in eye-surgery techniques captured the attention of everyone in the room. <span class=\"clue-highlight-4\">We were grateful that you could join us</span> and even more appreciative of all the help and guidance you have provided in the past as an active member of the ICVA Board of Directors.</p>\n        <p>Sincerely,<br>Paulina Raskin<br>President, International Center for Vision Advancement</p>\n    </div>\n</div>",
    "translation": "<div class=\"translation-header\">Bản dịch & Phân tích</div>\n<div class=\"article-container\">\n    <div class=\"article-body\">\n        <p><b>Bổ nhiệm Viện trưởng mới tại Viện Mắt</b></p>\n        <p>YORK (Ngày 17 tháng 1) — Viện Mắt Callard đã thông báo vào hôm thứ Ba rằng <span class=\"clue-highlight-1\">Bác sĩ Y khoa Jennifer Robbins đã chấp nhận vị trí viện trưởng, có hiệu lực ngay lập tức.</span></p>\n        <p>Bác sĩ Robbins, người lớn lên tại York, đã nhận bằng y khoa tại Trường Y Labato và <span class=\"clue-highlight-2\">hoàn thành chương trình bác sĩ nội trú sau tiến sĩ tại Trung tâm Y tế Petersen.</span> Trước khi đến làm việc tại viện, Bác sĩ Robbins là người sáng lập và giám đốc phòng khám nhãn khoa tại Bệnh viện Morseville. Những sáng kiến của bà trong điều trị các bệnh về mắt đã mang lại lợi ích cho hàng ngàn bệnh nhân trên toàn thế giới.</p>\n        <p>Vào ngày 17 tháng 4, Bác sĩ Robbins sẽ có mặt tại Berlin để nhận Huy chương Kramer về Thành tựu Y khoa Xuất sắc tại hội nghị năm nay của Trung tâm Phát triển Thị giác Quốc tế.</p>\n        <hr>\n        <p><b>Hội nghị Trung tâm Phát triển Thị giác Quốc tế (ICVA)</b><br>Hội trường Hội nghị JT Pepper (17–19 tháng 4)<br>Rosenthaler Strasse 65, Berlin, Đức 25627</p>\n        <p><b>Lịch trình Ngày 1: Thứ Hai, ngày 17 tháng 4</b></p>\n        <p>• 8:00–10:00 A.M.: Bữa sáng — Maiwald Lounge<br>\n        • 10:00–11:00 A.M.: Lời chào mừng và <span class=\"clue-highlight-5\">bài phát biểu chính</span> — Jahn Conference Hall<br>\n        • 11:15 A.M.–1:15 P.M.: Phiên 1: Công nghệ mới — Các phòng thảo luận nhỏ<br>\n        • 1:30–3:30 P.M.: Hội thảo nhóm bữa trưa — Edwards Room<br>\n        • 3:45–5:45 P.M.: Phiên 2: Chăm sóc mắt chất lượng — Các phòng thảo luận nhỏ<br>\n        • 6:00–7:30 P.M.: Thời gian tự do<br>\n        • 7:30–9:00 P.M.: Bữa tối — Regal Ballroom<br>\n        • 9:00–9:30 P.M.: Tráng miệng và <span class=\"clue-highlight-3\">lễ trao giải</span> — <span class=\"clue-highlight-3\">Regal Ballroom</span></p>\n        <hr>\n        <p><b>*Thư điện tử*</b><br>\n        <b>Người nhận:</b> Dae-Ho Sohn<br>\n        <b>Người gửi:</b> Paulina Raskin<br>\n        <b>Chủ đề:</b> Bài thuyết trình của ông<br>\n        <b>Ngày:</b> 22 tháng 4</p>\n        <p>Kính gửi Bác sĩ Sohn,</p>\n        <p><span class=\"clue-highlight-4\">Tôi muốn cảm ơn ông một lần nữa vì đã phát biểu tại hội nghị ICVA ở Berlin tuần trước.</span> Tôi chắc chắn rằng mình không phải là người duy nhất cho rằng điểm nhấn của hội nghị chính là <span class=\"clue-highlight-5\">bài phát biểu chính của ông</span>. Những góc nhìn của ông về những tiến bộ gần đây trong kỹ thuật phẫu thuật mắt đã thu hút sự chú ý của mọi người trong phòng. <span class=\"clue-highlight-4\">Chúng tôi rất biết ơn vì ông đã có thể tham gia cùng chúng tôi</span> và càng trân trọng hơn tất cả sự giúp đỡ cũng như hướng dẫn mà ông đã cung cấp trong thời gian qua với tư cách là một thành viên tích cực của Hội đồng Quản trị ICVA.</p>\n        <p>Trân trọng,<br>Paulina Raskin<br>Chủ tịch, Trung tâm Phát triển Thị giác Quốc tế</p>\n    </div>\n</div>",

    "passage": "<div class=\"article-container\">\n    <!-- Passage 1: Email 1 -->\n    <div class=\"email-box\" style=\"border: 1px solid #ccc; padding: 15px; margin-bottom: 20px;\">\n        <p style=\"margin: 4px 0;\"><b>To:</b> y.kuroda@coralmail.com</p>\n        <p style=\"margin: 4px 0;\"><b>From:</b> simoncady@techsolve.com</p>\n        <p style=\"margin: 4px 0;\"><b>Date:</b> May 12, 1:30 P.M.</p>\n        <p style=\"margin: 4px 0;\"><b>Subject:</b> Paperwork</p>\n        <p style=\"margin: 4px 0;\"><b>Attachment:</b> Checklist</p>\n        <hr style=\"border: none; border-top: 1px solid #ddd; margin: 10px 0;\">\n        <p>Dear Ms. Kuroda,</p>\n        <p><span class=\"clue-highlight-196\">We still need a few things for your personnel file.</span> At the training for new hires this morning, we provided you with a checklist of the documents that we need to have on file. For your reference, I've attached a scanned copy of your checklist to this e-mail.</p>\n        <p>First, our security office requires proof of your identity. Employees usually submit a copy of their driver's license (front and back) or the personal information page from their passport, but any official government identification is acceptable. We also require your banking information to set up the electronic transfer of your salary to your account.</p>\n        <p><span class=\"clue-highlight-198\">The final item on the list will only be needed if you join the company softball team.</span> Do you play? Our company team participates in a league, and it's a great way to build rapport with the people you will be working alongside. The season is just beginning. I can send you details if you're interested.</p>\n        <p>Finally, I want to encourage you to attend the company picnic, which is always held on the third Friday in May at Briarwood Park. It's an opportunity to interact with your coworkers in an informal, nonworking environment. It's always well attended.</p>\n        <p>If you have any questions, contact me and we can schedule a chat.</p>\n        <p>Simon Cady, Human Resources Division<br>Techsolve, Inc.</p>\n    </div>\n\n    <!-- Passage 2: Checklist -->\n    <div class=\"checklist-box\" style=\"border: 1px solid #888; padding: 15px; margin-bottom: 20px; max-width: 450px;\">\n        <h3 style=\"margin-top: 0; text-align: center;\">New Employee Forms Checklist</h3>\n        <p style=\"margin: 4px 0;\"><b>Name:</b> Yumiko Kuroda</p>\n        <p style=\"margin: 4px 0;\"><b>Department:</b> Data entry</p>\n        <p style=\"margin: 4px 0;\"><b>Start Date:</b> May 15</p>\n        <ul style=\"list-style: none; padding-left: 0; margin-top: 15px;\">\n            <li style=\"margin-bottom: 8px;\">____ 1. Proof of identity (copy of driver's license, passport, or other official ID)</li>\n            <li style=\"margin-bottom: 8px;\">✓ 2. Personal data form</li>\n            <li style=\"margin-bottom: 8px;\">✓ 3. Tax withholding form</li>\n            <li style=\"margin-bottom: 8px;\">____ 4. Bank account information form</li>\n            <li style=\"margin-bottom: 8px;\">✓ 5. Insurance selection form</li>\n            <li style=\"margin-bottom: 8px;\">____ <span class=\"clue-highlight-198\">6. Release of liability form (if required)</span></li>\n        </ul>\n    </div>\n\n    <!-- Passage 3: Email 2 -->\n    <div class=\"email-box\" style=\"border: 1px solid #ccc; padding: 15px;\">\n        <div style=\"text-align: center; border-bottom: 1px solid #000; padding-bottom: 5px; margin-bottom: 10px; font-weight: bold;\">E-Mail Message</div>\n        <p style=\"margin: 4px 0;\"><b>To:</b> simoncady@techsolve.com</p>\n        <p style=\"margin: 4px 0;\"><b>From:</b> y.kuroda@coralmail.com</p>\n        <p style=\"margin: 4px 0;\"><b>Date:</b> May 12, 3:21 P.M.</p>\n        <p style=\"margin: 4px 0;\"><b>Subject:</b> Re: Paperwork</p>\n        <hr style=\"border: none; border-top: 1px solid #ddd; margin: 10px 0;\">\n        <p>Hello Mr. Cady,</p>\n        <p>Thank you for your e-mail. I am excited about starting work. And thanks, too, for sending a copy of <span class=\"clue-highlight-197\">the checklist I received in the orientation session</span>. I don't drive, so I don't have a driver's license, but I can provide a copy of the page from my passport. <span class=\"clue-highlight-200\">I am about to gather the necessary information for the fourth item on the list.</span> I will bring everything to the office on Monday.</p>\n        <p>I'll have to think about whether I want to join the company softball team. How much of a time commitment is it? I played softball in college. I wasn't very good, but I did enjoy playing.</p>\n        <p>The company picnic sounds like fun. I love Briarwood Park and <span class=\"clue-highlight-199\">look forward to the opportunity to get to know my coworkers better</span>. If employees bring dishes for the picnic, I'd be happy to make something. Or is the food being provided by a caterer?</p>\n        <p>Thanks again for your support.</p>\n        <p>Yumiko Kuroda</p>\n    </div>\n</div>",

    "translation": "<div class=\"translation-header\">Bản dịch & Phân tích</div>\n<div class=\"article-container\">\n    <div class=\"article-body\">\n        <!-- Translation Passage 1 -->\n        <div style=\"border-bottom: 1px dashed #ccc; padding-bottom: 10px; margin-bottom: 15px;\">\n            <p><b>Đến:</b> y.kuroda@coralmail.com</p>\n            <p><b>Từ:</b> simoncady@techsolve.com</p>\n            <p><b>Ngày:</b> 12 tháng 5, 1:30 chiều</p>\n            <p><b>Chủ đề:</b> Giấy tờ / Hồ sơ</p>\n            <p><b>Tệp đính kèm:</b> Danh mục kiểm tra (Checklist)</p>\n            <p>Kính gửi cô Kuroda,</p>\n            <p>Chúng tôi vẫn cần một vài thứ cho hồ sơ nhân sự của cô. Tại buổi đào tạo cho nhân viên mới vào sáng nay, chúng tôi đã cung cấp cho cô một danh mục kiểm tra các giấy tờ cần lưu hồ sơ. Để cô tiện tham khảo, tôi có đính kèm một bản quét của danh mục đó trong email này.</p>\n            <p>Đầu tiên, bộ phận an ninh của chúng tôi yêu cầu giấy tờ xác minh danh tính. Nhân viên thường nộp bản sao bằng lái xe (mặt trước và mặt sau) hoặc trang thông tin cá nhân từ hộ chiếu, nhưng bất kỳ giấy tờ tùy thân chính thức nào do chính phủ cấp đều được chấp nhận. Chúng tôi cũng cần thông tin ngân hàng của cô để cài đặt việc chuyển khoản tiền lương tự động vào tài khoản của cô.</p>\n            <p>Mục cuối cùng trong danh sách sẽ chỉ cần thiết nếu cô tham gia đội bóng mềm (softball) của công ty. Cô có chơi không? Đội của công ty chúng ta có tham gia một giải đấu, và đây là một cách tuyệt vời để xây dựng mối quan hệ tốt đẹp với những người làm việc cùng cô. Mùa giải vừa mới bắt đầu. Tôi có thể gửi chi tiết cho cô nếu cô quan tâm.</p>\n            <p>Cuối cùng, tôi muốn khuyến khích cô tham dự buổi dã ngoại của công ty, hoạt động này luôn được tổ chức vào thứ Sáu thứ ba của tháng 5 tại Công viên Briarwood. Đây là cơ hội để tương tác với các đồng nghiệp trong một môi trường thân mật, không liên quan đến công việc. Hoạt động này luôn thu hút rất đông người tham gia.</p>\n            <p>Nếu cô có bất kỳ câu hỏi nào, hãy liên hệ với tôi và chúng ta có thể xếp lịch trao đổi.</p>\n            <p>Simon Cady, Bộ phận Nhân sự<br>Techsolve, Inc.</p>\n        </div>\n\n        <!-- Translation Passage 2 -->\n        <div style=\"border-bottom: 1px dashed #ccc; padding-bottom: 10px; margin-bottom: 15px;\">\n            <p><b>Danh mục kiểm tra biểu mẫu nhân viên mới</b></p>\n            <p><b>Họ tên:</b> Yumiko Kuroda</p>\n            <p><b>Bộ phận:</b> Nhập liệu (Data entry)</p>\n            <p><b>Ngày bắt đầu làm việc:</b> 15 tháng 5</p>\n            <p>____ 1. Giấy tờ xác minh danh tính (bản sao bằng lái xe, hộ chiếu hoặc ID chính thức khác)</p>\n            <p>✓ 2. Biểu mẫu dữ liệu cá nhân</p>\n            <p>✓ 3. Biểu mẫu khấu trừ thuế</p>\n            <p>____ 4. Biểu mẫu thông tin tài khoản ngân hàng</p>\n            <p>✓ 5. Biểu mẫu lựa chọn bảo hiểm</p>\n            <p>____ 6. Biểu mẫu miễn trừ trách nhiệm pháp lý (nếu có yêu cầu)</p>\n        </div>\n\n        <!-- Translation Passage 3 -->\n        <div>\n            <p><b>Thông điệp Email</b></p>\n            <p><b>Đến:</b> simoncady@techsolve.com</p>\n            <p><b>Từ:</b> y.kuroda@coralmail.com</p>\n            <p><b>Ngày:</b> 12 tháng 5, 3:21 chiều</p>\n            <p><b>Chủ đề:</b> Re: Giấy tờ / Hồ sơ</p>\n            <p>Xin chào ông Cady,</p>\n            <p>Cảm ơn ông đã gửi email. Tôi rất hào hứng với việc bắt đầu công việc. Và cũng cảm ơn ông vì đã gửi bản sao của danh mục kiểm tra mà tôi đã nhận được trong buổi định hướng. Tôi không lái xe nên không có bằng lái, nhưng tôi có thể cung cấp bản sao trang hộ chiếu của mình. Tôi chuẩn bị thu thập các thông tin cần thiết cho mục thứ tư trong danh sách. Tôi sẽ mang mọi thứ đến văn phòng vào thứ Hai.</p>\n            <p>Tôi sẽ phải suy nghĩ xem có nên tham gia đội bóng mềm của công ty hay không. Nó đòi hỏi cam kết bao nhiêu thời gian? Tôi từng chơi bóng mềm ở trường đại học. Tôi chơi không giỏi lắm nhưng tôi thực sự thích chơi.</p>\n            <p>Buổi dã ngoại của công ty nghe có vẻ thú vị. Tôi rất thích Công viên Briarwood và mong chờ cơ hội được làm quen tốt hơn với các đồng nghiệp của mình. Nếu các nhân viên mang đồ ăn đến buổi dã ngoại, tôi rất sẵn lòng làm món gì đó. Hay đồ ăn sẽ do bên dịch vụ tiệc cung cấp?</p>\n            <p>Cảm ơn ông một lần nữa vì sự hỗ trợ.</p>\n            <p>Yumiko Kuroda</p>\n        </div>\n    </div>\n</div>",

        { bg: '#ffd6a5', text: '#663d14' }, // Cam pastel

function formatAnswer(options, answer) {
    if(!options) return answer;
    if(Array.isArray(options)) {
        // Bỏ qua mảng object của Part 7 vì đáp án đã là A,B,C,D sẵn
        if (typeof options[0] === 'object') return answer; 
        let labels = ["A", "B", "C", "D"];
        let idx = options.indexOf(answer);
        return idx !== -1 ? labels[idx] : answer;
    }
    return answer; 
}

function createTOEICQuestion(qObj) {
    if(!qObj || !qObj.id) return "";
    
    // 1. Lấy nội dung câu hỏi
    let text = qObj.q || qObj.text || qObj.qEng || "";
    
    // XỬ LÝ LẶP SỐ: Nếu nội dung câu hỏi bắt đầu bằng "151. ", "152. "... thì xóa nó đi
    // vì đã có số thứ tự hiển thị trong vòng tròn màu hồng bên trái rồi.
    if (typeof text === 'string') {
        text = text.replace(/^\d+\.\s*/, ""); // Xóa số và dấu chấm ở đầu (vd: "131. " -> "")
        text = text.replace(/(\([^)]+\))/g, '<span class="vi-trans">$1</span>');
    }
    
    let opts = qObj.options;
    let optsHTML = "";
    let inputStyle = `margin-right:12px; transform:scale(1.3); cursor:pointer;`;
    let labelStyle = `display:block; margin:10px 0; padding:12px 18px; border-radius:var(--radius); cursor:pointer; border:2px solid #f1f5f9; background:#f8fafc; transition:all 0.2s ease; font-size:17px;`;

    if (Array.isArray(opts)) {
        let labels = ["A", "B", "C", "D"];
        opts.forEach((opt, i) => {
            // Sửa lỗi undefined cho các Option Part 6, 7 (dùng .text thay vì .en)
            let optText = typeof opt === 'object' ? (opt.text || opt.en || "") : opt;
            
            // XỬ LÝ LẶP NHÃN A. A.: Xóa "A. ", "B. " có sẵn trong dữ liệu
            if (typeof optText === 'string') {
                optText = optText.replace(/^[A-D]\.\s*/, ""); 
                optText = optText.replace(/(\([^)]+\))/g, '<span class="vi-trans">$1</span>');
            }

            let optValue = typeof opt === 'object' ? (opt.key || labels[i]) : labels[i];
            
            optsHTML += `
                <label class="mc-option" style="${labelStyle}" onmouseover="this.style.background='var(--exp-bg)'" onmouseout="this.style.background='transparent'">
                    <input type="radio" name="q${qObj.id}" value="${optValue}" style="${inputStyle}" onclick="checkNav(${qObj.id})"> 
                    <b>${labels[i]}.</b> ${optText}
                </label>`;
        });
    } else {
        // Trường hợp options là Object (thường cho Part 5)
        for (let key in opts) {
            let optText = opts[key];
            if (typeof optText === 'string') {
                optText = optText.replace(/^[A-D]\.\s*/, ""); 
                optText = optText.replace(/(\([^)]+\))/g, '<span class="vi-trans">$1</span>');
            }
            optsHTML += `
                <label class="mc-option" style="${labelStyle}" onmouseover="this.style.background='var(--exp-bg)'" onmouseout="this.style.background='transparent'">
                    <input type="radio" name="q${qObj.id}" value="${key}" style="${inputStyle}" onclick="checkNav(${qObj.id})"> 
                    <b>${key}.</b> ${optText}
                </label>`;
        }
    }

    return `<div class="q-row" id="q-row-${qObj.id}" style="margin-bottom:30px; display:flex; background:white; padding:25px; border-radius:var(--radius); box-shadow:var(--shadow); border:1px solid var(--border);">
<div class="q-num" style="min-width:42px; height:42px; background:linear-gradient(135deg, var(--primary), var(--primary-dark)); color:white; border-radius:10px; display:flex; align-items:center; justify-content:center; font-weight:800; margin-right:20px; flex-shrink:0; box-shadow: 0 4px 10px rgba(30,58,138,0.2);">${qObj.id}</div>
                <div class="q-text" style="flex:1; font-size:18px; line-height:1.8;">
                    <div class="q-content-wrapper">
                        <!-- Biến 'text' ở đây đã được cắt bỏ số thứ tự trùng lặp -->
                        <b>${text}</b><br>${optsHTML}
                        <span id="fb-${qObj.id}" class="feedback" style="font-weight:bold; margin-left:10px;"></span>
                    </div>
                    <div id="exp-${qObj.id}" class="exp-container"></div>
                </div>
            </div>`;
}

function createQuestionsBlock(passageObj) {
    let html = `<div class="questions-block" style="margin-bottom: 40px; background: transparent; padding: 0;" onmouseenter="showPassage('${passageObj.passageId}')">`;
    html += `<div style="color:var(--primary-dark); font-weight:bold; margin-bottom:15px; border-bottom: 2px solid var(--border); padding-bottom:10px; font-size: 18px;">📝 Questions for Passage: ${passageObj.passageId}</div>`;
    
    let validQuestions = passageObj.questions.filter(q => q && q.id);
    
    validQuestions.forEach(q => {
        html += createTOEICQuestion(q);
        allQuestionIds.push(q.id);
        
        // --- BẮT ĐẦU PHẦN SỬA LỖI ---
        let correctAns = q.a || q.correct; 
        
        // Nếu là Part 6/7 (options là mảng các object)
        if (!correctAns && Array.isArray(q.options)) {
            // Tìm vị trí của option có thuộc tính "correct" là true
            const foundIdx = q.options.findIndex(o => typeof o === 'object' && o.correct === true);
            if (foundIdx !== -1) {
                const labels = ["A", "B", "C", "D"];
                correctAns = labels[foundIdx]; // Chuyển index 0,1,2,3 thành A,B,C,D
            }
        }
        
        answerKey[q.id] = correctAns; // Lưu nhãn A,B,C,D vào bộ nhớ chấm điểm
        // --- KẾT THÚC PHẦN SỬA LỖI ---

        explanations[q.id] = { exp: q.explanation || "" };
    });
    html += `</div>`;
    return html;
}

    const mainContainer = document.getElementById('mainContainer');
    document.querySelectorAll('.tab-btn').forEach((b, i) => { b.classList.toggle('active', i + 1 === n); });
    document.querySelectorAll('.question-group').forEach((q, i) => { q.style.display = (i + 1 === n) ? 'block' : 'none'; });
    
    // Quản lý chế độ Part 5 hoặc 6-7

    } else {

let currentStep = 0;

function updatePagination() {
    const activeGroup = document.querySelector('.question-group[style*="display: block"]');
    if (!activeGroup) return;
    const partSuffix = activeGroup.id.split('-').pop();
    const isPart5 = activeGroup.id === 'q-group-1';

    if (isSubmitted) {
        activeGroup.querySelectorAll('.questions-block, .q-row').forEach(el => el.style.display = isPart5 ? 'flex' : 'block');
        document.getElementById(`paginationBox${partSuffix}`).style.display = 'none';
        return;
    }

    const steps = isPart5 ? activeGroup.querySelectorAll('.q-row') : activeGroup.querySelectorAll('.questions-block');
    steps.forEach((step, index) => {
        if (index === currentStep) {
            step.style.display = isPart5 ? 'flex' : 'block';
            if (!isPart5) {
                // SỬA TẠI ĐÂY: Thay match[1] bằng match[2]
                const match = step.getAttribute('onmouseenter').match(/'([^']+)'/);
                if (match && match[2]) showPassage(match[2]); 
            }
        } else {
            step.style.display = 'none';
        }
    });

    document.getElementById(`btnPrev${partSuffix}`).disabled = (currentStep === 0);
    document.getElementById(`btnNext${partSuffix}`).disabled = (currentStep === steps.length - 1);
}
// --- 2. Sửa lỗi đóng ngoặc và phạm vi biến ID ---
function scrollToQuestion(id) {
    document.getElementById('navPanel').classList.remove('show');
    let group = 1;
    if (toeicData.part6.some(p => p.questions.some(q => q.id == id))) group = 2;
    if (toeicData.part7.some(p => p.questions.some(q => q.id == id))) group = 3;
    
    switchTab(group); 

    const activeGroup = document.getElementById(`q-group-${group}`);
    const steps = group === 1 ? activeGroup.querySelectorAll('.q-row') : activeGroup.querySelectorAll('.questions-block');
    
    steps.forEach((step, index) => {
        if (step.id === `q-row-${id}` || step.querySelector(`#q-row-${id}`)) {
            currentStep = index; 
        }
    });

    updatePagination(); 

    // Đảm bảo khối setTimeout này nằm TRONG hàm scrollToQuestion
    setTimeout(() => {
        let el = document.getElementById(`q-row-${id}`);
        if (el) {
            el.scrollIntoView({behavior: "smooth", block: "center"});
            el.style.transition = "background 0.5s";
            el.style.background = "#fff9c4";
            setTimeout(() => el.style.background = "transparent", 1000);

            let parentBlock = el.closest('.questions-block');
            if(parentBlock) {
                let mouseEvent = new MouseEvent('mouseenter');
                parentBlock.dispatchEvent(mouseEvent);
            }
        }
    }, 150);
}

function saveAttemptToHistory(score, total, userAnswersMap) {
    let history = JSON.parse(localStorage.getItem(HISTORY_KEY)) || [];
    let now = new Date();
    
    let attempt = {
        id: Date.now(),
        date: now.toLocaleDateString('vi-VN'),
        time: now.toLocaleTimeString('vi-VN', { hour: '2-digit', minute: '2-digit' }),
        score: score,
        total: total,
        toeicScore: calculateToeicReading(score, total),
        answers: userAnswersMap // Lưu lại toàn bộ ABCD đã chọn
    };
    
    history.unshift(attempt); // Đẩy bài mới nhất lên đầu
    localStorage.setItem(HISTORY_KEY, JSON.stringify(history));

    // ĐỒNG BỘ LÊN CLOUD NGAY SAU KHI LƯU
    if (window.syncHistoryToCloud) {
        window.syncHistoryToCloud(history);
    }
}

function deleteAttempt(attemptId) {
    showCustomConfirm("Bạn có chắc chắn muốn xóa bài làm này khỏi lịch sử không?", function() {
        let history = JSON.parse(localStorage.getItem(HISTORY_KEY)) || [];
        history = history.filter(h => h.id !== attemptId); 
        localStorage.setItem(HISTORY_KEY, JSON.stringify(history)); 
        
        // ĐỒNG BỘ THAO TÁC XÓA LÊN CLOUD
        if (window.syncHistoryToCloud) {
            window.syncHistoryToCloud(history);
        }
        
        openHistoryModal(); 
    });
}
function restoreAttempt(attemptId) {
    let history = JSON.parse(localStorage.getItem(HISTORY_KEY)) || [];
    let attempt = history.find(h => h.id === attemptId);
    
    if(!attempt) return;

    isReviewingMode = true; // Bật cờ hiệu "Đang xem lại"
    document.getElementById('historyOverlay').style.display = 'none';
    document.getElementById('setupOverlay').style.display = 'none';
    
    document.querySelectorAll('input[type="radio"]').forEach(el => {
        el.disabled = false;
        el.checked = false; 
    });
    
    // Tự động đánh dấu lại các Radio button đáp án học viên đã chọn trong lịch sử
    for (let qId in attempt.answers) {
        let val = attempt.answers[qId];
        if (val) {
            let radio = document.querySelector(`input[name="q${qId}"][value="${val}"]`);
            if (radio) radio.checked = true;
        }
    }
    
   // Đổi chữ nút Nộp bài thành "Đang xem lại" cho ngầu
    let btnSubmit = document.querySelector('.btn-submit');
    if(btnSubmit) {
        btnSubmit.innerText = "ĐANG XEM LẠI";
        btnSubmit.style.background = "#888";
        btnSubmit.style.boxShadow = "none";
    }

    // --- THÊM 2 DÒNG NÀY VÀO TRƯỚC DẤU NGOẶC NHỌN ĐÓNG HÀM ---
    isSubmitted = false; 
    executeSubmit();
}


function scrollToEvidence(evId) {
    const evElement = document.getElementById(evId);
    if(evElement) {
        // Cuộn đoạn văn chứa dẫn chứng vào giữa màn hình
        evElement.scrollIntoView({behavior: "smooth", block: "center"});
        
        // Thêm class 'focus-blink' để bật chế độ nháy vàng in đậm
        evElement.classList.add("focus-blink");
        
        // Tắt nổi bật sau 1.5 giây để trả văn bản về bình thường
        setTimeout(() => {
            evElement.classList.remove("focus-blink");
        }, 1500);
    } else {
        showCustomAlert("Chưa được gắn ID dẫn chứng trong bài đọc!");
    }
}
// --- GRADING ---
function submitTest(manual) {
    if (isSubmitted) return;
    if (manual) document.getElementById('confirmOverlay').style.display = 'flex';
    else executeSubmit();
}

function closeConfirmModal() { document.getElementById('confirmOverlay').style.display = 'none'; }
function closeResultModal() { document.getElementById('resultOverlay').style.display = 'none'; }

function executeSubmit() {
    document.getElementById('confirmOverlay').style.display = 'none';
    isSubmitted = true;
updatePagination();
    clearInterval(timerInterval);
    document.querySelectorAll('input, select').forEach(el => el.disabled = true);
    
    document.getElementById('mainContainer').classList.add('show-translation');
    
    let activeTabIndex = 1;
    document.querySelectorAll('.tab-btn').forEach((b, i) => {
        if (b.classList.contains('active')) activeTabIndex = i + 1;
    });
    switchTab(activeTabIndex);
    
    let score = 0;
    let totalQuestions = allQuestionIds.length;
    let userAnswersMap = {}; // Thêm cái này để hứng đáp án học viên

    allQuestionIds.forEach(id => {
        let userAns = "";
        let radios = document.getElementsByName(`q${id}`);
        for (let r of radios) if (r.checked) userAns = r.value;
        
        userAnswersMap[id] = userAns; // Ghi nhận đáp án câu này

        let correctAns = answerKey[id];
        let isCorrect = (userAns === correctAns);
        if (isCorrect && userAns !== "") score++; // Có chọn mới tính điểm

        let feedbackEl = document.getElementById(`fb-${id}`);
        if(feedbackEl) {
            if(isCorrect && userAns !== "") {
                feedbackEl.innerHTML = `<span style="color:var(--correct);">✓ Đúng</span>`;
            } else if (userAns === "") {
                feedbackEl.innerHTML = `<span style="color:#888;">Trống (Đáp án: <span style="background:#dce775; color:#333; padding:2px 5px; border-radius:4px;">${correctAns}</span>)</span>`;
            } else {
                feedbackEl.innerHTML = `<span style="color:var(--wrong);">✗ Sai (Đáp án: <span style="background:#dce775; color:#333; padding:2px 5px; border-radius:4px;">${correctAns}</span>)</span>`;
            }
        }
        
        let nav = document.getElementById(`nav-${id}`);
        if(nav) {
            if (isCorrect && userAns !== "") {
                nav.style.background = "#c8e6c9"; nav.style.color = "#2e7d32"; nav.style.borderColor = "#81c784";
            } else {
                nav.style.background = "#ffcdd2"; nav.style.color = "#c62828"; nav.style.borderColor = "#ef9a9a";
            }
        }

        let expContainer = document.getElementById(`exp-${id}`);
        if(expContainer && explanations[id]) {
            let expData = explanations[id];
let contentHtml = "";

if (expData.exp) contentHtml += `<div class="exp-text">${expData.exp}</div>`;
if (expData.vocab) contentHtml += `<div class="exp-vocab">${expData.vocab}</div>`;
if (expData.tip) contentHtml += `<div style="margin-top:8px; color:var(--primary-dark); font-weight:600;">📌 Ghi chú: ${expData.tip}</div>`;

expContainer.innerHTML = `
    <div class="exp-box show">
        <div class="exp-title">💡 Giải thích chi tiết Câu ${id}</div>
        ${contentHtml}
    </div>
`;
        }
    });

   
    if (!isReviewingMode) {
        saveAttemptToHistory(score, totalQuestions, userAnswersMap);
        document.getElementById('resultMessage').innerHTML = `Bạn đã làm đúng <b style="color: var(--primary); font-size: 22px;">${score}/${totalQuestions}</b> câu.<br>Điểm TOEIC Reading quy đổi: <b>${calculateToeicReading(score, totalQuestions)}</b>`;
        document.getElementById('resultOverlay').style.display = 'flex';
        if(window.luuDiemTOEICReadingFull) {
            // Tính toán thời gian thực tế đã làm (số phút ban đầu trừ đi số phút còn lại)
            let minutesAssigned = (currentMode === 'mock') ? 75 : parseInt(document.getElementById('timeInput').value);
            if(isNaN(minutesAssigned) || minutesAssigned < 1) minutesAssigned = 75;
            let timeTaken = Math.round(minutesAssigned - (testDuration / 60));
            
            // Truyền thêm timeTaken vào hàm
            window.luuDiemTOEICReadingFull(score, totalQuestions, "ETS 2026 - Test 10", timeTaken);
        }
    } else {
        // Đưa khối else này ra đúng vị trí của nó
        let toastMsg = document.createElement("div");
        toastMsg.innerText = "Đã khôi phục bài làm ngày cũ!";
        toastMsg.style.cssText = "position:fixed; top:20px; right:20px; background:var(--primary); color:white; padding:15px 20px; border-radius:12px; font-weight:bold; font-family:'Quicksand',sans-serif; z-index:99999; box-shadow:0 10px 30px rgba(0,0,0,0.2);";
        document.body.appendChild(toastMsg);
        setTimeout(() => toastMsg.remove(), 3000);
    }
}
        

function calculateToeicReading(raw, total) {
    if (raw === 0) return 5;
    let percent = raw / total;
    let score = Math.round((percent * 495) / 5) * 5; 
    return score > 495 ? 495 : (score < 5 ? 5 : score);
}

// --- HIGHLIGHT SYSTEM ---
const mainContainer = document.getElementById("mainContainer");
const menu = document.getElementById("ctxMenu");
let targetElement = null;
let selectedRange = null;

// Chuyển menu sang fixed để bám đúng con trỏ chuột dù đang cuộn ở cột nào
menu.style.position = "fixed";

mainContainer.addEventListener("contextmenu", (e) => {
    e.preventDefault();
    targetElement = null; selectedRange = null;
    
    // Nếu click chuột phải vào vùng đã highlight -> Hiện nút Xóa
    if (e.target.classList.contains("highlight")) {
        targetElement = e.target;
        showMenu(e.clientX, e.clientY, "remove");
        return;
    }
    
    // Nếu bôi đen văn bản mới -> Hiện nút Thêm
    let sel = window.getSelection();
    if (sel.toString().trim().length > 0 && mainContainer.contains(sel.anchorNode)) {
        selectedRange = sel.getRangeAt(0);
        showMenu(e.clientX, e.clientY, "add");
    } else {
        menu.style.display = "none";
    }
});

// Bấm chuột trái ra ngoài thì ẩn menu
document.addEventListener("click", (e) => { 
    if (menu && !menu.contains(e.target)) menu.style.display = "none"; 
});

function showMenu(x, y, mode) {
    menu.style.display = "block";
    let mw = menu.offsetWidth;
    let mh = menu.offsetHeight;
    
    // Chống tràn màn hình
    let left = x + mw > window.innerWidth ? window.innerWidth - mw - 10 : x;
    let top = y + mh > window.innerHeight ? window.innerHeight - mh - 10 : y;
    
    menu.style.left = left + "px";
    menu.style.top = top + "px";
    
    menu.children[0].style.display = (mode === "add") ? "block" : "none";
    menu.children[1].style.display = (mode === "remove") ? "block" : "none";
}

function doHighlight() {
    if (selectedRange) {
        try { 
            let span = document.createElement("span");
            span.className = "highlight";
            selectedRange.surroundContents(span); 
        } catch(e) {
            showCustomAlert("Lưu ý: Chỉ có thể bôi vàng các cụm từ nằm trong cùng một đoạn văn. Vui lòng không bôi đen vắt ngang qua các khoảng ngắt dòng nhé!");
        }
        window.getSelection().removeAllRanges();
    }
    menu.style.display = "none";
}

function removeHighlight() {
    if (targetElement) {
        let text = document.createTextNode(targetElement.textContent);
        targetElement.parentNode.replaceChild(text, targetElement);
        mainContainer.normalize(); // Nối lại văn bản liền mạch
    }
    menu.style.display = "none";
}

    // 1. HÀM ĐẨY LỊCH SỬ LÊN CLOUD
    window.syncHistoryToCloud = async function(historyData) {
        if (!window.currentUserUid) return;
        try {
            // Đặt tên document phân biệt theo Test và User
            let docId = window.currentUserUid + "_history_test10_2026";
            await setDoc(doc(db, "user_test_histories", docId), {
                savedHistory: historyData,
                lastUpdated: Date.now()
            }, { merge: true }); // Merge true để không đè mất các field khác nếu có
            
        } catch (error) {
            console.error("Lỗi đồng bộ lịch sử: ", error);
        }
    }

    // 2. LẮNG NGHE ĐĂNG NHẬP VÀ KÉO LỊCH SỬ VỀ
    onAuthStateChanged(auth, (user) => {
        if (user) {
            window.currentUserUid = user.uid;
            window.currentUserEmail = user.email;
            
            // Tự động nhận diện ID file hiện tại (2018 hay 2019)
            let is2026 = document.title.includes("2026");
            let docSuffix = is2026 ? "_history_test10_2026" : "_history_test10_2026";
            let localKey = is2026 ? "snapenglish_test10_2026_history" : "snapenglish_test10_2026_history";
            
            let docId = user.uid + docSuffix;
            const docRef = doc(db, "user_test_histories", docId);
            
            // SỬ DỤNG ONSNAPSHOT ĐỂ ĐỒNG BỘ REAL-TIME
            onSnapshot(docRef, (docSnap) => {
                if (docSnap.exists()) {
                    let cloudData = docSnap.data().savedHistory;
                    if (cloudData) {
                        // Nạp vào máy tính/điện thoại hiện tại
                        localStorage.setItem(localKey, JSON.stringify(cloudData));
                        
                        // Tự động làm mới bảng lịch sử nếu người dùng đang mở nó
                        let historyModal = document.getElementById('historyOverlay');

                        }

                }

            showInGameToast("⚠️ Chưa đăng nhập! Lịch sử và Điểm sẽ không được đồng bộ.");

    });

    window.luuDiemTOEICReadingFull = async function(correct, total, testTitle, timeTaken) {

        let hours = now.getHours().toString().padStart(2, '0');
        let minutes = now.getMinutes().toString().padStart(2, '0');

            await setDoc(doc(db, "user_toeic_scores", docId), {
                email: window.currentUserEmail,

                score: scoreConverted,

                time: timeString, 
                Time: timeString, 
                timeTaken: timeTaken,
                timestamp: timestamp
            });
            showInGameToast("☁️ Đã nộp điểm lên bảng vàng SnapEnglish!");
        } catch (e) {
            console.error(e);
        }
    }
