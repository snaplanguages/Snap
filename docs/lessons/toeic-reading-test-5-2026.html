    options: ["tide", "boat", "harbor", "island"],
    a: "harbor",
    exp: {
      correct: "<div style='line-height: 1.6;'><p><strong>a. Phân tích thành phần câu:</strong> Câu có mệnh đề chính và mệnh đề phân từ chỉ kết quả.</p><ul><li><strong>Chủ ngữ (S):</strong> <code>A three-year project</code></li><li><strong>Động từ (V):</strong> <code>deepened</code></li><li><strong>Tân ngữ (O):</strong> <code>the ______</code></li><li><strong>Mệnh đề phân từ (V-ing):</strong> <code>allowing it to accommodate the largest cargo ships</code></li></ul><p><strong>b. Xác định loại từ cần điền:</strong> Chỗ trống đứng sau mạo từ <i>the</i> và đóng vai trò làm tân ngữ cho động từ <i>deepened</i>, cần một <span style='color: #2e7d32; font-weight: bold;'>Danh từ (Noun)</span>. Cả 4 đáp án đều là danh từ nên cần chọn từ phù hợp theo ngữ cảnh.</p><p><strong>c. Lý do chọn đáp án:</strong> Danh từ <span style='color: #2e7d32; font-weight: bold;'>harbor</span> (cảng biển) kết hợp với <i>deepen</i> tạo thành collocation <i>deepen a harbor</i> (nạo vét/làm sâu cảng), hoàn toàn hợp lý với việc cho phép tiếp nhận các tàu chở hàng lớn nhất.</p></div>",
      wrong: "<ul style='line-height: 1.6; list-style-type: none; padding-left: 0;'><li><strong style='color: #c62828;'>❌ (A) tide:</strong> Danh từ (thủy triều), không thể làm sâu thủy triều để tàu cập bến.</li><li><strong style='color: #c62828;'>❌ (B) boat:</strong> Danh từ (con thuyền), không ai 'làm sâu con thuyền' để chứa tàu khác.</li><li><strong style='color: #c62828;'>❌ (D) island:</strong> Danh từ (hòn đảo), không thể làm sâu hòn đảo để tiếp nhận tàu chở hàng.</li></ul>",
      grammar: "<div style='line-height: 1.6;'><p><strong>⭐ Vocabulary in Context & Collocation Ngành Vận tải biển</strong></p><p>Khi 4 phương án đều cùng một từ loại, ta cần suy luận logic dựa trên các hành động và đối tượng liên quan trong câu (ở đây là <i>deepen</i> và <i>cargo ships</i>).</p><table border='1' style='width: 100%; border-collapse: collapse; border-color: #e0e0e0; margin-top: 10px; font-size: 14px;'><thead style='background-color: #f5f5f5; text-align: left;'><tr><th style='padding: 8px;'>Cụm từ quan trọng</th><th style='padding: 8px;'>Ý nghĩa</th></tr></thead><tbody><tr><td style='padding: 8px;'><strong>deepen a harbor</strong></td><td style='padding: 8px;'>Nạo vét / làm sâu cảng biển</td></tr><tr><td style='padding: 8px;'><strong>accommodate ships</strong></td><td style='padding: 8px;'>Tiếp nhận / chứa tàu thuyền</td></tr><tr><td style='padding: 8px;'><strong>cargo ship</strong></td><td style='padding: 8px;'>Tàu chở hàng / tàu vận tải</td></tr></tbody></table><p style='margin-top: 10px;'>💡 <strong>Mẹo làm nhanh:</strong> Nhìn thấy hành động <i>accommodate cargo ships</i> (tiếp nhận tàu chở hàng) -> Chọn ngay địa điểm là <b>harbor</b> (cảng biển).</p></div>",
      vocab: "<ul style='line-height: 1.6;'><li><strong style='color: #0288d1;'>harbor</strong> (n): cảng biển / bến tàu.</li><li><strong style='color: #0288d1;'>cargo ship</strong> (n. phr): tàu chở hàng.</li><li><strong style='color: #0288d1;'>accommodate</strong> (v): tiếp nhận, chứa.</li></ul>",
      trans: "<div style='line-height: 1.6; padding: 8px; background-color: #f9f9f9; border-left: 4px solid #0288d1;'><p style='margin: 0;'><strong>Dịch nghĩa:</strong> Một dự án kéo dài ba năm đã nạo vét và làm sâu cảng, cho phép cảng tiếp nhận những tàu chở hàng lớn nhất.</p></div>"
    }

  {
    id: 118,
    q: "The experiment's initial results were ______ different from what was expected.",
    options: ["wild", "wildest", "wildly", "wildness"],
    a: "wildly",
    exp: {

      grammar: "<div style='line-height: 1.6;'><p><strong>⭐ Cấu trúc Trạng từ bổ nghĩa cho Tính từ (ADV + ADJ)</strong></p><p>Trạng từ chỉ mức độ thường đứng ngay trước Tính từ để gia tăng hoặc điều chỉnh mức độ cho tính từ đó.</p><p><code>S + Be + [ ADV ] + ADJ</code></p><table border='1' style='width: 100%; border-collapse: collapse; border-color: #e0e0e0; margin-top: 10px; font-size: 14px;'><thead style='background-color: #f5f5f5; text-align: left;'><tr><th style='padding: 8px;'>Cụm ADV + ADJ phổ biến</th><th style='padding: 8px;'>Ý nghĩa</th></tr></thead><tbody><tr><td style='padding: 8px;'><strong>wildly different</strong></td><td style='padding: 8px;'>Khác biệt hoàn toàn / khác xa</td></tr><tr><td style='padding: 8px;'><strong>extremely useful / important</strong></td><td style='padding: 8px;'>Cực kỳ hữu ích / quan trọng</td></tr><tr><td style='padding: 8px;'><strong>highly effective / successful</strong></td><td style='padding: 8px;'>Rất hiệu quả / thành công</td></tr><tr><td style='padding: 8px;'><strong>surprisingly good</strong></td><td style='padding: 8px;'>Tốt đến bất ngờ</td></tr></tbody></table><p style='margin-top: 10px;'>💡 <strong>Mẹo làm nhanh:</strong> Nhìn thấy cấu trúc <code>be + ______ + Adj</code> -> Chọn ngay <b>Trạng từ đuôi -ly</b>.</p></div>",

      trans: "<div style='line-height: 1.6; padding: 8px; background-color: #f9f9f9; border-left: 4px solid #0288d1;'><p style='margin: 0;'><strong>Dịch nghĩa:</strong> Kết quả ban đầu của thí nghiệm khác xa so với những gì đã được dự đoán.</p></div>"

    q: "______ critical reviews, the movie was a great success at the box office.",
    options: ["During", "About", "Despite", "Over"],
    a: "Despite",
    exp: {
      correct: "<div style='line-height: 1.6;'><p><strong>a. Phân tích thành phần câu:</strong> Câu gồm cụm giới từ đứng đầu và mệnh đề chính.</p><ul><li><strong>Cụm giới từ:</strong> <code>______ critical reviews</code> (chứa cụm danh từ)</li><li><strong>Mệnh đề chính:</strong> <code>the movie (S) + was (V) + a great success at the box office (C)</code></li></ul><p><strong>b. Xác định loại từ cần điền:</strong> Đứng trước cụm danh từ <i>critical reviews</i> cần một <span style='color: #2e7d32; font-weight: bold;'>Giới từ (Preposition)</span>. Do cả 4 đáp án đều là giới từ, cần xét ngữ nghĩa tương phản giữa hai phần của câu.</p><p><strong>c. Lý do chọn đáp án:</strong> Giới từ <span style='color: #2e7d32; font-weight: bold;'>Despite</span> (mặc dù) thể hiện mối quan hệ nhượng bộ/tương phản: Mặc dù nhận nhiều lời phê bình tiêu cực, bộ phim vẫn thành công lớn ở phòng vé.</p></div>",
      wrong: "<ul style='line-height: 1.6; list-style-type: none; padding-left: 0;'><li><strong style='color: #c62828;'>❌ (A) During:</strong> Mang nghĩa 'trong suốt (khoảng thời gian)', không tạo mối quan hệ logic với việc phê bình phim.</li><li><strong style='color: #c62828;'>❌ (B) About:</strong> Mang nghĩa 'về / khoảng', không phù hợp ngữ nghĩa đứng đầu câu bổ nghĩa cho mệnh đề thành công.</li><li><strong style='color: #c62828;'>❌ (D) Over:</strong> Mang nghĩa 'qua / hơn / trong khoảng', không phù hợp ngữ cảnh.</li></ul>",
      grammar: "<div style='line-height: 1.6;'><p><strong>⭐ Phân biệt Từ chỉ sự Tương phản: 'Despite / In spite of' vs 'Although / Even though'</strong></p><p>Đây là điểm ngữ pháp xuất hiện liên tục trong bài thi TOEIC để kiểm tra khả năng phân biệt từ nối đi với Cụm danh từ hay Mệnh đề.</p><table border='1' style='width: 100%; border-collapse: collapse; border-color: #e0e0e0; margin-top: 10px; font-size: 14px;'><thead style='background-color: #f5f5f5; text-align: left;'><tr><th style='padding: 8px;'>Cấu trúc</th><th style='padding: 8px;'>Thành phần đi kèm</th><th style='padding: 8px;'>Ví dụ</th></tr></thead><tbody><tr><td style='padding: 8px;'><strong>Despite / In spite of</strong></td><td style='padding: 8px;'>Cụm danh từ / V-ing (Noun Phrase)</td><td style='padding: 8px;'><i>Despite</i> critical reviews,...</td></tr><tr><td style='padding: 8px;'><strong>Although / Even though</strong></td><td style='padding: 8px;'>Mệnh đề đầy đủ (S + V)</td><td style='padding: 8px;'><i>Although</i> the reviews were critical,...</td></tr></tbody></table><p style='margin-top: 10px;'>💡 <strong>Mẹo làm nhanh:</strong> Nhìn đằng sau chỗ trống chỉ là một <b>Cụm danh từ</b> (không có động từ chia thì) mang nghĩa tương phản -> Chọn ngay <b>Despite</b> / <b>In spite of</b>.</p></div>",
      vocab: "<ul style='line-height: 1.6;'><li><strong style='color: #0288d1;'>critical review</strong> (n. phr): bài đánh giá tiêu cực / phê bình.</li><li><strong style='color: #0288d1;'>despite</strong> (prep): mặc dù (= in spite of).</li><li><strong style='color: #0288d1;'>box office</strong> (n. phr): phòng vé / doanh thu phim.</li></ul>",
      trans: "<div style='line-height: 1.6; padding: 8px; background-color: #f9f9f9; border-left: 4px solid #0288d1;'><p style='margin: 0;'><strong>Dịch nghĩa:</strong> Mặc dù nhận nhiều bài đánh giá tiêu cực, bộ phim vẫn rất thành công về doanh thu phòng vé.</p></div>"
    }

  {
    id: 120,
    q: "The spray-on sealant ______ as a protective layer that keeps your tiles from getting scratched.",
    options: ["acts", "acting", "action", "actively"],
    a: "acts",
    exp: {
      correct: "<div style='line-height: 1.6;'><p><strong>a. Phân tích thành phần câu:</strong> Câu có mệnh đề chính và mệnh đề quan hệ bổ nghĩa.</p><ul><li><strong>Chủ ngữ (S):</strong> <code>The spray-on sealant</code> (số ít)</li><li><strong>Động từ chính (V):</strong> <code>______</code></li><li><strong>Cụm giới từ bổ ngữ:</strong> <code>as a protective layer</code></li><li><strong>Mệnh đề quan hệ:</strong> <code>that keeps your tiles from getting scratched</code></li></ul><p><strong>b. Xác định loại từ cần điền:</strong> Câu mới chỉ có chủ ngữ số ít <i>The spray-on sealant</i> và chưa có vị ngữ, do đó chỗ trống bắt buộc phải là một <span style='color: #2e7d32; font-weight: bold;'>Động từ chia thì (Verb)</span> phù hợp với chủ ngữ số ít ở thì hiện tại đơn.</p><p><strong>c. Lý do chọn đáp án:</strong> Động từ <span style='color: #2e7d32; font-weight: bold;'>acts</span> chia ngôi thứ 3 số ít kết hợp với giới từ <i>as</i> tạo thành cụm <i>act as</i> (đóng vai trò như / hoạt động như một...).</p></div>",
      wrong: "<ul style='line-height: 1.6; list-style-type: none; padding-left: 0;'><li><strong style='color: #c62828;'>❌ (B) acting:</strong> Hiện tại phân từ, không thể làm động từ chính của câu khi không có trợ động từ 'to be' đứng trước.</li><li><strong style='color: #c62828;'>❌ (C) action:</strong> Danh từ (hành động), không đứng làm vị ngữ cho chủ ngữ.</li><li><strong style='color: #c62828;'>❌ (D) actively:</strong> Trạng từ (một cách tích cực), không thể làm động từ chính của câu.</li></ul>",
      grammar: "<div style='line-height: 1.6;'><p><strong>⭐ Cấu trúc 'Act as' & Cấu trúc 'Keep something from V-ing'</strong></p><p>Nhận diện động từ chính của câu và các cụm cấu trúc cố định đi kèm là chìa khóa xử lý nhanh Part 5.</p><table border='1' style='width: 100%; border-collapse: collapse; border-color: #e0e0e0; margin-top: 10px; font-size: 14px;'><thead style='background-color: #f5f5f5; text-align: left;'><tr><th style='padding: 8px;'>Cấu trúc quan trọng</th><th style='padding: 8px;'>Ý nghĩa</th><th style='padding: 8px;'>Ví dụ</th></tr></thead><tbody><tr><td style='padding: 8px;'><strong>act as + N</strong></td><td style='padding: 8px;'>Đóng vai trò là / có chức năng như...</td><td style='padding: 8px;'><i>Acts as</i> a protective layer</td></tr><tr><td style='padding: 8px;'><strong>keep A from V-ing</strong></td><td style='padding: 8px;'>Giữ/ngăn không cho A bị làm sao</td><td style='padding: 8px;'><i>Keeps</i> tiles <i>from getting</i> scratched</td></tr></tbody></table><p style='margin-top: 10px;'>💡 <strong>Mẹo làm nhanh:</strong> Xác định câu chưa có động từ chính -> Loại ngay dạng đuôi -ing (acting), danh từ (action), trạng từ (actively); chọn ngay động từ chia thì <b>acts</b>.</p></div>",
      vocab: "<ul style='line-height: 1.6;'><li><strong style='color: #0288d1;'>spray-on sealant</strong> (n. phr): chất phủ bảo vệ dạng xịt.</li><li><strong style='color: #0288d1;'>act as</strong> (phr): đóng vai trò như.</li><li><strong style='color: #0288d1;'>protective layer</strong> (n. phr): lớp bảo vệ.</li><li><strong style='color: #0288d1;'>keep A from V-ing</strong> (phr): ngăn A khỏi việc gì.</li></ul>",
      trans: "<div style='line-height: 1.6; padding: 8px; background-color: #f9f9f9; border-left: 4px solid #0288d1;'><p style='margin: 0;'><strong>Dịch nghĩa:</strong> Chất phủ bảo vệ dạng xịt đóng vai trò như một lớp bảo vệ giúp ngăn gạch của bạn không bị trầy xước.</p></div>"
    }

    a: "until",
    exp: {
      correct: "<div style='line-height: 1.6;'><p><strong>a. Phân tích thành phần câu:</strong> Câu gồm mệnh đề chính ở dạng bị động thì tương lai và mệnh đề phụ chỉ thời gian.</p><ul><li><strong>Mệnh đề chính:</strong> <code>The contract for the renovation of the park (S) + will not be awarded (V)</code></li><li><strong>Mệnh đề phụ:</strong> <code>all bids (S) + have been submitted (V)</code></li></ul><p><strong>b. Xác định loại từ cần điền:</strong> Vị trí giữa hai mệnh đề cần một <span style='color: #2e7d32; font-weight: bold;'>Liên từ chỉ thời gian (Subordinating Conjunction)</span> để thể hiện mốc thời gian hành động diễn ra.</p><p><strong>c. Lý do chọn đáp án:</strong> Liên từ <span style='color: #2e7d32; font-weight: bold;'>until</span> (cho đến khi) kết hợp với <i>will not</i> ở mệnh đề chính tạo thành cấu trúc <i>not... until...</i> (mãi cho đến khi... mới...): Hợp đồng sẽ không được trao cho đến khi tất cả hồ sơ dự thầu đã được nộp.</p></div>",
      wrong: "<ul style='line-height: 1.6; list-style-type: none; padding-left: 0;'><li><strong style='color: #c62828;'>❌ (A) nor:</strong> Liên từ đẳng lập chỉ sự phủ định (cũng không), thường dùng trong cặp <i>neither... nor...</i> chứ không đứng độc lập nối hai mệnh đề dạng này.</li><li><strong style='color: #c62828;'>❌ (B) next:</strong> Là tính từ/trạng từ (tiếp theo), không thể làm liên từ nối 2 mệnh đề.</li><li><strong style='color: #c62828;'>❌ (D) because:</strong> Liên từ chỉ nguyên nhân (bởi vì). Nếu dùng <i>because</i> sẽ sai logic: 'không được trao vì tất cả hồ sơ đã nộp'.</li></ul>",
      grammar: "<div style='line-height: 1.6;'><p><strong>⭐ Cấu trúc 'Not ... until' trong Đấu thầu & Hợp đồng</strong></p><p>Cấu trúc <code>not [V] ... until + [Mệnh đề / Mốc thời gian]</code> cực kỳ phổ biến trong các văn bản thương mại để diễn tả sự việc chỉ xảy ra khi một điều kiện thời gian hoàn tất.</p><table border='1' style='width: 100%; border-collapse: collapse; border-color: #e0e0e0; margin-top: 10px; font-size: 14px;'><thead style='background-color: #f5f5f5; text-align: left;'><tr><th style='padding: 8px;'>Thành phần</th><th style='padding: 8px;'>Ví dụ trong câu 121</th></tr></thead><tbody><tr><td style='padding: 8px;'><strong>Mệnh đề phủ định (will not)</strong></td><td style='padding: 8px;'>will <i>not</i> be awarded</td></tr><tr><td style='padding: 8px;'><strong>Liên từ chỉ thời gian</strong></td><td style='padding: 8px;'><strong>until</strong> (cho đến khi)</td></tr><tr><td style='padding: 8px;'><strong>Điều kiện hoàn thành</strong></td><td style='padding: 8px;'>all bids have been submitted</td></tr></tbody></table><p style='margin-top: 10px;'>💡 <strong>Mẹo làm nhanh:</strong> Nhận diện mệnh đề chính chứa dạng phủ định <b>will not / cannot</b> -> Ưu tiên xét liên từ <b>until</b>.</p></div>",
      vocab: "<ul style='line-height: 1.6;'><li><strong style='color: #0288d1;'>award a contract</strong> (phr): trao / ký kết hợp đồng.</li><li><strong style='color: #0288d1;'>renovation</strong> (n): sự cải tạo, nâng cấp.</li><li><strong style='color: #0288d1;'>submit a bid</strong> (phr): nộp hồ sơ dự thầu.</li></ul>",
      trans: "<div style='line-height: 1.6; padding: 8px; background-color: #f9f9f9; border-left: 4px solid #0288d1;'><p style='margin: 0;'><strong>Dịch nghĩa:</strong> Hợp đồng cải tạo công viên sẽ không được trao cho đến khi tất cả hồ sơ dự thầu được nộp.</p></div>"

  {
    id: 122,
    q: "A recent study showed that substituting refined sugars with maple syrup may have some important ______ benefits.",
    options: ["only", "full", "legal", "health"],
    a: "health",
    exp: {
      correct: "<div style='line-height: 1.6;'><p><strong>a. Phân tích thành phần câu:</strong> Câu phức chứa mệnh đề danh từ làm tân ngữ cho động từ <i>showed</i>.</p><ul><li><strong>Chủ ngữ chính (S):</strong> <code>A recent study</code></li><li><strong>Động từ chính (V):</strong> <code>showed</code></li><li><strong>Mệnh đề tân ngữ (that-clause):</strong> <code>substituting refined sugars... may have some important ______ benefits</code></li></ul><p><strong>b. Xác định loại từ cần điền:</strong> Chỗ trống đứng sau tính từ <i>important</i> và trước danh từ số nhiều <i>benefits</i>, cần một <span style='color: #2e7d32; font-weight: bold;'>Danh từ bổ nghĩa (Noun Modifier)</span> để kết hợp tạo thành Danh từ ghép (Compound Noun).</p><p><strong>c. Lý do chọn đáp án:</strong> Danh từ <span style='color: #2e7d32; font-weight: bold;'>health</span> ghép với <i>benefits</i> tạo thành cụm danh từ ghép cố định <i>health benefits</i> (lợi ích về sức khỏe), hoàn toàn phù hợp ngữ cảnh nghiên cứu thực phẩm.</p></div>",
      wrong: "<ul style='line-height: 1.6; list-style-type: none; padding-left: 0;'><li><strong style='color: #c62828;'>❌ (A) only:</strong> Trạng từ / tính từ (duy nhất), không tạo thành cụm từ có nghĩa bổ nghĩa cho 'benefits' trong ngữ cảnh này.</li><li><strong style='color: #c62828;'>❌ (B) full:</strong> Tính từ (đầy đủ). Cụm <i>full benefits</i> thường dùng chỉ 'đầy đủ quyền lợi/bảo hiểm' trong hợp đồng lao động, không dùng cho tác dụng thực phẩm.</li><li><strong style='color: #c62828;'>❌ (C) legal:</strong> Tính từ (pháp lý), không liên quan đến việc thay thế đường bằng si-rô.</li></ul>",
      grammar: "<div style='line-height: 1.6;'><p><strong>⭐ Danh từ ghép (Noun + Noun) & Cấu trúc 'Substitute A with B'</strong></p><p>Trong TOEIC Part 5, rất nhiều trường hợp danh từ đóng vai trò như một tính từ đứng trước để bổ nghĩa cho danh từ chính đứng sau (Noun Modifier).</p><table border='1' style='width: 100%; border-collapse: collapse; border-color: #e0e0e0; margin-top: 10px; font-size: 14px;'><thead style='background-color: #f5f5f5; text-align: left;'><tr><th style='padding: 8px;'>Danh từ ghép TOEIC hay gặp</th><th style='padding: 8px;'>Ý nghĩa</th></tr></thead><tbody><tr><td style='padding: 8px;'><strong>health benefits</strong></td><td style='padding: 8px;'>Lợi ích sức khỏe</td></tr><tr><td style='padding: 8px;'><strong>safety regulations / standards</strong></td><td style='padding: 8px;'>Quy định / tiêu chuẩn an toàn</td></tr><tr><td style='padding: 8px;'><strong>marketing strategy</strong></td><td style='padding: 8px;'>Chiến lược tiếp thị</td></tr></tbody></table><p style='margin-top: 10px;'>💡 <strong>Mẹo làm nhanh:</strong> Nhìn thấy danh từ <b>benefits</b> trong câu nói về dinh dưỡng/y tế -> Chọn ngay danh từ <b>health</b> để tạo thành <i>health benefits</i>.</p></div>",
      vocab: "<ul style='line-height: 1.6;'><li><strong style='color: #0288d1;'>substitute A with B</strong> (phr): thay thế A bằng B.</li><li><strong style='color: #0288d1;'>refined sugar</strong> (n. phr): đường tinh luyện.</li><li><strong style='color: #0288d1;'>health benefits</strong> (n. phr): lợi ích sức khỏe.</li></ul>",
      trans: "<div style='line-height: 1.6; padding: 8px; background-color: #f9f9f9; border-left: 4px solid #0288d1;'><p style='margin: 0;'><strong>Dịch nghĩa:</strong> Một nghiên cứu gần đây cho thấy việc thay thế đường tinh luyện bằng si-rô cây phong có thể mang lại một số lợi ích quan trọng cho sức khỏe.</p></div>"
    }

    id: 123,
    q: "Margie Fung was ______ the winners at Sternetz Institute's art competition.",
    options: ["from", "upon", "among", "beyond"],
    a: "among",
    exp: {
      correct: "<div style='line-height: 1.6;'><p><strong>a. Phân tích thành phần câu:</strong> Câu đơn có cấu trúc S + V + Cụm giới từ.</p><ul><li><strong>Chủ ngữ (S):</strong> <code>Margie Fung</code></li><li><strong>Động từ (V):</strong> <code>was</code></li><li><strong>Bổ ngữ (C):</strong> <code>______ the winners at Sternetz Institute's art competition</code></li></ul><p><strong>b. Xác định loại từ cần điền:</strong> Đứng trước danh từ số nhiều <i>the winners</i>, cần một <span style='color: #2e7d32; font-weight: bold;'>Giới từ (Preposition)</span> mang nghĩa thuộc về/nằm trong một nhóm.</p><p><strong>c. Lý do chọn đáp án:</strong> Giới từ <span style='color: #2e7d32; font-weight: bold;'>among</span> (trong số / nằm trong nhóm) đi với danh từ số nhiều tạo thành cụm <i>be among the winners</i> (là một trong những người chiến thắng).</p></div>",
      wrong: "<ul style='line-height: 1.6; list-style-type: none; padding-left: 0;'><li><strong style='color: #c62828;'>❌ (A) from:</strong> Giới từ (từ), không mang ý nghĩa là thành viên thuộc một danh sách trao giải.</li><li><strong style='color: #c62828;'>❌ (B) upon:</strong> Giới từ (trên/ngay khi), không kết hợp phù hợp với 'the winners'.</li><li><strong style='color: #c62828;'>❌ (D) beyond:</strong> Giới từ (vượt khỏi / bên kia), không phù hợp nghĩa.</li></ul>",
      grammar: "<div style='line-height: 1.6;'><p><strong>⭐ Cấu trúc 'be among + Plural Noun' & Phân biệt 'Among' vs 'Between'</strong></p><p>Cách dùng giới từ chỉ vị trí/tập hợp rất hay xuất hiện trong các bài thông báo giải thưởng, kết quả cuộc thi.</p><table border='1' style='width: 100%; border-collapse: collapse; border-color: #e0e0e0; margin-top: 10px; font-size: 14px;'><thead style='background-color: #f5f5f5; text-align: left;'><tr><th style='padding: 8px;'>Giới từ</th><th style='padding: 8px;'>Đối tượng đi kèm</th><th style='padding: 8px;'>Ví dụ</th></tr></thead><tbody><tr><td style='padding: 8px;'><strong>Among</strong></td><td style='padding: 8px;'>Thuộc nhóm từ 3 đối tượng trở lên (Danh từ số nhiều)</td><td style='padding: 8px;'><i>among</i> the winners / candidates</td></tr><tr><td style='padding: 8px;'><strong>Between</strong></td><td style='padding: 8px;'>Giữa 2 đối tượng cụ thể</td><td style='padding: 8px;'><i>between</i> A and B</td></tr></tbody></table><p style='margin-top: 10px;'>💡 <strong>Mẹo làm nhanh:</strong> Thấy cấu trúc <code>be + ______ + Danh từ số nhiều chỉ người/vật</code> -> Chọn ngay <b>among</b>.</p></div>",
      vocab: "<ul style='line-height: 1.6;'><li><strong style='color: #0288d1;'>be among</strong> (phr): nằm trong số / là một trong những...</li><li><strong style='color: #0288d1;'>art competition</strong> (n. phr): cuộc thi nghệ thuật.</li><li><strong style='color: #0288d1;'>winner</strong> (n): người chiến thắng / người đoạt giải.</li></ul>",
      trans: "<div style='line-height: 1.6; padding: 8px; background-color: #f9f9f9; border-left: 4px solid #0288d1;'><p style='margin: 0;'><strong>Dịch nghĩa:</strong> Margie Fung là một trong những người chiến thắng trong cuộc thi nghệ thuật của Viện Sternetz.</p></div>"
    }

  {
    id: 124,
    q: "Posting updates too infrequently on social media can cause small businesses ______ by their customers.",
    options: ["forgets", "to forget", "been forgotten", "to be forgotten"],
    a: "to be forgotten",
    exp: {
      correct: "<div style='line-height: 1.6;'><p><strong>a. Phân tích thành phần câu:</strong> Câu có cấu trúc S + V + O + Bổ ngữ tân ngữ (Object Complement).</p><ul><li><strong>Chủ ngữ (S):</strong> <code>Posting updates too infrequently on social media</code></li><li><strong>Động từ chính (V):</strong> <code>can cause</code></li><li><strong>Tân ngữ (O):</strong> <code>small businesses</code></li><li><strong>Bổ ngữ tân ngữ:</strong> <code>______ by their customers</code></li></ul><p><strong>b. Xác định loại từ cần điền:</strong> Cấu trúc <i>cause + O + to-V</i> đòi hỏi một động từ nguyên mẫu có <i>to</i>. Do tân ngữ <i>small businesses</i> nhận tác động 'bị lãng quên' (có <i>by their customers</i> đứng sau), ta bắt buộc dùng <span style='color: #2e7d32; font-weight: bold;'>Động từ nguyên mẫu dạng Bị động (Passive Infinitive: to be + V3/-ed)</span>.</p><p><strong>c. Lý do chọn đáp án:</strong> Dạng bị động <span style='color: #2e7d32; font-weight: bold;'>to be forgotten</span> hoàn chỉnh cấu trúc: <i>cause + O + to be + V3/-ed</i> (khiến cho đối tượng nào đó bị... bởi ai).</p></div>",
      wrong: "<ul style='line-height: 1.6; list-style-type: none; padding-left: 0;'><li><strong style='color: #c62828;'>❌ (A) forgets:</strong> Động từ chia thì số ít, không đúng ngữ pháp làm bổ ngữ sau tân ngữ của <i>cause</i>.</li><li><strong style='color: #c62828;'>❌ (B) to forget:</strong> Dạng chủ động, nếu chọn sẽ mang nghĩa 'các doanh nghiệp nhỏ đi quên khách hàng', sai logic và sai cú pháp với cụm 'by their customers'.</li><li><strong style='color: #c62828;'>❌ (C) been forgotten:</strong> Thiếu <i>to be</i>, không đúng cấu trúc ngữ pháp.</li></ul>",
      grammar: "<div style='line-height: 1.6;'><p><strong>⭐ Cấu trúc 'Cause + O + To-V' & Bẫy Thể Bị động (Passive Infinitive)</strong></p><p>Một bẫy nâng cao hay gặp trong TOEIC là dạng Bị động của Động từ nguyên mẫu (to be + V3/-ed) khi Tân ngữ chịu tác động từ hành động khác.</p><table border='1' style='width: 100%; border-collapse: collapse; border-color: #e0e0e0; margin-top: 10px; font-size: 14px;'><thead style='background-color: #f5f5f5; text-align: left;'><tr><th style='padding: 8px;'>Thể</th><th style='padding: 8px;'>Cấu trúc</th><th style='padding: 8px;'>Ví dụ</th></tr></thead><tbody><tr><td style='padding: 8px;'><strong>Chủ động</strong></td><td style='padding: 8px;'>cause + O + <strong>to V</strong></td><td style='padding: 8px;'>Cause customers <i>to forget</i> the brand</td></tr><tr><td style='padding: 8px;'><strong>Bị động</strong></td><td style='padding: 8px;'>cause + O + <strong>to be V3/-ed</strong></td><td style='padding: 8px;'>Cause businesses <i>to be forgotten</i> by customers</td></tr></tbody></table><p style='margin-top: 10px;'>💡 <strong>Mẹo làm nhanh:</strong> Thấy cấu trúc <code>cause + O + ______ + by...</code> -> Chọn ngay dạng bị động <b>to be V3/-ed</b>.</p></div>",
      vocab: "<ul style='line-height: 1.6;'><li><strong style='color: #0288d1;'>too infrequently</strong> (adv): quá ít / quá thưa thớt.</li><li><strong style='color: #0288d1;'>cause O to be V3/-ed</strong> (phr): khiến ai/cái gì bị làm sao.</li><li><strong style='color: #0288d1;'>forget - forgot - forgotten</strong> (v): quên.</li></ul>",
      trans: "<div style='line-height: 1.6; padding: 8px; background-color: #f9f9f9; border-left: 4px solid #0288d1;'><p style='margin: 0;'><strong>Dịch nghĩa:</strong> Việc đăng bài quá ít trên mạng xã hội có thể khiến các doanh nghiệp nhỏ bị khách hàng lãng quên.</p></div>"
    }

        {
    id: 125,
    q: "Ideal for conference rooms, our soundproof panels have been specially designed to ______ unwanted background noise.",
    options: ["compete", "absorb", "surpass", "remain"],
    a: "absorb",
    exp: {
      correct: "<div style='line-height: 1.6;'><p><strong>a. Phân tích thành phần câu:</strong> Câu gồm cụm tính từ rút gọn làm trạng ngữ đứng đầu câu và mệnh đề chính có động từ dạng bị động.</p><ul><li><strong>Trạng ngữ:</strong> <code>Ideal for conference rooms</code></li><li><strong>Mệnh đề chính:</strong> <code>our soundproof panels (S) + have been specially designed (V)</code></li><li><strong>Mục đích:</strong> <code>to ______ unwanted background noise</code></li></ul><p><strong>b. Xác định loại từ cần điền:</strong> Đứng sau <i>to</i> để chỉ mục đích, cần một <span style='color: #2e7d32; font-weight: bold;'>Động từ nguyên mẫu (Bare Infinitive)</span> tác động lên tân ngữ <i>unwanted background noise</i>.</p><p><strong>c. Lý do chọn đáp án:</strong> Động từ <span style='color: #2e7d32; font-weight: bold;'>absorb</span> (hấp thụ / triệt tiêu) ghép với <i>noise</i> tạo thành cụm <i>absorb noise</i> (hấp thụ tiếng ồn), rất phổ biến trong lĩnh vực xây dựng và nội thất.</p></div>",
      wrong: "<ul style='line-height: 1.6; list-style-type: none; padding-left: 0;'><li><strong style='color: #c62828;'>❌ (A) compete:</strong> Nội động từ (cạnh tranh), không đi trực tiếp với tân ngữ <i>noise</i> (thường đi với <i>with/against</i>).</li><li><strong style='color: #c62828;'>❌ (C) surpass:</strong> Ngoại động từ (vượt qua / vượt trội), thường đi với <i>expectations, limits, competitors</i> chứ không dùng cho <i>noise</i>.</li><li><strong style='color: #c62828;'>❌ (D) remain:</strong> Liên động từ / nội động từ (vẫn còn / duy trì), không thể mang tân ngữ <i>noise</i> phía sau.</li></ul>",
      grammar: "<div style='line-height: 1.6;'><p><strong>⭐ Cấu trúc 'be designed to + V' & Collocation với 'Noise'</strong></p><p>Cấu trúc <code>be designed to + V</code> dùng để diễn tả mục đích chế tạo/thiết kế của một vật dụng thể hiện tính năng kỹ thuật.</p><table border='1' style='width: 100%; border-collapse: collapse; border-color: #e0e0e0; margin-top: 10px; font-size: 14px;'><thead style='background-color: #f5f5f5; text-align: left;'><tr><th style='padding: 8px;'>Collocation chỉ tính năng âm thanh</th><th style='padding: 8px;'>Ý nghĩa</th></tr></thead><tbody><tr><td style='padding: 8px;'><strong>absorb noise / sound</strong></td><td style='padding: 8px;'>Hấp thụ / tiêu âm</td></tr><tr><td style='padding: 8px;'><strong>reduce / eliminate noise</strong></td><td style='padding: 8px;'>Giảm / loại bỏ tiếng ồn</td></tr><tr><td style='padding: 8px;'><strong>block sound</strong></td><td style='padding: 8px;'>Chặn âm thanh</td></tr></tbody></table><p style='margin-top: 10px;'>💡 <strong>Mẹo làm nhanh:</strong> Thấy sản phẩm cách âm (<i>soundproof panels</i>) + tân ngữ tiếng ồn (<i>noise</i>) -> Chọn ngay <b>absorb</b>.</p></div>",
      vocab: "<ul style='line-height: 1.6;'><li><strong style='color: #0288d1;'>soundproof panel</strong> (n. phr): tấm cách âm / vật liệu tiêu âm.</li><li><strong style='color: #0288d1;'>absorb noise</strong> (phr): hấp thụ tiếng ồn.</li><li><strong style='color: #0288d1;'>be designed to + V</strong> (phr): được thiết kế để làm gì.</li></ul>",
      trans: "<div style='line-height: 1.6; padding: 8px; background-color: #f9f9f9; border-left: 4px solid #0288d1;'><p style='margin: 0;'><strong>Dịch nghĩa:</strong> Lý tưởng cho phòng họp, các tấm cách âm của chúng tôi được thiết kế đặc biệt để hấp thụ tiếng ồn nền không mong muốn.</p></div>"
    }

  {
    id: 126,
    q: "Mr. Sato will call into the meeting ______ the hotel's wireless network.",
    options: ["used", "using", "use", "had used"],
    a: "using",
    exp: {
      correct: "<div style='line-height: 1.6;'><p><strong>a. Phân tích thành phần câu:</strong> Mệnh đề chính đã hoàn chỉnh về ngữ pháp, phía sau là cụm từ chỉ phương thức / công cụ thực hiện.</p><ul><li><strong>Chủ ngữ (S):</strong> <code>Mr. Sato</code></li><li><strong>Động từ chính (V):</strong> <code>will call into</code></li><li><strong>Tân ngữ của V:</strong> <code>the meeting</code></li><li><strong>Cụm phân từ bổ nghĩa:</strong> <code>______ the hotel's wireless network</code></li></ul><p><strong>b. Xác định loại từ cần điền:</strong> Cần một <span style='color: #2e7d32; font-weight: bold;'>Hiện tại phân từ (V-ing)</span> bổ nghĩa cho mệnh đề chính, diễn tả cách thức/phương tiện mà chủ ngữ dùng để thực hiện hành động (rút gọn của <i>by using...</i>).</p><p><strong>c. Lý do chọn đáp án:</strong> Dạng <span style='color: #2e7d32; font-weight: bold;'>using</span> thể hiện hành động chủ động của chủ ngữ Mr. Sato (sử dụng mạng không dây để tham gia cuộc họp).</p></div>",
      wrong: "<ul style='line-height: 1.6; list-style-type: none; padding-left: 0;'><li><strong style='color: #c62828;'>❌ (A) used:</strong> Quá khứ phân từ (V-ed), mang nghĩa bị động, không dùng vì chủ ngữ Mr. Sato là người chủ động sử dụng mạng.</li><li><strong style='color: #c62828;'>❌ (C) use:</strong> Động từ nguyên mẫu, không thể đứng nối trực tiếp sau một mệnh đề hoàn chỉnh khi không có liên từ hay to-infinitive.</li><li><strong style='color: #c62828;'>❌ (D) had used:</strong> Động từ chia thì quá khứ hoàn thành, không phù hợp về cả cấu trúc lẫn thì tương lai (<i>will call</i>) của mệnh đề chính.</li></ul>",
      grammar: "<div style='line-height: 1.6;'><p><strong>⭐ Cụm V-ing bổ nghĩa chỉ Cách thức / Phương tiện</strong></p><p>Trong tiếng Anh công sở, cụm danh từ bắt đầu bằng <code>using + [công cụ/phương tiện]</code> thường đứng ở cuối câu để diễn tả phương cách chủ ngữ hoàn thành công việc.</p><table border='1' style='width: 100%; border-collapse: collapse; border-color: #e0e0e0; margin-top: 10px; font-size: 14px;'><thead style='background-color: #f5f5f5; text-align: left;'><tr><th style='padding: 8px;'>Cách diễn đạt đầy đủ</th><th style='padding: 8px;'>Cách diễn đạt rút gọn bằng V-ing</th></tr></thead><tbody><tr><td style='padding: 8px;'>...by using the wireless network</td><td style='padding: 8px;'>...<strong>using</strong> the wireless network</td></tr><tr><td style='padding: 8px;'>...by applying the new policy</td><td style='padding: 8px;'>...<strong>applying</strong> the new policy</td></tr></tbody></table><p style='margin-top: 10px;'>💡 <strong>Mẹo làm nhanh:</strong> Mệnh đề chính đã đủ S + V, phía sau là tên phương tiện / công cụ -> Chọn <b>using + N</b>.</p></div>",
      vocab: "<ul style='line-height: 1.6;'><li><strong style='color: #0288d1;'>call into a meeting</strong> (phr): tham gia cuộc họp từ xa (qua điện thoại / trực tuyến).</li><li><strong style='color: #0288d1;'>wireless network</strong> (n. phr): mạng không dây / Wi-Fi.</li><li><strong style='color: #0288d1;'>using + N</strong> (phr): bằng cách sử dụng...</li></ul>",
      trans: "<div style='line-height: 1.6; padding: 8px; background-color: #f9f9f9; border-left: 4px solid #0288d1;'><p style='margin: 0;'><strong>Dịch nghĩa:</strong> Ông Sato sẽ tham gia cuộc họp bằng cách sử dụng mạng không dây của khách sạn.</p></div>"
    }

  {
    id: 127,
    q: "Not only has Mr. Ogbu ______ worked on the project, but he has also trained Ms. Jeong to continue the work.",
    options: ["accessibly", "diligently", "eventfully", "completely"],
    a: "diligently",
    exp: {

      grammar: "<div style='line-height: 1.6;'><p><strong>⭐ Đảo ngữ với 'Not only' & Collocation với 'Work'</strong></p><p>Khi cụm liên từ <code>Not only</code> đứng ở đầu câu, trợ động từ bắt buộc phải đảo lên trước chủ ngữ.</p><table border='1' style='width: 100%; border-collapse: collapse; border-color: #e0e0e0; margin-top: 10px; font-size: 14px;'><thead style='background-color: #f5f5f5; text-align: left;'><tr><th style='padding: 8px;'>Thành phần đảo ngữ</th><th style='padding: 8px;'>Công thức</th></tr></thead><tbody><tr><td style='padding: 8px;'><strong>Cấu trúc chuẩn</strong></td><td style='padding: 8px;'>Not only + Trợ V (has/have/did) + S + (Adv) + V...</td></tr><tr><td style='padding: 8px;'><strong>Áp dụng câu 127</strong></td><td style='padding: 8px;'>Not only + <strong>has</strong> + Mr. Ogbu + <strong>diligently worked</strong>...</td></tr></tbody></table><p style='margin-top: 10px;'>💡 <strong>Mẹo làm nhanh:</strong> Bổ nghĩa cho động từ <i>worked</i> trong môi trường làm việc -> Ưu tiên các trạng từ khen ngợi như <b>diligently</b> (chăm chỉ) hoặc <b>efficiently</b> (hiệu quả).</p></div>",

      vocab: "<ul style='line-height: 1.6;'><li><strong style='color: #0288d1;'>warranty</strong> (n): sự bảo hành / giấy bảo hành.</li><li><strong style='color: #0288d1;'>peace of mind</strong> (n. phr): sự an tâm / sự yên tâm.</li><li><strong style='color: #0288d1;'>those who</strong> (phr): những người mà...</li></ul>",
      trans: "<div style='line-height: 1.6; padding: 8px; background-color: #f9f9f9; border-left: 4px solid #0288d1;'><p style='margin: 0;'><strong>Dịch nghĩa:</strong> Belker Auto cung cấp chế độ bảo hành mười năm cho những khách hàng muốn có sự an tâm hơn.</p></div>"

radobankofliberia.com.lr</div>\n        <div><strong>Date:</strong> 1 November</div>\n        <div><strong>Subject:</strong> Missing AFR issue</div>\n    </div>\n    <div class=\"email-body\">\n        <p>To Whom It May Concern:</p>\n        <p>I read the article on Sonfaya Mutual's BASA in the most recent issue of AFR with interest. Subsequently, I visited your Web site, <span class=\"clue-highlight-3\">looking for the previous AFR issue referenced in the article.</span> Unfortunately, I could not locate it on the archival page. Please advise on how I can obtain that back issue.</p>\n        <p>Sincerely,</p>\n        <p>Odette Chabinga<br>Vice President, Mesurado Bank of Liberia</p>\n    </div>\n</div>\n<br>\n<div class=\"letter-container\">\n    <p style=\"text-align: right;\">23 November</p>\n    <p>Ms. Julienne Nirere<br>Β.Ρ. 2581 KIGALI</p>\n    <p>Dear Ms. Nirere,</p>\n    <p>Thank you for being a valued checking account holder with Sonfaya Mutual for fifteen years. We are, furthermore, pleased that you strengthened your relationship with us by <span class=\"clue-highlight-4\">opening a business advantage savings account (BASA).</span></p>\n    <p><span class=\"clue-highlight-5\">Your checking and savings accounts are now joined, enabling you to transfer money from one account to the other online. Moreover, if you wish to withdraw funds from your BASA, you can use your debit card at any of our ATMs.</span></p>\n    <p><span class=\"clue-highlight-5\">Finally, our recently launched online stock-trading platform, available to you at no charge, is excellent for allowing investors to manage their finances at their own pace.</span> Contact our Wealth Management Department for details.</p>\n    <p>Sincerely,</p>\n    <p>Philbert Akamanzi<br>Philbert Akamanzi, Senior Accounts Manager</p>\n</div>",

ail-container\">\n            <div class=\"email-body\">\n                <p>Gửi: archivist@atlasfinancialreview.com<br>Từ: ochabinga@mesuradobankofliberia.com.lr<br>Ngày: 1 tháng 11<br>Chủ đề: Thiếu số báo AFR</p>\n                <p>Kính gửi bộ phận liên quan,</p>\n                <p>Tôi đã đọc bài viết về tài khoản BASA của Sonfaya Mutual trong số báo gần đây nhất của AFR với sự hứng thú lớn. Sau đó, tôi đã truy cập trang web của bạn, <span class=\"clue-highlight-3\">tìm kiếm số báo AFR trước đó được tham chiếu trong bài viết.</span> Thật không may, tôi không thể tìm thấy nó trên trang lưu trữ. Vui lòng hướng dẫn cách tôi có thể lấy số báo cũ đó.</p>\n                <p>Trân trọng,<br>Odette Chabinga<br>Phó Chủ tịch, Ngân hàng Mesurado của Liberia</p>\n            </div>\n        </div>\n        <br>\n        <div class=\"letter-container\">\n            <p style=\"text-align: right;\">23 tháng 11</p>\n            <p>Bà Julienne Nirere<br>Β.Ρ. 2581 KIGALI</p>\n            <p>Kính gửi bà Nirere,</p>\n            <p>Cảm ơn bà đã là chủ tài khoản thanh toán được coi trọng tại Sonfaya Mutual trong mười lăm năm qua. Hơn nữa, chúng tôi rất vui vì bà đã thắt chặt mối quan hệ với chúng tôi bằng cách <span class=\"clue-highlight-4\">mở tài khoản tiết kiệm thương mại ưu việt (BASA).</span></p>\n            <p><span class=\"clue-highlight-5\">Tài khoản thanh toán và tài khoản tiết kiệm của bà hiện đã được liên kết, cho phép bà chuyển tiền từ tài khoản này sang tài khoản khác trực tuyến. Hơn nữa, nếu bà muốn rút tiền từ BASA của mình, bà có thể sử dụng thẻ ghi nợ tại bất kỳ cây ATM nào của chúng tôi.</span></p>\n            <p><span class=\"clue-highlight-5\">Cuối cùng, nền tảng giao dịch chứng khoán trực tuyến mới ra mắt của chúng tôi, được cung cấp miễn phí cho bà, rất tuyệt vời để cho phép các nhà đầu tư quản lý tài chính theo tiến độ của riêng họ.</span> Liên hệ với Bộ phận Quản lý Tài sản của chúng tôi để biết thêm chi tiết.</p>\n            <p>Trân trọng,<br>Philbert A function applyEvidenceColors() {
    const pastelColors = [
        { bg: '#ffadad', text: '#5a1c1c' }, // Đỏ pastel
        { bg: '#ffd6a5', text: '#663d14' }, // Cam pastel
        { bg: '#caffbf', text: '#1f4d1f' }, // Xanh lá pastel
        { bg: '#9bf6ff', text: '#16565c' }, // Xanh dương pastel
        { bg: '#a0c4ff', text: '#1c3666' }, // Xanh biển pastel
        { bg: '#bdb2ff', text: '#352666' }, // Tím pastel
        { bg: '#ffc6ff', text: '#661a66' }, // Hồng pastel
        { bg: '#e2f0cb', text: '#3e5222' }  // Xanh rêu pastel
    ];

    let colorIndex = 0;
    let usedColors = {}; 

    let evElements = document.querySelectorAll('.ev-box');

    evElements.forEach(el => {
        let idString = el.id;
        if (!idString) return;
        let match = idString.match(/ev-(\d+)/);
        if (match) {
            let qId = match[1];
            if (!usedColors[qId]) {
                usedColors[qId] = pastelColors[colorIndex % pastelColors.length];
                colorIndex++;
            }
            el.style.backgroundColor = usedColors[qId].bg;
            el.style.color = usedColors[qId].text;
            el.style.padding = "2px 5px";
            el.style.borderRadius = "6px";
            el.style.fontWeight = "600";
            el.style.transition = "all 0.3s ease";
        }
    });
}

function formatAnswer(options, answer) {
    if(!options) return answer;
    if(Array.isArray(options)) {
        // Bỏ qua mảng object của Part 7 vì đáp án đã là A,B,C,D sẵn
        if (typeof options[0] === 'object') return answer; 
        let labels = ["A", "B", "C", "D"];
        let idx = options.indexOf(answer);
        return idx !== -1 ? labels[idx] : answer;
    }
    return answer; 
}

function createTOEICQuestion(qObj) {
    if(!qObj || !qObj.id) return "";
    
    // 1. Lấy nội dung câu hỏi
    let text = qObj.q || qObj.text || qObj.qEng || "";
    
    // XỬ LÝ LẶP SỐ: Nếu nội dung câu hỏi bắt đầu bằng "151. ", "152. "... thì xóa nó đi
    // vì đã có số thứ tự hiển thị trong vòng tròn màu hồng bên trái rồi.
    if (typeof text === 'string') {
        text = text.replace(/^\d+\.\s*/, ""); // Xóa số và dấu chấm ở đầu (vd: "131. " -> "")
        text = text.replace(/(\([^)]+\))/g, '<span class="vi-trans">$1</span>');
    }
    
    let opts = qObj.options;
    let optsHTML = "";
    let inputStyle = `margin-right:12px; transform:scale(1.3); cursor:pointer;`;
    let labelStyle = `display:block; margin:10px 0; padding:12px 18px; border-radius:var(--radius); cursor:pointer; border:2px solid #f1f5f9; background:#f8fafc; transition:all 0.2s ease; font-size:17px;`;

    if (Array.isArray(opts)) {
        let labels = ["A", "B", "C", "D"];
        opts.forEach((opt, i) => {
            // Sửa lỗi undefined cho các Option Part 6, 7 (dùng .text thay vì .en)
            let optText = typeof opt === 'object' ? (opt.text || opt.en || "") : opt;
            
            // XỬ LÝ LẶP NHÃN A. A.: Xóa "A. ", "B. " có sẵn trong dữ liệu
            if (typeof optText === 'string') {
                optText = optText.replace(/^[A-D]\.\s*/, ""); 
                optText = optText.replace(/(\([^)]+\))/g, '<span class="vi-trans">$1</span>');
            }

            let optValue = typeof opt === 'object' ? (opt.key || labels[i]) : labels[i];
            
            optsHTML += `
                <label class="mc-option" style="${labelStyle}" onmouseover="this.style.background='var(--exp-bg)'" onmouseout="this.style.background='transparent'">
                    <input type="radio" name="q${qObj.id}" value="${optValue}" style="${inputStyle}" onclick="checkNav(${qObj.id})"> 
                    <b>${labels[i]}.</b> ${optText}
                </label>`;
        });
    } else {
        // Trường hợp options là Object (thường cho Part 5)
        for (let key in opts) {
            let optText = opts[key];
            if (typeof optText === 'string') {
                optText = optText.replace(/^[A-D]\.\s*/, ""); 
                optText = optText.replace(/(\([^)]+\))/g, '<span class="vi-trans">$1</span>');
            }
            optsHTML += `
                <label class="mc-option" style="${labelStyle}" onmouseover="this.style.background='var(--exp-bg)'" onmouseout="this.style.background='transparent'">
                    <input type="radio" name="q${qObj.id}" value="${key}" style="${inputStyle}" onclick="checkNav(${qObj.id})"> 
                    <b>${key}.</b> ${optText}
                </label>`;
        }
    }

    return `<div class="q-row" id="q-row-${qObj.id}" style="margin-bottom:30px; display:flex; background:white; padding:25px; border-radius:var(--radius); box-shadow:var(--shadow); border:1px solid var(--border);">
<div class="q-num" style="min-width:42px; height:42px; background:linear-gradient(135deg, var(--primary), var(--primary-dark)); color:white; border-radius:10px; display:flex; align-items:center; justify-content:center; font-weight:800; margin-right:20px; flex-shrink:0; box-shadow: 0 4px 10px rgba(30,58,138,0.2);">${qObj.id}</div>
                <div class="q-text" style="flex:1; font-size:18px; line-height:1.8;">
                    <div class="q-content-wrapper">
                        <!-- Biến 'text' ở đây đã được cắt bỏ số thứ tự trùng lặp -->
                        <b>${text}</b><br>${optsHTML}
                        <span id="fb-${qObj.id}" class="feedback" style="font-weight:bold; margin-left:10px;"></span>
                    </div>
                    <div id="exp-${qObj.id}" class="exp-container"></div>
                </div>
            </div>`;
}

function createQuestionsBlock(passageObj) {
    let html = `<div class="questions-block" style="margin-bottom: 40px; background: transparent; padding: 0;" onmouseenter="showPassage('${passageObj.passageId}')">`;
    html += `<div style="color:var(--primary-dark); font-weight:bold; margin-bottom:15px; border-bottom: 2px solid var(--border); padding-bottom:10px; font-size: 18px;">📝 Questions for Passage: ${passageObj.passageId}</div>`;
    
    let validQuestions = passageObj.questions.filter(q => q && q.id);
    
    validQuestions.forEach(q => {
        html += createTOEICQuestion(q);
        allQuestionIds.push(q.id);
        
        // --- BẮT ĐẦU PHẦN SỬA LỖI ---
        let correctAns = q.a || q.correct; 
        
        // Nếu là Part 6/7 (options là mảng các object)
        if (!correctAns && Array.isArray(q.options)) {
            // Tìm vị trí của option có thuộc tính "correct" là true
            const foundIdx = q.options.findIndex(o => typeof o === 'object' && o.correct === true);
            if (foundIdx !== -1) {
                const labels = ["A", "B", "C", "D"];
                correctAns = labels[foundIdx]; // Chuyển index 0,1,2,3 thành A,B,C,D
            }
        }
        
        answerKey[q.id] = correctAns; // Lưu nhãn A,B,C,D vào bộ nhớ chấm điểm
        // --- KẾT THÚC PHẦN SỬA LỖI ---

        explanations[q.id] = { exp: q.explanation || "" };
    });
    html += `</div>`;
    return html;
}

function switchTab(n) {
    const mainContainer = document.getElementById('mainContainer');
    document.querySelectorAll('.tab-btn').forEach((b, i) => { b.classList.toggle('active', i + 1 === n); });
    document.querySelectorAll('.question-group').forEach((q, i) => { q.style.display = (i + 1 === n) ? 'block' : 'none'; });
    
    // Quản lý chế độ Part 5 hoặc 6-7
    if (n === 1) {
        mainContainer.classList.add('part5-mode');
    } else {
        mainContainer.classList.remove('part5-mode');
    }

    // Reset pagination khi đổi Part
    currentStep = 0;
    updatePagination();
    
    document.querySelector('.pane-right').scrollTop = 0;
}
function showPassage(passageId) {
    document.querySelectorAll('.passage-text-content').forEach(p => p.style.display = 'none');
    
    // Hiện bài tiếng Anh
    let pEng = document.getElementById(`passage-${passageId}`);
    if (pEng) pEng.style.display = 'block';

    // Hiện bản dịch tiếng Việt tương ứng (Cột 2)
    let pVie = document.getElementById(`vie-passage-${passageId}`);
    if (pVie) pVie.style.display = 'block';
}
let currentStep = 0;

function updatePagination() {
    const activeGroup = document.querySelector('.question-group[style*="display: block"]');
    if (!activeGroup) return;
    const partSuffix = activeGroup.id.split('-').pop();
    const isPart5 = activeGroup.id === 'q-group-1';

    if (isSubmitted) {
        activeGroup.querySelectorAll('.questions-block, .q-row').forEach(el => el.style.display = isPart5 ? 'flex' : 'block');
        document.getElementById(`paginationBox${partSuffix}`).style.display = 'none';
        return;
    }

    const steps = isPart5 ? activeGroup.querySelectorAll('.q-row') : activeGroup.querySelectorAll('.questions-block');
    steps.forEach((step, index) => {
        if (index === currentStep) {
            step.style.display = isPart5 ? 'flex' : 'block';
            if (!isPart5) {
                // SỬA TẠI ĐÂY: Thay match[1] bằng match[2]
                const match = step.getAttribute('onmouseenter').match(/'([^']+)'/);
                if (match && match[2]) showPassage(match[2]); 
            }
        } else {
            step.style.display = 'none';
        }
    });

    document.getElementById(`btnPrev${partSuffix}`).disabled = (currentStep === 0);
    document.getElementById(`btnNext${partSuffix}`).disabled = (currentStep === steps.length - 1);
}
// --- 2. Sửa lỗi đóng ngoặc và phạm vi biến ID ---
function scrollToQuestion(id) {
    document.getElementById('navPanel').classList.remove('show');
    let group = 1;
    if (toeicData.part6.some(p => p.questions.some(q => q.id == id))) group = 2;
    if (toeicData.part7.some(p => p.questions.some(q => q.id == id))) group = 3;
    
    switchTab(group); 

    const activeGroup = document.getElementById(`q-group-${group}`);
    const steps = group === 1 ? activeGroup.querySelectorAll('.q-row') : activeGroup.querySelectorAll('.questions-block');
    
    steps.forEach((step, index) => {
        if (step.id === `q-row-${id}` || step.querySelector(`#q-row-${id}`)) {
            currentStep = index; 
        }
    });

    updatePagination(); 

    // Đảm bảo khối setTimeout này nằm TRONG hàm scrollToQuestion
    setTimeout(() => {
        let el = document.getElementById(`q-row-${id}`);
        if (el) {
            el.scrollIntoView({behavior: "smooth", block: "center"});
            el.style.transition = "background 0.5s";
            el.style.background = "#fff9c4";
            setTimeout(() => el.style.background = "transparent", 1000);

            let parentBlock = el.closest('.questions-block');
            if(parentBlock) {
                let mouseEvent = new MouseEvent('mouseenter');
                parentBlock.dispatchEvent(mouseEvent);
            }
        }
    }, 150);
}

function showCustomConfirm(msg, onConfirmCallback) {
    document.getElementById('genericConfirmMsg').innerText = msg;
    let confirmBtn = document.getElementById('genericConfirmBtn');
    
    // Gỡ bỏ các sự kiện click cũ để tránh bị lặp hành động
    let newBtn = confirmBtn.cloneNode(true);
    confirmBtn.parentNode.replaceChild(newBtn, confirmBtn);
    
    newBtn.addEventListener('click', function() {
        document.getElementById('genericConfirmOverlay').style.display = 'none';
        if (typeof onConfirmCallback === 'function') {
            onConfirmCallback();
        }
    });

    document.getElementById('genericConfirmOverlay').style.display = 'flex';
}

function closeGenericConfirm() {
    document.getElementById('genericConfirmOverlay').style.display = 'none';
}
// --- TIMER ---
function startTimer() {
    let display = document.getElementById("timer");
    timerInterval = setInterval(function () {
        let m = Math.floor(testDuration / 60);
        let s = testDuration % 60;
        display.textContent = `${m < 10 ? '0'+m : m}:${s < 10 ? '0'+s : s}`;
        if (--testDuration < 0) { 
            clearInterval(timerInterval); 
            submitTest(false); 
        }
    }, 1000);
}
window.openHistoryModal = openHistoryModal;
window.closeHistoryModal = closeHistoryModal;
window.restoreAttempt = restoreAttempt;
window.deleteAttempt = deleteAttempt; // Thêm kết nối cho hàm Xóa

// --- QUẢN LÝ LỊCH SỬ LÀM BÀI ---
const HISTORY_KEY = "snapenglish_test5_2026_history";
let isReviewingMode = false;
function openHistoryModal() {
    // Lấy dữ liệu lịch sử từ localStorage
    let history = JSON.parse(localStorage.getItem(HISTORY_KEY)) || [];
    let historyListEl = document.getElementById('historyList');
    let listHtml = '';

    // Kiểm tra nếu chưa có lịch sử
    if (history.length === 0) {
        listHtml = '<p style="text-align: center; color: #888; margin-top: 20px;">Chưa có dữ liệu làm bài.</p>';
    } else {
        // Duyệt qua từng bài làm và tạo giao diện hiển thị
        history.forEach(attempt => {
            listHtml += `
                <div class="history-item">
                    <div class="history-info">
                        <span class="history-date">📅 ${attempt.date} - ⏰ ${attempt.time}</span>
                        <span class="history-score">🏆 Điểm: ${attempt.score}/${attempt.total} (${attempt.toeicScore} điểm)</span>
                    </div>
                    <div style="display: flex; gap: 5px;">
                        <button class="btn-review" onclick="restoreAttempt(${attempt.id})">Xem lại</button>
                        <button class="btn-delete-history" onclick="deleteAttempt(${attempt.id})" title="Xóa bài làm này">✖</button>
                    </div>
                </div>
            `;
        });
    }
    
    // Đổ dữ liệu vào danh sách và hiển thị bảng Modal
    historyListEl.innerHTML = listHtml;
    document.getElementById('historyOverlay').style.display = 'flex';
}

function closeHistoryModal() {
    // Ẩn bảng Modal lịch sử
    document.getElementById('historyOverlay').style.display = 'none';
}
function saveAttemptToHistory(score, total, userAnswersMap) {
    let history = JSON.parse(localStorage.getItem(HISTORY_KEY)) || [];
    let now = new Date();
    
    let attempt = {
        id: Date.now(),
        date: now.toLocaleDateString('vi-VN'),
        time: now.toLocaleTimeString('vi-VN', { hour: '2-digit', minute: '2-digit' }),
        score: score,
        total: total,
        toeicScore: calculateToeicReading(score, total),
        answers: userAnswersMap // Lưu lại toàn bộ ABCD đã chọn
    };
    
    history.unshift(attempt); // Đẩy bài mới nhất lên đầu
    localStorage.setItem(HISTORY_KEY, JSON.stringify(history));

    // ĐỒNG BỘ LÊN CLOUD NGAY SAU KHI LƯU
    if (window.syncHistoryToCloud) {
        window.syncHistoryToCloud(history);
    }
}

function deleteAttempt(attemptId) {
    showCustomConfirm("Bạn có chắc chắn muốn xóa bài làm này khỏi lịch sử không?", function() {
        let history = JSON.parse(localStorage.getItem(HISTORY_KEY)) || [];
        history = history.filter(h => h.id !== attemptId); 
        localStorage.setItem(HISTORY_KEY, JSON.stringify(history)); 
        
        // ĐỒNG BỘ THAO TÁC XÓA LÊN CLOUD
        if (window.syncHistoryToCloud) {
            window.syncHistoryToCloud(history);
        }
        
        openHistoryModal(); 
    });
}
function restoreAttempt(attemptId) {
    let history = JSON.parse(localStorage.getItem(HISTORY_KEY)) || [];
    let attempt = history.find(h => h.id === attemptId);
    
    if(!attempt) return;

    isReviewingMode = true; // Bật cờ hiệu "Đang xem lại"
    document.getElementById('historyOverlay').style.display = 'none';
    document.getElementById('setupOverlay').style.display = 'none';
    
    document.querySelectorAll('input[type="radio"]').forEach(el => {
        el.disabled = false;
        el.checked = false; 
    });
    
    // Tự động đánh dấu lại các Radio button đáp án học viên đã chọn trong lịch sử
    for (let qId in attempt.answers) {
        let val = attempt.answers[qId];
        if (val) {
            let radio = document.querySelector(`input[name="q${qId}"][value="${val}"]`);
            if (radio) radio.checked = true;
        }
    }
    
   // Đổi chữ nút Nộp bài thành "Đang xem lại" cho ngầu
    let btnSubmit = document.querySelector('.btn-submit');
    if(btnSubmit) {
        btnSubmit.innerText = "ĐANG XEM LẠI";
        btnSubmit.style.background = "#888";
        btnSubmit.style.boxShadow = "none";
    }

    // --- THÊM 2 DÒNG NÀY VÀO TRƯỚC DẤU NGOẶC NHỌN ĐÓNG HÀM ---
    isSubmitted = false; 
    executeSubmit();
}


function scrollToEvidence(evId) {
    const evElement = document.getElementById(evId);
    if(evElement) {
        // Cuộn đoạn văn chứa dẫn chứng vào giữa màn hình
        evElement.scrollIntoView({behavior: "smooth", block: "center"});
        
        // Thêm class 'focus-blink' để bật chế độ nháy vàng in đậm
        evElement.classList.add("focus-blink");
        
        // Tắt nổi bật sau 1.5 giây để trả văn bản về bình thường
        setTimeout(() => {
            evElement.classList.remove("focus-blink");
        }, 1500);
    } else {
        showCustomAlert("Chưa được gắn ID dẫn chứng trong bài đọc!");
    }
}
// --- GRADING ---
function submitTest(manual) {
    if (isSubmitted) return;
    if (manual) document.getElementById('confirmOverlay').style.display = 'flex';
    else executeSubmit();
}

function closeConfirmModal() { document.getElementById('confirmOverlay').style.display = 'none'; }
function closeResultModal() { document.getElementById('resultOverlay').style.display = 'none'; }

function executeSubmit() {
    document.getElementById('confirmOverlay').style.display = 'none';
    isSubmitted = true;
updatePagination();
    clearInterval(timerInterval);
    document.querySelectorAll('input, select').forEach(el => el.disabled = true);
    
    document.getElementById('mainContainer').classList.add('show-translation');
    
    let activeTabIndex = 1;
    document.querySelectorAll('.tab-btn').forEach((b, i) => {
        if (b.classList.contains('active')) activeTabIndex = i + 1;
    });
    switchTab(activeTabIndex);
    
    let score = 0;
    let totalQuestions = allQuestionIds.length;
    let userAnswersMap = {}; // Thêm cái này để hứng đáp án học viên

    allQuestionIds.forEach(id => {
        let userAns = "";
        let radios = document.getElementsByName(`q${id}`);
        for (let r of radios) if (r.checked) userAns = r.value;
        
        userAnswersMap[id] = userAns; // Ghi nhận đáp án câu này

        let correctAns = answerKey[id];
        let isCorrect = (userAns === correctAns);
        if (isCorrect && userAns !== "") score++; // Có chọn mới tính điểm

        let feedbackEl = document.getElementById(`fb-${id}`);
        if(feedbackEl) {
            if(isCorrect && userAns !== "") {
                feedbackEl.innerHTML = `<span style="color:var(--correct);">✓ Đúng</span>`;
            } else if (userAns === "") {
                feedbackEl.innerHTML = `<span style="color:#888;">Trống (Đáp án: <span style="background:#dce775; color:#333; padding:2px 5px; border-radius:4px;">${correctAns}</span>)</span>`;
            } else {
                feedbackEl.innerHTML = `<span style="color:var(--wrong);">✗ Sai (Đáp án: <span style="background:#dce775; color:#333; padding:2px 5px; border-radius:4px;">${correctAns}</span>)</span>`;
            }
        }
        
        let nav = document.getElementById(`nav-${id}`);
        if(nav) {
            if (isCorrect && userAns !== "") {
                nav.style.background = "#c8e6c9"; nav.style.color = "#2e7d32"; nav.style.borderColor = "#81c784";
            } else {
                nav.style.background = "#ffcdd2"; nav.style.color = "#c62828"; nav.style.borderColor = "#ef9a9a";
            }
        }

        let expContainer = document.getElementById(`exp-${id}`);
        if(expContainer && explanations[id]) {
            let expData = explanations[id];
let contentHtml = "";

if (expData.exp) contentHtml += `<div class="exp-text">${expData.exp}</div>`;
if (expData.vocab) contentHtml += `<div class="exp-vocab">${expData.vocab}</div>`;
if (expData.tip) contentHtml += `<div style="margin-top:8px; color:var(--primary-dark); font-weight:600;">📌 Ghi chú: ${expData.tip}</div>`;

expContainer.innerHTML = `
    <div class="exp-box show">
        <div class="exp-title">💡 Giải thích chi tiết Câu ${id}</div>
        ${contentHtml}
    </div>
`;
        }
    });

   
    if (!isReviewingMode) {
        saveAttemptToHistory(score, totalQuestions, userAnswersMap);
        document.getElementById('resultMessage').innerHTML = `Bạn đã làm đúng <b style="color: var(--primary); font-size: 22px;">${score}/${totalQuestions}</b> câu.<br>Điểm TOEIC Reading quy đổi: <b>${calculateToeicReading(score, totalQuestions)}</b>`;
        document.getElementById('resultOverlay').style.display = 'flex';
        if(window.luuDiemTOEICReadingFull) {
            // Tính toán thời gian thực tế đã làm (số phút ban đầu trừ đi số phút còn lại)
            let minutesAssigned = (currentMode === 'mock') ? 75 : parseInt(document.getElementById('timeInput').value);
            if(isNaN(minutesAssigned) || minutesAssigned < 1) minutesAssigned = 75;
            let timeTaken = Math.round(minutesAssigned - (testDuration / 60));
            
            // Truyền thêm timeTaken vào hàm
            window.luuDiemTOEICReadingFull(score, totalQuestions, "ETS 2026 - Test 5", timeTaken);
        }
    } else {
        // Đưa khối else này ra đúng vị trí của nó
        let toastMsg = document.createElement("div");
        toastMsg.innerText = "Đã khôi phục bài làm ngày cũ!";
        toastMsg.style.cssText = "position:fixed; top:20px; right:20px; background:var(--primary); color:white; padding:15px 20px; border-radius:12px; font-weight:bold; font-family:'Quicksand',sans-serif; z-index:99999; box-shadow:0 10px 30px rgba(0,0,0,0.2);";
        document.body.appendChild(toastMsg);
        setTimeout(() => toastMsg.remove(), 3000);
    }
}
        

function calculateToeicReading(raw, total) {
    if (raw === 0) return 5;
    let percent = raw / total;
    let score = Math.round((percent * 495) / 5) * 5; 
    return score > 495 ? 495 : (score < 5 ? 5 : score);
}

// --- HIGHLIGHT SYSTEM ---
const mainContainer = document.getElementById("mainContainer");
const menu = document.getElementById("ctxMenu");
let targetElement = null;
let selectedRange = null;

// Chuyển menu sang fixed để bám đúng con trỏ chuột dù đang cuộn ở cột nào
menu.style.position = "fixed";

mainContainer.addEventListener("contextmenu", (e) => {
    e.preventDefault();
    targetElement = null; selectedRange = null;
    
    // Nếu click chuột phải vào vùng đã highlight -> Hiện nút Xóa
    if (e.target.classList.contains("highlight")) {
        targetElement = e.target;
        showMenu(e.clientX, e.clientY, "remove");
        return;
    }
    
    // Nếu bôi đen văn bản mới -> Hiện nút Thêm
    let sel = window.getSelection();
    if (sel.toString().trim().length > 0 && mainContainer.contains(sel.anchorNode)) {
        selectedRange = sel.getRangeAt(0);
        showMenu(e.clientX, e.clientY, "add");
    } else {
        menu.style.display = "none";
    }
});

// Bấm chuột trái ra ngoài thì ẩn menu
document.addEventListener("click", (e) => { 
    if (menu && !menu.contains(e.target)) menu.style.display = "none"; 
});

function showMenu(x, y, mode) {
    menu.style.display = "block";
    let mw = menu.offsetWidth;
    let mh = menu.offsetHeight;
    
    // Chống tràn màn hình
    let left = x + mw > window.innerWidth ? window.innerWidth - mw - 10 : x;
    let top = y + mh > window.innerHeight ? window.innerHeight - mh - 10 : y;
    
    menu.style.left = left + "px";
    menu.style.top = top + "px";
    
    menu.children[0].style.display = (mode === "add") ? "block" : "none";
    menu.children[1].style.display = (mode === "remove") ? "block" : "none";
}

function doHighlight() {
    if (selectedRange) {
        try { 
            let span = document.createElement("span");
            span.className = "highlight";
            selectedRange.surroundContents(span); 
        } catch(e) {
            showCustomAlert("Lưu ý: Chỉ có thể bôi vàng các cụm từ nằm trong cùng một đoạn văn. Vui lòng không bôi đen vắt ngang qua các khoảng ngắt dòng nhé!");
        }
        window.getSelection().removeAllRanges();
    }
    menu.style.display = "none";
}

function removeHighlight() {
    if (targetElement) {
        let text = document.createTextNode(targetElement.textContent);
        targetElement.parentNode.replaceChild(text, targetElement);
        mainContainer.normalize(); // Nối lại văn bản liền mạch
    }
    menu.style.display = "none";
}

    // 1. HÀM ĐẨY LỊCH SỬ LÊN CLOUD
    window.syncHistoryToCloud = async function(historyData) {
        if (!window.currentUserUid) return;
        try {
            // Đặt tên document phân biệt theo Test và User
            let docId = window.currentUserUid + "_history_test5_2026";
            await setDoc(doc(db, "user_test_histories", docId), {
                savedHistory: historyData,
                lastUpdated: Date.now()
            }, { merge: true }); // Merge true để không đè mất các field khác nếu có
            
        } catch (error) {
            console.error("Lỗi đồng bộ lịch sử: ", error);
        }
    }

    // 2. LẮNG NGHE ĐĂNG NHẬP VÀ KÉO LỊCH SỬ VỀ
    onAuthStateChanged(auth, (user) => {
        if (user) {
            window.currentUserUid = user.uid;
            window.currentUserEmail = user.email;
            
            // Tự động nhận diện ID file hiện tại (2018 hay 2019)
            let is2026 = document.title.includes("2026");

            let docId = user.uid + docSuffix;
            const docRef = doc(db, "user_test_histories", docId);
            
            // SỬ DỤNG ONSNAPSHOT ĐỂ ĐỒNG BỘ REAL-TIME
            onSnapshot(docRef, (docSnap) => {
                if (docSnap.exists()) {
                    let cloudData = docSnap.data().savedHistory;
                    if (cloudData) {

                timeTaken: timeTaken,

            });

            console.error(e);
        }
    }
