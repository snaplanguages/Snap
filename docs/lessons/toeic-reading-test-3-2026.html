  "id": 122,
  "q": "The software uses computer memory efficiently, allowing users to open ------ five files simultaneously.",
  "options": ["far from", "as for", "up to", "out of"],
  "a": "up to",
  "exp": {
    "correct": "<div style='line-height: 1.6;'><p><strong>a. Phân tích thành phần câu:</strong> Câu ghép bao gồm mệnh đề chính và mệnh đề phân từ hiện tại (V-ing phrase) chỉ kết quả/khả năng:</p><ul><li><strong>S (Subject chính):</strong> <code>The software</code> (Phần mềm)</li><li><strong>V (Verb chính):</strong> <code>uses</code> (sử dụng)</li><li><strong>O (Object):</strong> <code>computer memory</code> (bộ nhớ máy tính)</li><li><strong>Adv (Adverb):</strong> <code>efficiently</code> (một cách hiệu quả)</li><li><strong>Mệnh đề V-ing bổ nghĩa (Participle Clause):</strong> <code>allowing users to open up to five files simultaneously</code> (cho phép người dùng mở tối đa 5 tệp tin cùng một lúc)</li></ul><p><strong>b. Xác định từ loại & Cấu trúc:</strong> Vị trí khoảng trống nằm ngay trước một con số cụ thể <code>five files</code> (5 tệp tin). Căn cứ theo cấu trúc chỉ giới hạn số lượng tối đa <code>Up to + Number</code>, khoảng trống đòi hỏi một Cụm giới từ chỉ giới hạn.</p><p><strong>c. Lý do chọn đáp án:</strong> Cụm giới từ <span style='color: #2e7d32; font-weight: bold;'>up to</span> mang nghĩa 'lên đến, tối đa là'. Khi đi ghép với số đếm <i>five files</i>, cụm từ thể hiện hoàn hảo năng lực kỹ thuật tối đa của phần mềm: sử dụng bộ nhớ hiệu quả nên có thể mở đồng thời tới 5 tệp.</p></div>",
    "wrong": "<ul style='line-height: 1.6; list-style-type: none; padding-left: 0;'><li><strong style='color: #c62828;'>❌ (A) far from:</strong> Cụm giới từ mang nghĩa 'xa khỏi' (về địa lý) hoặc 'hoàn toàn không' (khi đi với Adj/Noun). Không đứng trước số đếm để chỉ số lượng.</li><li><strong style='color: #c62828;'>❌ (B) as for:</strong> Cụm giới từ mang nghĩa 'về phần..., đối với...' (= regarding / speaking of). Thường đứng đầu câu để chuyển chủ đề, không thể đứng trước con số trong cấu trúc này.</li><li><strong style='color: #c62828;'>❌ (D) out of:</strong> Cụm giới từ mang nghĩa 'ra khỏi', 'hết' (out of stock) hoặc tỉ lệ 'trong số' (3 out of 5). Không mang ý nghĩa chỉ giới hạn năng lực tối đa của phần mềm.</li></ul>",
    "grammar": "<div style='line-height: 1.6;'><p><strong>⭐ Cấu trúc Chỉ Số lượng Tối đa / Giới hạn (Up to + Quantity) trong TOEIC</strong></p><p>Trong các văn bản giới thiệu sản phẩm, quảng cáo, và thông số kỹ thuật của TOEIC, cụm từ <i>up to</i> được dùng phổ biến để biểu thị hạn mức cao nhất có thể đạt được:</p><p style='padding-left: 15px; border-left: 3px solid #ccc;'><code>UP TO + Number + Noun (plural)</code> $\rightarrow$ Lên đến / Tối đa bao nhiêu...</p><table border='1' style='width: 100%; border-collapse: collapse; border-color: #e0e0e0; margin-top: 10px; font-size: 14px;'><thead style='background-color: #f5f5f5; text-align: left;'><tr><th style='padding: 8px;'>Cụm từ đi với Số lượng</th><th style='padding: 8px;'>Ý nghĩa ngữ pháp</th><th style='padding: 8px;'>Ví dụ Collocation trong TOEIC</th></tr></thead><tbody><tr><td style='padding: 8px; color: #2e7d32;'><strong>up to</strong></td><td style='padding: 8px; font-weight: bold; color: #2e7d32;'>tối đa, lên đến (giới hạn trên)</td><td style='padding: 8px;'><strong>up to 50% discount</strong> / <strong>up to 12 hours</strong></td></tr><tr><td style='padding: 8px;'>more than / over</td><td style='padding: 8px;'>nhiều hơn, vượt quá</td><td style='padding: 8px;'>more than 100 participants</td></tr><tr><td style='padding: 8px;'>approximately / about</td><td style='padding: 8px;'>xấp xỉ, khoảng chừng</td><td style='padding: 8px;'>approximately 20 minutes</td></tr><tr><td style='padding: 8px;'>at least</td><td style='padding: 8px;'>ít nhất (giới hạn dưới)</td><td style='padding: 8px;'>at least three business days</td></tr></tbody></table><p style='margin-top: 10px;'><strong style='color: #e65100;'>🎯 Mẹo làm bài trong 3 giây:</strong> Nhìn thấy khoảng trống đứng trước con số (<i>______ + number</i>) tả thông số sản phẩm hoặc ưu đãi $\rightarrow$ Hãy nghĩ ngay đến <strong>up to / more than / approximately</strong>!</p></div>",
    "vocab": "<ul style='line-height: 1.6;'><li><strong style='color: #0288d1;'>up to + number</strong> (prep.phr): lên đến, tối đa (Thường dùng trong thông số kỹ thuật, thời lượng pin, khuyến mãi).</li><li><strong style='color: #0288d1;'>simultaneously</strong> (adv): cùng một lúc, đồng thời (Từ đồng nghĩa: <i>at the same time, concurrently</i>).</li><li><strong style='color: #0288d1;'>allow somebody to do something</strong> (v.phr): cho phép ai làm gì (Cấu trúc phổ biến: <i>allow users to access, allow employees to work</i>).</li><li><strong style='color: #0288d1;'>efficiently</strong> (adv): một cách hiệu quả, tiết kiệm năng lượng/chi phí (Tính từ: <i>efficient</i>; Danh từ: <i>efficiency</i>).</li></ul>",
    "trans": "<div style='line-height: 1.6; padding: 8px; background-color: #f9f9f9; border-left: 4px solid #0288d1;'><p style='margin: 0 0 8px 0;'><strong>Dịch nghĩa gốc:</strong> Phần mềm sử dụng bộ nhớ máy tính một cách hiệu quả, cho phép người dùng mở lên đến 5 tệp tin cùng một lúc.</p><p style='margin: 0; font-style: italic; color: #555;'><strong>Dịch tự nhiên:</strong> Nhờ tối ưu hóa bộ nhớ máy tính hiệu quả, phần mềm này cho phép người dùng chạy đồng thời tối đa 5 tập tin cùng lúc.</p></div>"
  }
},
        {
  "id": 123,
  "q": "A monthly newsletter is an excellent way to ------ your group’s activities and events.",
  "options": ["realize", "propose", "observe", "promote"],
  "a": "promote",
  "exp": {
    "correct": "<div style='line-height: 1.6;'><p><strong>a. Phân tích thành phần câu:</strong> Câu đơn có cấu trúc bổ ngữ danh từ kết hợp với cụm động từ nguyên mẫu chỉ mục đích:</p><ul><li><strong>S (Subject):</strong> <code>A monthly newsletter</code> (Bản tin định kỳ hàng tháng)</li><li><strong>V (Verb liên kết):</strong> <code>is</code> (là)</li><li><strong>C (Complement):</strong> <code>an excellent way</code> (một cách / phương thức tuyệt vời)</li><li><strong>Cụm To-V bổ nghĩa cho Danh từ:</strong> <code>to promote your group's activities and events</code> (để quảng bá các hoạt động và sự kiện của nhóm bạn)</li></ul><p><strong>b. Xác định từ loại & Cấu trúc:</strong> Vị trí khoảng trống nằm ngay sau từ <i>to</i> trong cấu trúc <code>a way + TO + V-infinitive</code>. Tất cả 4 phương án đều là động từ nguyên mẫu, do đó đây là bài toán chọn từ vựng dựa trên logic ngữ cảnh truyền thông - doanh nghiệp.</p><p><strong>c. Lý do chọn đáp án:</strong> Động từ <span style='color: #2e7d32; font-weight: bold;'>promote</span> mang nghĩa 'quảng bá, giới thiệu, thúc đẩy'. Bản tin (newsletter) là công cụ truyền thông truyền tải thông tin, do đó việc phát hành bản tin nhằm <i>quảng bá các hoạt động và sự kiện</i> của tổ chức là hoàn toàn chính xác về ngữ nghĩa và văn phong doanh nghiệp.</p></div>",
    "wrong": "<ul style='line-height: 1.6; list-style-type: none; padding-left: 0;'><li><strong style='color: #c62828;'>❌ (A) realize:</strong> Động từ mang nghĩa 'nhận ra' hoặc 'hiện thực hóa' (realize a goal / a dream). Không kết hợp với <i>activities and events</i> trong ngữ cảnh sử dụng bản tin.</li><li><strong style='color: #c62828;'>❌ (B) propose:</strong> Động từ mang nghĩa 'đề xuất, kiến nghị' (propose a plan / solution). Bản tin dùng để công bố/quảng bá sự kiện đã có kế hoạch, không phải phương tiện để gửi đề xuất.</li><li><strong style='color: #c62828;'>❌ (C) observe:</strong> Động từ mang nghĩa 'quan sát, theo dõi' (observe behavior / regulations). Bản tin là công cụ truyền thông hướng ra bên ngoài, không phải công cụ để quan sát.</li></ul>",
    "grammar": "<div style='line-height: 1.6;'><p><strong>⭐ Cấu trúc Bổ nghĩa Danh từ (To-Infinitive as Noun Modifier) & Động từ Truyền thông trong TOEIC</strong></p><p>Trong tiếng Anh thương mại, cụm <code>A / An + Adj + WAY + TO + V-inf</code> được dùng rất phổ biến để nêu lên giải pháp hoặc mục đích của một phương tiện/công cụ:</p><p style='padding-left: 15px; border-left: 3px solid #ccc;'><code>A monthly newsletter + IS + AN EXCELLENT WAY + TO PROMOTE + Objects</code></p><table border='1' style='width: 100%; border-collapse: collapse; border-color: #e0e0e0; margin-top: 10px; font-size: 14px;'><thead style='background-color: #f5f5f5; text-align: left;'><tr><th style='padding: 8px;'>Công cụ truyền thông (S)</th><th style='padding: 8px;'>Động từ đi kèm chuẩn TOEIC (V)</th><th style='padding: 8px;'>Tân ngữ đi kèm (Object)</th></tr></thead><tbody><tr><td style='padding: 8px; color: #2e7d32;'><strong>newsletter / brochure / flyer</strong></td><td style='padding: 8px; font-weight: bold; color: #2e7d32;'>promote / publicize / announce</td><td style='padding: 8px;'>activities, events, products</td></tr><tr><td style='padding: 8px;'>website / portal</td><td style='padding: 8px;'>provide / display / feature</td><td style='padding: 8px;'>information, details, updates</td></tr><tr><td style='padding: 8px;'>advertisement / campaign</td><td style='padding: 8px;'>attract / target / engage</td><td style='padding: 8px;'>customers, audience, clients</td></tr></tbody></table><p style='margin-top: 10px;'><strong style='color: #e65100;'>🎯 Mẹo làm bài trong 3 giây:</strong> Khi gặp các từ chỉ công cụ quảng cáo/truyền thông (<i>newsletter, brochure, advertisement, social media page</i>) đi kèm khoảng trống động từ $\rightarrow$ Hãy ưu tiên ngay các động từ như <strong>promote, advertise, publicize, announce</strong>!</p></div>",
    "vocab": "<ul style='line-height: 1.6;'><li><strong style='color: #0288d1;'>promote</strong> (v): quảng bá, thúc đẩy (Collocations: <i>promote activities, promote products, promote services</i>) / thăng chức (<i>be promoted to manager</i>).</li><li><strong style='color: #0288d1;'>monthly newsletter</strong> (n.phr): bản tin hàng tháng (Các loại bản tin khác: <i>company newsletter, internal newsletter, electronic newsletter</i>).</li><li><strong style='color: #0288d1;'>an excellent way to do something</strong> (expr): một cách tuyệt vời để làm gì (Cấu trúc tương đương: <i>an effective method for doing something</i>).</li></ul>",
    "trans": "<div style='line-height: 1.6; padding: 8px; background-color: #f9f9f9; border-left: 4px solid #0288d1;'><p style='margin: 0 0 8px 0;'><strong>Dịch nghĩa gốc:</strong> Bản tin hàng tháng là một cách tuyệt vời để quảng bá các hoạt động và sự kiện của nhóm bạn.</p><p style='margin: 0; font-style: italic; color: #555;'><strong>Dịch tự nhiên:</strong> Phát hành bản tin định kỳ mỗi tháng chính là phương tiện hiệu quả giúp giới thiệu và thu hút sự chú ý cho các hoạt động cũng như sự kiện của nhóm.</p></div>"
  }
},
        {
  "id": 124,
  "q": "------ the hotel does not have a restaurant on site, there are many dining options nearby.",
  "options": ["While", "Such as", "Unless", "Without"],
  "a": "While",
  "exp": {
    "correct": "<div style='line-height: 1.6;'><p><strong>a. Phân tích thành phần câu:</strong> Câu phức bao gồm mệnh đề phụ thuộc (Dependent Clause) và mệnh đề chính (Main Clause) nối với nhau bằng liên từ chỉ sự tương phản:</p><ul><li><strong>Mệnh đề 1 (Dependent Clause):</strong> <code>the hotel does not have a restaurant on site</code> (Khách sạn không có nhà hàng trong khuôn viên)</li><li><strong>Mệnh đề 2 (Main Clause):</strong> <code>there are many dining options nearby</code> (có nhiều lựa chọn ăn uống ở gần đó)</li><li><strong>S1 (Subject 1):</strong> <code>the hotel</code> | <strong>V1 (Verb 1):</strong> <code>does not have</code> | <strong>O1:</strong> <code>a restaurant</code></li><li><strong>S2 (Subject 2 - Giả):</strong> <code>there</code> | <strong>V2 (Verb 2):</strong> <code>are</code> | <strong>Real S2:</strong> <code>many dining options</code></li></ul><p><strong>b. Xác định từ loại & Cấu trúc:</strong> Sau khoảng trống là một Mệnh đề hoàn chỉnh bao gồm Chủ ngữ (<i>the hotel</i>) và Động từ (<i>does not have</i>). Vị trí đứng đầu câu trước mệnh đề đòi hỏi một <strong>Liên từ phụ thuộc (Subordinating Conjunction)</strong>.</p><p><strong>c. Lý do chọn đáp án:</strong> Liên từ <span style='color: #2e7d32; font-weight: bold;'>While</span> đứng đầu câu mang nghĩa 'mặc dù / tuy rằng' thể hiện quan hệ Nhượng bộ / Tương phản giữa hai mệnh đề (mệnh đề 1 nêu nhược điểm: không có nhà hàng; mệnh đề 2 nêu ưu điểm bù đắp: có nhiều quán ăn xung quanh).</p></div>",
    "wrong": "<ul style='line-height: 1.6; list-style-type: none; padding-left: 0;'><li><strong style='color: #c62828;'>❌ (B) Such as:</strong> Cụm giới từ mang nghĩa 'chẳng hạn như' dùng để đưa ví dụ. Phía sau chỉ cộng với Danh từ hoặc Cụm danh từ, không thể đi với một Mệnh đề (S + V).</li><li><strong style='color: #c62828;'>❌ (C) Unless:</strong> Liên từ chỉ điều kiện mang nghĩa 'trừ khi' (= If not). Lắp vào câu tạo ra ngữ nghĩa vô lý: <i>'Trừ khi khách sạn không có nhà hàng, có nhiều lựa chọn ăn uống...'</i></li><li><strong style='color: #c62828;'>❌ (D) Without:</strong> Giới từ mang nghĩa 'không có / mà không'. Giới từ chỉ đi kèm Danh từ hoặc V-ing, không được đứng trước một mệnh đề có động từ chia thì (<i>does not have</i>).</li></ul>",
    "grammar": "<div style='line-height: 1.6;'><p><strong>⭐ Phân biệt Liên từ (Conjunction) và Giới từ (Preposition) Chỉ Sự Tương phản / Liệt kê trong TOEIC</strong></p><p>Một trong những cái bẫy ngữ pháp Part 5 kinh điển nhất là yêu cầu phân biệt giữa Liên từ (đi với Mệnh đề) và Giới từ (đi với Cụm danh từ/V-ing):</p><p style='padding-left: 15px; border-left: 3px solid #ccc;'><code>WHILE / ALTHOUGH / THOUGH + Subject + Verb , Subject + Verb</code><br><code>WHILE + the hotel (S) + does not have (V) ... , there are (S+V) ...</code></p><table border='1' style='width: 100%; border-collapse: collapse; border-color: #e0e0e0; margin-top: 10px; font-size: 14px;'><thead style='background-color: #f5f5f5; text-align: left;'><tr><th style='padding: 8px;'>Chức năng ngữ pháp</th><th style='padding: 8px;'>Từ vựng chuẩn TOEIC</th><th style='padding: 8px;'>Cấu trúc theo sau</th></tr></thead><tbody><tr><td style='padding: 8px; color: #2e7d32;'><strong>Liên từ Tương phản</strong></td><td style='padding: 8px; font-weight: bold; color: #2e7d32;'>while, although, even though, though</td><td style='padding: 8px; color: #2e7d32;'><strong>Mệnh đề (S + V)</strong></td></tr><tr><td style='padding: 8px;'>Giới từ Tương phản</td><td style='padding: 8px;'>despite, in spite of, regardless of</td><td style='padding: 8px;'>Danh từ / Noun Phrase / V-ing</td></tr><tr><td style='padding: 8px;'>Liên từ Điều kiện</td><td style='padding: 8px;'>unless, if, provided that</td><td style='padding: 8px;'>Mệnh đề (S + V)</td></tr><tr><td style='padding: 8px;'>Giới từ Liệt kê / Loại trừ</td><td style='padding: 8px;'>such as, without, except for</td><td style='padding: 8px;'>Danh từ / Noun Phrase / V-ing</td></tr></tbody></table><p style='margin-top: 10px;'><strong style='color: #e65100;'>🎯 Mẹo làm bài trong 3 giây:</strong> Nhìn ngay phía sau khoảng trống, nếu thấy có cấu trúc <code>S + V</code> $\rightarrow$ Loại ngay các giới từ như <i>Such as, Without, Despite</i>! Chỉ giữ lại Liên từ.</p></div>",
    "vocab": "<ul style='line-height: 1.6;'><li><strong style='color: #0288d1;'>while</strong> (conj): mặc dù, tuy rằng (Dùng như <i>although</i> trong văn phong lịch sự) / trong khi (chỉ hành động song song).</li><li><strong style='color: #0288d1;'>on site</strong> (adv/adj): tại chỗ, ngay trong khuôn viên (Collocations: <i>on-site parking, on-site fitness center, on-site restaurant</i>).</li><li><strong style='color: #0288d1;'>dining options</strong> (n.phr): các lựa chọn ăn uống, địa điểm nhà hàng (Các từ dịch vụ lưu trú khác: <i>amenities, accommodations, facilities</i>).</li></ul>",
    "trans": "<div style='line-height: 1.6; padding: 8px; background-color: #f9f9f9; border-left: 4px solid #0288d1;'><p style='margin: 0 0 8px 0;'><strong>Dịch nghĩa gốc:</strong> Mặc dù khách sạn không có nhà hàng tại chỗ, có rất nhiều lựa chọn ăn uống ở gần đó.</p><p style='margin: 0; font-style: italic; color: #555;'><strong>Dịch tự nhiên:</strong> Tuy khách sạn không tích hợp nhà hàng trong khuôn viên, thực khách vẫn có thể dễ dàng tìm thấy nhiều địa điểm ăn uống đa dạng ngay khu vực xung quanh.</p></div>"
  }
},
       {
  "id": 125,
  "q": "------ a slight decline in revenue from the previous quarter, Blakely Components is moving forward with its expansion plan.",
  "options": ["Aside", "Despite", "Becoming", "Often"],
  "a": "Despite",
  "exp": {
    "correct": "<div style='line-height: 1.6;'><p><strong>a. Phân tích thành phần câu:</strong> Câu phức chứa cụm giới từ chỉ sự nhượng bộ đứng trước mệnh đề chính:</p><ul><li><strong>Cụm Giới từ nhượng bộ:</strong> <code>Despite a slight decline in revenue from the previous quarter</code> (Mặc dù có sự sụt giảm nhẹ về doanh thu so với quý trước)</li><li><strong>S (Subject chính):</strong> <code>Blakely Components</code> (Tên công ty)</li><li><strong>V (Verb chính - Thì Hiện tại tiếp diễn):</strong> <code>is moving forward</code> (vẫn đang tiếp tục triển khai)</li><li><strong>Cụm giới từ chỉ mục đích:</strong> <code>with its expansion plan</code> (kế hoạch mở rộng của mình)</li></ul><p><strong>b. Xác định từ loại & Cấu trúc:</strong> Phía sau khoảng trống là cụm danh từ <i>a slight decline in revenue...</i> (chứa danh từ trung tâm là <i>decline</i>), không có động từ chia thì. Do đó vị trí đứng đầu câu yêu cầu một <strong>Giới từ (Preposition)</strong> chỉ sự nhượng bộ đi với Cụm danh từ.</p><p><strong>c. Lý do chọn đáp án:</strong> Giới từ <span style='color: #2e7d32; font-weight: bold;'>Despite</span> mang nghĩa 'mặc dù / bất chấp'. Cấu trúc <code>Despite + Noun Phrase</code> diễn tả sự tương phản hoàn hảo giữa vế nguyên nhân tiêu cực (doanh thu giảm) và vế kết quả tích cực (vẫn tiếp tục kế hoạch mở rộng).</p></div>",
    "wrong": "<ul style='line-height: 1.6; list-style-type: none; padding-left: 0;'><li><strong style='color: #c62828;'>❌ (A) Aside:</strong> Trạng từ mang nghĩa 'sang một bên'. Nếu muốn dùng với nghĩa 'ngoại trừ', bắt buộc phải có giới từ <i>from</i> đi kèm tạo thành <i>Aside from</i>.</li><li><strong style='color: #c62828;'>❌ (C) Becoming:</strong> Dạng V-ing của động từ <i>become</i> (trở thành). Không hợp lý về mặt cấu trúc lẫn ngữ nghĩa khi đứng đầu câu tạo thành dạng rút gọn chủ ngữ.</li><li><strong style='color: #c62828;'>❌ (D) Often:</strong> Trạng từ tần suất mang nghĩa 'thường xuyên'. Trạng từ không thể đứng trực tiếp trước một Cụm danh từ để nối thành phần câu.</li></ul>",
    "grammar": "<div style='line-height: 1.6;'><p><strong>⭐ Phân biệt Cấu trúc Nhượng bộ: DESPITE vs. ALTHOUGH trong TOEIC</strong></p><p>Đây là dạng bài ngữ pháp xuất hiện liên tục trong Part 5 TOEIC. Thí sinh chỉ cần xác định thành phần theo sau khoảng trống là Cụm danh từ hay Mệnh đề để chọn đáp án chuẩn xác:</p><p style='padding-left: 15px; border-left: 3px solid #ccc;'><code>DESPITE / IN SPITE OF + Noun / Noun Phrase / V-ing , Subject + Verb</code><br><code>DESPITE + a slight decline in revenue (Noun Phrase) , Blakely Components (S) + is moving... (V)</code></p><table border='1' style='width: 100%; border-collapse: collapse; border-color: #e0e0e0; margin-top: 10px; font-size: 14px;'><thead style='background-color: #f5f5f5; text-align: left;'><tr><th style='padding: 8px;'>Từ loại</th><th style='padding: 8px;'>Từ vựng Nhượng bộ</th><th style='padding: 8px;'>Thành phần theo sau</th><th style='padding: 8px;'>Ví dụ ngữ cảnh TOEIC</th></tr></thead><tbody><tr><td style='padding: 8px; color: #2e7d32;'><strong>Giới từ (Preposition)</strong></td><td style='padding: 8px; font-weight: bold; color: #2e7d32;'>despite, in spite of</td><td style='padding: 8px; color: #2e7d32;'><strong>Cụm Danh từ (Noun Phrase) / V-ing</strong></td><td style='padding: 8px;'><strong>despite</strong> the bad weather</td></tr><tr><td style='padding: 8px;'>Liên từ (Conjunction)</td><td style='padding: 8px;'>although, even though, though</td><td style='padding: 8px;'>Mệnh đề hoàn chỉnh (S + V)</td><td style='padding: 8px;'><strong>although</strong> the weather was bad</td></tr></tbody></table><p style='margin-top: 10px;'><strong style='color: #e65100;'>🎯 Mẹo làm bài trong 3 giây:</strong> Nhìn ngay phía sau khoảng trống, nếu KHÔNG CÓ động từ chia thì (chỉ là Noun Phrase) $\rightarrow$ Chọn ngay <strong>Despite</strong> hoặc <strong>In spite of</strong>! Loại ngay <i>Although / Though</i>.</p></div>",
    "vocab": "<ul style='line-height: 1.6;'><li><strong style='color: #0288d1;'>despite</strong> (prep): mặc dù, bất chấp (= in spite of).</li><li><strong style='color: #0288d1;'>decline in something</strong> (n.phr): sự sụt giảm về cái gì (Collocations: <i>a decline in sales, a decline in demand, a decline in profits</i>).</li><li><strong style='color: #0288d1;'>move forward with</strong> (v.phr): tiến lên, tiếp tục triển khai/xúc tiến (Collocations: <i>move forward with a project, move forward with a plan</i>).</li><li><strong style='color: #0288d1;'>expansion plan</strong> (n.phr): kế hoạch mở rộng (Thuật ngữ kinh doanh: <i>business expansion, market expansion</i>).</li></ul>",
    "trans": "<div style='line-height: 1.6; padding: 8px; background-color: #f9f9f9; border-left: 4px solid #0288d1;'><p style='margin: 0 0 8px 0;'><strong>Dịch nghĩa gốc:</strong> Mặc dù có sự sụt giảm nhẹ về doanh thu so với quý trước, Blakely Components vẫn đang tiến tới với kế hoạch mở rộng của mình.</p><p style='margin: 0; font-style: italic; color: #555;'><strong>Dịch tự nhiên:</strong> Bất chấp việc doanh thu giảm nhẹ so với quý vừa qua, công ty Blakely Components vẫn tiếp tục xúc tiến kế hoạch mở rộng quy mô kinh doanh.</p></div>"
  }
},
        {
  "id": 126,
  "q": "Abelia Dairy Company has undergone several changes in leadership ------ the past ten years.",
  "options": ["over", "into", "since", "beside"],
  "a": "over",
  "exp": {
    "correct": "<div style='line-height: 1.6;'><p><strong>a. Phân tích thành phần câu:</strong> Câu đơn hoàn chỉnh kết hợp với cụm trạng ngữ chỉ thời gian kéo dài đến hiện tại:</p><ul><li><strong>S (Subject):</strong> <code>Abelia Dairy Company</code> (Công ty Sữa Abelia)</li><li><strong>V (Verb - Thì Hiện tại hoàn thành):</strong> <code>has undergone</code> (đã trải qua)</li><li><strong>O (Object):</strong> <code>several changes in leadership</code> (một số thay đổi trong ban lãnh đạo)</li><li><strong>Cụm Trạng ngữ chỉ thời gian:</strong> <code>over the past ten years</code> (trong suốt mười năm qua)</li></ul><p><strong>b. Xác định từ loại & Cấu trúc:</strong> Phía sau khoảng trống là cụm <i>the past ten years</i> (10 năm qua - biểu thị một 'khoảng thời gian' kéo dài). Động từ chính được chia ở thì Hiện tại hoàn thành (<i>has undergone</i>), đòi hỏi một <strong>Giới từ chỉ thời gian</strong> có khả năng đi kèm với khoảng thời gian trong thì Hiện tại hoàn thành.</p><p><strong>c. Lý do chọn đáp án:</strong> Giới từ <span style='color: #2e7d32; font-weight: bold;'>over</span> khi đi cùng với <i>the past / the last + khoảng thời gian</i> mang nghĩa 'trong suốt / trong vòng... qua'. Cụm <code>over the past ten years</code> diễn tả chính xác một quãng thời gian liên tục từ quá khứ đến hiện tại mà các sự thay đổi lãnh đạo diễn ra.</p></div>",
    "wrong": "<ul style='line-height: 1.6; list-style-type: none; padding-left: 0;'><li><strong style='color: #c62828;'>❌ (B) into:</strong> Giới từ chỉ phương hướng hoặc sự chuyển đổi ('vào trong', 'thành ra'). Không được dùng để diễn tả khoảng thời gian kéo dài.</li><li><strong style='color: #c62828;'>❌ (C) since:</strong> Bẫy kinh điển! Giới từ <i>since</i> (kể từ khi) bắt buộc phải đi kèm với <strong>Mốc thời gian</strong> (e.g., <i>since 2015, since Monday</i>), không được đi với <i>Khoảng thời gian</i> như <i>ten years</i>.</li><li><strong style='color: #c62828;'>❌ (D) beside:</strong> Giới từ chỉ vị trí không gian ('bên cạnh' = <i>next to</i>). Không dùng cho ngữ cảnh thời gian.</li></ul>",
    "grammar": "<div style='line-height: 1.6;'><p><strong>⭐ Phân biệt Giới từ Thời gian dùng trong thì Hiện tại Hoàn thành (SINCE vs. OVER / FOR / DURING)</strong></p><p>Một bẫy cực kỳ phổ biến trong TOEIC là thí sinh thấy động từ chia Hiện tại hoàn thành (<i>has/have + V3/ed</i>) liền vội vã chọn <i>Since</i> mà bỏ qua thành phần đứng sau:</p><p style='padding-left: 15px; border-left: 3px solid #ccc;'><code>OVER / FOR / IN / DURING + THE PAST / LAST + KHOẢNG THỜI GIAN</code> $\rightarrow$ Trong suốt... qua<br><code>SINCE + MỐC THỜI GIAN (YEAR / DATE / CLAUSE)</code> $\rightarrow$ Kể từ khi...</p><table border='1' style='width: 100%; border-collapse: collapse; border-color: #e0e0e0; margin-top: 10px; font-size: 14px;'><thead style='background-color: #f5f5f5; text-align: left;'><tr><th style='padding: 8px;'>Cấu trúc giới từ</th><th style='padding: 8px;'>Thành phần theo sau</th><th style='padding: 8px;'>Ví dụ chuẩn TOEIC</th></tr></thead><tbody><tr><td style='padding: 8px; color: #2e7d32;'><strong>over / for / in / during</strong></td><td style='padding: 8px; font-weight: bold; color: #2e7d32;'>the past / last + Khoảng thời gian</td><td style='padding: 8px;'><strong>over</strong> the past decade / <strong>for</strong> the last 5 years</td></tr><tr><td style='padding: 8px; color: #c62828;'><strong>since</strong></td><td style='padding: 8px; font-weight: bold; color: #c62828;'>Mốc thời gian cụ thể / Mệnh đề quá khứ</td><td style='padding: 8px;'><strong>since</strong> 2014 / <strong>since</strong> Mr. Smith left</td></tr></tbody></table><p style='margin-top: 10px;'><strong style='color: #e65100;'>🎯 Mẹo làm bài trong 3 giây:</strong> Thấy phía sau có <code>the past / the last + con số + thời gian</code> (days, months, years) $\rightarrow$ Ưu tiên chọn ngay <strong>over / for / in / during</strong>! Cạch mặt <i>since</i> ra nhé.</p></div>",
    "vocab": "<ul style='line-height: 1.6;'><li><strong style='color: #0288d1;'>undergo</strong> (v): trải qua, chịu đựng (Quá khứ: <i>underwent</i> - QKHT: <i>undergone</i>; Collocations: <i>undergo changes, undergo renovations, undergo inspection, undergo training</i>).</li><li><strong style='color: #0288d1;'>leadership</strong> (n): ban lãnh đạo, bộ máy lãnh đạo / khả năng lãnh đạo (Collocations: <i>changes in leadership, leadership team, leadership style</i>).</li><li><strong style='color: #0288d1;'>over the past + period of time</strong> (prep.phr): trong suốt... vừa qua (Cụm từ báo cáo kinh doanh cực kỳ phổ biến).</li></ul>",
    "trans": "<div style='line-height: 1.6; padding: 8px; background-color: #f9f9f9; border-left: 4px solid #0288d1;'><p style='margin: 0 0 8px 0;'><strong>Dịch nghĩa gốc:</strong> Công ty Sữa Abelia đã trải qua một số thay đổi trong ban lãnh đạo trong suốt mười năm qua.</p><p style='margin: 0; font-style: italic; color: #555;'><strong>Dịch tự nhiên:</strong> Trong vòng 10 năm trở lại đây, Công ty Sữa Abelia đã chứng kiến nhiều đợt cải tổ và thay đổi đối với bộ máy lãnh đạo cấp cao.</p></div>"
  }
},
       {
  "id": 127,
  "q": "Opal City’s Community Theater is holding ------ for its spring production during the first week of December.",
  "options": ["to audition", "auditioned", "auditions", "audition"],
  "a": "auditions",
  "exp": {
    "correct": "<div style='line-height: 1.6;'><p><strong>a. Phân tích thành phần câu:</strong> Câu đơn hoàn chỉnh với động từ ngoại (transitive verb) đòi hỏi một tân ngữ danh từ:</p><ul><li><strong>S (Subject):</strong> <code>Opal City's Community Theater</code> (Nhà hát Cộng đồng Thành phố Opal)</li><li><strong>V (Verb - Thì Hiện tại tiếp diễn):</strong> <code>is holding</code> (đang tổ chức)</li><li><strong>O (Object):</strong> <code>auditions</code> (các buổi thử vai)</li><li><strong>Cụm Giới từ bổ nghĩa:</strong> <code>for its spring production</code> (cho vở diễn mùa xuân)</li><li><strong>Cụm Trạng ngữ chỉ thời gian:</strong> <code>during the first week of December</code> (trong tuần đầu tiên của tháng 12)</li></ul><p><strong>b. Xác định từ loại & Cấu trúc:</strong> Động từ <i>is holding</i> (tổ chức) là ngoại động từ, bắt buộc theo sau phải là một <strong>Danh từ (Noun)</strong> đóng vai trò làm tân ngữ. Loại ngay hai dạng động từ <i>to audition</i> và <i>auditioned</i>.</p><p><strong>c. Lý do chọn đáp án:</strong> Giữa hai dạng danh từ <i>audition</i> (số ít) và <i>auditions</i> (số nhiều), danh từ đếm được <i>audition</i> nếu ở dạng số ít bắt buộc phải có mạo từ (<i>an audition</i>) đứng trước. Do trước khoảng trống không có mạo từ (<i>a/an/the</i>), danh từ bắt buộc phải ở dạng số nhiều <span style='color: #2e7d32; font-weight: bold;'>auditions</span>.</p></div>",
    "wrong": "<ul style='line-height: 1.6; list-style-type: none; padding-left: 0;'><li><strong style='color: #c62828;'>❌ (A) to audition:</strong> Động từ nguyên mẫu có 'to' (To-V). Không thể làm tân ngữ trực tiếp đứng ngay sau động từ <i>hold</i> (không có cấu trúc <i>hold to do something</i>).</li><li><strong style='color: #c62828;'>❌ (B) auditioned:</strong> Động từ dạng V-ed / Quá khứ phân từ. Đã có động từ chính chia thì <i>is holding</i>, không thể đứng sau làm tân ngữ.</li><li><strong style='color: #c62828;'>❌ (D) audition:</strong> Bẫy kinh điển! <i>Audition</i> là danh từ đếm được. Trong tiếng Anh, danh từ đếm được số ít KHÔNG BAO GIỜ đứng trơ trọi một mình mà không có mạo từ (<i>an audition</i>) hoặc từ chỉ định (<i>this/my audition</i>).</li></ul>",
    "grammar": "<div style='line-height: 1.6;'><p><strong>⭐ Quy tắc Vàng về Danh từ Đếm được Số ít và Số nhiều trong TOEIC</strong></p><p>Một trong những bẫy từ loại tinh vi nhất của TOEIC Part 5 là đưa ra cả dạng Số ít và Số nhiều của cùng một danh từ:</p><p style='padding-left: 15px; border-left: 3px solid #ccc;'><code>Transitive Verb + Plural Noun (Số nhiều)</code> $\rightarrow$ KHÔNG cần mạo từ<br><code>Transitive Verb + A/An/The + Singular Noun (Số ít)</code> $\rightarrow$ BẮT BUỘC có mạo từ</p><table border='1' style='width: 100%; border-collapse: collapse; border-color: #e0e0e0; margin-top: 10px; font-size: 14px;'><thead style='background-color: #f5f5f5; text-align: left;'><tr><th style='padding: 8px;'>Động từ Collocation (Hold / Conduct)</th><th style='padding: 8px;'>Dạng đúng với Danh từ Số nhiều</th><th style='padding: 8px;'>Dạng đúng với Danh từ Số ít</th><th style='padding: 8px;'>Dạng SAI phổ biến (Bẫy)</th></tr></thead><tbody><tr><td style='padding: 8px; color: #2e7d32;'><strong>hold</strong> (tổ chức)</td><td style='padding: 8px; font-weight: bold; color: #2e7d32;'>hold <u>auditions</u> / meetings</td><td style='padding: 8px;'>hold <u>an audition</u> / <u>a meeting</u></td><td style='padding: 8px; color: #c62828;'>hold audition ❌</td></tr><tr><td style='padding: 8px;'>conduct (tiến hành)</td><td style='padding: 8px;'>conduct <u>interviews</u> / surveys</td><td style='padding: 8px;'>conduct <u>an interview</u> / <u>a survey</u></td><td style='padding: 8px; color: #c62828;'>conduct interview ❌</td></tr><tr><td style='padding: 8px;'>organize (sắp xếp)</td><td style='padding: 8px;'>organize <u>events</u> / workshops</td><td style='padding: 8px;'>organize <u>an event</u> / <u>a workshop</u></td><td style='padding: 8px; color: #c62828;'>organize event ❌</td></tr></tbody></table><p style='margin-top: 10px;'><strong style='color: #e65100;'>🎯 Mẹo làm bài trong 3 giây:</strong> Sau động từ nếu cần chọn danh từ đếm được mà phía trước KHÔNG CÓ <i>a/an/the/my/this</i> $\rightarrow$ Chọn ngay <strong>Danh từ Số nhiều (-s/-es)</strong>!</p></div>",
    "vocab": "<ul style='line-height: 1.6;'><li><strong style='color: #0288d1;'>hold auditions</strong> (v.phr): tổ chức các buổi thử vai / thử giọng (Collocations liên quan: <i>attend an audition, pass an audition, audition for a role</i>).</li><li><strong style='color: #0288d1;'>spring production</strong> (n.phr): vở diễn / tác phẩm nghệ thuật mùa xuân (Trong TOEIC, <i>production</i> vừa có nghĩa là 'sản xuất', vừa có nghĩa là 'vở kịch/tác phẩm sân khấu').</li><li><strong style='color: #0288d1;'>community theater</strong> (n.phr): nhà hát cộng đồng.</li></ul>",
    "trans": "<div style='line-height: 1.6; padding: 8px; background-color: #f9f9f9; border-left: 4px solid #0288d1;'><p style='margin: 0 0 8px 0;'><strong>Dịch nghĩa gốc:</strong> Nhà hát Cộng đồng Thành phố Opal đang tổ chức các buổi thử vai cho vở diễn mùa xuân của mình trong tuần đầu tiên của tháng Mười Hai.</p><p style='margin: 0; font-style: italic; color: #555;'><strong>Dịch tự nhiên:</strong> Trong tuần đầu tháng 12, Nhà hát Cộng đồng Thành phố Opal sẽ tiến hành các buổi tuyển chọn diễn viên cho chương trình biểu diễn sân khấu mùa xuân.</p></div>"
  }
},
        {
  "id": 128,
  "q": "Mr. Kane said he packed so ------ this morning that he forgot to bring a suit and tie for tomorrow’s dinner.",
  "options": ["enormously", "briefly", "hastily", "mysteriously"],
  "a": "hastily",
  "exp": {
    "correct": "<div style='line-height: 1.6;'><p><strong>a. Phân tích thành phần câu:</strong> Câu tường thuật phức chứa cấu trúc nguyên nhân - kết quả <code>so... that...</code>:</p><ul><li><strong>Mệnh đề chính:</strong> <code>Mr. Kane said (that) ...</code> (Ông Kane nói rằng ...)</li><li><strong>S (Subject mệnh đề phụ):</strong> <code>he</code> (ông ấy)</li><li><strong>V (Verb):</strong> <code>packed</code> (đã đóng gói/sửa soạn hành lý)</li><li><strong>Adv (Adverb bổ nghĩa cho V):</strong> <code>so hastily</code> (quá vội vã)</li><li><strong>Mệnh đề kết quả chỉ hậu quả (that-clause):</strong> <code>that he forgot to bring a suit and tie for tomorrow's dinner</code> (đến nỗi ông ấy quên mang theo áo vest và cà vạt...)</li></ul><p><strong>b. Xác định từ loại & Cấu trúc:</strong> Vị trí khoảng trống nằm trong cấu trúc <code>so + Adv + that + Clause</code> dùng để bổ nghĩa cho động từ thường <i>packed</i>. Cả 4 phương án đều là trạng từ (-ly), đòi hỏi tư duy phân tích mối quan hệ logic Cause - Effect (Nguyên nhân - Kết quả).</p><p><strong>c. Lý do chọn đáp án:</strong> Trạng từ <span style='color: #2e7d32; font-weight: bold;'>hastily</span> mang nghĩa 'một cách vội vã, hấp tấp, gấp gáp'. Việc sắp xếp hành lý quá <i>vội vã</i> (hastily) giải thích hoàn toàn hợp lý cho hậu quả tiêu cực ở vế sau là 'quên mang theo bộ com-lê và cà vạt' cho bữa tối.</p></div>",
    "wrong": "<ul style='line-height: 1.6; list-style-type: none; padding-left: 0;'><li><strong style='color: #c62828;'>❌ (A) enormously:</strong> Trạng từ mang nghĩa 'vô cùng, cực kỳ, to lớn' (chỉ mức độ/quy mô như <i>enormously popular</i>). Không đi kèm động từ <i>pack</i> để miêu tả cách thức đóng đồ.</li><li><strong style='color: #c62828;'>❌ (B) briefly:</strong> Trạng từ mang nghĩa 'ngắn gọn, trong thời gian ngắn' (dùng cho phát biểu/cuộc họp như <i>speak briefly</i>). Không kết hợp tự nhiên với <i>pack</i> và không diễn tả nguyên nhân dẫn đến việc quên đồ.</li><li><strong style='color: #c62828;'>❌ (D) mysteriously:</strong> Trạng từ mang nghĩa 'một cách bí ẩn, kỳ lạ'. Hoàn toàn không phù hợp ngữ cảnh chuẩn bị hành lý cá nhân.</li></ul>",
    "grammar": "<div style='line-height: 1.6;'><p><strong>⭐ Mối quan hệ Nguyên nhân - Kết quả với Cấu trúc <code>SO... THAT...</code> trong TOEIC</strong></p><p>Trong dạng bài chọn trạng từ chỉ cách thức (Adverb of Manner) đi cùng cấu trúc kết quả, mệnh đề đằng sau từ <i>that</i> chính là chìa khóa logic để tìm ra đáp án:</p><p style='padding-left: 15px; border-left: 3px solid #ccc;'><code>Subject + Action Verb + SO + Adverb + THAT + Result Clause</code><br><code>he + packed (V) + SO + HASTILY (Adv) + THAT + he forgot a suit (Result)</code></p><table border='1' style='width: 100%; border-collapse: collapse; border-color: #e0e0e0; margin-top: 10px; font-size: 14px;'><thead style='background-color: #f5f5f5; text-align: left;'><tr><th style='padding: 8px;'>Hành động (Verb)</th><th style='padding: 8px;'>Trạng từ phù hợp (SO + Adv)</th><th style='padding: 8px;'>Hậu quả logic sau THAT</th></tr></thead><tbody><tr><td style='padding: 8px; color: #2e7d32;'><strong>packed / prepared</strong></td><td style='padding: 8px; font-weight: bold; color: #2e7d32;'>so hastily / hurriedly</td><td style='padding: 8px;'>forgot important items / made mistakes</td></tr><tr><td style='padding: 8px;'>explained / presented</td><td style='padding: 8px;'>so clearly / thoroughly</td><td style='padding: 8px;'>everyone understood completely</td></tr><tr><td style='padding: 8px;'>drove / handled</td><td style='padding: 8px;'>so carelessly</td><td style='padding: 8px;'>caused an unexpected accident</td></tr></tbody></table><p style='margin-top: 10px;'><strong style='color: #e65100;'>🎯 Mẹo làm bài trong 3 giây:</strong> Khi gặp dạng câu <code>so + ______ + that</code> có hậu quả tiêu cực như <i>forgot, failed, missed, made a mistake</i> $\rightarrow$ Đọc ngay mệnh đề đằng sau để chọn các trạng từ chỉ sự vội vã/cẩu thả như <strong>hastily, hurriedly, carelessly</strong>!</p></div>",
    "vocab": "<ul style='line-height: 1.6;'><li><strong style='color: #0288d1;'>hastily</strong> (adv): vội vã, hấp tấp (Từ đồng nghĩa: <i>hurriedly, in a rush</i>; Động từ: <i>hasten</i>; Tính từ: <i>hasty</i>).</li><li><strong style='color: #0288d1;'>pack</strong> (v): đóng gói hành lý, sửa soạn vali (Collocations: <i>pack a suitcase, pack belongings</i>).</li><li><strong style='color: #0288d1;'>suit and tie</strong> (n.phr): bộ com-lê và cà vạt (Trang phục chính thức - <i>formal business attire</i>).</li><li><strong style='color: #0288d1;'>forget to do something</strong> (v.phr): quên làm việc gì đó (Khác với <i>forget doing something</i>: quên đã làm gì).</li></ul>",
    "trans": "<div style='line-height: 1.6; padding: 8px; background-color: #f9f9f9; border-left: 4px solid #0288d1;'><p style='margin: 0 0 8px 0;'><strong>Dịch nghĩa gốc:</strong> Ông Kane cho biết ông ấy đã đóng gói hành lý quá vội vã vào sáng nay đến nỗi ông quên mang theo bộ com-lê và cà vạt cho bữa tối ngày mai.</p><p style='margin: 0; font-style: italic; color: #555;'><strong>Dịch tự nhiên:</strong> Ông Kane chia sẻ rằng do sáng nay sửa soạn vali quá gấp gáp nên ông đã bỏ quên bộ vest cùng cà vạt dành cho tiệc tối ngày mai.</p></div>"
  }
},
       {
  "id": 129,
  "q": "Long before the training program began, Ms. Morris ------ the schedule to allow her team to attend.",
  "options": ["was revised", "is revising", "had revised", "has to revise"],
  "a": "had revised",
  "exp": {

    "wrong": "<ul style='line-height: 1.6; list-style-type: none; padding-left: 0;'><li><strong style='color: #c62828;'>❌ (A) was revised:</strong> Thể bị động thì Quá khứ đơn. Bị sai thể vì chủ ngữ <i>Ms. Morris</i> là người chủ động điều chỉnh lịch trình (có tân ngữ <i>the schedule</i> ngay sau).</li><li><strong style='color: #c62828;'>❌ (B) is revising:</strong> Thì Hiện tại tiếp diễn. Sai hoàn toàn về phối thì vì toàn bộ ngữ cảnh sự việc đã diễn ra trong quá khứ (<i>began</i>).</li><li><strong style='color: #c62828;'>❌ (D) has to revise:</strong> Động từ khuyết thiếu ở thì Hiện tại đơn ('phải sửa đổi'). Sai phối thì và sai ý nghĩa logic của câu.</li></ul>",
    "grammar": "<div style='line-height: 1.6;'><p><strong>⭐ Sự phối hợp thì giữa Quá khứ đơn (Past Simple) và Quá khứ hoàn thành (Past Perfect)</strong></p><p>Thì Quá khứ hoàn thành dùng để diễn tả một hành động xảy ra và kết thúc <strong>TRƯỚC</strong> một hành động khác trong quá khứ:</p><p style='padding-left: 15px; border-left: 3px solid #ccc;'><code>[Hành động 1 - Xảy ra trước]</code> $\rightarrow$ <strong>Quá khứ Hoàn thành (S + had + V3/ed)</strong><br><code>[Hành động 2 - Xảy ra sau]</code> $\rightarrow$ <strong>Quá khứ Đơn (S + V2/ed)</strong></p><table border='1' style='width: 100%; border-collapse: collapse; border-color: #e0e0e0; margin-top: 10px; font-size: 14px;'><thead style='background-color: #f5f5f5; text-align: left;'><tr><th style='padding: 8px;'>Liên từ / Tín hiệu thời gian</th><th style='padding: 8px;'>Cấu trúc phối thì chuẩn TOEIC</th><th style='padding: 8px;'>Ví dụ thực tế</th></tr></thead><tbody><tr><td style='padding: 8px; color: #2e7d32;'><strong>long before / before</strong></td><td style='padding: 8px;'><strong>Had + V3/ed</strong> ... long before + <strong>V2/ed</strong></td><td style='padding: 8px;'>She <strong>had left</strong> long before I <strong>arrived</strong>.</td></tr><tr><td style='padding: 8px; color: #2e7d32;'><strong>by the time</strong></td><td style='padding: 8px;'>By the time + <strong>V2/ed</strong>, <strong>S + had + V3/ed</strong></td><td style='padding: 8px;'>By the time the meeting <strong>started</strong>, he <strong>had prepared</strong> all files.</td></tr></tbody></table><p style='margin-top: 10px;'><strong style='color: #e65100;'>🎯 Mẹo làm bài trong 3 giây:</strong> Khi thấy mệnh đề chứa các từ như <i>before, long before, by the time</i> đi kèm động từ chia Quá khứ đơn (<i>began, arrived, left...</i>) $\rightarrow$ Ưu tiên chọn ngay dạng <strong>had + V3/ed</strong> cho mệnh đề còn lại!</p></div>",
    "vocab": "<ul style='line-height: 1.6;'><li><strong style='color: #0288d1;'>revise</strong> (v): sửa đổi, điều chỉnh, duyệt lại (Từ đồng nghĩa: <i>amend, modify, adjust, update</i>; Collocations: <i>revise a schedule, revise a proposal, revise a contract</i>).</li><li><strong style='color: #0288d1;'>allow somebody to do something</strong> (v.phr): cho phép / tạo điều kiện cho ai làm gì.</li><li><strong style='color: #0288d1;'>long before</strong> (conj/adv): từ rất lâu trước khi (Dấu hiệu nhận biết đặc trưng của thì Quá khứ hoàn thành).</li></ul>",
    "trans": "<div style='line-height: 1.6; padding: 8px; background-color: #f9f9f9; border-left: 4px solid #0288d1;'><p style='margin: 0 0 8px 0;'><strong>Dịch nghĩa gốc:</strong> Từ rất lâu trước khi chương trình đào tạo bắt đầu, bà Morris đã sửa đổi lịch trình để cho phép nhóm của bà có thể tham dự.</p><p style='margin: 0; font-style: italic; color: #555;'><strong>Dịch tự nhiên:</strong> Bà Morris đã chủ động điều chỉnh lịch làm việc từ trước đó rất lâu nhằm tạo điều kiện cho các thành viên trong nhóm tham gia chương trình tập huấn.</p></div>"

    "grammar": "<div style='line-height: 1.6;'><p><strong>⭐ Quy tắc Phối thì trong Mệnh đề Trạng ngữ chỉ Thời gian (Adverbial Clause of Time)</strong></p><p>Trong tiếng Anh công sở và đề thi TOEIC, đối với các mệnh đề trạng ngữ chỉ thời gian hướng tới tương lai (bắt đầu bằng <i>when, once, as soon as, after, before, until</i>), tuyệt đối <strong>KHÔNG</strong> dùng thì Tương lai (<i>will</i>) ở mệnh đề chỉ thời gian:</p><p style='padding-left: 15px; border-left: 3px solid #ccc;'><code>Main Clause (Tương lai đơn: S + will + V-bare) + ONCE / WHEN / AS SOON AS + Time Clause (Hiện tại đơn / Hiện tại hoàn thành)</code></p><table border='1' style='width: 100%; border-collapse: collapse; border-color: #e0e0e0; margin-top: 10px; font-size: 14px;'><thead style='background-color: #f5f5f5; text-align: left;'><tr><th style='padding: 8px;'>Mệnh đề chính (Tương lai)</th><th style='padding: 8px;'>Liên từ</th><th style='padding: 8px;'>Mệnh đề thời gian (Hiện tại)</th><th style='padding: 8px;'>Mô tả bản chất</th></tr></thead><tbody><tr><td style='padding: 8px;'>We <strong>will ship</strong> the order</td><td style='padding: 8px; font-weight: bold; color: #2e7d32;'>once</td><td style='padding: 8px;'>payment <strong>has been received</strong>.</td><td style='padding: 8px;'>Hành động 2 xong $\rightarrow$ Thực hiện hành động 1</td></tr><tr><td style='padding: 8px;'>Mr. Swan <strong>will return</strong></td><td style='padding: 8px; font-weight: bold; color: #2e7d32;'>once</td><td style='padding: 8px;'>the interns <strong>have arrived</strong>.</td><td style='padding: 8px;'>Thực tập sinh đến $\rightarrow$ Ông Swan quay lại</td></tr></tbody></table><p style='margin-top: 10px;'><strong style='color: #e65100;'>🎯 Mẹo làm bài trong 3 giây:</strong> Nhìn đằng sau có <code>S + V</code> $\rightarrow$ Loại ngay các Giới từ (<i>unlike, regarding, despite, due to...</i>). Sau đó xét mối quan hệ thời gian $\rightarrow$ Chọn ngay các liên từ <strong>once / as soon as / when</strong>!</p></div>",
    "vocab": "<ul style='line-height: 1.6;'><li><strong style='color: #0288d1;'>once</strong> (conj): một khi, ngay sau khi (Khi làm liên từ chỉ thời gian = <i>as soon as / as soon as... has completed</i>).</li><li><strong style='color: #0288d1;'>return to</strong> (v.phr): quay trở lại (nơi nào / công việc gì).</li><li><strong style='color: #0288d1;'>planning meeting</strong> (n.phr): cuộc họp lên kế hoạch / cuộc họp hoạch định.</li><li><strong style='color: #0288d1;'>intern</strong> (n): thực tập sinh (Phân biệt với <i>trainee</i>: học viên tập sự, <i>applicant</i>: ứng viên).</li></ul>",

  "passage": "<div class=\"memo\" style=\"font-family: Arial, sans-serif; color: #333; line-height: 1.6; max-width: 750px; margin: 0 auto; border: 1px solid #999; padding: 20px; background: #fff;\">\n    <div style=\"font-weight: bold; font-size: 1.2rem; border-bottom: 2px solid #333; padding-bottom: 10px; margin-bottom: 15px;\">MEMO</div>\n    <div style=\"display: grid; grid-template-columns: 80px 1fr; gap: 10px; margin-bottom: 20px;\">\n        <strong>To:</strong> <span>All Staff</span>\n        <strong>From:</strong> <span>Joan Paulsen, CEO, Osmond Microtronics Ltd.</span>\n        <strong>Date:</strong> <span>19 May</span>\n        <strong>Subject:</strong> <span>Follow-up</span>\n    </div>\n    \n    <p>It was a pleasure to see so many of you at our company-wide meeting last week. Let me congratulate you again on our sales increase as well as the launch of our newest products, which are already regaining significant market share from our competitors.</p>\n    <p>I would like to announce that several executive positions have been filled. Frank Gruen will be our chief financial officer, Patricia Lesner will serve as vice president of research and development, Lana Avon will be our director of marketing, and <span class=\"clue-highlight-1\">product designer Lewis Sung will now oversee his department as director of product design.</span></p>\n    <p>One position remains open: director of human resources. Although Marcus Bromley's executive assignment was intended to remain unchanged, he recently decided to retire. We shall miss his analytical skills and bright sense of humour. <span class=\"clue-highlight-2\">Mr. Bromley plans to settle permanently in his native Pretoria in June.</span> We all wish him a well-deserved happy future.</p>\n</div>",

    "passage": "<div class=\"webpage-container\">\n    <div class=\"web-content\">\n        <h3><div style=\"margin: 0px 0px 20px; color: rgb(51, 51, 51); font-size: 16.8px; font-weight: 400; background-color: rgba(255, 255, 255, 0.6); border-bottom: 2px solid rgb(51, 51, 51);\"><div style=\"margin: 0px 0px 10px; font-size: 0.9rem;\">https://www.branxleycycles.com.my/about\n</div><div style=\"padding: 5px; display: flex; gap: 10px; background: rgb(238, 238, 238);\"><span style=\"padding: 5px 15px;\">Home</span><span style=\"padding: 5px 15px; background: rgb(204, 204, 204); font-weight: bold;\">About</span><span style=\"padding: 5px 15px;\">Shop</span><span style=\"padding: 5px 15px;\">Contact</span></div></div></h3><h2 style=\"color: rgb(51, 51, 51); background-color: rgba(255, 255, 255, 0.6);\"><span style=\"background-color: white; color: rgb(30, 41, 59); font-size: 1.05rem;\">About Our Products</span></h2>\n        <p>We make three-wheeled cargo bicycles for commercial and personal use. <span class=\"clue-highlight-1\">All our\nbicycles are made by hand in our production facility in Kuala Lumpur with parts\nmade by local craftspeople.</span>  For more than 40 years, we have been building\nhigh-quality, eco-friendly bicycles that are good for the health of both people and\nthe planet. We are proud of our products, and&nbsp;<span class=\"clue-highlight-2\">we invite our customers to take\nphotos of their Branxley bicycles in action and share the images via social media.</span></p>\n        <p><strong>Update – August 30</strong><br>\n        We have experienced a dramatic surge in orders. Even with our staff working\novertime to catch up, it may take longer than usual for customers to receive their\nbicycles. <span class=\"clue-highlight-4\">Currently, we are expecting a delivery time of 10 to 12 weeks</span> for all\nbicycles ordered on or after August 15. We appreciate your understanding in this\nmatter.\n</p>\n    </div>\n</div>\n<hr>\n<div class=\"review-container\">\n    <div class=\"review-body\">\n        <h3><span style=\"font-weight: normal;\">https://www.consumerreviewsplus.com.my&nbsp;</span></h3><h3 style=\"text-align: center; \">Review of Branxley Cycles</h3>\n        <p>I have been a cycling enthusiast most of my life. Recently, I decided I needed a\nbicycle to bring bulky items home from stores. I searched online and inquired at\nlocal shops, but no one had quite what I wanted. <span class=\"clue-highlight-3\">After talking with a coworker, I\nlearned about Branxley Cycles.</span> I contacted the company via e-mail, and all my questions were answered promptly and thoroughly. <span class=\"clue-highlight-4\">I ordered a three-wheeled cargo bicycle from them on August 20 that was delivered in only two weeks.</span> Branxley\nCycles cargo bicycles have become very popular with area businesses; I see them\neverywhere now. It is hard to believe the company can  <span class=\"clue-highlight-5\">meet</span> the demand, but they\nmanage to do it. I am very happy with my Branxley Cycles purchase, and I\nrecommend it to everybody that comments on it as I ride it around town.</p>\n        <p>— Jason Stewart, September 20</p>\n    </div>\n</div>",
    "translation": "<div class=\"translation-header\">Bản dịch & Phân tích</div>\n        <div class=\"webpage-container\">\n            <div class=\"web-content\">\n                <h3>Về sản phẩm của chúng tôi</h3>\n                <p>Chúng tôi sản xuất xe đạp ba bánh chở hàng cho mục đích thương mại và cá nhân. <span class=\"clue-highlight-1\">Tất cả xe đạp của chúng tôi được làm thủ công tại cơ sở sản xuất của chúng tôi ở Kuala Lumpur với các bộ phận được lấy từ các thợ thủ công địa phương.</span> Hơn 40 năm qua, chúng tôi đã sản xuất những chiếc xe đạp chất lượng cao, thân thiện với môi trường, tốt cho sức khỏe của cả con người và hành tinh. Chúng tôi tự hào về các sản phẩm của mình và <span class=\"clue-highlight-2\">mời khách hàng chụp những bức ảnh về chiếc xe đạp Branxley của họ đang hoạt động và chia sẻ chúng qua mạng xã hội.</span></p>\n                <p><strong>Cập nhật – 30 tháng 8</strong><br>\n                Chúng tôi đã chứng kiến một sự gia tăng đột ngột trong các đơn đặt hàng. Mặc dù đội ngũ nhân viên của chúng tôi đã làm thêm giờ để bắt kịp, nhưng thời gian giao hàng có thể lâu hơn bình thường. <span class=\"clue-highlight-4\">Hiện tại, chúng tôi dự kiến thời gian giao hàng là từ 10 đến 12 tuần</span> cho tất cả các xe đạp được đặt hàng từ ngày 15 tháng 8 trở đi. Chúng tôi đánh giá cao sự thông cảm của quý khách về vấn đề này.</p>\n            </div>\n        </div>\n        <div class=\"review-container\">\n            <div class=\"review-body\">\n                <h3>Đánh giá về Branxley Cycles</h3>\n                <p>Tôi đã là một người đam mê xe đạp trong suốt phần lớn cuộc đời mình. Gần đây, tôi quyết định cần một chiếc xe đạp chở hàng để mang những đồ vật cồng kềnh từ các cửa hàng về nhà. Tôi đã tìm kiếm trên mạng và hỏi thăm các cửa hàng địa phương, nhưng không có ai bán cái tôi cần. <span class=\"clue-highlight-3\">Sau khi trò chuyện với một đồng nghiệp ở cơ quan, tôi biết đến Branxley Cycles.</span> Tôi đã liên lạc với công ty qua email     "passage": "<div class=\"article-container\">\n    <div class=\"article-body\">\n        <p>EDINBURGH (2 July)-Jackson Milne says being part of a family business feels good. Hе jokes that he has a prime seat in his organisation-and, in a way, he does. <span class=\"clue-highlight-2\">The century-old company Milne Associates designs and supplies seats to theatres here in Edinburgh as well as in London and New York. It was founded by his great-grandfather Angus Milne.</span>&nbsp; Jackson Milne has worked in every area of the business, from the factory floor to the executive suite. He became the company's director of design last year.</p>\n        <p>\"Making these seats can be quite challenging, especially ones for older buildings,\" said <span class=\"clue-highlight-4\">Mr. Mr. Milne, who designed the seats for the 135-year-old Wolff Theatre.</span> That is where the hit musical Skyscraping is now playing to packed houses most nights.\n</p>\n        <p>\"<span class=\"clue-highlight-1\">Our priority is creating pieces that are functional and in harmony with their surroundings,</span>\" he said. \"We try to balance aesthetics, practicality, and convenience.\"</p>\n    </div>\n</div>\n<hr>\n<div class=\"review-container\">\n    <div class=\"review-body\">\n        <h3>City Travel Review: Lots to See and Do in Edinburgh</h3>\n        <p><span class=\"clue-highlight-3\">I had a delightful day in Edinburgh last week.</span> I hadn't been to the city in quite a while-more than 25 years-and so much has changed! <span class=\"clue-highlight-3\">One day was not enough to see everything, so I'm already planning another trip for later in the summer.</span></p>\n        <p>My friend and I took the train there, and our first order of business was a guided tour of Old Town. It was marvellous! We had lunch at the Red Rose Café, which I highly recommend to anyone who <span class=\"clue-highlight-5\">appreciates</span> delicious food at a reasonable price.\nThe day's highlight was attending a performance of Skyscraping. It was wonderful!\nI enjoyed everything about it-the acting, the story, and the songs. The Wolff Theatre is a lovely historical venue. <span class=\"clue-highlight-4\">After our long day around town, we were grateful for the theatre's new, comfortable seating.</span></p>\n        <p>—Punam Nandi, July 15</p>\n    </div>\n</div>",
    "translation": "<div class=\"translation-header\">Bản dịch & Phân tích</div>\n        <div class=\"article-container\">\n            <div class=\"article-body\">\n                <p>EDINBURGH (2 tháng 7)—Jackson Milne nói rằng việc là một phần của doanh nghiệp gia đình cảm thấy rất tuyệt. Anh ấy đùa rằng anh có một vị trí đặc biệt trong tổ chức của mình—và theo một cách nào đó, đúng là như vậy. <span class=\"clue-highlight-2\">Công ty Milne Associates đã tồn tại hơn một thế kỷ, thiết kế và cung cấp ghế cho các rạp hát tại Edinburgh cũng như ở London và New York.</span> <span class=\"clue-highlight-2\">Nó được thành lập bởi ông cố của anh, Angus Milne.</span> Jackson Milne đã làm việc ở mọi bộ phận trong công ty, từ sàn nhà máy đến phòng điều hành. Anh đã trở thành giám đốc thiết kế của công ty vào năm ngoái.</p>\n                <p>“Việc làm những chiếc ghế này có thể khá thử thách, đặc biệt là đối với các tòa nhà cũ,” <span class=\"clue-highlight-4\">ông Milne cho biết, người đã thiết kế ghế cho Wolff Theatre, nơi đã tồn tại 135 năm.</span> Đây là nơi vở nhạc kịch nổi tiếng Skyscraping hiện đang diễn ra với đầy khán giả hằng đêm.</p>\n                <p>“<span class=\"clue-highlight-1\">Ưu tiên của chúng tôi là tạo ra những chiếc ghế vừa chức năng vừa hòa hợp với không gian xung quanh,</span>” ông nói. “Chúng tôi cố gắng cân bằng giữa tính thẩm mỹ, sự thực tế và tiện lợi.”</p>\n            </div>\n        </div>\n        <div class=\"review-container\">\n            <div class=\"review-body\">\n                <h3>Đánh giá du lịch thành phố: Có rất nhiều thứ để xem và làm ở Edinburgh</h3>\n                <p><span class=\"clue-highlight-3\">Tôi đã có một ngày tuyệt vời tại Edinburgh vào tuần trước.</span> Tôi đã không đến thành phố này trong một thời gian dài—hơn 25 năm—và rất nhiều thứ đã thay đổi! <span class=\"clue-highlight-3\">Một ngày là không đủ để xem hết mọi thứ, vì vậy tôi đã bắt đầu lên kế hoạch cho một chuyến đi khác vào cuối mùa hè.</span></p>\n                <p>Bạn tôi và tôi đã đi tàu đến đó, và công việc đầu tiên của chúng tôi là tham quan có hướng dẫn ở khu phố cổ. Thật tuyệt vời! Chúng tôi đã ăn trưa tại Red Rose Café, nơi tôi rất khuyến khích cho bất kỳ ai <span class=\"clue-highlight-5\">yêu thích</span> thức ăn ngon với giá hợp lý. Điểm nổi bật trong ngày là tham gia một buổi biểu diễn Skyscraping. Thật tuyệt vời! Tôi đã thưởng thức mọi thứ về nó—diễn xuất, câu chuyện và những bài hát. Wolff Theatre là một địa điểm lịch sử tuyệt vời. <span class=\"clue-highlight-4\">Sau một ngày dài tham quan quanh thành phố, chúng tôi cảm thấy biết ơn với ghế ngồi mới và thoải mái của nhà hát.</span></p>\n                <p>—Punam Nandi, 15 tháng 7</p>\n            </div>\n        </div>",

    "passage": "<div class=\"webpage-container\">\n    <div class=\"web-content\">\n        <h3><div style=\"margin: 0px 0px 20px; color: rgb(51, 51, 51); font-size: 16.8px; font-weight: 400; background-color: rgba(255, 255, 255, 0.6); border-bottom: 2px solid rgb(51, 51, 51);\"><div style=\"margin: 0px 0px 10px; font-size: 0.9rem;\">https://www.orvalenaturalhistorymuseum.org/upcomingevents\n</div><div style=\"padding: 5px; display: flex; gap: 10px; background: rgb(238, 238, 238);\"><span style=\"padding: 5px 15px;\">Home</span><span style=\"padding: 5px 15px; background: rgb(204, 204, 204); font-weight: bold;\">Upcoming Events</span><span style=\"padding: 5px 15px;\">Exhibits</span><span style=\"padding: 5px 15px;\">Contact Us</span></div></div></h3><p>The Orvale Natural History Museum's monthly lecture series will continue on October 18 with a lecture by resident archaeologist Dr. Maria Fiallo. The lecture, titled \"Earthenware Relics from the Central Prairie,\" will take place at 7:00 P.M. in the <span class=\"clue-highlight-3\">Chovey Community Room</span> near the north entrance of the museum. Dr. Fiallo will discuss last month's unearthing of several pottery pieces in the Central Prairie region, marking the first find of its kind in this area. \"Surprisingly,\" said Dr. Fiallo, \"<span class=\"clue-highlight-1\">the site was literally stumbled upon by a farmer digging a well on his land.</span> Thankfully, he alerted our museum's research team as soon as he spotted the pieces.\"</p>\n        <p>Audiences will get to see some of the earthenware up close at the event, as well as other types of everyday objects. <span class=\"clue-highlight-2\">However, many of the pieces will be shown in photographs, as they are too delicate to be moved around.</span> <span class=\"clue-highlight-5\">Dr. Fiallo says she is looking forward to sharing this latest discovery. \"The findings give us a glimpse into how people went about their daily lives over 800 years ago,\"</span> she said.</p>\n        <p>The lecture is free and open to the public.</p>\n    </div>\n</div>\n<hr>\n<div class=\"email-container\">\n    <div class=\"email-header\">\n        <div><strong>To:</strong> Richard Choi</div>\n        <div><strong>From:</strong> Deborah Voll</div>\n        <div><strong>Date:</strong> October 11</div>\n        <div><strong>Subject:</strong> Lecture series</div>\n    </div>\n    <div class=\"email-body\">\n        <p>Hi Richard,</p>\n        <p>I was just contacted by Professor Allen Whitford from Orvale University's archaeology department. <span class=\"clue-highlight-4\">He would like to bring two of his classes to Dr. Fiallo's lecture on October 18. Both classes are studying how to identify and analyze historical artifacts,</span> so he was very happy with the topic of our lecture this month. What's more, Professor Whitford is a former research colleague of Dr. Fiallo. I am inclined to indicate my support, but I just want to make sure we can accommodate the approximately 30 students he is planning to bring-in addition, of course, to members of the public who want to attend.</p>\n        <p><span class=\"clue-highlight-3\">We will need more than 75 seats, so let's discuss moving the lecture to another location in the museum.</span> There are a couple of alternative spaces, right? I would like to reply to Professor Whitford as soon as possible.</p>\n        <p>Thanks!<br>Deb</p>\n    </div>\n</div>\n<hr>\n<div class=\"email-container\">\n    <div class=\"email-header\">\n        <div><strong>To:</strong> Maria Fiallo</div>\n        <div><strong>From:</strong> Allen Whitford</div>\n        <div><strong>Date:</strong> October 19</div>\n        <div><strong>Subject:</strong> Lecture</div>\n    </div>\n    <div class=\"email-body\">\n        <p>Dear Dr. Fiallo,</p>\n        <p>Thanks so much for your informative lecture yesterday evening. <span class=\"clue-highlight-5\">My students were thrilled to see some of the pottery up close on the display table. They were especially impressed by the stone tools included among the items. That these artifacts were so close by all this time was truly amazing for my students to contemplate.</span> I am so glad the pieces are safe at the Orvale Natural History Museum, which I know to be a good steward of such treasures.</p>\n        <p><span class=\"clue-highlight-4\">I hope you will consider my invitation to collaborate with my team and me here at Orvale University on some exciting research projects we have planned.</span> Let me know if you are interested, and I will forward the details.</p>\n        <p>Sincerely,</p>\n        <p>Allen Whitford</p>\n    </div>\n</div>",
    "translation": "<div class=\"translation-header\">Bản dịch & Phân tích</div>\n<div class=\"webpage-container\">\n    <div class=\"web-content\">\n        <p>Chương trình bài giảng hàng tháng của Bảo tàng Lịch sử Tự nhiên Orvale sẽ tiếp tục vào ngày 18 tháng 10 với một bài giảng của nhà khảo cổ học Dr. Maria Fiallo. Bài giảng, có tên “Những Di Vật Gốm Sứ Từ Đồng Bằng Trung Tâm,” sẽ diễn ra vào lúc 7:00 tối tại <span class=\"clue-highlight-3\">Phòng Cộng đồng Chovey</span> gần lối vào phía Bắc của bảo tàng. Dr. Fiallo sẽ thảo luận về việc phát hiện ra một số mảnh gốm sứ ở khu vực Đồng Bằng Trung Tâm vào tháng trước, đánh dấu phát hiện đầu tiên của loại hình này trong khu vực. “Thật bất ngờ,” Dr. Fiallo nói, “<span class=\"clue-highlight-1\">địa điểm này thật sự được phát hiện tình cờ bởi một người nông dân đang đào giếng trên đất của mình.</span> May mắn thay, ông ấy đã báo ngay cho đội ngũ nghiên cứu của bảo tàng ngay khi nhìn thấy các mảnh gốm.”</p>\n        <p>Khán giả sẽ được xem một số mẫu gốm sứ này một cách gần gũi tại sự kiện, cũng như các vật dụng hàng ngày khác. <span class=\"clue-highlight-2\">Tuy nhiên, nhiều mảnh sẽ chỉ được trình chiếu qua hình ảnh, vì chúng quá mỏng manh để di chuyển.</span> <span class=\"clue-highlight-5\">Dr. Fiallo cho biết bà rất mong muốn chia sẻ phát hiện mới này. “Những phát hiện này cho chúng ta cái nhìn thoáng qua về cách mọi người sinh hoạt hàng ngày cách đây hơn 800 năm,”</span> bà nói.</p>\n        <p>Buổi giảng miễn phí và mở cửa cho công chúng.</p>\n    </div>\n</div>\n<div class=\"email-container\">\n    <div class=\"email-body\">\n        <p>Đến: Richard Choi<br>\n        Từ: Deborah Voll<br>\n        Ngày: 11 tháng 10<br>\n        Chủ đề: Chương trình bài giảng</p>\n        <p>Chào Richard,</p>\n        <p>Tôi vừa nhận được liên lạc từ Giáo sư Allen Whitford thuộc khoa khảo cổ học của Đại học Orvale. <span class=\"clue-highlight-4\">Ông ấy muốn đưa hai lớp học của mình tham dự bài giảng của Dr. Fiallo vào ngày 18 tháng 10. Cả hai lớp học này đều đang học về cách nhận diện và phân tích các hiện vật lịch sử,</span> vì vậy họ rất hào hứng với chủ đề bài giảng của chúng ta tháng này. Hơn nữa, Giáo sư Whitford là đồng nghiệp nghiên cứu trước đây của Dr. Fiallo. Tôi có xu hướng ủng hộ việc này, nhưng tôi chỉ muốn đảm bảo rằng chúng ta có thể bố trí đủ chỗ cho khoảng 30 sinh viên mà ông ấy dự định đưa đến—thêm vào đó, tất nhiên là còn các thành viên công chúng muốn tham dự nữa.</p>\n        <p><span class=\"clue-highlight-3\">Chúng ta sẽ cần hơn 75 chỗ ngồi, vậy hãy thảo luận về việc chuyển bài giảng đến một địa điểm khác trong bảo tàng.</span> Có một vài không gian thay thế, đúng không? Tôi muốn trả lời Giáo sư Whitford càng sớm càng tốt.</p>\n        <p>Cảm ơn!<br>\n        Deb</p>\n    </div>\n</div>\n<div class=\"email-container\">\n    <div class=\"email-body\">\n        <p>Đến: Maria Fiallo<br>\n        Từ: Allen Whitford<br>\n        Ngày: 19 tháng 10<br>\n        Chủ đề: Bài giảng</p>\n        <p>Kính gửi Dr. Fiallo,</p>\n        <p>Cảm ơn rất nhiều vì bài giảng thú vị của bà tối qua. <span class=\"clue-highlight-5\">Các sinh viên của tôi rất vui khi được xem những món đồ gốm gần gũi trên bàn trưng bày. Họ đặc biệt ấn tượng với những công cụ bằng đá nằm trong số các hiện vật. Việc những di vật này ở gần chúng tôi suốt thời gian qua thật sự là điều tuyệt vời đối với các sinh viên của tôi để suy ngẫm.</span> Tôi rất vui vì các món đồ này hiện đang được bảo vệ an toàn tại Bảo tàng Lịch sử Tự nhiên Orvale, nơi tôi biết là có trách nhiệm bảo tồn những báu vật như vậy.</p>\n        <p><span class=\"clue-highlight-4\">Tôi hy vọng bà sẽ xem xét lời mời của tôi để hợp tác với đội ngũ và tôi tại Đại học Orvale trong một số dự án nghiên cứu thú vị mà chúng tôi đã lên kế hoạch.</span> Hãy cho tôi biết nếu bà quan tâm, tôi sẽ chuyển các chi tiết cho bà.</p>\n        <p>Trân trọng,<br>\n        Allen Whitford</p>\n    </div>\n</div>",

5 seats &rarr; move to another location</span> &rarr; <span style='color: #16a085;'>seats no more than 75 people</span>.<br><br>\n                <strong>Đáp án:</strong> ✅ (C) It seats no more than 75 people.\n            </div>"

 từ 800 năm trước, không còn được dùng hàng ngày hiện tại.<br><br>\n                <span style='color: #8e44ad; font-weight: bold;'>🔄 Paraphrase từ ETS:</span><br>\n                - <span style='color: #d35400;'>stone tools included among the findings / daily lives over 800 years ago</span> &rarr; <span style='color: #16a085;'>more than 800 years old</span>.<br><br>\n                <strong>Đáp án:</strong> ✅ (C) They are more than 800 years old.\n            </div>"

    "passage": "<div class=\"webpage-container\">\n    <div class=\"web-content\">\n        <div style=\"margin: 0px 0px 10px; color: rgb(51, 51, 51); font-size: 0.9rem;\">https://www.musiclinkplus.ie/home</div>\n        <div style=\"padding: 5px; color: rgb(51, 51, 51); display: flex; gap: 10px; background: rgb(238, 238, 238);\"><span style=\"padding: 5px 15px;\">Job Listings</span><span style=\"padding: 5px 15px; background: rgb(204, 204, 204); font-weight: bold;\">Home</span><span style=\"padding: 5px 15px;\">Musician Profiles</span><span style=\"padding: 5px 15px;\">Resources</span></div>\n        <p>Music Link Plus (MLP) supports job seekers and employers in the music industry.</p>\n        <p><strong>For Job Seekers:</strong> Start by creating a free MLP profile. You will then receive full access to employment opportunities on our Job Listings page. <span class=\"clue-highlight-5\">Our Resources page provides sheet music and singers' recordings to help you prepare for an audition. The page also features complete instructions on how to create and upload a video recording to our Web site if a recruiter requests a video sample from you.</span></p>\n        <p><strong>For Recruiters:</strong> <span class=\"clue-highlight-3\">Begin by opening an account by paying an initial fee of €300, after which you will be charged €150 annually.</span> Your account entitles you to list unlimited job postings. You will also be able to select the pieces you want your candidates to perform from a wide menu that we provide. Candidates will be able to upload their audition videos right on this Web site.</p>\n    </div>\n</div>\n<hr>\n<div class=\"email-container\">\n    <div class=\"email-header\">\n        <div><strong>To:</strong> Janice Trapani, Choir Director</div>\n        <div><strong>From:</strong> Kevin Ellis, Executive Director</div>\n        <div><strong>Date:</strong> <span class=\"clue-highlight-3\">July 7</span></div>\n        <div><strong>Subject:</strong> Autumn planning</div>\n    </div>\n    <div class=\"email-body\">\n        <p>Hello Janice,</p>\n        <p>I need to update you on a couple of issues affecting our autumn schedule.</p>\n        <ul>\n            <li>The arts commission has asked our Gradey City Choir to debut a special piece of music in November, <span class=\"clue-highlight-1\">the oratorio By the Meadow by Gradey City's own Jeffrey Stolartz.</span> It is such an honour to be selected to perform this composition! This addition to our schedule completes our autumn lineup.</li>\n            <li>Unfortunately, <span class=\"clue-highlight-2\">I learned late last week that two singers need to be replaced before rehearsals begin in August.</span> Since we are already one week into July, <span class=\"clue-highlight-3\">I opened an account with Music Link Plus (MLP) this morning to expedite our search.</span> Tomorrow, I plan to post our positions on their Job Listings page. Using this Web site will allow us to reach countless potential applicants. Additionally, MLP gives us the option of having candidates audition by providing video recordings. <span class=\"clue-highlight-2\">Given our time constraints, we should consider having auditions done this way.</span> However, if you feel that in-person auditions are necessary, please let me know by the end of the day today.</li>\n        </ul>\n        <p>Kevin</p>\n    </div>\n</div>\n<hr>\n<div class=\"job-posting-container\">\n    <h3>\n        <div style=\"margin: 0px 0px 10px; font-weight: 400; color: rgb(51, 51, 51); font-size: 0.9rem;\">https://www.musiclinkplus.ie/joblistings</div>\n        <div style=\"padding: 5px; font-size: 16.8px; font-weight: 400; color: rgb(51, 51, 51); display: flex; gap: 10px; background: rgb(238, 238, 238);\"><span style=\"padding: 5px 15px;\">Home</span><span style=\"padding: 5px 15px; background: rgb(204, 204, 204); font-weight: bold;\">Job Listings</span><span style=\"padding: 5px 15px;\">Musician Profiles</span><span style=\"padding: 5px 15px;\">Resources</span></div>\n        <p style=\"font-size: 16.8px;\">Vocalist Positions (Gradey City Choir)<br><strong style=\"font-size: 1.05rem;\">Posted on:</strong><span style=\"font-size: 1.05rem;\"> <span style=\"font-weight: normal;\">July 8</span><br></span><strong style=\"font-size: 1.05rem;\">Application Deadline:</strong><span style=\"font-size: 1.05rem;\"> <span style=\"font-weight: normal;\">July 21</span></span></p>\n    </h3>\n    <p>Gradey City Choir seeks two singers for its autumn season: an alto and a tenor. <span class=\"clue-highlight-4\">Successful candidates will join our dynamic choir under the direction of Janice Trapani and will be expected to report to Neufried Auditorium on 11 August for autumn performance rehearsals.</span></p>\n    <p><span class=\"clue-highlight-5\">Applicants must supply an audition video. Simply follow the instructions on the Resources page.</span> We have selected a portion from Franka Berman's Still Waters Cantata for candidates to sing. Hiring decision notifications will be sent to your personal e-mail address on 4 August.</p>\n</div>",
    "translation": "<div class=\"translation-header\">Bản dịch & Phân tích</div>\n<div class=\"webpage-container\">\n    <div class=\"web-content\">\n        <p><strong>Music Link Plus (MLP) hỗ trợ người tìm việc và nhà tuyển dụng trong ngành âm nhạc.</strong></p>\n        <p><strong>Dành cho Người Tìm Việc:</strong> Bắt đầu bằng cách tạo một hồ sơ MLP miễn phí. Bạn sẽ nhận được quyền truy cập đầy đủ vào các cơ hội việc làm trên trang \"Job Listings\" của chúng tôi. <span class=\"clue-highlight-5\">Trang \"Resources\" của chúng tôi cung cấp bản nhạc và các bản thu âm của ca sĩ để giúp bạn chuẩn bị cho buổi thử giọng. Trang này cũng có hướng dẫn chi tiết về cách tạo và tải lên video thử giọng lên trang web của chúng tôi nếu nhà tuyển dụng yêu cầu mẫu video từ bạn.</span></p>\n        <p><strong>Dành cho Nhà Tuyển Dụng:</strong> <span class=\"clue-highlight-3\">Bắt đầu bằng cách mở một tài khoản và thanh toán một khoản phí ban đầu là €300, sau đó bạn sẽ bị tính phí €150 mỗi năm.</span> Tài khoản của bạn cho phép bạn đăng tuyển dụng không giới hạn. Bạn cũng sẽ có thể chọn các tác phẩm mà bạn muốn ứng viên thể hiện từ một thực đơn rộng mà chúng tôi cung cấp. Các ứng viên sẽ có thể tải video thử giọng của mình lên trang web này.</p>\n    </div>\n</div>\n<div class=\"email-container\">\n    <div class=\"email-body\">\n        <p>Tới: Janice Trapani, Giám đốc Dàn Hợp Xướng<br>Từ: Kevin Ellis, Giám đốc Điều Hành<br>Ngày: <span class=\"clue-highlight-3\">7 tháng 7</span><br>Chủ đề: Lập kế hoạch cho mùa thu</p>\n        <p>Chào Janice,</p>\n        <p>Tôi cần cập nhật cho bạn một vài vấn đề ảnh hưởng đến lịch trình mùa thu của chúng ta.</p>\n        <ul>\n            <li>Ủy ban nghệ thuật đã yêu cầu Dàn hợp xướng Thành phố Grady của chúng ta ra mắt một tác phẩm đặc biệt vào tháng 11, <span class=\"clue-highlight-1\">bài thánh ca By the Meadow do Jeffrey Stolarz, người của Thành phố Grady sáng tác.</span> Chúng ta rất vinh dự khi được chọn để biểu diễn tác phẩm này! Sự bổ sung // --- HÀM TÔ MÀU DẪN CHỨNG HIỆN SẴN ---
function applyEvidenceColors() {
    const pastelColors = [
        { bg: '#ffadad', text: '#5a1c1c' }, // Đỏ pastel
        { bg: '#ffd6a5', text: '#663d14' }, // Cam pastel
        { bg: '#caffbf', text: '#1f4d1f' }, // Xanh lá pastel
        { bg: '#9bf6ff', text: '#16565c' }, // Xanh dương pastel
        { bg: '#a0c4ff', text: '#1c3666' }, // Xanh biển pastel
        { bg: '#bdb2ff', text: '#352666' }, // Tím pastel
        { bg: '#ffc6ff', text: '#661a66' }, // Hồng pastel
        { bg: '#e2f0cb', text: '#3e5222' }  // Xanh rêu pastel
    ];

    let colorIndex = 0;
    let usedColors = {}; 

    let evElements = document.querySelectorAll('.ev-box');

    evElements.forEach(el => {
        let idString = el.id;
        if (!idString) return;
        let match = idString.match(/ev-(\d+)/);
        if (match) {
            let qId = match[1];
            if (!usedColors[qId]) {
                usedColors[qId] = pastelColors[colorIndex % pastelColors.length];
                colorIndex++;
            }
            el.style.backgroundColor = usedColors[qId].bg;
            el.style.color = usedColors[qId].text;
            el.style.padding = "2px 5px";
            el.style.borderRadius = "6px";
            el.style.fontWeight = "600";
            el.style.transition = "all 0.3s ease";
        }
    });
}
