  "id": 112,
  "q": "Dr. Cheung ------ Silk Valley Hospital at next weekend’s medical fair.",
  "options": ["represent", "did represent", "is representing", "had represented"],
  "a": "is representing",
  "exp": {
    "correct": "<div style='line-height: 1.6;'><p><strong>a. Phân tích thành phần câu:</strong> Câu có cấu trúc S - V - O đi kèm trạng ngữ chỉ thời gian tương lai:</p><ul><li><strong>S (Subject):</strong> <code>Dr. Cheung</code> (Bác sĩ Cheung - Chủ ngữ số ít)</li><li><strong>V (Verb):</strong> <code>is representing</code> (sẽ đại diện / đang đại diện theo lịch trình)</li><li><strong>O (Object):</strong> <code>Silk Valley Hospital</code> (Bệnh viện Silk Valley)</li><li><strong>Trạng ngữ thời gian/địa điểm:</strong> <code>at next weekend’s medical fair</code> (tại hội chợ y tế vào cuối tuần tới)</li></ul><p><strong>b. Xác định thì động từ:</strong> Cụm từ <i>next weekend's</i> (cuối tuần tới) là dấu hiệu thời gian trong Tương lai. Đối với một sự việc hay lịch trình công tác đã được lên kế hoạch, sắp xếp chắc chắn từ trước, tiếng Anh thương mại thường sử dụng <strong>thì Hiện tại tiếp diễn (Present Continuous) mang ý nghĩa Tương lai</strong>.</p><p><strong>c. Lý do chọn đáp án:</strong> Phương án <span style='color: #2e7d32; font-weight: bold;'>is representing</span> vừa đảm bảo đúng sự hòa hợp giữa chủ ngữ số ít (<i>Dr. Cheung</i>) với động từ <i>is</i>, vừa diễn tả chính xác một kế hoạch công tác đã được ấn định cho sự kiện hội chợ y tế tuần sau.</p></div>",
    "wrong": "<ul style='line-height: 1.6; list-style-type: none; padding-left: 0;'><li><strong style='color: #c62828;'>❌ (A) represent:</strong> Động từ nguyên mẫu ở thì Hiện tại đơn. Phương án này sai cả về ngữ pháp (chủ ngữ số ít <i>Dr. Cheung</i> bắt buộc phải chia <i>represents</i>) lẫn ngữ nghĩa (thì hiện tại đơn không diễn tả lịch trình sự kiện tương lai cụ thể).</li><li><strong style='color: #c62828;'>❌ (B) did represent:</strong> Động từ chia thì Quá khứ đơn. Không dùng thì quá khứ cho một sự kiện diễn ra ở tương lai (<i>next weekend</i>).</li><li><strong style='color: #c62828;'>❌ (D) had represented:</strong> Động từ chia thì Quá khứ hoàn thành (chỉ sự việc xảy ra trước một thời điểm quá khứ khác). Hoàn toàn mâu thuẫn với mốc thời gian tương lai <i>next weekend</i>.</li></ul>",
    "grammar": "<div style='line-height: 1.6;'><p><strong>⭐ Cách dùng Thì Hiện tại tiếp diễn chỉ Lịch trình / Kế hoạch Tương lai gần (Future Arrangements)</strong></p><p>Trong đề thi TOEIC, không phải cứ có dấu hiệu tương lai (<i>next week, tomorrow, upcoming</i>) là bắt buộc dùng <i>will + V</i>. Rất nhiều câu hỏi kiểm tra cách dùng Hiện tại tiếp diễn để chỉ một sự việc đã chốt lịch trình công tác:</p><p style='padding-left: 15px; border-left: 3px solid #ccc;'><code>S + am / is / are + V-ing + Trạng từ chỉ Tương lai (Future Time)</code></p><table border='1' style='width: 100%; border-collapse: collapse; border-color: #e0e0e0; margin-top: 10px; font-size: 14px;'><thead style='background-color: #f5f5f5; text-align: left;'><tr><th style='padding: 8px;'>Cách dùng Tương lai</th><th style='padding: 8px;'>Thì sử dụng</th><th style='padding: 8px;'>Sắc thái ý nghĩa</th><th style='padding: 8px;'>Ví dụ TOEIC</th></tr></thead><tbody><tr><td style='padding: 8px; color: #2e7d32;'><strong>Lịch trình đã chốt / Đã phân công</strong></td><td style='padding: 8px; font-weight: bold;'>Present Continuous (S + am/is/are + V-ing)</td><td style='padding: 8px;'>Đã sắp xếp chắc chắn, có lịch hẹn cụ thể</td><td style='padding: 8px; color: #2e7d32;'><strong>is representing</strong> the hospital next week / <strong>is attending</strong> the seminar tomorrow</td></tr><tr><td style='padding: 8px;'><strong>Quyết định bộc phát / Dự đoán</strong></td><td style='padding: 8px;'>Simple Future (S + will + V-bare)</td><td style='padding: 8px;'>Quyết định ngay tại thời điểm nói hoặc phỏng đoán</td><td style='padding: 8px;'>will probably attend / will call you later</td></tr></tbody></table><p style='margin-top: 10px;'><strong style='color: #e65100;'>🎯 Mẹo làm bài trong 3 giây:</strong> Thấy dấu hiệu <code>next weekend / next week</code> nhưng bốn đáp án không có <i>will + V</i> $\rightarrow$ Tìm ngay đáp án chia ở thì Hiện tại tiếp diễn (<strong>is/are + V-ing</strong>) để chọn!</p></div>",
    "vocab": "<ul style='line-height: 1.6;'><li><strong style='color: #0288d1;'>represent</strong> (v): đại diện cho (Collocations: <i>represent a company, represent a client, representative (n)</i>).</li><li><strong style='color: #0288d1;'>medical fair</strong> (n.phr): hội chợ y tế / triển lãm y tế (Các loại hội chợ TOEIC: <i>trade fair, job fair, technology fair</i>).</li><li><strong style='color: #0288d1;'>hospital</strong> (n): bệnh viện (Từ vựng liên quan: <i>healthcare facility, clinic, patient</i>).</li></ul>",
    "trans": "<div style='line-height: 1.6; padding: 8px; background-color: #f9f9f9; border-left: 4px solid #0288d1;'><p style='margin: 0 0 8px 0;'><strong>Dịch nghĩa gốc:</strong> Bác sĩ Cheung sẽ đại diện cho Bệnh viện Silk Valley tại hội chợ y tế vào cuối tuần tới.</p><p style='margin: 0; font-style: italic; color: #555;'><strong>Dịch tự nhiên:</strong> Theo lịch trình đã phân công, Bác sĩ Cheung sẽ là người đại diện cho Bệnh viện Silk Valley tham dự sự kiện hội chợ y tế diễn ra vào cuối tuần sau.</p></div>"
  }

        {
  "id": 113,
  "q": "Frankie’s Boutique had a financially ------ quarter after taking measures to reduce costs.",
  "options": ["plain", "profitable", "full", "additional"],
  "a": "profitable",
  "exp": {
    "correct": "<div style='line-height: 1.6;'><p><strong>a. Phân tích thành phần câu:</strong> Câu có cấu trúc S - V - O kết hợp mệnh đề trạng ngữ chỉ nguyên nhân/thời gian:</p><ul><li><strong>S (Subject):</strong> <code>Frankie’s Boutique</code> (Cửa hàng thời trang Frankie’s Boutique)</li><li><strong>V (Verb):</strong> <code>had</code> (đã trải qua / đạt được)</li><li><strong>O (Object - Cụm danh từ):</strong> <code>a financially profitable quarter</code> (một quý kinh doanh có lãi về mặt tài chính)</li><li><strong>Trạng ngữ nguyên nhân/thời gian:</strong> <code>after taking measures to reduce costs</code> (sau khi áp dụng các biện pháp cắt giảm chi phí)</li></ul><p><strong>b. Xác định từ loại:</strong> Căn cứ vào cấu trúc cụm danh từ kẹp trạng từ <code>Article (a) + Adverb + Adjective + Noun</code> (<i>a financially ______ quarter</i>), vị trí khoảng trống bổ nghĩa cho danh từ <i>quarter</i> (quý/kỳ kinh doanh) bắt buộc phải điền một <strong>Tính từ (Adjective)</strong>.</p><p><strong>c. Lý do chọn đáp án:</strong> Do cả 4 phương án đều là tính từ, đây là câu hỏi từ vựng dựa vào logic ngữ cảnh. Mệnh đề phía sau đề cập đến nguyên nhân tích cực <i>after taking measures to reduce costs</i> (sau khi cắt giảm chi phí). Việc giảm chi phí sẽ dẫn đến kết quả tài chính khả quan. Do đó, phương án <span style='color: #2e7d32; font-weight: bold;'>profitable</span> (có lãi, sinh lời) là tính từ duy nhất ghép hợp lý cả về mặt ý nghĩa tài chính lẫn collocation <code>a profitable quarter</code>.</p></div>",
    "wrong": "<ul style='line-height: 1.6; list-style-type: none; padding-left: 0;'><li><strong style='color: #c62828;'>❌ (A) plain:</strong> Tính từ mang nghĩa 'đơn giản, trơn, không trang trí' (thường dùng cho quần áo/bao bì, ví dụ: <i>a plain shirt</i>). Không đi với trạng từ <i>financially</i> và không mô tả kết quả tài chính.</li><li><strong style='color: #c62828;'>❌ (C) full:</strong> Tính từ mang nghĩa 'đầy đủ, trọn vẹn' (Ví dụ: <i>a full schedule, full capacity</i>). Không tạo thành kết hợp từ mang ý nghĩa báo cáo tài chính khả quan (<i>financially full</i> sai ngữ nghĩa thương mại).</li><li><strong style='color: #c62828;'>❌ (D) additional:</strong> Tính từ mang nghĩa 'bổ sung, thêm vào' (Ví dụ: <i>additional funding, additional staff</i>). Không phù hợp logic ngữ cảnh cắt giảm chi phí để đạt được lợi nhuận.</li></ul>",
    "grammar": "<div style='line-height: 1.6;'><p><strong>⭐ Cấu trúc Cụm Danh từ Mở rộng (Adv + Adj + Noun) & Logic Mối quan hệ Nhân - Quả trong TOEIC</strong></p><p>Trong đề thi TOEIC Part 5, khi tất cả các đáp án đều thuộc cùng một từ loại (Tính từ), thí sinh cần kết hợp phân tích cấu trúc cụm danh từ và mối quan hệ nguyên nhân - kết quả giữa các mệnh đề:</p><p style='padding-left: 15px; border-left: 3px solid #ccc;'><code>Article (a/an/the) + Adverb (-ly) + Adjective + Noun</code><br><code>Nỗ lực / Biện pháp (reduce costs / cut expenses) $\rightarrow$ Kết quả tài chính (profitable / successful)</code></p><table border='1' style='width: 100%; border-collapse: collapse; border-color: #e0e0e0; margin-top: 10px; font-size: 14px;'><thead style='background-color: #f5f5f5; text-align: left;'><tr><th style='padding: 8px;'>Thành phần cụm</th><th style='padding: 8px;'>Ví dụ trong bài</th><th style='padding: 8px;'>Cụm tương đương trong TOEIC</th></tr></thead><tbody><tr><td style='padding: 8px;'>Trạng từ bổ nghĩa (Adv)</td><td style='padding: 8px;'>financially</td><td style='padding: 8px;'>highly / remarkably / extremely / highly</td></tr><tr><td style='padding: 8px; color: #2e7d32;'><strong>Tính từ chính (Adj)</strong></td><td style='padding: 8px; font-weight: bold; color: #2e7d32;'>profitable</td><td style='padding: 8px;'>successful / stable / efficient / competitive</td></tr><tr><td style='padding: 8px;'>Danh từ trung tâm (Noun)</td><td style='padding: 8px;'>quarter</td><td style='padding: 8px;'>quarter / campaign / system / business</td></tr></tbody></table><p style='margin-top: 10px;'><strong style='color: #e65100;'>🎯 Mẹo làm bài trong 3 giây:</strong> Thấy vế sau đề cập <code>reduce costs</code> (cắt giảm chi phí) $\rightarrow$ Tìm ngay tính từ chỉ kết quả tài chính dương <strong>profitable</strong> (có lãi) đi cùng với <i>quarter</i>!</p></div>",
    "vocab": "<ul style='line-height: 1.6;'><li><strong style='color: #0288d1;'>profitable</strong> (adj): sinh lời, có lợi nhuận, có lãi (Collocations: <i>profitable quarter, profitable investment, profitable business</i>).</li><li><strong style='color: #0288d1;'>take measures</strong> (v.phr): áp dụng / thực hiện các biện pháp (Collocations: <i>take measures to reduce costs, take safety measures</i>).</li><li><strong style='color: #0288d1;'>reduce costs</strong> (v.phr): cắt giảm chi phí (Đồng nghĩa: <i>cut expenses, lower expenditures, minimize costs</i>).</li></ul>",
    "trans": "<div style='line-height: 1.6; padding: 8px; background-color: #f9f9f9; border-left: 4px solid #0288d1;'><p style='margin: 0 0 8px 0;'><strong>Dịch nghĩa gốc:</strong> Frankie’s Boutique đã có một quý kinh doanh có lãi về mặt tài chính sau khi thực hiện các biện pháp giảm chi phí.</p><p style='margin: 0; font-style: italic; color: #555;'><strong>Dịch tự nhiên:</strong> Nhờ chủ động thực hiện các biện pháp cắt giảm chi phí vận hành, Frankie’s Boutique đã đạt kết quả kinh doanh có lãi vượt bậc trong quý vừa qua.</p></div>"
  }
},

  "id": 114,
  "q": "Because it submitted the lowest bid, Deb’s Gifting has been chosen as the ------ of this year’s holiday cards.",
  "options": ["supply", "supplier", "supplies", "supplying"],
  "a": "supplier",
  "exp": {
    "correct": "<div style='line-height: 1.6;'><p><strong>a. Phân tích thành phần câu:</strong> Câu phức chứa mệnh đề trạng ngữ chỉ nguyên nhân đứng trước:</p><ul><li><strong>Mệnh đề nguyên nhân:</strong> <code>Because it submitted the lowest bid</code> (Vì công ty đã nộp mức giá thầu thấp nhất)</li><li><strong>S chính:</strong> <code>Deb’s Gifting</code> (Tên doanh nghiệp / Công ty Deb's Gifting)</li><li><strong>V chính (bị động):</strong> <code>has been chosen</code> (đã được lựa chọn)</li><li><strong>Cụm bổ ngữ chỉ vai trò:</strong> <code>as the supplier of this year’s holiday cards</code> (làm nhà cung cấp thiệp chúc mừng dịp lễ của năm nay)</li></ul><p><strong>b. Xác định từ loại:</strong> Căn cứ vào công thức hạn định <code>the + Noun + of</code> và sau cấu trúc chỉ vai trò/chức danh <code>be chosen as + Noun</code>, vị trí khoảng trống bắt buộc phải điền một <strong>Danh từ (Noun)</strong>.</p><p><strong>c. Lý do chọn đáp án:</strong> Do chủ ngữ <i>Deb’s Gifting</i> là một doanh nghiệp thắng thầu (<i>submitted the lowest bid</i>), danh từ cần điền phải chỉ đối tượng/đơn vị kinh doanh. Phương án <span style='color: #2e7d32; font-weight: bold;'>supplier</span> (nhà cung cấp / đơn vị cung ứng) là danh từ duy nhất chỉ tổ chức/thực thể phù hợp hoàn toàn với ngữ cảnh hợp đồng kinh doanh.</p></div>",
    "wrong": "<ul style='line-height: 1.6; list-style-type: none; padding-left: 0;'><li><strong style='color: #c62828;'>❌ (A) supply:</strong> Danh từ trừu tượng / Động từ mang nghĩa 'nguồn cung, sự cung cấp'. Không dùng để chỉ một công ty hay đơn vị thắng thầu (sai nghĩa <i>chosen as the supply</i>).</li><li><strong style='color: #c62828;'>❌ (C) supplies:</strong> Danh từ số nhiều mang nghĩa 'vật tư, trang thiết bị' (Ví dụ: <i>office supplies, medical supplies</i>). Công ty không thể được chọn làm 'các vật tư'.</li><li><strong style='color: #c62828;'>❌ (D) supplying:</strong> Danh từ dạng V-ing / Phân từ chỉ 'việc cung cấp'. Không phù hợp đứng sau mạo từ <i>the</i> để đóng vai trò làm danh từ chỉ đối tượng thương mại.</li></ul>",
    "grammar": "<div style='line-height: 1.6;'><p><strong>⭐ Phân biệt Danh từ chỉ Người/Thực thể (Person/Entity Noun) vs Danh từ Trừu tượng (Abstract Noun) & Cấu trúc Chức danh</strong></p><p>Trong đề thi TOEIC Part 5, khi đứng trước các cấu trúc chỉ vai trò hoặc sau mạo từ <i>the</i>, bài thi rất hay đưa vào các danh từ cùng họ (Word Family) để thử thách khả năng phân biệt danh từ chỉ chủ thể kinh doanh:</p><p style='padding-left: 15px; border-left: 3px solid #ccc;'><code>be chosen / appointed / selected + AS + [Danh từ chỉ Vai trò / Chủ thể]</code><br><code>the + SUPPLIER / VENDOR / CONTRACTOR + of + [Sản phẩm / Dịch vụ]</code></p><table border='1' style='width: 100%; border-collapse: collapse; border-color: #e0e0e0; margin-top: 10px; font-size: 14px;'><thead style='background-color: #f5f5f5; text-align: left;'><tr><th style='padding: 8px;'>Từ loại / Dạng từ</th><th style='padding: 8px;'>Từ vựng</th><th style='padding: 8px;'>Mô tả bản chất</th><th style='padding: 8px;'>Ví dụ Collocation TOEIC</th></tr></thead><tbody><tr><td style='padding: 8px; color: #2e7d32;'><strong>Danh từ chỉ Thực thể / Đơn vị</strong></td><td style='padding: 8px; font-weight: bold; color: #2e7d32;'>supplier</td><td style='padding: 8px;'>Công ty / Nhà cung cấp hàng hóa</td><td style='padding: 8px; color: #2e7d32;'><strong>supplier of</strong> materials / equipment / cards</td></tr><tr><td style='padding: 8px;'><strong>Danh từ trừu tượng / Khái niệm</strong></td><td style='padding: 8px;'>supply</td><td style='padding: 8px;'>Nguồn cung / Sự cung cấp nói chung</td><td style='padding: 8px;'>water supply / food supply</td></tr><tr><td style='padding: 8px;'><strong>Danh từ số nhiều chỉ đồ vật</strong></td><td style='padding: 8px;'>supplies</td><td style='padding: 8px;'>Nhu yếu phẩm / Nguồn vật tư công sở</td><td style='padding: 8px;'>office supplies / cleaning supplies</td></tr></tbody></table><p style='margin-top: 10px;'><strong style='color: #e65100;'>🎯 Mẹo làm bài trong 3 giây:</strong> Nhìn thấy chủ ngữ là tên công ty (<i>Deb’s Gifting</i>) + động từ <i>chosen as the ______ of...</i> $\rightarrow$ Chọn ngay danh từ chỉ đơn vị cung ứng <strong>supplier</strong>!</p></div>",
    "vocab": "<ul style='line-height: 1.6;'><li><strong style='color: #0288d1;'>supplier</strong> (n): nhà cung cấp, đơn vị cung ứng (Collocations: <i>approved supplier, leading supplier, supplier of office equipment</i>).</li><li><strong style='color: #0288d1;'>submit a bid</strong> (v.phr): nộp hồ sơ dự thầu, bỏ giá thầu (Các cụm liên quan: <i>lowest bid, win a bid, competitive bidding</i>).</li><li><strong style='color: #0288d1;'>holiday cards</strong> (n.phr): thiệp chúc mừng dịp lễ (Cụm tương tự: <i>greeting cards, invitation cards, business cards</i>).</li></ul>",
    "trans": "<div style='line-height: 1.6; padding: 8px; background-color: #f9f9f9; border-left: 4px solid #0288d1;'><p style='margin: 0 0 8px 0;'><strong>Dịch nghĩa gốc:</strong> Vì đã nộp mức giá thầu thấp nhất, Deb’s Gifting đã được chọn làm nhà cung cấp thiệp chúc mừng lễ hội của năm nay.</p><p style='margin: 0; font-style: italic; color: #555;'><strong>Dịch tự nhiên:</strong> Nhờ đưa ra mức giá dự thầu cạnh tranh nhất, công ty Deb’s Gifting đã xuất sắc trở thành đơn vị chính thức cung cấp các sản phẩm thiệp mừng dịp lễ cho năm nay.</p></div>"
  }

  "q": "The Whitetail Institute is the only ------ that tracks deer populations in rapidly expanding suburban areas.",
  "options": ["leadership", "neighborhood", "official", "organization"],
  "a": "organization",
  "exp": {
    "correct": "<div style='line-height: 1.6;'><p><strong>a. Phân tích thành phần câu:</strong> Câu đơn có chứa mệnh đề quan hệ bổ nghĩa cho bổ ngữ chủ ngữ:</p><ul><li><strong>S (Subject):</strong> <code>The Whitetail Institute</code> (Viện Whitetail)</li><li><strong>V (Verb):</strong> <code>is</code> (là)</li><li><strong>C (Subject Complement - Cụm danh từ):</strong> <code>the only organization</code> (tổ chức duy nhất)</li><li><strong>Mệnh đề quan hệ bổ nghĩa (Relative Clause):</strong> <code>that tracks deer populations in rapidly expanding suburban areas</code> (theo dõi quần thể hươu ở các khu vực ngoại ô đang mở rộng nhanh chóng)</li></ul><p><strong>b. Xác định từ loại:</strong> Căn cứ vào cấu trúc nhấn mạnh <code>the only + Noun + that + Verb</code>, vị trí khoảng trống đứng sau mạo từ và tính từ nhấn mạnh <i>the only</i> bắt buộc phải là một <strong>Danh từ (Noun)</strong> đóng vai trò làm danh từ trung tâm.</p><p><strong>c. Lý do chọn đáp án:</strong> Cả 4 phương án đều đóng vai trò danh từ, do đó cần xét mối quan hệ ngữ nghĩa với chủ ngữ <i>The Whitetail Institute</i> (một viện nghiên cứu). Bản chất của một <i>Institute</i> là một tổ chức/cơ quan. Do đó, danh từ <span style='color: #2e7d32; font-weight: bold;'>organization</span> (tổ chức, cơ quan) là đáp án duy nhất tương thích hoàn hảo cả về mặt phân loại thực thể lẫn chức năng thực hiện hành động <i>tracks deer populations</i> (theo dõi quần thể động vật).</p></div>",
    "wrong": "<ul style='line-height: 1.6; list-style-type: none; padding-left: 0;'><li><strong style='color: #c62828;'>❌ (A) leadership:</strong> Danh từ mang nghĩa 'ban lãnh đạo, khả năng lãnh đạo'. Không thể dùng để định nghĩa cho một viện nghiên cứu (<i>The Institute is the leadership</i> sai logic đồng nhất).</li><li><strong style='color: #c62828;'>❌ (B) neighborhood:</strong> Danh từ mang nghĩa 'khu dân cư, khu vực lân cận'. Một khu dân cư không thể tự mình thực hiện hành động chuyên môn là 'theo dõi quần thể hươu'.</li><li><strong style='color: #c62828;'>❌ (C) official:</strong> Danh từ chỉ người mang nghĩa 'quan chức, viên chức'. Không phù hợp với chủ ngữ là một tổ chức / viện nghiên cứu (<i>The Institute</i> là vật/tổ chức, không phải người).</li></ul>",
    "grammar": "<div style='line-height: 1.6;'><p><strong>⭐ Mệnh đề Quan hệ với Cấu trúc Nhấn mạnh (The only + Noun + that) & Logic Đồng nhất Chủ ngữ</strong></p><p>Trong đề thi TOEIC Part 5, các dạng câu hỏi từ vựng danh từ đứng trong cấu trúc định nghĩa thường đòi hỏi thí sinh phân tích tính đồng nhất giữa Chủ ngữ (Subject) và Bổ ngữ (Complement):</p><p style='padding-left: 15px; border-left: 3px solid #ccc;'><code>Subject (Tổ chức) + BE + THE ONLY + [Danh từ chỉ Tổ chức] + THAT + Verb</code><br><code>The Whitetail Institute $\rightarrow$ Organization / Institution / Research Center</code></p><table border='1' style='width: 100%; border-collapse: collapse; border-color: #e0e0e0; margin-top: 10px; font-size: 14px;'><thead style='background-color: #f5f5f5; text-align: left;'><tr><th style='padding: 8px;'>Thành phần</th><th style='padding: 8px;'>Ví dụ trong bài</th><th style='padding: 8px;'>Mô tả / Vai trò ngữ pháp</th></tr></thead><tbody><tr><td style='padding: 8px;'>Chủ ngữ chỉ Thực thể (S)</td><td style='padding: 8px;'>The Whitetail Institute</td><td style='padding: 8px;'>Cơ quan / Viện nghiên cứu chuyên môn</td></tr><tr><td style='padding: 8px;'>Cấu trúc nhấn mạnh</td><td style='padding: 8px;'>is the only ______</td><td style='padding: 8px;'>Cần danh từ đồng đẳng với chủ ngữ</td></tr><tr><td style='padding: 8px; color: #2e7d32;'><strong>Danh từ đáp án (Noun)</strong></td><td style='padding: 8px; font-weight: bold; color: #2e7d32;'>organization</td><td style='padding: 8px;'>Tổ chức (đồng nghĩa logic với Institute)</td></tr><tr><td style='padding: 8px;'>Mệnh đề quan hệ (Relative Clause)</td><td style='padding: 8px;'>that tracks deer populations...</td><td style='padding: 8px;'>Giải thích chức năng/hành động của tổ chức</td></tr></tbody></table><p style='margin-top: 10px;'><strong style='color: #e65100;'>🎯 Mẹo làm bài trong 3 giây:</strong> Thấy chủ ngữ có chứa các từ như <i>Institute, Academy, Association, Agency</i> + động từ <i>is the only ______</i> $\rightarrow$ Chọn ngay danh từ bao quát <strong>organization</strong>!</p></div>",
    "vocab": "<ul style='line-height: 1.6;'><li><strong style='color: #0288d1;'>organization</strong> (n): tổ chức, cơ quan (Collocations: <i>nonprofit organization, research organization, environmental organization</i>).</li><li><strong style='color: #0288d1;'>track</strong> (v): theo dõi, giám sát, truy vết (Collocations: <i>track inventory, track sales, track deer populations</i>).</li><li><strong style='color: #0288d1;'>suburban area</strong> (n.phr): khu vực ngoại ô (Từ liên quan: <i>rapidly expanding, urban area, rural area</i>).</li></ul>",
    "trans": "<div style='line-height: 1.6; padding: 8px; background-color: #f9f9f9; border-left: 4px solid #0288d1;'><p style='margin: 0 0 8px 0;'><strong>Dịch nghĩa gốc:</strong> Viện Whitetail là tổ chức duy nhất theo dõi quần thể hươu ở các khu vực ngoại ô đang mở rộng nhanh chóng.</p><p style='margin: 0; font-style: italic; color: #555;'><strong>Dịch tự nhiên:</strong> Viện Whitetail hiện là đơn vị duy nhất thực hiện việc giám sát và thống kê số lượng hươu tại những vùng ngoại ô đang có tốc độ đô thị hóa nhanh chóng.</p></div>"
  }

  "id": 116,
  "q": "The committee members ------ attended the meeting are listed in the appendix.",
  "options": ["who", "they", "when", "some"],
  "a": "who",
  "exp": {
    "correct": "<div style='line-height: 1.6;'><p><strong>a. Phân tích thành phần câu:</strong> Câu sử dụng Mệnh đề Quan hệ (Relative Clause) bổ nghĩa cho Chủ ngữ chính:</p><ul><li><strong>S (Subject chính):</strong> <code>The committee members</code> (Các thành viên ủy ban)</li><li><strong>Mệnh đề quan hệ bổ nghĩa:</strong> <code>who attended the meeting</code> (những người đã tham dự cuộc họp)</li><li><strong>V (Verb chính - bị động):</strong> <code>are listed</code> (được liệt kê)</li><li><strong>Trạng ngữ chỉ vị trí:</strong> <code>in the appendix</code> (trong phần phụ lục)</li></ul><p><strong>b. Xác định từ loại & Cấu trúc:</strong> Vị trí khoảng trống đứng sau danh từ chỉ người <i>The committee members</i> và ngay trước động từ <i>attended</i>. Căn cứ vào công thức mệnh đề quan hệ <code>Noun (Person) + Who + Verb + Object</code>, khoảng trống bắt buộc phải điền <strong>Đại từ quan hệ chỉ người (Relative Pronoun)</strong> đóng vai trò làm Chủ ngữ cho động từ <i>attended</i>.</p><p><strong>c. Lý do chọn đáp án:</strong> Phương án <span style='color: #2e7d32; font-weight: bold;'>who</span> là đại từ quan hệ duy nhất thay thế cho danh từ chỉ người <i>committee members</i> và làm nhiệm vụ kết nối mệnh đề phụ với mệnh đề chính một cách chính xác về ngữ pháp.</p></div>",
    "wrong": "<ul style='line-height: 1.6; list-style-type: none; padding-left: 0;'><li><strong style='color: #c62828;'>❌ (B) they:</strong> Đại từ nhân xưng (Personal Pronoun). Không có chức năng làm từ nối hai mệnh đề. Nếu điền vào sẽ gây ra lỗi 2 chủ ngữ thừa đứng cạnh nhau (<i>The committee members they attended...</i>).</li><li><strong style='color: #c62828;'>❌ (C) when:</strong> Trạng từ quan hệ chỉ thời gian (ví dụ: <i>the day when...</i>). Không thể dùng để thay thế cho danh từ chỉ người <i>committee members</i>.</li><li><strong style='color: #c62828;'>❌ (D) some:</strong> Lượng từ (Quantifier). Không thể đứng một mình làm từ nối ngữ pháp cho một động từ phía sau trong trường hợp này.</li></ul>",
    "grammar": "<div style='line-height: 1.6;'><p><strong>⭐ Mệnh đề Quan hệ Xác định (Defining Relative Clause) & Bẫy Đại từ Nhân xưng (They vs Who)</strong></p><p>Trong các câu Part 5 TOEIC có cấu trúc <code>Subject + [______ + Verb] + Main Verb</code>, thí sinh cần phân biệt rõ giữa <strong>Đại từ quan hệ</strong> (có tính năng liên kết mệnh đề) và <strong>Đại từ nhân xưng</strong> (gây thừa chủ ngữ):</p><p style='padding-left: 15px; border-left: 3px solid #ccc;'><code>Noun (Chỉ người) + WHO + Verb + (Object) + Main Verb</code><br><code>The committee members + WHO + attended the meeting + ARE LISTED...</code></p><table border='1' style='width: 100%; border-collapse: collapse; border-color: #e0e0e0; margin-top: 10px; font-size: 14px;'><thead style='background-color: #f5f5f5; text-align: left;'><tr><th style='padding: 8px;'>Danh từ tiền ngữ</th><th style='padding: 8px;'>Đại từ quan hệ chuẩn</th><th style='padding: 8px;'>Chức năng trong mệnh đề</th><th style='padding: 8px;'>Ví dụ TOEIC</th></tr></thead><tbody><tr><td style='padding: 8px; color: #2e7d32;'><strong>Danh từ chỉ Người</strong></td><td style='padding: 8px; font-weight: bold; color: #2e7d32;'>WHO / THAT</td><td style='padding: 8px;'>Làm Chủ ngữ (Subject)</td><td style='padding: 8px;'>employees <strong>who</strong> work overtime</td></tr><tr><td style='padding: 8px;'>Danh từ chỉ Vật</td><td style='padding: 8px;'>WHICH / THAT</td><td style='padding: 8px;'>Làm Chủ ngữ / Tân ngữ</td><td style='padding: 8px;'>reports <strong>which</strong> were submitted</td></tr><tr><td style='padding: 8px;'>Danh từ chỉ Thời gian</td><td style='padding: 8px;'>WHEN</td><td style='padding: 8px;'>Làm Trạng ngữ chỉ thời gian</td><td style='padding: 8px;'>the time <strong>when</strong> the meeting starts</td></tr></tbody></table><p style='margin-top: 10px;'><strong style='color: #e65100;'>🎯 Mẹo làm bài trong 3 giây:</strong> Thấy công thức <code>[Danh từ chỉ người] + ______ + [Động từ chia thì]</code> $\rightarrow$ Chọn ngay <strong>WHO</strong> (không bao giờ chọn <i>They</i> vì sẽ bị trùng lặp chủ ngữ)!</p></div>",
    "vocab": "<ul style='line-height: 1.6;'><li><strong style='color: #0288d1;'>committee member</strong> (n.phr): thành viên ủy ban (Các từ chỉ vai trò tương tự: <i>board member, staff member, team member</i>).</li><li><strong style='color: #0288d1;'>attend</strong> (v): tham dự, có mặt (Collocations: <i>attend a meeting, attend a conference, attend a workshop</i>).</li><li><strong style='color: #0288d1;'>appendix</strong> (n): phần phụ lục (thường nằm ở cuối báo cáo, tài liệu hoặc hợp đồng).</li></ul>",
    "trans": "<div style='line-height: 1.6; padding: 8px; background-color: #f9f9f9; border-left: 4px solid #0288d1;'><p style='margin: 0 0 8px 0;'><strong>Dịch nghĩa gốc:</strong> Những thành viên ủy ban người mà đã tham dự cuộc họp được liệt kê trong phần phụ lục.</p><p style='margin: 0; font-style: italic; color: #555;'><strong>Dịch tự nhiên:</strong> Danh sách các thành viên ủy ban có mặt tại cuộc họp đã được ghi rõ trong phần phụ lục của tài liệu.</p></div>"
  }
},

  "id": 117,
  "q": "Our new app is ------ designed to provide data-driven insights to investment professionals.",
  "options": ["specify", "specific", "specificity", "specifically"],
  "a": "specifically",
  "exp": {
    "correct": "<div style='line-height: 1.6;'><p><strong>a. Phân tích thành phần câu:</strong> Câu đơn hoàn chỉnh với cấu trúc thể bị động (Passive Voice):</p><ul><li><strong>S (Subject):</strong> <code>Our new app</code> (Ứng dụng mới của chúng tôi)</li><li><strong>V (Verb bị động):</strong> <code>is designed</code> (được thiết kế)</li><li><strong>Trạng từ bổ nghĩa (Adverb):</strong> <code>specifically</code> (đặc biệt / dành riêng)</li><li><strong>Cụm động từ nguyên mẫu chỉ mục đích:</strong> <code>to provide data-driven insights to investment professionals</code> (để cung cấp các phân tích dựa trên dữ liệu cho các chuyên gia đầu tư)</li></ul><p><strong>b. Xác định từ loại & Cấu trúc:</strong> Vị trí khoảng trống nằm kẹp giữa trợ động từ <i>is</i> (to be) và động từ phân từ hai <i>designed</i> (V3/ed). Áp dụng công thức cấu trúc bị động kẹp trạng từ <code>Be + Adverb + V3/ed</code>, vị trí này bắt buộc phải điền một <strong>Trạng từ (Adverb)</strong> bổ nghĩa trực tiếp cho hành động <i>designed</i>.</p><p><strong>c. Lý do chọn đáp án:</strong> Phương án <span style='color: #2e7d32; font-weight: bold;'>specifically</span> là trạng từ duy nhất trong các đáp án. Cụm <code>be specifically designed to + V</code> là một collocation kinh điển trong TOEIC mang nghĩa 'được thiết kế chuyên biệt / dành riêng để làm gì'.</p></div>",
    "wrong": "<ul style='line-height: 1.6; list-style-type: none; padding-left: 0;'><li><strong style='color: #c62828;'>❌ (A) specify:</strong> Động từ nguyên mẫu mang nghĩa 'chỉ rõ, định rõ'. Không đứng giữa 'is' và 'designed' (sai ngữ pháp cấu trúc bị động).</li><li><strong style='color: #c62828;'>❌ (B) specific:</strong> Tính từ mang nghĩa 'cụ thể, đặc thù'. Tính từ không bổ nghĩa cho động từ/phân từ 'designed' trong vị trí này (chỉ dùng khi bổ nghĩa cho danh từ đứng sau).</li><li><strong style='color: #c62828;'>❌ (C) specificity:</strong> Danh từ trừu tượng mang nghĩa 'tính cụ thể, tính đặc thù'. Danh từ không thể đứng kẹp giữa trợ động từ và động từ chính.</li></ul>",
    "grammar": "<div style='line-height: 1.6;'><p><strong>⭐ Vị trí Trạng từ Bổ nghĩa trong Cấu trúc Bị động (Be + Adv + V3/ed) & Collocation Chuyên biệt</strong></p><p>Trong đề thi TOEIC Part 5, bẫy họ từ (Word Family) kẹp giữa dạng bị động là một dạng bài xuất hiện với tần suất cực cao. Thí sinh cần nắm vững quy tắc bổ nghĩa cho Động từ / Quá khứ Phân từ:</p><p style='padding-left: 15px; border-left: 3px solid #ccc;'><code>Subject + BE + ADVERB (-ly) + V3/ed + TO-V / FOR-N</code><br><code>is + SPECIFICALLY + designed + to provide...</code></p><table border='1' style='width: 100%; border-collapse: collapse; border-color: #e0e0e0; margin-top: 10px; font-size: 14px;'><thead style='background-color: #f5f5f5; text-align: left;'><tr><th style='padding: 8px;'>Từ loại</th><th style='padding: 8px;'>Từ vựng</th><th style='padding: 8px;'>Chức năng ngữ pháp</th><th style='padding: 8px;'>Ví dụ Collocation TOEIC</th></tr></thead><tbody><tr><td style='padding: 8px; color: #2e7d32;'><strong>Trạng từ (Adv)</strong></td><td style='padding: 8px; font-weight: bold; color: #2e7d32;'>specifically</td><td style='padding: 8px;'>Bổ nghĩa cho V3 <i>designed</i></td><td style='padding: 8px; color: #2e7d32;'>is <strong>specifically designed</strong> to</td></tr><tr><td style='padding: 8px;'>Tính từ (Adj)</td><td style='padding: 8px;'>specific</td><td style='padding: 8px;'>Bổ nghĩa cho Danh từ đứng sau</td><td style='padding: 8px;'>a <strong>specific</strong> requirement / goal</td></tr><tr><td style='padding: 8px;'>Động từ (Verb)</td><td style='padding: 8px;'>specify</td><td style='padding: 8px;'>Động từ chính trong câu</td><td style='padding: 8px;'>please <strong>specify</strong> the details</td></tr><tr><td style='padding: 8px;'>Danh từ (Noun)</td><td style='padding: 8px;'>specificity</td><td style='padding: 8px;'>Chủ ngữ hoặc Tân ngữ</td><td style='padding: 8px;'>lack of <strong>specificity</strong></td></tr></tbody></table><p style='margin-top: 10px;'><strong style='color: #e65100;'>🎯 Mẹo làm bài trong 3 giây:</strong> Nhìn thấy cấu trúc <code>is + ______ + V3/ed</code> $\rightarrow$ Chọn ngay <strong>Trạng từ có đuôi -ly (specifically)</strong> mà không cần dịch câu!</p></div>",
    "vocab": "<ul style='line-height: 1.6;'><li><strong style='color: #0288d1;'>specifically designed</strong> (adv.phr): được thiết kế chuyên biệt / dành riêng (Collocations: <i>specifically designed for, specifically designed to improve efficiency</i>).</li><li><strong style='color: #0288d1;'>data-driven insights</strong> (n.phr): những thông tin phân tích / hiểu biết sâu sắc dựa trên dữ liệu (Các từ đi cùng: <i>data-driven decisions, data-driven strategy</i>).</li><li><strong style='color: #0288d1;'>investment professional</strong> (n.phr): chuyên gia đầu tư (Thuật ngữ tương tự: <i>financial analyst, portfolio manager, investment advisor</i>).</li></ul>",
    "trans": "<div style='line-height: 1.6; padding: 8px; background-color: #f9f9f9; border-left: 4px solid #0288d1;'><p style='margin: 0 0 8px 0;'><strong>Dịch nghĩa gốc:</strong> Ứng dụng mới của chúng tôi được thiết kế đặc biệt để cung cấp các phân tích chuyên sâu dựa trên dữ liệu cho các chuyên gia đầu tư.</p><p style='margin: 0; font-style: italic; color: #555;'><strong>Dịch tự nhiên:</strong> Ứng dụng mới của chúng tôi được phát triển chuyên biệt nhằm mang đến những dữ liệu phân tích chuyên sâu cho giới đầu tư chuyên nghiệp.</p></div>"
  }
},
        {
  "id": 118,
  "q": "The results of the study suggest that more people ------ with night driving than previously believed.",
  "options": ["struggles", "struggling", "to struggle", "struggle"],
  "a": "struggle",
  "exp": {
    "correct": "<div style='line-height: 1.6;'><p><strong>a. Phân tích thành phần câu:</strong> Câu phức chứa mệnh đề danh ngữ làm tân ngữ cho động từ <i>suggest</i>:</p><ul><li><strong>S chính:</strong> <code>The results of the study</code> (Kết quả của nghiên cứu)</li><li><strong>V chính:</strong> <code>suggest</code> (cho thấy rằng)</li><li><strong>Mệnh đề danh ngữ sau 'that':</strong> <code>that more people struggle with night driving than previously believed</code></li><li><strong>S trong mệnh đề 'that':</strong> <code>more people</code> (nhiều người hơn - Danh từ số nhiều)</li><li><strong>V chính trong mệnh đề 'that':</strong> <code>struggle</code> (gặp khó khăn / vật lộn)</li><li><strong>Cụm giới từ:</strong> <code>with night driving</code> (với việc lái xe ban đêm)</li></ul><p><strong>b. Xác định từ loại & Ngữ pháp:</strong> Mệnh đề sau <i>that</i> đã có chủ ngữ là <i>more people</i> nhưng còn thiếu động từ chia thì chính (Main Verb). Do chủ ngữ <i>people</i> luôn là <strong>Danh từ số nhiều (Plural Noun)</strong>, động từ chia ở thì hiện tại đơn phải giữ ở dạng <strong>Nguyên mẫu không chia (Bare Infinitive)</strong>.</p><p><strong>c. Lý do chọn đáp án:</strong> Phương án <span style='color: #2e7d32; font-weight: bold;'>struggle</span> là động từ số nhiều chia ở hiện tại đơn phù hợp hoàn hảo với chủ ngữ số nhiều <i>more people</i> và tạo thành collocation <code>struggle with sth</code> (chật vật / gặp khó khăn với điều gì).</p></div>",
    "wrong": "<ul style='line-height: 1.6; list-style-type: none; padding-left: 0;'><li><strong style='color: #c62828;'>❌ (A) struggles:</strong> Động từ chia số ít (thêm -s). Sai sự hòa hợp Chủ - Vị vì chủ ngữ <i>people</i> là số nhiều (chỉ dùng <i>struggles</i> khi chủ ngữ là <i>he / she / it / one person</i>).</li><li><strong style='color: #c62828;'>❌ (B) struggling:</strong> Hiện tại phân từ (V-ing). Không thể đứng một mình làm động từ chính chia thì cho chủ ngữ <i>more people</i> nếu không có trợ động từ <i>be</i> (ví dụ: <i>are struggling</i>).</li><li><strong style='color: #c62828;'>❌ (C) to struggle:</strong> Động từ nguyên mẫu có 'to' (To-V). Không có chức năng làm động từ chính chia thì cho mệnh đề.</li></ul>",
    "grammar": "<div style='line-height: 1.6;'><p><strong>⭐ Sự Hòa hợp Chủ ngữ - Động từ (Subject-Verb Agreement) với 'People' & Mệnh đề 'Suggest that'</strong></p><p>Trong đề thi TOEIC Part 5, bẫy chia thì động từ sau các liên từ như <i>that</i> rất hay xuất hiện. Thí sinh cần xác định đúng danh từ trung tâm làm chủ ngữ để chọn dạng động từ tương ứng:</p><p style='padding-left: 15px; border-left: 3px solid #ccc;'><code>S (suggest) + THAT + S_phụ (Số nhiều) + V_phụ (Số nhiều)</code><br><code>suggest + that + MORE PEOPLE (Plural) + STRUGGLE (Bare V)</code></p><table border='1' style='width: 100%; border-collapse: collapse; border-color: #e0e0e0; margin-top: 10px; font-size: 14px;'><thead style='background-color: #f5f5f5; text-align: left;'><tr><th style='padding: 8px;'>Chủ ngữ (Subject)</th><th style='padding: 8px;'>Đặc tính số ít / số nhiều</th><th style='padding: 8px;'>Dạng động từ Hiện tại đơn</th><th style='padding: 8px;'>Ví dụ minh họa</th></tr></thead><tbody><tr><td style='padding: 8px; color: #2e7d32;'><strong>more people / many people</strong></td><td style='padding: 8px; font-weight: bold; color: #2e7d32;'>Luôn là Số nhiều</td><td style='padding: 8px; font-weight: bold; color: #2e7d32;'>V_bare (struggle)</td><td style='padding: 8px; color: #2e7d32;'>more people <strong>struggle</strong></td></tr><tr><td style='padding: 8px;'>one person / the driver</td><td style='padding: 8px;'>Luôn là Số ít</td><td style='padding: 8px;'>V_s/es (struggles)</td><td style='padding: 8px;'>the driver <strong>struggles</strong></td></tr><tr><td style='padding: 8px;'>the result / the study</td><td style='padding: 8px;'>Danh từ số ít</td><td style='padding: 8px;'>V_s/es (suggests)</td><td style='padding: 8px;'>the study <strong>suggests</strong></td></tr></tbody></table><p style='margin-top: 10px;'><strong style='color: #e65100;'>🎯 Mẹo làm bài trong 3 giây:</strong> Thấy cấu trúc <code>that + [more people] + ______</code> $\rightarrow$ Nhận diện ngay <i>people</i> là danh từ số nhiều $\rightarrow$ Chọn động từ nguyên mẫu <strong>struggle</strong>!</p></div>",
    "vocab": "<ul style='line-height: 1.6;'><li><strong style='color: #0288d1;'>struggle with sth</strong> (v.phr): gặp khó khăn, vật lộn với điều gì (Collocations: <i>struggle with deadlines, struggle with technology, struggle with night driving</i>).</li><li><strong style='color: #0288d1;'>suggest that</strong> (v.phr): chỉ ra rằng, cho thấy rằng (Dùng phổ biến trong báo cáo nghiên cứu: <i>research suggests that, survey suggests that</i>).</li><li><strong style='color: #0288d1;'>previously believed</strong> (adv.phr): được tin/nghĩ trước đó (Cụm học thuật TOEIC: <i>more effective than previously believed, more widespread than previously believed</i>).</li></ul>",
    "trans": "<div style='line-height: 1.6; padding: 8px; background-color: #f9f9f9; border-left: 4px solid #0288d1;'><p style='margin: 0 0 8px 0;'><strong>Dịch nghĩa gốc:</strong> Kết quả của nghiên cứu cho thấy có nhiều người gặp khó khăn với việc lái xe vào ban đêm hơn so với những gì từng được tin tưởng trước đây.</p><p style='margin: 0; font-style: italic; color: #555;'><strong>Dịch tự nhiên:</strong> Kết quả nghiên cứu cho thấy số lượng người gặp trở ngại khi lái xe vào ban đêm cao hơn đáng kể so với các nhận định trước đây.</p></div>"
  }
},
        {
  "id": 119,
  "q": "Each department has been asked to develop an action plan in ------ to the budget cuts announced last week.",
  "options": ["response", "effect", "apology", "confirmation"],
  "a": "response",
  "exp": {
    "correct": "<div style='line-height: 1.6;'><p><strong>a. Phân tích thành phần câu:</strong> Câu đơn chứa mệnh đề bị động kèm cụm chỉ mục đích và mệnh đề quan hệ rút gọn:</p><ul><li><strong>S (Subject):</strong> <code>Each department</code> (Mỗi phòng ban)</li><li><strong>V (Verb bị động):</strong> <code>has been asked</code> (đã được yêu cầu)</li><li><strong>Cụm To-V chỉ mục đích:</strong> <code>to develop an action plan</code> (xây dựng một kế hoạch hành động)</li><li><strong>Cụm giới từ cố định (Collocation):</strong> <code>in response to the budget cuts</code> (để đáp lại / đối phó với sự cắt giảm ngân sách)</li><li><strong>Mệnh đề quan hệ rút gọn (Quá khứ phân từ):</strong> <code>announced last week</code> (được thông báo vào tuần trước)</li></ul><p><strong>b. Xác định từ loại & Cấu trúc:</strong> Vị trí khoảng trống nằm kẹp giữa giới từ <i>in</i> và giới từ <i>to</i>. Căn cứ vào công thức cụm giới từ cố định (Prepositional Phrase Collocation) <code>in + Noun + to + Object</code>, chỗ trống yêu cầu một Danh từ tạo nên cụm từ có nghĩa 'phản hồi lại / đối phó với'.</p><p><strong>c. Lý do chọn đáp án:</strong> Cụm cố định <span style='color: #2e7d32; font-weight: bold;'>in response to</span> (đáp lại, ứng phó với) phù hợp hoàn hảo cả về ngữ pháp lẫn logic kinh doanh: lập kế hoạch hành động để đối phó với việc cắt giảm ngân sách.</p></div>",
    "wrong": "<ul style='line-height: 1.6; list-style-type: none; padding-left: 0;'><li><strong style='color: #c62828;'>❌ (B) effect:</strong> Danh từ mang nghĩa 'tác động, hiệu lực'. Mặc dù có cụm <i>in effect</i> (đang có hiệu lực), nhưng không tồn tại cấu trúc <i>in effect to something</i>.</li><li><strong style='color: #c62828;'>❌ (C) apology:</strong> Danh từ mang nghĩa 'lời xin lỗi'. Không tạo thành cấu trúc chuẩn với <i>in...to</i> và sai logic ngữ cảnh (các phòng ban không lập kế hoạch để xin lỗi việc cắt giảm ngân sách).</li><li><strong style='color: #c62828;'>❌ (D) confirmation:</strong> Danh từ mang nghĩa 'sự xác nhận'. Cụm <i>in confirmation to</i> không phải là một idiom/collocation chuẩn trong tiếng Anh thương mại.</li></ul>",
    "grammar": "<div style='line-height: 1.6;'><p><strong>⭐ Cụm Giới từ Cố định Nhóm 'In...To' (Prepositional Phrase Collocations) trong TOEIC</strong></p><p>Trong các bài thi Part 5 TOEIC, dạng câu hỏi kẹp khoảng trống giữa hai giới từ <code>IN + [Noun] + TO</code> đòi hỏi thí sinh phải thuộc lòng các cụm từ cố định mang ý nghĩa chuyên biệt:</p><p style='padding-left: 15px; border-left: 3px solid #ccc;'><code>IN RESPONSE TO + Noun / V-ing</code> $\rightarrow$ Để phản hồi lại / đáp lại / đối phó với điều gì</p><table border='1' style='width: 100%; border-collapse: collapse; border-color: #e0e0e0; margin-top: 10px; font-size: 14px;'><thead style='background-color: #f5f5f5; text-align: left;'><tr><th style='padding: 8px;'>Cụm giới từ</th><th style='padding: 8px;'>Ý nghĩa ngữ pháp</th><th style='padding: 8px;'>Ngữ cảnh sử dụng trong TOEIC</th></tr></thead><tbody><tr><td style='padding: 8px; color: #2e7d32;'><strong>in response to</strong></td><td style='padding: 8px; font-weight: bold; color: #2e7d32;'>đáp lại, phản hồi lại, đối phó với</td><td style='padding: 8px;'>in response to customer complaints / market demand</td></tr><tr><td style='padding: 8px;'>in addition to</td><td style='padding: 8px;'>thêm vào đó, bên cạnh việc</td><td style='padding: 8px;'>in addition to a competitive salary</td></tr><tr><td style='padding: 8px;'>in regard to / in relation to</td><td style='padding: 8px;'>liên quan đến, về việc</td><td style='padding: 8px;'>in regard to your recent inquiry</td></tr><tr><td style='padding: 8px;'>in contrast to</td><td style='padding: 8px;'>trái ngược với</td><td style='padding: 8px;'>in contrast to last year's sales figures</td></tr></tbody></table><p style='margin-top: 10px;'><strong style='color: #e65100;'>🎯 Mẹo làm bài trong 3 giây:</strong> Thấy cấu trúc kẹp <code>in + ______ + to + Noun</code> mang nghĩa ứng phó/đáp lại $\rightarrow$ Chọn ngay danh từ <strong>response</strong>!</p></div>",
    "vocab": "<ul style='line-height: 1.6;'><li><strong style='color: #0288d1;'>in response to</strong> (prep.phr): nhằm phản hồi lại, để đối phó với (Collocations: <i>in response to demand, in response to feedback, in response to market changes</i>).</li><li><strong style='color: #0288d1;'>action plan</strong> (n.phr): kế hoạch hành động (Collocations: <i>develop an action plan, implement an action plan, draft an action plan</i>).</li><li><strong style='color: #0288d1;'>budget cuts</strong> (n.phr): các đợt cắt giảm ngân sách (Thuật ngữ tài chính liên quan: <i>cost reduction, financial constraints, operating expenses</i>).</li></ul>",
    "trans": "<div style='line-height: 1.6; padding: 8px; background-color: #f9f9f9; border-left: 4px solid #0288d1;'><p style='margin: 0 0 8px 0;'><strong>Dịch nghĩa gốc:</strong> Mỗi phòng ban đã được yêu cầu xây dựng một kế hoạch hành động để đối phó với các đợt cắt giảm ngân sách được công bố vào tuần trước.</p><p style='margin: 0; font-style: italic; color: #555;'><strong>Dịch tự nhiên:</strong> Từng bộ phận được yêu cầu lập kế hoạch hành động cụ thể nhằm ứng phó với chính sách cắt giảm ngân sách vừa được thông báo tuần qua.</p></div>"
  }
},
        {
  "id": 120,
  "q": "Our popular online training materials have ------ been shown to improve job seekers’ skills.",
  "options": ["consistently", "emotionally", "spaciously", "randomly"],
  "a": "consistently",
  "exp": {
    "correct": "<div style='line-height: 1.6;'><p><strong>a. Phân tích thành phần câu:</strong> Câu đơn hoàn chỉnh ở thì Hiện tại hoàn thành dạng Bị động (Present Perfect Passive):</p><ul><li><strong>S (Subject):</strong> <code>Our popular online training materials</code> (Các tài liệu đào tạo trực tuyến phổ biến của chúng tôi)</li><li><strong>V (Verb bị động):</strong> <code>have been shown</code> (đã được chứng minh)</li><li><strong>Trạng từ bổ nghĩa (Adverb):</strong> <code>consistently</code> (một cách nhất quán / liên tục)</li><li><strong>To-Infinitive phrase:</strong> <code>to improve job seekers' skills</code> (là giúp cải thiện kỹ năng của người tìm việc)</li></ul><p><strong>b. Xác định từ loại & Cấu trúc:</strong> Vị trí khoảng trống nằm kẹp giữa trợ động từ <i>have</i> và trợ động từ bị động <i>been</i>. Căn cứ theo công thức <code>Have/Has + Adverb + Been + V3/ed</code>, vị trí này yêu cầu một <strong>Trạng từ (Adverb)</strong> bổ nghĩa cho cụm động từ bị động phía sau.</p><p><strong>c. Lý do chọn đáp án:</strong> Cả 4 phương án đều là trạng từ đuôi -ly. Xét về mặt ngữ nghĩa và văn phong quảng bá doanh nghiệp/nghiên cứu, trạng từ <span style='color: #2e7d32; font-weight: bold;'>consistently</span> (nhất quán, luôn luôn như vậy qua thời gian) là lựa chọn duy nhất tạo nên sự hợp lý về logic: tài liệu đào tạo đã <i>liên tục được chứng minh</i> là mang lại kết quả tốt ổn định.</p></div>",
    "wrong": "<ul style='line-height: 1.6; list-style-type: none; padding-left: 0;'><li><strong style='color: #c62828;'>❌ (B) emotionally:</strong> Trạng từ mang nghĩa 'về mặt cảm xúc, một cách cảm tính'. Không thể dùng để bổ nghĩa cho việc chứng minh hiệu quả đào tạo (kết quả nghiên cứu không mang tính cảm tính).</li><li><strong style='color: #c62828;'>❌ (C) spaciously:</strong> Trạng từ mang nghĩa 'một cách rộng rãi, thoáng đãng' (thường dùng mô tả không gian kiến trúc/phòng ở). Sai hoàn toàn về ngữ cảnh.</li><li><strong style='color: #c62828;'>❌ (D) randomly:</strong> Trạng từ mang nghĩa 'một cách ngẫu nhiên'. Trái ngược với logic quảng cáo/truyền thông của doanh nghiệp (hiệu quả đào tạo không thể xuất hiện một cách tình cờ/ngẫu nhiên).</li></ul>",
    "grammar": "<div style='line-height: 1.6;'><p><strong>⭐ Vị trí Trạng từ chỉ Tần suất/Chất lượng (Adverb of Manner/Degree) trong Thì Hiện tại Hoàn thành Bị động</strong></p><p>Trong đề thi Part 5 TOEIC, dạng bài kẹp trạng từ vào giữa cụm động từ phức hợp bị động xuất hiện rất thường xuyên. Thí sinh cần nắm vững vị trí đứng của Adverb:</p><p style='padding-left: 15px; border-left: 3px solid #ccc;'><code>Subject + HAVE / HAS + ADVERB (-ly) + BEEN + V3/ed + TO-V</code><br><code>materials + HAVE + CONSISTENTLY + BEEN + SHOWN + to improve...</code></p><table border='1' style='width: 100%; border-collapse: collapse; border-color: #e0e0e0; margin-top: 10px; font-size: 14px;'><thead style='background-color: #f5f5f5; text-align: left;'><tr><th style='padding: 8px;'>Thành phần</th><th style='padding: 8px;'>Từ / Cụm từ trong bài</th><th style='padding: 8px;'>Vai trò ngữ pháp</th></tr></thead><tbody><tr><td style='padding: 8px;'>Trợ động từ chính</td><td style='padding: 8px;'>have</td><td style='padding: 8px;'>Chỉ thì Hiện tại hoàn thành (đi với S số nhiều)</td></tr><tr><td style='padding: 8px; color: #2e7d32;'><strong>Trạng từ bổ nghĩa (Adv)</strong></td><td style='padding: 8px; font-weight: bold; color: #2e7d32;'>consistently</td><td style='padding: 8px;'>Bổ nghĩa cho hành động 'been shown'</td></tr><tr><td style='padding: 8px;'>Cụm bị động chính</td><td style='padding: 8px;'>been shown</td><td style='padding: 8px;'>Được chứng minh / Được chỉ ra rằng</td></tr><tr><td style='padding: 8px;'>Mục đích / Nội dung</td><td style='padding: 8px;'>to improve skills</td><td style='padding: 8px;'>Nội dung được kết luận từ nghiên cứu</td></tr></tbody></table><p style='margin-top: 10px;'><strong style='color: #e65100;'>🎯 Mẹo làm bài trong 3 giây:</strong> Khi gặp dạng bài 4 đáp án đều là Trạng từ đứng kẹp <code>have + ______ + been + V3</code> trong các câu kết luận khảo sát/nghiên cứu, hãy ưu tiên các từ chỉ sự ổn định/hiệu quả như <strong>consistently, repeatedly, successfully, provenly</strong>!</p></div>",
    "vocab": "<ul style='line-height: 1.6;'><li><strong style='color: #0288d1;'>consistently</strong> (adv): nhất quán, luôn luôn như vậy, ổn định (Từ đồng nghĩa: <i>dependably, steadily, continuously</i>).</li><li><strong style='color: #0288d1;'>be shown to + V</strong> (v.phr): được chứng minh / được chỉ ra là... (Cấu trúc báo cáo học thuật: <i>has been shown to reduce costs, has been shown to increase efficiency</i>).</li><li><strong style='color: #0288d1;'>job seeker</strong> (n.phr): người tìm việc (Các thuật ngữ tuyển dụng liên quan: <i>applicant, candidate, employer, recruiter</i>).</li></ul>",
    "trans": "<div style='line-height: 1.6; padding: 8px; background-color: #f9f9f9; border-left: 4px solid #0288d1;'><p style='margin: 0 0 8px 0;'><strong>Dịch nghĩa gốc:</strong> Các tài liệu đào tạo trực tuyến phổ biến của chúng tôi đã được chứng minh một cách nhất quán là giúp cải thiện kỹ năng của người tìm việc.</p><p style='margin: 0; font-style: italic; color: #555;'><strong>Dịch tự nhiên:</strong> Những tài liệu đào tạo trực tuyến được ưa chuộng của chúng tôi đã liên tục chứng minh được hiệu quả trong việc nâng cao trình độ cho người đang tìm kiếm việc làm.</p></div>"
  }
},
       {
  "id": 121,
  "q": "Ms. Yamada, ------ director of the Midlands Chamber of Commerce, was recently appointed to the state trade commission.",
  "options": ["formed", "former", "formalize", "formality"],
  "a": "former",
  "exp": {
    "correct": "<div style='line-height: 1.6;'><p><strong>a. Phân tích thành phần câu:</strong> Câu chứa cụm danh từ đồng vị (Appositive Phrase) đứng kẹp giữa hai dấu phẩy bổ nghĩa cho chủ ngữ chính:</p><ul><li><strong>S (Subject chính):</strong> <code>Ms. Yamada</code> (Bà Yamada)</li><li><strong>Cụm đồng vị bổ nghĩa (Appositive Phrase):</strong> <code>former director of the Midlands Chamber of Commerce</code> (cựu giám đốc Phòng Thương mại Midlands)</li><li><strong>V chính (Thì quá khứ đơn dạng Bị động):</strong> <code>was recently appointed</code> (gần đây đã được bổ nhiệm)</li><li><strong>Cụm giới từ chỉ chức vụ/cơ quan:</strong> <code>to the state trade commission</code> (vào ủy ban thương mại của bang)</li></ul><p><strong>b. Xác định từ loại & Cấu trúc:</strong> Khoảng trống đứng ngay trước danh từ chỉ chức danh <i>director</i>. Vị trí này đòi hỏi một <strong>Tính từ (Adjective)</strong> đứng trước để bổ nghĩa trực tiếp cho danh từ, mô tả trạng thái giữ chức vụ trong quá khứ.</p><p><strong>c. Lý do chọn đáp án:</strong> Phương án <span style='color: #2e7d32; font-weight: bold;'>former</span> là tính từ mang nghĩa 'cựu / nguyên / trước đây'. Cấu trúc <code>former + [Chức vụ/Nghề nghiệp]</code> hoàn toàn phù hợp về mặt logic: bà Yamada là cựu giám đốc của Phòng Thương mại trước khi được bổ nhiệm sang vị trí mới ở Ủy ban Thương mại bang.</p></div>",
    "wrong": "<ul style='line-height: 1.6; list-style-type: none; padding-left: 0;'><li><strong style='color: #c62828;'>❌ (A) formed:</strong> Động từ dạng quá khứ/phân từ (V-ed) mang nghĩa 'được hình thành, tạo nên'. Không đi ghép với danh từ chỉ người <i>director</i> (sai ngữ nghĩa và collocation).</li><li><strong style='color: #c62828;'>❌ (C) formalize:</strong> Động từ nguyên mẫu mang nghĩa 'chính thức hóa'. Động từ không thể đứng trực tiếp trước danh từ để làm chức năng bổ nghĩa.</li><li><strong style='color: #c62828;'>❌ (D) formality:</strong> Danh từ trừu tượng mang nghĩa 'sự trang trọng, tính hình thức, thủ tục'. Hai danh từ trừu tượng và danh từ chỉ người không ghép với nhau thành cụm danh từ có nghĩa trong ngữ cảnh này.</li></ul>",
    "grammar": "<div style='line-height: 1.6;'><p><strong>⭐ Tính từ Chỉ Chức vụ Quá khứ (Former) & Cấu trúc Cụm Danh từ Đồng vị (Appositive Phrase)</strong></p><p>Trong các bài đọc tin tức nhân sự hoặc bổ nhiệm Part 5 TOEIC, cụm đồng vị thường được sử dụng để cung cấp lý lịch của nhân sự. Thí sinh cần phân biệt rõ cách dùng tính từ <i>former</i> đi kèm chức danh:</p><p style='padding-left: 15px; border-left: 3px solid #ccc;'><code>Subject (Tên người) , FORMER + Title / Position + of + Organization , Main Verb</code><br><code>Ms. Yamada , FORMER + director + of Midlands Chamber... , was appointed...</code></p><table border='1' style='width: 100%; border-collapse: collapse; border-color: #e0e0e0; margin-top: 10px; font-size: 14px;'><thead style='background-color: #f5f5f5; text-align: left;'><tr><th style='padding: 8px;'>Từ loại</th><th style='padding: 8px;'>Từ vựng</th><th style='padding: 8px;'>Chức năng ngữ pháp</th><th style='padding: 8px;'>Ví dụ Collocation TOEIC</th></tr></thead><tbody><tr><td style='padding: 8px; color: #2e7d32;'><strong>Tính từ (Adj)</strong></td><td style='padding: 8px; font-weight: bold; color: #2e7d32;'>former</td><td style='padding: 8px;'>Bổ nghĩa cho Danh từ chỉ chức danh</td><td style='padding: 8px; color: #2e7d32;'><strong>former director</strong> / CEO / president</td></tr><tr><td style='padding: 8px;'>Động từ (Verb)</td><td style='padding: 8px;'>formalize</td><td style='padding: 8px;'>Động từ chính trong câu</td><td style='padding: 8px;'>to <strong>formalize</strong> an agreement</td></tr><tr><td style='padding: 8px;'>Danh từ (Noun)</td><td style='padding: 8px;'>formality</td><td style='padding: 8px;'>Làm Chủ ngữ hoặc Tân ngữ</td><td style='padding: 8px;'>a mere <strong>formality</strong></td></tr><tr><td style='padding: 8px;'>Động từ V-ed</td><td style='padding: 8px;'>formed</td><td style='padding: 8px;'>Dạng bị động / Tính từ bị động</td><td style='padding: 8px;'>a newly <strong>formed</strong> committee</td></tr></tbody></table><p style='margin-top: 10px;'><strong style='color: #e65100;'>🎯 Mẹo làm bài trong 3 giây:</strong> Thấy khoảng trống đứng trước danh từ chỉ chức danh như <i>CEO, manager, director, president</i> $\rightarrow$ Chọn ngay tính từ <strong>former</strong> (nguyên, cựu)!</p></div>",
    "vocab": "<ul style='line-height: 1.6;'><li><strong style='color: #0288d1;'>former director</strong> (n.phr): cựu giám đốc, nguyên giám đốc (Các cụm tương tự: <i>former CEO, former president, former manager</i>).</li><li><strong style='color: #0288d1;'>Chamber of Commerce</strong> (n.phr): Phòng Thương mại (Cơ quan quản lý và hỗ trợ doanh nghiệp).</li><li><strong style='color: #0288d1;'>be appointed to</strong> (v.phr): được bổ nhiệm / chỉ định vào vị trí hoặc tổ chức nào đó (Collocations: <i>appointed to the board, appointed to the committee</i>).</li></ul>",
    "trans": "<div style='line-height: 1.6; padding: 8px; background-color: #f9f9f9; border-left: 4px solid #0288d1;'><p style='margin: 0 0 8px 0;'><strong>Dịch nghĩa gốc:</strong> Bà Yamada, cựu giám đốc Phòng Thương mại Midlands, gần đây đã được bổ nhiệm vào ủy ban thương mại của bang.</p><p style='margin: 0; font-style: italic; color: #555;'><strong>Dịch tự nhiên:</strong> Bà Yamada - nguyên Giám đốc Phòng Thương mại Midlands - vừa chính thức được chỉ định gia nhập Ủy ban Thương mại cấp tiểu bang.</p></div>"
  }
},
